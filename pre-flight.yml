---
# Pre-flight security validation (Play 0)
# Statically imported before provisioning to verify collection integrity,
# raw configuration and identity values on ordinary runs. The verified wrapper
# rejects --start-at-task and skipping always tags; static imports alone cannot
# prevent direct CLI flags from skipping these tasks.
- name: Pre-flight security validation
  hosts: localhost
  become: false
  gather_facts: false

  tasks:
    # CRITICAL: Collection verification runs BEFORE any include_tasks/import_tasks/roles
    # that would parse Python files from collections/. This prevents TOCTOU tampering
    # where an attacker modifies collection files after Makefile verification but
    # before ansible-playbook imports them. Running at task level (after Makefile verify)
    # AND before any imports provides defense-in-depth against both direct ansible-playbook
    # invocations (bypassing Makefile) and process boundary attacks (exec ensures same
    # shell context between verify-collections.sh and ansible-playbook in CI/Makefile).
    - name: SECURITY CRITICAL — Verify collection integrity before any imports
      ansible.builtin.command:
        cmd: scripts/verify-collections.sh
      changed_when: false
      check_mode: false  # always run even in --check mode; collection integrity must be verified
      tags: [always]

    - name: Gather facts for early validation
      ansible.builtin.gather_facts:
      tags: [always]

    - name: Capture real user identity for early checks
      ansible.builtin.set_fact:
        real_user_home: >-
          {{ lookup('pipe', 'python3 -c "import pwd,os; print(pwd.getpwuid(os.getuid()).pw_dir)" 2>/dev/null') | default(lookup('env',
          'HOME'), true) }}
        real_user_id: "{{ lookup('env', 'USER') }}"
      tags: [always]

    - name: Set OS family facts (is_linux, is_macos) for early validation
      ansible.builtin.set_fact:
        is_linux: "{{ ansible_facts['system'] == 'Linux' }}"
        is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"
      tags: [always]

    - name: Set project root for include paths
      ansible.builtin.set_fact:
        common_project_root: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
             | default(playbook_dir, true) }}
      tags: [always]

    - name: Run early pre-flight checks (before any role execution)
      tags: [always]
      block:
        - name: Include pre-flight checks
          ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/pre_flight_checks.yml"

    - name: Run CSB detection early (makes csb_detected available to all subsequent plays)
      when: ansible_facts['system'] | default('Linux') == 'Linux'
      tags: [always]
      block:
        - name: Include CSB detection
          ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb_detect.yml"
