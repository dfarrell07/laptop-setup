---
# Pre-flight security validation (Play 0)
# Statically imported before provisioning to verify collection integrity,
# raw configuration and identity values on ordinary runs. The verified wrapper
# rejects --start-at-task and skipping always tags; static imports alone cannot
# prevent direct CLI flags from skipping these tasks.
- name: Pre-flight security validation
  hosts: localhost
  become: false
  gather_facts: false

  tasks:
    # Collection verification, again, as the first task: it catches tampering with collections/ made before the run
    # and covers direct ansible-playbook invocations that skip the wrapper's check. It is not a guard against a same-uid
    # process changing files during the run: callback plugins are imported before this play starts, and modules are
    # read lazily when a task first uses them.
    - name: SECURITY CRITICAL — Verify collection integrity at the start of the run
      ansible.builtin.command:
        cmd: scripts/verify-collections.sh
      changed_when: false
      check_mode: false  # always run even in --check mode; collection integrity must be verified
      tags: [always]

    - name: Gather facts for early validation
      ansible.builtin.gather_facts:
      tags: [always]

    - name: Capture real user identity for early checks
      ansible.builtin.set_fact:
        real_user_home: >-
          {{ lookup('pipe', 'python3 -I -c "import pwd,os; print(pwd.getpwuid(os.getuid()).pw_dir)" 2>/dev/null') | default(lookup('env',
          'HOME'), true) }}
        real_user_id: "{{ lookup('env', 'USER') }}"
      tags: [always]

    - name: Set OS family facts (is_linux, is_macos) for early validation
      ansible.builtin.set_fact:
        is_linux: "{{ ansible_facts['system'] == 'Linux' }}"
        is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"
      tags: [always]

    - name: Set project root for include paths
      ansible.builtin.set_fact:
        common_project_root: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
             | default(playbook_dir, true) }}
      tags: [always]

    - name: Run early pre-flight checks (before any role execution)
      tags: [always]
      block:
        - name: Include pre-flight checks
          ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/pre_flight_checks.yml"

    - name: Run CSB detection early (makes csb_detected available to all subsequent plays)
      when: ansible_facts['system'] | default('Linux') == 'Linux'
      tags: [always]
      block:
        - name: Include CSB detection
          ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb_detect.yml"

    # fapolicyd-enforcing CSB container tier blocks binaries outside the dnf trust db at runtime. Derive the
    # gate here (always-tagged) so chunk runs (--tags common,<chunk>) that skip the packages role still honour it.
    - name: Disable binary downloads on fapolicyd-enforcing CSB container tier
      ansible.builtin.set_fact:
        packages_install_binaries: "{{ packages_install_binaries | bool and needs_container_tier != 'container' }}"
      tags: [always]

    # Chunk selection (group_vars/all/rollout.yml): a chunk's name is its tag. The make wrapper turns
    # rollout_enable into --skip-tags; this assert makes a run without them fail closed.
    - name: Resolve disabled chunks
      ansible.builtin.set_fact:
        _rollout_disabled: >-
          {{ rollout_catalog | list | difference(rollout_catalog | list if rollout_enable == 'all' else rollout_enable) }}
      tags: [always]

    - name: Chunk selection is valid and every disabled chunk is skipped
      ansible.builtin.assert:
        that:
          - rollout_enable == 'all' or (rollout_enable is sequence and rollout_enable is not string and rollout_enable is not mapping)
          - rollout_enable == 'all' or (rollout_enable | difference(rollout_catalog | list) | length == 0)
          - _rollout_disabled | difference(ansible_skip_tags) | length == 0
        fail_msg: >-
          rollout_enable must be 'all' or a list of known chunks (see scripts/rollout.py status), and every chunk
          that is not enabled must be passed as --skip-tags. Run through make (or scripts/verify-ansible-args.sh),
          which adds them. Disabled: {{ _rollout_disabled | join(', ') }}. Skipped: {{ ansible_skip_tags | join(', ') }}.
      tags: [always]
