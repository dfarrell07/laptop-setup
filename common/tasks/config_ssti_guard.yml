---
# SSTI guard: read config.yml as raw bytes (bypasses include_vars trusted_as_template tagging)
# and reject Jinja2 expressions before loading any user overrides into the play.
# Missing config is allowed; unreadable or invalid config fails closed.
- name: Stat config.yml (a missing file is allowed)
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/config.yml"
  register: _config_yml_stat
  tags: [always]

- name: Slurp config.yml for SSTI guard (raw bytes, bypasses include_vars trusted_as_template)
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/config.yml"
  register: _config_yml_raw
  when: _config_yml_stat.stat.exists
  no_log: true
  tags: [always]

- name: Parse raw config YAML without evaluating template expressions
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(playbook_dir, true) }}/scripts/parse-config.py"
    stdin: "{{ _config_yml_raw.content | b64decode }}"
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  when: _config_yml_stat.stat.exists
  register: _config_parsed
  changed_when: false
  failed_when: false  # reported below: no_log would otherwise hide the parse error
  check_mode: false
  no_log: true
  tags: [always]

# parse-config.py prints only the error type (never config content), so it is safe to show
- name: Fail when config.yml cannot be parsed
  ansible.builtin.fail:
    msg: >-
      config.yml is not valid YAML or not a mapping ({{ _config_parsed.stderr | default('unknown error') | trim }}).
      Find the line with: python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' config.yml
  when:
    - _config_yml_stat.stat.exists
    - _config_parsed.rc | default(0) != 0
  tags: [always]

- name: Cache parsed config.yml dict for SSTI guard assertions
  ansible.builtin.set_fact:
    _config_raw: "{{ (_config_parsed.stdout | from_json) if _config_yml_stat.stat.exists else {} }}"
  no_log: true
  tags: [always]

- name: Comprehensively scan all config.yml values for Jinja2 template expressions (SSTI guard)
  when: _config_raw is defined
  vars:
    # Serialize entire config dict to JSON for unified template marker scanning
    # This detects {{ or {% in ANY value (string, list element, dict value)
    _config_json: "{{ _config_raw | to_nice_json }}"
  ansible.builtin.assert:
    that:
      # Reject {{ and {% in the entire serialized config
      # The combination of both checks prevents SSTI in all config variables
      - ('{' ~ '{') not in _config_json
      - ('{' ~ '%') not in _config_json
    fail_msg: >-
      {% raw -%}
      SECURITY: config.yml contains {{ or {% — Ansible evaluates these as live Jinja2
      templates (trusted_as_template=True), allowing arbitrary code execution as the
      provisioning user (become: true in Play 1).
      Input: the entire config.yml including all strings, list elements, dict values.
      Mechanism: include_vars with trusted_as_template evaluates any {{ }} or {% %} block.
      Example: dotfiles_goprivate="{{lookup('pipe','id')}}" runs id() at provision time.
      Impact: SSTI — arbitrary Ansible code execution with become: true.
      Fix: remove template markers from configuration values. !unsafe tags are supported,
      but do not exempt values from this scan. Literal values without template markers are safe.{%- endraw %}
