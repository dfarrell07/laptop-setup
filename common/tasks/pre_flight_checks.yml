        fail_msg: >-
          SECURITY: packages_subctl_versioned in config.yml contains unsafe version or suffix strings.
          Each version must match semantic versioning (e.g. "0.18.0", "1.2.3-beta").
          Each suffix must be alphanumeric only (e.g. "18", "22").
          These values are interpolated directly into go install commands and file paths;
          spaces or special characters allow argument injection (e.g. "0.18.0 --help" injects the --help flag).
          Invalid entries: {{ _subctl_versioned_entries | rejectattr('version', 'match', _semver_pattern) | list }}.
          Remove spaces and special characters from version and suffix fields.
      tags: [always]

