          - _raw.get('dotfiles_direnv_disable_stdin', 'false') | string | lower in _allowed
        fail_msg: >-
          SECURITY: dotfiles_direnv_strict_env and dotfiles_direnv_disable_stdin in
          config.yml must be plain booleans (true/false/yes/no/on/off/1/0).
          Embedded newlines inject arbitrary keys into direnv.toml [global], allowing
          bash_path override to execute an attacker-controlled shell on every direnv
          evaluation (every cd into a managed directory).

    - name: Assert system_usbguard_extra_rules entries are well-formed (USBGuard injection guard)
      when: _config_yml_raw.content is defined
      vars:
        _raw: "{{ _config_yml_raw.content | b64decode | from_yaml | default({}) }}"
        _usbguard_extra: "{{ _raw.get('system_usbguard_extra_rules', []) }}"
      ansible.builtin.assert:
        that:
          - _usbguard_extra | map('string') | select('search', '\n') | list | length == 0
          - _usbguard_extra | map('string') | reject('match', '^(allow|block|reject)\s+.+') | list | length == 0
        fail_msg: >-
          SECURITY: system_usbguard_extra_rules in config.yml contains invalid entries.
          Each entry must begin with 'allow', 'block', or 'reject' followed by a device
          selector (e.g. 'allow id 1234:5678'). Bare 'allow', 'block', or 'reject' without
          a selector creates a catch-all rule that bypasses ImplicitPolicyTarget=block for
          all subsequent unwhitelisted devices. Entries must not contain embedded newlines
          (YAML block scalars inject multiple rule lines into the rendered rules.conf).
          Invalid entries: {{ _usbguard_extra | map('string') | reject('match', '^(allow|block|reject)\s+.+') | list }}

    - name: Assert system_usbguard_whitelist entries are well-formed (USBGuard injection guard)
      when: _config_yml_raw.content is defined
