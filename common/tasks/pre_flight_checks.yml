---
# Pre-flight checks, included by pre-flight.yml (Play 0) and by site.yml Play 3 (which also
# uses it to load config vars onto the container host). Role-level copies of the per-variable
# validators run at point of use; this file keeps config parsing, vault/identity/SSH-lockout
# checks and the root-sink config-injection guards.
- name: Pre-flight checks (no privilege escalation)
  become: false
  tags: [always]
  block:
    # Defined first: assertions throughout this file gate on it.
    - name: Set molecule context flag
      ansible.builtin.set_fact:
        _pf_is_molecule: "{{ lookup('env', 'MOLECULE_SCENARIO_NAME') != '' }}"

    - name: Scan user config for template injection
      ansible.builtin.include_tasks: config_ssti_guard.yml

    - name: Load configuration
      ansible.builtin.include_vars: default.config.yml

    - name: Load user overrides
      ansible.builtin.include_vars: config.yml
      failed_when: false

    - name: Assert playbook is not running inside a container host (hardening bypass guard)
      ansible.builtin.assert:
        that:
          - not system_is_container or ansible_connection == 'containers.podman.podman'
        fail_msg: >-
          SECURITY: system_is_container is true but ansible_connection is not 'containers.podman.podman'.
          Threat: running make all inside a Podman/Docker container causes system_is_container=true,
          silently skipping the entire hardening stack (SELinux, sysctl, firewall, PAM, auditd, AIDE).
          Input: ansible_connection={{ ansible_connection }}, virtualization_type={{ ansible_facts['virtualization_type'] |
          default('unknown') }}.
          Mechanism: system_is_container guards in roles/system/tasks/*.yml skip ~25 hardening sub-tasks when true.
          Example: podman run --privileged fedora:40 bash; make all — play succeeds, zero hardening applied.
          Impact: machine appears fully provisioned but carries no OS hardening.
          Fix: run make all on a bare-metal host, VM, or WSL target — not from inside a container.

    - name: SECURITY CRITICAL — Block vault.yml encryption with weak vault-pass.sh stub
      block:
        - name: Check if vault-pass.sh contains hardcoded CHANGE_ME placeholder
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/scripts/vault-pass.sh"
          register: _vault_pass_sh
          failed_when: false
          no_log: true

        - name: Check if vault.yml exists and may be plaintext
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/group_vars/all/vault.yml"
          register: _vault_yml
          failed_when: false
          no_log: true

        - name: Assert vault-pass.sh and vault.yml were readable for the stub check
          ansible.builtin.assert:
            that:
              - _vault_pass_sh.content is defined
              - _vault_yml.content is defined
            fail_msg: >-
              SECURITY: could not read scripts/vault-pass.sh or group_vars/all/vault.yml
              (slurp failed), so the CHANGE_ME stub / plaintext vault checks cannot run.
              Both files ship in this repo; restore them (make bootstrap) and re-run.
              vault-pass.sh: {{ _vault_pass_sh.msg | default('ok') }};
              vault.yml: {{ _vault_yml.msg | default('ok') }}
            quiet: true

        - name: Assert vault.yml is not encrypted with weak password stub
          when:
            - _vault_pass_sh.content is defined
            - _vault_yml.content is defined
          vars:
            _vpass_content: "{{ _vault_pass_sh.content | b64decode }}"
            _vaultfile_first_line: "{{ (_vault_yml.content | b64decode).splitlines() | first | default('') }}"
            _is_encrypted: >-
              {{ _vaultfile_first_line is search('^\$ANSIBLE_VAULT') }}
            _is_stub: >-
              {{ _vpass_content is search("pass='CHANGE_ME'") }}
          ansible.builtin.assert:
            that:
              - >-
                (not _is_stub) or (not _is_encrypted)
            fail_msg: >-
              SECURITY CRITICAL: vault.yml is encrypted with the placeholder password 'CHANGE_ME'.
              Input: scripts/vault-pass.sh contains pass='CHANGE_ME' stub.
              Mechanism: ansible-vault uses vault-pass.sh output as the encryption key; the
              'CHANGE_ME' placeholder produces a trivially guessable key.
              Example: echo CHANGE_ME | ansible-vault decrypt group_vars/all/vault.yml decrypts all secrets.
              Impact: all vault secrets (SSH keys, git keys, registry tokens, GRUB hash) are exposed.
              Fix: run 'make setup-yubikeys' to replace the stub with YubiKey HMAC-SHA1 vault-pass.sh,
              then re-encrypt: 'make vault-edit'. See SECURITY.md for manual vault-pass.sh setup.

    - name: SECURITY — Assert vault-pass.sh and vault.yml have restrictive permissions (distrobox $HOME exposure)
      block:
        - name: Stat vault-pass.sh
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/scripts/vault-pass.sh"
          register: _stat_vault_pass

        - name: Stat vault.yml
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/group_vars/all/vault.yml"
          register: _stat_vault_yml

        - name: Assert vault-pass.sh is mode 0700
          when: _stat_vault_pass.stat.exists
          ansible.builtin.assert:
            that:
              - _stat_vault_pass.stat.mode == '0700'
            fail_msg: >-
              SECURITY: scripts/vault-pass.sh has mode {{ _stat_vault_pass.stat.mode }}, expected 0700.
              The distrobox container mounts $HOME, so any process inside the container can read this
              file and extract the vault password. Restrict it: chmod 0700 scripts/vault-pass.sh.
              The Makefile bootstrap target sets 0700; this check detects accidental permission drift.

        - name: Assert vault.yml is mode 0600
          when: _stat_vault_yml.stat.exists
          ansible.builtin.assert:
            that:
              - _stat_vault_yml.stat.mode == '0600'
            fail_msg: >-
              SECURITY: group_vars/all/vault.yml has mode {{ _stat_vault_yml.stat.mode }}, expected 0600.
              The distrobox container mounts $HOME; mode 0600 limits read access to the owner only.
              Restrict it: chmod 0600 group_vars/all/vault.yml.

    - name: Assert ssh_port in config.yml is a plain decimal port number (sshd injection guard)
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('ssh_port', 722) | int >= 1
          - _raw.get('ssh_port', 722) | int <= 65535
          - _raw.get('ssh_port', 722) | int != 22
        fail_msg: >-
          SECURITY: ssh_port in config.yml must be a plain decimal integer (1-65535) and must not be 22.
          Threat: setting ssh_port: 22 silently removes the port-obscurity layer, exposing hardened sshd
          to direct internet scanning and automated credential-stuffing on the standard SSH port.
          Input: ssh_port={{ _raw.get('ssh_port', 722) }} in config.yml.
          Mechanism: the SELinux relabeling block in sshd.yml is gated `when: ssh_port | int != 22`
          and silently skips; sshd.socket masking leaves the standard port-22 path unchanged.
          Impact: all auth hardening remains intact but port-obscurity is lost without operator awareness.
          Fix: use a non-standard port (default 722). If port 22 is intentionally required, document the
          decision and remove this assertion — do not silently accept the reduced security posture.

    - name: Assert system_selinux_policy is an allowlisted value (SELinux policy weakening guard)
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('system_selinux_policy', 'targeted') in ['targeted', 'strict']
        fail_msg: >-
          SECURITY: system_selinux_policy in config.yml must be 'targeted' or 'strict'.
          Threat: setting system_selinux_policy: minimum applies near-permissive MAC enforcement.
          Input: system_selinux_policy='{{ _raw.get('system_selinux_policy', 'targeted') }}' in config.yml.
          Mechanism: ansible.posix.selinux applies the named policy; the post-apply assertion in
          hardening_core.yml checks ansible_facts['selinux'].type == system_selinux_policy, so
          'minimum' passes verification while SELinux is effectively near-permissive.
          Impact: SELinux MAC weakened to near-full-permissive with no preflight warning.
          Fix: remove system_selinux_policy from config.yml (defaults to 'targeted'), or
          set it to one of the allowlisted values: 'targeted', 'strict'.

    - name: Assert system_tmout in config.yml contains only safe digits (shell injection guard)
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('system_tmout', '0') | string is match('^[0-9]*$')
        fail_msg: >-
          SECURITY: system_tmout in config.yml must be a non-negative integer (seconds).
          This value is rendered verbatim into /etc/profile.d/tmout.sh, /etc/bash.bashrc,
          /etc/zshrc, and /etc/zsh/zshrc; shell metacharacters allow command injection
          when the shell sources these files on session start. Allowed: zero or a positive
          integer (e.g. 300, 600, 900). No spaces, newlines, or special characters allowed.

    - name: Assert system_umask and system_keymap contain only safe characters (login.defs/vconsole injection guard)
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('system_umask', '027') | string is match('^[0-7]+$')
          - _raw.get('system_keymap', 'us') | string is match('^[a-zA-Z0-9_-]+$')
        fail_msg: >-
          SECURITY: system_umask or system_keymap in config.yml contains unsafe characters.
          system_umask is rendered into /etc/login.defs with grep -F matching; regex
          metacharacters (.*+?[]{}()^$|) embedded in the value can escape literal matching.
          system_keymap is rendered into /etc/vconsole.conf; shell metacharacters allow
          injection of arbitrary configuration directives.
          Allowed: system_umask must be octal digits (0-7, e.g. 027, 077, 022);
          system_keymap must be alphanumeric, hyphen, or underscore (e.g. us, en_US, dvorak).

    - name: Assert system_sudo_timestamp_timeout is an integer in [0, 60] (sudoers injection guard)
      ansible.builtin.assert:
        that:
          - _config_raw.get('system_sudo_timestamp_timeout', 15) | string is match('^[0-9]+$')
          - _config_raw.get('system_sudo_timestamp_timeout', 15) | int <= 60
        fail_msg: >-
          SECURITY: system_sudo_timestamp_timeout in config.yml must be an integer in [0, 60].
          Input: system_sudo_timestamp_timeout='{{ _config_raw.get("system_sudo_timestamp_timeout", 15) }}' in config.yml.
          Mechanism: the value is rendered verbatim into /etc/sudoers.d/99-hardening as
          'Defaults timestamp_timeout=<value>'; non-integer or out-of-range values break sudoers
          syntax (visudo -cf rejects the file) or produce unexpected sudo cache behavior.
          Example: '15\nDefaults !authenticate' disables sudo password checks entirely.
          Impact: sudoers parse failure (sudo unusable) or authentication bypass.
          Fix: use a plain integer 0-60 (e.g., 0 for re-auth on every sudo, 15 for default).

    - name: Assert system_core_pattern contains only safe characters (sysctl VALUE injection guard)
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          # system_core_pattern is a sysctl VALUE, not a key; blocks newlines and shell metacharacters.
          # Pipe-based coredump handlers (e.g. '|/usr/lib/systemd/systemd-coredump ...') are reserved
          # for role defaults only and must not be overridden via config.yml — pipe exec runs as root.
          - _raw.get('system_core_pattern', '') | string is match('^[a-zA-Z0-9/_.%-]*$')
        fail_msg: >-
          SECURITY: system_core_pattern in config.yml contains unsafe characters or a pipe handler.
          Threat: kernel.core_pattern with a leading pipe ('|') causes the kernel to exec the named
          binary as root on every process crash — a pipe value in config.yml enables an RCE vector.
          Input: system_core_pattern value supplied in config.yml.
          Mechanism: preflight validates the value before sysctl.yml deploys kernel.core_pattern;
          pipe characters are now blocked because pipe-exec handlers run as root at crash time.
          Example: system_core_pattern: '|/malicious/handler' would exec that binary as root.
          Impact: arbitrary root code execution triggered by any process crash on the system.
          Fix: remove system_core_pattern from config.yml (role default is safe) or use a plain
          path without a leading pipe (e.g. '/var/lib/systemd/coredump/core'). No spaces, newlines,
          shell metacharacters, or pipe characters are permitted in config.yml overrides.

    - name: Assert system_ssh_rekey_limit in config.yml has safe format (sshd config injection guard)
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('system_ssh_rekey_limit', '1G 1h') | string is match('^[0-9]+[KMG]?( [0-9]+[smhdw])?$|^(none|default)$')
        fail_msg: >-
          SECURITY: system_ssh_rekey_limit in config.yml contains unsafe characters.
          This value is rendered into RekeyLimit in sshd_config.d/00-hardening.conf;
          embedded newlines inject arbitrary sshd directives and can silently override
          hardened settings such as Ciphers or GSSAPIAuthentication.
          Allowed: '<bytes>[K|M|G] [time[s|m|h|d|w]]' (e.g. '1G 1h'), 'none', or 'default'.
          No spaces, letters, or punctuation other than the unit suffixes are permitted.

    - name: Assert SSH integer vars contain only plain non-negative integers (sshd injection guard)
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('system_ssh_max_sessions', '10') | string is match('^[0-9]+$')
          - _raw.get('system_ssh_client_alive_interval', '300') | string is match('^[0-9]+$')
          - _raw.get('system_ssh_client_alive_count_max', '2') | string is match('^[0-9]+$')
          - _raw.get('system_ssh_unused_connection_timeout', '600') | string is match('^[0-9]*$')
        fail_msg: >-
          SECURITY: system_ssh_max_sessions, system_ssh_client_alive_interval,
          system_ssh_client_alive_count_max, or system_ssh_unused_connection_timeout
          in config.yml must be a plain non-negative integer. Newlines inject arbitrary
          directives into sshd_config.d/00-hardening.conf; sshd -t does not catch
          semantically valid injected directives, so the rescue block will not remove
          the file. Remove any non-digit characters from the value.

    - name: Assert SSH algorithm vars contain only safe characters (sshd injection guard)
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('ssh_host_key_algorithms', 'ssh-ed25519') | string is match('^[a-zA-Z0-9@.,_-]+$')
          - _raw.get('ssh_ciphers', '') | string is match('^[a-zA-Z0-9@.,_-]*$')
          - _raw.get('ssh_macs', '') | string is match('^[a-zA-Z0-9@.,_-]*$')
          - _raw.get('ssh_kex_algorithms', '') | string is match('^[a-zA-Z0-9@.,_-]*$')
          - _raw.get('ssh_pubkey_accepted_algorithms', []) | map('string') | join(',') is match('^[a-zA-Z0-9@.,_-]*$')
        fail_msg: >-
          SECURITY: ssh_host_key_algorithms, ssh_ciphers, ssh_macs, ssh_kex_algorithms, or
          ssh_pubkey_accepted_algorithms in config.yml contains unsafe characters. These values
          are rendered verbatim into HostKeyAlgorithms, Ciphers, MACs, KexAlgorithms, and
          PubkeyAcceptedAlgorithms in sshd_config.d/00-hardening.conf; embedded newlines inject
          arbitrary sshd directives before GSSAPIAuthentication no and AllowUsers, overriding
          hardened settings. sshd -t does not catch semantically valid injected duplicates, so
          the rescue block will not remove the file.
          Allowed: alphanumeric, @, dot, comma, underscore, hyphen (algorithm name characters).

    - name: Assert system_bluetooth_* vars contain no newlines (BlueZ config injection guard)
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('system_bluetooth_name', 'Bluetooth') | string is not search('\n')
          - _raw.get('system_bluetooth_privacy', 'device') | string is not search('\n')
        fail_msg: >-
          SECURITY: system_bluetooth_name or system_bluetooth_privacy in config.yml
          contains embedded newlines. These values are rendered verbatim into
          /etc/bluetooth/main.conf via lineinfile; embedded newlines inject arbitrary
          BlueZ directives that can override hardened settings. For example, embedding
          '\nPrivacy = off' in system_bluetooth_name injects an additional Privacy line
          that overrides the hardened 'Privacy = device' setting (BlueZ uses last-value-wins
          semantics for duplicate keys). Allowed: any printable characters except newlines
          (alphanumeric, spaces, hyphens, underscores are typical for device names).
          Disallowed: embedded literal newlines from YAML block/folded scalars.

    - name: Assert system_chrony_* vars in config.yml contain only safe characters (chrony.conf injection guard)
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('system_chrony_logdir', '') | string is match('^[a-zA-Z0-9/._-]*$')
          - _raw.get('system_chrony_driftfile', '') | string is match('^[a-zA-Z0-9/._-]*$')
          - _raw.get('system_chrony_ntsdumpdir', '') | string is match('^[a-zA-Z0-9/._-]*$')
          - _raw.get('system_chrony_leapsecmode', '') | string is match('^[a-zA-Z0-9-]*$')
          - _raw.get('system_chrony_leapseclist', '') | string is match('^[a-zA-Z0-9/._-]*$')
          - _raw.get('system_chrony_minsources', '') | string is match('^[0-9]*$')
        fail_msg: >-
          SECURITY: system_chrony_logdir, system_chrony_driftfile, system_chrony_ntsdumpdir,
          system_chrony_leapsecmode, system_chrony_leapseclist,
          or system_chrony_minsources in config.yml contains unsafe characters. These values
          are rendered verbatim into /etc/chrony/chrony.conf (Debian) or /etc/chrony.conf
          (Fedora); embedded newlines can inject arbitrary chrony directives (e.g. run-shell
          for RCE). Allowed: alphanumeric, dot, slash, underscore, hyphen (paths); 0-9
          (minsources). nts_servers, fallback_pool, makestep and authselectmode are validated
          in the play-namespace block.

    - name: Assert system_chrony_nts_servers override requires explicit trust acknowledgement
      when:
        - _config_yml_raw.content is defined
        - _config_raw.get('system_chrony_nts_servers') is not none
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('system_chrony_nts_servers_confirmed', false) | bool
        fail_msg: >-
          SECURITY: system_chrony_nts_servers is set in config.yml but
          system_chrony_nts_servers_confirmed is not true. NTS servers are clock
          trust anchors: with authselectmode=require, a rogue entry fully controls
          the system clock with no unauthenticated fallback. Review your NTS server
          list, then set in config.yml: system_chrony_nts_servers_confirmed: true

    - name: Assert system_chrony_authselectmode prefer requires explicit acknowledgement
      when:
        - _config_yml_raw.content is defined
        - _config_raw.get('system_chrony_authselectmode', '') == 'prefer'
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('system_chrony_authselectmode_prefer_confirmed', false) | bool
        fail_msg: >-
          SECURITY: system_chrony_authselectmode=prefer is set in config.yml but
          system_chrony_authselectmode_prefer_confirmed is not true. prefer mode allows
          silent fallback to unauthenticated NTP when TCP 4460 (NTS-KE) is blocked,
          enabling on-path clock manipulation (Kerberos/TLS replay, cert expiry bypass).
          If prefer is intentional (e.g. restricted network where 4460 is blocked), also
          set in config.yml: system_chrony_authselectmode_prefer_confirmed: true

    - name: Assert system_aide_monitoring_etc_paths contains only safe path characters (AIDE monitoring bypass guard)
      vars:
        _aide_paths: "{{ _config_raw.get('system_aide_monitoring_etc_paths', []) }}"
        _unsafe_entries: "{{ _aide_paths | map('string') | select('search', '[^a-zA-Z0-9._/-]') | list }}"
      ansible.builtin.assert:
        that:
          - _unsafe_entries | length == 0
        fail_msg: >-
          SECURITY: system_aide_monitoring_etc_paths in config.yml contains entries with
          unsafe characters. Each path must contain only alphanumeric characters, dots,
          underscores, hyphens, and slashes (standard filesystem path characters).
          Regex metacharacters like brackets, parentheses, asterisks, plus signs, pipes, or
          carets can break the AIDE lineinfile regexp pattern, bypassing integrity monitoring
          for critical system files.
          Example attack: system_aide_monitoring_etc_paths: ['/etc/[sshd_config]'] converts
          to regexp '^/etc/[sshd_config][$]?\\s' where [sshd_config] becomes a character class
          matching any single character, not the literal string. The regexp fails to match
          '/etc/sshd_config NORMAL', preventing the monitoring entry from being inserted.
          Use standard filesystem paths only (e.g., /etc/ssh/sshd_config.d, not /etc/[sshd_config]).
          Unsafe entries found: {{ _unsafe_entries }}.

    # NOTE: vault assertion is NOT gated by _pf_is_molecule — catching vault_* in config.yml is always an error, even in CI.
    # NOTE: This block is unconditional (no _pf_vault_asserted is not defined guard) so that
    # passing -e _pf_vault_asserted=true cannot bypass these security assertions. The guard was
    # removed because extra-vars (precedence 22) can pre-define any simple variable, silently
    # skipping all four checks below. verify-ansible-args.sh rejects _pf_vault_asserted= on the
    # CLI as a first line of defence; this unconditional block is the Ansible-layer backstop.
    - name: Assert config.yml vault and secret-key constraints
      block:
        - name: Assert config.yml contains no vault_* keys
          ansible.builtin.assert:
            that: >-
              (_config_raw.keys() | select('match', 'vault_') | list | length == 0)
            fail_msg: >-
              config.yml must not define vault_* variables — include_vars outranks
              group_vars (precedence 18 vs 4-5), so these keys silently shadow
              vault.yml: {{ (_config_raw | default({})).keys() | select('match', 'vault_') | list }}

        - name: Assert config.yml contains no indirection-layer secret keys
          ansible.builtin.assert:
            # Update this list when new direct-secret keys are added to group_vars/all/vault.yml
            that: >-
              (_config_raw.keys() | select('in', ['ssh_auth_key', 'ssh_auth_key_pub',
               'ssh_signing_key', 'ssh_signing_key_pub', 'rh_git_key',
               'notes_transcrypt_password', 'registry_tokens', 'system_grub_password_hash']) | list | length == 0)
            fail_msg: >-
              config.yml must not define these indirection-layer keys — include_vars
              outranks group_vars/all/vars.yml (precedence 18 vs 4-5), silently
              bypassing vault for: {{ (_config_raw | default({})).keys()
              | select('in', ['ssh_auth_key', 'ssh_auth_key_pub', 'ssh_signing_key',
              'ssh_signing_key_pub', 'rh_git_key', 'notes_transcrypt_password',
              'registry_tokens', 'system_grub_password_hash']) | list }}. Use group_vars/all/vault.yml for these secrets instead.
              (ssh_git_signing_pubkey is exempt — it is a documented config.yml override.)

        - name: Assert config.yml contains no security-policy key overrides
          ansible.builtin.assert:
            that: >-
              (_config_raw.keys() | select('in', ['claude_deny_sensitive',
               'claude_sandbox_config', 'claude_deny_write_only']) | list | length == 0)
            fail_msg: >-
              config.yml must not override claude_deny_sensitive, claude_sandbox_config,
              or claude_deny_write_only — these variables control the Claude settings.json
              deny-list and sandbox policy. include_vars (precedence 18) outranks role defaults
              (precedence 2), so defining them in config.yml silently empties deny-lists or
              degrades sandbox enforcement. Remove them from config.yml; set them in
              roles/claude/defaults/main.yml if policy change is intentional.

        - name: Assert redhat_splunk_nologin_shell is a non-login shell (CIS 5.6)
          when: "'redhat_splunk_nologin_shell' in (_config_raw | default({}))"
          ansible.builtin.assert:
            that:
              - redhat_splunk_nologin_shell in ['/sbin/nologin', '/usr/sbin/nologin', '/bin/false']
            fail_msg: >-
              SECURITY: redhat_splunk_nologin_shell is set to '{{ redhat_splunk_nologin_shell }}'
              in config.yml. This variable controls the shell assigned to the splunk service account
              (CIS Benchmark 5.6). It must be a non-login shell. Allowed values:
              /sbin/nologin, /usr/sbin/nologin, /bin/false.
              Setting it to an interactive shell (e.g. /bin/bash) defeats CIS 5.6 hardening and
              leaves the splunk service account available for interactive login.
              Remove redhat_splunk_nologin_shell from config.yml (the default /sbin/nologin is
              correct for all supported platforms) or set it to one of the allowed values.

    # Catches user typos — in normal operation profile is always 'work' or 'personal'
    - name: Assert profile is a valid value
      ansible.builtin.assert:
        that: profile in ['work', 'personal']
        fail_msg: "profile must be 'work' or 'personal'; got '{{ profile }}'."

    # Validate critical security variables in the PLAY NAMESPACE (after -e overrides applied)
    # This complements slurp-based file validation by catching -e override attacks that bypass file checks
    # NOTE: This block has no condition guard — assertions ALWAYS run to prevent bypass attacks
    - name: Validate gitconfig/ssh_config vars in play namespace (catch -e overrides)
      block:
        - name: Assert identity vars are not CHANGE_ME placeholder (play namespace catch)
          ansible.builtin.assert:
            that:
              - (dotfiles_user_name | default('CHANGE_ME') != 'CHANGE_ME') and (dotfiles_user_name | default('') | length > 0)
              - (dotfiles_github_user | default('CHANGE_ME') != 'CHANGE_ME') and (dotfiles_github_user | default('') | length > 0)
              - >-
                (dotfiles_user_email_personal | default('CHANGE_ME') != 'CHANGE_ME') and
                (dotfiles_user_email_personal | default('') | length > 0)
            fail_msg: >-
              SECURITY: One or more identity placeholder values (CHANGE_ME) detected in the
              play namespace. These critical variables were not configured in config.yml:
              dotfiles_user_name={{ dotfiles_user_name | default('NOTSET') }},
              dotfiles_github_user={{ dotfiles_github_user | default('NOTSET') }},
              dotfiles_user_email_personal={{ dotfiles_user_email_personal | default('NOTSET') }}.
              This is a critical security catch-all; git commits will be attributed to
              'CHANGE_ME' and email notifications will go to wrong addresses. This assertion
              should have been caught in site.yml Play 2 pre_tasks. If you see this error,
              the critical assertion in site.yml may have been removed or replaced.
              To fix: Set all three variables in config.yml to actual values before running provisioning.

        - name: Assert system_timezone is not CHANGE_ME placeholder (play namespace catch)
          ansible.builtin.assert:
            that:
              - system_timezone | default('CHANGE_ME') != 'CHANGE_ME'
              - system_timezone | default('') | length > 0
            fail_msg: >-
              SECURITY: system_timezone is empty or still the CHANGE_ME placeholder in the
              play namespace. Set system_timezone in config.yml before running make all.
              Run 'timedatectl list-timezones' to find your zone, then add
              system_timezone: <zone> to config.yml. This unconditional check prevents
              -e _pf_is_molecule=true from bypassing the gated assertion.
          when:
            - ansible_facts['system'] != 'Darwin'  # the system role (timedatectl) never runs on macOS

        - name: Assert USBGuard whitelist/extra_rules in play namespace are well-formed
            (USBGuard injection guard)
          vars:
            _wl_invalid: >-
              {{ system_usbguard_whitelist | default([]) | map('string')
              | reject('match', '^(allow|block|reject)\s+.+') | list }}
            _er_invalid: >-
              {{ system_usbguard_extra_rules | default([]) | map('string')
              | reject('match', '^(allow|block|reject)\s+.+') | list }}
          ansible.builtin.assert:
            that:
              - system_usbguard_whitelist | default([]) | map('string') | select('search', '\n') | list | length == 0
              - system_usbguard_extra_rules | default([]) | map('string') | select('search', '\n') | list | length == 0
              - _wl_invalid | length == 0
              - _er_invalid | length == 0
            fail_msg: >-
              SECURITY: USBGuard rules in the play namespace are malformed:
              system_usbguard_whitelist={{ system_usbguard_whitelist | default([]) }},
              system_usbguard_extra_rules={{ system_usbguard_extra_rules | default([]) }}.

              Embedded newlines allow INI directive injection into /etc/usbguard/rules.conf,
              bypassing ImplicitPolicyTarget=block. Newline-injected entries become separate
              rules that can allow unwhitelisted devices.

              Bare 'allow', 'block', or 'reject' without a device selector creates a catch-all
              rule that allows ALL unwhitelisted devices. Each rule must include a selector
              (e.g. 'allow id 1234:5678', 'allow serial "abc123"').

              Invalid whitelist entries: {{ _wl_invalid }}.
              Invalid extra_rules entries: {{ _er_invalid }}.

        - name: Assert DNS server/domain vars in play namespace contain only safe characters (-e override guard)
          ansible.builtin.assert:
            that:
              - system_dns_primary | default('1.1.1.1') | string is match('^[a-zA-Z0-9:./,# -]*$')
              - system_dns_fallback | default('9.9.9.9#dns.quad9.net') | string is match('^[a-zA-Z0-9:./,# -]*$')
              - system_dns_domains | default('~.') | string is match('^[a-zA-Z0-9:.~ -]*$')
            fail_msg: >-
              SECURITY: system_dns_primary, system_dns_fallback, or system_dns_domains in the play
              namespace contains unsafe characters (possibly set via -e flag, bypassing config.yml
              pre-flight validation). These values are rendered verbatim into
              /etc/systemd/resolved.conf.d/99-dot.conf; characters outside the allowed set can
              inject arbitrary systemd-resolved directives or redirect DNS resolution to an
              attacker-controlled server. Allowed: alphanumeric, colon, dot, slash, hash, comma,
              hyphen (DNS server addresses with optional #hostname SNI hint and FQDN domains;
              e.g. 1.1.1.1#cloudflare-dns.com, 2606:4700:4700::1111, ~., example.com).
              Forbidden: newlines, spaces, square brackets, parentheses, semicolons, and other
              INI metacharacters. Current values:
              system_dns_primary={{ system_dns_primary | default('DEFAULT') }},
              system_dns_fallback={{ system_dns_fallback | default('DEFAULT') }},
              system_dns_domains={{ system_dns_domains | default('DEFAULT') }}.

        - name: Assert system_resolved_llmnr and system_resolved_multicast_dns are valid enums
          ansible.builtin.assert:
            that:
              - system_resolved_llmnr | default('no') | string | lower in ['yes', 'no', 'resolve']
              - system_resolved_multicast_dns | default('no') | string | lower in ['yes', 'no', 'resolve']
            fail_msg: >-
              SECURITY: system_resolved_llmnr or system_resolved_multicast_dns in the play namespace
              has an invalid value (possibly set via -e flag, bypassing config.yml pre-flight
              validation). Threat: invalid value writes a malformed 98-llmnr.conf, leaving LLMNR
              and mDNS in an undefined state (CIS hardening bypass). Allowed values for both:
              yes, no, resolve. Current values:
              system_resolved_llmnr={{ system_resolved_llmnr | default('DEFAULT') }},
              system_resolved_multicast_dns={{ system_resolved_multicast_dns | default('DEFAULT') }}.

    - name: Non-molecule pre-flight assertions
      block:
        - name: Assert work identity vars are not CHANGE_ME placeholders
          when: profile == 'work'
          ansible.builtin.assert:
            that:
              - dotfiles_user_email_work != 'CHANGE_ME'
              - dotfiles_user_email_work | length > 0
            fail_msg: >-
              Set dotfiles_user_email_work in config.yml before running make all.
              The value is empty or still has the 'CHANGE_ME' placeholder.
              Without it, git commits to work repos use the wrong email.
              If you are using a personal profile, set `profile: personal` in config.yml to bypass this check.

        - name: Assert desktop_environment is a valid value
          ansible.builtin.assert:
            that: desktop_environment in ['sway', 'i3', 'gnome', 'aerospace', 'auto']
            fail_msg: >-
              desktop_environment must be one of: sway, i3, gnome, aerospace (macOS), auto.
              Got: '{{ desktop_environment }}'.
              {% if desktop_environment == 'CHANGE_ME' %}This is the CHANGE_ME sentinel — set sway, i3, or gnome in
              config.yml.{% else %}Check config.yml for typos.{% endif %}

    - name: Read existing authorized_keys for an ed25519 bootstrap key
      when:
        - is_linux
      ansible.builtin.slurp:
        src: "{{ real_user_home | trim }}/.ssh/authorized_keys"
      register: _pf_authorized_keys
      failed_when: false

    - name: Determine whether hardened sshd will accept any key
      when:
        - is_linux
      ansible.builtin.set_fact:
        # Fix option 2 below: a pre-existing ed25519/FIDO2 key keeps SSH usable after hardening
        _pf_ssh_login_ok: >-
          {{ (ssh_auth_key_pub | default('') | trim | length > 0)
             or ((_pf_authorized_keys.content | default('') | b64decode).splitlines()
                 | select('match', '^\s*([^#\s].*\s)?(ssh-ed25519|sk-ssh-ed25519@openssh\.com) ') | list | length > 0)
             or (ssh_port | default(722) | int == 22) }}

    # At the console a keyless sshd only means "no remote SSH yet"; over SSH it strands the session.
    - name: Notice — no SSH login key yet (console run)
      when:
        - is_linux
        - not (_pf_ssh_login_ok | bool)
        - lookup('env', 'SSH_CONNECTION') | length == 0
      ansible.builtin.debug:
        msg: >-
          NOTICE: no ed25519/FIDO2 SSH key is available (vault empty, none in authorized_keys).
          After hardening, sshd accepts no logins until one is added — console login is
          unaffected. Run 'make setup-yubikeys', populate the vault, then 'make ssh system'.

    - name: SECURITY CRITICAL — Block provisioning over SSH when hardening would lock the session out
      when:
        - is_linux
        - lookup('env', 'SSH_CONNECTION') | length > 0
      ansible.builtin.assert:
        that:
          - _pf_ssh_login_ok | bool
        fail_msg: >-
          SECURITY CRITICAL: SSH LOCKOUT RISK — provisioning over SSH blocked (this session would be stranded).
          Input: vault.yml is empty (ssh_auth_key_pub='{{ ssh_auth_key_pub | default("") }}').
          Mechanism: SSHD hardening applies PasswordAuthentication no + SSH port {{ ssh_port | default(722) }}
          + PubkeyAcceptedAlgorithms restricts to ed25519 variants only.
          Impact: After reboot, SSH login impossible — no password auth, existing RSA keys rejected,
          non-standard port. Physical console access required to recover.

          REQUIRED FIX (choose ONE):

          1. Populate vault.yml BEFORE provisioning (RECOMMENDED):
             a. Run: make setup-yubikeys
             b. Populate group_vars/all/vault.yml with vault_ssh_auth_key_pub
                (MUST be ed25519 type: ssh-ed25519, sk-ssh-ed25519@openssh.com, or cert variants)
             c. Encrypt: ansible-vault encrypt group_vars/all/vault.yml
             d. Run: make all

          2. Bootstrap at local console (temporary workaround):
             a. Generate ed25519 key: ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519_local
             b. Replace authorized_keys: cat ~/.ssh/id_ed25519_local.pub > ~/.ssh/authorized_keys
             c. Run: make all (at console, NOT over SSH)
             d. Reboot (SSH will work with ed25519 key on port {{ ssh_port | default(722) }})
             e. Later: populate vault and re-provision to replace bootstrap key

          3. Disable SSH hardening (NOT RECOMMENDED):
             Add to config.yml: ssh_port: 22
             WARNING: This removes port-obscurity layer and is NOT a secure long-term solution.

          Current state:
          - ssh_auth_key_pub: {{ 'EMPTY' if (ssh_auth_key_pub | default('') | trim | length == 0) else 'POPULATED' }}
          - ssh_port: {{ ssh_port | default(722) }}
          - PasswordAuthentication will be: no
          - PubkeyAcceptedAlgorithms will be: {{ ssh_pubkey_accepted_algorithms | default(['ssh-ed25519*']) | join(',') }}
