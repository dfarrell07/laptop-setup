    - name: Assert ansible.cfg pipelining value is valid boolean (fapolicyd bypass guard)
      when: not _pf_is_molecule
      block:
        - name: Read ansible.cfg for pipelining validation
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/../ansible.cfg"
          register: _ansible_cfg_raw
          failed_when: false
          tags: [always]

        - name: Validate ansible.cfg pipelining matches boolean format
          when: _ansible_cfg_raw.content is defined
          vars:
            _cfg_content: "{{ _ansible_cfg_raw.content | b64decode }}"
            # Extract pipelining line from [defaults] section
            _pipelining_line: >-
              {{ _cfg_content | regex_search('(?m)^\\s*pipelining\\s*=\\s*([^#\\n]+)') }}
            # Normalize: strip whitespace, comments, and convert to lowercase
            _pipelining_normalized: >-
              {{ (_pipelining_line | default('') | regex_replace('.*=\\s*', '')
              | regex_replace('\\s*#.*', '')
              | regex_replace('^\\s+|\\s+$', '') | lower) }}
          ansible.builtin.assert:
            that:
              - _pipelining_normalized is match('^(true|false|yes|no|on|off|1|0|)$')
            fail_msg: >-
              SECURITY: ansible.cfg pipelining value is malformed or contains invalid
              characters. Valid booleans: true, false, yes, no, on, off, 1, 0
              (case-insensitive). Embedded spaces (e.g., 't rue') bypass preflight checks
              while failing at runtime, causing fapolicyd to block /tmp execution despite
              a successful preflight report. Ensure pipelining uses standard boolean syntax
              without internal spacing. Found: '{{ _pipelining_line | default('not set') }}'.
          tags: [always]

    - name: Assert system_ssh_channel_timeout contains no unsafe characters (sshd injection guard)
      when: _config_raw is defined
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('system_ssh_channel_timeout', '') | string is match('^[a-zA-Z0-9=, *hms]*$')
        fail_msg: >-
          SECURITY: system_ssh_channel_timeout in config.yml contains unsafe characters.
          This value is rendered verbatim into ChannelTimeout in sshd_config.d/00-hardening.conf;
          embedded newlines inject arbitrary sshd directives. sshd -t does not catch
          syntactically valid injected directives (e.g. PermitRootLogin yes), so the
          rescue block would not remove the file.
          Allowed: alphanumeric, equals, comma, space, asterisk, h/m/s time suffixes
          (e.g. "global=1h" or "session=30m direct-tcpip=1h").

    - name: Assert system_resolved_* DNS config vars are safe (systemd conf injection guard)
      when: _config_raw is defined
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('system_resolved_llmnr', 'no') | string in ['yes', 'no', 'resolve']
          - _raw.get('system_resolved_multicast_dns', 'no') | string in ['yes', 'no', 'resolve']
        fail_msg: >-
          SECURITY: system_resolved_llmnr or system_resolved_multicast_dns in config.yml
          contains an invalid value. These control /etc/systemd/resolved.conf.d/98-llmnr.conf
          KEY=VALUE directives; invalid values (including those with embedded newlines)
          are rendered verbatim and bypass systemd parsing safety. systemd.conf uses
          last-wins semantics for duplicate keys, allowing newline injection to override
          hardening (e.g., LLMNR=no followed by LLMNR=yes re-enables LLMNR).
          Allowed values: 'yes', 'no', 'resolve' (listen-only).
          Current values: system_resolved_llmnr={{ _raw.get('system_resolved_llmnr', 'no') }},
          system_resolved_multicast_dns={{ _raw.get('system_resolved_multicast_dns', 'no') }}

    - name: Assert systemd-coredump configuration vars contain only safe values (coredump.conf injection guard)
      when: _config_raw is defined
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('system_coredump_storage', 'external') | string is match('^(none|external|journal)$')
          - _raw.get('system_coredump_process_size_max', '2G') | string is match('^[0-9]+[KMG]?$')
        fail_msg: >-
          SECURITY: system_coredump_storage or system_coredump_process_size_max in config.yml
          contains invalid characters. These values are rendered verbatim into
          /etc/systemd/coredump.conf.d/coredump.conf (INI format); embedded newlines inject
          arbitrary keys (MaxUse, KeepFree, JournalSizeMax, ExternalSizeMax, etc.) that
          override hardened settings and cause disk DoS (unlimited storage, no free-space preservation).
          system_coredump_storage must be one of: none, external, journal.
          system_coredump_process_size_max must be a non-negative integer with optional K/M/G suffix
          (e.g. 2G, 1000M, 0). No spaces, newlines, or other characters allowed.

    - name: Assert SSH algorithm vars contain only safe characters (sshd injection guard)
      when: _config_raw is defined
      vars:
        _raw: "{{ _config_raw }}"
      ansible.builtin.assert:
        that:
          - _raw.get('ssh_host_key_algorithms', 'ssh-ed25519') | string is match('^[a-zA-Z0-9@.,_-]+$')
          - _raw.get('ssh_ciphers', '') | string is match('^[a-zA-Z0-9@.,_-]*$')
          - _raw.get('ssh_macs', '') | string is match('^[a-zA-Z0-9@.,_-]*$')
          - _raw.get('ssh_kex_algorithms', '') | string is match('^[a-zA-Z0-9@.,_-]*$')
          - _raw.get('ssh_pubkey_accepted_algorithms', []) | map('string') | join(',') is match('^[a-zA-Z0-9@.,_-]*$')
        fail_msg: >-
