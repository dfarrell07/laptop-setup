        that:
          - _usbguard_wl | map('string') | select('search', '\n') | list | length == 0
          - _usbguard_wl | map('string') | reject('match', '^(allow|block|reject)\s+.+') | list | length == 0
        fail_msg: >-
          SECURITY: system_usbguard_whitelist in config.yml contains invalid entries.
          Each entry must begin with 'allow', 'block', or 'reject' followed by a device
          selector. Bare catch-all rules and embedded newlines are rejected.
          Invalid entries: {{ _usbguard_wl | map('string') | reject('match', '^(allow|block|reject)\s+.+') | list }}

    - name: Assert container_release and container_image contain only safe characters (distrobox tag injection guard)
      when: _config_yml_raw.content is defined
      vars:
        _raw: "{{ _config_yml_raw.content | b64decode | from_yaml | default({}) }}"
      ansible.builtin.assert:
        that:
          - _raw.get('container_release', '') | string is match('^[a-zA-Z0-9._-]*$')
          - _raw.get('container_image', '') | string is match('^[a-zA-Z0-9:/@._-]*$')
        fail_msg: >-
          SECURITY: container_release or container_image in config.yml contains unsafe
          characters. These values are interpolated directly into distrobox_container_image
          and rendered into distrobox.ini (INI format) and shell commands without additional
          escaping; embedded newlines break INI syntax or shell argument parsing.
          container_release must be alphanumeric/dot/hyphen (e.g. 44, f39, custom).
          container_image must match OCI image reference format (alphanumeric/colon/slash/at/
          dot/hyphen only, no spaces or shell metacharacters). Allowed: alphanumeric, dot,
          underscore, hyphen (container_release); alphanumeric, colon, slash, at, dot,
          hyphen (container_image).

    - name: Assert system_bluetooth_* vars contain no newlines (BlueZ config injection guard)
      when: _config_yml_raw.content is defined
      vars:
        _raw: "{{ _config_yml_raw.content | b64decode | from_yaml | default({}) }}"
      ansible.builtin.assert:
        that:
          - _raw.get('system_bluetooth_name', 'Bluetooth') | string is not search('\n')
          - _raw.get('system_bluetooth_privacy', 'device') | string is not search('\n')
        fail_msg: >-
          SECURITY: system_bluetooth_name or system_bluetooth_privacy in config.yml
          contains embedded newlines. These values are rendered verbatim into
          /etc/bluetooth/main.conf via lineinfile; embedded newlines inject arbitrary
          BlueZ directives that can override hardened settings. For example, embedding
          '\nPrivacy = off' in system_bluetooth_name injects an additional Privacy line
          that overrides the hardened 'Privacy = device' setting (BlueZ uses last-value-wins
          semantics for duplicate keys). Allowed: any printable characters except newlines
          (alphanumeric, spaces, hyphens, underscores are typical for device names).
          Disallowed: embedded literal newlines from YAML block/folded scalars.

    - name: Assert system_chrony_* vars in config.yml contain only safe characters (chrony.conf injection guard)
