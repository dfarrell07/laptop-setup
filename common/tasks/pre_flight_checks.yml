    - name: Assert binary version variables match semantic versioning (URL path injection guard)
      when: _config_yml_raw.content is defined
      vars:
        _raw: "{{ _config_yml_raw.content | b64decode | from_yaml | default({}) }}"
        # Semantic version pattern: major.minor.patch with optional prerelease
        _semver_pattern: '^[0-9]+(\.[0-9]+)*(-[a-zA-Z0-9]+)?$'
        # Critical version variables used in download URLs for kind, helm, kustomize, k9s, etc.
        _version_vars:
          - packages_kind_version
          - packages_helm_version
          - packages_kustomize_version
          - packages_k9s_version
          - packages_transcrypt_version
          - packages_sops_version
          - packages_gitleaks_version
          - packages_actionlint_version
          - packages_zizmor_version
          - packages_operator_sdk_version
          - packages_cosign_version
          - packages_tkn_version
          - packages_ec_version
          - packages_oc_version
          - packages_yamllint_version
          - packages_ansible_lint_version
          - packages_golangci_lint_version
          - packages_gofumpt_version
          - packages_govulncheck_version
          - packages_gci_version
          - packages_gopls_version
          - packages_controller_gen_version
          - packages_stern_version
          - packages_code_generator_version
          - packages_subctl_version
          - packages_aerospace_version
          - packages_krew_bootstrap_version
          - packages_krew_plugin_ctx_version
          - packages_krew_plugin_ns_version
      ansible.builtin.assert:
        that:
          # Each version variable must match semantic versioning pattern or be empty
          - _version_vars | map('extract', _raw) | select('defined') | list |
            map('string') | select() | list |
            reject('match', _semver_pattern) | list | length == 0
        fail_msg: >-
          SECURITY: One or more binary version variables in config.yml do not match
          semantic versioning format (e.g. "1.2.3" or "1.2.3-alpha"). Version variables
          are directly interpolated into download URLs without additional validation. An
          attacker-controlled version string like "0.32.0/../../evil" could perform URL
          path traversal, accessing unintended paths on the same host or exploiting
          upstream path-traversal bugs.
          Allowed pattern: ^[0-9]+(\.[0-9]+)*(-[a-zA-Z0-9]+)?$
          (e.g. "0.32.0", "1.0.0-beta", "2.3.4-rc1")
          Invalid version variables: {{ _version_vars | map('extract', _raw) | select('defined') | list |
          map('string') | select() | list | reject('match', _semver_pattern) | list }}.
          Remove any slashes, double-dots, spaces, or special characters from version overrides in config.yml.
      tags: [always]

