          - _raw.get('system_chrony_minsources', '') | string is match('^[0-9]*$')
          - _raw.get('system_chrony_nts_servers', []) | map('string') | select('search', '[^a-zA-Z0-9._:-]') | list | length == 0
        fail_msg: >-
          SECURITY: system_chrony_logdir, system_chrony_driftfile, system_chrony_ntsdumpdir,
          system_chrony_leapsecmode, system_chrony_makestep, system_chrony_authselectmode,
          system_chrony_leapseclist, system_chrony_dhcp_sourcedir, system_chrony_fallback_pool,
