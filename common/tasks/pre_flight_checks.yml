---
# Shared pre-flight checks included by Play 1 and Play 2.
# Each task carries become: false so the file is safe to include from
# Play 1 (become: true at play level) without privilege escalation.
- name: Pre-flight checks (no privilege escalation)
  become: false
  block:
    - name: Load configuration
      ansible.builtin.include_vars: default.config.yml
      tags: [always]

    - name: Load user overrides
      ansible.builtin.include_vars: config.yml
      failed_when: false
      tags: [always]

    - name: Stat config.yml for parse-failure detection
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/config.yml"
      register: _config_yml_stat
      tags: [always]

    - name: Load user config for vault key inspection
      # Second load into a named dict — include_vars with name: does not populate the play
      # namespace, so this does NOT duplicate the first load. Both loads are required: the
      # first (above) provides overrides to the play namespace; this load provides a dict
      # for the vault_ and secret-key assertions below that need to inspect key names.
      # Note: include_vars resolves 'file: config.yml' relative to the playbook dir (same as
      # the plain 'include_vars: config.yml' above). The stat probe above uses playbook_dir
      # explicitly so both probes agree regardless of the invoker's cwd.
      ansible.builtin.include_vars:
        file: config.yml
        name: _user_config
      failed_when: false
      tags: [always]

    - name: Fail when config.yml exists but could not be parsed
      when:
        - _config_yml_stat.stat.exists
        - _user_config is not defined
      ansible.builtin.fail:
        msg: >-
          config.yml exists but failed to load (YAML syntax error, encoding problem, or unreadable file). Fix the issue
          before re-running. All user overrides were silently dropped.
      tags: [always]

    # SSTI guard: read config.yml as raw bytes (bypasses include_vars trusted_as_template tagging)
    # and check that identity variables do not contain Jinja2 expressions before any template
    # task can trigger lazy evaluation of the injected value.
    - name: Slurp config.yml for SSTI guard (raw bytes, bypasses include_vars trusted_as_template)
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/config.yml"
      register: _config_yml_raw
      failed_when: false
      tags: [always]

    - name: Assert identity vars in config.yml contain no Jinja2 template expressions (SSTI guard)
      when: _config_yml_raw.content is defined
      vars:
        _raw: "{{ _config_yml_raw.content | b64decode | from_yaml | default({}) }}"
      ansible.builtin.assert:
        that:
          - ('{' ~ '{') not in (_raw.get('dotfiles_user_name', '') | string)
          - ('{' ~ '{') not in (_raw.get('dotfiles_user_email_work', '') | string)
          - ('{' ~ '{') not in (_raw.get('dotfiles_user_email_personal', '') | string)
          - ('{' ~ '{') not in (_raw.get('dotfiles_github_user', '') | string)
          - ('{' ~ '{') not in (_raw.get('system_timezone', '') | string)
          - ('{' ~ '{') not in (_raw.get('dotfiles_internal_git_host', '') | string)
          - ('{' ~ '{') not in (_raw.get('dotfiles_laptop_tailscale_host', '') | string)
          - ('{' ~ '{') not in (_raw.get('dotfiles_mac_tailscale_host', '') | string)
          - ('{' ~ '%') not in (_raw.get('dotfiles_user_name', '') | string)
          - ('{' ~ '%') not in (_raw.get('dotfiles_user_email_work', '') | string)
          - ('{' ~ '%') not in (_raw.get('dotfiles_user_email_personal', '') | string)
          - ('{' ~ '%') not in (_raw.get('dotfiles_github_user', '') | string)
          - ('{' ~ '%') not in (_raw.get('system_timezone', '') | string)
          - ('{' ~ '%') not in (_raw.get('dotfiles_internal_git_host', '') | string)
          - ('{' ~ '%') not in (_raw.get('dotfiles_laptop_tailscale_host', '') | string)
          - ('{' ~ '%') not in (_raw.get('dotfiles_mac_tailscale_host', '') | string)
          - ('{' ~ '{') not in (_raw.get('dotfiles_gonosumdb', '') | string)
          - ('{' ~ '%') not in (_raw.get('dotfiles_gonosumdb', '') | string)
          - ('{' ~ '{') not in (_raw.get('dotfiles_goprivate', '') | string)
          - ('{' ~ '%') not in (_raw.get('dotfiles_goprivate', '') | string)
          - ('{' ~ '{') not in (_raw.get('dotfiles_aws_profile', '') | string)
          - ('{' ~ '%') not in (_raw.get('dotfiles_aws_profile', '') | string)
        fail_msg: >-
          SECURITY: config.yml contains a Jinja2 template expression in one or more
          identity variables. Ansible loads these with trusted_as_template=True and
          evaluates them as live templates (SSTI — arbitrary code execution). Use plain
          string values. If the value legitimately contains braces, prefix it with !unsafe
          in config.yml, e.g.: dotfiles_user_name: !unsafe 'Your Name'.
          Checked: dotfiles_user_name, dotfiles_user_email_work, dotfiles_user_email_personal,
          dotfiles_github_user, system_timezone, dotfiles_internal_git_host,
          dotfiles_laptop_tailscale_host, dotfiles_mac_tailscale_host,
          dotfiles_gonosumdb, dotfiles_goprivate, dotfiles_aws_profile.
          Markers checked: '{{' and '{%'.
      tags: [always]

    - name: Assert Go/AWS env vars in config.yml contain only safe characters (shell injection guard)
      when: _config_yml_raw.content is defined
      vars:
        _raw: "{{ _config_yml_raw.content | b64decode | from_yaml | default({}) }}"
      ansible.builtin.assert:
        that:
          - _raw.get('dotfiles_gonosumdb', '') | string is match('^[a-zA-Z0-9.,*/_-]*$')
          - _raw.get('dotfiles_goprivate', '') | string is match('^[a-zA-Z0-9.,*/_-]*$')
          - _raw.get('dotfiles_aws_profile', '') | string is match('^[a-zA-Z0-9_-]*$')
        fail_msg: >-
          SECURITY: dotfiles_gonosumdb, dotfiles_goprivate, or dotfiles_aws_profile in config.yml
          contains unsafe characters. These values are written directly into shell export statements;
          unsafe characters can escape the double-quoted context to inject arbitrary commands.
          Allowed: alphanumeric, dot, comma, asterisk, slash, underscore, hyphen
          (dotfiles_gonosumdb / dotfiles_goprivate); alphanumeric, underscore, hyphen
          (dotfiles_aws_profile).
      tags: [always]

    - name: Assert gitconfig vars in config.yml contain only safe characters (gitconfig injection guard)
      when: _config_yml_raw.content is defined
      vars:
        _raw: "{{ _config_yml_raw.content | b64decode | from_yaml | default({}) }}"
      ansible.builtin.assert:
        that:
          - _raw.get('dotfiles_github_user', '') | string is match('^[a-zA-Z0-9-]*$')
          - _raw.get('dotfiles_internal_git_host', '') | string is match('^[a-zA-Z0-9._-]*$')
        fail_msg: >-
          SECURITY: dotfiles_github_user or dotfiles_internal_git_host in config.yml
          contains unsafe characters. These values are interpolated directly into .gitconfig
          section headers (e.g. [includeIf "gitdir:~/src/<user>/"] and [http "https://<host>"]);
          newlines, quotes, or brackets in the value break out of the section header and allow
          arbitrary gitconfig injection — including setting core.hooksPath to an attacker-controlled
          path, which results in arbitrary code execution on every git operation.
          Allowed: alphanumeric, hyphen (dotfiles_github_user — matches GitHub username rules);
          alphanumeric, dot, underscore, hyphen (dotfiles_internal_git_host — matches hostname rules).
      tags: [always]

    - name: Assert dotfiles_work_src_dirs entries contain only safe characters (shell injection guard)
      when: _config_yml_raw.content is defined
      vars:
        _raw: "{{ _config_yml_raw.content | b64decode | from_yaml | default({}) }}"
        _work_src_dirs: "{{ _raw.get('dotfiles_work_src_dirs', []) }}"
      ansible.builtin.assert:
        that:
          - _work_src_dirs | map('string') | select('search', '[^a-zA-Z0-9_-]') | list | length == 0
        fail_msg: >-
          SECURITY: dotfiles_work_src_dirs contains entries with shell metacharacters.
          Each entry must match ^[a-zA-Z0-9_-]+$ (letters, digits, hyphens, underscores only).
          Dangerous entries: {{ _work_src_dirs | map('string') | select('search', '[^a-zA-Z0-9_-]') | list }}.
          These values are embedded in zshrc as shell case patterns; unsafe characters
          cause command injection when ccp() is called. Use only alphanumeric characters,
          hyphens, and underscores in dotfiles_work_src_dirs (e.g. my-org, not my-org$(id)).
      tags: [always]

    - name: Set molecule context flag
      ansible.builtin.set_fact:
        _pf_is_molecule: "{{ lookup('env', 'MOLECULE_SCENARIO_NAME') != '' }}"
      when: _pf_is_molecule is not defined
      tags: [always]

    # NOTE: vault assertion is NOT gated by _pf_is_molecule — catching vault_* in config.yml is always an error, even in CI.
    - name: Assert config.yml vault and secret-key constraints
      when: _user_config is defined and _pf_vault_asserted is not defined
      block:
        - name: Assert config.yml contains no vault_* keys
          ansible.builtin.assert:
            that: >-
              (_user_config.keys() | select('match', 'vault_') | list | length == 0)
            fail_msg: >-
              config.yml must not define vault_* variables — include_vars outranks
              group_vars (precedence 18 vs 4-5), so these keys silently shadow
              vault.yml: {{ (_user_config | default({})).keys() | select('match', 'vault_') | list }}
          tags: [always]

        - name: Assert config.yml contains no indirection-layer secret keys
          ansible.builtin.assert:
            # Update this list when new direct-secret keys are added to group_vars/all/vault.yml
            that: >-
              (_user_config.keys() | select('in', ['ssh_auth_key', 'ssh_auth_key_pub',
               'ssh_signing_key', 'ssh_signing_key_pub', 'rh_git_key',
               'notes_transcrypt_password', 'registry_tokens']) | list | length == 0)
            fail_msg: >-
              config.yml must not define these indirection-layer keys — include_vars
              outranks group_vars/all/vars.yml (precedence 18 vs 4-5), silently
              bypassing vault for: {{ (_user_config | default({})).keys()
              | select('in', ['ssh_auth_key', 'ssh_auth_key_pub', 'ssh_signing_key',
              'ssh_signing_key_pub', 'rh_git_key', 'notes_transcrypt_password',
              'registry_tokens']) | list }}. Use group_vars/all/vault.yml for these secrets instead.
              (ssh_git_signing_pubkey is exempt — it is a documented config.yml override.)
          tags: [always]

        - name: Assert config.yml contains no security-policy key overrides
          ansible.builtin.assert:
            that: >-
              (_user_config.keys() | select('in', ['claude_deny_sensitive',
               'claude_sandbox_config', 'claude_deny_write_only']) | list | length == 0)
            fail_msg: >-
              config.yml must not override claude_deny_sensitive, claude_sandbox_config,
              or claude_deny_write_only — these variables control the Claude settings.local.json
              deny-list and sandbox policy. include_vars (precedence 18) outranks role defaults
              (precedence 2), so defining them in config.yml silently empties deny-lists or
              degrades sandbox enforcement. Remove them from config.yml; set them in
              roles/claude/defaults/main.yml if policy change is intentional.
          tags: [always]

        - name: Assert redhat_splunk_nologin_shell is a non-login shell when overridden (CIS 5.6 guard)
          when: "'redhat_splunk_nologin_shell' in (_user_config | default({}))"
          ansible.builtin.assert:
            that:
              - redhat_splunk_nologin_shell in ['/sbin/nologin', '/usr/sbin/nologin', '/bin/false']
            fail_msg: >-
              SECURITY: redhat_splunk_nologin_shell is set to '{{ redhat_splunk_nologin_shell }}'
              in config.yml. This variable controls the shell assigned to the splunk service account
              (CIS Benchmark 5.6). It must be a non-login shell. Allowed values:
              /sbin/nologin, /usr/sbin/nologin, /bin/false.
              Setting it to an interactive shell (e.g. /bin/bash) defeats CIS 5.6 hardening and
              leaves the splunk service account available for interactive login.
              Remove redhat_splunk_nologin_shell from config.yml (the default /sbin/nologin is
              correct for all supported platforms) or set it to one of the allowed values.
          tags: [always]

        # set_fact for localhost persists across plays in the same playbook run (Ansible host-var cache).
        # Play 1's include of this file sets _pf_vault_asserted; Play 2's include then sees it defined.
        - name: Set vault asserted flag (suppresses duplicate assertions in Play 2)
          ansible.builtin.set_fact:
            _pf_vault_asserted: true
          tags: [always]

    # Catches user typos — in normal operation profile is always 'work' or 'personal'
    - name: Validate profile value (run once per playbook)
      when: _pf_profile_asserted is not defined
      block:
        - name: Assert profile is a valid value
          ansible.builtin.assert:
            that: profile in ['work', 'personal']
            fail_msg: "profile must be 'work' or 'personal'; got '{{ profile }}'."
          tags: [always]

        # set_fact for localhost persists across plays in the same playbook run (Ansible host-var cache).
        # Play 1's include of this file sets _pf_profile_asserted; Play 2's include then sees it defined.
        - name: Set profile asserted flag (suppresses duplicate assertion in Play 2)
          ansible.builtin.set_fact:
            _pf_profile_asserted: true
          tags: [always]

    - name: Non-molecule pre-flight assertions
      when: not _pf_is_molecule and _pf_assertions_checked is not defined
      block:
        - name: Assert system_timezone is set and not the CHANGE_ME placeholder
          ansible.builtin.assert:
            that:
              - system_timezone != 'CHANGE_ME'
              - system_timezone | length > 0
            fail_msg: >-
              Set system_timezone in config.yml before running make all.
              The current value is empty or still the CHANGE_ME placeholder —
              timedatectl will reject both. Run 'timedatectl list-timezones'
              to find yours, then add system_timezone: <zone> to config.yml.
              If config.yml does not exist, create it from default.config.yml and set system_timezone.
          tags: [always]

        - name: Assert identity vars are not CHANGE_ME placeholders
          ansible.builtin.assert:
            that:
              - dotfiles_github_user != 'CHANGE_ME'
              - dotfiles_github_user | length > 0
              - dotfiles_user_name != 'CHANGE_ME'
              - dotfiles_user_name | length > 0
              - dotfiles_user_email_personal != 'CHANGE_ME'
              - dotfiles_user_email_personal | length > 0
            fail_msg: >-
              Set identity vars in config.yml before running make all.
              The following are empty or still have the 'CHANGE_ME' placeholder:
              {{ [('dotfiles_github_user', dotfiles_github_user | default('CHANGE_ME')),
              ('dotfiles_user_name', dotfiles_user_name | default('CHANGE_ME')),
              ('dotfiles_user_email_personal',
              dotfiles_user_email_personal | default('CHANGE_ME'))]
              | selectattr(1, 'in', ['CHANGE_ME', '']) | map(attribute=0) | list }}.
              Without these, git commits are attributed
              to 'CHANGE_ME', the macOS SSH agent launchd plist will be named incorrectly, and the notes repo clone fails.
              If config.yml does not exist, create it from default.config.yml and populate it.
          tags: [always]

        - name: Assert work identity vars are not CHANGE_ME placeholders
          when: profile == 'work'
          ansible.builtin.assert:
            that:
              - dotfiles_user_email_work != 'CHANGE_ME'
              - dotfiles_user_email_work | length > 0
            fail_msg: >-
              Set dotfiles_user_email_work in config.yml before running make all.
              The value is empty or still has the 'CHANGE_ME' placeholder.
              Without it, git commits to work repos use the wrong email.
              If you are using a personal profile, set `profile: personal` in config.yml to bypass this check.
          tags: [always]

        - name: Assert desktop_environment is a valid value
          ansible.builtin.assert:
            that: desktop_environment in ['sway', 'i3', 'gnome', 'auto']
            fail_msg: >-
              desktop_environment must be one of: sway, i3, gnome, auto.
              Got: '{{ desktop_environment }}'.
              {% if desktop_environment == 'CHANGE_ME' %}This is the CHANGE_ME sentinel — set sway, i3, or gnome in
              config.yml.{% else %}Check config.yml for typos.{% endif %}
          tags: [always]

        # set_fact for localhost persists across plays in the same playbook run (Ansible host-var cache).
        # Play 1's include of this file sets _pf_assertions_checked; Play 2's include then sees it defined.
        - name: Set assertions checked flag (suppresses duplicate assertions in Play 2)
          ansible.builtin.set_fact:
            _pf_assertions_checked: true
          tags: [always]

    - name: Warn and flag when vault stub is not populated
      when:
        - >-
          (vault_ssh_auth_key | default('') | length == 0) or
          (vault_ssh_auth_key_pub | default('') | length == 0) or
          (vault_ssh_signing_key | default('') | length == 0) or
          (vault_ssh_signing_key_pub | default('') | length == 0)
        - _vault_stub_warned is not defined
        - not _pf_is_molecule
      block:
        - name: Warn when vault.yml has not been populated with real secrets
          ansible.builtin.debug:
            msg: >-
              WARNING: vault.yml has not been populated with real secrets
              (one or more of vault_ssh_auth_key, vault_ssh_auth_key_pub,
              vault_ssh_signing_key, vault_ssh_signing_key_pub is missing).
              Secret-backed features will silently skip: SSH key deployment,
              git commit signing, and transcrypt (notes). See CLAUDE.md step 3 to populate
              and encrypt the vault.
          tags: [always]

        # set_fact for localhost persists across plays in the same playbook run (Ansible host-var cache).
        # Play 1's include of this file sets _vault_stub_warned; Play 2's include then sees it defined.
        - name: Set vault stub warned flag (suppresses duplicate warning in Play 2)
          ansible.builtin.set_fact:
            _vault_stub_warned: true
          tags: [always]
