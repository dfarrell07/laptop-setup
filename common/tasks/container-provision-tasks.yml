---
# common/tasks/container-provision-tasks.yml
# Runs inside the dev container via Play 3 (containers.podman.podman connection).
# Distrobox role (Play 2) creates and registers the container via add_host.

# --- Ensure dev packages ---
- name: Ensure development packages installed
  ansible.builtin.dnf:
    name: "{{ distrobox_packages }}"
    state: present
  become: true  # distrobox containers have passwordless sudo; without this dnf5 refuses non-root install
  failed_when: false
  register: container_dnf_result

# --- Binary downloads ---
- name: Create /usr/local/bin if absent
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    mode: "0755"
  become: true

- name: Check if oc is installed
  ansible.builtin.command:
    cmd: /usr/local/bin/oc version --client
  register: container_oc_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Download and install oc + kubectl
  when: container_oc_check.rc != 0
  become: true
  block:
    - name: Fetch OpenShift client SHA256 checksums
      ansible.builtin.uri:
        url: "{{ distrobox_oc_mirror_url }}/{{ distrobox_oc_version }}/sha256sum.txt"
        return_content: true
        timeout: "{{ distrobox_oc_fetch_timeout | default(30) }}"
      register: container_oc_checksums
      retries: "{{ distrobox_oc_fetch_retries | default(3) }}"
      delay: "{{ distrobox_oc_fetch_delay | default(10) }}"
      until: container_oc_checksums.status == 200

    - name: Extract oc tarball checksum
      ansible.builtin.set_fact:
        container_oc_sha256: >-
          {{ container_oc_checksums.content |
             regex_search('^([0-9a-f]{64})\s+openshift-client-linux\.tar\.gz$',
             '\1', multiline=True) | default([]) | first | default('') }}

    - name: Assert oc SHA256 was found
      ansible.builtin.assert:
        that: container_oc_sha256 | length == 64
        fail_msg: "Could not extract SHA256 for openshift-client-linux.tar.gz from checksum file"

    - name: Download OpenShift client tarball
      ansible.builtin.get_url:
        url: "{{ distrobox_oc_mirror_url }}/{{ distrobox_oc_version }}/openshift-client-linux.tar.gz"
        dest: /tmp/openshift-client-linux.tar.gz
        checksum: "sha256:{{ container_oc_sha256 }}"
        mode: "0644"
        timeout: "{{ distrobox_oc_fetch_timeout | default(30) }}"
      register: container_oc_download
      retries: "{{ distrobox_oc_fetch_retries | default(3) }}"
      delay: "{{ distrobox_oc_fetch_delay | default(10) }}"
      until: container_oc_download is succeeded

    - name: Extract oc and kubectl
      ansible.builtin.unarchive:
        src: /tmp/openshift-client-linux.tar.gz
        dest: /usr/local/bin
        remote_src: true
        extra_opts:
          - --no-same-owner
          - oc
          - kubectl

    - name: Set permissions on oc and kubectl
      ansible.builtin.file:
        path: "/usr/local/bin/{{ item }}"
        mode: "0755"
      loop: [oc, kubectl]

    - name: Clean up tarball
      ansible.builtin.file:
        path: /tmp/openshift-client-linux.tar.gz
        state: absent

  rescue:
    - name: Warn that oc + kubectl download failed
      ansible.builtin.debug:
        msg: >-
          WARNING: Failed to download oc/kubectl from the OpenShift mirror
          (network unreachable or mirror unavailable inside the container).
          Play 3 continues — oc will not be available until the next provision run.

    - name: Record that oc was not installed
      ansible.builtin.set_fact:
        container_oc_installed: false

# --- Go tools (not in Fedora repos) ---
- name: Install golangci-lint via go install
  ansible.builtin.command:
    cmd: >-
      go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{ distrobox_golangci_lint_version }}
    creates: "{{ ansible_env.HOME }}/go/bin/golangci-lint"
  environment:
    GOPATH: "{{ ansible_env.HOME }}/go"
    GOBIN: "{{ ansible_env.HOME }}/go/bin"
    GOTOOLCHAIN: auto
  register: container_golangci_lint_result
  failed_when: false

- name: Install subctl via go install (Submariner cluster management)
  ansible.builtin.command:
    cmd: >-
      go install github.com/submariner-io/subctl/cmd/subctl@{{ distrobox_subctl_version }}
    creates: "{{ ansible_env.HOME }}/go/bin/subctl"
  environment:
    GOPATH: "{{ ansible_env.HOME }}/go"
    GOBIN: "{{ ansible_env.HOME }}/go/bin"
    GOTOOLCHAIN: auto
  register: container_subctl_result
  failed_when: false

- name: Report go install failures
  ansible.builtin.debug:
    msg: "go install FAILED (rc={{ item.rc }}): {{ item.stderr | default('no stderr') }}"
  loop:
    - "{{ container_golangci_lint_result }}"
    - "{{ container_subctl_result }}"
  when: item.rc | default(0) != 0

# --- Host-command delegation ---
- name: Check for distrobox-host-exec
  ansible.builtin.stat:
    path: /usr/bin/distrobox-host-exec
  register: container_host_exec

- name: Create distrobox-host-exec symlinks
  ansible.builtin.file:
    src: /usr/bin/distrobox-host-exec
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop: "{{ distrobox_host_exec_commands }}"
  when: container_host_exec.stat.exists
  become: true

- name: Deploy flatpak-spawn wrapper scripts (Toolbx fallback)
  ansible.builtin.copy:
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
    content: |
      #!/bin/sh
      exec flatpak-spawn --host {{ item }} "$@"
  loop: "{{ distrobox_host_exec_commands }}"
  when: not container_host_exec.stat.exists
  become: true

# Export oc and kubectl to the host after they are installed (must happen
# after install, not at init time which runs before Play 3).
# No `creates:` guard: always overwrite so the wrapper points to the current
# container. A stale wrapper from a renamed/old container would otherwise
# silently persist. distrobox-export is idempotent when the container matches.
# distrobox-export is only available inside distrobox containers (not toolbox).
# container_host_exec.stat.exists is true for distrobox (distrobox-host-exec present),
# false for toolbox. Without the guard, this hard-fails Play 3 for toolbox users.
- name: Export oc and kubectl to host
  ansible.builtin.command:
    cmd: "distrobox-export --bin /usr/local/bin/{{ item }} --export-path {{ ansible_env.HOME }}/.local/bin"
  loop: [oc, kubectl]
  changed_when: false
  failed_when: false
  when: container_host_exec.stat.exists and container_oc_installed | default(true)

- name: Export golangci-lint to host (pinned version from container, not dnf)
  ansible.builtin.command:
    cmd: "distrobox-export --bin {{ ansible_env.HOME }}/go/bin/golangci-lint --export-path {{ ansible_env.HOME }}/.local/bin"
  changed_when: false
  failed_when: false
  when: container_host_exec.stat.exists

# --- Verify ---
- name: Confirm Python works
  ansible.builtin.command:
    cmd: python3 --version
  changed_when: false

- name: Confirm oc exported to host shell
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.local/bin/oc"
  register: container_oc_export_stat
  when: container_host_exec.stat.exists and container_oc_installed | default(true)

- name: Assert oc host wrapper exists
  ansible.builtin.assert:
    that: container_oc_export_stat.stat.exists
    fail_msg: >-
      oc was not exported to {{ ansible_env.HOME }}/.local/bin —
      distrobox-export may have failed or the path is not writable.
  when: container_host_exec.stat.exists and container_oc_installed | default(true)

- name: Confirm oc is available (container side)
  ansible.builtin.command:
    cmd: /usr/local/bin/oc version --client
  register: container_oc_version
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Confirm host delegation works
  ansible.builtin.command:
    cmd: /usr/local/bin/podman --version
  register: container_host_podman
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

# yamllint disable rule:line-length
- name: Provisioning summary
  ansible.builtin.debug:
    msg: |
      === Container Provisioning Summary ===
      packages     : {{ 'OK' if container_dnf_result.rc == 0 else 'FAILED (rc=' + (container_dnf_result.rc | string) + ')' }}
      oc client    : {{ container_oc_version.stdout | default('not installed') | trim }}
      oc host wrap : {{ '~/.local/bin/oc present' if container_oc_export_stat.stat.exists | default(false) else ('N/A (oc download failed)' if not (container_oc_installed | default(true)) else ('N/A (Toolbx)' if not container_host_exec.stat.exists else 'MISSING')) }}
      golangci-lint: {{ 'OK' if container_golangci_lint_result.rc | default(-1) == 0 else ('already installed' if container_golangci_lint_result.skipped | default(false) else 'FAILED (rc=' + (container_golangci_lint_result.rc | string) + ')') }}
      subctl       : {{ 'OK' if container_subctl_result.rc | default(-1) == 0 else ('already installed' if container_subctl_result.skipped | default(false) else 'FAILED (rc=' + (container_subctl_result.rc | string) + ')') }}
      Host podman  : {{ container_host_podman.stdout | default('not available') | trim }}
      ======================================
# yamllint enable rule:line-length
