# common/tasks/csb-failure-handler.yml
#
# Reusable handler: append a structured failure record to csb_failures.
# Called via `include_tasks` from rescue blocks.
#
# Required variables (set by the calling rescue block):
#   _csb_task_name      - human-readable task name
#   _csb_action          - suggested remediation action
#   _csb_ticket_summary  - one-line IT ticket summary
#   _csb_ticket_body     - multi-line IT ticket description
#   _csb_role            - role that failed (repos_dnf, packages, system, etc.)
#
# Optional variables (defaults shown):
#   _csb_error           - error message string (e.g. ansible_failed_result.msg | default('unknown error'));
#                          must be a string — truncate() in csb-report.yml will fail if a dict is passed
#   _csb_ticket_priority - IT ticket priority (default: 'Normal'); pass 'High' for
#                          severe failures such as CA cert install or security hardening
#   _csb_ticket_category - IT ticket category (default: 'Software Installation')

---
- name: Validate required CSB failure handler variables
  become: false
  ansible.builtin.assert:
    that:
      - _csb_task_name is defined and _csb_task_name | length > 0
      - _csb_action is defined and _csb_action | length > 0
      - _csb_ticket_summary is defined and _csb_ticket_summary | length > 0
      - _csb_ticket_body is defined and _csb_ticket_body | length > 0
      - _csb_role is defined and _csb_role | length > 0
    fail_msg: >-
      csb-failure-handler.yml: one or more required variables are missing or empty.
      Required: _csb_task_name, _csb_action, _csb_ticket_summary, _csb_ticket_body, _csb_role.

- name: Validate _csb_error is a string when provided
  become: false
  ansible.builtin.assert:
    that:
      - _csb_error is string
    fail_msg: >-
      csb-failure-handler.yml: _csb_error must be a string
      (e.g. ansible_failed_result.msg | default('unknown error')), not a dict.
      truncate() in csb-report.yml will fail if a dict is passed.
  when: _csb_error is defined

- name: Record CSB failure
  become: false
  ansible.builtin.set_fact:
    csb_failures: >-
      {{
        csb_failures | default([]) + [{
          'role': _csb_role,
          'task': _csb_task_name,
          'error': _csb_error | default('unknown error'),
          'timestamp': now(utc=True, fmt='%Y-%m-%dT%H:%M:%SZ'),
          'suggested_action': _csb_action,
          'ticket': {
            'summary': _csb_ticket_summary,
            'body': _csb_ticket_body,
            'priority': _csb_ticket_priority | default('Normal'),
            'category': _csb_ticket_category | default('Software Installation'),
          },
        }]
      }}

- name: "CSB restriction warn: {{ _csb_task_name }}"
  become: false
  ansible.builtin.debug:
    msg: >-
      CSB BLOCKED: {{ _csb_task_name }} in role {{ _csb_role }}.
      Error: {{ _csb_error | default('unknown error') | truncate(200) }}.
      Suggested action: {{ _csb_action }}.
      Continuing playbook execution.
