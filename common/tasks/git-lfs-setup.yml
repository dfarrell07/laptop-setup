---
# Shared git-lfs setup: check availability, register smudge/clean filter drivers.
# Included by roles that clone repos with potential LFS-tracked files.
# Registers: git_lfs_check, git_lfs_configured, git_lfs_install_result

- name: Check git-lfs availability  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: git lfs version
  register: git_lfs_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Warn if git-lfs is not installed
  ansible.builtin.debug:
    msg: >-
      git-lfs is not installed. Repos with LFS-tracked files will clone with
      pointer text files instead of real content.
      Install git-lfs ('{{ is_dnf | ternary('dnf', 'apt') }} install git-lfs') before cloning repos that track large files.
  when: git_lfs_check.rc != 0

- name: Check if git-lfs filter is already registered  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: git config --global filter.lfs.required
  register: git_lfs_configured
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when: git_lfs_check.rc == 0

- name: Register git-lfs smudge/clean filter drivers
  ansible.builtin.command:
    cmd: git lfs install --skip-repo
  register: git_lfs_install_result
  failed_when: false
  changed_when: git_lfs_install_result.rc == 0 and (git_lfs_configured.rc | default(1) != 0)
  when:
    - git_lfs_check.rc == 0
    - git_lfs_configured.rc | default(-1) != 0

- name: Warn if git-lfs filter registration failed
  ansible.builtin.debug:
    msg: >-
      git lfs install --skip-repo exited {{ git_lfs_install_result.rc }} —
      LFS smudge/clean filters may not be registered. Check git-lfs installation.
  when:
    - git_lfs_install_result is not skipped
    - git_lfs_install_result.rc != 0
