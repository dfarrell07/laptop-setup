---
# CSB (Corporate Standard Build) detection tasks.
# All checks run without root (no become). Safe to re-run (idempotent).
# Sets facts consumed by later roles to adapt behavior.

# ---------------------------------------------------------------------------
# 1. OS family and hostname detection
# ---------------------------------------------------------------------------
- name: Detect OS family and CSB hostname suffix
  ansible.builtin.set_fact:
    is_rhel: "{{ ansible_facts['distribution'] == 'RedHat' }}"
    is_fedora: "{{ ansible_facts['distribution'] == 'Fedora' }}"
    is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"
    is_linux: "{{ ansible_facts['system'] == 'Linux' }}"
    is_dnf: "{{ ansible_facts['pkg_mgr'] | default('') in ['dnf', 'dnf5'] }}"
    is_dnf5: "{{ ansible_facts['pkg_mgr'] | default('') == 'dnf5' }}"
    is_apt: "{{ ansible_facts['pkg_mgr'] | default('') == 'apt' }}"
    _is_csb_hostname: "{{ ansible_facts['fqdn'] | default('') is search('\\.csb$') }}"
  become: false

# ---------------------------------------------------------------------------
# 2. fapolicyd
# ---------------------------------------------------------------------------
- name: Check if fapolicyd service exists  # noqa: command-instead-of-module
  # systemctl list-unit-files has no direct module equivalent; service_facts
  # does not expose unit-file presence without loading all services.
  ansible.builtin.command:
    cmd: systemctl list-unit-files fapolicyd.service
  register: _fapolicyd_unit
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run even in check mode to avoid false-negative detection
  become: false
  when: is_linux | bool

- name: Check fapolicyd active state  # noqa: command-instead-of-module
  # service_facts loads all services; command is used for a lightweight
  # single-service probe without the overhead of enumerating every unit.
  ansible.builtin.command:
    cmd: systemctl is-active fapolicyd.service
  register: _fapolicyd_active
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run even in check mode to avoid false-negative detection
  become: false
  when:
    - is_linux | bool
    - _fapolicyd_unit.rc | default(1) == 0 and 'fapolicyd.service' in (_fapolicyd_unit.stdout | default(''))


- name: Check fapolicyd config for permissive mode
  ansible.builtin.command:
    cmd: grep -qiE '^permissive[[:space:]]*=[[:space:]]*1([[:space:]]|#|$)' /etc/fapolicyd/fapolicyd.conf
  register: _fapolicyd_permissive_grep
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run even in check mode to avoid false-negative detection
  become: false
  when:
    - is_linux | bool
    - _fapolicyd_active.rc | default(1) == 0

- name: Set fapolicyd facts
  ansible.builtin.set_fact:
    fapolicyd_installed: >-
      {{ (is_linux | bool) and (_fapolicyd_unit.rc | default(1) == 0) and ("fapolicyd.service" in (_fapolicyd_unit.stdout | default(""))) }}
    fapolicyd_enforcing: >-
      {{
        (is_linux | bool)
        and (_fapolicyd_active.rc | default(1) == 0)
        and (_fapolicyd_permissive_grep.rc | default(1) != 0)
      }}
  become: false
  when: is_linux | bool

# sudo probing and usbguard_running sections removed — facts were only
# consumed in the verbosity=1 debug summary and not by any downstream role task.

# ---------------------------------------------------------------------------
# 3. Internal CA certificates (Red Hat specific)
# ---------------------------------------------------------------------------
- name: Check for Red Hat internal CA certs
  ansible.builtin.stat:
    path: "{{ item }}"
  register: _ca_certs
  loop: "{{ csb_ca_cert_paths }}"
  become: false
  when: is_linux | bool

- name: Set internal CA fact
  ansible.builtin.set_fact:
    internal_ca_present: >-
      {{
        (is_linux | bool)
        and (_ca_certs.results | default([])
             | selectattr('stat.exists')
             | list | length > 0)
      }}
  become: false
  when: is_linux | bool

# ---------------------------------------------------------------------------
# 4. CSB heuristic: RHEL + fapolicyd + internal CA
#    Fedora path: hostname + internal CA only; fapolicyd not required —
#    hybrid Fedora CSB may lack enforcing fapolicyd; csb_restricted handles
#    the container vs. hybrid split downstream.
# ---------------------------------------------------------------------------
- name: Set CSB detected fact
  ansible.builtin.set_fact:
    csb_detected: >-
      {{
        ((is_rhel | bool) and (fapolicyd_installed | bool) and (internal_ca_present | bool))
        or ((is_fedora | bool) and (_is_csb_hostname | bool) and (internal_ca_present | bool))
      }}
  become: false
  when: not (_csb_molecule_force | default(false))

- name: Set CSB restricted fact
  ansible.builtin.set_fact:
    csb_restricted: >-
      {{
        (csb_detected | bool)
        and (fapolicyd_enforcing | bool)
      }}
  become: false
  when: not (_csb_molecule_force | default(false))

# rootless container readiness and toolbox/distrobox detection sections removed —
# podman_rootless_ready was never consumed by any task (distrobox role re-checks subuid/subgid
# independently at task-time); distrobox role detects
# these independently via its own 'which' checks; these facts were unused.

# ---------------------------------------------------------------------------
# 5. Network proxy detection
# ---------------------------------------------------------------------------
- name: Set proxy facts
  ansible.builtin.set_fact:
    network_proxied: >-
      {{
        (ansible_facts['env']['http_proxy'] | default('') | length > 0)
        or (ansible_facts['env']['HTTP_PROXY'] | default('') | length > 0)
        or (ansible_facts['env']['https_proxy'] | default('') | length > 0)
        or (ansible_facts['env']['HTTPS_PROXY'] | default('') | length > 0)
      }}
    proxy_url: >-
      {{
        [
          ansible_facts['env']['https_proxy'] | default(''),
          ansible_facts['env']['HTTPS_PROXY'] | default(''),
          ansible_facts['env']['http_proxy'] | default(''),
          ansible_facts['env']['HTTP_PROXY'] | default('')
        ] | select | first | default('')
      }}
  become: false

# firewall_zone and OSCAP/STIG detection sections removed — all facts
# were only consumed in the verbosity=1 debug summary; no role task used them.

# ---------------------------------------------------------------------------
# 6. Derived: container tier strategy
# ---------------------------------------------------------------------------
# Three tiers from the migration plan:
#   host-only  - unrestricted Fedora/macOS, install everything on host
#   hybrid     - RHEL with full sudo, install basics on host + container for extras
#   container  - CSB restricted, minimal host + full dev env in container
# is_rhel alone triggers hybrid because any RHEL host is treated as IT-managed;
# csb_rhel=false on non-CSB RHEL so rescue blocks do not engage.
- name: Determine container tier
  ansible.builtin.set_fact:
    needs_container_tier: >-
      {{
        'container' if (csb_restricted | bool)
        else ('hybrid' if ((is_rhel | bool) or (csb_detected | bool))
        else 'host-only')
      }}
  become: false
  when: not (_csb_molecule_force | default(false))

- name: Warn on bare RHEL hybrid tier
  ansible.builtin.debug:
    msg: >-
      NOTE: RHEL host without CSB detection — running in hybrid tier.
      Dev tools will be installed in a container rather than the host.
      Pass -e needs_container_tier=host-only on the ansible-playbook command line to override
      (set_fact outranks config.yml; use -e flag, not config.yml).
  become: false
  when:
    - not (_csb_molecule_force | default(false))
    - needs_container_tier == 'hybrid'
    - not (csb_detected | bool)

- name: Inform on Fedora CSB hybrid tier
  ansible.builtin.debug:
    msg: >-
      NOTE: Fedora host with .csb hostname and internal CA detected — running in hybrid tier.
      Dev tools will be installed in a container rather than the host.
      Pass -e needs_container_tier=host-only on the ansible-playbook command line to override
      (set_fact outranks config.yml; use -e flag, not config.yml).
  become: false
  when:
    - not (_csb_molecule_force | default(false))
    - needs_container_tier == 'hybrid'
    - csb_detected | bool
    - is_fedora | bool

- name: Inform on RHEL CSB hybrid tier (fapolicyd not enforcing)
  ansible.builtin.debug:
    msg: >-
      NOTE: RHEL host with CSB detection but fapolicyd not enforcing (stopped or permissive mode) — running in hybrid tier.
      Dev tools will be installed in a container rather than the host.
      Pass -e needs_container_tier=host-only on the ansible-playbook command line to override
      (set_fact outranks config.yml; use -e flag, not config.yml).
  become: false
  when:
    - not (_csb_molecule_force | default(false))
    - needs_container_tier == 'hybrid'
    - csb_detected | bool
    - is_rhel | bool

- name: Inform on CSB container tier (fapolicyd enforcing)
  ansible.builtin.debug:
    msg: >-
      NOTE: CSB host detected with fapolicyd enforcing — running in container tier.
      Full dev environment will be provisioned in a container (run 'make container' after provisioning).
      Run 'systemctl status fapolicyd' and 'grep -i permissive /etc/fapolicyd/fapolicyd.conf' to verify enforcement state.
      Pass -e needs_container_tier=hybrid on the ansible-playbook command line to override
      (set_fact outranks config.yml; use -e flag, not config.yml).
  become: false
  when:
    - not (_csb_molecule_force | default(false))
    - needs_container_tier == 'container'

- name: Derive csb_rhel
  ansible.builtin.set_fact:
    csb_rhel: "{{ (csb_detected | bool) and (is_rhel | bool) }}"
  become: false
  when: not (_csb_molecule_force | default(false))

# ---------------------------------------------------------------------------
# 7. Summary for the user
# ---------------------------------------------------------------------------
- name: CSB detection summary
  ansible.builtin.debug:
    verbosity: 1
    msg: |
      === CSB Detection Summary ===
      OS family          : {{ ansible_facts.distribution | default('unknown') }} {{ ansible_facts.distribution_version | default('') }}
      Is Linux           : {{ is_linux }}
      Is RHEL            : {{ is_rhel }}
      Is Fedora          : {{ is_fedora }}
      Is macOS           : {{ is_macos }}
      Is DNF             : {{ is_dnf }}
      Is DNF5            : {{ is_dnf5 }}
      Is APT             : {{ is_apt }}
      ---
      fapolicyd installed: {{ fapolicyd_installed }}
      fapolicyd enforcing: {{ fapolicyd_enforcing }}
      Internal CA certs  : {{ internal_ca_present }}
      ---
      CSB hostname (.csb): {{ _is_csb_hostname }}
      CSB detected       : {{ csb_detected }}
      CSB restricted     : {{ csb_restricted }}
      CSB RHEL           : {{ csb_rhel }}
      ---
      Proxy URL          : {{ proxy_url | regex_replace('://[^@]+@', '://***@') }}
      ---
      Container tier     : {{ needs_container_tier }}
      ================================
  become: false
  when: not (_csb_molecule_force | default(false)) and (is_linux | bool)
