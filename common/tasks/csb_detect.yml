---
# CSB (Corporate Standard Build) detection tasks.
# All checks run without root (no become). Safe to re-run (idempotent).
# Sets facts consumed by later roles to adapt behavior.

# ---------------------------------------------------------------------------
# 1. OS family and hostname detection
# ---------------------------------------------------------------------------
- name: Detect OS family and CSB hostname suffix
  ansible.builtin.set_fact:
    is_rhel: "{{ ansible_facts['distribution'] == 'RedHat' }}"
    is_fedora: "{{ ansible_facts['distribution'] == 'Fedora' }}"
    is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"
    is_linux: "{{ ansible_facts['system'] == 'Linux' }}"
    is_dnf: "{{ ansible_facts['pkg_mgr'] | default('') in ['dnf', 'dnf5'] }}"
    is_dnf5: "{{ ansible_facts['pkg_mgr'] | default('') == 'dnf5' }}"
    is_apt: "{{ ansible_facts['pkg_mgr'] | default('') == 'apt' }}"
    _csb_hostname: "{{ ansible_facts['fqdn'] is search('\\.csb$') }}"
  become: false

# ---------------------------------------------------------------------------
# 2. fapolicyd
# ---------------------------------------------------------------------------
- name: Check if fapolicyd service exists  # noqa: command-instead-of-module
  # systemctl list-unit-files has no direct module equivalent; service_facts
  # does not expose unit-file presence without loading all services.
  ansible.builtin.command:
    cmd: systemctl list-unit-files fapolicyd.service
  register: _fapolicyd_unit
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode to avoid false-positive detection
  become: false
  when: is_linux | bool

- name: Check fapolicyd active state  # noqa: command-instead-of-module
  # service_facts loads all services; command is used for a lightweight
  # single-service probe without the overhead of enumerating every unit.
  ansible.builtin.command:
    cmd: systemctl is-active fapolicyd.service
  register: _fapolicyd_active
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode to avoid false-positive detection
  become: false
  when:
    - is_linux | bool
    - _fapolicyd_unit.rc | default(1) == 0


- name: Check fapolicyd config for permissive mode
  ansible.builtin.command:
    cmd: grep -qiP '^permissive\s*=\s*1' /etc/fapolicyd/fapolicyd.conf
  register: _fapolicyd_permissive_grep
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode to avoid false-positive detection
  become: false
  when:
    - is_linux | bool
    - _fapolicyd_active.rc | default(1) == 0

- name: Set fapolicyd facts
  ansible.builtin.set_fact:
    fapolicyd_installed: >-
      {{ (is_linux | bool) and (_fapolicyd_unit.rc | default(1) == 0) }}
    fapolicyd_enforcing: >-
      {{
        (is_linux | bool)
        and (_fapolicyd_active.rc | default(1) == 0)
        and (_fapolicyd_permissive_grep.rc | default(1) != 0)
      }}
  become: false

# Sections 3 (sudo probing) and 4 (usbguard_running) removed — facts were only
# consumed in the verbosity=1 debug summary and not by any downstream role task.

# ---------------------------------------------------------------------------
# 5. Internal CA certificates (Red Hat specific)
# ---------------------------------------------------------------------------
- name: Check for Red Hat internal CA certs
  ansible.builtin.stat:
    path: "{{ item }}"
  register: _ca_certs
  loop:
    - /etc/pki/ca-trust/source/anchors/2022-IT-Root-CA.pem
    - /etc/pki/ca-trust/source/anchors/Eng-CA.crt
    - /etc/pki/ca-trust/source/anchors/RH-IT-Root-CA.pem
  become: false
  when: is_linux | bool

- name: Set internal CA fact
  ansible.builtin.set_fact:
    internal_ca_present: >-
      {{
        (is_linux | bool)
        and (_ca_certs.results | default([])
             | selectattr('stat.exists')
             | list | length > 0)
      }}
  become: false

# ---------------------------------------------------------------------------
# 6. CSB heuristic: RHEL + fapolicyd + internal CA
# ---------------------------------------------------------------------------
- name: Set CSB detected fact
  ansible.builtin.set_fact:
    csb_detected: >-
      {{
        ((is_rhel | bool) and (fapolicyd_installed | bool) and (internal_ca_present | bool))
        or ((is_fedora | bool) and (_csb_hostname | bool) and (internal_ca_present | bool))
      }}
  become: false
  when: not (_csb_molecule_force | default(false))

- name: Set CSB restricted fact
  ansible.builtin.set_fact:
    csb_restricted: >-
      {{
        (csb_detected | bool)
        and (fapolicyd_enforcing | bool)
      }}
  become: false

# Sections 7 (rootless container readiness) and 8 (toolbox/distrobox detection) removed —
# podman_rootless_ready was never consumed by any task (distrobox role re-checks subuid/subgid
# independently at task-time); distrobox role detects
# these independently via its own 'which' checks; these facts were unused.

# ---------------------------------------------------------------------------
# 9. Network proxy detection
# ---------------------------------------------------------------------------
- name: Set proxy facts
  ansible.builtin.set_fact:
    network_proxied: >-
      {{
        (ansible_facts['env']['http_proxy'] | default('') | length > 0)
        or (ansible_facts['env']['HTTP_PROXY'] | default('') | length > 0)
        or (ansible_facts['env']['https_proxy'] | default('') | length > 0)
        or (ansible_facts['env']['HTTPS_PROXY'] | default('') | length > 0)
      }}
    proxy_url: >-
      {{
        [
          ansible_facts['env']['https_proxy'] | default(''),
          ansible_facts['env']['HTTPS_PROXY'] | default(''),
          ansible_facts['env']['http_proxy'] | default(''),
          ansible_facts['env']['HTTP_PROXY'] | default('')
        ] | select | first | default('')
      }}
  become: false

# Sections 10 (firewall_zone) and 11 (OSCAP/STIG detection) removed — all facts
# were only consumed in the verbosity=1 debug summary; no role task used them.

# ---------------------------------------------------------------------------
# 12. Derived: container tier strategy
# ---------------------------------------------------------------------------
# Three tiers from the migration plan:
#   host-only  - unrestricted Fedora/macOS, install everything on host
#   hybrid     - RHEL with full sudo, install basics on host + container for extras
#   container  - CSB restricted, minimal host + full dev env in container
- name: Determine container tier
  ansible.builtin.set_fact:
    needs_container_tier: >-
      {{
        'container' if (csb_restricted | bool)
        else ('hybrid' if ((is_rhel | bool) or (csb_detected | bool))
        else 'host-only')
      }}
  become: false

- name: Derive csb_rhel
  ansible.builtin.set_fact:
    csb_rhel: "{{ (csb_detected | bool) and (is_rhel | bool) }}"
  become: false
  when: not (_csb_molecule_force | default(false))

# ---------------------------------------------------------------------------
# 13. Summary for the user
# ---------------------------------------------------------------------------
- name: CSB detection summary
  ansible.builtin.debug:
    verbosity: 1
    msg: |
      === CSB Detection Summary ===
      OS family          : {{ ansible_facts.distribution | default('unknown') }} {{ ansible_facts.distribution_version | default('') }}
      Is Linux           : {{ is_linux }}
      Is RHEL            : {{ is_rhel }}
      Is Fedora          : {{ is_fedora }}
      Is macOS           : {{ is_macos }}
      Is DNF             : {{ is_dnf }}
      Is DNF5            : {{ is_dnf5 }}
      Is APT             : {{ is_apt }}
      ---
      fapolicyd installed: {{ fapolicyd_installed }}
      fapolicyd enforcing: {{ fapolicyd_enforcing }}
      Internal CA certs  : {{ internal_ca_present }}
      ---
      CSB hostname (.csb): {{ _csb_hostname }}
      CSB detected       : {{ csb_detected }}
      CSB restricted     : {{ csb_restricted }}
      CSB RHEL           : {{ csb_rhel }}
      ---
      Proxy URL          : {{ proxy_url | regex_replace('://[^@]+@', '://***@') }}
      ---
      Container tier     : {{ needs_container_tier }}
      ================================
  become: false
