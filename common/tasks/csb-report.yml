# common/tasks/csb-report.yml
#
# Renders a summary of all CSB failures and generates IT ticket templates
# for each blocked operation. Included as a post_task of Play 2 (site.yml),
# which has gather_facts: true — ansible_user_dir and ansible_date_time are
# always available.

---
- name: Check for CSB failures
  ansible.builtin.set_fact:
    _csb_has_failures: "{{ (csb_failures | default([])) | length > 0 }}"

# No-failures message removed: a clean run with no output is self-evidently successful.

- name: Report — CSB failure summary
  ansible.builtin.debug:
    msg: |

      ╔══════════════════════════════════════════════════════════════╗
      ║                   CSB COMPATIBILITY REPORT                  ║
      ╠══════════════════════════════════════════════════════════════╣
      ║  Total failures: {{ (csb_failures | length) | string | center(44) }}║
      ║  Roles affected: {{ (csb_failures | map(attribute='role') | unique | join(', ')) | truncate(44) | center(44) }}║
      ╚══════════════════════════════════════════════════════════════╝

      {% for failure in csb_failures %}
      ── Failure {{ loop.index }} of {{ csb_failures | length }} ──────────────────────────────
        Role:      {{ failure.role }}
        Task:      {{ failure.task }}
        Time:      {{ failure.timestamp }}
        Error:     {{ failure.error | truncate(120) }}
        Action:    {{ failure.suggested_action }}

      {% endfor %}
  when: _csb_has_failures | bool

- name: Report — IT ticket templates
  ansible.builtin.debug:
    msg: |

      ════════════════════════════════════════════════════════════════
      IT TICKET {{ loop.index }}: {{ item.ticket.summary }}
      ════════════════════════════════════════════════════════════════
      Priority:  {{ item.ticket.priority }}
      Category:  {{ item.ticket.category }}

      {{ item.ticket.body }}

      Diagnostic error: {{ item.error | truncate(300) }}
      ────────────────────────────────────────────────────────────────

  loop: "{{ csb_failures }}"
  loop_control:
    label: "{{ item.ticket.summary }}"
  when: _csb_has_failures | bool

- name: Write CSB report to file
  ansible.builtin.copy:
    content: |
      # CSB Compatibility Report
      # Generated: {{ ansible_date_time.iso8601 }}
      # Host: {{ inventory_hostname }}

      ## Summary

      Total failures: {{ csb_failures | length }}
      Roles affected: {{ csb_failures | map(attribute='role') | unique | join(', ') }}

      ## Failures

      {% for failure in csb_failures %}
      ### {{ loop.index }}. {{ failure.task }}
      - **Role:** {{ failure.role }}
      - **Time:** {{ failure.timestamp }}
      - **Error:** {{ failure.error }}
      - **Suggested action:** {{ failure.suggested_action }}

      {% endfor %}
      ## IT Tickets to File

      {% for failure in csb_failures %}
      ### Ticket {{ loop.index }}: {{ failure.ticket.summary }}
      - **Priority:** {{ failure.ticket.priority }}
      - **Category:** {{ failure.ticket.category }}

      {{ failure.ticket.body }}

      Diagnostic error: {{ failure.error | truncate(300) }}

      ---
      {% endfor %}
    dest: "{{ ansible_user_dir }}/csb-report.md"
    mode: "0600"
    backup: true
  when: _csb_has_failures | bool

- name: Display report file location
  ansible.builtin.debug:
    msg: >-
      CSB report written to
      {{ ansible_user_dir }}/csb-report.md
      — review and file {{ csb_failures | default([]) | length }} IT ticket(s).
  when: _csb_has_failures | bool
