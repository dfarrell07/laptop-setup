# common/tasks/csb-report.yml
#
# Writes ~/csb-report.md with a failure summary and IT ticket templates.
# Included as a post_task of Play 2 (site.yml),
# which has gather_facts: true — ansible_user_dir is always available.

---
- name: Write CSB report to file
  become: false
  ansible.builtin.copy:
    content: |
      # CSB Compatibility Report
      # Host: {{ inventory_hostname }}

      ## Summary

      Total failures: {{ csb_failures | length }}
      Roles affected: {{ csb_failures | map(attribute='role') | unique | join(', ') }}

      ## Failures

      {% for failure in csb_failures %}
      ### {{ loop.index }}. {{ failure.task }}
      - **Role:** {{ failure.role }}
      - **Time:** {{ failure.timestamp }}
      - **Error:** {{ failure.error | truncate(300) }}
      - **Suggested action:** {{ failure.suggested_action }}

      {% endfor %}
      ## IT Tickets to File

      {% for failure in csb_failures %}
      ### Ticket {{ loop.index }}: {{ failure.ticket.summary }}
      - **Priority:** {{ failure.ticket.priority }}
      - **Category:** {{ failure.ticket.category }}

      {{ failure.ticket.body }}

      Diagnostic error: {{ failure.error | truncate(300) }}

      ---
      {% endfor %}
    dest: "{{ ansible_user_dir }}/csb-report.md"
    mode: "0600"
  when: (csb_failures | default([])) | length > 0
  tags: [always]

- name: Display report file location
  become: false
  ansible.builtin.debug:
    msg: >-
      CSB report written to
      {{ ansible_user_dir }}/csb-report.md
      — review and file {{ csb_failures | default([]) | length }} IT ticket(s).
  when: (csb_failures | default([])) | length > 0
  tags: [always]
