---
# Git repositories to clone under ~/src/ (or git_repos_base_dir).
# Filter with: -e repo_category=ovnk
#
# Categories: personal, downstream, bpfman, ovnk, konflux
# Work profile: all categories. Personal profile: personal + ovnk.
# Repos without an enabled field are included by default (enabled is opt-in only for overrides).

git_repos_list:
  # --- personal ---
  - url: git@github.com:{{ dotfiles_github_user }}/notes-ai.git
    dest: "{{ dotfiles_github_user }}/notes-ai"
    category: personal

  - url: git@github.com:{{ dotfiles_github_user }}/laptop-setup.git
    dest: "{{ dotfiles_github_user }}/laptop-setup"
    category: personal

  - url: git@github.com:{{ dotfiles_github_user }}/claude-skills.git
    dest: "{{ dotfiles_github_user }}/claude-skills"
    category: personal

  # --- submariner-io (category: downstream) ---
  - url: https://github.com/submariner-io/submariner-operator
    dest: submariner-io/submariner-operator
    category: downstream
    extra_remotes:
      - name: dfarrell_op
        url: "git@github.com:{{ dotfiles_github_user }}/submariner-operator.git"

  - url: https://github.com/submariner-io/submariner
    dest: submariner-io/submariner
    category: downstream
    extra_remotes:
      - name: dfarrell_subm
        url: "git@github.com:{{ dotfiles_github_user }}/submariner.git"

  - url: https://github.com/submariner-io/admiral
    dest: submariner-io/admiral
    category: downstream

  - url: https://github.com/submariner-io/lighthouse
