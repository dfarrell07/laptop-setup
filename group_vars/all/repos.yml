        url: "git@github.com:{{ dotfiles_github_user }}/lighthouse.git"

  - url: https://github.com/submariner-io/shipyard
    dest: submariner-io/shipyard
    category: downstream

  - url: https://github.com/submariner-io/cloud-prepare
    dest: submariner-io/cloud-prepare
    category: downstream

  - url: https://github.com/submariner-io/subctl
    dest: submariner-io/subctl
    category: downstream
    extra_remotes:
      - name: dfarrell_subctl
        url: "git@github.com:{{ dotfiles_github_user }}/subctl.git"

  - url: https://github.com/submariner-io/enhancements
    dest: submariner-io/enhancements
    depth: 1
    category: downstream

  - url: https://github.com/submariner-io/submariner-website
