---
# Ansible Vault file, shipped as a PLAINTEXT stub (no secrets) — encrypt before adding real secrets.
#
#   make setup-yubikeys && make ssh-keys && make vault-init   # fills the two SSH key lines (later edits: make vault-edit)
#
# Expected variables:
#   vault_ssh_auth_key      contents of ~/.ssh/id_ed25519_sk (the key file without .pub)
#   vault_ssh_auth_key_pub  contents of ~/.ssh/id_ed25519_sk.pub, then each backup YubiKey's .pub, one per line;
#                           every line goes to authorized_keys
#
# Optional variables (leave '' to skip):
#   vault_ssh_signing_key, vault_ssh_signing_key_pub  (~/.ssh/id_ed25519_sk_signing and its .pub: make vault-signing-key
#     copies both in, nothing to paste)
#   vault_rh_git_key  (work profile only)
#   vault_notes_transcrypt_password
#   vault_codex_api_key  (work profile: the owork Codex home logs in with it; `make vault-edit`, then `make codex`)
#   vault_acli_api_token  (acli logs in to Jira with it wherever acli_site is set; `make acli-token` asks for it and logs in)
#   vault_drive_oauth_client_id, vault_drive_oauth_client_secret  (Drive sync's OAuth client; docs/drive-sync.md)
#   vault_grub_password_hash  (when system_grub_password_enabled: true)
#
# Key files span several lines: replace '' with | and indent every line of the file by two spaces:
#   vault_ssh_auth_key: |
#     <first line of the key file>
#     <...every further line...>
#
vault_ssh_auth_key: ''
vault_ssh_auth_key_pub: ''
vault_ssh_signing_key: ''
vault_ssh_signing_key_pub: ''
vault_rh_git_key: ''
vault_notes_transcrypt_password: ''
vault_codex_api_key: ''
vault_acli_api_token: ''
vault_drive_oauth_client_id: ''
vault_drive_oauth_client_secret: ''

vault_registry_tokens: []  # list of {registry, username, token} dicts; encrypt before adding real secrets
vault_placeholder: "encrypt-me"  # CI sentinel — checked by scripts/verify-vault-stub.py; do not reference in tasks
