#   vault_ssh_signing_key, vault_ssh_signing_key_pub
#   vault_rh_git_key
#   vault_notes_transcrypt_password
#
# Future (not yet implemented):
#   vault_registry_tokens  — for automated podman login to registry.redhat.io / quay.io
vault_placeholder: "encrypt-me"
