---
# Ansible Vault encrypted file — encrypt before adding real secrets.
#
#   ansible-vault encrypt group_vars/all/vault.yml
#   make vault-edit
#
# Required variables (populate then encrypt):
#   vault_ssh_auth_key, vault_ssh_auth_key_pub
#   vault_ssh_signing_key, vault_ssh_signing_key_pub
#   vault_rh_git_key
#   vault_notes_transcrypt_password
#
# Optional variables (when feature is enabled):
#   vault_grub_password_hash  (when system_grub_password_enabled: true)
#
vault_registry_tokens: []  # list of {registry, username, token} dicts; encrypt before adding real secrets
vault_placeholder: "encrypt-me"  # CI sentinel — matched by linting.yml vault-encryption-check; do not reference in tasks
