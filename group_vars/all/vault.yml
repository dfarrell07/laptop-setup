---
# Ansible Vault file, shipped as a PLAINTEXT stub (no secrets) — encrypt before adding real secrets.
#
#   make vault-init   # after make setup-yubikeys: skip-worktree (the committed file stays this stub),
#                     # ansible-vault encrypt, then opens the editor (later edits: make vault-edit)
#
# Expected variables (add them with make vault-edit after encrypting):
#   vault_ssh_auth_key      contents of ~/.ssh/id_ed25519_sk (the key file without .pub)
#   vault_ssh_auth_key_pub  contents of ~/.ssh/id_ed25519_sk.pub (one line; written to authorized_keys)
#
# Optional variables (leave '' to skip):
#   vault_ssh_signing_key, vault_ssh_signing_key_pub  (~/.ssh/id_ed25519_sk_signing and its .pub)
#   vault_rh_git_key  (work profile only)
#   vault_notes_transcrypt_password
#   vault_grub_password_hash  (when system_grub_password_enabled: true)
#
# Key files span several lines: replace '' with | and indent every line of the file by two spaces:
#   vault_ssh_auth_key: |
#     <first line of the key file>
#     <...every further line...>
#
# SSH keys — empty on first provision; add real keys only after encryption
vault_ssh_auth_key: ''
vault_ssh_auth_key_pub: ''
vault_ssh_signing_key: ''
vault_ssh_signing_key_pub: ''
vault_rh_git_key: ''
vault_notes_transcrypt_password: ''

vault_registry_tokens: []  # list of {registry, username, token} dicts; encrypt before adding real secrets
vault_placeholder: "encrypt-me"  # CI sentinel — checked by scripts/verify-vault-stub.py; do not reference in tasks
