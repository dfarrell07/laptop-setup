---
# Indirection layer between vault secrets and role variables.
# Roles reference these; vault_ prefixed variables come from vault.yml.

# Static string for {{ ansible_managed }} in templates (no timestamps)
ansible_managed: "Ansible managed — do not edit"

# SSH keys (deployed by ssh role when vault is populated)
ssh_auth_key: "{{ vault_ssh_auth_key | default('') }}"
ssh_auth_key_pub: "{{ vault_ssh_auth_key_pub | default('') }}"
ssh_signing_key: "{{ vault_ssh_signing_key | default('') }}"
ssh_signing_key_pub: "{{ vault_ssh_signing_key_pub | default('') }}"

# Git signing
ssh_git_signing_pubkey: "{{ vault_ssh_signing_key_pub | default('') }}"

# Red Hat internal git key
rh_git_key: "{{ vault_rh_git_key | default('') }}"

# Internal hostnames (override in config.yml per-environment)
dotfiles_internal_git_host: ""

# Notes repo transcrypt password
notes_transcrypt_password: "{{ vault_notes_transcrypt_password | default('') }}"

# registry_tokens: "{{ vault_registry_tokens | default({}) }}"  # future — not yet implemented

# CSB / OS detection baselines — csb_detect.yml always overrides via set_fact at runtime.
# Defining here removes the need for | default(X) guards in conditionals.
csb_detected: false
csb_restricted: false
is_rhel: false
is_fedora: false
is_macos: false
is_linux: true
fapolicyd_installed: false
fapolicyd_enforcing: false
internal_ca_present: false
needs_container_tier: "host-only"

# Cross-role variable baselines — allow standalone invocation of roles that consume
# variables defined in other roles' defaults or default.config.yml (which only loads
# during full playbook runs via pre_flight_checks.yml include_vars).
packages_install_binaries: true  # roles/packages/defaults/main.yml:239; consumed by packages, claude

# Feature toggle baselines matching default.config.yml — eliminates | default(X) in role tasks.
# Users override these in config.yml (higher precedence via include_vars).
repo_gh_cli: true
repo_google_chrome: false
repo_google_cloud_sdk: false
repo_slack: false
repo_mullvad: true
repo_docker_ce: false
repo_acli: true
repo_redhat: true
repo_rpmfusion_free: true
repo_rpmfusion_nonfree: false
repo_tailscale: true
install_docker: false
install_vpn: true
install_virtualization: true
system_disable_avahi: true        # mask avahi-daemon (mDNS/DNS-SD); set false for .local resolution
system_mask_nfs_server: true      # mask nfs-server; most workstations don't export NFS
system_init_on_free: true         # zero freed memory pages on kernel free (init_on_free=1)
system_faillock_even_deny_root: false  # lock root on failed auth; set false on single-user workstations

# Security hardening parameter baselines — also in roles/system/defaults/main.yml (role defaults,
# precedence 2). These MUST also be in vars.yml (group_vars, precedence 4-5) because:
# 1. molecule/shared/verify-dnf.yml runs as a standalone verify play where role defaults are unavailable
# 2. verify-smoke.yml also references system_mask_nfs_server for smoke-test assertions
# If changing a value, update BOTH here and in roles/system/defaults/main.yml.
system_tmout: 600                  # session inactivity timeout in seconds (CIS 5.5.5; must be <= 900)
system_faillock_deny: 5            # PAM lockout: failed attempts before account lock
system_faillock_unlock_time: 900   # seconds before auto-unlock after failed attempts
system_pwquality_minlen: 14        # minimum password length (CIS 5.3.2)
system_pwquality_difok: 4          # characters that must differ from previous password
system_pwquality_ucredit: -1       # require at least 1 uppercase character (CIS 5.3.3)
system_pwquality_lcredit: -1       # require at least 1 lowercase character (CIS 5.3.3)
system_pwquality_ocredit: -1       # require at least 1 special character (CIS 5.3.3)
system_pwquality_dcredit: -1       # require at least 1 digit (CIS 5.3.3)
system_pwquality_maxrepeat: 3      # maximum consecutive repeated characters
system_pwhistory_remember: 24      # number of previous passwords to remember (CIS 5.3.5)
system_inactive_days: 30           # days inactive before account lock (CIS 5.5.1.5)
system_pass_max_days: 365          # maximum password age in days (login.defs PASS_MAX_DAYS)
system_umask: "027"                # default umask for login shells (login.defs UMASK)
ssh_signing_key_basename: "id_ed25519_sk_signing"  # shared between dotfiles and ssh roles; must match
# Computed boolean: true on RHEL CSB where IT manages security baselines;
# false on hybrid Fedora CSB where the user manages their own system.
# Used in rescue blocks to route IT ticket vs. generic warning.
csb_rhel: "{{ csb_detected and ansible_facts['distribution'] != 'Fedora' }}"
