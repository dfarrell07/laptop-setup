---
# Indirection layer between vault secrets and role variables.
# Roles reference these; vault_ prefixed variables come from vault.yml.

# Static string for {{ ansible_managed }} in templates (no timestamps)
ansible_managed: "Ansible managed — do not edit"

# SSH keys (deployed by ssh role when vault is populated)
ssh_auth_key: "{{ vault_ssh_auth_key | default('') }}"
ssh_auth_key_pub: "{{ vault_ssh_auth_key_pub | default('') }}"
ssh_signing_key: "{{ vault_ssh_signing_key | default('') }}"
ssh_signing_key_pub: "{{ vault_ssh_signing_key_pub | default('') }}"

# Git signing
ssh_git_signing_pubkey: "{{ vault_ssh_signing_key_pub | default('') }}"

# Red Hat internal git key
rh_git_key: "{{ vault_rh_git_key | default('') }}"

# Internal hostnames (override in config.yml per-environment)
dotfiles_internal_git_host: "internal-git.example.com"

# Notes repo transcrypt password
notes_transcrypt_password: "{{ vault_notes_transcrypt_password | default('') }}"

# registry_tokens: "{{ vault_registry_tokens | default({}) }}"  # future — not yet implemented

# CSB / OS detection baselines — csb_detect.yml always overrides via set_fact at runtime.
# Defining here removes the need for | default(X) guards in conditionals.
csb_detected: false
csb_restricted: false
is_rhel: false
is_fedora: false
is_macos: false
is_linux: true
fapolicyd_installed: false
fapolicyd_running: false
fapolicyd_enforcing: false
internal_ca_present: false
podman_rootless_ready: false
network_proxied: false
needs_container_tier: "host-only"

# Cross-role variable baselines — allow standalone invocation of roles that consume
# variables defined in other roles' defaults or default.config.yml (which only loads
# during full playbook runs via pre_flight_checks.yml include_vars).
packages_install_binaries: true  # roles/packages/defaults/main.yml:240; consumed by claude, distrobox

# Feature toggle baselines matching default.config.yml — eliminates | default(X) in role tasks.
# Users override these in config.yml (higher precedence via include_vars).
repo_gh_cli: true
repo_google_chrome: false
repo_google_cloud_sdk: false
repo_slack: false
repo_mullvad: true
repo_docker_ce: false
repo_acli: true
repo_redhat: true
repo_rpmfusion_free: true
repo_rpmfusion_nonfree: false
repo_tailscale: true
install_docker: false
install_vpn: true
install_virtualization: true
