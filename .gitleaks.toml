[extend]
  useDefault = true

[[rules]]
  id = "generic-api-key"

  [[rules.allowlists]]
    description = "Known dummy CI vault password"
    condition = "AND"
    regexes = ['''ci-dummy-vault-password''']
    paths = ['''(^|/)scripts/vault-pass-ci[.]sh$''']

  [[rules.allowlists]]
    description = "Literal GRUB hash examples and the hash-generation command"
    condition = "AND"
    regexTarget = "match"
    regexes = [
      '''(system|vault)_grub_password_hash:[\s]*"grub\.pbkdf2\.sha512\.(10000|200000)\.\.\.\."''',
      '''password hash via: grub2-mkpasswd-pbkdf2''',
    ]
    paths = ['''(^|/)(common/tasks/pre_flight_checks|roles/system/tasks/grub_password)\.yml$''']

  [[rules.allowlists]]
    description = "Systemd sandbox directive is a configuration key, not a credential"
    condition = "AND"
    regexes = ['''^NoNewPrivileges(=true)?$''']
    paths = ['''(^|/)roles/system/(files/aide-check\.service|templates/aide-check\.service\.j2)$''']  # the .j2 path survives only in history scans

  [[rules.allowlists]]
    description = "Public signing key fingerprint in the documented placeholder"
    condition = "AND"
    regexTarget = "match"
    regexes = ['''Key fingerprint: [A-Fa-f0-9]{40}''']
    paths = ['''(^|/)collections-dist/signing-key\.asc$''']

[[allowlists]]
  description = "Generated public runtime SHA256 digest row"
  condition = "AND"
  targetRules = ["generic-api-key", "bitbucket-client-secret", "discord-api-token", "new-relic-user-api-id", "sumologic-access-token"]
  regexTarget = "line"
  regexes = ['''(?m)^[ \t]*"(plugins|module_utils|roles)/[^"\r\n]+[.](py|so)": "[0-9a-f]{64}",?[ \t\r]*$''']
  paths = ['''(^|/)collections-dist/PYTHON_MANIFEST[.]json$''']
