---
# Note: Dependabot does not support the Ansible Galaxy package ecosystem.
# Galaxy collection drift is tracked separately by .github/workflows/galaxy-drift.yml.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "pip"
    groups:
      python:
        patterns:
          - "*"
    # NOTE: Dependabot bumps version bounds in requirements-test.txt but does NOT
    # regenerate requirements-test.lock (pip-compile hashed output). After merging
    # any Dependabot pip PR, run `make pip-lock` and commit the updated lockfile —
    # CI installs exclusively from requirements-test.lock, so the PR is otherwise inert.

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "npm"
    groups:
      node:
        patterns:
          - "*"
