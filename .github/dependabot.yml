---
# Note: Dependabot does not support the Ansible Galaxy package ecosystem.
# Galaxy collection drift is tracked separately by .github/workflows/galaxy-drift.yml.
# Version updates wait 14 days after a release (cooldown), the same age as any version pinned by hand; security
# updates do not wait.
version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 14
    directories: ["/", "/.github/actions/*"]  # workflows and the composite actions
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    cooldown:
      default-days: 14
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "pip"
    groups:
      python:
        patterns:
          - "*"
    # NOTE: Dependabot bumps version bounds in requirements-test.txt but does NOT
    # regenerate requirements-test.lock (pip-compile hashed output). After merging
    # any Dependabot pip PR, run `make pip-lock` and commit the updated lockfile —
    # CI installs exclusively from requirements-test.lock, so the PR is otherwise inert.

  - package-ecosystem: "npm"
    cooldown:
      default-days: 14
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "npm"
    groups:
      node:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    cooldown:
      default-days: 14
    directory: "/roles/codex/files"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "npm"
    # NOTE: the Codex pin is integrity-locked; review all archive URLs and
    # integrity values in package-lock.json before merging a bump.
