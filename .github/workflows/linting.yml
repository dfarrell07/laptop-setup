---
name: Linting

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CI environment
        uses: ./.github/actions/ci-setup

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run yamllint
        # ansible-lint skips yaml rules (see .ansible-lint skip_list); yamllint covers them
        # and also lints .github/ (excluded from ansible-lint)
        run: yamllint --strict .

      - name: Check lock file drift
        # Verify requirements-test.lock satisfies the version bounds in requirements-test.txt.
        # Dependabot bumps bounds in .txt but does NOT regenerate .lock; this catches that gap.
        # Uses `packaging` which is already installed by ci-setup from requirements-test.lock.
        run: |
          python3 - <<'PYEOF'
          import re, sys
          from packaging.requirements import Requirement
          from packaging.version import Version

          def normalize(name):
              return re.sub(r'[-_.]+', '-', name).lower()

          reqs = {}
          with open('requirements-test.txt') as f:
              for line in f:
                  line = line.strip()
                  if line and not line.startswith('#'):
                      req = Requirement(line)
                      reqs[normalize(req.name)] = req

          locked = {}
          with open('requirements-test.lock') as f:
              for line in f:
                  # Strip optional extras (e.g. molecule-plugins[podman,vagrant]==x.y.z)
                  m = re.match(r'^([A-Za-z0-9][-A-Za-z0-9._]*)(?:\[[^\]]*\])?==([^\s\\]+)', line)
                  if m:
                      locked[normalize(m.group(1))] = Version(m.group(2))

          drift = []
          for key, req in reqs.items():
              if key not in locked:
                  drift.append(f'{req.name}: not found in requirements-test.lock')
              elif not req.specifier.contains(locked[key]):
                  drift.append(
                      f'{req.name}: locked at {locked[key]}, but {req.specifier} required'
                  )

          if drift:
              for d in drift:
                  print(f'::error::{d}')
              print('Run `make pip-lock` and commit the updated lockfile.')
              sys.exit(1)
          print(f'Lock file satisfies all {len(reqs)} direct requirements.')
          PYEOF

  check-vars-sync:
    name: Vars Sync Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install dependencies
        run: |
          pip install --require-hashes -r <(awk '
            /^pyyaml==|^packaging==/ {
              in_pkg=1; line=$0
              sub(/[[:space:]]*\\[[:space:]]*$/, "", line)
              printf "%s", line; next
            }
            in_pkg && /--hash=sha256:/ {
              line=$0
              sub(/^[[:space:]]*/, "", line)
              sub(/[[:space:]]*\\[[:space:]]*$/, "", line)
              printf "\n    %s", line; next
            }
            in_pkg {printf "\n"; in_pkg=0}
          ' requirements-test.lock)

      - name: Check vars sync
        run: python3 scripts/check-vars-sync.py

  shell-checks:
    name: Shell Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: |
          shellcheck -S warning scripts/*.sh
          shellcheck -S warning roles/claude/files/*.sh
          shellcheck -S warning .githooks/pre-commit .githooks/commit-msg .githooks/pre-push
          shellcheck -S warning roles/dotfiles/files/git-template-*

      - name: Validate git hooks — prevent malicious exfiltration patterns
        run: |
          # SECURITY: Behavioral validation of hook changes to prevent key exfiltration attacks.
          # This complements shellcheck (syntax validation) with intent/behavior checks.
          failed=0
          for hook in .githooks/pre-commit .githooks/commit-msg .githooks/pre-push; do
            # Prohibit common exfiltration methods: curl, wget, nc with URLs
            if grep -E 'curl\s|wget\s|nc\s' "$hook" | grep -qE 'https?://|::[0-9]+'; then
              echo "::error::$hook: curl/wget/nc with network URLs detected (potential exfiltration)" >&2
              failed=1
            fi
            # Prohibit direct reads of sensitive paths: SSH keys, GPG keys, cloud credentials
            if grep -qE 'cat.*(\$HOME|~)/(\.ssh|\.gnupg|\.aws|\.gcloud|\.config/gcloud)'; then
              echo "::error::$hook: reads of sensitive file paths detected (SSH/GPG/AWS/GCP keys)" >&2
              failed=1
            fi
            # Prohibit writes/commands to sensitive locations
            if grep -qE '(aws|gcloud|gh|kubectl)\s+.*--password|export\s+(AWS_|GOOGLE_|GCP_|GITHUB_TOKEN)'; then
              echo "::error::$hook: credential export detected (token leakage risk)" >&2
              failed=1
            fi
          done
          exit $failed

      - name: Verify hook baseline integrity (detect behavior changes)
        if: github.event_name == 'pull_request'
        run: |
          # SECURITY: Enforce that hook changes are semantically reviewed.
          # If a PR modifies .githooks/*, require explicit evidence of intent (commit message pattern).
          # This is a behavioral gate in addition to code review policy.
          failed=0
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # List all commits in the PR
          commits=$(git rev-list "$BASE_SHA..$HEAD_SHA")

          # Check if any commit modifies .githooks/*
          hook_modified=0
          for commit in $commits; do
            if git show "$commit" --name-only | grep -q '^.githooks/'; then
              hook_modified=1
              # Require PR description or explicit commit message keyword for hook changes
              msg=$(git log -1 --format=%B "$commit")
              if ! printf '%s' "$msg" | \
                 grep -qiE '(SECURITY|hook.*change|gitHook|integrity|behavioral|vault|pre.push)'; then
                echo "::notice::Commit $commit modifies .githooks/ — commit message lacks"
                echo "  security/behavioral keywords (SECURITY, hook, integrity, vault, pre-push, etc.)"
              fi
            fi
          done

          if [ "$hook_modified" -eq 1 ]; then
            echo "::notice::PR modifies .githooks/ — code review by project maintainer REQUIRED (GitHub branch protection enforces this)"
          fi

      - name: Validate preflight JSON output
        run: |
          bash scripts/preflight.sh --json > /tmp/pf.json || true
          test -s /tmp/pf.json || { echo 'preflight.sh --json produced no output'; exit 1; }
          python3 -c "import json,sys; json.load(open('/tmp/pf.json'))"

      - name: Validate smoke-test JSON output
        run: |
          bash scripts/smoke-test.sh --user-only --json > /tmp/st.json || true
          test -s /tmp/st.json || { echo 'smoke-test.sh --json produced no output'; exit 1; }
          python3 -c "import json,sys; json.load(open('/tmp/st.json'))"

      - name: Run queue poller unit tests
        run: bash scripts/test-queue-poller.sh

  collections-manifest:
    name: Collection Manifest Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: contains(github.event.pull_request.files.*.filename, 'requirements.yml') || contains(github.event.pull_request.files.*.filename, 'PYTHON_MANIFEST.json')
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Validate Python manifest is well-formed JSON
        run: |
          python3 -c "import json; json.load(open('collections-dist/PYTHON_MANIFEST.json'))"

      - name: Verify manifest contains all pinned collections
        run: |
          python3 - <<'PYEOF'
          import json
          import yaml

          with open('requirements.yml') as f:
              reqs = yaml.safe_load(f)
          with open('collections-dist/PYTHON_MANIFEST.json') as f:
              manifest = json.load(f)

          pinned_collections = {c['name']: c['version'] for c in reqs.get('collections', [])}
          manifest_entries = set(manifest.keys())

          # Convert collection names to tarball format (community.general -> community-general)
          expected_entries = {name.replace('.', '-') + '-' + version for name, version in pinned_collections.items()}

          missing = expected_entries - manifest_entries
          if missing:
              print(f'ERROR: Manifest missing entries for: {missing}')
              exit(1)

          print(f'✓ Manifest contains all {len(expected_entries)} pinned collections')
          PYEOF

      - name: Ensure requirements.yml and PYTHON_MANIFEST.json are both updated
        if: github.event_name == 'pull_request'
        run: |
          # If PR modifies requirements.yml, PYTHON_MANIFEST.json must also be updated
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          req_modified=$(git diff --name-only "$BASE_SHA..$HEAD_SHA" | grep -c 'requirements.yml' || echo 0)
          manifest_modified=$(git diff --name-only "$BASE_SHA..$HEAD_SHA" | grep -c 'PYTHON_MANIFEST.json' || echo 0)

          if [ "$req_modified" -eq 1 ] && [ "$manifest_modified" -eq 0 ]; then
              echo "::error::PR modifies requirements.yml but PYTHON_MANIFEST.json is not updated"
              echo "  Run: scripts/gen-collection-manifest.py collections-dist collections-dist/PYTHON_MANIFEST.json"
              exit 1
          fi

  vault-encryption:
    name: Vault Encryption Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure vault files are encrypted
        run: |
          failed=0
          while IFS= read -r f; do
            # shellcheck disable=SC2016
            if head -1 "$f" | grep -q '^\$ANSIBLE_VAULT'; then
              continue
            fi
            # Allow the placeholder stub (no real secrets): vault_placeholder present
            # and any other vault_* vars set only to [] (empty list stub)
            if grep -q 'vault_placeholder' "$f" && \
               [ "$(grep -E '^vault_' "$f" | grep -Ev 'vault_placeholder|:[[:space:]]*\[\]' | wc -l)" -eq 0 ]; then
              echo "::notice file=${f}::Vault stub (no real secrets) — OK"
              continue
            fi
            echo "::error file=${f}::Unencrypted vault file: ${f}"
            failed=1
          done < <(find . -name '*vault.yml' -not -path './node_modules/*' -not -path './collections/*' -not -path './.venv/*')
          exit $failed

      - name: Ensure vault is not encrypted with CI dummy password
        run: |
          python3 - <<'PYEOF'
          # Verify no vault file was encrypted with the known CI dummy password.
          # Ansible vault 1.1 AES256 format: vault body = hexlify(hexlify(salt) + b'\n'
          # + hmac_hexdigest_bytes + b'\n' + hexlify(ciphertext)).
          # PBKDF2-HMAC-SHA256(password, salt, 10000, 80) derives: AES key (0:32),
          # HMAC key (32:64), IV (64:80).  HMAC = SHA256(hmac_key, ciphertext).
          import sys, hashlib, hmac as _hmac, binascii, subprocess

          dummy = 'ci-dummy-vault-password'
          result = subprocess.run(
              ['find', '.', '-name', '*vault.yml',
               '-not', '-path', './node_modules/*',
               '-not', '-path', './collections/*',
               '-not', '-path', './.venv/*'],
              capture_output=True, text=True)
          if result.returncode != 0:
              print(f"find failed: {result.stderr}", file=sys.stderr); sys.exit(1)
          found = result.stdout.splitlines()
          failed = False
          for f in found:
              try:
                  with open(f) as fh:
                      lines = fh.readlines()
              except Exception:
                  continue
              if not lines or not lines[0].startswith('$ANSIBLE_VAULT'):
                  continue
              body = ''.join(l.strip() for l in lines[1:])
              try:
                  inner = binascii.unhexlify(body)
              except Exception:
                  continue
              parts = inner.split(b'\n', 2)
              if len(parts) != 3:
                  continue
              try:
                  salt = binascii.unhexlify(parts[0])
                  stored_hmac = parts[1]
                  ciphertext = binascii.unhexlify(parts[2])
              except Exception:
                  continue
              dk = hashlib.pbkdf2_hmac('sha256', dummy.encode(), salt, 10000, 80)
              computed = _hmac.new(dk[32:64], ciphertext, hashlib.sha256).hexdigest().encode()
              if _hmac.compare_digest(computed, stored_hmac):
                  print(f'::error file={f}::{f} is encrypted with the CI dummy password'
                        ' — re-encrypt using vault-pass.sh')
                  failed = True
          sys.exit(1 if failed else 0)
          PYEOF

  script-integrity:
    name: Script Integrity Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Verify verify-collections.sh integrity
        run: |
          cd scripts
          if ! sha256sum -c verify-collections.sh.sha256; then
            echo "::error::verify-collections.sh integrity check failed"
            echo "The verify-collections.sh script has been tampered with or the .sha256 file is out of sync."
            echo "If changes to verify-collections.sh are intentional, regenerate the hash:"
            echo "  sha256sum scripts/verify-collections.sh > scripts/verify-collections.sh.sha256"
            echo "Then commit both files together to prevent supply chain tampering."
            exit 1
          fi
          echo "✓ verify-collections.sh integrity verified"

  collections-integrity:
    name: Collections Integrity Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Verify collections-dist SHA256SUMS
        run: |
          cd collections-dist
          if ! sha256sum -c SHA256SUMS; then
            echo "::error::collections-dist integrity check failed"
            echo "One or more collection tarballs have been tampered with or SHA256SUMS is out of sync."
            echo "If collections were intentionally updated, run: cd collections-dist && sha256sum *.tar.gz > SHA256SUMS"
            exit 1
          fi

  syntax-check:
    name: Ansible Syntax Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CI environment
        uses: ./.github/actions/ci-setup

      - name: Run syntax check
        run: ansible-playbook site.yml --syntax-check

  critical-assertions-guard:
    name: Critical Assertions Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install PyYAML for YAML validation
        run: |
          pip install pyyaml

      - name: Verify critical preflight assertions with YAML-aware validation
        run: |
          python3 .github/scripts/verify-critical-assertions.py
          if [ $? -ne 0 ]; then
            echo "::error::Critical assertions verification failed"
            exit 1
          fi

      - name: Verify site.yml syntax (ensures assertion is executable)
        run: ansible-playbook site.yml --syntax-check || exit 1

  git-config-guards:
    name: Git Config Guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Verify core.hooksPath not overridden
        run: |
          failed=0
          # Check local repo config
          local_hookspath=$(git config --local core.hooksPath || true)
          if [ -n "$local_hookspath" ] && [ "$local_hookspath" != ".githooks" ]; then
            echo "::error::Local core.hooksPath overridden to: $local_hookspath (must be .githooks or unset)"
            failed=1
          fi
          # Check system/global config (defensive against system-level tampering)
          global_hookspath=$(git config --global core.hooksPath || true)
          if [ -n "$global_hookspath" ] && [ "$global_hookspath" != ".githooks" ]; then
            echo "::error::Global core.hooksPath set to: $global_hookspath (should be unset)"
            failed=1
          fi
          system_hookspath=$(git config --system core.hooksPath || true)
          if [ -n "$system_hookspath" ]; then
            echo "::error::System core.hooksPath set to: $system_hookspath (should be unset)"
            failed=1
          fi
          if [ "$failed" -eq 0 ]; then
            echo "✓ core.hooksPath verified: correctly configured (local unset or .githooks, global/system unset)"
          fi
          exit $failed

      - name: Validate hook files for git config modifications
        run: |
          # SECURITY: Prevent hook-disabling patterns (git config core.hooksPath writes)
          # that could bypass hook enforcement at development time.
          failed=0
          for hook in .githooks/*; do
            # Reject git config modifications that could disable hooks
            if grep -qE 'git\s+config\s+(--local\s+)?core\.hooksPath|git\s+config\s+(--local\s+)?--unset\s+core\.hooksPath' "$hook"; then
              echo "::error::$hook: git config core.hooksPath modification detected (hook disabling risk)" >&2
              failed=1
            fi
          done
          exit $failed

      - name: Validate commit history for git config hook-disabling patterns
        if: github.event_name == 'pull_request'
        run: |
          # SECURITY: Check PR commit history for attempts to disable hooks via git config.
          # An attacker could write git config --local core.hooksPath /dev/null in a hook,
          # then unset it afterward to restore config. This check searches commit diffs
          # for such patterns in .githooks/* changes.
          failed=0
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Check if any commit modifies .githooks/* with git config write patterns
          commits=$(git rev-list "$BASE_SHA..$HEAD_SHA")
          for commit in $commits; do
            # Look for git config core.hooksPath modifications in .githooks/ diff
            if git show "$commit" -- .githooks/ | \
               grep -qE '^\+.*git\s+config\s+(--local\s+)?core\.hooksPath'; then
              echo "::error::Commit $commit modifies .githooks/ with git config core.hooksPath write (hook disabling risk)" >&2
              failed=1
            fi
            # Also check for config unset patterns
            if git show "$commit" -- .githooks/ | \
               grep -qE '^\+.*git\s+config\s+(--local\s+)?--unset\s+core\.hooksPath'; then
              echo "::error::Commit $commit modifies .githooks/ with git config --unset core.hooksPath (hook disabling risk)" >&2
              failed=1
            fi
          done
          exit $failed

  node-lint:
    name: Node Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate lockfile integrity and registry
        run: |
          python3 -c "
          import json, sys
          lock = json.load(open('package-lock.json'))
          errors = []
          for name, info in lock.get('packages', {}).items():
              if not name:
                  continue
              integrity = info.get('integrity', '')
              resolved = info.get('resolved', '')
              if integrity and not integrity.startswith('sha512-'):
                  errors.append(f'Weak hash ({integrity[:10]}...): {name}')
              if resolved and not resolved.startswith('https://registry.npmjs.org/'):
                  errors.append(f'Non-npmjs registry: {name} -> {resolved}')
          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          print(f'Validated {len(lock.get(\"packages\", {})) - 1} packages: all SHA-512, all npmjs.org, no git deps')
          "

      - name: Run markdownlint
        run: npx --no -- markdownlint-cli2 "**/*.md" "#node_modules" "#collections" "#.claude" "#references"

      - name: Run commitlint and check commit conventions
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" || failed=1
          # bash case does NOT re-parse | from variable expansion — use a function with literal alternation
          # Sync partner: .githooks/commit-msg — keep this word list identical
          _bad_word() {
            local lw; lw=$(printf '%s' "$1" | tr 'A-Z' 'a-z')
            case "$lw" in
              added|changed|created|deleted|enabled|disabled|expanded|\
              fixed|implemented|improved|merged|moved|refactored|\
              removed|renamed|replaced|resolved|reverted|started|\
              stopped|updated|upgraded|\
              adding|changing|creating|deleting|enabling|disabling|\
              expanding|fixing|implementing|improving|merging|moving|\
              refactoring|removing|renaming|replacing|resolving|\
              reverting|starting|stopping|updating|upgrading) return 0 ;;
              *) return 1 ;;
            esac
          }
          # shellcheck disable=SC2046
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            subject=$(git log -1 --format=%s "$sha")
            body=$(git log -1 --format=%B "$sha")
            first=$(printf "%s\n" "$subject" | awk '{print $1}')
            first="${first%:}"
            # For scoped commits (Scope: Verb noun), extract word after colon to check verb
            desc_first=$(printf "%s\n" "$subject" | sed 's/^[-A-Za-z0-9/]*:[[:space:]]*//' | awk '{print $1}')
            desc_first="${desc_first%:}"
            # Check scope word (e.g. 'Fixed: suppress lint warning' -> 'Fixed' is caught)
            if _bad_word "$first"; then
              echo "::error::Commit $sha: Use imperative mood for scope word, not '$first'"
              failed=1
            fi
            # Also check word after scope colon (e.g. 'Dotfiles: Updated' -> 'Updated' is caught)
            if [[ "$desc_first" != "$first" ]] && _bad_word "$desc_first"; then
              echo "::error::Commit $sha: Use imperative mood after scope colon, not '$desc_first'"
              failed=1
            fi
            if ! printf "%s\n" "$body" | grep -q '^Signed-off-by:'; then
              echo "::error::Commit $sha is missing Signed-off-by: trailer (use git commit -s)"
              failed=1
            fi
          done
          exit $failed

      - name: Verify npm package signatures
        id: npm_signatures
        continue-on-error: true
        run: npm audit signatures

      - name: Check for known vulnerabilities
        id: npm_audit
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Check npm audit results
        if: always()
        run: |
          failed=0
          if [ "${{ steps.npm_signatures.outcome }}" = "failure" ]; then
            echo "npm audit signatures failed"
            failed=1
          fi
          if [ "${{ steps.npm_audit.outcome }}" = "failure" ]; then
            echo "npm audit --audit-level=moderate failed"
            failed=1
          fi
          exit $failed

  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download gitleaks  # Last bumped: 2026-08-05; check https://github.com/gitleaks/gitleaks/releases
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks

      - name: Run gitleaks
        run: ./gitleaks git . --redact --config .gitleaks.toml

  workflow-security:
    name: Workflow Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download actionlint  # Last bumped: 2026-08-05; check https://github.com/rhysd/actionlint/releases
        id: actionlint_download
        continue-on-error: true
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          chmod +x actionlint

      - name: Run actionlint
        id: actionlint
        if: steps.actionlint_download.outcome == 'success'
        run: ./actionlint -color

      - name: Download zizmor  # Last bumped: 2026-08-05; check https://github.com/zizmorcore/zizmor/releases
        id: zizmor_download
        continue-on-error: true
        env:
          ZIZMOR_SHA256: dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839
        run: |
          curl -sSLO https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "${ZIZMOR_SHA256}  zizmor-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar xzf zizmor-x86_64-unknown-linux-gnu.tar.gz zizmor
          chmod +x zizmor

      - name: Run zizmor
        id: zizmor
        if: steps.zizmor_download.outcome == 'success'
        run: ./zizmor .github/

      # scan steps fail the job directly; only download failures need aggregation
      - name: Check security scanner results
        if: always()
        run: |
          failed=0
          if [ "${{ steps.actionlint_download.outcome }}" = "failure" ]; then
            echo "actionlint download failed"
            failed=1
          fi
          if [ "${{ steps.zizmor_download.outcome }}" = "failure" ]; then
            echo "zizmor download failed"
            failed=1
          fi
          exit $failed

  galaxy-recheck:
    name: Galaxy Collections Runtime Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Re-verify collections against Galaxy API at CI time
        run: |
          # SECURITY: Detect supply chain drift by re-verifying SHA256SUMS against Galaxy API.
          # This job runs at CI time (pull_request + main push) and guards against:
          #   1. SHA256SUMS files modified to match malicious artifacts
          #   2. Galaxy API changes (collection yanked, version replaced, hash updated)
          #   3. Network-level tampering (DNS hijacking, MITM, CDN replacement)
          # Note: This does NOT protect against simultaneous galaxy.ansible.com compromise
          # (both CDN and API compromised in sync), but catches most supply chain attacks.
          set -euo pipefail

          GALAXY_API="https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/index"
          FAIL=0

          # Specs: namespace/name/version/filename
          for spec in \
            "ansible/posix/2.2.2/ansible-posix-2.2.2.tar.gz" \
            "community/general/13.2.0/community-general-13.2.0.tar.gz" \
            "community/library_inventory_filtering_v1/1.1.5/community-library_inventory_filtering_v1-1.1.5.tar.gz" \
            "containers/podman/1.20.2/containers-podman-1.20.2.tar.gz"; do

            ns=$(echo "$spec" | cut -d/ -f1)
            name=$(echo "$spec" | cut -d/ -f2)
            ver=$(echo "$spec" | cut -d/ -f3)
            file=$(echo "$spec" | cut -d/ -f4)

            # Fetch Galaxy API hash
            api_hash=$(curl -sf "${GALAXY_API}/${ns}/${name}/versions/${ver}/" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['artifact']['sha256'])" 2>/dev/null || echo "")

            # Compute local file hash
            local_hash=$(sha256sum "collections-dist/${file}" 2>/dev/null | awk '{print $1}' || echo "")

            if [ -z "$api_hash" ]; then
              echo "WARN: ${file} — could not fetch Galaxy API hash (network issue or collection removed)"
              continue
            elif [ -z "$local_hash" ]; then
              echo "ERROR: ${file} — local file missing or unreadable"
              FAIL=1
            elif [ "$api_hash" = "$local_hash" ]; then
              echo "PASS: ${file} matches Galaxy API (${api_hash:0:16}...)"
            else
              echo "ERROR: ${file} — MISMATCH"
              echo "  Galaxy API hash: ${api_hash}"
              echo "  Local file hash: ${local_hash}"
              echo "  ACTION: If expected (manual collection update), run: make vendor-collections"
              FAIL=1
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Collection verification failed. This may indicate:"
            echo "  - Collections were updated but SHA256SUMS not re-generated (run: make vendor-collections)"
            echo "  - Galaxy removed/replaced a collection version (uncommon, contact maintainer)"
            echo "  - Supply chain tampering detected (audit git log, review CI logs, contact maintainers)"
            exit 1
          fi
          echo ""
          echo "All collections verified against Galaxy API."

  all-checks-pass:
    name: All Checks Pass
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - ansible-lint
      - check-vars-sync
      - shell-checks
      - script-integrity
      - vault-encryption
      - collections-integrity
      - syntax-check
      - critical-assertions-guard
      - git-config-guards
      - node-lint
      - gitleaks
      - workflow-security
      - galaxy-recheck
    steps:
      - name: Verify no required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs failed or were cancelled"
          exit 1
