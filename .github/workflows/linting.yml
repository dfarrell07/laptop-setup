---
name: Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install ansible-lint
        run: pip install -r requirements-test.lock

      - name: Create vault password script for CI
        run: cp scripts/vault-pass-ci.sh scripts/vault-pass.sh

      - name: Run ansible-lint
        run: ansible-lint

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install yamllint
        run: pip install -r requirements-test.lock

      - name: Run yamllint
        run: yamllint --strict .

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: |
          shellcheck -S warning scripts/*.sh
          shellcheck -S warning roles/claude/files/*.sh
          shellcheck -S warning .githooks/pre-commit .githooks/commit-msg

      - name: Validate preflight JSON output
        run: bash scripts/preflight.sh --json 2>/dev/null | python3 -c "import json,sys; json.load(sys.stdin)"

      - name: Validate smoke-test JSON output
        run: bash scripts/smoke-test.sh --user-only --json 2>/dev/null | python3 -c "import json,sys; json.load(sys.stdin)"

      - name: Run queue poller unit tests
        run: bash scripts/test-queue-poller.sh

  lockfile-lint:
    name: Lockfile Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate lockfile integrity and registry
        run: |
          python3 -c "
          import json, sys
          lock = json.load(open('package-lock.json'))
          errors = []
          for name, info in lock.get('packages', {}).items():
              if not name:
                  continue
              integrity = info.get('integrity', '')
              resolved = info.get('resolved', '')
              if integrity and not integrity.startswith('sha512-'):
                  errors.append(f'Weak hash ({integrity[:10]}...): {name}')
              if resolved and not resolved.startswith('https://registry.npmjs.org/'):
                  errors.append(f'Non-npmjs registry: {name} -> {resolved}')
              if resolved.startswith(('git://', 'git+', 'ssh://')):
                  errors.append(f'Git protocol dependency (bypasses ignore-scripts): {name}')
          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          print(f'Validated {len(lock.get(\"packages\", {})) - 1} packages: all SHA-512, all npmjs.org, no git deps')
          "

      - name: Install packages for audit
        run: npm ci --ignore-scripts

      - name: Verify npm package signatures
        run: npm audit signatures

      - name: Check for known vulnerabilities
        run: npm audit

  vault-encryption:
    name: Vault Encryption Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure vault files are encrypted
        run: |
          failed=0
          while IFS= read -r f; do
            # shellcheck disable=SC2016
            if head -1 "$f" | grep -q '^\$ANSIBLE_VAULT'; then
              continue
            fi
            # Allow the placeholder stub (no real secrets)
            if grep -q 'vault_placeholder' "$f" && [ "$(grep -E '^vault_' "$f" | grep -cv 'vault_placeholder')" -eq 0 ]; then
              echo "::notice file=${f}::Vault stub (no real secrets) — OK"
              continue
            fi
            echo "::error file=${f}::Unencrypted vault file: ${f}"
            failed=1
          done < <(find . -name '*vault.yml' -not -path './node_modules/*' -not -path './collections/*')
          exit $failed

      - name: Ensure vault is not encrypted with CI dummy password
        run: |
          python3 - <<'PYEOF'
          # Verify no vault file was encrypted with the known CI dummy password.
          # Ansible vault 1.1 AES256 format: vault body = hexlify(hexlify(salt) + b'\n'
          # + hmac_hexdigest_bytes + b'\n' + hexlify(ciphertext)).
          # PBKDF2-HMAC-SHA256(password, salt, 10000, 80) derives: AES key (0:32),
          # HMAC key (32:64), IV (64:80).  HMAC = SHA256(hmac_key, ciphertext).
          import sys, hashlib, hmac as _hmac, binascii, subprocess

          dummy = 'ci-dummy-vault-password'
          result = subprocess.run(
              ['find', '.', '-name', '*vault.yml',
               '-not', '-path', './node_modules/*',
               '-not', '-path', './collections/*'],
              capture_output=True, text=True)
          if result.returncode != 0:
              print(f"find failed: {result.stderr}", file=sys.stderr); sys.exit(1)
          found = result.stdout.splitlines()
          failed = False
          for f in found:
              try:
                  with open(f) as fh:
                      lines = fh.readlines()
              except Exception:
                  continue
              if not lines or not lines[0].startswith('$ANSIBLE_VAULT'):
                  continue
              body = ''.join(l.strip() for l in lines[1:])
              try:
                  inner = binascii.unhexlify(body)
              except Exception:
                  continue
              parts = inner.split(b'\n', 2)
              if len(parts) != 3:
                  continue
              try:
                  salt = binascii.unhexlify(parts[0])
                  stored_hmac = parts[1]
                  ciphertext = binascii.unhexlify(parts[2])
              except Exception:
                  continue
              dk = hashlib.pbkdf2_hmac('sha256', dummy.encode(), salt, 10000, 80)
              computed = _hmac.new(dk[32:64], ciphertext, hashlib.sha256).hexdigest().encode()
              if _hmac.compare_digest(computed, stored_hmac):
                  print(f'::error file={f}::{f} is encrypted with the CI dummy password'
                        ' — re-encrypt using vault-pass.sh')
                  failed = True
          sys.exit(1 if failed else 0)
          PYEOF

  syntax-check:
    name: Ansible Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install Ansible
        run: pip install -r requirements-test.lock

      - name: Install collections (with retry)
        run: |
          for attempt in 1 2 3; do
            ansible-galaxy collection install -r requirements.yml && break
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done

      - name: Create vault password script for CI
        run: cp scripts/vault-pass-ci.sh scripts/vault-pass.sh

      - name: Run syntax check
        run: ansible-playbook site.yml --syntax-check

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run markdownlint
        run: npx --no -- markdownlint-cli2 "**/*.md" "#node_modules" "#collections" "#.claude" "#references"

  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks

      - name: Run gitleaks
        run: ./gitleaks git . --redact --config .gitleaks.toml

  actionlint:
    name: Action Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          chmod +x actionlint

      - name: Run actionlint
        run: ./actionlint -color

  zizmor:
    name: Workflow Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download zizmor
        env:
          ZIZMOR_SHA256: e87b67160194884e375a46a12c57ccc904f762b53845f254fab7f17d98809c09
        run: |
          curl -sSLO https://github.com/zizmorcore/zizmor/releases/download/v1.28.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "${ZIZMOR_SHA256}  zizmor-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar xzf zizmor-x86_64-unknown-linux-gnu.tar.gz zizmor
          chmod +x zizmor

      - name: Run zizmor
        run: ./zizmor .github/workflows/

  commitlint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run commitlint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Check imperative mood
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          # shellcheck disable=SC2046
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            msg=$(git log -1 --format=%s "$sha")
            first=$(echo "$msg" | awk '{print $1}')
            if ! echo "$msg" | grep -qE '^[A-Z]'; then
              echo "::error::Commit $sha: Subject must start with a capital letter"
              failed=1
            fi
            case "$first" in
              Added|Changed|Created|Deleted|Enabled|Disabled|Expanded|\
              Fixed|Implemented|Improved|Merged|Moved|Refactored|\
              Removed|Renamed|Replaced|Resolved|Reverted|Started|\
              Stopped|Updated|Upgraded|\
              Adding|Changing|Creating|Deleting|Enabling|Disabling|\
              Expanding|Fixing|Implementing|Improving|Merging|Moving|\
              Refactoring|Removing|Renaming|Replacing|Resolving|\
              Reverting|Starting|Stopping|Updating|Upgrading)
                echo "::error::Commit $sha: Use imperative mood, not '$first'"
                failed=1 ;;
            esac
          done
          exit $failed

      - name: Check Signed-off-by
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          # shellcheck disable=SC2046
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by:'; then
              echo "::error::Commit $sha is missing Signed-off-by: trailer (use git commit -s)"
              failed=1
            fi
          done
          exit $failed
