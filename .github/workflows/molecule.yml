name: Workstation candidate validation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    name: Validate ${{ matrix.scenario }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - scenario: vm
          runner: ubuntu-22.04
          timeout: 90
    env:
      SKIP_GPG_VERIFY: '1'
    steps:
    - name: Check out signed transport snapshot
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.14'
    - name: Restore and verify exact tracked candidate
      shell: bash
      run: "python3 - <<'PY_SNAPSHOT'\nimport hashlib,io,pathlib,subprocess,tarfile\nparts=sorted(pathlib.Path('.validation-payload').glob('*.part'))\n\
        archive=b''.join(part.read_bytes() for part in parts)\nassert hashlib.sha256(archive).hexdigest() == '052349bcfda25c8fd0c3d1e6f29ad9b1614c7bd4efd2bd031cd8541df20923dd',\
        \ 'Snapshot integrity failure'\ntracked=subprocess.check_output(['git','ls-files','-z']).split(b'\\0')\nfor entry\
        \ in tracked:\n if entry:\n  path=pathlib.Path(entry.decode())\n  if path.is_file() or path.is_symlink(): path.unlink()\n\
        with tarfile.open(fileobj=io.BytesIO(archive),mode='r:gz') as source:\n source.extractall('.',filter='data')\nprint('Verified\
        \ candidate tree: 3713e01cd592d5329aa4c06db9e55dacae09b81f')\nPY_SNAPSHOT\n"
    - name: Set isolated test directories
      shell: bash
      env:
        SCENARIO: ${{ matrix.scenario }}
      run: 'echo "VAGRANT_HOME=$RUNNER_TEMP/validation-vagrant" >> "$GITHUB_ENV"

        echo "MOLECULE_EPHEMERAL_DIRECTORY=$RUNNER_TEMP/molecule-$SCENARIO" >> "$GITHUB_ENV"

        '
    - name: Set up candidate dependencies
      uses: ./.github/actions/ci-setup
    - name: Install pinned hook scanner
      shell: bash
      run: 'python3 scripts/bootstrap-hooks.py

        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        '
    - name: Install Linux test prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: 'sudo apt-get update

        sudo apt-get install -y podman shellcheck

        '
    - name: Install VM prerequisites
      if: matrix.scenario == 'vm'
      shell: bash
      run: "sudo apt-get install -y libvirt-daemon-system qemu-kvm vagrant vagrant-libvirt acl\nsudo systemctl enable --now\
        \ libvirtd\nsudo install -d -m 0755 /var/log/libvirt/qemu\nsudo setfacl -m u:runner:rw /var/run/libvirt/libvirt-sock\n\
        sudo mkdir -p /etc/polkit-1/rules.d\nprintf '%s\n' 'polkit.addRule(function(action, subject) {' '  if (action.id ==\
        \ \"org.libvirt.unix.manage\" && subject.user == \"runner\") return polkit.Result.YES;' '});' | sudo tee /etc/polkit-1/rules.d/50-validation-libvirt.rules\
        \ >/dev/null\nif [ -c /dev/kvm ]; then\n  sudo chmod a+rw /dev/kvm\nelse\n  # Standard hosted runners lack KVM; exercise\
        \ the complete guest under TCG.\n  python3 - <<'PY_VM'\nfrom pathlib import Path\nimport yaml\npath = Path('molecule/vm/molecule.yml')\n\
        config = yaml.safe_load(path.read_text())\nfor platform in config['platforms']:\n    platform.setdefault('provider_raw_config_args',\
        \ []).extend([\n        \"driver = 'qemu'\", \"cpu_mode = 'maximum'\",\n    ])\n    platform.setdefault('provider_raw_config_args',\
        \ []).append(\"serial :type => 'file', :source => {:path => '/var/log/libvirt/qemu/laptop-setup-serial.log'}\")\n\
        \    platform.setdefault('instance_raw_config_args', []).append('vm.boot_timeout = 600')\npath.write_text(yaml.safe_dump(config,\
        \ sort_keys=False))\nPY_VM\nfi\nvirsh -c qemu:///system list --all\n"
    - name: Show native macOS firewall state
      if: matrix.scenario == 'macos'
      shell: bash
      run: 'sudo /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate

        sudo /usr/libexec/ApplicationFirewall/socketfilterfw --getstealthmode

        '
    - name: Run complete Molecule scenario
      shell: bash
      env:
        SCENARIO: ${{ matrix.scenario }}
        GH_TOKEN: ${{ github.token }}
      run: "make .venv\nexport PATH=\"$PWD/.venv/bin:$PATH\"\nif [ \"$SCENARIO\" = vm ]; then\n  scripts/verify-ansible-args.sh\
        \ .venv/bin/molecule test -s vm --destroy never\nelse\n  make \"test-$SCENARIO\"\nfi\n"
    - name: Read disposable guest diagnostics
      if: always() && matrix.scenario == 'vm'
      shell: bash
      run: "for domain in $(virsh -c qemu:///system list --name); do virsh -c qemu:///system dumpxml \"$domain\"; done\nsudo\
        \ tail -n 500 /var/log/libvirt/qemu/laptop-setup-serial.log || true\nvirsh -c qemu:///system list --all || true\n\
        if [ -e \"$MOLECULE_EPHEMERAL_DIRECTORY/inventory\" ]; then\n  export PATH=\"$PWD/.venv/bin:$PATH\"\n  .venv/bin/ansible\
        \ all -e ansible_port=722 -i \"$MOLECULE_EPHEMERAL_DIRECTORY/inventory\" -b -m command -a 'grubby --info=ALL' || true\n\
        \  .venv/bin/ansible all -e ansible_port=722 -i \"$MOLECULE_EPHEMERAL_DIRECTORY/inventory\" -b -m command -a 'journalctl\
        \ -b -u firewalld -u kernel-modules-lockdown --no-pager' || true\n  .venv/bin/ansible all -e ansible_port=722 -i \"\
        $MOLECULE_EPHEMERAL_DIRECTORY/inventory\" -b -m command -a 'grub2-editenv list' || true\n  .venv/bin/ansible all -e\
        \ ansible_port=722 -i \"$MOLECULE_EPHEMERAL_DIRECTORY/inventory\" -b -m command -a 'cat /etc/kernel/cmdline' || true\n\
        \  .venv/bin/ansible all -e ansible_port=722 -i \"$MOLECULE_EPHEMERAL_DIRECTORY/inventory\" -m command -a 'podman\
        \ logs --tail 250 fedora-dev' || true\nfi\n\nif [ -e \"$MOLECULE_EPHEMERAL_DIRECTORY/inventory\" ]; then\n  python3\
        \ - <<'PYDIAG'\nfrom pathlib import Path\nimport yaml\np = Path('molecule/vm/verify.yml')\nplays = yaml.safe_load(p.read_text())\n\
        for play in plays:\n    play['ignore_errors'] = True\nPath('molecule/vm/diagnostic-verify.yml').write_text(yaml.safe_dump(plays,\
        \ sort_keys=False))\nPYDIAG\n  export MOLECULE_PROJECT_DIRECTORY=\"$PWD\"\n  export MOLECULE_SCENARIO_DIRECTORY=\"\
        $PWD/molecule/vm\"\n  .venv/bin/ansible-playbook -i \"$MOLECULE_EPHEMERAL_DIRECTORY/inventory\" -e ansible_port=722\
        \ molecule/vm/diagnostic-verify.yml || true\nfi\n"
    - name: Destroy retained test guest
      if: always() && matrix.scenario == 'vm'
      shell: bash
      run: "if [ -x .venv/bin/molecule ]; then\n  export PATH=\"$PWD/.venv/bin:$PATH\"\n  scripts/verify-ansible-args.sh .venv/bin/molecule\
        \ destroy -s vm\nfi\n"
