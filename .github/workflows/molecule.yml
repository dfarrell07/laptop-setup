name: Workstation candidate validation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    name: Validate ${{ matrix.scenario }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - scenario: macos
          runner: macos-15
          timeout: 60
        - scenario: vm
          runner: ubuntu-22.04
          timeout: 90
    env:
      SKIP_GPG_VERIFY: '1'
    steps:
    - name: Check out signed transport snapshot
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.14'
    - name: Restore and verify exact tracked candidate
      shell: bash
      run: "python3 - <<'PY_SNAPSHOT'\nimport hashlib,io,pathlib,subprocess,tarfile\nparts=sorted(pathlib.Path('.validation-payload').glob('*.part'))\n\
        archive=b''.join(part.read_bytes() for part in parts)\nassert hashlib.sha256(archive).hexdigest() == 'e3634a763a5bba0ab2756f27072e232ce4bbb40c3aec293d05c3c3eef9180260',\
        \ 'Snapshot integrity failure'\ntracked=subprocess.check_output(['git','ls-files','-z']).split(b'\\0')\nfor entry\
        \ in tracked:\n if entry:\n  path=pathlib.Path(entry.decode())\n  if path.is_file() or path.is_symlink(): path.unlink()\n\
        with tarfile.open(fileobj=io.BytesIO(archive),mode='r:gz') as source:\n source.extractall('.',filter='data')\nprint('Verified\
        \ candidate tree: af8fc461a9bcf6b791a243552703daef516219ed')\nPY_SNAPSHOT\n"
    - name: Set isolated test directories
      shell: bash
      env:
        SCENARIO: ${{ matrix.scenario }}
      run: 'echo "VAGRANT_HOME=$RUNNER_TEMP/validation-vagrant" >> "$GITHUB_ENV"

        echo "MOLECULE_EPHEMERAL_DIRECTORY=$RUNNER_TEMP/molecule-$SCENARIO" >> "$GITHUB_ENV"

        '
    - name: Set up candidate dependencies
      uses: ./.github/actions/ci-setup
    - name: Install pinned hook scanner
      shell: bash
      run: 'python3 scripts/bootstrap-hooks.py

        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        '
    - name: Install Linux test prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: 'sudo apt-get update

        sudo apt-get install -y podman shellcheck

        '
    - name: Install VM prerequisites
      if: matrix.scenario == 'vm'
      shell: bash
      run: "sudo apt-get install -y libvirt-daemon-system qemu-kvm vagrant vagrant-libvirt acl\nsudo systemctl enable --now\
        \ libvirtd\nsudo setfacl -m u:runner:rw /var/run/libvirt/libvirt-sock\nsudo mkdir -p /etc/polkit-1/rules.d\nprintf\
        \ '%s\n' 'polkit.addRule(function(action, subject) {' '  if (action.id == \"org.libvirt.unix.manage\" && subject.user\
        \ == \"runner\") return polkit.Result.YES;' '});' | sudo tee /etc/polkit-1/rules.d/50-validation-libvirt.rules >/dev/null\n\
        if [ -c /dev/kvm ]; then\n  sudo chmod a+rw /dev/kvm\nelse\n  # Standard hosted runners lack KVM; exercise the complete\
        \ guest under TCG.\n  python3 - <<'PY_VM'\nfrom pathlib import Path\nimport yaml\npath = Path('molecule/vm/molecule.yml')\n\
        config = yaml.safe_load(path.read_text())\nfor platform in config['platforms']:\n    platform.setdefault('provider_raw_config_args',\
        \ []).extend([\n        \"driver = 'qemu'\", \"cpu_mode = 'maximum'\",\n    ])\n    platform.setdefault('instance_raw_config_args',\
        \ []).append('vm.boot_timeout = 600')\npath.write_text(yaml.safe_dump(config, sort_keys=False))\nPY_VM\nfi\nvirsh\
        \ -c qemu:///system list --all\n"
    - name: Show native macOS firewall state
      if: matrix.scenario == 'macos'
      shell: bash
      run: 'sudo /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate

        sudo /usr/libexec/ApplicationFirewall/socketfilterfw --getstealthmode

        '
    - name: Run complete Molecule scenario
      shell: bash
      env:
        SCENARIO: ${{ matrix.scenario }}
        GH_TOKEN: ${{ github.token }}
      run: 'unset ANSIBLE_LIBRARY ANSIBLE_VARS_PLUGINS ANSIBLE_FILTER_PLUGINS ANSIBLE_LOOKUP_PLUGINS ANSIBLE_CALLBACK_PLUGINS
        PYTHONPATH LD_PRELOAD PYTHONHOME GIT_TEMPLATE_DIR TMPDIR TEMP TMP

        make "test-$SCENARIO"

        '
