---
name: Link Check

on:
  schedule:
    - cron: '41 4 * * 3'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.md'

concurrency:
  group: links
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  links:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download lychee  # Last bumped: 2026-08-05; check https://github.com/lycheeverse/lychee/releases
        env:
          LYCHEE_SHA256: <sha256sum of lychee-x86_64-unknown-linux-gnu.tar.gz>
        run: |
          curl -sSLO https://github.com/lycheeverse/lychee/releases/download/lychee-v0.18.1/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "${LYCHEE_SHA256}  lychee-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar xzf lychee-x86_64-unknown-linux-gnu.tar.gz lychee
          chmod +x lychee

      - name: Check links
        run: |
          ./lychee \
            --no-progress \
            --exclude-path node_modules \
            --exclude-path collections \
            --exclude-path .claude \
            --exclude 'registry\.redhat\.io' \
            --exclude 'code\.engineering\.redhat\.com' \
            --exclude 'gitlab\.cee\.redhat\.com' \
            --exclude 'github\.com/dfarrell07/laptop-setup/security' \
            '**/*.md'

  report:
    name: Create Issue on Failure
    needs: links
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Broken links detected"
          BODY="Link check failed. See run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          EXISTING=$(gh issue list --label documentation --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "documentation" 2>/dev/null || true
          fi
