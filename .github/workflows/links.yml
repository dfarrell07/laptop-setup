---
name: Link Check

on:
  schedule:
    - cron: '41 4 * * 3'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.md'

concurrency:
  group: links
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  links:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --no-progress
            --exclude-path node_modules
            --exclude-path collections
            --exclude-path .claude
            --exclude 'registry\.redhat\.io'
            --exclude 'code\.engineering\.redhat\.com'
            --exclude 'gitlab\.cee\.redhat\.com'
            --exclude 'github\.com/dfarrell07/laptop-setup/security'
            '**/*.md'
          fail: true

  report:
    name: Create Issue on Failure
    needs: links
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue on failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const body = 'Link check failed. See run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'documentation',
              state: 'open',
              creator: 'github-actions[bot]'
            });
            const existing = issues.find(i => i.title === 'Broken links detected');
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Broken links detected',
                body: body,
                labels: ['documentation']
              });
            }
