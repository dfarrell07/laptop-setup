---
name: CI setup
description: Set up Python 3.14, install pip dependencies, and install Ansible collections (with retry)

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: requirements-test.lock

    - name: Install CI dependencies
      run: |
        test -z "${PIP_INDEX_URL:-}" || (echo 'PIP_INDEX_URL must not be set in CI' && exit 1)
        pip install --require-hashes -r requirements-test.lock
      shell: bash

    - name: Audit installed dependencies for known CVEs
      run: pip-audit -r requirements-test.lock --fail-on-vuln
      shell: bash

    - name: Comprehensive collection verification (TOCTOU check before install)
      run: scripts/verify-collections.sh
      shell: bash

    - name: Install Ansible collections from vendored tarballs
      run: |
        cd collections-dist
        sha256sum -c SHA256SUMS
        ansible-galaxy collection install \
          ansible-posix-2.2.2.tar.gz \
          community-general-13.2.0.tar.gz \
          community-library_inventory_filtering_v1-1.1.5.tar.gz \
          containers-podman-1.20.2.tar.gz
      shell: bash

    - name: Create vault password script for CI
      run: cp scripts/vault-pass-ci.sh scripts/vault-pass.sh
      shell: bash
