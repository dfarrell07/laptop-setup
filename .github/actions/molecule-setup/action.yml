---
name: Molecule setup
description: Set up Python 3.13, install pip test dependencies, and install Ansible collections (with retry)

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: requirements-test.lock

    - name: Install test dependencies
      run: pip install -r requirements-test.lock
      shell: bash

    - name: Install Ansible collections (with retry)
      run: |
        for attempt in 1 2 3; do
          ansible-galaxy collection install -r requirements.yml && break
          echo "Attempt $attempt failed, retrying in 15s..."
          sleep 15
        done
      shell: bash
