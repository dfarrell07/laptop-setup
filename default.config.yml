---
# Shipped defaults — override in config.yml (gitignored).
# Uses Geerling's config override pattern:
#   default.config.yml (this file, checked in)
#   config.yml (gitignored, per-machine overrides)
#
# WARNING: Do NOT define vault_* prefixed variables in config.yml.
# Those names are reserved for group_vars/all/vault.yml. config.yml is
# loaded via include_vars (precedence level 17) which outranks group_vars
# (level 4-5), so any vault_* key here would shadow the vault-encrypted
# value silently, leaking secrets in plaintext. A runtime assert in
# site.yml enforces this — it will fail the play if any vault_* key
# appears in config.yml.

# Valid values: work, personal
profile: work
ssh_port: 722  # mirrored in roles/system/defaults/main.yml as a defensive fallback for standalone role invocation
desktop_environment: auto  # CHANGE TO: sway, i3, or gnome on first provision; auto fails before any WM is installed

# ============================================================
# USER IDENTITY — override ALL of these in config.yml
# ============================================================
# These drive git commit attribution, SSH key comments, shell aliases
# that reference your GitHub username, and the notes repo clone URL.
# Without overriding them, you will get commits attributed to
# "Daniel Farrell", aliases pointing to dfarrell07's repos, and a
# notes clone that fails (private repo).
#
dotfiles_github_user: 'CHANGE_ME'
dotfiles_user_name: 'CHANGE_ME'
dotfiles_user_email_work: 'CHANGE_ME'
dotfiles_user_email_personal: 'CHANGE_ME'
system_timezone: CHANGE_ME  # e.g. America/Chicago, Europe/London; run: timedatectl list-timezones

