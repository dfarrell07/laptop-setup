---
# Shipped defaults — override in config.yml (gitignored).
# Uses Geerling's config override pattern:
#   default.config.yml (this file, checked in)
#   config.yml (gitignored, per-machine overrides)

# Valid values: work, personal
profile: work
ssh_port: 722

# Feature toggles (naming: install_<feature>)
install_docker: false
install_vpn: true
install_virtualization: true

# Additional toggles available via role defaults (override in config.yml):
#   system_install_usbguard: true      (roles/system/defaults)
#   system_aide_enabled: true          (roles/system/defaults)
#   system_usbguard_extra_rules: []    (roles/system/defaults) — append per-machine USB rules
#   packages_install_binaries: true    (roles/packages/defaults)
#   desktop_deploy_chrome_policies: true (roles/desktop/defaults)
#   desktop_environment: auto          (roles/desktop/defaults)
#   system_timezone: America/New_York  (roles/system/defaults) — set your local timezone
#   system_locale: en_US.UTF-8        (roles/system/defaults) — set system locale
#   system_disable_bluetooth: false    (roles/system/defaults) — true to blacklist BT modules
#   system_tlp_enabled: true           (roles/system/defaults) — install/enable TLP; disable on non-ThinkPad
#   system_tlp_bat0_start: 20          (roles/system/defaults) — battery charge start threshold %
#   system_tlp_bat0_stop: 80           (roles/system/defaults) — charge stop threshold (20-80% extends Li-ion life)
#   system_keymap: us                  (role default: us) — console keymap for /etc/vconsole.conf
#   system_sysrq: 0                    (roles/system/defaults) — 0=disabled (CIS), 176=emergency recovery
#   containers_kind_log_driver: k8s-file  (roles/containers/defaults) — kind log driver
#   containers_kind_pids_limit: 65536  (roles/containers/defaults) — kind node pids limit
#   desktop_sway_hidpi_scale: "1.0"    (roles/desktop/defaults) — override for HiDPI (e.g. "1.5" for 2560x1600)
#   desktop_sway_output: "eDP-1"       (roles/desktop/defaults) — built-in display identifier
#   desktop_sway_trackpoint_id: ""     (roles/desktop/defaults) — enable TrackPoint scroll (find with swaymsg -t get_inputs)
#   system_lid_switch: suspend         (roles/system/defaults) — action on lid close (suspend/lock/ignore)
#   system_lid_switch_external: lock   (roles/system/defaults) — lid close action when external monitor connected
#   system_lid_switch_docked: ignore   (roles/system/defaults) — lid close action when docked (ignore keeps display on)

# Third-party repos (naming: repo_<name>, dnf-based OS only)
repo_gh_cli: true
repo_google_chrome: true
repo_google_cloud_sdk: true
repo_rpmfusion: true
repo_slack: true
repo_tailscale: true
repo_acli: true
repo_docker_ce: false
repo_mullvad: true
repo_redhat: true

# Container settings
container_name: fedora-dev
container_image: "registry.fedoraproject.org/fedora-toolbox:44"
container_distro: fedora
container_release: "44"
container_replace: false
