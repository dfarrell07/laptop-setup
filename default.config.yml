#   claude_queue_memory_max: '4G'      (roles/claude/defaults) — MemoryMax for queue poller unit; lower on 8 GiB machines
#   claude_queue_cpu_quota: '80%'      (roles/claude/defaults) — CPUQuota for queue poller unit; lower when running kind clusters
#   claude_queue_max_turns: 50  (roles/claude/defaults) — --max-turns cap passed to claude per session; limits runaway sessions
#   claude_queue_timeout: 1800  (roles/claude/defaults) — seconds before SIGTERM is sent to claude process; increase for long-running tasks
#   claude_remote_control_enabled: false  (roles/claude/defaults) — deploy remote-control hooks
#     that allow external triggering of Claude sessions (macOS-only; no-op warning on Linux)
#   claude_enable_all_project_mcp_servers: false  (roles/claude/defaults) — set true to auto-trust
#     all project-local MCP servers; false = prompt per server (more secure)
#   distrobox_enabled: true               (roles/distrobox/defaults) — set false to skip
#     container creation and Play 3 entirely (Linux users who do not want a dev container)
#   Dotfiles / shell preferences (roles/dotfiles/defaults) — override in config.yml:
#   dotfiles_oh_my_zsh_theme: gallois     — oh-my-zsh theme name
#   dotfiles_oh_my_zsh_plugins: [git, kubectl, forgit, python, history-substring-search]  — oh-my-zsh plugin list
#   dotfiles_tmux_prefix: "C-a"           — tmux prefix key (e.g. "C-b" for default)
#   dotfiles_tmux_history_limit: 50000    — tmux scrollback buffer size
#   dotfiles_ssh_agent_timeout: 28800     — ssh-agent key lifetime in seconds (8 h)
#   dotfiles_aws_profile: ""   — AWS CLI named profile (default: ""; e.g. "aws-acm-subm"); empty omits export
#   dotfiles_laptop_tailscale_host: ""  — Tailscale hostname for laptop mosh/tmux alias (e.g. laptop.tail); empty disables
#   dotfiles_mac_tailscale_host: ""  — Tailscale hostname for desktop mosh/tmux alias (e.g. mac-desktop.tail); empty disables
#   dotfiles_internal_git_host: ""        — internal HTTPS git hostname (e.g. git.internal.corp); when set,
#     gitconfig.j2 adds [http "https://<host>"] sslCAInfo pointing to dotfiles_internal_ca_path and
#     ssh_config.j2 adds a Host stanza using id_rsa_redhat for SSH access.
#   dotfiles_internal_ca_path: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem  — CA cert for internal HTTPS hosts
#     (override with a specific anchor, e.g. /etc/pki/ca-trust/source/anchors/RH-IT-Root-CA.pem, to pin to one CA)
#   dotfiles_homebrew_prefix: /opt/homebrew  — macOS Homebrew prefix; Intel Macs use /usr/local
#   ssh_work_keyscan_hosts: []  (roles/ssh/defaults) — work-profile internal git hosts to pre-seed in known_hosts;
#     set in config.yml, e.g. [gitlab.example.com, code.example.com]; empty = no work host keyscan
#   ssh_signing_key_basename: id_ed25519_sk_signing  — basename of the SSH signing key files (no extension)
#   dotfiles_ssh_hardware_key_basename: id_ed25519_sk  — YubiKey auth key stub basename (no extension)
#   dotfiles_ssh_redhat_key_basename: id_rsa_redhat    — Red Hat internal git key basename (no extension)
#   dotfiles_gonosumdb: ""   — GONOSUMDB for internal Go modules (default: ""; e.g. "*.redhat.com,*.engineering.redhat.com")
#   dotfiles_goprivate: ""   — GOPRIVATE for internal Go repos (default: ""; e.g. "gitlab.cee.redhat.com,pkgs.devel.redhat.com")
#   dotfiles_claude_queue_repo: "{{ dotfiles_github_user }}/claude-tasks"  — GitHub repo for cq() alias
#   dotfiles_work_src_dirs: [submariner-io, stolostron, ovnk, konflux, bpfman, ds]  — work org dirs under
#     ~/src/ used for git identity routing (gitconfig.j2 includeIf) and Claude personal guard (zshrc.j2);
#     add new orgs here instead of editing templates
#   ssh_git_signing_pubkey: ""            (group_vars/all/vars.yml) — SSH public key for
#     git commit signing; set in config.yml to the literal pubkey or
#     a lookup('file', ...) expression until vault.yml is populated with vault_ssh_signing_key_pub and encrypted.
#     IMPORTANT: remove ssh_git_signing_pubkey from config.yml after vault.yml is populated with vault_ssh_signing_key_pub
#     and encrypted — config.yml (include_vars precedence 17) silently overrides group_vars (precedence 4-5), so a stale
#     entry here will shadow the vault-backed value without any warning.
#   Binary version pins (roles/packages/defaults and roles/distrobox/defaults) — override in config.yml:
#     packages_kind_version, packages_helm_version, packages_kustomize_version, packages_oc_version,
#     packages_subctl_version: "0.24.0"  (single source of truth for subctl; also governs distrobox container)
#     packages_subctl_versioned: [{version, suffix}]  (go install older versions as subctlXX)
#     packages_subctl_rh_versions: [{tag, image, suffix}]  (RH downstream via oc image extract)
#     packages_operator_sdk_version, and others in roles/packages/defaults/main.yml;
#     distrobox_oc_version, distrobox_golangci_lint_version in roles/distrobox/defaults/main.yml

# Internal Red Hat repo URLs — absent here intentionally (gitignored secrets).
# Set these in config.yml to activate the acli and redhat-internal repo tasks:
#   repos_dnf_acli_baseurl: "https://..."        # acli/rosa CLI internal mirror
#   repos_dnf_redhat_baseurl: "https://..."      # Red Hat internal RPM repo
#   repos_dnf_redhat_gpgkey: "https://..."       # GPG key URL for the above repo
# Without them the tasks are silently skipped (guarded by `is defined`).

# Container settings
# container_image and container_release fall back to the host OS major version
# (e.g. 9 on RHEL 9), which is wrong on RHEL — there is no fedora-toolbox:9.
# RHEL users must override both explicitly in config.yml, e.g.:
#   container_image: 'registry.fedoraproject.org/fedora-toolbox:44'
#   container_release: '44'
#   distrobox_create_timeout: 600       (roles/distrobox/defaults) — seconds before container create is killed; raise on slow networks
