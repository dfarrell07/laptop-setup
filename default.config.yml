#     IMPORTANT: remove ssh_git_signing_pubkey from config.yml after vault.yml is populated with vault_ssh_signing_key_pub
#     and encrypted — config.yml (include_vars precedence 17) silently overrides group_vars (precedence 4-5), so a stale
#     entry here will shadow the vault-backed value without any warning.
#   Binary version pins (roles/packages/defaults and roles/distrobox/defaults) — override in config.yml:
#     packages_kind_version, packages_helm_version, packages_kustomize_version, packages_oc_version,
#     packages_kubebuilder_version, packages_operator_sdk_version, and others in roles/packages/defaults/main.yml;
#     distrobox_oc_version, distrobox_golangci_lint_version in roles/distrobox/defaults/main.yml

system_kexec_load_disabled: 0  # kdump requires kexec; safe here (Secure Boot disabled); CIS default is 1 (see Additional toggles above)
system_ptrace_scope: 0  # gdb -p / dlv attach on own running processes; 0 is Fedora workstation default; CIS default is 1 (see Additional
system_kernel_panic_on_oops: 0  # dev workstation: bpfman/OVN-K non-fatal oops should log-and-continue, not halt the host (CIS default is 1)
system_kernel_panic: 0          # preserve panic state for kdump analysis; kexec_load_disabled=0 already enables kdump (CIS default is 10)
system_faillock_even_deny_root: false  # root lockout on failed logins; root SSH is blocked (PermitRootLogin no), so this adds self-lockout
                                        # risk on sudo mistype without security benefit; CIS default is true

# Third-party repos (naming: repo_<name>, dnf-based OS only)
repo_gh_cli: true  # no-op on Fedora (gh ships in standard repos F43+); only activates on RHEL/Rocky
repo_google_chrome: false  # opt in; nothing auto-installed on Linux and Chrome repo adds dnf metadata overhead
repo_google_cloud_sdk: false  # opt in when gcloud is needed; GCP repo adds metadata overhead on every dnf invocation
repo_rpmfusion_free: true    # Fedora-only; multimedia codecs (H.264/AAC), ffmpeg, VLC; nothing auto-installed
repo_rpmfusion_nonfree: false  # Fedora-only; NVIDIA proprietary drivers, non-free firmware; opt in explicitly
repo_slack: false   # packagecloud Slack RPM repo has gpgcheck=false — opt in explicitly or use Flatpak instead
repo_tailscale: true
repo_acli: true  # no-op without repos_dnf_acli_baseurl in config.yml (internal Red Hat Jira/Confluence CLI mirror)
repo_docker_ce: false  # false: prefer rootless Podman (ships with Fedora); Docker CE conflicts with Podman
repo_mullvad: true  # privacy/anonymity VPN (distinct from Tailscale); Fedora-only, skipped on RHEL/Rocky and CSB
repo_redhat: true
# Internal Red Hat repo URLs — absent here intentionally (gitignored secrets).
# Set these in config.yml to activate the acli and redhat-internal repo tasks:
#   repos_dnf_acli_baseurl: "https://..."        # acli/rosa CLI internal mirror
#   repos_dnf_redhat_baseurl: "https://..."      # Red Hat internal RPM repo
#   repos_dnf_redhat_gpgkey: "https://..."       # GPG key URL for the above repo
# Without them the tasks are silently skipped (guarded by `is defined`).

# Container settings
container_name: fedora-dev
# container_image and container_release track the host Fedora major version.
# Bump both manually when upgrading to a new Fedora release (e.g. 44 → 45).
container_image: "registry.fedoraproject.org/fedora-toolbox:44"
container_distro: fedora
container_release: "44"
container_replace: false
