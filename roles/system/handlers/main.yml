---
- name: Remount /tmp  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "mount -o remount,nosuid,nodev{{ ',noexec' if system_tmp_noexec | bool else '' }} /tmp"
  become: true
  register: _tmp_remount_handler_result
  changed_when: _tmp_remount_handler_result.rc == 0
  failed_when: false
  when: not system_is_container  # noexec on /tmp breaks Ansible temp-dir creation in containers

- name: Warn if /tmp remount failed (handler)
  ansible.builtin.debug:
    msg: "WARNING: remount of /tmp failed (rc={{ _tmp_remount_handler_result.rc }}); live nosuid/nodev options may not be active"
  listen: Remount /tmp
  when:
    - _tmp_remount_handler_result is defined
    - _tmp_remount_handler_result.rc | default(0) != 0

- name: Apply firewall rules
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded
  become: true
  when: not system_is_container  # firewalld reload crashes privileged Podman containers; ignore_errors cannot catch a process death
  ignore_errors: true  # noqa: ignore-errors

- name: Apply sysctl  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: sysctl --system
  become: true
  register: sysctl_system_result
  changed_when: false
  # Keys absent if module not yet loaded (ENOENT) or kernel too old (EINVAL) — tolerate both;
  # write-once keys (EPERM, e.g. kernel.unprivileged_bpf_disabled on Fedora 44) also tolerated
  failed_when: >
    sysctl_system_result.rc != 0 and
    'No such file or directory' not in sysctl_system_result.stderr and
    'invalid argument' not in sysctl_system_result.stderr | lower and
    'permission denied' not in sysctl_system_result.stderr | lower
  when: not system_is_container

- name: Restart tlp
  ansible.builtin.systemd:
    name: tlp
    state: restarted
  become: true
  when: not system_is_container  # TLP not applicable in containers
  ignore_errors: true  # noqa: ignore-errors

- name: Restart NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded
  become: true
  when: not system_is_container  # NM reload crashes privileged Podman containers; ignore_errors cannot catch a process death
  ignore_errors: true  # noqa: ignore-errors

- name: Restart bluetooth
  ansible.builtin.systemd:
    name: bluetooth
    state: restarted
  become: true
  when: not system_is_container  # bluetooth not present in containers
  ignore_errors: true  # noqa: ignore-errors

# Always co-notified with 'Apply firewall rules' (tailscale0 firewalld zone task).
# Tailscaled has no config files managed by this role; zone-change is the only
# trigger. If tailscaled config management is added later, include a notify here.
- name: Restart tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    state: restarted
  become: true
  when: not system_is_container  # tailscale not in containers
  ignore_errors: true  # noqa: ignore-errors

# Must use SysV wrapper, not 'systemctl restart auditd': the SysV script calls
# auditctl to reload rules into the kernel; systemctl sends SIGTERM and skips
# that step, leaving new rules defined in config but not loaded at runtime.
- name: Restart auditd  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: service auditd restart
  become: true
  changed_when: true
  when: not system_is_container  # auditd restart crashes privileged Podman containers; ignore_errors cannot catch a process death
  ignore_errors: true  # noqa: ignore-errors

- name: Restart usbguard
  ansible.builtin.systemd:
    name: usbguard
    state: restarted
  become: true
  when: not system_is_container  # USBGuard not applicable in containers
  ignore_errors: true  # noqa: ignore-errors

- name: Restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted
  become: true
  when: not system_is_container  # sshd restart kills Ansible SSH connection in containers
  ignore_errors: "{{ system_is_container }}"  # noqa: ignore-errors

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  become: true
  when: not system_is_container  # resolved restart crashes privileged Podman containers

- name: Reload logind  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl kill --signal=HUP systemd-logind
  become: true
  changed_when: true
  when: not system_is_container  # logind SIGHUP crashes privileged Podman containers; ignore_errors cannot catch a process death
  ignore_errors: true  # noqa: ignore-errors

- name: Restart chronyd
  ansible.builtin.systemd:
    name: "{{ 'chrony' if is_apt else 'chronyd' }}"
    state: restarted
  become: true
  when: system_chrony_service_enabled | bool  # skip when disabled (container default)

- name: Restart aide-check timer
  ansible.builtin.systemd:
    name: aide-check.timer
    state: restarted
    daemon_reload: true
  become: true
  ignore_errors: "{{ system_is_container }}"  # noqa: ignore-errors
  when:
    - system_aide_enabled | bool
    - not system_is_container  # daemon_reload: true crashes privileged Podman container PID 1; ignore_errors cannot catch a process death

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  become: true
  when: not system_is_container  # journald restart crashes privileged Podman containers; ignore_errors cannot catch a process death
  ignore_errors: true  # noqa: ignore-errors

- name: Apply dconf schema database  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: dconf update
  become: true
  changed_when: true
  # No failed_when: false — handler is only notified from dconf.yml which is
  # guarded by '"gdm.service" in ansible_facts.services', so dconf is always
  # present when this runs. Surface real failures.

- name: Restart dnf-automatic timer
  ansible.builtin.systemd:
    name: "{{ 'dnf5-automatic.timer' if is_dnf5 else 'dnf-automatic.timer' }}"
    state: restarted
    daemon_reload: true
  become: true
  when: not system_is_container  # dnf-automatic not applicable in containers; daemon_reload: true crashes Podman containers
  ignore_errors: true  # noqa: ignore-errors
