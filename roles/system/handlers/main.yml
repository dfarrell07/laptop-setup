---
- name: Apply firewall rules
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded
  become: true
  when: not system_is_container  # firewalld reload crashes privileged Podman containers

- name: Apply sysctl  # noqa: command-instead-of-module
  listen: Sysctl config changed
  ansible.builtin.command:
    cmd: sysctl --system
  become: true
  register: sysctl_system_result
  changed_when: false
  # Keys absent if module not yet loaded (ENOENT) or kernel too old (EINVAL) — tolerate both;
  # write-once keys (EPERM, e.g. kernel.unprivileged_bpf_disabled on Fedora 44) also tolerated
  # Any EPERM line is tolerated; the only expected source is kernel.unprivileged_bpf_disabled
  # (checked and warned about by the handlers below)
  # (Fedora 44 CONFIG_BPF_UNPRIV_DEFAULT_OFF=y locks this to 2 before sysctl.d runs)
  failed_when: >
    sysctl_system_result.rc != 0 and
    (sysctl_system_result.stderr_lines | length == 0 or
    sysctl_system_result.stderr_lines |
    reject('search', 'No such file or directory|invalid argument|permission denied|operation not permitted', ignorecase=True) |
    list | length > 0)
  when: not system_is_container

# kernel.unprivileged_bpf_disabled can be write-locked by the kernel (CONFIG_BPF_UNPRIV_DEFAULT_OFF
# or a prior value of 1), so sysctl --system may leave it different from the intended value.
- name: Read kernel.unprivileged_bpf_disabled after applying sysctl
  ansible.builtin.slurp:
    src: /proc/sys/kernel/unprivileged_bpf_disabled
  register: _handler_bpf_unpriv
  listen: Sysctl config changed
  become: true
  failed_when: false
  when: not system_is_container

- name: Warn when kernel.unprivileged_bpf_disabled differs from the intended value
  ansible.builtin.debug:
    msg: >-
      WARNING: kernel.unprivileged_bpf_disabled is
      {{ _handler_bpf_unpriv.content | b64decode | trim }}, intended {{ system_unprivileged_bpf_disabled }};
      the kernel may lock this value until reboot.
  listen: Sysctl config changed
  when:
    - not system_is_container
    - _handler_bpf_unpriv.content is defined
    - (_handler_bpf_unpriv.content | b64decode | trim) != (system_unprivileged_bpf_disabled | string)

- name: Restart NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded
  become: true
  when: not system_is_container  # NM reload crashes privileged Podman containers

- name: Restart bluetooth
  ansible.builtin.systemd:
    name: bluetooth
    state: restarted
  become: true
  when: not system_is_container  # bluetooth not present in containers
  ignore_errors: true  # noqa: ignore-errors

# Always co-notified with 'Apply firewall rules' (tailscale0 firewalld zone task).
# Tailscaled has no config files managed by this role; zone-change is the only
# trigger. If tailscaled config management is added later, include a notify here.
- name: Restart tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    state: restarted
  become: true
  when:
    - not system_is_container
    - (ansible_facts.services | default({}))['tailscaled.service'] is defined
    - (ansible_facts.services | default({}))['tailscaled.service'].state == 'running'

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: not system_is_container  # daemon_reload: true crashes privileged Podman containers; ignore_errors cannot catch a process death

# Use augenrules --load instead of 'service auditd restart' to minimize the
# audit rule gap: a full daemon restart calls auditctl -D (clears all rules)
# then waits for the process to stop/start before repopulating, leaving a
# ~1-3 second window with no kernel audit rules active. augenrules --load
# compiles rules and feeds them to the running daemon directly, reducing the
# gap to the sub-second auditctl apply time. The compiled ruleset still begins
# with -D so a brief clear is unavoidable, but daemon-restart overhead is gone.
- name: Restart auditd  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: augenrules --load
  become: true
  register: _auditd_reload
  changed_when: true
  # With '-e 2' (immutable) loaded at boot, rule changes are refused until the next reboot;
  # the new rules are already in /etc/audit/rules.d and load then.
  failed_when:
    - _auditd_reload.rc != 0
    - _auditd_reload.stderr is not search('(?i)immutable|Operation not permitted')
  when: not system_is_container  # kernel audit control is unavailable in container scenarios

- name: Report audit rules pending reboot (immutable mode)
  ansible.builtin.debug:
    msg: "NOTE: audit rules are immutable until reboot; the updated rules load at the next boot."
  listen: Restart auditd
  when:
    - not system_is_container
    - _auditd_reload is defined
    - _auditd_reload.rc | default(0) != 0

- name: Reload auditd configuration  # noqa: command-instead-of-module
  ansible.builtin.command:
    argv: [auditctl, --signal, reload]
  become: true
  changed_when: true
  when: not system_is_container

- name: Restart usbguard
  ansible.builtin.systemd:
    name: usbguard
    state: restarted
  become: true
  when: not system_is_container  # USBGuard not applicable in containers
  register: _handler_usbguard_restart
  # check mode never writes the unit or installs its package, so a missing unit is expected there
  failed_when:
    - _handler_usbguard_restart is failed
    - not (ansible_check_mode and 'Could not find the requested service' in (_handler_usbguard_restart.msg | default('')))

- name: Restart sshd
  ansible.builtin.systemd:
    name: "{{ 'ssh' if is_apt else 'sshd' }}"
    state: reloaded
  become: true
  when:
    - not system_is_container  # sshd restart kills Ansible SSH connection in containers
    - ansible_connection != 'ssh' or
      (_pf_is_molecule | default(false) | bool) or
      lookup('env', 'TMUX') != '' or
      lookup('env', 'STY') != ''
      # SSH-based provisioning: sshd reload on port change kills Ansible connection mid-play.
      # tmux/screen sessions survive sshd restart (sshd.yml fails fast on bare SSH port-22 sessions; same TMUX/STY check).
      # Bare SSH sessions block reload to prevent mid-play connection loss.

- name: Warn on sshd handler skip
  ansible.builtin.debug:
    msg: |
      WARNING: sshd reload skipped (bare SSH provisioning session detected, no tmux/screen).
      sshd config changes written but not applied. Current sshd still on port {{ ansible_port | default(22) }}.
      Changes take effect after manual reboot or: systemctl reload sshd
      Next SSH connection must use port {{ ssh_port | default(722) }}.
      To enable automatic reload: run provisioning inside tmux or GNU screen.
  listen: Restart sshd
  when:
    - not system_is_container
    - ansible_connection == 'ssh'
    - not (_pf_is_molecule | default(false) | bool)
    - lookup('env', 'TMUX') == ''
    - lookup('env', 'STY') == ''

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  become: true
  when: not system_is_container  # resolved restart crashes privileged Podman containers

- name: Reload logind  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl kill --signal=HUP systemd-logind
  become: true
  changed_when: true
  when: not system_is_container  # logind SIGHUP crashes privileged Podman containers

- name: Restart chronyd
  ansible.builtin.systemd:
    name: "{{ 'chrony' if is_apt else 'chronyd' }}"
    state: restarted
  become: true
  when: system_chrony_service_enabled | bool  # skip when disabled (container default)

- name: Restart setuid-scan timer
  ansible.builtin.systemd:
    name: setuid-scan.timer
    state: restarted
    daemon_reload: true
  become: true
  when:
    - system_setuid_scan_enabled | bool
    - not system_is_container  # daemon_reload: true crashes privileged Podman container PID 1
  register: _handler_setuid_timer_restart
  # check mode never writes the unit or installs its package, so a missing unit is expected there
  failed_when:
    - _handler_setuid_timer_restart is failed
    - not (ansible_check_mode and 'Could not find the requested service' in (_handler_setuid_timer_restart.msg | default('')))

- name: Restart aide-check timer
  ansible.builtin.systemd:
    name: aide-check.timer
    state: restarted
    daemon_reload: true
  become: true
  when:
    - system_aide_enabled | bool
    - not system_is_container  # daemon_reload: true crashes privileged Podman container PID 1; ignore_errors cannot catch a process death
  register: _handler_aide_timer_restart
  # check mode never writes the unit, so a missing unit is expected there
  failed_when:
    - _handler_aide_timer_restart is failed
    - not (ansible_check_mode and 'Could not find the requested service' in (_handler_aide_timer_restart.msg | default('')))

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  become: true
  when: not system_is_container  # journald restart crashes privileged Podman containers

- name: Apply dconf schema database  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: dconf update
  become: true
  changed_when: true
  # No failed_when: false — handler is only notified from dconf.yml which is
  # included from main.yml only when '"gdm.service" in ansible_facts.services', so dconf is always
  # present when this runs. Surface real failures.

- name: Restart dnf-automatic timer
  ansible.builtin.systemd:
    name: "{{ 'dnf5-automatic.timer' if is_dnf5 else 'dnf-automatic.timer' }}"
    state: restarted
    daemon_reload: true
  become: true
  when: not system_is_container  # dnf-automatic not applicable in containers; daemon_reload: true crashes Podman containers
  register: _handler_dnf_automatic_restart
  # check mode never writes the unit or installs its package, so a missing unit is expected there
  failed_when:
    - _handler_dnf_automatic_restart is failed
    - not (ansible_check_mode and 'Could not find the requested service' in (_handler_dnf_automatic_restart.msg | default('')))

- name: Regenerate GRUB configuration  # noqa: command-instead-of-module
  ansible.builtin.shell: |
    set -e
    {{ 'grub2-mkconfig -o /boot/grub2/grub.cfg' if is_dnf else 'grub-mkconfig -o /boot/grub/grub.cfg' }}
    # Patch recovery entries with --users root (CIS 1.4.2)
    if [ -x /etc/grub.d/41_protect_entries ]; then
      /etc/grub.d/41_protect_entries
    fi
  become: true
  changed_when: true
  when: not system_is_container  # GRUB not applicable in containers
  # Never ignore handler errors — failure surfaces missing grub-mkconfig (CIS 1.4.2 bypass risk)
  # Post-processing with 41_protect_entries ensures recovery entries remain protected across kernel updates
