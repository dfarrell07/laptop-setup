---
- name: Remount /tmp  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: mount -o remount,nosuid,nodev,noexec /tmp
  changed_when: true
  failed_when: false

- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
  failed_when: false  # bridge/conntrack keys absent if br_netfilter/nf_conntrack not yet loaded

- name: Reload firewalld
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true

- name: Restart tlp
  ansible.builtin.systemd:
    name: tlp
    state: restarted
  failed_when: false

- name: Restart tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    state: restarted
  failed_when: false

- name: Restart auditd  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: service auditd restart
  changed_when: true

- name: Restart usbguard
  ansible.builtin.systemd:
    name: usbguard
    state: restarted
  failed_when: false

- name: Restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: Reload NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded
  failed_when: false

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  failed_when: false

- name: Restart logind  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl kill --signal=HUP systemd-logind
  changed_when: true
  failed_when: false

- name: Restart chronyd
  ansible.builtin.systemd:
    name: chronyd
    state: restarted
  failed_when: false

- name: Restart aide-check timer
  ansible.builtin.systemd:
    name: aide-check.timer
    state: restarted
    daemon_reload: true
  failed_when: false

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  failed_when: false

- name: Run dconf update  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: dconf update
  changed_when: true
  failed_when: false

- name: Restart dnf-automatic timer
  ansible.builtin.systemd:
    name: "{{ 'dnf5-automatic.timer' if ansible_pkg_mgr == 'dnf5' else 'dnf-automatic.timer' }}"
    state: restarted
    daemon_reload: true
  failed_when: false

- name: Reinitialize AIDE database
  ansible.builtin.shell:  # noqa: command-instead-of-module
    cmd: aide --init && mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
  changed_when: true
  failed_when: false
  when: system_aide_enabled | bool
  # Triggered when aide.conf paths change so new entries take effect immediately.
  # Without this, added paths are written to the config but the database never
  # includes them until a manual 'aide --init'.
