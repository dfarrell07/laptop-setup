---
profile: work  # fallback for standalone invocation

# Sysctl hardening values
system_sysctl_hardening:
  # kernel.yama.ptrace_scope: merged via system_ptrace_scope combine() in tasks.yml
  kernel.kptr_restrict: 1          # CIS — hide kernel pointer addresses from /proc (reduces KASLR bypass surface)
  # kernel.io_uring_disabled: merged via system_io_uring_disabled combine() in tasks.yml
  # kernel.unprivileged_bpf_disabled: merged via system_unprivileged_bpf_disabled combine() in tasks.yml
  # Fedora 44 kernel compile-time default; pinned here to prevent /etc/sysctl.d override
  kernel.dmesg_restrict: 1         # CIS — restrict dmesg/kmsg to CAP_SYSLOG; prevents boot info leakage
  kernel.perf_event_paranoid: 2    # Fedora 44 default; all perf_event_open requires CAP_PERFMON
  # set 1 in config.yml via system_sysctl_extra for host-side profiling (user-space perf without CAP_PERFMON)
  # value 3 = requires CAP_SYS_ADMIN (strictest)
  kernel.randomize_va_space: 2  # CIS 1.5.2 — full ASLR (stack, heap, mmap); explicit to survive conflicting sysctl.d drop-ins
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0   # CIS — IPv4 source routing off; pinned to block sysctl.d override
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv6.conf.all.accept_source_route: 0   # CIS — IPv6 source routing off; pinned to block sysctl.d override
  net.ipv6.conf.default.accept_source_route: 0
  # `all.rp_filter` reset to 0 by Fedora 50-default.conf (line 27: `-net.ipv4.conf.all.rp_filter`
  # clears after `*.rp_filter=2` wildcard). Setting 2 here makes all.rp_filter a floor:
  # max(all=2, per-iface) ensures no interface drops below loose mode even if sysctl_extra
  # sets a per-iface value to 0.
  net.ipv4.conf.all.rp_filter: 2  # kernel uses max(all, per-iface)
  # loose mode; duplicates 50-default.conf but pinned in 90-hardening.conf to prevent third-party /etc/sysctl.d override
  net.ipv4.conf.default.rp_filter: 2  # applies to newly created interfaces
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  # net.ipv6.conf.all/default.accept_ra: merged via system_ipv6_accept_ra combine() in tasks.yml
  fs.suid_dumpable: 0           # CIS — prevent SUID processes from writing core dumps (avoids privileged memory leaks)
  # kernel.core_pattern: merged via system_core_pattern combine() in tasks.yml
  # Fedora 44 kernel compile-time defaults; pinned here to prevent /etc/sysctl.d override
  net.ipv4.icmp_echo_ignore_broadcasts: 1  # CIS
  net.ipv4.icmp_ignore_bogus_error_responses: 1  # CIS
  fs.protected_regular: 2    # CIS — value 2 covers world+group-writable sticky dirs (value 1 = world-writable only; Fedora default)
  # kernel.panic: merged via system_kernel_panic combine() in tasks.yml
  # kernel.panic_on_oops: merged via system_kernel_panic_on_oops combine() in tasks.yml
  # Fedora 44 kernel compile-time default; pinned here to prevent /etc/sysctl.d override
  net.ipv4.tcp_syncookies: 1       # CIS 3.3.8 — pinned to kernel default (1); guards against third-party sysctl.d override
  # net.ipv4.tcp_timestamps: kept at kernel default (1); CIS 3.3.9 recommends 0, but 0 harms RTTM/PAWS on OVN-K/Submariner high-BDP links
  net.ipv4.tcp_rfc1337: 1         # CIS — prevent TIME-WAIT assassination (RST injection into expiring connections)
  # kernel.kexec_load_disabled: merged via system_kexec_load_disabled combine() in tasks.yml
  # kernel.sysrq: merged via system_sysrq combine() in tasks.yml
  # net.core.bpf_jit_harden: merged via system_bpf_jit_harden combine() in tasks.yml
  fs.inotify.max_user_watches: 1048576
  fs.inotify.max_user_instances: 8192
  # net.ipv4.ip_forward: merged via system_enable_ip_forward combine() in tasks.yml
  # net.ipv6.conf.all.forwarding: merged via system_enable_ip_forward combine() in tasks.yml
  # br_netfilter may not be loaded on a fresh install; sysctl.yml allows ENOENT on apply,
  # and kernel_modules_kind.yml loads br_netfilter then re-runs sysctl --system to complete activation.
  net.bridge.bridge-nf-call-iptables: 1   # required for OVN-K/Kubernetes: bridges pod traffic through iptables for NetworkPolicy
  net.bridge.bridge-nf-call-ip6tables: 1  # required for OVN-K/Kubernetes: same for IPv6 pod traffic
  # IPv6 privacy extensions: use_tempaddr=2 enables temporary (privacy) addresses for outbound connections.
  # Harmless when SLAAC is disabled (system_ipv6_accept_ra=0); required when SLAAC is enabled
  # (system_ipv6_accept_ra=2) to prevent MAC-derived EUI-64 address leakage.
  net.ipv6.conf.all.use_tempaddr: 2
  net.ipv6.conf.default.use_tempaddr: 2
  # Fedora 41+ default (IncreaseVmMaxMapCount); duplicates /usr/lib/sysctl.d/10-map-count.conf exactly.
  # Pinned here so 90-hardening.conf wins lexicographically and continuity is preserved if 10-map-count.conf changes.
  vm.max_map_count: 1048576

# Firewall
# True on standard Fedora and Fedora hybrid (csb_detected, not RHEL). False on RHEL CSB (csb_rhel) where IT manages zone policy.
# Override in config.yml to force-enable or force-disable zone management.
system_firewall_manage_zone: "{{ not csb_rhel }}"
system_firewall_csb_zone: "redhat"  # CSB-provisioned firewalld zone for hybrid Fedora CSB; VPN tun0 uses this zone

system_firewall_icmp_types:
  - destination-unreachable  # covers fragmentation-needed (IPv4 subset); no separate entry needed
  - packet-too-big
  - time-exceeded
  - parameter-problem
  - neighbour-solicitation  # Required for IPv6 NDP — conntrack does not track NS/NA
  - neighbour-advertisement  # Required for IPv6 NDP — without this, MAC resolution fails

# Additional ICMP types merged with system_firewall_icmp_types at apply time.
# With icmp-block-inversion enabled, adding an icmp-block ALLOWS that type through drop zone.
# echo-request (ping) is NOT in the default list — it allows global pingability from the drop
# zone which is overly permissive for most hosts. Add it here only on machines where OVN-K/kind
# pod-to-host-gw connectivity testing requires ping reachability.
# Example: system_firewall_icmp_extra_types: [echo-request]
system_firewall_icmp_extra_types: []

# Core dumps
system_coredump_storage: external  # external=compressed files in /var/lib/systemd/coredump/ (Fedora default, gdb/dlv friendly);
# 'none' disables collection entirely; 'journal' embeds core in journald (adds size pressure, requires extra extraction step)
system_coredump_process_size_max: 2G  # max core dump size; 0 disables collection; 2G matches systemd upstream default

# USBGuard
system_install_usbguard: true
system_usbguard_whitelist:
  - "allow id 1050:* name \"YubiKey*\" with-interface one-of { 03:*:* 0B:*:* }"
  - "allow id 3297:1969 name \"Moonlander*\" with-interface one-of { 03:*:* }"
  # Retained for Intel-based hardware where ACPI tables populate hardwired correctly.
  # Interface class restriction excludes mass storage (08) and unexpected classes.
  # NOTE: AMD machines (ThinkPad P16v Gen 1) report internal ports as 'not used',
  # not 'hardwired'; this rule is a no-op on those hosts. Add per-device VID:PID
  # rules via system_usbguard_extra_rules in config.yml for AMD internal devices.
  - "allow with-connect-type \"hardwired\" with-interface one-of { 03:*:* 09:*:* 0E:*:* 01:*:* E0:01:01 FF:*:* }"
  # STM32 DFU bootloader — Moonlander firmware flashing (Wally/qmk flash).
  # Re-enumerates as VID 0483:df11 when reset button pressed or QK_BOOT keycode used.
  - "allow id 0483:df11 name \"DFU in FS Mode\" with-interface one-of { FE:01:* }"

# Machine-specific additional whitelist rules merged with the above.
# Set in config.yml (gitignored) to add device-specific rules without
# replacing the whole base list. Example:
#   system_usbguard_extra_rules:
#     - 'allow id 1234:5678 name "My USB Hub"'
system_usbguard_extra_rules: []

# Locale, timezone, keymap
system_locale: en_US.UTF-8
system_keymap: us
system_logind_idle_sec: 300   # seconds of inactivity before logind locks the session

# AIDE file integrity monitoring
system_aide_enabled: false  # 5-10 min init on first provision; enable only when monitoring results
# Paths added to /etc/aide.conf as 'NORMAL' entries with insertbefore: '^/etc\s'.
# Override in config.yml to add or remove monitored paths without editing tasks.
system_aide_monitoring_etc_paths:
  - /etc/ssh/sshd_config.d      # sshd hardening drop-ins
  - /etc/NetworkManager/conf.d   # MAC randomization and DNS policy
  - /etc/systemd/resolved.conf.d # DNS-over-TLS policy
  - /etc/systemd/logind.conf.d   # session timeout policy
  - /etc/systemd/journald.conf.d # log persistence policy
  - /etc/systemd/coredump.conf.d # coredump config integrity
  - /etc/systemd/system          # systemd hardening units
  - /etc/crypto-policies         # system-wide crypto algorithm enforcement
  - /etc/selinux                 # SELinux policy directory
  - /etc/bpfman                  # eBPF program manager config
  - /etc/sysctl.d                # kernel hardening parameters
  - /etc/kernel                  # kernel cmdline parameters (next-boot install)
  - /etc/audit                   # auditd rules integrity
  - /etc/modprobe.d              # kernel module blacklist integrity
  - /etc/sudoers.d               # sudo policy integrity
  - /etc/aide.conf               # self-reference: detect config tampering
  - /etc/dconf                   # GNOME system hardening policy

# AIDE check schedule
system_aide_check_calendar: '*-*-* 05:00:00'  # OnCalendar for aide-check.timer; override in config.yml

# TLP battery charge management (ThinkPad — applied via /etc/tlp.d/ drop-in)
# Auto-detected from ansible_facts['form_factor'] (Notebook/Portable/Laptop = true, Desktop = false).
# Override in config.yml: system_tlp_enabled: true/false
system_tlp_enabled: "{{ ansible_facts['form_factor'] is defined and ansible_facts['form_factor'] in ['Notebook', 'Portable', 'Laptop'] }}"
system_tlp_bat0_start: 20   # start charging when battery drops below this %
system_tlp_bat0_stop: 80    # stop charging at this % (Li-ion longevity: keep 20-80%)
system_tlp_platform_profile_ac: performance   # ACPI platform profile on AC (performance/balanced/low-power)
system_tlp_platform_profile_bat: balanced     # ACPI platform profile on battery
system_tlp_cpu_energy_policy_ac: balance_performance   # CPU EPP on AC (balance_performance/performance/power/balance_power)
system_tlp_cpu_energy_policy_bat: balance_power        # CPU EPP on battery (balance_power reduces TDP)

# Logind
system_lid_switch: suspend
system_lid_switch_external: lock
system_lid_switch_docked: ignore
# CUPS socket activation: mask cups.socket and cups.path so socket activation cannot
# restart the CUPS daemon even when cups.service is disabled. Set false only if a
# Flatpak print dialog is required on this machine.
system_disable_printing: true
# CIS 2.1.5: disable BT on machines with no BT peripherals. Default false (enabled) —
# required for ThinkPad P16v AMD Bluetooth mouse. Set true in config.yml to blacklist BT.
system_disable_bluetooth: false
system_disable_thunderbolt: false  # set true to blacklist thunderbolt/thunderbolt_net on machines with no Thunderbolt peripherals
# install/start bolt; false on VMs and containers
# authoritative value in group_vars/all/vars.yml; kept here for standalone molecule invocability
system_bolt_enabled: "{{ ansible_facts['virtualization_role'] | default('host') == 'host' }}"
system_disable_sctp: false  # authoritative value in group_vars/all/vars.yml; kept here for standalone molecule invocability
system_bluetooth_privacy: device   # BlueZ Privacy= in /etc/bluetooth/main.conf; 'off' to disable
system_bluetooth_name: "Bluetooth"  # BlueZ Name= in /etc/bluetooth/main.conf; shown to Bluetooth scanners
system_disable_fingerprint: true  # mask fprintd — set false in config.yml to enable fingerprint auth
system_mask_abrt: true  # mask ABRT crash reporter daemons — redundant with systemd-coredump; set false on RHEL CSB (guard in task)
# SysRq bitmask: 0=disabled (CIS), 176=sync(16)+remount-ro(32)+reboot(128) for kernel dev/recovery.
# Dangerous bits omitted from 176: raw-console(4), process-signalling(64), crash/dump(8).
# Set in config.yml — e.g. system_sysrq: 176 on a ThinkPad used for OVN-K kernel debugging.
system_sysrq: 0  # authoritative value in group_vars/all/vars.yml; kept here for standalone molecule invocability

# IPv6 Router Advertisement acceptance: 0=disabled (CIS — prevents SLAAC).
# To enable SLAAC: set system_ipv6_accept_ra: 2 in config.yml (value 2, NOT 1).
# The Linux kernel suppresses RA processing when accept_ra<=1 AND forwarding=1 (always
# set by this playbook for Kubernetes/OVN-K). Only value 2 accepts RAs with forwarding=1.
system_ipv6_accept_ra: 0
# BPF JIT hardening: 1=constant blinding for unprivileged users only (default here;
# value 2=blind all callers including root — breaks bpftool prog dump jited).
# Set 2 in config.yml for strict CIS/STIG compliance if you don't need JIT inspection.
system_bpf_jit_harden: 1  # authoritative value in group_vars/all/vars.yml; kept here for standalone molecule invocability
# Unprivileged BPF: 1=block unprivileged users but root can re-enable at runtime (default here;
# needed for bpfman/bpftrace debugging). Value 2=write-once locked (root cannot re-enable).
# Value 0=allow all (insecure). Value 2=write-once Fedora 44 default (CONFIG_BPF_UNPRIV_DEFAULT_OFF=y);
# value 1 is not achievable on stock Fedora 44 — requires custom kernel (CONFIG_BPF_UNPRIV_DEFAULT_OFF=n).
# Override in config.yml if needed.
system_unprivileged_bpf_disabled: 2  # authoritative value in group_vars/all/vars.yml; kept here for standalone molecule invocability
system_enable_ip_forward: true  # set false on terminal-only hosts without Kubernetes/kind or Tailscale subnet routing
# OVN-K/Submariner performance tuning (profile: work only); not security hardening.
# nf_conntrack_max: 4x kernel default (131072); rmem_max/wmem_max: 16 MiB (~80x kernel default 212992 bytes).
# Override in config.yml: providing any value replaces this default entirely, so include these keys
# explicitly when adding machine-specific sysctls on a work-profile host that needs OVN-K tuning.
# Run 'make all' to deploy; values take effect immediately via sysctl --system without a reboot.
# Example: system_sysctl_extra: { "net.netfilter.nf_conntrack_max": 524288, "vm.swappiness": 10 }
_system_sysctl_work_defaults:
  net.netfilter.nf_conntrack_max: 524288
  net.core.rmem_max: 16777216
  net.core.wmem_max: 16777216
system_sysctl_extra: "{{ _system_sysctl_work_defaults if profile == 'work' else {} }}"
system_disable_usb_storage: true  # kernel-blocks usb_storage/uas; set false if USB drives needed; authoritative in group_vars/all/vars.yml
system_disable_udf: true          # kernel-blocks udf module; set false if UDF media needed; authoritative in group_vars/all/vars.yml
# Core dump handling: systemd-coredump (Fedora default) routes crashes to journalctl -b 0 -u systemd-coredump
# and stores compressed in /var/lib/systemd/coredump/. Set to '|/bin/false' in config.yml to discard all
# core dumps (CIS strict), or '' to use kernel default (%e.%p.%s.core in cwd). fs.suid_dumpable=0 prevents
# SUID processes from dumping regardless of core_pattern.
# The default value duplicates /usr/lib/sysctl.d/50-coredump.conf intentionally — writing it to
# 90-hardening.conf anchors it against third-party drop-ins that might modify core_pattern
# (sysctl.d uses lexicographic ordering; 90- wins over any competing file except 99-*).
system_core_pattern: "|/usr/lib/systemd/systemd-coredump %P %u %g %s %t %c %h %d %F"
system_io_uring_disabled: 1  # 1=CAP_SYS_ADMIN only; set 2 to disable globally; authoritative in group_vars/all/vars.yml
# Kernel lockdown mode: 'integrity' blocks loading unsigned kernel modules and some
# debug interfaces (debugfs under lockdown). Set '' to disable, or 'confidentiality'
# for stronger (but more restrictive) mode. bpfman core unaffected; bpftrace requires
# 'integrity' or '' (not 'confidentiality'). Set '' in config.yml if lockdown breaks
# debugging workflows (KGDB, /sys/kernel/debug access, etc.).
system_kernel_lockdown: integrity

# Identity fallbacks — site.yml always sets these via set_fact from env,
# but role defaults guard against standalone invocation or empty env vars.
# An empty real_user_id would produce AllowUsers with no token in sshd,
# locking out all users on the next sshd restart.
# Must use lookup('env') not ansible_facts['user_id']/dir: those Ansible facts
# resolve to root/root when the role runs with become: true at play level.
real_user_home: "{{ lookup('env', 'HOME') }}"
real_user_id: "{{ lookup('env', 'USER') }}"

# Fallback for standalone invocation — site.yml loads default.config.yml first.
# Must match ssh_port in default.config.yml (currently 722); update both together.
ssh_port: 722
system_ssh_max_sessions: 10  # max concurrent SSH sessions per connection; 2 is too low for VS Code Remote SSH
system_ssh_channel_timeout: ""  # disabled: sshd 10.2p1 (Fedora 44) has bz3827 — UnusedConnectionTimeout fires immediately after
system_ssh_unused_connection_timeout: 600  # seconds before idle connection with no channels is closed (0 to disable)
system_ssh_allow_agent_forwarding: "no"  # set 'yes' to forward ssh-agent to remote hosts (prefer ProxyJump instead)
system_ssh_allow_tcp_forwarding: "local"  # 'local' for -L tunnels (VS Code); 'yes' for both -L and -R; 'no' to disable
# authoritative in group_vars/all/vars.yml; here for standalone molecule invocability
ssh_pubkey_accepted_algorithms: [sk-ssh-ed25519@openssh.com, sk-ssh-ed25519-cert-v01@openssh.com, ssh-ed25519]

# DNS-over-TLS (systemd-resolved). Deployed to /etc/systemd/resolved.conf.d/99-dot.conf on non-CSB Linux.
# opportunistic: tries TLS, falls back to plain UDP/TCP 53 (default — safe on restricted networks)
# yes: mandatory TLS — DNS fails completely on networks blocking port 853; only use on fully controlled networks
system_dot_mode: opportunistic
system_dns_primary: >-
  1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com
  2606:4700:4700::1111#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com
system_dns_fallback: "9.9.9.9#dns.quad9.net 8.8.8.8#dns.google"
# ~. = catch-all required for Tailscale MagicDNS; VPN routing domains (redhat.com, ts.net) always win by specificity
system_dns_domains: "~."

# Crypto policy target for update-crypto-policies (Fedora/RHEL non-CSB only).
# Override in config.yml, e.g. system_crypto_policy_target: DEFAULT:NO-SHA1:NO-RSASSA-PSS
system_crypto_policy_target: DEFAULT:NO-SHA1

# /tmp mount hardening (CIS 1.1.2.x): noexec,nosuid,nodev via systemd drop-in.
# Set false if non-Go dev tools (pip, cargo, etc.) need to exec from /tmp; nosuid/nodev are preserved.
system_tmp_noexec: true
# /var/tmp bind-mount hardening (CIS 1.1.8): binds /var/tmp to /tmp with noexec,nosuid,nodev.
# Default false: the bind-mount makes /var/tmp a tmpfs alias of /tmp — all contents are silently
# lost on reboot, breaking dracut on kernel updates (FHS requires /var/tmp to persist across boots).
# Set true only on hardened, non-development hosts where /var/tmp persistence is not required.
system_var_tmp_noexec: false
# /home nosuid force: on RHEL CSB-detected machines the nosuid tasks are skipped because
# IT-managed NFS/autofs home directories may break with nosuid. Set true in config.yml
# when /home is a known local mount on a RHEL CSB machine and nosuid is safe to apply.
# NOTE: on Fedora hybrid (csb_detected=true, Fedora distribution), nosuid is applied
# regardless of this flag — /home is a local btrfs partition and nosuid is always safe.
system_home_nosuid_force: false
# SELinux enforcement assertion: set false only in container CI environments where the
# container image reports SELinux as disabled regardless of host policy (e.g., geerlingguy
# Rocky images in Podman). On real hosts, leave true — the assert catches mis-configured
# hosts before security-sensitive tasks run.
# CI gap: SELinux enforcement is NOT verified by Podman-based scenarios when set false.
system_selinux_enforcing_required: true
# LUKS keyfile cleanup: set true ONLY if this machine does NOT use rd.luks.key for
# LUKS auto-unlock (i.e., no keyfile partition — the stale param just leaks the LUKS UUID).
# If rd.luks.key is active and you set this true, the machine will require manual LUKS
# passphrase entry on every reboot after provisioning. Default: false (preserve keyfile auth).
system_remove_luks_key: false
# IOMMU passthrough mode for VFIO/libvirt PCI passthrough: set true only when actively
# assigning PCI devices to VMs. Enabling iommu=pt bypasses DMA remapping for all devices
# not assigned to a VM, trading full DMA isolation for passthrough performance.
system_iommu_passthrough: false
# system_wifi_mac_rand: not set — defaults true on non-CSB, false on CSB; override in config.yml
# system_wifi_powersave: not set — defaults true (powersave=2) on non-CSB-RHEL, false on csb_rhel; override in config.yml
system_enable_cockpit: false  # set true to unmask cockpit web console (port 9090); drop zone still blocks external access

# Chrony NTS time sources. Override in config.yml for corporate environments that block
# outbound NTP or require regional servers.
system_chrony_nts_servers:
  - time.cloudflare.com
  - nts.netnod.se
  - ptbtime1.ptb.de
  - ntppool1.time.nl
system_chrony_fallback_pool: 2.fedora.pool.ntp.org
system_chrony_minsources: 2
system_is_container: "{{ ansible_facts['virtualization_type'] | default('') in ['container', 'docker', 'podman'] }}"
system_chrony_service_enabled: "{{ not system_is_container }}"

# Security hardening defaults — authoritative values live in group_vars/all/vars.yml
# (which overrides these at precedence 5 when running via the project inventory).
# Duplicated here so the system role is standalone-invocable in molecule scenarios,
# where the molecule temp inventory does not load the project's group_vars directory.
is_dnf5: false             # OS-detection baseline; csb_detect.yml overrides at runtime; kept here for standalone molecule invocability
is_dnf: false              # authoritative in group_vars/all/vars.yml; here for standalone invocability
is_apt: false              # authoritative in group_vars/all/vars.yml; here for standalone invocability
csb_rhel: false            # authoritative in group_vars/all/vars.yml; here for standalone invocability
csb_detected: false        # authoritative in group_vars/all/vars.yml; here for standalone invocability
is_fedora: false           # authoritative in group_vars/all/vars.yml; here for standalone invocability
system_disable_avahi: true        # mask avahi-daemon (mDNS/DNS-SD); set false for .local resolution
system_mask_nfs_server: true      # mask nfs-server; most workstations don't export NFS
system_init_on_free: true         # zero freed memory pages on kernel free (init_on_free=1)
system_faillock_even_deny_root: false  # lock root on failed auth; set false on single-user workstations
install_vpn: true           # fallback; authoritative value in group_vars/all/vars.yml
install_virtualization: true # fallback; authoritative value in group_vars/all/vars.yml
system_tmout: 600                  # session inactivity timeout in seconds (CIS 5.5.5; must be <= 900)
system_faillock_deny: 5            # PAM lockout: failed attempts before account lock
system_faillock_unlock_time: 900   # seconds before auto-unlock after failed attempts
system_pwquality_minlen: 14        # minimum password length (CIS 5.3.2)
system_pwquality_difok: 4          # characters that must differ from previous password
system_pwquality_ucredit: -1       # require at least 1 uppercase character (CIS 5.3.3)
system_pwquality_lcredit: -1       # require at least 1 lowercase character (CIS 5.3.3)
system_pwquality_ocredit: -1       # require at least 1 special character (CIS 5.3.3)
system_pwquality_dcredit: -1       # require at least 1 digit (CIS 5.3.3)
system_pwquality_maxrepeat: 3      # maximum consecutive repeated characters
system_pwquality_maxsequence: 3    # maximum consecutive characters in a monotonic sequence
system_pwhistory_remember: 24      # number of previous passwords to remember (CIS 5.3.5)
system_inactive_days: 30           # days inactive before account lock (CIS 5.5.1.5)
system_gid0_allowed_accounts:     # accounts exempt from the GID-0 primary-group assert (CIS 6.2.x)
  - root
  - sync
  - shutdown
  - halt
  - operator
system_pass_max_days: 365          # maximum password age in days (login.defs PASS_MAX_DAYS)
system_pass_min_days: 1            # minimum days between password changes (login.defs PASS_MIN_DAYS)
system_pass_warn_age: 7            # days of warning before password expires (login.defs PASS_WARN_AGE)
system_auditd_max_log_file: 8      # MB per audit log file (auditd.conf max_log_file)
system_auditd_num_logs: 5          # rotated files to keep (auditd.conf num_logs)
system_umask: "027"                # default umask for login shells (login.defs UMASK)
system_kernel_panic: 0             # dev: preserve panic for kdump/KASAN/UBSAN; CIS: 10 (auto-reboot); kernel: 0; pinned vs sysctl.d
system_kernel_panic_on_oops: 0     # dev: log-and-continue on OOPS; CIS 1.5.3: 1=halt; kernel: 0; pinned vs sysctl.d
system_kexec_load_disabled: 0      # lockdown=integrity blocks kexec_load() not kexec_file_load(); signed kdump ok. No-kdump: set 1; CIS: 1
system_ptrace_scope: 0             # Fedora 44 default; pinned in 90-hardening.conf vs sysctl.d; CIS 1.6.3=1 (parent; breaks gdb/strace)
