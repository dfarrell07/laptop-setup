---
# Sysctl hardening values
system_sysctl_hardening:
  kernel.yama.ptrace_scope: 1      # CIS — restrict ptrace to parent process; value 2=admin-only, 3=none
  kernel.kptr_restrict: 1          # CIS — hide kernel pointer addresses from /proc (reduces KASLR bypass surface)
  kernel.io_uring_disabled: 1      # CIS — disable io_uring for unprivileged users (high CVE surface area)
  kernel.unprivileged_bpf_disabled: 1  # CIS — prevent unprivileged eBPF program loading (frequent exploit path)
  kernel.dmesg_restrict: 1         # CIS — restrict dmesg/kmsg to CAP_SYSLOG; prevents boot info leakage
  kernel.perf_event_paranoid: 2    # CIS — deny unprivileged perf_event_open; CAP_PERFMON required for profiling
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.default.accept_source_route: 0
  net.ipv4.conf.all.rp_filter: 2  # loose mode (not CIS strict=1): Tailscale and OVN-K overlay use asymmetric routes
  net.ipv4.conf.default.rp_filter: 2  # loose mode; applies to newly created interfaces
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv6.conf.all.accept_ra: 0
  net.ipv6.conf.default.accept_ra: 0
  fs.suid_dumpable: 0           # CIS — prevent SUID processes from writing core dumps (avoids privileged memory leaks)
  kernel.core_pattern: "|/bin/false"  # pipe core dumps to exit-immediately process (silently discard)
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.tcp_syncookies: 1
  fs.protected_hardlinks: 1  # CIS — prevents hardlink-based privilege escalation in world-writable dirs
  fs.protected_symlinks: 1   # CIS — prevents symlink attacks in /tmp and other sticky dirs
  fs.protected_fifos: 1      # CIS — prevents TOCTOU via FIFOs in sticky directories
  fs.protected_regular: 2    # CIS — value 2 covers world+group-writable sticky dirs (value 1 = world-writable only)
  kernel.panic: 10           # reboot after 10s panic; set 0 to preserve panic state for kernel debugging
  net.ipv4.tcp_timestamps: 0      # CIS 3.3.9 — prevent TCP timestamp-based OS fingerprinting and uptime disclosure
  # NOTE: overridden to 1 (kernel default) on CSB in tasks/main.yml — IT network diagnostics require timestamps
  net.ipv4.tcp_rfc1337: 1         # CIS — prevent TIME-WAIT assassination (RST injection into expiring connections)
  kernel.kexec_load_disabled: 1   # CIS — prevent loading new kernel via kexec (preserves Secure Boot chain of trust)
  net.core.bpf_jit_harden: 1      # mitigates Spectre-class JIT leaks; value 1=unprivileged only (equiv to 2 since unprivileged_bpf=1)
  fs.inotify.max_user_watches: 1048576
  fs.inotify.max_user_instances: 8192
  net.ipv4.ip_forward: 1  # required for Kubernetes/OVN-K pod routing and Tailscale subnet routing
  net.ipv6.conf.all.forwarding: 1  # required for Kubernetes/OVN-K pod routing and Tailscale subnet routing
  net.bridge.bridge-nf-call-iptables: 1   # required for OVN-K/Kubernetes: bridges pod traffic through iptables for NetworkPolicy
  net.bridge.bridge-nf-call-ip6tables: 1  # required for OVN-K/Kubernetes: same for IPv6 pod traffic
  net.netfilter.nf_conntrack_max: 524288  # prevent 'table full, dropping packet' under OVN-K/Submariner load
  net.core.rmem_max: 16777216  # 16 MiB socket receive buffer ceiling for OVN-K/Submariner throughput tests
  net.core.wmem_max: 16777216  # 16 MiB socket send buffer ceiling
  kernel.randomize_va_space: 2    # CIS — full ASLR (value 2=stack+VDSO+mmap+heap; value 1=partial)
  # note: use_tempaddr omitted — SLAAC is disabled via accept_ra=0, so tempaddr has no effect

# Firewall
system_firewall_icmp_types:
  - destination-unreachable
  - fragmentation-needed
  - packet-too-big
  - time-exceeded
  - echo-reply
  - parameter-problem
  - neighbour-solicitation  # Required for IPv6 NDP — conntrack does not track NS/NA
  - neighbour-advertisement  # Required for IPv6 NDP — without this, MAC resolution fails

# Services
system_enable_libvirtd: "{{ install_virtualization | default(true) }}"
system_enable_mullvad: "{{ install_vpn | default(true) }}"

# Core dumps
system_coredump_storage: none
system_coredump_process_size_max: 0

# USBGuard
system_install_usbguard: true
system_usbguard_whitelist:
  - "allow id 1050:* name \"YubiKey*\" with-interface one-of { 03:*:* 0B:*:* }"
  - "allow id 3297:1969 name \"Moonlander*\" with-interface one-of { 03:*:* }"
  # Internal devices: ThinkPad P16v Gen 1 AMD platform does not populate ACPI
  # _UPC/_PLD tables so the kernel reports connect_type "not used" (not "hardwired").
  # Pin by VID:PID to avoid a blanket allow on all "not used" ports.
  # Bluetooth adapter (USI 10ab:9309) — ThinkPad P16v Gen 1 AMD internal BT.
  # ACPI connect_type is "not used" (no _UPC/_PLD tables). BT stack disabled via
  # modprobe blacklist; this rule only permits the USB device past USBGuard.
  - "allow id 10ab:9309 with-connect-type \"not used\""  # USI BT adapter (ThinkPad P16v AMD)
  - "allow id 06cb:0126 with-connect-type \"not used\""  # Synaptics fingerprint reader
  - "allow id 174f:11a8 with-connect-type \"not used\""  # Sunplus webcam
  # Retained for Intel-based hardware where ACPI tables populate hardwired correctly.
  - "allow with-connect-type \"hardwired\""
  # STM32 DFU bootloader — Moonlander firmware flashing (Wally/qmk flash).
  # Re-enumerates as VID 0483:df11 when reset button pressed or QK_BOOT keycode used.
  - "allow id 0483:df11 name \"DFU in FS Mode\" with-interface one-of { FE:01:* }"

# Machine-specific additional whitelist rules merged with the above.
# Set in config.yml (gitignored) to add device-specific rules without
# replacing the whole base list. Example:
#   system_usbguard_extra_rules:
#     - 'allow id 1234:5678 name "My USB Hub"'
system_usbguard_extra_rules: []

# Locale, timezone, keymap
system_timezone: America/New_York
system_locale: en_US.UTF-8
system_keymap: us

# AIDE file integrity monitoring
system_aide_enabled: true

# TLP battery charge management (ThinkPad — applied via /etc/tlp.d/ drop-in)
system_tlp_enabled: true
system_tlp_bat0_start: 20   # start charging when battery drops below this %
system_tlp_bat0_stop: 80    # stop charging at this % (Li-ion longevity: keep 20-80%)

# Logind
system_lid_switch: suspend
system_lid_switch_external: lock
system_lid_switch_docked: ignore
# CIS 2.1.5: disable BT on machines with no BT peripherals. Default false (enabled) —
# required for ThinkPad P16v AMD Bluetooth mouse. Set true in config.yml to blacklist BT.
system_disable_bluetooth: false
# SysRq bitmask: 0=disabled (CIS), 176=sync(16)+remount-ro(32)+reboot(128) for kernel dev/recovery.
# Dangerous bits omitted from 176: raw-console(4), proc-signals/OOM-kill(64), crash(not in std bitmask).
# Set in config.yml — e.g. system_sysrq: 176 on a ThinkPad used for OVN-K kernel debugging.
system_sysrq: 0

# Identity fallbacks — site.yml always sets these via set_fact from env,
# but role defaults guard against standalone invocation or empty env vars.
# An empty real_user_id would produce AllowUsers with no token in sshd,
# locking out all users on the next sshd restart.
# Must use lookup('env') not ansible_user_id/dir: those Ansible facts
# resolve to root/root when the role runs with become: true at play level.
real_user_home: "{{ lookup('env', 'HOME') }}"  # noqa: var-naming[no-role-prefix]
real_user_id: "{{ lookup('env', 'USER') }}"  # noqa: var-naming[no-role-prefix]

# Fallback for standalone invocation — site.yml loads default.config.yml first.
ssh_port: 722  # noqa: var-naming[no-role-prefix]
