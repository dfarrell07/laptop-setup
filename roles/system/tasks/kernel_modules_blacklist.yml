---
# roles/system/tasks/kernel_modules_blacklist.yml
# --- Kernel module blacklist ---
- name: Deploy kernel module blacklist (non-container)
  # CSB posture: safe to deploy on RHEL CSB — blacklisted modules (hfs, cramfs, vivid, n_hdlc,
  # etc.) are not used by IT workflows and do not conflict with SCAP baselines. The SCAP RHEL9
  # profile independently blacklists most of the same modules (CIS 3.x); deploying this file
  # is additive and does not override IT-managed modprobe.d entries.
  when: not system_is_container  # modprobe.d is not applied in containers; skip to avoid template failures
  block:
    - name: Ensure /etc/modprobe.d exists
      ansible.builtin.file:
        path: /etc/modprobe.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy kernel module blacklist
      ansible.builtin.template:
        src: modprobe-hardening.conf.j2
        dest: /etc/modprobe.d/hardening.conf
        mode: "0644"

    - name: Unload Bluetooth modules (best-effort, pre-reboot)
      # rfcomm/bnep have user counts > 0 when bluetooth.service is stopped but modules remain loaded.
      # Unload in dependency order so dependent modules release before bluetooth core.
      # failed_when/ignore_errors handle never-loaded or in-use modules gracefully.
      when: system_disable_bluetooth | bool
      ansible.builtin.command:
        cmd: modprobe -r {{ item }}
      loop:
        - rfcomm
        - bnep
        - btusb
        - bluetooth
      failed_when: false
      ignore_errors: true
      changed_when: false

    - name: Unload unconditionally blacklisted modules (best-effort, pre-reboot)
      # Modules already loaded at provisioning time remain exploitable until reboot.
      # Attempt immediate unload so CVEs (vivid OOB write, n_hdlc privesc, firewire DMA)
      # are not exploitable during the pre-reboot window. failed_when/ignore_errors
      # handle the common case where a module was never loaded.
      ansible.builtin.command:
        cmd: modprobe -r {{ item }}
      loop:
        - vivid
        - n_hdlc
        - firewire-sbp2
        - firewire-net
        - firewire-ohci
        - firewire-core
        - nosy
      failed_when: false
      ignore_errors: true
      changed_when: false
