---
# Restrict system-connections directory so unprivileged users cannot enumerate
# VPN endpoints, SSIDs, or corporate network topology via directory listing.
# Enforce before any NM restart handler fires.
- name: Restrict /etc/NetworkManager/system-connections permissions
  ansible.builtin.file:
    path: /etc/NetworkManager/system-connections
    state: directory
    mode: "0700"
    owner: root
    group: root
  when: not system_is_container

# --- NetworkManager Tailscale unmanaged ---
- name: NM Tailscale/kind unmanaged devices (not on RHEL CSB)
  when:
    - not csb_rhel  # IT may use wg* for managed WireGuard VPN; do not mark unmanaged on RHEL CSB
    - not system_is_container  # NM conf.d write triggers NM inotify reload, can crash container
  block:
    - name: Configure NetworkManager to ignore Tailscale and kind interfaces
      ansible.builtin.copy:
        content: |
          # {{ ansible_managed }}
          [keyfile]
          {{ _nm_unmanaged_devices }}
        dest: /etc/NetworkManager/conf.d/tailscale.conf
        mode: "0644"
      vars:
        _nm_unmanaged_devices: "unmanaged-devices+=interface-name:tailscale*,interface-name:kind*,interface-name:podman*\
          ,interface-name:br-*,interface-name:virbr*,interface-name:ovs-system,interface-name:br-int\
          ,interface-name:br-ex,interface-name:br-local,interface-name:genev_sys_*{{ '\
          ,interface-name:wg*' if not csb_detected else '' }},interface-name:wt*,interface-name:ovn-k8s-mp0"
      notify: Restart NetworkManager

    # Skipped on every CSB tier: Fedora already runs NM with systemd-resolved (resolv.conf stub),
    # so the override is redundant there and IT owns NM/DNS config on a CSB.
    - name: Deploy NM systemd-resolved DNS config (Tailscale MagicDNS)
      ansible.builtin.copy:
        content: |
          # {{ ansible_managed }}
          [main]
          dns=systemd-resolved
        dest: /etc/NetworkManager/conf.d/99-dns.conf
        mode: "0644"
      when: not csb_detected
      notify: Restart NetworkManager

- name: Remove NM dns=systemd-resolved config on CSB
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d/99-dns.conf
    state: absent
  when:
    - csb_detected
    - not system_is_container  # NM conf.d delete triggers NM inotify reload, can crash container
  notify: Restart NetworkManager

# On CSB, IT's NM confs already set wifi.powersave and dhcp-send-hostname; skip to avoid duplicates.
- name: Disable WiFi power saving (prevents latency spikes and drops on ThinkPad)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # Own section name: same-named [connection] sections from all conf.d files are merged,
      # so match-device here would also narrow the DHCP-hostname settings to Wi-Fi only.
      [connection.wifi-powersave]
      match-device=type:wifi
      wifi.powersave=2
    dest: /etc/NetworkManager/conf.d/99-wifi-powersave.conf
    mode: "0644"
  when:
    - not csb_detected  # IT manages NM power policy on CSB; guard holds even when var overridden
    - system_wifi_powersave_disabled | bool
    - not system_is_container  # NM conf.d write triggers NM inotify reload, can crash container
  notify: Restart NetworkManager

- name: Remove WiFi power saving config
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d/99-wifi-powersave.conf
    state: absent
  when:
    - csb_detected or not (system_wifi_powersave_disabled | bool)
    - not system_is_container  # NM conf.d delete triggers NM inotify reload, can crash container
  notify: Restart NetworkManager

- name: Suppress DHCP hostname advertisement (privacy — prevents hostname leakage to DHCP servers)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [connection]
      ipv4.dhcp-send-hostname=false
      ipv6.dhcp-send-hostname=false
    dest: /etc/NetworkManager/conf.d/99-dhcp-privacy.conf
    mode: "0644"
  when:
    - not csb_detected
    - not system_is_container  # NM conf.d write triggers NM inotify reload, can crash container
  notify: Restart NetworkManager

- name: Remove DHCP hostname suppression config on CSB
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d/99-dhcp-privacy.conf
    state: absent
  when:
    - csb_detected
    - not system_is_container  # NM conf.d delete triggers NM inotify reload, can crash container
  notify: Restart NetworkManager

# tailscale0 is intentionally not CSB-guarded: Tailscale is a user-managed VPN
# interface, not controlled by IT's firewalld policy. Trusted zone is required for
# Tailscale exit-node and peer-to-peer routing to work. Side effect: all Tailscale
# peers can reach any listening port on this machine (passim, etc. are masked separately).
- name: Warn when tailscale0 zone assignment will be skipped
  ansible.builtin.debug:
    msg: "system_firewalld_running=false — tailscale0 zone assignment skipped; run without --tags to configure firewall"
  when:
    - not system_is_container
    - not system_firewalld_running | bool

- name: Assign tailscale0 to firewall trusted zone
  ansible.posix.firewalld:
    zone: trusted
    interface: tailscale0
    permanent: true
    immediate: true
    state: enabled
  when:
    - not system_is_container  # firewalld module crashes privileged Podman containers
    - system_firewalld_running | bool
  # iifname-based nftables rule succeeds immediately even when tailscale0 does not
  # exist yet — firewalld uses iifname (name-match) not iif (index-match), so the
  # rule activates the moment tailscaled creates the interface. No failed_when needed.
  notify:
    - Apply firewall rules
    - Restart tailscaled

# wt0 is the NetBird WireGuard interface. Like tailscale0, it is a user-managed
# VPN interface that must be in the trusted zone so decrypted peer traffic
# (arriving on wt0) is not dropped by the drop zone default. The firewall.yml
# exclusion regex (w[gt].*) prevents wt0 from being moved to drop, but does
# not assign a zone — firewalld applies the default (drop) to unzoned interfaces.
# iifname-based nftables rule: succeeds immediately even when wt0 does not exist;
# the rule activates the moment NetBird creates the interface. No failed_when needed.
# Note: no 'Restart netbird' handler — NetBird manages its own nftables rules
# natively; restarting it on zone change would drop active peer connections.
# Side effect: all NetBird peers can reach any listening port on this machine.
# Services are masked separately (see service_masking.yml). Dev servers bound to
# 0.0.0.0 are reachable from NetBird peers — bind to 127.0.0.1 or use
# firewall-cmd --zone=trusted --add-rich-rule for port-specific restrictions if needed.
# On hybrid CSB, IT's redhat_csb.firewall template binds wt0 to the 'redhat' zone and
# rewrites that zone hourly; moving wt0 to trusted would cause a ZONE_CONFLICT, so skip on CSB.
- name: Assign wt0 (NetBird) to firewall trusted zone
  ansible.posix.firewalld:
    zone: trusted
    interface: wt0
    permanent: true
    immediate: true
    state: enabled
  when:
    - not system_is_container  # firewalld module crashes privileged Podman containers
    - system_firewalld_running | bool
    # IT's CSB firewall role owns wt0 on every CSB tier; the probe can come back empty before
    # IT binds it (or on a query error), and moving it to trusted would conflict on IT's next run
    - not (csb_detected | bool)
  notify:
    - Apply firewall rules

# On CSB where the Tailscale repo is blocked, tailscaled may not be installed.
# Ignore only "Could not find the requested service" (unit absent); propagate
# all other errors (D-Bus failures, permission denials, etc.).
- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
  register: _tailscaled_enable_result
  failed_when:
    - _tailscaled_enable_result.failed | default(false)
    - "'Could not find the requested service' not in (_tailscaled_enable_result.msg | default(''))"
  when: not system_is_container
