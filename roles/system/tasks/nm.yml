---
# --- NetworkManager Tailscale unmanaged ---
- name: Ensure NetworkManager conf.d exists
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d
    state: directory
    mode: "0755"
  when: not system_is_container  # NM watches conf.d via inotify; creating dir triggers NM reload, can crash container

# On CSB, IT may use MAC-based NAC that requires the hardware MAC for 802.1X RADIUS
# authentication. stable-ssid presents a SSID-hashed pseudo-random MAC which could
# break corporate WiFi auth. Skip on CSB (default) and rely on IT's NM configuration.
# Note: NM 1.45+ ships this as a package default via /usr/lib/NetworkManager/conf.d/22-wifi-mac-addr.conf;
# this task is redundant but harmless on Fedora 44.
- name: Configure WiFi MAC address randomization
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [connection]
      wifi.cloned-mac-address=stable-ssid
    dest: /etc/NetworkManager/conf.d/99-wifi-mac-rand.conf
    mode: "0644"
  when:
    - system_wifi_mac_rand | bool
    - not system_is_container  # NM conf.d write triggers NM reload via inotify, can crash container
  notify: Restart NetworkManager

- name: Remove WiFi MAC address randomization config when disabled
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d/99-wifi-mac-rand.conf
    state: absent
  when:
    - not (system_wifi_mac_rand | bool)
    - not system_is_container  # NM conf.d delete triggers NM inotify reload, can crash container
  notify: Restart NetworkManager

- name: Configure NetworkManager to ignore Tailscale and kind interfaces
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [keyfile]
      unmanaged-devices+=interface-name:tailscale*,interface-name:kind*,interface-name:podman*,interface-name:br-*,interface-name:virbr*,interface-name:ovs-system,interface-name:br-int,interface-name:br-ex,interface-name:br-local,interface-name:genev_sys_*,interface-name:wg*,interface-name:ovn-k8s-mp0
    dest: /etc/NetworkManager/conf.d/tailscale.conf
    mode: "0644"
  when: not system_is_container  # NM conf.d write triggers NM inotify reload, can crash container
  notify: Restart NetworkManager

- name: Deploy NM dns=systemd-resolved config (required for Tailscale MagicDNS split-DNS)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [main]
      dns=systemd-resolved
    dest: /etc/NetworkManager/conf.d/99-dns.conf
    mode: "0644"
  when:
    - not csb_rhel  # paired with resolv.conf
    - not system_is_container  # NM conf.d write triggers NM inotify reload, can crash container
  notify: Restart NetworkManager

- name: Remove NM dns=systemd-resolved config on CSB RHEL
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d/99-dns.conf
    state: absent
  when:
    - csb_rhel
    - not system_is_container  # NM conf.d delete triggers NM inotify reload, can crash container
  notify: Restart NetworkManager

# On CSB-RHEL, IT manages NM power policy; skip to avoid conflicts with corporate config.
- name: Disable WiFi power saving (prevents latency spikes and drops on ThinkPad)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [connection]
      wifi.powersave=2
    dest: /etc/NetworkManager/conf.d/99-wifi-powersave.conf
    mode: "0644"
  when:
    - system_wifi_powersave_disabled | bool
    - not system_is_container  # NM conf.d write triggers NM inotify reload, can crash container
  notify: Restart NetworkManager

- name: Remove WiFi power saving config when disabled
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d/99-wifi-powersave.conf
    state: absent
  when:
    - not (system_wifi_powersave_disabled | bool)
    - not system_is_container  # NM conf.d write triggers NM inotify reload, can crash container
  notify: Restart NetworkManager

- name: Suppress DHCP hostname advertisement (privacy — prevents hostname leakage to DHCP servers)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [connection]
      ipv4.dhcp-send-hostname=false
      ipv6.dhcp-send-hostname=false
    dest: /etc/NetworkManager/conf.d/99-dhcp-privacy.conf
    mode: "0644"
  when:
    - not csb_detected
    - not system_is_container  # NM conf.d write triggers NM inotify reload, can crash container
  notify: Restart NetworkManager

- name: Remove DHCP hostname suppression config on CSB
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d/99-dhcp-privacy.conf
    state: absent
  when:
    - csb_detected
    - not system_is_container  # NM conf.d delete triggers NM inotify reload, can crash container
  notify: Restart NetworkManager

# tailscale0 is intentionally not CSB-guarded: Tailscale is a user-managed VPN
# interface, not controlled by IT's firewalld policy. Trusted zone is required for
# Tailscale exit-node and peer-to-peer routing to work. Side effect: all Tailscale
# peers can reach any listening port on this machine (passim, etc. are masked separately).
- name: Assign tailscale0 to firewall trusted zone
  ansible.posix.firewalld:
    zone: trusted
    interface: tailscale0
    permanent: true
    immediate: true
    state: enabled
  when:
    - not system_is_container  # firewalld module crashes privileged Podman containers
    - system_firewalld_running | bool
  failed_when: false  # tailscale0 doesn't exist on first provision; permanent config succeeds, immediate fails
  notify:
    - Apply firewall rules
    - Restart tailscaled

# failed_when: false — on CSB where the Tailscale repo is blocked, the package
# may not be installed; silently skip rather than fail the play.
- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
  failed_when: false
  when: not system_is_container
