---
# roles/system/tasks/kernel_modules_kind.yml
# --- Kernel modules for kind ---
- name: Check if modules_disabled ratchet is active
  ansible.builtin.slurp:
    src: /proc/sys/kernel/modules_disabled
  register: _modules_disabled_state
  failed_when: false
  when:
    - not csb_rhel
    - not system_is_container

- name: Fail if modules_disabled ratchet prevents module loading
  ansible.builtin.fail:
    msg: |
      CANNOT LOAD KERNEL MODULES: kernel.modules_disabled=1 is active (one-way ratchet).
      Cause: Previous provisioning run set modules_disabled=1 in /etc/sysctl.d/90-hardening.conf.
      Fix: REBOOT to reset the ratchet, then re-run provisioning.
      Impact: kind/Kubernetes networking will be broken until reboot.

      Current state: {{ (_modules_disabled_state.content | b64decode | trim) if _modules_disabled_state.content is defined else 'unknown' }}

      The modules_disabled=1 sysctl is a security hardening control that prevents all
      kernel module loads after activation. It cannot be disabled without reboot.
      This is expected behavior; the playbook must run BEFORE the ratchet activates,
      which is why kernel_modules_kind.yml is imported before hardening_core.yml in main.yml.
  when:
    - not csb_rhel
    - not system_is_container
    - _modules_disabled_state.content is defined
    - (_modules_disabled_state.content | b64decode | trim) == '1'

- name: Load iptables kernel modules for kind
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  register: system_modprobe_results
  loop:
    - ip6_tables
    - ip6table_nat
    - ip_tables
    - iptable_nat
    - br_netfilter
    - nf_conntrack  # explicit load so nf_conntrack_max sysctl applies even if firewalld fails to start
    - overlay
  when:
    - not csb_rhel  # kind runs inside dev container on CSB; persistent modules on host unnecessary
    - not system_is_container
    # Loading iptables modules in a Podman container disrupts host iptables/networking
    # and kills the container connection; modules are managed by the host on container hosts.
  failed_when: false

- name: Apply module-dependent sysctl values immediately  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: sysctl --system
  # changed_when: false — sysctl --system provides no reliable stdout/exit-code indicator for
  # "values actually changed vs already current"; suppressing the change signal is pragmatic.
  # On first provision this task does activate bridge-nf-call-iptables/ip6tables in the running
  # kernel for the first time (br_netfilter was not loaded when hardening_core.yml ran sysctl),
  # but "ok" vs "changed" is indistinguishable from the command's output alone.
  changed_when: false
  register: sysctl_kind_result
  # Keys absent if module not yet loaded (ENOENT) or kernel too old (EINVAL) — tolerate both;
  # write-once keys (EPERM, e.g. kernel.unprivileged_bpf_disabled on Fedora 44) also tolerated
  failed_when: >
    sysctl_kind_result.rc != 0 and
    (sysctl_kind_result.stderr_lines | length == 0 or
    sysctl_kind_result.stderr_lines |
    reject('search', 'No such file or directory|invalid argument|permission denied|operation not permitted', ignorecase=True) |
    list | length > 0)
  when: not system_is_container

- name: Warn if any kernel module failed to load
  ansible.builtin.debug:
    msg: >-
      WARNING: kernel module '{{ item.item }}' failed to load (rc={{ item.rc }}).
      kind/Kubernetes networking or storage may be broken.
  loop: >-
    {{ system_modprobe_results.results | default([])
       | selectattr('rc', 'defined')
       | selectattr('rc', 'ne', 0)
       | list }}
  loop_control:
    label: "{{ item.item }}"
  when: not csb_rhel
