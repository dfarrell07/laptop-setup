---
# --- Auditd (audit daemon + rules) ---
# CI gap: auditd install, config, and rules are NOT exercised in Podman-based molecule CI.
# audit post-install scripts attempt to start auditd; the kernel audit subsystem is disabled
# in privileged containers and auditd cannot set its priority (EPERM), causing cascading
# systemd restart failures that crash PID 1. make test-vm provides full auditd coverage.
- name: Install audit package
  ansible.builtin.dnf:
    name: audit
    state: present
  when:
    - is_dnf
    - not system_is_container
  register: _audit_pkg_install
  failed_when: false

- name: Warn if audit package install failed
  ansible.builtin.debug:
    msg: >-
      WARNING: audit package install failed (rc={{ _audit_pkg_install.rc | default('n/a') }});
      auditd rules and configuration deployment may also fail on this host
  when:
    - _audit_pkg_install.rc | default(0) != 0

- name: Install auditd package (Debian/Ubuntu)
  ansible.builtin.apt:
    name: auditd
    state: present
  when:
    - is_apt
    - not system_is_container
  register: _apt_audit_pkg_install
  failed_when: false

- name: Apply auditd rules and configuration
  when:
    - not csb_rhel  # no SIEM at home; audit package not installed in container CI (see comment above)
    - not system_is_container
    - (is_dnf and _audit_pkg_install.rc | default(0) == 0) or (is_apt and _apt_audit_pkg_install.rc | default(0) == 0)
  block:
    - name: Assert real_user_home is a valid absolute path
      ansible.builtin.assert:
        that:
          - real_user_home is regex('^/[a-zA-Z0-9_/.:@-]+$')
          - real_user_home != '/'
          - real_user_home is not search('\.\.')
          - real_user_home is not search('\\./')
        fail_msg: >-
          real_user_home='{{ real_user_home }}' is not a valid absolute path.
          A newline or special character in HOME would inject arbitrary directives into
          the auditd rules file. Ensure HOME is set correctly before running.
          real_user_home must not contain '..' or './' path traversal sequences.

    - name: Detect late-sorting audit rules files with -e 0
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          problem=""
          for f in /etc/audit/rules.d/*.rules; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            [ "$b" \> "claude-code.rules" ] || continue
            grep -qE '^[[:space:]]*-e[[:space:]]+0' "$f" && problem="${problem:+$problem }$b"
          done
          printf '%s' "$problem"
        executable: /bin/bash
      register: _auditd_late_e0_files
      changed_when: false
      failed_when: false

    - name: Fail if a late-sorting audit rules file disables enforcement
      ansible.builtin.fail:
        msg: >-
          SECURITY: file(s) in /etc/audit/rules.d/ sort after claude-code.rules and
          contain '-e 0', which overrides audit enforcement after augenrules merge:
          {{ _auditd_late_e0_files.stdout }}. Remove or rename so they sort before
          claude-code.rules, then re-run provisioning.
      when: _auditd_late_e0_files.stdout | trim | length > 0

    - name: Deploy auditd rules
      # File sorts as 's' — before 'z' and digit-prefixed files. augenrules merges
      # rules.d/ in lexicographic order; the last -e directive wins. If IT later deploys
      # a z-finalize.rules or 99-it.rules ending with -e 2, it overrides our -e 1 intent
      # on csb_detected machines. Accepted risk: Fedora hybrid CSB has no IT-managed
      # SIEM pipeline (that is RHEL CSB only, blocked by the not csb_rhel guard above).
      ansible.builtin.template:
        src: auditd-system.rules.j2
        dest: /etc/audit/rules.d/claude-code.rules
        mode: "0640"
      notify: Restart auditd

    - name: Deploy auditd main configuration (CIS 4.1.2.x disk-space settings)
      ansible.builtin.template:
        src: auditd.conf.j2
        dest: /etc/audit/auditd.conf
        owner: root
        group: root
        mode: "0640"
      notify: Restart auditd
      when: not csb_detected  # CSB IT owns auditd.conf on all CSB tiers (RHEL and Fedora hybrid);
        # no drop-in mechanism exists — last writer wins with no merge. Deploying our
        # SUSPEND disk-space settings would conflict with IT's STIG AU-5 HALT/SINGLE baseline.

    - name: Warn that auditd.conf disk-space vars are not applied on hybrid Fedora CSB
      ansible.builtin.debug:
        msg: >-
          WARNING: system_auditd_max_log_file and system_auditd_num_logs are set in config.yml
          but are NOT applied on hybrid Fedora CSB (csb_detected=true, csb_rhel=false).
          IT owns /etc/audit/auditd.conf on all CSB tiers; adjust disk-space settings there manually.
      when:
        - csb_detected
        - not csb_rhel

    - name: Ensure auditd is enabled and started
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started
