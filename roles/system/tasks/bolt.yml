---
# roles/system/tasks/bolt.yml
# Bolt daemon. Included from main.yml.
# --- Bolt (Thunderbolt device authorization daemon) ---
- name: Install bolt for Thunderbolt device authorization
  ansible.builtin.dnf:
    name: bolt
    state: present
  when:
    - is_dnf
    - system_bolt_enabled
    - not system_is_container  # DNF RPM post-install calls systemctl daemon-reload, crashes container PID 1
  failed_when: false

- name: Start bolt service (D-Bus activated, no [Install] section — cannot be enabled)
  ansible.builtin.systemd:
    name: bolt
    state: started
  when:
    - is_dnf
    - system_bolt_enabled
    - not system_is_container  # D-Bus activation crashes Podman containers
  failed_when: false
