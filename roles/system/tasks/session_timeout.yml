---
# --- Session timeout (TMOUT via profile.d) ---
- name: Deploy session timeout via profile.d (bash login shells)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # Auto-logout after inactivity (CIS 5.5.5 requires <=900s). Override system_tmout in config.yml.
      readonly TMOUT={{ system_tmout }}
      export TMOUT
    dest: /etc/profile.d/tmout.sh
    mode: "0644"
  when:
    - system_tmout | int > 0
    - not system_is_container  # /etc/profile.d write triggers PAM/pam_env re-evaluation; crashes privileged Podman container PID 1
    - not is_apt  # Debian sets TMOUT in /etc/bash.bashrc; profile.d would cause a duplicate readonly assignment

- name: Deploy session timeout to /etc/bash.bashrc (Debian bash interactive shells)
  ansible.builtin.lineinfile:
    path: /etc/bash.bashrc
    line: "readonly TMOUT={{ system_tmout }}  # CIS 5.5.5"
    regexp: '^\s*(readonly\s+)?TMOUT='
  when:
    - is_apt
    - system_tmout | int > 0

- name: Export TMOUT in /etc/bash.bashrc (Debian bash interactive shells)
  ansible.builtin.lineinfile:
    path: /etc/bash.bashrc
    line: "export TMOUT  # CIS 5.5.5"
    regexp: '^\s*export TMOUT\b'
  when:
    - is_apt
    - system_tmout | int > 0

# /etc/profile.d/*.sh is sourced by bash login shells and by zsh login shells
# (Fedora zsh /etc/zprofile sources /etc/profile). The /etc/zshrc line is needed
# for non-login interactive zsh shells (most terminal emulators). Redundant
# readonly assignment for login zsh shells is silently ignored in zsh 5.9+.
# On Fedora/RHEL: /etc/zshrc (compiled default GLOBAL_ZSHRC=/etc/zshrc).
# On Debian: /etc/zsh/zshrc (compiled default GLOBAL_ZSHRC=/etc/zsh/zshrc;
# /etc/zshrc is silently ignored by Debian's zsh binary).
- name: Deploy session timeout to /etc/zshrc (Fedora/RHEL zsh)
  ansible.builtin.lineinfile:
    path: /etc/zshrc
    line: "typeset -xr TMOUT={{ system_tmout }}  # CIS 5.5.5"
    regexp: '^\s*(typeset -xr\s+|readonly\s+)?TMOUT='
    create: true  # system role runs before packages; zsh may not be installed yet on first provision
    mode: "0644"
  when:
    - not is_apt
    - system_tmout | int > 0

- name: Deploy session timeout to /etc/zsh/zshrc (Debian zsh — GLOBAL_ZSHRC)
  ansible.builtin.lineinfile:
    path: /etc/zsh/zshrc
    line: "typeset -xr TMOUT={{ system_tmout }}  # CIS 5.5.5"
    regexp: '^\s*(typeset -xr\s+|readonly\s+)?TMOUT='
    create: true
    mode: "0644"
  when:
    - is_apt
    - system_tmout | int > 0

# Cleanup: remove TMOUT artifacts when system_tmout<=0 (operator disables timeout).
# Without this, readonly TMOUT=600 persists and cannot be overridden in user dotfiles.
- name: Remove session timeout from profile.d when disabled
  ansible.builtin.file:
    path: /etc/profile.d/tmout.sh
    state: absent
  when:
    - system_tmout | int <= 0
    - not is_apt  # Debian does not use profile.d for TMOUT; avoid spurious no-op on Debian hosts

- name: Remove session timeout from /etc/bash.bashrc when disabled (Debian)
  ansible.builtin.lineinfile:
    path: /etc/bash.bashrc
    regexp: '^\s*(readonly\s+)?TMOUT='
    state: absent
  when:
    - is_apt
    - system_tmout | int <= 0

- name: Remove TMOUT export from /etc/bash.bashrc when disabled (Debian)
  ansible.builtin.lineinfile:
    path: /etc/bash.bashrc
    regexp: '^\s*export TMOUT\b'
    state: absent
  when:
    - is_apt
    - system_tmout | int <= 0

- name: Remove session timeout from /etc/zshrc when disabled (Fedora/RHEL)
  ansible.builtin.lineinfile:
    path: /etc/zshrc
    regexp: '^\s*(typeset -xr\s+|readonly\s+)?TMOUT='
    state: absent
  when:
    - not is_apt
    - system_tmout | int <= 0

- name: Remove session timeout from /etc/zsh/zshrc when disabled (Debian)
  ansible.builtin.lineinfile:
    path: /etc/zsh/zshrc
    regexp: '^\s*(typeset -xr\s+|readonly\s+)?TMOUT='
    state: absent
  when:
    - is_apt
    - system_tmout | int <= 0
