---
# --- sshd hardening ---
- name: Check SSH daemon installation independently of cached service facts
  ansible.builtin.stat:
    path: /usr/sbin/sshd
    follow: true
  register: _system_sshd_binary

- name: Enable and start sshd
  ansible.builtin.systemd:
    name: "{{ 'ssh' if is_apt else 'sshd' }}"
    enabled: true
    state: started
  when:
    - _system_sshd_binary.stat.exists
    - not system_is_container  # starting sshd triggers daemon-reload, crashes privileged Podman containers

- name: SSHD pre-deployment checks
  when:
    - _system_sshd_binary.stat.exists
    - not csb_rhel  # CSB: IT manages sshd; non-FIPS algorithms in 00-hardening.conf rejected in FIPS mode
  block:
    - name: Assert real_user_id is non-empty and not root before deploying AllowUsers
      ansible.builtin.assert:
        that:
          - real_user_id | default('') | length > 0
          - real_user_id != 'root'
        fail_msg: >-
          real_user_id='{{ real_user_id | default("(empty)") }}' — AllowUsers in sshd would
          lock out all SSH users. Run as your normal user with -K (make all), not as root.
          'sudo -i && make all' sets USER=root and would write 'AllowUsers root'.

    - name: Assert real_user_id matches valid Linux username character set
      ansible.builtin.assert:
        that:
          - real_user_id is regex('^[a-z_][a-z0-9_.@-]{0,31}$')
        fail_msg: >-
          real_user_id='{{ real_user_id }}' contains characters outside the allowed set
          [a-z0-9_.@-] or exceeds 32 characters. A newline or space in USER would inject
          arbitrary directives into the sshd drop-in. Unset or correct the USER environment
          variable before re-running.

    - name: Assert system_ssh_allow_tcp_forwarding is a recognised sshd value
      ansible.builtin.assert:
        that:
          - system_ssh_allow_tcp_forwarding in ['yes', 'no', 'all', 'local', 'remote']
        fail_msg: >-
          system_ssh_allow_tcp_forwarding='{{ system_ssh_allow_tcp_forwarding }}' is not a
          valid AllowTcpForwarding value. Accepted: yes, no, all, local, remote.

    - name: Assert system_ssh_allow_agent_forwarding is a recognised sshd value
      ansible.builtin.assert:
        that:
          - system_ssh_allow_agent_forwarding in ['yes', 'no']
        fail_msg: >-
          system_ssh_allow_agent_forwarding='{{ system_ssh_allow_agent_forwarding }}' is not
          a valid AllowAgentForwarding value. Accepted: yes, no.

    # noqa: command-instead-of-module — query installed RPM version without modifying packages
    - name: Probe openssh version for ChannelTimeout bz3827 guard
      ansible.builtin.command:
        cmd: rpm -q openssh --qf '%{VERSION}'
      register: _sshd_rpm_version
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - system_ssh_channel_timeout | default('') | length > 0
        - is_dnf

    - name: Fail if ChannelTimeout is set and OpenSSH version probe inconclusive (bz3827 guard)
      ansible.builtin.fail:
        msg: >-
          system_ssh_channel_timeout={{ system_ssh_channel_timeout | quote }} is set but
          rpm -q openssh returned rc={{ _sshd_rpm_version.rc | default('n/a') }} — cannot verify
          OpenSSH >= 10.3 required for bz3827 safety. Set system_ssh_channel_timeout: ""
          in config.yml until the OpenSSH version can be confirmed.
      when:
        - system_ssh_channel_timeout | default('') | length > 0
        - is_dnf
        - _sshd_rpm_version.rc | default(1) != 0

    - name: Fail if ChannelTimeout is set on OpenSSH < 10.3 (bz3827 guard)
      ansible.builtin.fail:
        msg: >-
          system_ssh_channel_timeout={{ system_ssh_channel_timeout | quote }} is set but
          detected OpenSSH {{ _sshd_rpm_version.stdout | default('unknown') }} < 10.3.
          bz3827 causes UnusedConnectionTimeout to fire prematurely even with open channels,
          producing silent SSH disconnects (VS Code Remote, tmux). sshd -t accepts this config
          as valid, masking the problem. Set system_ssh_channel_timeout: "" in config.yml until
          all targets run OpenSSH >= 10.3.
      when:
        - system_ssh_channel_timeout | default('') | length > 0
        - is_dnf
        - _sshd_rpm_version.rc | default(1) == 0
        - _sshd_rpm_version.stdout | default('0') is version('10.3', '<', version_type='loose')

    - name: Probe openssh version for ChannelTimeout bz3827 guard (apt)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          dpkg-query -W -f='${Version}' openssh-server | grep -oE '[0-9]+\.[0-9]+'
        executable: /bin/bash
      register: _sshd_apt_version
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - system_ssh_channel_timeout | default('') | length > 0
        - is_apt

    - name: Fail if ChannelTimeout is set on OpenSSH < 10.3 on apt targets (bz3827 guard)
      ansible.builtin.fail:
        msg: >-
          system_ssh_channel_timeout={{ system_ssh_channel_timeout | quote }} is set but
          detected OpenSSH {{ _sshd_apt_version.stdout | default('unknown') }} < 10.3 on this apt target.
          bz3827 causes UnusedConnectionTimeout to fire prematurely even with open channels,
          producing silent SSH disconnects (VS Code Remote, tmux). sshd -t accepts this config
          as valid, masking the problem. Set system_ssh_channel_timeout: "" in config.yml until
          all targets run OpenSSH >= 10.3.
      when:
        - system_ssh_channel_timeout | default('') | length > 0
        - is_apt
        - _sshd_apt_version.rc | default(1) == 0
        - _sshd_apt_version.stdout | default('0') is version('10.3', '<', version_type='loose')

    - name: Assert system_ssh_extra_allow_users entries match valid Linux username character set
      ansible.builtin.assert:
        that:
          - >-
            system_ssh_extra_allow_users | default([])
            | map('regex_search', '^[a-z_][a-z0-9_.@-]{0,31}$')
            | list | difference([none]) | length
            == (system_ssh_extra_allow_users | default([]) | length)
        fail_msg: >-
          system_ssh_extra_allow_users contains an entry that fails validation.
          Each entry must match ^[a-z_][a-z0-9_.@-]{0,31}$ (valid Linux username,
          32 chars max). Entries with spaces, newlines, or special characters would
          inject arbitrary directives into AllowUsers in sshd. Offending list:
          {{ system_ssh_extra_allow_users | default([]) | to_json }}
      when: system_ssh_extra_allow_users | default([]) | length > 0

    - name: Create /etc/ssh/sshd_config.d directory
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        mode: "0700"

    - name: Include sshd_config.d glob in sshd_config (rpmnew guard)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: 'Include /etc/ssh/sshd_config.d/*.conf'
        insertbefore: BOF
        state: present
        backup: true

    - name: Warn if unreviewed sshd_config.rpmnew is present
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.rpmnew
      register: system_sshd_rpmnew

    - name: Emit warning for unmerged sshd_config.rpmnew
      ansible.builtin.debug:
        msg: >-
          WARNING: /etc/ssh/sshd_config.rpmnew exists and has not been merged.
          The package shipped a new default sshd_config that may contain security
          or functional changes. Review and merge before next reprovisioning:
            sudo diff /etc/ssh/sshd_config /etc/ssh/sshd_config.rpmnew
      when: system_sshd_rpmnew.stat.exists | default(false)

- name: Probe FIPS mode
  ansible.builtin.slurp:
    src: /proc/sys/crypto/fips_enabled
  register: _system_fips_probe
  failed_when: false
  changed_when: false
  check_mode: false  # read-only probe
  when: is_linux | bool

- name: Set system_fips_mode fact
  ansible.builtin.set_fact:
    system_fips_mode: "{{ (_system_fips_probe.content | default('MA==') | b64decode | trim) == '1' }}"
  when: is_linux | bool

- name: Deploy and validate sshd hardening config
  when:
    - _system_sshd_binary.stat.exists
    - not csb_rhel  # CSB: IT manages sshd via Satellite/SCAP; AllowUsers + non-FIPS algorithms conflict
    - not (system_fips_mode | default(false) | bool)  # FIPS: chacha20-poly1305 not FIPS-approved; let crypto-policies manage ciphers
  block:
    - name: Remove unauthorized drop-ins from /etc/ssh/sshd_config.d  # noqa: command-instead-of-module
      ansible.builtin.find:
        paths: /etc/ssh/sshd_config.d
        patterns: "*.conf"
        file_type: file
      register: _sshd_dropin_files

    - name: Delete drop-ins that are not 00-hardening.conf
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _sshd_dropin_files.files | default([]) }}"
      # Hybrid CSB: IT's remote-access role rewrites its drop-in from cron (PermitRootLogin no,
      # also set here); 00-hardening.conf sorts first, so its directives still win.
      when: >-
        item.path | basename not in
        (['00-hardening.conf'] + (['99-csb-remote-access.conf'] if csb_detected | default(false) else []))

    # The kept IT drop-in is trusted by name only; IT's template sets just PermitRootLogin.
    # Anything else (Match, ForceCommand, AuthorizedKeysCommand, ...) would be read by sshd and
    # could add access that 00-hardening.conf does not override, so it is reported.
    - name: Read the IT remote-access sshd drop-in (CSB)
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config.d/99-csb-remote-access.conf
      register: _sshd_csb_dropin
      failed_when: false
      when: csb_detected | default(false)

    - name: Warn when the IT remote-access drop-in sets more than PermitRootLogin
      ansible.builtin.debug:
        msg: >-
          WARNING: /etc/ssh/sshd_config.d/99-csb-remote-access.conf contains directives other than
          PermitRootLogin: {{ _sshd_csb_extra }}. IT's template only sets PermitRootLogin; review the
          file (sudo cat) and remove it if it was not placed by IT.
      vars:
        _sshd_csb_extra: >-
          {{ (_sshd_csb_dropin.content | b64decode).splitlines() | map('trim')
             | reject('match', '^(#|$)') | reject('match', '(?i)^PermitRootLogin\s') | list }}
      when:
        - csb_detected | default(false)
        - _sshd_csb_dropin.content is defined
        - _sshd_csb_extra | length > 0

    - name: Check whether sshd.service.d exists
      ansible.builtin.stat:
        path: /etc/systemd/system/sshd.service.d
      register: _sshd_unit_dropin_dir

    - name: Remove unauthorized drop-ins from /etc/systemd/system/sshd.service.d  # noqa: command-instead-of-module
      ansible.builtin.find:
        paths: /etc/systemd/system/sshd.service.d
        patterns: "*.conf"
        file_type: file
      register: _sshd_unit_dropin_files
      when: _sshd_unit_dropin_dir.stat.isdir | default(false)  # find warns on a missing dir

    - name: Delete all sshd.service.d drop-ins (none are playbook-owned)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _sshd_unit_dropin_files.files | default([]) }}"
      notify: Restart sshd

    - name: Generate missing SSH host keys so sshd -t can run  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: ssh-keygen -A
      changed_when: false
      check_mode: false  # idempotent; must run in check mode so sshd -t below succeeds
      when: system_is_container  # containers skip sshd.service start, so sshd-keygen.service never runs

    - name: Deploy sshd hardening config to temp location
      ansible.builtin.template:
        src: sshd-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/.00-hardening.conf.tmp
        owner: root
        group: root
        mode: "0600"
      register: _sshd_temp_template
      changed_when: false  # validation scratch is removed in this transaction

    # Check mode writes no temp file to move, so show the drop-in diff directly instead.
    - name: Preview sshd hardening drop-in changes
      ansible.builtin.template:
        src: sshd-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        owner: root
        group: root
        mode: "0600"
      when: ansible_check_mode

    - name: Atomically move config to production location for validation
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config.d/.00-hardening.conf.tmp
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      notify: Restart sshd
      register: _sshd_config_copy
      when: not ansible_check_mode

    - name: Validate sshd config after deploying new drop-in
      ansible.builtin.command:
        cmd: sshd -t
      changed_when: false
      when: not ansible_check_mode  # Skip in dry-run - template/copy don't write in check mode
      # If this fails, rescue block removes 00-hardening.conf before sshd restart

    - name: Remove temp file
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/.00-hardening.conf.tmp
        state: absent
      changed_when: false  # validation scratch leaves no persistent change

    - name: Record sshd drop-in checksum for TOCTOU integrity guard
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.d/00-hardening.conf
        checksum_algorithm: sha256
      register: _sshd_dropin_post_validation
      changed_when: false
      check_mode: false  # read-only probe

  rescue:
    - name: Remove broken sshd drop-in to prevent SSH lockout on next restart
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/00-hardening.conf
        state: absent

    - name: Remove temp sshd config file
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/.00-hardening.conf.tmp
        state: absent
      failed_when: false

    - name: Fail after cleaning up broken sshd drop-in
      ansible.builtin.fail:
        msg: >-
          Deploying or validating 00-hardening.conf failed, so the drop-in has been removed
          to prevent SSH lockout on reboot. Error from '{{ ansible_failed_task.name | default('unknown') }}':
          {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('unknown')) | truncate(300) }}

# Mask the SSH socket unit (ssh.socket on Debian, sshd.socket elsewhere) to prevent port-22 socket
# activation (sshd.service on port 722 is authoritative).
# Without masking, 'systemctl start sshd.socket' would reopen port 22 bypassing the drop-in.
- name: Select SSH socket unit name
  ansible.builtin.set_fact:
    _system_ssh_socket_unit: "{{ 'ssh.socket' if is_apt else 'sshd.socket' }}"

- name: Inspect SSH socket availability independently of service facts
  ansible.builtin.command:
    argv: [systemctl, show, --property=LoadState, --value, "{{ _system_ssh_socket_unit }}"]
  register: _system_sshd_socket_load
  changed_when: false
  check_mode: false
  when:
    - not csb_rhel
    - not system_is_container

- name: Require a valid SSH socket load state before masking
  ansible.builtin.assert:
    that: _system_sshd_socket_load.stdout in ['loaded', 'masked', 'not-found']
    fail_msg: "Unexpected SSH socket load state: {{ _system_sshd_socket_load.stdout }}"
  when:
    - not csb_rhel
    - not system_is_container

- name: Mask SSH socket to prevent port-22 socket activation
  ansible.builtin.systemd:
    name: "{{ _system_ssh_socket_unit }}"
    masked: true
    enabled: false
    state: stopped
    force: true
  when:
    - not csb_rhel
    - not system_is_container  # masking sshd.socket kills the container SSH connection
    - _system_sshd_socket_load.stdout in ['loaded', 'masked']

# --- SELinux SSH port label ---
- name: Label non-default SSH port for SELinux
  when:
    - ssh_port | int != 22
    - ansible_facts['selinux'].status | default('') == 'enabled'
    - not csb_rhel  # CSB: sshd port-722 drop-in not deployed above; no need to label port 722
  block:
    - name: Apply SELinux port label for non-default SSH port
      community.general.seport:
        ports: "{{ ssh_port }}"
        proto: tcp
        setype: ssh_port_t
        state: present
      # No failed_when: false — if the SELinux port label fails, sshd CANNOT bind the
      # new port under SELinux enforcing. Without this label, the sshd restart handler
      # will kill sshd (stop succeeds, start denied by SELinux) leaving the machine
      # SSH-inaccessible. Make this a hard failure so the operator sees it before restart.

  rescue:
    - name: Remove sshd drop-in after SELinux port label failure to prevent SSH lockout
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/00-hardening.conf
        state: absent

    - name: Fail after cleaning up sshd drop-in due to SELinux port label failure
      ansible.builtin.fail:
        msg: >-
          SELinux port label for port {{ ssh_port }} failed — 00-hardening.conf has been removed
          to prevent SSH lockout on next sshd restart. Install policycoreutils-python-utils
          and re-run make system.

# --- Crypto policy ---
- name: Check current crypto policy
  ansible.builtin.command:
    cmd: update-crypto-policies --show
  register: system_crypto_policy
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - not csb_rhel
    - is_dnf

# NOTE: this policy sets 40-redhat-crypto-policies.conf, but it does NOT affect
# sshd's negotiated algorithms. 00-hardening.conf (written by the sshd_config
# template) sorts before 40-redhat-crypto-policies.conf and its explicit
# Ciphers/MACs/KexAlgorithms directives take precedence via first-occurrence
# semantics. To change sshd's algorithm negotiation, adjust ssh_ciphers,
# ssh_macs, and ssh_kex_algorithms — not system_crypto_policy_target.
- name: Set crypto policy to {{ system_crypto_policy_target }}
  ansible.builtin.command:
    cmd: update-crypto-policies --set {{ system_crypto_policy_target }}
  when:
    - system_crypto_policy.rc | default(-1) == 0
    - system_crypto_policy.stdout | default('') != system_crypto_policy_target
    - not csb_rhel  # RHEL CSB: IT may enforce FIPS/FUTURE
    # Fedora CSB: IT's infosec role resets the policy to DEFAULT on every csb-cron run, so
    # setting it here only flip-flops (and re-notifies sshd/chronyd each make all).
    - not csb_detected
    - is_dnf
  register: system_crypto_policy_set
  changed_when: system_crypto_policy_set.rc == 0
  failed_when: false
  notify:
    - Restart sshd
    - Restart chronyd

- name: Warn if crypto policy update failed (SHA1 may remain active)
  ansible.builtin.debug:
    msg: >-
      WARNING: update-crypto-policies --set {{ system_crypto_policy_target }} failed
      (rc={{ system_crypto_policy_set.rc }}). SHA1-based cipher suites
      may remain permitted — CIS {{ system_crypto_policy_target }} policy not enforced.
  when:
    - system_crypto_policy_set.rc | default(0) != 0

# --- TOCTOU guard: re-verify drop-in integrity before sshd restart handler fires ---
- name: Re-stat sshd drop-in before handler fires (TOCTOU guard)
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/00-hardening.conf
    checksum_algorithm: sha256
  register: _sshd_dropin_pre_handler
  changed_when: false
  check_mode: false  # read-only probe
  when:
    - _sshd_dropin_post_validation is defined
    - _sshd_dropin_post_validation.stat is defined

- name: Abort if sshd drop-in changed since sshd -t validation (TOCTOU guard)
  ansible.builtin.fail:
    msg: >-
      SECURITY: /etc/ssh/sshd_config.d/00-hardening.conf changed after sshd -t
      validated it — possible TOCTOU file substitution. Aborting before sshd restart
      to prevent loading an unvalidated config. Re-run make system to recover.
      Expected: {{ _sshd_dropin_post_validation.stat.checksum }}
      Found:    {{ _sshd_dropin_pre_handler.stat.checksum | default('missing') }}
  when:
    - _sshd_dropin_post_validation is defined
    - _sshd_dropin_post_validation.stat is defined
    # check mode never writes the drop-in, so on a first provision there is nothing to compare
    - _sshd_dropin_post_validation.stat.exists | default(false)
    - (_sshd_dropin_pre_handler.stat.checksum | default('')) !=
      _sshd_dropin_post_validation.stat.checksum

# force_handlers is false: if an earlier run failed after writing the drop-in, that run's restart
# was lost and this run sees no change. Restart whenever sshd is up but not on the configured port.
- name: Detect sshd not yet listening on the configured port (interrupted earlier run)  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      systemctl is-active --quiet {{ 'ssh' if is_apt else 'sshd' }} || exit 0
      ss -Htln "sport = :{{ ssh_port | int }}" | grep -q . || echo not-listening
    executable: /bin/bash
  register: _sshd_port_live
  changed_when: "'not-listening' in _sshd_port_live.stdout"
  failed_when: false
  check_mode: false
  notify: Restart sshd
  when: not system_is_container

- name: Check if provisioning session is over SSH on port 22 (connection safety check)
  ansible.builtin.set_fact:
    _ssh_connection_port: "{{ lookup('env', 'SSH_CONNECTION').split()[-1] | default('') }}"
  when:
    - ssh_port | int != 22
    - lookup('env', 'SSH_CONNECTION') | length > 0

- name: Fail if changing SSH port while connected over port 22 outside tmux (prevents connection loss)
  ansible.builtin.fail:
    msg: >-
      SAFETY: Cannot change sshd to port {{ ssh_port }} while provisioning session is
      running over bare SSH port {{ _ssh_connection_port }} (no tmux/screen detected).
      The sshd restart will kill this connection and abort provisioning mid-run.
      Fix: Run inside tmux (tmux new-session -s provision 'make all') or at local console.
      See CLAUDE.md Quick Reference step 4. To override (only if you know tmux is active),
      set system_ssh_port_change_override: true in config.yml.
  when:
    - ssh_port | int != 22
    - _ssh_connection_port | default('') == '22'
    - lookup('env', 'TMUX') == ''     # tmux sets $TMUX; inside tmux = safe (survives sshd restart)
    - lookup('env', 'STY') == ''      # GNU screen sets $STY; also safe
    - not (system_ssh_port_change_override | default(false) | bool)

- name: Flush sshd restart handler immediately after TOCTOU integrity check passes
  ansible.builtin.meta: flush_handlers
