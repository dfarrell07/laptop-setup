---
# --- Services ---

- name: Detect pcscd.socket (installed with the YubiKey packages; absent if disabled)
  ansible.builtin.command: # noqa: command-instead-of-module
    cmd: systemctl cat pcscd.socket
  register: system_pcscd_check
  failed_when: false
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - is_dnf or is_apt
    - not system_is_container

- name: Enable pcscd.socket for ykman PIV/OATH (skipped if pcscd not installed)
  ansible.builtin.systemd:
    name: pcscd.socket
    state: started
    enabled: true
  when:
    - is_dnf or is_apt
    - not system_is_container
    - (system_pcscd_check.rc | default(-1)) == 0

- name: Detect bpfman.socket (may not be installed yet on first provision)
  ansible.builtin.command: # noqa: command-instead-of-module
    cmd: systemctl cat bpfman.socket
  register: system_bpfman_check
  failed_when: false
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - is_dnf
    - not system_is_container

- name: Enable bpfman.socket (skipped if bpfman not yet installed)
  ansible.builtin.systemd:
    name: bpfman.socket
    state: started
    enabled: true
  when:
    - packages_bpfman_enabled | bool
    - is_dnf
    - not system_is_container
    - (system_bpfman_check.rc | default(-1)) == 0

- name: Stop and disable bpfman.socket (packages_bpfman_enabled disabled)
  ansible.builtin.systemd:
    name: bpfman.socket
    state: stopped
    enabled: false
  when:
    - not (packages_bpfman_enabled | bool)
    - is_dnf
    - not system_is_container
    - (system_bpfman_check.rc | default(-1)) == 0

# libvirt/kvm group membership is handled by the packages role (install_virtualization.yml)
# after the groups exist.

# Same gate as the repos_dnf Mullvad repo: personal Fedora only, never on CSB.
- name: Install and enable Mullvad VPN
  when:
    - install_vpn | bool
    - is_dnf
    - is_fedora
    - repo_mullvad | bool
    - profile == 'personal'
    - not csb_detected | bool

  block:
    - name: Install Mullvad VPN
      ansible.builtin.dnf:
        name: mullvad-vpn
        state: present
      register: _system_mullvad_install
      notify: Reload systemd daemon
      when: not system_is_container
      # Missing package (repo not added, or only simulated in check mode) warns below instead of failing;
      # dnf4 reports 'No match for argument', dnf5 'No package <name> available'.
      failed_when: >-
        _system_mullvad_install.failed and not
        ((_system_mullvad_install.msg | default('')) is search('No match for argument')
         or (_system_mullvad_install.failures | default([]) | join(' ')) is search('No package mullvad-vpn available'))

    - name: Warn if Mullvad VPN package install failed
      ansible.builtin.debug:
        msg: >-
          {{ 'CHECK MODE: mullvad-vpn is not available until its repo is really added; the install
          was not simulated' if ansible_check_mode else
          'WARNING: Mullvad VPN package install failed (rc=' ~ (_system_mullvad_install.rc | default('n/a'))
          ~ '); mullvad-daemon will not be enabled and VPN protection is not active on this host' }}
      when: _system_mullvad_install.rc | default(0) != 0

    - name: Enable Mullvad VPN service
      ansible.builtin.systemd:
        name: mullvad-daemon
        state: started
        enabled: true
      when:
        - not system_is_container
        - _system_mullvad_install.rc == 0
        - not (ansible_check_mode and _system_mullvad_install is changed)  # install only simulated in check mode
- name: Detect mullvad-daemon (may not be installed)
  ansible.builtin.command: # noqa: command-instead-of-module
    cmd: systemctl cat mullvad-daemon
  register: system_mullvad_check
  failed_when: false
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - not (install_vpn | bool)
    - is_dnf
    - is_fedora
    - not system_is_container

- name: Stop and disable Mullvad VPN service (install_vpn disabled)
  ansible.builtin.systemd:
    name: mullvad-daemon
    state: stopped
    enabled: false
  when:
    - not (install_vpn | bool)
    - is_dnf
    - is_fedora
    - not system_is_container
    - (system_mullvad_check.rc | default(-1)) == 0
  register: _system_mullvad_stop_result
  failed_when: >-
    _system_mullvad_stop_result is failed and
    'Unit mullvad-daemon not found' not in (_system_mullvad_stop_result.msg | default(''))

# --- USBGuard ---
- name: Detect usbguard (may not be installed)
  ansible.builtin.command: # noqa: command-instead-of-module
    cmd: systemctl cat usbguard
  register: system_usbguard_check
  failed_when: false
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - not (system_install_usbguard | bool)
    - is_dnf
    - not system_is_container

- name: Stop and disable USBGuard (system_install_usbguard disabled)
  ansible.builtin.systemd:
    name: usbguard
    state: stopped
    enabled: false
  when:
    - not (system_install_usbguard | bool)
    - is_dnf
    - not system_is_container
    - (system_usbguard_check.rc | default(-1)) == 0
  register: _system_usbguard_stop_result
  failed_when: >-
    _system_usbguard_stop_result is failed and
    'Unit usbguard not found' not in (_system_usbguard_stop_result.msg | default(''))

- name: Install and enable USBGuard
  when:
    - system_install_usbguard | bool
    - is_dnf  # usbguard-selinux is Fedora/RHEL-only
    - not system_is_container
  block:
    - name: Install USBGuard
      ansible.builtin.dnf:
        name:
          - usbguard
          - usbguard-selinux
        state: present
      register: _system_usbguard_install

    - name: Note USBGuard config steps wait for the real install in check mode
      ansible.builtin.set_fact:
        # check mode only simulates the install, so usbguard-daemon.conf and the unit do not exist yet
        _system_usbguard_pending: "{{ ansible_check_mode and _system_usbguard_install is changed }}"

    - name: Report USBGuard configuration not simulated in check mode
      ansible.builtin.debug:
        msg: "CHECK MODE: usbguard is not installed yet; daemon config edits and service enable not simulated."
      when: _system_usbguard_pending | bool

    - name: Warn about USBGuard rules whose name contains '*' (matched literally)
      ansible.builtin.debug:
        msg: >-
          WARNING: USBGuard compares name/serial strings exactly ('*' is a wildcard only in
          id and interface types), so this rule never matches a real device: {{ item }}.
          Use the exact product string (make usb-add writes it) or drop the name clause.
      loop: "{{ (system_usbguard_whitelist + system_usbguard_extra_rules) | select('search', '(name|serial) \"[^\"]*\\*') | list }}"

    - name: Deploy USBGuard whitelist rules
      ansible.builtin.template:
        src: usbguard-rules.conf.j2
        dest: /etc/usbguard/rules.conf
        owner: root
        group: root
        mode: "0600"
      notify: Restart usbguard
      # No failed_when: false — a missing or corrupt rules.conf means USBGuard starts
      # with ImplicitPolicyTarget=block and an empty ruleset, blocking all USB devices
      # including the keyboard. Template failure must be a hard stop.

    - name: Verify USBGuard rules.conf is non-empty before enabling service
      ansible.builtin.stat:
        path: /etc/usbguard/rules.conf
      register: system_usbguard_rules_stat
      when: not ansible_check_mode

    - name: Assert USBGuard rules.conf non-empty (keyboard safety)
      ansible.builtin.assert:
        that:
          - system_usbguard_rules_stat.stat.exists | default(false)
          - system_usbguard_rules_stat.stat.size | default(0) > 0
        fail_msg: >-
          /etc/usbguard/rules.conf is missing or empty. Starting USBGuard now would block
          ALL USB devices including the keyboard. Fix the template and re-run before enabling.
      when: not ansible_check_mode

    - name: Enforce ImplicitPolicyTarget=block in usbguard-daemon.conf
      ansible.builtin.lineinfile:
        path: /etc/usbguard/usbguard-daemon.conf
        regexp: '^ImplicitPolicyTarget='
        line: 'ImplicitPolicyTarget=block'
        state: present
      notify: Restart usbguard
      when: not _system_usbguard_pending | bool

    - name: Enforce AuditBackend=LinuxAudit in usbguard-daemon.conf
      ansible.builtin.lineinfile:
        path: /etc/usbguard/usbguard-daemon.conf
        regexp: '^AuditBackend='
        line: 'AuditBackend=LinuxAudit'
        state: present
      notify: Restart usbguard
      when: not _system_usbguard_pending | bool

    - name: Enforce IPCAllowedGroups=wheel in usbguard-daemon.conf
      ansible.builtin.lineinfile:
        path: /etc/usbguard/usbguard-daemon.conf
        regexp: '^IPCAllowedGroups='
        line: 'IPCAllowedGroups=wheel'
        state: present
      notify: Restart usbguard
      when: not _system_usbguard_pending | bool

    - name: Enforce PresentDevicePolicy=keep in usbguard-daemon.conf
      ansible.builtin.lineinfile:
        path: /etc/usbguard/usbguard-daemon.conf
        regexp: '^PresentDevicePolicy='
        line: 'PresentDevicePolicy={{ system_usbguard_present_device_policy }}'
        state: present
      notify: Restart usbguard
      when: not _system_usbguard_pending | bool

    - name: Enforce InsertedDevicePolicy in usbguard-daemon.conf
      ansible.builtin.lineinfile:
        path: /etc/usbguard/usbguard-daemon.conf
        regexp: '^InsertedDevicePolicy='
        line: 'InsertedDevicePolicy={{ system_usbguard_inserted_device_policy }}'
        state: present
      notify: Restart usbguard
      when: not _system_usbguard_pending | bool

    - name: Enable USBGuard service
      ansible.builtin.systemd:
        name: usbguard
        state: started
        enabled: true
        daemon_reload: "{{ _system_usbguard_install.changed }}"
      when: not _system_usbguard_pending | bool
