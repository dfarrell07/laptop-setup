---
# --- Services ---

- name: Detect pcscd.socket (installed with the YubiKey packages; absent if disabled)
  ansible.builtin.command: # noqa: command-instead-of-module
    cmd: systemctl cat pcscd.socket
  register: system_pcscd_check
  failed_when: false
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - is_dnf or is_apt
    - not system_is_container

- name: Enable pcscd.socket for ykman PIV/OATH (skipped if pcscd not installed)
  ansible.builtin.systemd:
    name: pcscd.socket
    state: started
    enabled: true
  when:
    - is_dnf or is_apt
    - not system_is_container
    - (system_pcscd_check.rc | default(-1)) == 0

- name: Detect bpfman.socket (may not be installed yet on first provision)
  ansible.builtin.command: # noqa: command-instead-of-module
    cmd: systemctl cat bpfman.socket
  register: system_bpfman_check
  failed_when: false
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - is_dnf
    - not system_is_container

- name: Enable bpfman.socket (skipped if bpfman not yet installed)
  ansible.builtin.systemd:
    name: bpfman.socket
    state: started
    enabled: true
  when:
    - packages_bpfman_enabled | bool
    - is_dnf
    - not system_is_container
    - (system_bpfman_check.rc | default(-1)) == 0

- name: Stop and disable bpfman.socket (packages_bpfman_enabled disabled)
  ansible.builtin.systemd:
    name: bpfman.socket
    state: stopped
    enabled: false
  when:
    - not (packages_bpfman_enabled | bool)
    - is_dnf
    - not system_is_container
    - (system_bpfman_check.rc | default(-1)) == 0

# libvirt/kvm group membership is handled by the packages role (install_virtualization.yml)
# after the groups exist.

# Same gate as the repos_dnf Mullvad repo: personal Fedora only, never on CSB.
- name: Install and enable Mullvad VPN
  when:
    - install_vpn | bool
    - is_dnf
    - is_fedora
    - repo_mullvad | bool
    - profile == 'personal'
    - not csb_detected | bool

  block:
    - name: Install Mullvad VPN
      ansible.builtin.dnf:
        name: mullvad-vpn
        state: present
      register: _system_mullvad_install
      notify: Reload systemd daemon
      when: not system_is_container
      # Missing package (repo not added, or only simulated in check mode) warns below instead of failing;
      # dnf4 reports 'No match for argument', dnf5 'No package <name> available'.
      failed_when: >-
        _system_mullvad_install.failed and not
        ((_system_mullvad_install.msg | default('')) is search('No match for argument')
         or (_system_mullvad_install.failures | default([]) | join(' ')) is search('No package mullvad-vpn available'))

    - name: Warn if Mullvad VPN package install failed
      ansible.builtin.debug:
        msg: >-
          {{ 'CHECK MODE: mullvad-vpn is not available until its repo is really added; the install
          was not simulated' if ansible_check_mode else
          'WARNING: Mullvad VPN package install failed (rc=' ~ (_system_mullvad_install.rc | default('n/a'))
          ~ '); mullvad-daemon will not be enabled and VPN protection is not active on this host' }}
      when: _system_mullvad_install.rc | default(0) != 0

    - name: Enable Mullvad VPN service
      ansible.builtin.systemd:
        name: mullvad-daemon
        state: started
        enabled: true
      when:
        - not system_is_container
        - _system_mullvad_install.rc == 0
        - not (ansible_check_mode and _system_mullvad_install is changed)  # install only simulated in check mode
- name: Detect mullvad-daemon (may not be installed)
  ansible.builtin.command: # noqa: command-instead-of-module
    cmd: systemctl cat mullvad-daemon
  register: system_mullvad_check
  failed_when: false
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - not (install_vpn | bool)
    - is_dnf
    - is_fedora
    - not system_is_container

- name: Stop and disable Mullvad VPN service (install_vpn disabled)
  ansible.builtin.systemd:
    name: mullvad-daemon
    state: stopped
    enabled: false
  when:
    - not (install_vpn | bool)
    - is_dnf
    - is_fedora
    - not system_is_container
    - (system_mullvad_check.rc | default(-1)) == 0
  register: _system_mullvad_stop_result
  failed_when: >-
    _system_mullvad_stop_result is failed and
    'Unit mullvad-daemon not found' not in (_system_mullvad_stop_result.msg | default(''))
