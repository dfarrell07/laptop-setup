---
# roles/system/tasks/sysctl.yml
# --- Sysctl hardening ---
# Merge system_sysrq into the dict so config.yml can override without replacing
# the entire system_sysctl_hardening dict. Default is 0 (CIS); set 176 in
# config.yml for sync(16)+remount-ro(32)+reboot(128) on a kernel dev workstation.
- name: Assert accept_ra=1 is not used with ip_forward=1
  when: not system_is_container
  ansible.builtin.assert:
    that: system_ipv6_accept_ra | int != 1 or not (system_enable_ip_forward | bool)
    fail_msg: >-
      system_ipv6_accept_ra: 1 is silently suppressed by the kernel when ip_forward=1.
      Use system_ipv6_accept_ra: 2 to enable SLAAC.

# net.ipv4.tcp_timestamps is left at the kernel default (1) globally. CIS 3.3.9
# recommends 0, but disabling timestamps harms RTTM/PAWS on high-BDP links
# (OVN-K, Submariner). No conditional override is applied.
- name: Apply sysctl hardening (non-container, non-CSB-RHEL)
  when:
    - not system_is_container
    - not csb_rhel  # CSB: IT manages sysctl via SCAP; 90-hardening.conf would conflict
  block:
    - name: Ensure /etc/sysctl.d exists
      ansible.builtin.file:
        path: /etc/sysctl.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Assert no toggle-managed sysctl keys in extra dicts
      ansible.builtin.assert:
        that:
          - "(_item.dict.keys() | intersect(_toggle_keys)) | length == 0"
        fail_msg: >-
          Toggle-managed keys
          {{ _item.dict.keys() | intersect(_toggle_keys) | join(', ') }}
          found in {{ _item.name }}. Use the corresponding toggle variables
          instead: system_enable_ip_forward
          (net.ipv4.ip_forward, net.ipv6.conf.all.forwarding),
          system_ptrace_scope (kernel.yama.ptrace_scope),
          system_kexec_load_disabled (kernel.kexec_load_disabled),
          system_io_uring_disabled (kernel.io_uring_disabled),
          system_sysrq (kernel.sysrq),
          system_core_pattern (kernel.core_pattern),
          system_kernel_panic (kernel.panic),
          system_kernel_panic_on_oops (kernel.panic_on_oops),
          system_unprivileged_bpf_disabled (kernel.unprivileged_bpf_disabled),
          system_bpf_jit_harden (net.core.bpf_jit_harden),
          system_ipv6_accept_ra (net.ipv6.conf.all.accept_ra,
          net.ipv6.conf.default.accept_ra),
          system_perf_event_paranoid (kernel.perf_event_paranoid).
      vars:
        _toggle_keys:
          - net.ipv4.ip_forward
          - net.ipv6.conf.all.forwarding
          - kernel.yama.ptrace_scope
          - kernel.kexec_load_disabled
          - kernel.io_uring_disabled
          - kernel.sysrq
          - kernel.core_pattern
          - kernel.panic
          - kernel.panic_on_oops
          - kernel.unprivileged_bpf_disabled
          - net.core.bpf_jit_harden
          - net.ipv6.conf.all.accept_ra
          - net.ipv6.conf.default.accept_ra
          - kernel.perf_event_paranoid
      loop:
        - name: system_sysctl_extra
          dict: "{{ system_sysctl_extra }}"
        - name: system_sysctl_extra_additional
          dict: "{{ system_sysctl_extra_additional }}"
      loop_control:
        loop_var: _item

    - name: Merge configurable sysctl values into hardening dict
      ansible.builtin.set_fact:
        system_sysctl_hardening: "{{ system_sysctl_hardening | combine({
            'kernel.sysrq': system_sysrq | int,
            'net.ipv6.conf.all.accept_ra': system_ipv6_accept_ra | int,
            'net.ipv6.conf.default.accept_ra': system_ipv6_accept_ra | int,
            'net.core.bpf_jit_harden': system_bpf_jit_harden | int,
            'kernel.unprivileged_bpf_disabled': system_unprivileged_bpf_disabled | int,
            'kernel.panic': system_kernel_panic | int,
            'kernel.panic_on_oops': system_kernel_panic_on_oops | int,
            'kernel.core_pattern': system_core_pattern,
            'kernel.yama.ptrace_scope': system_ptrace_scope | int,
            'kernel.perf_event_paranoid': system_perf_event_paranoid | int,
            'kernel.kexec_load_disabled': system_kexec_load_disabled | int,
            'kernel.io_uring_disabled': system_io_uring_disabled | int,
            'net.ipv4.ip_forward': system_enable_ip_forward | bool | int,
            'net.ipv6.conf.all.forwarding': system_enable_ip_forward | bool | int
          }) | combine(system_sysctl_extra) | combine(system_sysctl_extra_additional) }}" # noqa: jinja[spacing]

    - name: Deploy sysctl hardening config
      ansible.builtin.template:
        src: sysctl-hardening.conf.j2
        dest: /etc/sysctl.d/90-hardening.conf
        mode: "0644"
      notify: Apply sysctl
      # EPERM for kernel.unprivileged_bpf_disabled (write-locked on Fedora 44) is
      # tolerated in the handler's failed_when (handlers/main.yml).

- name: Set ip_forward on RHEL CSB (Tailscale/kind require it; SCAP does not set it)
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value | string }}"
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/91-ansible-ipforward.conf
  loop:
    - {key: net.ipv4.ip_forward, value: "{{ system_enable_ip_forward | bool | int }}"}
    - {key: net.ipv6.conf.all.forwarding, value: "{{ system_enable_ip_forward | bool | int }}"}
  when:
    - csb_rhel
    - system_enable_ip_forward | bool
    - not system_is_container
