---
# roles/system/tasks/dnf_automatic.yml
# --- dnf-automatic ---
# CSB machines are managed by Red Hat IT via RHSM/Satellite with their own
# maintenance windows. Running dnf-automatic in parallel could install packages
# ahead of IT's approval cycle or outside maintenance windows.
- name: Install and enable dnf-automatic
  when:
    - is_dnf
    - not csb_rhel
    - not system_is_container  # RPM post-install calls systemctl daemon-reload, crashes Podman container systemd
  block:
    - name: Install dnf-automatic
      ansible.builtin.dnf:
        name: "{{ 'dnf5-plugin-automatic' if is_dnf5 else 'dnf-automatic' }}"
        state: present
      register: system_dnf_automatic_installed

    - name: Deploy dnf-automatic config
      ansible.builtin.template:
        src: dnf-automatic.conf.j2
        dest: /etc/dnf/automatic.conf
        mode: "0644"
      notify: Restart dnf-automatic timer

    - name: Set dnf-automatic service/timer name facts
      ansible.builtin.set_fact:
        _dnf_auto_svc: "{{ 'dnf5-automatic.service' if is_dnf5 else 'dnf-automatic.service' }}"
        _dnf_auto_timer: "{{ 'dnf5-automatic.timer' if is_dnf5 else 'dnf-automatic.timer' }}"

    - name: Enable dnf-automatic timer
      ansible.builtin.systemd:
        name: "{{ _dnf_auto_timer }}"
        state: started
        enabled: true
      # check mode only simulates the install, so the timer unit does not exist yet
      when: not (ansible_check_mode and system_dnf_automatic_installed is changed)

  rescue:
    - name: Record dnf-automatic install/enable failure (CSB restriction)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: system
        _csb_task_name: "Install and enable dnf-automatic"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Check repo connectivity and re-run provisioning. Automatic security updates
          are disabled until dnf-automatic is installed and enabled.
        _csb_ticket_summary: "Cannot install dnf-automatic on CSB"
        _csb_ticket_body: >-
          Attempted to install {{ 'dnf5-plugin-automatic' if is_dnf5 else 'dnf-automatic' }}
          but installation failed. Error: {{ ansible_failed_result.msg | default('unknown error') }}.
          This may indicate repo connectivity issues or package unavailability.
          Automatic security updates are disabled without dnf-automatic.
      when: csb_detected

    - name: Fail on dnf-automatic install/enable failure
      ansible.builtin.fail:
        msg: >-
          dnf-automatic install or enable failed. Automatic security updates are a critical
          hardening requirement. Error: {{ ansible_failed_result.msg | default('unknown error') }}.
          Fix repo connectivity and re-run provisioning.

# --- AIDE database update after dnf-automatic (prevent false-positive alerts) ---
- name: Ensure dnf-automatic service drop-in directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ _dnf_auto_svc }}.d"
    state: directory
    mode: "0755"
  when:
    - is_dnf
    - system_aide_enabled | bool
    - system_dnf_automatic_apply_updates | bool
    - not csb_rhel
    - not system_is_container
    - _dnf_auto_svc is defined

# NOTE: aide_cleanup.yml removes this drop-in when system_aide_enabled=false
- name: Deploy AIDE update hook for dnf-automatic
  ansible.builtin.copy:
    # yamllint disable rule:line-length
    content: |
      # {{ ansible_managed }}
      # Run aide --update after dnf-automatic applies security updates.
      # Without this, every update causes AIDE false-positive alerts that
      # train operators to ignore them, defeating the purpose of AIDE.
      # The '-' prefix makes this advisory — AIDE failures won't block updates.
      [Service]
      ExecStartPost=-/usr/bin/bash -c 'aide --update; [ -f /var/lib/aide/aide.db.new.gz ] && mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz'
    dest: "/etc/systemd/system/{{ _dnf_auto_svc }}.d/aide-update.conf"
    # yamllint enable rule:line-length
    mode: "0644"
  when:
    - is_dnf
    - system_aide_enabled | bool
    - system_dnf_automatic_apply_updates | bool  # hook only meaningful when packages are applied
    - not csb_rhel  # dnf-automatic not installed on CSB
    - not system_is_container
    - _dnf_auto_svc is defined
  notify: Restart dnf-automatic timer

- name: Remove AIDE update hook when dnf-automatic is download-only
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ _dnf_auto_svc }}.d/aide-update.conf"
    state: absent
  when:
    - is_dnf
    - system_aide_enabled | bool
    - not (system_dnf_automatic_apply_updates | bool)
    - not csb_rhel
    - not system_is_container
    - _dnf_auto_svc is defined
  notify: Restart dnf-automatic timer

- name: Remove stale drop-in from non-active dnf-automatic variant (dnf4↔dnf5 transition)
  ansible.builtin.file:
    path: >-
      /etc/systemd/system/{{ 'dnf-automatic.service.d' if is_dnf5 else 'dnf5-automatic.service.d' }}/aide-update.conf
    state: absent
  when:
    - is_dnf
    - system_aide_enabled | bool
    - not csb_rhel
    - not system_is_container

# NOTE: The three tasks below intentionally run regardless of system_dnf_automatic_apply_updates.
# If the drop-in directory exists from a prior apply_updates=true provisioning run, any
# unauthorised files should be detected and warned about even in download-only mode.
# The directory itself is removed wholesale by the task below (line 163), so the end state
# is always correct; these tasks provide an early warning for unexpected IT-managed files.
- name: Check whether the dnf-automatic service drop-in directory exists
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ _dnf_auto_svc }}.d"
  register: _dnf_auto_dropin_dir
  when:
    - is_dnf
    - not csb_rhel
    - not system_is_container
    - _dnf_auto_svc is defined

- name: Find unauthorised drop-ins in dnf-automatic service drop-in directory
  ansible.builtin.find:
    paths: "/etc/systemd/system/{{ _dnf_auto_svc }}.d"
    file_type: file
  register: _dnf_auto_dropin_files
  when:
    - is_dnf
    - not csb_rhel
    - not system_is_container
    - _dnf_auto_svc is defined
    - _dnf_auto_dropin_dir.stat.isdir | default(false)  # find warns on a missing dir
  failed_when: false

- name: Compute preserved drop-in paths (aide-update.conf + system_dnf_automatic_dropin_whitelist)
  ansible.builtin.set_fact:
    _dnf_auto_preserved_paths: >-
      {{ ['/etc/systemd/system/' + _dnf_auto_svc + '.d/aide-update.conf'] +
         (system_dnf_automatic_dropin_whitelist | default([])
          | map('regex_replace', '^', '/etc/systemd/system/' + _dnf_auto_svc + '.d/')
          | list) }}
  when:
    - is_dnf
    - not csb_rhel
    - not system_is_container
    - _dnf_auto_svc is defined

- name: Warn about unexpected drop-ins to be removed from dnf-automatic drop-in directory
  ansible.builtin.debug:
    msg: >-
      Removing unexpected drop-in from {{ _dnf_auto_svc }}.d: {{ item.path }}.
      If this file is IT-managed, add its filename to system_dnf_automatic_dropin_whitelist
      in config.yml to preserve it.
  loop: "{{ _dnf_auto_dropin_files.files | default([]) | rejectattr('path', 'in', _dnf_auto_preserved_paths | default([])) | list }}"
  when:
    - is_dnf
    - not csb_rhel
    - not system_is_container
    - _dnf_auto_svc is defined

- name: Remove unauthorised drop-ins from dnf-automatic service drop-in directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _dnf_auto_dropin_files.files | default([]) | rejectattr('path', 'in', _dnf_auto_preserved_paths | default([])) | list }}"
  when:
    - is_dnf
    - not csb_rhel
    - not system_is_container
    - _dnf_auto_svc is defined
  notify: Restart dnf-automatic timer

- name: Remove drop-in directory when dnf-automatic is download-only
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ _dnf_auto_svc }}.d"
    state: absent
  when:
    - is_dnf
    - not (system_dnf_automatic_apply_updates | bool)
    - not csb_rhel
    - not system_is_container
    - _dnf_auto_svc is defined
    - system_dnf_automatic_dropin_whitelist | default([]) | length == 0
