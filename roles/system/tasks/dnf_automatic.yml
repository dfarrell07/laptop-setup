---
# roles/system/tasks/dnf_automatic.yml
# --- dnf-automatic ---
# CSB machines are managed by Red Hat IT via RHSM/Satellite with their own
# maintenance windows. Running dnf-automatic in parallel could install packages
# ahead of IT's approval cycle or outside maintenance windows.
- name: Install and enable dnf-automatic
  when:
    - is_dnf
    - not system_is_container  # RPM post-install calls systemctl daemon-reload, crashes Podman container systemd
  block:
    - name: Install dnf-automatic
      ansible.builtin.dnf:
        name: "{{ 'dnf5-plugin-automatic' if is_dnf5 else 'dnf-automatic' }}"
        state: present
      register: system_dnf_automatic_installed

    - name: Deploy dnf-automatic config
      ansible.builtin.template:
        src: dnf-automatic.conf.j2
        dest: /etc/dnf/automatic.conf
        mode: "0644"
      notify: Restart dnf-automatic timer

    - name: Set dnf-automatic service/timer name facts
      ansible.builtin.set_fact:
        _dnf_auto_svc: "{{ 'dnf5-automatic.service' if is_dnf5 else 'dnf-automatic.service' }}"
        _dnf_auto_timer: "{{ 'dnf5-automatic.timer' if is_dnf5 else 'dnf-automatic.timer' }}"

    - name: Enable dnf-automatic timer
      ansible.builtin.systemd:
        name: "{{ _dnf_auto_timer }}"
        state: started
        enabled: true
      # check mode only simulates the install, so the timer unit does not exist yet
      when: not (ansible_check_mode and system_dnf_automatic_installed is changed)

  rescue:
    - name: Fail on dnf-automatic install/enable failure
      ansible.builtin.fail:
        msg: >-
          dnf-automatic install or enable failed. Automatic security updates are a critical
          hardening requirement. Error: {{ ansible_failed_result.msg | default('unknown error') }}.
          Fix repo connectivity and re-run provisioning.

# --- AIDE database update after dnf-automatic (prevent false-positive alerts) ---
- name: Ensure dnf-automatic service drop-in directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ _dnf_auto_svc }}.d"
    state: directory
    mode: "0755"
  when:
    - is_dnf
    - system_aide_enabled | bool
    - system_dnf_automatic_apply_updates | bool
    - not system_is_container
    - _dnf_auto_svc is defined

# NOTE: aide_cleanup.yml removes this drop-in when system_aide_enabled=false
- name: Deploy AIDE update hook for dnf-automatic
  ansible.builtin.copy:
    # yamllint disable rule:line-length
    content: |
      # {{ ansible_managed }}
      # Run aide --update after dnf-automatic applies security updates.
      # Without this, every update causes AIDE false-positive alerts that
      # train operators to ignore them, defeating the purpose of AIDE.
      # The '-' prefix makes this advisory — AIDE failures won't block updates.
      [Service]
      ExecStartPost=-/usr/bin/bash -c 'aide --update; [ -f /var/lib/aide/aide.db.new.gz ] && mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz'
    dest: "/etc/systemd/system/{{ _dnf_auto_svc }}.d/aide-update.conf"
    # yamllint enable rule:line-length
    mode: "0644"
  when:
    - is_dnf
    - system_aide_enabled | bool
    - system_dnf_automatic_apply_updates | bool  # hook only meaningful when packages are applied
    - not system_is_container
    - _dnf_auto_svc is defined
  notify: Restart dnf-automatic timer

- name: Remove AIDE update hook when dnf-automatic is download-only
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ _dnf_auto_svc }}.d/aide-update.conf"
    state: absent
  when:
    - is_dnf
    - system_aide_enabled | bool
    - not (system_dnf_automatic_apply_updates | bool)
    - not system_is_container
    - _dnf_auto_svc is defined
  notify: Restart dnf-automatic timer
