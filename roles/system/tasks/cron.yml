---
# --- Cron access restriction (defense-in-depth if cronie is ever installed) ---
# RHEL CSB: Satellite katello-agent, Insights client, and IT monitoring agents commonly run
# cron jobs under dedicated non-root system users. Creating cron.allow with only 'root'
# would silently block those IT management jobs. Skip on RHEL CSB only.
# Fedora hybrid: those IT tools are absent — cron.allow=root is safe CIS 5.1.8/5.1.9 hardening.
- name: Cron access restriction (skip on RHEL CSB and containers)
  when:
    - not system_is_container
    - not csb_rhel
  block:
    - name: Warn if non-root user crontabs exist before restricting cron access
      ansible.builtin.find:
        paths: /var/spool/cron
        excludes: root
        file_type: file
      register: system_existing_crontabs
      failed_when: false

    - name: Alert operator about user crontabs that will be silently blocked
      ansible.builtin.debug:
        msg: >-
          WARNING: Non-root crontabs found and will be silently blocked by cron.allow=root:
          {{ system_existing_crontabs.files | map(attribute='path') | list }}.
          Review these jobs before proceeding.
      when:
        - (system_existing_crontabs.files | default([])) | length > 0

    - name: Check if root crontab exists
      ansible.builtin.stat:
        path: /var/spool/cron/root
      register: system_root_crontab_stat
      failed_when: false

    - name: Read root crontab if it exists
      ansible.builtin.slurp:
        src: /var/spool/cron/root
      register: system_root_crontab_content
      when: system_root_crontab_stat.stat.exists | default(false)

    - name: Warn if root crontab contains pre-existing jobs
      ansible.builtin.debug:
        msg: >-
          WARNING: /var/spool/cron/root exists with content — pre-existing root cron
          jobs may persist outside Ansible management:
          {{ system_root_crontab_content.content | b64decode | trim }}
      when:
        - system_root_crontab_stat.stat.exists | default(false)
        - system_root_crontab_content.content is defined
        - (system_root_crontab_content.content | b64decode | trim) | length > 0

    - name: Restrict cron and at access to root only (CIS 5.1.8/5.1.9)
      ansible.builtin.copy:
        content: "root\n"
        dest: "{{ item }}"
        mode: "0600"
      loop:
        - /etc/cron.allow
        - /etc/at.allow

    - name: Remove cron.deny and at.deny (CIS 5.1.8-5.1.9 — allow files are authoritative)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cron.deny
        - /etc/at.deny

    - name: Harden cron directory permissions (CIS 5.1.2-5.1.7)
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - path: /etc/crontab
          mode: "0600"
        - path: /etc/cron.hourly
          mode: "0700"
        - path: /etc/cron.daily
          mode: "0700"
        - path: /etc/cron.weekly
          mode: "0700"
        - path: /etc/cron.monthly
          mode: "0700"
        - path: /etc/cron.d
          mode: "0700"
      loop_control:
        label: "{{ item.path }}"
      failed_when: false

    - name: Find unmanaged files in /etc/cron.d
      ansible.builtin.find:
        paths: /etc/cron.d
        file_type: file
      register: system_crond_files
      failed_when: false

    - name: Warn about unmanaged files in /etc/cron.d
      ansible.builtin.debug:
        msg: >-
          WARNING: Files found in /etc/cron.d not managed by this role:
          {{ system_crond_files.files | map(attribute='path') | list }}.
          Review each file for unexpected cron jobs placed before provisioning.
      when:
        - (system_crond_files.files | default([])) | length > 0
