---
# --- GRUB bootloader password (CIS 1.4.2) ---
# Protects against kernel parameter tampering (lockdown=integrity removal, single-user mode)
# with physical console access. Opt-in via system_grub_password_enabled: true in config.yml.
# CRITICAL: system_grub_password_hash MUST come from vault.yml (encrypted), never plaintext
# config.yml. This prevents secret exposure in git history and plaintext backups.
# Skipped on containers (no GRUB) and RHEL CSB (IT manages boot configuration).

- name: Debug GRUB password configuration
  ansible.builtin.debug:
    msg: |
      GRUB password: enabled={{ system_grub_password_enabled }}
      container={{ system_is_container }}
      csb_rhel={{ csb_rhel }}
      hash_set={{ system_grub_password_hash | length > 0 }}
    verbosity: 1
  when: system_grub_password_enabled or not (system_is_container or csb_rhel)

# Requires either grub2-tools (Fedora) or grub-pc (Debian).
# grub2-mkconfig (Fedora) / grub-mkconfig (Debian) regenerates /boot/grub*/grub.cfg
- name: Ensure GRUB password config prerequisites (grub2-tools or grub-pc)
  when:
    - system_grub_password_enabled
    - not (system_is_container or csb_rhel)
  block:
    - name: "GRUB password: Install grub2-tools (Fedora/RHEL)"
      ansible.builtin.dnf:
        name: grub2-tools
        state: present
      when: is_dnf
      register: _grub_dnf_install_result

    - name: "GRUB password: Install grub-pc (Debian/Ubuntu)"
      ansible.builtin.apt:
        name: grub-pc
        state: present
        update_cache: yes
      when: is_apt
      register: _grub_apt_install_result

  rescue:
    - name: "GRUB password: Handle installation failure (CSB report)"
      ansible.builtin.include_tasks: ../../../common/tasks/csb-failure-handler.yml
      vars:
        _csb_role: system
        _csb_task_name: "GRUB password prerequisites installation (grub2-tools/grub-pc)"
        _csb_action: "Verify network connectivity and package repository availability. Re-run 'make system' after confirming repos are accessible."
        _csb_ticket_summary: "GRUB bootloader tools installation failed — CIS 1.4.2 hardening bypass risk"
        _csb_ticket_body: |
          GRUB password prerequisites installation failed during system provisioning.
          This blocks CIS 1.4.2 bootloader password hardening (protection against kernel parameter tampering).

          Affected packages:
          - grub2-tools (Fedora/RHEL): {{ _grub_dnf_install_result | default({}) | to_json }}
          - grub-pc (Debian/Ubuntu): {{ _grub_apt_install_result | default({}) | to_json }}

          Required action: Ensure package repositories are accessible and re-run provisioning.
          Without GRUB password, users can modify kernel parameters (e.g., disable lockdown=integrity) from the GRUB menu.
        _csb_error: "{{ ansible_failed_result.msg | default('grub2-tools or grub-pc installation failed') }}"
        _csb_ticket_priority: "High"
        _csb_ticket_category: "Security Hardening"

- name: "GRUB password: Assert hash is valid PBKDF2 format"
  ansible.builtin.assert:
    that:
      - system_grub_password_hash | length > 0
      - system_grub_password_hash is regex('^grub\.pbkdf2\.sha512\.[0-9]+\.[a-zA-Z0-9]+\.[a-zA-Z0-9]+$')
      - (system_grub_password_hash.split('.')[3] | int) >= 10000
    fail_msg: >-
      SECURITY: system_grub_password_hash is not a valid PBKDF2 hash.

      GRUB bootloader password (CIS 1.4.2) is enabled, but the hash is missing,
      malformed, uses insufficient rounds, or is in the wrong format. This breaks
      kernel parameter tampering protection (e.g., disabling lockdown=integrity).

      Required format: grub.pbkdf2.sha512.ROUNDS.SALT.HASH
      - Prefix: "grub.pbkdf2.sha512." (required)
      - ROUNDS: numeric value >= 10000 (security minimum)
      - SALT: alphanumeric (generated by grub*-mkpasswd-pbkdf2)
      - HASH: alphanumeric (generated by grub*-mkpasswd-pbkdf2)

      Valid example: grub.pbkdf2.sha512.10000.1234567890abcdef.LONGHASHHEREWITHENOUGHBYTES

      Do NOT use:
      - Plaintext passwords (e.g., "mypassword")
      - SHA512crypt hashes from /etc/shadow (e.g., "$6$...")
      - Hashes with fewer than 10000 rounds
      - base64-encoded passwords

      GENERATION (copy entire output including "grub.pbkdf2.sha512..." prefix):
        Fedora: grub2-mkpasswd-pbkdf2
        Debian: grub-mkpasswd-pbkdf2

      CONFIGURATION (use vault to protect the hash):
        1. Copy the entire grub.pbkdf2.sha512... output
        2. Edit group_vars/all/vault.yml and set:
           system_grub_password_hash: "grub.pbkdf2.sha512.10000...."
        3. Encrypt: ansible-vault encrypt group_vars/all/vault.yml

      CRITICAL: Do NOT place system_grub_password_hash in config.yml — it would bypass
      vault encryption and expose the hash in version control.

      Current value: {{ system_grub_password_hash | default('(empty)') }}
  when:
    - system_grub_password_enabled
    - not (system_is_container or csb_rhel)

# Configure GRUB password via /etc/grub.d/40_custom (Fedora/Debian)
# grub2-mkconfig (Fedora) or grub-mkconfig (Debian) merges 40_custom into /boot/grub*/grub.cfg
- name: "GRUB password: Configure bootloader password in /etc/grub.d/40_custom"
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      exec tail -n +3 $0
      # GRUB bootloader password protection (CIS 1.4.2)
      set superusers="root"
      password_pbkdf2 root {{ system_grub_password_hash }}
    dest: /etc/grub.d/40_custom
    mode: "0755"
    owner: root
    group: root
  when:
    - system_grub_password_enabled
    - not (system_is_container or csb_rhel)
  register: system_grub_password_config_result
  notify: "Regenerate GRUB configuration"

- name: "GRUB password: Remove GRUB password config (disabled)"
  ansible.builtin.file:
    path: /etc/grub.d/40_custom
    state: absent
  when:
    - not system_grub_password_enabled
    - not (system_is_container or csb_rhel)
  register: system_grub_password_remove_result
  notify: "Regenerate GRUB configuration"

- name: "GRUB password: Warn when disabled on non-container/non-csb_rhel"
  ansible.builtin.debug:
    msg: >-
      GRUB bootloader password not set (system_grub_password_enabled: false).
      CIS 1.4.2 requires a bootloader password to prevent kernel parameter tampering
      (e.g., disabling lockdown=integrity) from the GRUB menu.
      To enable: set system_grub_password_enabled: true and system_grub_password_hash
      (from grub2-mkpasswd-pbkdf2 or grub-mkpasswd-pbkdf2) in config.yml.
  when:
    - not system_grub_password_enabled
    - not (system_is_container or csb_rhel)

- name: "GRUB password: Skip on container"
  ansible.builtin.debug:
    msg: "Skipping GRUB password (container environment; no GRUB present)"
    verbosity: 1
  when: system_is_container

- name: "GRUB password: Skip on RHEL CSB (IT manages boot config)"
  ansible.builtin.debug:
    msg: "Skipping GRUB password (RHEL CSB detected; IT manages boot configuration)"
    verbosity: 1
  when: csb_rhel
