---
# --- GRUB bootloader password (CIS 1.4.2) ---
# Protects against kernel parameter tampering (lockdown=integrity removal, single-user mode)
# with physical console access. Opt-in via system_grub_password_enabled: true in config.yml.
# Skipped on containers (no GRUB) and RHEL CSB (IT manages boot configuration).

- name: Debug GRUB password configuration
  ansible.builtin.debug:
    msg: |
      GRUB password: enabled={{ system_grub_password_enabled }}
      container={{ system_is_container }}
      csb_rhel={{ csb_rhel }}
      hash_set={{ system_grub_password_hash | length > 0 }}
    verbosity: 1
  when: system_grub_password_enabled or not (system_is_container or csb_rhel)

# Requires either grub2-tools (Fedora) or grub-pc (Debian).
# grub2-mkconfig (Fedora) / grub-mkconfig (Debian) regenerates /boot/grub*/grub.cfg
- name: Ensure GRUB password config prerequisites (grub2-tools or grub-pc)
  when:
    - system_grub_password_enabled
    - not (system_is_container or csb_rhel)
  block:
    - name: "GRUB password: Install grub2-tools (Fedora/RHEL)"
      ansible.builtin.dnf:
        name: grub2-tools
        state: present
      when: is_dnf
      failed_when: false

    - name: "GRUB password: Install grub-pc (Debian/Ubuntu)"
      ansible.builtin.apt:
        name: grub-pc
        state: present
        update_cache: yes
      when: is_apt
      failed_when: false

- name: "GRUB password: Assert hash is set when enabled"
  ansible.builtin.assert:
    that:
      - system_grub_password_hash | length > 0
    fail_msg: >-
      GRUB password enabled but system_grub_password_hash is empty.
      Generate a password hash via: grub2-mkpasswd-pbkdf2 (Fedora) or grub-mkpasswd-pbkdf2 (Debian)
      Then set system_grub_password_hash in config.yml (recommend vault encryption).
  when:
    - system_grub_password_enabled
    - not (system_is_container or csb_rhel)

# Configure GRUB password via /etc/grub.d/40_custom (Fedora/Debian)
# grub2-mkconfig (Fedora) or grub-mkconfig (Debian) merges 40_custom into /boot/grub*/grub.cfg
- name: "GRUB password: Configure bootloader password in /etc/grub.d/40_custom"
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      exec tail -n +3 $0
      # GRUB bootloader password protection (CIS 1.4.2)
      set superusers="root"
      password_pbkdf2 root {{ system_grub_password_hash }}
    dest: /etc/grub.d/40_custom
    mode: "0755"
    owner: root
    group: root
  when:
    - system_grub_password_enabled
    - not (system_is_container or csb_rhel)
  register: system_grub_password_config_result
  notify: "Regenerate GRUB configuration"

- name: "GRUB password: Remove GRUB password config (disabled)"
  ansible.builtin.file:
    path: /etc/grub.d/40_custom
    state: absent
  when:
    - not system_grub_password_enabled
    - not (system_is_container or csb_rhel)
  register: system_grub_password_remove_result
  notify: "Regenerate GRUB configuration"

- name: "GRUB password: Warn when disabled on non-container/non-csb_rhel"
  ansible.builtin.debug:
    msg: >-
      GRUB bootloader password not set (system_grub_password_enabled: false).
      CIS 1.4.2 requires a bootloader password to prevent kernel parameter tampering
      (e.g., disabling lockdown=integrity) from the GRUB menu.
      To enable: set system_grub_password_enabled: true and system_grub_password_hash
      (from grub2-mkpasswd-pbkdf2 or grub-mkpasswd-pbkdf2) in config.yml.
  when:
    - not system_grub_password_enabled
    - not (system_is_container or csb_rhel)

- name: "GRUB password: Skip on container"
  ansible.builtin.debug:
    msg: "Skipping GRUB password (container environment; no GRUB present)"
    verbosity: 1
  when: system_is_container

- name: "GRUB password: Skip on RHEL CSB (IT manages boot config)"
  ansible.builtin.debug:
    msg: "Skipping GRUB password (RHEL CSB detected; IT manages boot configuration)"
    verbosity: 1
  when: csb_rhel
