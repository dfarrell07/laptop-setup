---
# --- PAM hardening (faillock, pwhistory, pwquality) ---
# CSB: faillock/pwhistory/pwquality govern local-account PAM policy. On RHEL CSB hybrid,
# IT's security baseline sets lockout thresholds (NIST SP 800-53 AC-7); overwriting them
# silently violates corporate policy. Fedora hybrid is owner-managed — apply hardening there.

# --- PAM faillock (account lockout after failed attempts) ---
- name: Configure pam_faillock value settings
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - key: deny
      value: "{{ system_faillock_deny }}"
    - key: unlock_time
      value: "{{ system_faillock_unlock_time }}"
  loop_control:
    label: "{{ item.key }}"
  when: not csb_rhel

- name: Configure pam_faillock boolean flags
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: "{{ item }}"
    allow_no_value: true
    mode: "0644"
  loop:
    - audit
    - local_users_only  # prevent double-lockout with SSSD/IPA domain users
  when: not csb_rhel

- name: Configure pam_faillock even_deny_root flag
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: even_deny_root
    allow_no_value: true
    mode: "0644"
  when:
    - system_faillock_even_deny_root | bool
    - not csb_rhel

- name: Remove pam_faillock even_deny_root flag (when disabled)
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: even_deny_root
    state: absent
    mode: "0644"
  when:
    - not (system_faillock_even_deny_root | bool)
    - not csb_rhel

- name: Check if authselect with-faillock feature is already enabled
  ansible.builtin.command:
    cmd: authselect is-feature-enabled with-faillock
  register: system_authselect_faillock_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - system_authselect_bin.stat.exists
    - not csb_rhel

- name: Enable authselect with-faillock feature
  ansible.builtin.command:
    cmd: authselect enable-feature with-faillock
  register: system_authselect_faillock_enable
  when:
    - system_authselect_bin.stat.exists
    - not csb_rhel
    - not system_is_container  # authselect enable-feature triggers PAM reload → inotify → daemon-reload → crashes container
    - system_authselect_faillock_check.rc | default(0) != 0
  changed_when: system_authselect_faillock_enable.rc | default(1) == 0
  failed_when: false

- name: Warn if authselect enable-feature with-faillock failed
  ansible.builtin.debug:
    msg: >-
      WARNING: authselect enable-feature with-faillock exited
      {{ system_authselect_faillock_enable.rc }} — faillock PAM feature may not be active
  when:
    - system_authselect_faillock_enable.rc | default(0) != 0

# --- Debian PAM faillock (no authselect; direct PAM stack insertion) ---
# On Debian, authselect is absent; pam_faillock.so must be added directly to
# /etc/pam.d/common-auth and /etc/pam.d/common-account. faillock.conf (deployed
# above) provides deny/unlock_time values — without pam_faillock.so in the stack
# those settings have NO effect. Two insertions are required:
#   preauth  — before pam_unix.so, checks if account is already locked
#   authfail — after pam_unix.so, records failed attempts
- block:
    - name: Ensure pam_faillock.so preauth line is in common-auth (Debian)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-auth
        regexp: '^auth\s+required\s+pam_faillock\.so\s+preauth'
        line: 'auth    required                        pam_faillock.so preauth'
        insertbefore: '^auth\s'
        mode: "0644"

    - name: Ensure pam_faillock.so authfail line is in common-auth (Debian)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-auth
        regexp: '^auth\s+\[default=die\]\s+pam_faillock\.so\s+authfail'
        line: 'auth    [default=die]                  pam_faillock.so authfail'
        insertafter: '^auth.*pam_unix\.so'
        mode: "0644"

    - name: Ensure pam_faillock.so account line is in common-account (Debian)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-account
        regexp: '^account\s+required\s+pam_faillock\.so$'
        line: 'account required                        pam_faillock.so'
        insertbefore: '^account\s'
        mode: "0644"

    # Debian: pam_pwhistory.so must be inserted directly (no authselect).
    # authselect enable-feature with-pwhistory (below) is RHEL/Fedora only.
    # This mirrors the pam_faillock Debian block above.
    - name: Ensure pam_pwhistory.so line is in common-password (Debian)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^password\s+required\s+pam_pwhistory\.so'
        line: 'password required                        pam_pwhistory.so use_authtok'
        insertbefore: '^password.*pam_unix\.so'
        mode: "0644"
  when:
    - is_apt
    - not system_is_container

# --- PAM pwhistory (password reuse prevention, CIS 5.3.5) ---
- name: Check if authselect with-pwhistory feature is already enabled
  ansible.builtin.command:
    cmd: authselect is-feature-enabled with-pwhistory
  register: system_authselect_pwhistory_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - system_authselect_bin.stat.exists
    - not csb_rhel

- name: Enable authselect with-pwhistory feature
  ansible.builtin.command:
    cmd: authselect enable-feature with-pwhistory
  register: system_authselect_pwhistory_enable
  when:
    - system_authselect_bin.stat.exists
    - not csb_rhel
    - not system_is_container  # authselect enable-feature triggers PAM reload → inotify → daemon-reload → crashes container
    - system_authselect_pwhistory_check.rc | default(0) != 0
  changed_when: system_authselect_pwhistory_enable.rc | default(1) == 0
  failed_when: false

- name: Warn if authselect enable-feature with-pwhistory failed
  ansible.builtin.debug:
    msg: >-
      WARNING: authselect enable-feature with-pwhistory exited
      {{ system_authselect_pwhistory_enable.rc }} — pwhistory PAM feature may not be active
  when:
    - system_authselect_pwhistory_enable.rc | default(0) != 0

- name: Configure pam_pwhistory remember count (CIS 5.3.5)
  community.general.ini_file:
    path: /etc/security/pwhistory.conf
    section: null
    option: remember
    value: "{{ system_pwhistory_remember }}"
    mode: "0644"
  when: not csb_rhel

- name: Enforce pam_pwhistory for root (CIS 5.3.5)
  community.general.ini_file:
    path: /etc/security/pwhistory.conf
    section: null
    option: enforce_for_root
    allow_no_value: true
    mode: "0644"
  when: not csb_rhel

# --- PAM pwquality (password complexity) ---
- name: Configure password quality requirements
  community.general.ini_file:
    path: /etc/security/pwquality.conf
    section: null
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - key: minlen
      value: "{{ system_pwquality_minlen }}"
    - key: dcredit
      value: "{{ system_pwquality_dcredit }}"
    - key: ucredit
      value: "{{ system_pwquality_ucredit }}"
    - key: lcredit
      value: "{{ system_pwquality_lcredit }}"
    - key: ocredit
      value: "{{ system_pwquality_ocredit }}"
    - key: difok
      value: "{{ system_pwquality_difok }}"
    - key: maxrepeat
      value: "{{ system_pwquality_maxrepeat }}"
  loop_control:
    label: "{{ item.key }}"
  when: not csb_rhel

- name: Enforce pwquality for root (CIS 5.3.4)
  community.general.ini_file:
    path: /etc/security/pwquality.conf
    section: null
    option: enforce_for_root
    allow_no_value: true
    mode: "0644"
  when: not csb_rhel

# --- Restrict su to wheel group ---
- name: Enable pam_wheel.so for su
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^#?\s*auth\s+required\s+pam_wheel\.so\s+use_uid'
    line: 'auth		required	pam_wheel.so use_uid'
    insertafter: '^#.*pam_wheel.so'
  when:
    - not is_apt  # Debian uses 'sudo' group not 'wheel'; skip entirely
    - not csb_rhel
    - not system_is_container  # /etc/pam.d/su absent in minimal containers
