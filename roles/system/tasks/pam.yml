---
# --- PAM hardening (faillock, pwhistory, pwquality) ---
# CSB: faillock/pwhistory/pwquality govern local-account PAM policy. On RHEL CSB hybrid,
# IT's security baseline sets lockout thresholds (NIST SP 800-53 AC-7); overwriting them
# silently violates corporate policy. Fedora hybrid is owner-managed — apply hardening there.

# --- PAM faillock (account lockout after failed attempts) ---
- name: Configure pam_faillock value settings
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop:
    - key: deny
      value: "{{ system_faillock_deny }}"
    - key: unlock_time
      value: "{{ system_faillock_unlock_time }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - not csb_rhel
    - not system_is_container  # /etc/security/ writes trigger PAM re-evaluation; crashes Debian 13 container PID 1

- name: Enable pam_faillock audit flag (when system_faillock_audit is true)
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: audit
    allow_no_value: true
    no_extra_spaces: true
    mode: "0644"
  when:
    - system_faillock_audit | bool
    - not csb_rhel
    - not system_is_container

- name: Remove pam_faillock audit flag (when disabled)
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: audit
    state: absent
    mode: "0644"
  when:
    - not (system_faillock_audit | bool)
    - not csb_rhel
    - not system_is_container

- name: Enable pam_faillock local_users_only flag (when system_faillock_local_users_only is true)
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: local_users_only  # prevent double-lockout with SSSD/IPA domain users
    allow_no_value: true
    no_extra_spaces: true
    mode: "0644"
  when:
    - system_faillock_local_users_only | bool
    - not csb_rhel
    - not system_is_container

- name: Remove pam_faillock local_users_only flag (when disabled)
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: local_users_only
    state: absent
    mode: "0644"
  when:
    - not (system_faillock_local_users_only | bool)
    - not csb_rhel
    - not system_is_container

- name: Enable pam_faillock even_deny_root flag (when system_faillock_even_deny_root is true)
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: even_deny_root
    allow_no_value: true
    no_extra_spaces: true
    mode: "0644"
  when:
    - system_faillock_even_deny_root | bool
    - not csb_rhel
    - not system_is_container

- name: Remove pam_faillock even_deny_root flag (when disabled)
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: even_deny_root
    state: absent
    mode: "0644"
  when:
    - not (system_faillock_even_deny_root | bool)
    - not csb_rhel
    - not system_is_container

- name: Check if authselect with-faillock feature is already enabled
  ansible.builtin.command:
    cmd: authselect is-feature-enabled with-faillock
  register: system_authselect_faillock_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - (system_authselect_bin.stat | default({})).exists | default(false)
    - not csb_rhel
    - not system_is_container

- name: Enable authselect with-faillock feature
  ansible.builtin.command:
    cmd: authselect enable-feature with-faillock
  register: system_authselect_faillock_enable
  when:
    - (system_authselect_bin.stat | default({})).exists | default(false)
    - not csb_rhel
    - not system_is_container  # authselect enable-feature triggers PAM reload → inotify → daemon-reload → crashes container
    - system_authselect_faillock_check.rc | default(0) != 0
  changed_when: system_authselect_faillock_enable.rc | default(1) == 0
  failed_when: false

- name: Fail if authselect enable-feature with-faillock did not activate
  ansible.builtin.fail:
    msg: >-
      authselect enable-feature with-faillock exited
      {{ system_authselect_faillock_enable.rc | default('unknown') }} — faillock PAM feature is not active.
      Silent half-hardened state is worse than a failed run; fix authselect profile and re-run.
  when:
    - system_authselect_faillock_enable.rc | default(0) != 0
    - system_authselect_faillock_enable is not skipped
    - not csb_rhel
    - not system_is_container

# --- Debian PAM faillock (no authselect; direct PAM stack insertion) ---
# On Debian, authselect is absent; pam_faillock.so must be added directly to
# /etc/pam.d/common-auth and /etc/pam.d/common-account. faillock.conf (deployed
# above) provides deny/unlock_time values — without pam_faillock.so in the stack
# those settings have NO effect. Two insertions are required:
#   preauth  — before pam_unix.so, checks if account is already locked
#   authfail — after pam_unix.so, records failed attempts
- name: Debian PAM faillock and pwhistory direct stack insertion
  when:
    - is_apt
    - not system_is_container
  block:
    - name: Ensure pam_faillock.so preauth line is in common-auth (Debian)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-auth
        regexp: '^auth\s+required\s+pam_faillock\.so\s+preauth'
        line: 'auth    required                        pam_faillock.so preauth'
        insertbefore: '^auth\s'
        mode: "0644"

    - name: Ensure pam_faillock.so authfail line is in common-auth (Debian)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-auth
        regexp: '^auth\s+\[default=die\]\s+pam_faillock\.so\s+authfail'
        line: 'auth    [default=die]                  pam_faillock.so authfail'
        insertafter: '^auth.*pam_unix\.so'
        mode: "0644"

    - name: Verify pam_faillock.so authfail appears after pam_unix.so in common-auth (Debian)
      ansible.builtin.shell:
        cmd: >-
          awk '/pam_faillock\.so preauth/{pre=NR} /pam_unix\.so/{unix=NR} /pam_faillock\.so authfail/{fail=NR}
               END{exit !(pre>0 && unix>0 && fail>0 && pre<unix && unix<fail)}' /etc/pam.d/common-auth
      changed_when: false
      register: system_pam_faillock_order_check
      failed_when: false

    - name: Fail if pam_faillock.so authfail is not ordered after pam_unix.so in common-auth (Debian)
      ansible.builtin.fail:
        msg: >-
          pam_faillock.so authfail is not in the correct position in /etc/pam.d/common-auth.
          Required order: preauth < pam_unix.so < authfail. The insertafter pattern
          '^auth.*pam_unix\.so' found no matching line (distro PAM refactor?).
          Out-of-order placement breaks faillock semantics. Inspect common-auth
          and re-run after correcting the PAM stack.
      when: system_pam_faillock_order_check.rc | default(1) != 0

    - name: Ensure pam_faillock.so account line is in common-account (Debian)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-account
        regexp: '^account\s+required\s+pam_faillock\.so$'
        line: 'account required                        pam_faillock.so'
        insertbefore: '^account\s'
        mode: "0644"

    # Debian: pam_pwhistory.so must be inserted directly (no authselect).
    # authselect enable-feature with-pwhistory (below) is RHEL/Fedora only.
    # This mirrors the pam_faillock Debian block above.
    - name: Ensure pam_pwhistory.so line is in common-password (Debian)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^password\s+required\s+pam_pwhistory\.so'
        # yamllint disable-line rule:line-length
        line: 'password required                   pam_pwhistory.so use_authtok remember={{ system_pwhistory_remember | int }} enforce_for_root'
        insertbefore: '^password.*pam_unix\.so'
        mode: "0644"

# --- Debian PAM pwquality (password complexity) ---
# On Debian, pam_pwquality.so is active in common-password by default (via
# libpam-pwquality) and reads /etc/security/pwquality.conf. Configure the
# same complexity requirements applied on Fedora/RHEL.
- name: Configure password quality requirements (Debian)
  community.general.ini_file:
    path: /etc/security/pwquality.conf
    section: null
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop:
    - key: minlen
      value: "{{ system_pwquality_minlen }}"
    - key: dcredit
      value: "{{ system_pwquality_dcredit }}"
    - key: ucredit
      value: "{{ system_pwquality_ucredit }}"
    - key: lcredit
      value: "{{ system_pwquality_lcredit }}"
    - key: ocredit
      value: "{{ system_pwquality_ocredit }}"
    - key: difok
      value: "{{ system_pwquality_difok }}"
    - key: maxrepeat
      value: "{{ system_pwquality_maxrepeat }}"
    - key: maxsequence
      value: "{{ system_pwquality_maxsequence }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - is_apt
    - not system_is_container

- name: Enforce pwquality for root (Debian, CIS 5.3.4)
  community.general.ini_file:
    path: /etc/security/pwquality.conf
    section: null
    option: enforce_for_root
    allow_no_value: true
    no_extra_spaces: true
    mode: "0644"
  when:
    - is_apt
    - not system_is_container

# --- PAM pwhistory (password reuse prevention, CIS 5.3.5) ---
- name: Check if authselect with-pwhistory feature is already enabled
  ansible.builtin.command:
    cmd: authselect is-feature-enabled with-pwhistory
  register: system_authselect_pwhistory_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - (system_authselect_bin.stat | default({})).exists | default(false)
    - not csb_rhel
    - not system_is_container

- name: Enable authselect with-pwhistory feature
  ansible.builtin.command:
    cmd: authselect enable-feature with-pwhistory
  register: system_authselect_pwhistory_enable
  when:
    - (system_authselect_bin.stat | default({})).exists | default(false)
    - not csb_rhel
    - not system_is_container  # authselect enable-feature triggers PAM reload → inotify → daemon-reload → crashes container
    - system_authselect_pwhistory_check.rc | default(0) != 0
  changed_when: system_authselect_pwhistory_enable.rc | default(1) == 0
  failed_when: false

- name: Fail if authselect enable-feature with-pwhistory did not activate
  ansible.builtin.fail:
    msg: >-
      authselect enable-feature with-pwhistory exited
      {{ system_authselect_pwhistory_enable.rc | default('unknown') }} — pwhistory PAM feature is not active.
      Silent half-hardened state is worse than a failed run; fix authselect profile and re-run.
  when:
    - system_authselect_pwhistory_enable.rc | default(0) != 0
    - system_authselect_pwhistory_enable is not skipped
    - not csb_rhel
    - not system_is_container

- name: Configure pam_pwhistory remember count (CIS 5.3.5)
  community.general.ini_file:
    path: /etc/security/pwhistory.conf
    section: null
    option: remember
    value: "{{ system_pwhistory_remember | int }}"
    no_extra_spaces: true
    mode: "0644"
  when:
    - (system_authselect_bin.stat | default({})).exists | default(false)
    - not csb_rhel
    - not system_is_container
    - not is_apt

- name: Enforce pam_pwhistory for root (CIS 5.3.5)
  community.general.ini_file:
    path: /etc/security/pwhistory.conf
    section: null
    option: enforce_for_root
    allow_no_value: true
    no_extra_spaces: true
    mode: "0644"
  when:
    - (system_authselect_bin.stat | default({})).exists | default(false)
    - not csb_rhel
    - not system_is_container
    - not is_apt

# --- PAM pwquality (password complexity) ---
- name: Configure password quality requirements
  community.general.ini_file:
    path: /etc/security/pwquality.conf
    section: null
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop:
    - key: minlen
      value: "{{ system_pwquality_minlen }}"
    - key: dcredit
      value: "{{ system_pwquality_dcredit }}"
    - key: ucredit
      value: "{{ system_pwquality_ucredit }}"
    - key: lcredit
      value: "{{ system_pwquality_lcredit }}"
    - key: ocredit
      value: "{{ system_pwquality_ocredit }}"
    - key: difok
      value: "{{ system_pwquality_difok }}"
    - key: maxrepeat
      value: "{{ system_pwquality_maxrepeat }}"
    - key: maxsequence
      value: "{{ system_pwquality_maxsequence }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - not csb_rhel
    - not system_is_container
    - not is_apt

- name: Enforce pwquality for root (CIS 5.3.4)
  community.general.ini_file:
    path: /etc/security/pwquality.conf
    section: null
    option: enforce_for_root
    allow_no_value: true
    no_extra_spaces: true
    mode: "0644"
  when:
    - not csb_rhel
    - not system_is_container
    - not is_apt

# --- Restrict su to wheel group ---
- name: Enable pam_wheel.so for su
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^#?\s*auth\s+required\s+pam_wheel\.so\s+use_uid'
    line: 'auth		required	pam_wheel.so use_uid'
    insertafter: '^auth\s+sufficient\s+pam_rootok\.so'
  when:
    - is_dnf  # pam_wheel.so / wheel group restriction is RHEL/Fedora-only; Debian uses 'sudo' group, macOS has different PAM stack
    - not csb_rhel
    - not system_is_container  # /etc/pam.d/su absent in minimal containers
    - system_pam_wheel_su | bool

- name: Remove pam_wheel.so from su (wheel restriction disabled)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^#?\s*auth\s+required\s+pam_wheel\.so\s+use_uid'
    state: absent
  when:
    - is_dnf
    - not csb_rhel
    - not system_is_container
    - not (system_pam_wheel_su | bool)
