---
# roles/system/tasks/main.yml
# System hardening: firewall, sysctl, kernel lockdown, auditd, services.
# All tasks require become (Play 1 has become: true at play level).

# --- Gather service facts (needed for firewalld/auditd/resolved conditionals) ---
- name: Gather service facts
  ansible.builtin.service_facts:

# --- Prerequisites (needed by seport and other system tasks) ---
- name: Ensure policycoreutils-python-utils is installed
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  when:
    - is_dnf
    - not csb_rhel

- ansible.builtin.import_tasks: selinux.yml

# --- Auditd ---
- name: Auditd tasks
  ansible.builtin.import_tasks: auditd.yml

- ansible.builtin.import_tasks: bolt.yml

# --- Session timeout (CIS 5.5.5: TMOUT <= 900s) ---
- ansible.builtin.import_tasks: session_timeout.yml

- name: Timezone and locale
  ansible.builtin.import_tasks: timezone_locale.yml

- name: Chrony NTS
  ansible.builtin.import_tasks: chrony.yml

- name: PAM hardening (faillock, pwhistory, pwquality, pam_wheel)
  ansible.builtin.import_tasks: pam.yml

- name: Journald persistent logging
  ansible.builtin.import_tasks: journald.yml

- name: Logrotate for sudo.log
  ansible.builtin.import_tasks: logrotate_sudo.yml

- ansible.builtin.import_tasks: cron.yml

- name: Login banner
  ansible.builtin.import_tasks: login_banner.yml

- name: Account hardening
  ansible.builtin.import_tasks: account_hardening.yml
  tags: [account, become]

- name: System-level dconf hardening
  ansible.builtin.include_tasks: dconf.yml
  when:
    - '"gdm.service" in ansible_facts.services'
    - not csb_rhel

- ansible.builtin.import_tasks: aide_cleanup.yml

- name: AIDE configuration
  ansible.builtin.import_tasks: aide.yml
