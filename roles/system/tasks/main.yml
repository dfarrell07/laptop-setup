---
# roles/system/tasks/main.yml
# System hardening: firewall, sysctl, kernel lockdown, auditd, services.
# All tasks require become (Play 1 has become: true at play level).

# --- Gather service facts (needed for firewalld/auditd/resolved conditionals) ---
- name: Gather service facts
  ansible.builtin.service_facts:

# --- Prerequisites (needed by seport and other system tasks) ---
- name: Ensure policycoreutils-python-utils is installed
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  when: ansible_pkg_mgr in ['dnf', 'dnf5']
  failed_when: false

# --- SELinux enforcement check ---
- name: Verify SELinux is enforcing
  ansible.builtin.assert:
    that:
      - ansible_selinux.status == 'enabled'
      - ansible_selinux.mode == 'enforcing'
      - ansible_selinux.type == 'targeted'
    fail_msg: >-
      SELinux is {{ ansible_selinux.mode | default('disabled') }}
      (type: {{ ansible_selinux.type | default('unknown') }}).
      Fix: sudo setenforce 1 && sudo sed -i
      's/^SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config
  when: ansible_selinux is defined

# --- Harden /tmp mount options (CIS 1.1.2.x) ---
- name: Ensure tmp.mount drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/tmp.mount.d
    state: directory
    mode: "0755"
  when: ansible_system == 'Linux'

- name: Harden /tmp with noexec via systemd drop-in
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # IMPORTANT: Options= replaces all base unit options (no merge).
      # Must include all options from tmp.mount + noexec.
      # Base: mode=1777,strictatime,nosuid,nodev,size=50%,nr_inodes=1m,x-systemd.graceful-option=usrquota
      [Mount]
      Options=mode=1777,strictatime,nosuid,nodev,noexec,size=50%%,nr_inodes=1m,x-systemd.graceful-option=usrquota
    dest: /etc/systemd/system/tmp.mount.d/hardening.conf
    mode: "0644"
  when: ansible_system == 'Linux'
  notify: Remount /tmp
  failed_when: false

# --- Harden /dev/shm mount options ---
# Fedora 44 does NOT ship a dev-shm.mount systemd unit, so a drop-in under
# dev-shm.mount.d/ is silently ignored. Use fstab for persistence and a
# direct remount for immediate effect.
- name: Ensure /dev/shm fstab entry has noexec (CIS 1.1.7.x)
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^tmpfs\s+/dev/shm\s+'
    line: 'tmpfs /dev/shm tmpfs defaults,nosuid,nodev,noexec,usrquota 0 0'
    create: true   # must be true on Fedora 44 — /dev/shm has no fstab line by default
    backup: true   # fstab corruption causes non-recoverable boot failure without console access
    mode: "0644"
  when:
    - ansible_system == 'Linux'
    - not (csb_detected | default(false))  # CSB manages fstab; don't add entries IT doesn't control
  failed_when: false

- name: Check /dev/shm current mount options
  ansible.builtin.command:
    cmd: findmnt -n -o OPTIONS /dev/shm
  register: system_devshm_opts
  changed_when: false
  when: ansible_system == 'Linux'
  failed_when: false

- name: Apply /dev/shm hardening immediately via remount  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: mount -o remount,nosuid,nodev,noexec /dev/shm
  changed_when: true
  when:
    - ansible_system == 'Linux'
    - >-
      'noexec' not in (system_devshm_opts.stdout | default('')) or
      'nosuid' not in (system_devshm_opts.stdout | default('')) or
      'nodev' not in (system_devshm_opts.stdout | default(''))
  failed_when: false

# On CSB, fstab is IT-managed so we cannot add the /dev/shm entry for persistence.
# Deploy a one-shot service to re-apply hardening on every boot instead.
- name: Deploy dev-shm-harden.service (CSB — fstab not modified)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # On CSB, /etc/fstab is IT-managed. This one-shot service remounts
      # /dev/shm with nosuid,nodev,noexec at every boot (CIS 1.1.7.x).
      [Unit]
      Description=Harden /dev/shm mount options (CIS 1.1.7.x)
      DefaultDependencies=no
      After=local-fs.target
      Before=sysinit.target

      [Service]
      Type=oneshot
      ExecStart=mount -o remount,nosuid,nodev,noexec /dev/shm
      RemainAfterExit=yes

      [Install]
      WantedBy=sysinit.target
    dest: /etc/systemd/system/dev-shm-harden.service
    mode: "0644"
    owner: root
    group: root
  when:
    - ansible_system == 'Linux'
    - csb_detected | default(false)

- name: Enable dev-shm-harden.service (CSB)
  ansible.builtin.systemd:
    name: dev-shm-harden.service
    enabled: true
    daemon_reload: true
  when:
    - ansible_system == 'Linux'
    - csb_detected | default(false)

# --- Harden /var/tmp via bind-mount to /tmp (CIS 1.1.8) ---
# A complete unit file is required — /var/tmp has no base unit on Fedora
# so a drop-in directory would be silently ignored.
- name: Deploy var-tmp.mount unit (bind /var/tmp to /tmp)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # /var/tmp bind-mounted to /tmp so it inherits noexec,nosuid,nodev.
      [Unit]
      Description=Bind mount /var/tmp to /tmp
      After=tmp.mount
      Requires=tmp.mount

      [Mount]
      What=/tmp
      Where=/var/tmp
      Type=none
      Options=bind,noexec,nosuid,nodev

      [Install]
      WantedBy=local-fs.target
    dest: /etc/systemd/system/var-tmp.mount
    mode: "0644"
  when: ansible_system == 'Linux'
  failed_when: false

- name: Enable and start var-tmp.mount
  ansible.builtin.systemd:
    name: var-tmp.mount
    enabled: true
    state: started
    daemon_reload: true
  when: ansible_system == 'Linux'
  failed_when: false

# --- Kernel module blacklist ---
- name: Deploy kernel module blacklist
  ansible.builtin.template:
    src: modprobe-hardening.conf.j2
    dest: /etc/modprobe.d/hardening.conf
    mode: "0644"

# --- Sysctl hardening ---
# Merge system_sysrq into the dict so config.yml can override without replacing
# the entire system_sysctl_hardening dict. Default is 0 (CIS); set 176 in
# config.yml for sync(16)+remount-ro(32)+reboot(128) on a kernel dev workstation.
- name: Merge system_sysrq into sysctl hardening dict
  ansible.builtin.set_fact:
    system_sysctl_hardening: "{{ system_sysctl_hardening | combine({'kernel.sysrq': system_sysrq | int}) }}"

- name: Deploy sysctl hardening config
  ansible.builtin.template:
    src: sysctl-hardening.conf.j2
    dest: /etc/sysctl.d/90-hardening.conf
    mode: "0644"
  notify: Reload sysctl

# --- Firewall (drop zone) ---
- name: Ensure firewalld is installed and running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true
  failed_when: false

- name: Re-gather service facts after firewalld start
  ansible.builtin.service_facts:

- name: Set firewalld running fact
  ansible.builtin.set_fact:
    system_firewalld_running: >-
      {{ ansible_facts.services['firewalld.service'] is defined and
         ansible_facts.services['firewalld.service'].state == 'running' }}

- name: Check current default firewall zone
  ansible.builtin.command:
    cmd: firewall-cmd --get-default-zone
  register: system_fw_default_zone
  changed_when: false
  failed_when: false
  when: system_firewalld_running | bool

- name: Set default firewall zone to drop
  ansible.builtin.command:
    cmd: firewall-cmd --set-default-zone=drop
  changed_when: true
  when:
    - system_firewalld_running | bool
    - system_fw_default_zone.stdout | default('') != 'drop'
    - not (csb_detected | default(false))  # CSB IT manages zone policy; drop zone breaks VPN/management
  notify:
    - Reload firewalld
    - Reload NetworkManager
    - Restart tailscaled

- name: Move primary network interface to drop zone
  ansible.posix.firewalld:
    zone: drop
    interface: "{{ ansible_default_ipv4.interface | default(ansible_default_ipv6.interface) }}"
    permanent: true
    immediate: true
    state: enabled
  when:
    - system_firewalld_running | bool
    - ansible_default_ipv4.interface is defined or ansible_default_ipv6.interface is defined
    - not (csb_detected | default(false))  # paired with zone guard above
  failed_when: false

- name: Enable ICMP block inversion on drop zone
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: firewall-cmd --permanent --zone=drop --add-icmp-block-inversion
  register: system_icmp_inversion
  changed_when: "'ALREADY_ENABLED' not in ((system_icmp_inversion.stderr | default('')) + (system_icmp_inversion.stdout | default('')))"
  failed_when:
    - system_icmp_inversion.rc != 0
    - "'ALREADY_ENABLED' not in ((system_icmp_inversion.stderr | default('')) + (system_icmp_inversion.stdout | default('')))"
  when:
    - system_firewalld_running | bool
    - not (csb_detected | default(false))  # drop zone has no interface on CSB — rule is a no-op
  notify:
    - Reload firewalld
    - Restart tailscaled

# NOTE: With icmp-block-inversion enabled, --add-icmp-block ALLOWS these types
# (semantics are inverted). Without inversion, this command would block them.
- name: Allow essential ICMP types through drop zone
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: "firewall-cmd --permanent --zone=drop --add-icmp-block={{ item }}"
  loop: "{{ system_firewall_icmp_types }}"
  register: system_icmp_types
  changed_when: "'ALREADY_ENABLED' not in ((system_icmp_types.stderr | default('')) + (system_icmp_types.stdout | default('')))"
  failed_when:
    - system_icmp_types.rc != 0
    - "'ALREADY_ENABLED' not in ((system_icmp_types.stderr | default('')) + (system_icmp_types.stdout | default('')))"
  when:
    - system_firewalld_running | bool
    - not (csb_detected | default(false))  # drop zone has no interface on CSB — rule is a no-op
  notify:
    - Reload firewalld
    - Restart tailscaled

# On CSB, IT manages firewall zones — the primary interface is not in the drop zone,
# so adding 722/tcp to the drop zone would create a dead rule. Skip on CSB; whether
# SSH on 722 is reachable from non-Tailscale sources depends on IT's zone policy.
- name: Open SSH port in firewall
  ansible.posix.firewalld:
    port: "{{ ssh_port }}/tcp"
    zone: drop
    permanent: true
    immediate: true
    state: enabled
  when:
    - system_firewalld_running | bool
    - not (csb_detected | default(false))
  notify:
    - Reload firewalld
    - Restart tailscaled

# --- Kernel lockdown ---
- name: Check current kernel cmdline
  ansible.builtin.command:
    cmd: grubby --info=DEFAULT
  register: system_grubby_info
  changed_when: false
  failed_when: false

- name: Enable kernel lockdown (integrity mode)
  ansible.builtin.command:
    cmd: grubby --args="lockdown=integrity" --update-kernel=ALL
  register: system_lockdown_result
  when:
    - system_grubby_info.rc | default(1) == 0
    - "'lockdown=integrity' not in (system_grubby_info.stdout | default(''))"
  changed_when: true
  failed_when: false

- name: Enable IOMMU for DMA protection (AMD)
  ansible.builtin.command:
    cmd: grubby --args="amd_iommu=on iommu=pt" --update-kernel=ALL
  register: system_iommu_result
  when:
    - system_grubby_info.rc | default(1) == 0
    - "'amd_iommu=on' not in (system_grubby_info.stdout | default(''))"
    - ansible_processor | join(' ') | lower is search('amd')
  changed_when: true
  failed_when: false

- name: Disable legacy vsyscall page (exploit gadget source)
  ansible.builtin.command:
    cmd: grubby --args="vsyscall=none" --update-kernel=ALL
  register: system_vsyscall_result
  when:
    - system_grubby_info.rc | default(1) == 0
    - "'vsyscall=none' not in (system_grubby_info.stdout | default(''))"
  changed_when: true
  failed_when: false

- name: Zero-fill freed memory pages (init_on_free — not a Fedora default)
  ansible.builtin.command:
    cmd: grubby --args="init_on_free=1" --update-kernel=ALL
  register: system_init_on_free_result
  when:
    - system_grubby_info.rc | default(1) == 0
    - "'init_on_free=1' not in (system_grubby_info.stdout | default(''))"
  changed_when: true
  failed_when: false

- name: Randomize page allocator free-list order (heap-spray defense)
  ansible.builtin.command:
    cmd: grubby --args="page_alloc.shuffle=1" --update-kernel=ALL
  register: system_page_shuffle_result
  when:
    - system_grubby_info.rc | default(1) == 0
    - "'page_alloc.shuffle=1' not in (system_grubby_info.stdout | default(''))"
  changed_when: true
  failed_when: false

- name: Remove stale rd.luks.key grub parameter (no keyfile on /boot — avoids LUKS UUID leakage)
  ansible.builtin.command:
    cmd: grubby --remove-args="rd.luks.key" --update-kernel=ALL
  register: system_luks_key_cleanup
  when:
    - system_grubby_info.rc | default(1) == 0
    - "'rd.luks.key' in (system_grubby_info.stdout | default(''))"
  changed_when: true
  failed_when: false
  # rd.luks.key in the cmdline with no /boot/keyfile is a stale remnant — dracut
  # falls back to passphrase correctly, but the dead param leaks the LUKS device UUID.

- name: Notify that reboot is required for kernel parameters
  ansible.builtin.debug:
    msg: "REBOOT REQUIRED: kernel params changed (lockdown/iommu/vsyscall/init_on_free/shuffle/luks-key). Reboot."
  when: >-
    (system_lockdown_result is changed) or
    (system_iommu_result is defined and system_iommu_result is changed) or
    (system_vsyscall_result is defined and system_vsyscall_result is changed) or
    (system_init_on_free_result is defined and system_init_on_free_result is changed) or
    (system_page_shuffle_result is defined and system_page_shuffle_result is changed) or
    (system_luks_key_cleanup is defined and system_luks_key_cleanup is changed)

# --- Core dumps ---
- name: Ensure coredump config directory
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    mode: "0755"

- name: Disable core dumps
  ansible.builtin.template:
    src: coredump-disable.conf.j2
    dest: /etc/systemd/coredump.conf.d/disable.conf
    mode: "0644"

# --- Auditd ---
- name: Install audit package
  ansible.builtin.dnf:
    name: audit
    state: present
  when: ansible_pkg_mgr in ['dnf', 'dnf5']

- name: Deploy auditd rules
  ansible.builtin.template:
    src: auditd-claude.rules.j2
    dest: /etc/audit/rules.d/claude-code.rules
    mode: "0640"
  notify: Restart auditd
  when: ansible_system == 'Linux'

- name: Deploy auditd main configuration (CIS 4.1.2.x disk-space settings)
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0640"
  notify: Restart auditd
  when:
    - ansible_system == 'Linux'
    - not (csb_detected | default(false))  # CSB may send events to a SIEM via audisp-remote; don't overwrite

# --- Bolt (Thunderbolt device authorization daemon) ---
- name: Install bolt for Thunderbolt device authorization
  ansible.builtin.dnf:
    name: bolt
    state: present
  when: ansible_pkg_mgr in ['dnf', 'dnf5']
  failed_when: false

- name: Start bolt service (D-Bus activated, no [Install] section — cannot be enabled)
  ansible.builtin.systemd:
    name: bolt
    state: started
  when: ansible_pkg_mgr in ['dnf', 'dnf5']
  failed_when: false

# --- Authselect profile baseline ---
# authselect enable-feature requires the 'sssd' profile to be active; 'minimal' and
# 'local' (used by some Vagrant boxes and minimal installs) don't have with-faillock
# or with-pwhistory feature snippets and silently fail. Also required for Anaconda-
# installed systems where PAM files may have been edited outside authselect (dirty state).
- name: Check current authselect profile
  ansible.builtin.command:
    cmd: authselect current --raw
  register: system_authselect_current
  changed_when: false
  failed_when: false

- name: Select authselect sssd profile and clear PAM drift
  ansible.builtin.command:
    cmd: authselect select sssd --force
  when:
    - ansible_system == 'Linux'
    - system_authselect_current.stdout | default('') is not search('^sssd\b')
  changed_when: true
  failed_when: false

# --- Disable fingerprint auth (bypasses pam_faillock; no enrolled prints expected) ---
- name: Check if authselect with-fingerprint feature is enabled
  ansible.builtin.command:
    cmd: authselect is-feature-enabled with-fingerprint
  register: system_authselect_fingerprint_check
  changed_when: false
  failed_when: false

- name: Disable authselect with-fingerprint feature
  ansible.builtin.command:
    cmd: authselect disable-feature with-fingerprint
  when: system_authselect_fingerprint_check.rc | default(1) == 0
  changed_when: true
  failed_when: false

- name: Mask fprintd.service (PAM fingerprint disabled; prevent D-Bus activation)
  ansible.builtin.systemd:
    name: fprintd.service
    masked: true
    state: stopped
  failed_when: false

# --- Mask bluetooth (default: enabled; set system_disable_bluetooth: true in config.yml to disable) ---
- name: Mask bluetooth service
  ansible.builtin.systemd:
    name: bluetooth.service
    masked: true
    state: stopped
  when: system_disable_bluetooth | default(false) | bool
  failed_when: false

# --- Mask thermald (Intel-only; exits immediately on AMD hardware) ---
- name: Mask thermald on non-Intel hardware
  ansible.builtin.systemd:
    name: thermald
    masked: true
    state: stopped
  when: "'Intel' not in (ansible_processor | join(' '))"
  failed_when: false

# --- TLP battery charge management (ThinkPad) ---
- name: Install TLP for ThinkPad battery charge thresholds
  ansible.builtin.dnf:
    name:
      - tlp
      - tlp-rdw
    state: present
  when:
    - system_tlp_enabled | bool
    - ansible_pkg_mgr in ['dnf', 'dnf5']
  failed_when: false

- name: Mask power-profiles-daemon (conflicts with TLP)
  ansible.builtin.systemd:
    name: power-profiles-daemon
    masked: true
    state: stopped
  when: system_tlp_enabled | bool
  failed_when: false

- name: Deploy TLP ThinkPad charge threshold config
  ansible.builtin.template:
    src: tlp-thinkpad.conf.j2
    dest: /etc/tlp.d/50-thinkpad.conf
    mode: "0644"
  when:
    - system_tlp_enabled | bool
    - ansible_system == 'Linux'
  failed_when: false
  notify: Restart tlp

- name: Enable and start TLP service
  ansible.builtin.systemd:
    name: tlp
    state: started
    enabled: true
  when: system_tlp_enabled | bool
  failed_when: false

# --- Mask cups-browsed (RCE entry point: CVE-2024-47176); disable cups.service ---
# cups-browsed is masked (not just disabled) because it's an active RCE target.
# cups.service is disabled/stopped but NOT masked — Flatpak print dialogs use
# cups.socket for activation and masking cups.service while leaving cups.socket
# enabled creates a broken half-masked state (socket accepts, activation fails).
# If this machine will never print, also mask cups.socket and cups.path.
- name: Mask cups-browsed (RCE entry point)
  ansible.builtin.systemd:
    name: cups-browsed
    masked: true
    state: stopped
  failed_when: false

- name: Disable cups.service (not a print server)
  ansible.builtin.systemd:
    name: cups
    state: stopped
    enabled: false
  failed_when: false

# --- Mask avahi-daemon (mDNS hostname exposure on local network) ---
- name: Mask avahi-daemon service
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
    state: stopped
  loop:
    - avahi-daemon.service
    - avahi-daemon.socket
  failed_when: false

# --- Logind lid close ---
# Write to a drop-in so package upgrades can't clobber the settings.
- name: Ensure logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    mode: "0755"

- name: Configure lid close behavior
  community.general.ini_file:
    path: /etc/systemd/logind.conf.d/99-hardening.conf
    section: Login
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
    create: true
  loop:
    - key: HandleLidSwitch
      value: "{{ system_lid_switch }}"
    - key: HandleLidSwitchExternalPower
      value: "{{ system_lid_switch_external }}"
    - key: HandleLidSwitchDocked
      value: "{{ system_lid_switch_docked }}"
    - key: HandleHibernateKey
      value: ignore
    - key: HandlePowerKey
      value: lock
    - key: IdleAction
      value: lock
    - key: IdleActionSec
      value: "300"
  notify: Restart logind

# --- Disable Ctrl+Alt+Delete reboot ---
- name: Mask Ctrl+Alt+Delete reboot target
  ansible.builtin.systemd:
    name: ctrl-alt-del.target
    masked: true
  failed_when: false

# --- Services ---
- name: Enable libvirtd
  ansible.builtin.systemd:
    name: libvirtd
    state: started
    enabled: true
  when: system_enable_libvirtd | bool
  failed_when: false

- name: Remove ssh from libvirt firewall zone (VMs must not reach host sshd)
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: firewall-cmd --zone=libvirt --remove-service=ssh --permanent
  register: system_libvirt_ssh
  changed_when: "'NOT_ENABLED' not in ((system_libvirt_ssh.stderr | default('')) + (system_libvirt_ssh.stdout | default('')))"
  failed_when:
    - system_libvirt_ssh.rc != 0
    - "'NOT_ENABLED' not in ((system_libvirt_ssh.stderr | default('')) + (system_libvirt_ssh.stdout | default('')))"
  when:
    - system_firewalld_running | bool
    - system_enable_libvirtd | bool
  notify: Reload firewalld

- name: Install Mullvad VPN
  ansible.builtin.dnf:
    name: mullvad-vpn
    state: present
  when:
    - system_enable_mullvad | bool
    - ansible_pkg_mgr in ['dnf', 'dnf5']
  failed_when: false

- name: Enable Mullvad VPN service
  ansible.builtin.systemd:
    name: mullvad-daemon
    state: started
    enabled: true
  when:
    - system_enable_mullvad | bool
    - ansible_pkg_mgr in ['dnf', 'dnf5']
  failed_when: false

# --- USBGuard ---
- name: Install USBGuard
  ansible.builtin.dnf:
    name:
      - usbguard
      - usbguard-selinux
    state: present
  when: system_install_usbguard | default(true) | bool
  failed_when: false

- name: Deploy USBGuard whitelist rules
  ansible.builtin.template:
    src: usbguard-rules.conf.j2
    dest: /etc/usbguard/rules.conf
    mode: "0600"
    backup: true
  when: system_install_usbguard | default(true) | bool
  failed_when: false
  notify: Restart usbguard

- name: Enforce ImplicitPolicyTarget=block in usbguard-daemon.conf
  ansible.builtin.lineinfile:
    path: /etc/usbguard/usbguard-daemon.conf
    regexp: '^ImplicitPolicyTarget='
    line: 'ImplicitPolicyTarget=block'
    state: present
  when: system_install_usbguard | default(true) | bool
  failed_when: false
  notify: Restart usbguard

- name: Enable USBGuard service
  ansible.builtin.systemd:
    name: usbguard
    state: started
    enabled: true
  when: system_install_usbguard | default(true) | bool
  failed_when: false

# --- Firmware updates (LVFS/fwupd) ---
- name: Install fwupd
  ansible.builtin.dnf:
    name: fwupd
    state: present
  when: ansible_pkg_mgr in ['dnf', 'dnf5']
  failed_when: false

- name: Enable fwupd-refresh.timer for automatic LVFS metadata updates
  ansible.builtin.systemd:
    name: fwupd-refresh.timer
    state: started
    enabled: true
  when: ansible_system == 'Linux'
  failed_when: false

- name: Refresh LVFS firmware metadata
  ansible.builtin.command:
    cmd: fwupdmgr refresh
  when: ansible_system == 'Linux'
  changed_when: false
  failed_when: false

- name: Mask passim (fwupd P2P caching dependency — unauthenticated HTTP on 0.0.0.0:27500)
  ansible.builtin.systemd:
    name: passim
    masked: true
    state: stopped
    daemon_reload: true
  when: ansible_system == 'Linux'
  failed_when: false
  # passim is an implicit fwupd dependency that opens port 27500 on all interfaces.
  # tailscale0 is in the 'trusted' firewall zone so any Tailscale peer can reach it.
  # Masking does not affect fwupd firmware update functionality.

- name: Check for firmware updates
  ansible.builtin.command:
    cmd: fwupdmgr get-updates --no-device-prompt
  register: system_fwupd
  when: ansible_system == 'Linux'
  changed_when: false
  failed_when: false

- name: Report available firmware updates
  ansible.builtin.debug:
    msg: "Firmware updates available: {{ system_fwupd.stdout | default('') | trim }}\nRun: sudo fwupdmgr update"
  when:
    - system_fwupd.rc | default(1) == 0
    - "'no available firmware updates' not in (system_fwupd.stdout | default('') | lower)"

# --- sshd hardening ---
- name: Assert real_user_id is non-empty and not root before deploying AllowUsers
  ansible.builtin.assert:
    that:
      - real_user_id | default('') | length > 0
      - real_user_id != 'root'
    fail_msg: >-
      real_user_id='{{ real_user_id | default("(empty)") }}' — AllowUsers in sshd would
      lock out all SSH users. Run as your normal user with -K (make all), not as root.
      'sudo -i && make all' sets USER=root and would write 'AllowUsers root'.
  when: ansible_facts.services['sshd.service'] is defined

- name: Ensure sshd config drop-in directory
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0700"

- name: Deploy sshd hardening config
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0600"
  notify: Restart sshd
  when: ansible_facts.services['sshd.service'] is defined

- name: Validate sshd config syntax after deploying drop-in  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: sshd -t
  become: true
  changed_when: false
  when: ansible_facts.services['sshd.service'] is defined

# --- SELinux SSH port label ---
- name: Label non-default SSH port for SELinux
  community.general.seport:
    ports: "{{ ssh_port }}"
    proto: tcp
    setype: ssh_port_t
    state: present
  when:
    - ssh_port | int != 22
    - ansible_selinux.status | default('') == 'enabled'
  failed_when: false

# --- Crypto policy ---
- name: Check current crypto policy
  ansible.builtin.command:
    cmd: update-crypto-policies --show
  register: system_crypto_policy
  changed_when: false
  failed_when: false

- name: Set crypto policy to DEFAULT:NO-SHA1
  ansible.builtin.command:
    cmd: update-crypto-policies --set DEFAULT:NO-SHA1
  when:
    - system_crypto_policy.rc == 0
    - system_crypto_policy.stdout | default('') != 'DEFAULT:NO-SHA1'
    - not (csb_detected | default(false))  # CSB IT may enforce FIPS/FUTURE; don't downgrade
  changed_when: true
  failed_when: false
  notify: Restart sshd

# --- Kernel modules for kind ---
- name: Load iptables kernel modules for kind
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  register: system_modules_result
  loop:
    - ip6_tables
    - ip6table_nat
    - ip_tables
    - iptable_nat
    - br_netfilter
    - nf_conntrack  # explicit load so nf_conntrack_max sysctl applies even if firewalld fails to start
    - overlay
  failed_when: false

- name: Warn if br_netfilter failed (bridge-nf-call-iptables sysctl would not apply)
  ansible.builtin.debug:
    msg: >-
      WARNING: br_netfilter module failed to load. net.bridge.bridge-nf-call-iptables
      will not be applied — Kubernetes/kind networking (NetworkPolicy) may be broken.
  when: >-
    system_modules_result.results
    | selectattr('item', 'equalto', 'br_netfilter')
    | selectattr('rc', 'defined')
    | selectattr('rc', 'ne', 0)
    | list | length > 0

# --- NetworkManager Tailscale unmanaged ---
- name: Ensure NetworkManager conf.d exists
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d
    state: directory
    mode: "0755"
  failed_when: false

- name: Configure WiFi MAC address randomization
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [device]
      wifi.scan-rand-mac-address=yes
      [connection]
      wifi.cloned-mac-address=stable-ssid
    dest: /etc/NetworkManager/conf.d/99-wifi-mac-rand.conf
    mode: "0644"
  failed_when: false
  notify: Reload NetworkManager

- name: Configure NetworkManager to ignore Tailscale and kind interfaces
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [keyfile]
      unmanaged-devices+=interface-name:tailscale*,interface-name:kind*,interface-name:virbr*,interface-name:ovs-system,interface-name:br-int,interface-name:br-ex,interface-name:br-local,interface-name:genev_sys_*,interface-name:wg*,interface-name:ovn-k8s-mp0
    dest: /etc/NetworkManager/conf.d/tailscale.conf
    mode: "0644"
  failed_when: false
  notify: Reload NetworkManager

- name: Deploy NM dns=systemd-resolved config (required for Tailscale MagicDNS split-DNS)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [main]
      dns=systemd-resolved
    dest: /etc/NetworkManager/conf.d/99-dns.conf
    mode: "0644"
  when:
    - ansible_system == 'Linux'
    - not (csb_detected | default(false))  # paired with resolv.conf guard — both or neither to avoid broken half-state
  failed_when: false
  notify: Reload NetworkManager

- name: Disable WiFi power saving (prevents latency spikes and drops on ThinkPad)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [connection]
      wifi.powersave=2
    dest: /etc/NetworkManager/conf.d/99-wifi-powersave.conf
    mode: "0644"
  when: ansible_system == 'Linux'
  failed_when: false
  notify: Reload NetworkManager

# tailscale0 is intentionally not CSB-guarded: Tailscale is a user-managed VPN
# interface, not controlled by IT's firewalld policy. Trusted zone is required for
# Tailscale exit-node and peer-to-peer routing to work. Side effect: all Tailscale
# peers can reach any listening port on this machine (passim, etc. are masked separately).
- name: Assign tailscale0 to firewall trusted zone
  ansible.posix.firewalld:
    zone: trusted
    interface: tailscale0
    permanent: true
    immediate: true
    state: enabled
  when: system_firewalld_running | bool
  failed_when: false

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
  failed_when: false

# --- GNOME gcr-ssh-agent mask ---
- name: Mask gcr-ssh-agent socket
  ansible.builtin.systemd:
    name: gcr-ssh-agent.socket
    masked: true
    scope: user
  become: false
  failed_when: false
  when: not (csb_detected | default(false))  # CSB may route smart card/PIV auth through gcr-ssh-agent

# --- dnf-automatic ---
# CSB machines are managed by Red Hat IT via RHSM/Satellite with their own
# maintenance windows. Running dnf-automatic in parallel could install packages
# ahead of IT's approval cycle or outside maintenance windows.
- name: Install dnf-automatic
  ansible.builtin.dnf:
    name: "{{ 'dnf5-plugin-automatic' if ansible_pkg_mgr == 'dnf5' else 'dnf-automatic' }}"
    state: present
  when:
    - ansible_pkg_mgr in ['dnf', 'dnf5']
    - not (csb_detected | default(false))
  failed_when: false

- name: Deploy dnf-automatic config
  ansible.builtin.template:
    src: dnf-automatic.conf.j2
    dest: /etc/dnf/automatic.conf
    mode: "0644"
  notify: Restart dnf-automatic timer
  when:
    - ansible_pkg_mgr in ['dnf', 'dnf5']
    - not (csb_detected | default(false))

- name: Enable dnf-automatic timer
  ansible.builtin.systemd:
    name: "{{ 'dnf5-automatic.timer' if ansible_pkg_mgr == 'dnf5' else 'dnf-automatic.timer' }}"
    state: started
    enabled: true
  when:
    - ansible_pkg_mgr in ['dnf', 'dnf5']
    - not (csb_detected | default(false))
  failed_when: false

# --- AIDE database update after dnf-automatic (prevent false-positive alerts) ---
- name: Ensure dnf-automatic service drop-in directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ 'dnf5-automatic.service' if ansible_pkg_mgr == 'dnf5' else 'dnf-automatic.service' }}.d"
    state: directory
    mode: "0755"
  when:
    - ansible_system == 'Linux'
    - system_aide_enabled | bool
  failed_when: false

- name: Deploy AIDE update hook for dnf-automatic
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # Run aide --update after dnf-automatic applies security updates.
      # Without this, every update causes AIDE false-positive alerts that
      # train operators to ignore them, defeating the purpose of AIDE.
      [Service]
      ExecStartPost=/usr/bin/bash -c 'aide --update; mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz || true'
    dest: "/etc/systemd/system/{{ 'dnf5-automatic.service' if ansible_pkg_mgr == 'dnf5' else 'dnf-automatic.service' }}.d/aide-update.conf"
    mode: "0644"
  when:
    - ansible_system == 'Linux'
    - system_aide_enabled | bool
  notify: Restart dnf-automatic timer
  failed_when: false

# --- DNS-over-TLS ---
- name: Enable systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: started
    enabled: true
  when: ansible_system == 'Linux'
  failed_when: false

- name: Ensure resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
  when: ansible_system == 'Linux'

# yamllint disable rule:line-length
- name: Deploy DNS-over-TLS resolved config
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [Resolve]
      DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com
      Domains=~.
      DNSOverTLS=opportunistic
      DNSSEC=allow-downgrade
      FallbackDNS=
      LLMNR=no
      MulticastDNS=no
    dest: /etc/systemd/resolved.conf.d/99-dot.conf
    mode: "0644"
  when:
    - ansible_system == 'Linux'
    - not (csb_detected | default(false))  # CSB corporate networks block outbound 1.1.1.1; Domains=~. catch-all breaks DNS
  notify: Restart systemd-resolved
# yamllint enable rule:line-length

# --- Verify resolv.conf symlink for split DNS ---
- name: Check resolv.conf symlink target
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: system_resolv_conf

- name: Ensure resolv.conf points to systemd-resolved stub (required for split DNS/MagicDNS)
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when:
    - ansible_system == 'Linux'
    - not (csb_detected | default(false))  # CSB manages resolv.conf via NM/VPN; don't override
    - >-
      not (system_resolv_conf.stat.islnk | default(false)) or
      'stub-resolv' not in (system_resolv_conf.stat.lnk_source | default(''))
  failed_when: false

# --- Session timeout (CIS 5.5.5: TMOUT <= 900s) ---
- name: Deploy session timeout via profile.d
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # Auto-logout after 10 minutes of inactivity (CIS 5.5.5 requires <=900s)
      readonly TMOUT=600
      export TMOUT
    dest: /etc/profile.d/tmout.sh
    mode: "0644"
  when: ansible_system == 'Linux'

# --- Timezone and locale ---
- name: Set system timezone
  community.general.timezone:
    name: "{{ system_timezone }}"
  when: ansible_system == 'Linux'

- name: Set system locale
  ansible.builtin.copy:
    content: "LANG={{ system_locale }}\n"
    dest: /etc/locale.conf
    mode: "0644"
  when: ansible_system == 'Linux'

- name: Set console keymap
  ansible.builtin.copy:
    content: "KEYMAP={{ system_keymap }}\n"
    dest: /etc/vconsole.conf
    mode: "0644"
  when: ansible_system == 'Linux'

# --- Chrony NTS (authenticated time sync) ---
- name: Deploy NTS-authenticated chrony config
  ansible.builtin.template:
    src: chrony-nts.conf.j2
    dest: /etc/chrony.conf
    mode: "0644"
    backup: true
  notify: Restart chronyd
  when:
    - ansible_system == 'Linux'
    - not (csb_detected | default(false))  # CSB may use IPA-enrolled Kerberos NTP; replacing chrony.conf breaks kinit

- name: Ensure chronyd is enabled
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true
  when: ansible_system == 'Linux'

# --- PAM faillock (account lockout after failed attempts) ---
- name: Configure pam_faillock value settings
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - { key: deny, value: "5" }
    - { key: unlock_time, value: "900" }
  failed_when: false

- name: Configure pam_faillock boolean flags
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: "{{ item }}"
    allow_no_value: true
    mode: "0644"
  loop:
    - audit
    - even_deny_root
    - local_users_only  # prevent double-lockout with SSSD/IPA domain users
  failed_when: false

- name: Check if authselect with-faillock feature is already enabled
  ansible.builtin.command:
    cmd: authselect is-feature-enabled with-faillock
  register: system_authselect_faillock_check
  changed_when: false
  failed_when: false

- name: Enable authselect with-faillock feature
  ansible.builtin.command:
    cmd: authselect enable-feature with-faillock
  when: system_authselect_faillock_check.rc | default(1) != 0
  changed_when: true
  failed_when: false

# --- PAM pwhistory (password reuse prevention, CIS 5.3.5) ---
- name: Check if authselect with-pwhistory feature is already enabled
  ansible.builtin.command:
    cmd: authselect is-feature-enabled with-pwhistory
  register: system_authselect_pwhistory_check
  changed_when: false
  failed_when: false

- name: Enable authselect with-pwhistory feature
  ansible.builtin.command:
    cmd: authselect enable-feature with-pwhistory
  when: system_authselect_pwhistory_check.rc | default(1) != 0
  changed_when: true
  failed_when: false

- name: Configure pam_pwhistory remember count (CIS 5.3.5)
  community.general.ini_file:
    path: /etc/security/pwhistory.conf
    section: null
    option: remember
    value: "24"
    mode: "0644"
  failed_when: false

- name: Enforce pam_pwhistory for root (CIS 5.3.5)
  community.general.ini_file:
    path: /etc/security/pwhistory.conf
    section: null
    option: enforce_for_root
    allow_no_value: true
    mode: "0644"
  failed_when: false

# --- PAM pwquality (password complexity) ---
- name: Configure password quality requirements
  community.general.ini_file:
    path: /etc/security/pwquality.conf
    section: null
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - { key: minlen, value: "14" }
    - { key: dcredit, value: "-1" }
    - { key: ucredit, value: "-1" }
    - { key: lcredit, value: "-1" }
    - { key: ocredit, value: "-1" }
    - { key: difok, value: "4" }
    - { key: maxrepeat, value: "3" }
  failed_when: false

- name: Enforce pwquality for root (CIS 5.3.4)
  community.general.ini_file:
    path: /etc/security/pwquality.conf
    section: null
    option: enforce_for_root
    allow_no_value: true
    mode: "0644"
  failed_when: false

# --- Restrict su to wheel group ---
- name: Enable pam_wheel.so for su
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^#?\s*auth\s+required\s+pam_wheel\.so\s+use_uid'
    line: 'auth		required	pam_wheel.so use_uid'
    insertafter: '^#.*pam_wheel.so'

# --- Journald persistent logging and retention ---
- name: Ensure journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Ensure /var/log/journal exists for persistent storage
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: Deploy journald hardening config
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [Journal]
      Storage=persistent
      SystemMaxUse=4G
      SystemKeepFree=1G
      RateLimitIntervalSec=30s
      RateLimitBurst=20000
    dest: /etc/systemd/journald.conf.d/99-hardening.conf
    mode: "0644"
  notify: Restart systemd-journald

# --- Logrotate for sudo.log (created by sudoers Defaults logfile) ---
- name: Deploy logrotate config for sudo.log
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      /var/log/sudo.log {
          weekly
          rotate 8
          compress
          delaycompress
          missingok
          notifempty
          create 0640 root root
      }
    dest: /etc/logrotate.d/sudo
    mode: "0644"

# --- Cron access restriction (defense-in-depth if cronie is ever installed) ---
- name: Restrict cron access to root only
  ansible.builtin.copy:
    content: "root\n"
    dest: /etc/cron.allow
    mode: "0600"

- name: Restrict at access to root only
  ansible.builtin.copy:
    content: "root\n"
    dest: /etc/at.allow
    mode: "0600"

- name: Remove cron.deny (CIS 5.1.8 — cron.allow is authoritative)
  ansible.builtin.file:
    path: /etc/cron.deny
    state: absent

- name: Remove at.deny (CIS 5.1.9 — at.allow is authoritative)
  ansible.builtin.file:
    path: /etc/at.deny
    state: absent

- name: Harden cron directory permissions (CIS 5.1.2-5.1.7)
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/crontab, mode: "0600"}
    - {path: /etc/cron.hourly, mode: "0700"}
    - {path: /etc/cron.daily, mode: "0700"}
    - {path: /etc/cron.weekly, mode: "0700"}
    - {path: /etc/cron.monthly, mode: "0700"}
    - {path: /etc/cron.d, mode: "0700"}
  failed_when: false

# --- Login banner ---
- name: Deploy login banner
  ansible.builtin.copy:
    content: |
      NOTICE: This system is for authorized users only. Unauthorized access
      or use is strictly prohibited and may result in disciplinary action
      and/or criminal prosecution. All activities on this system may be
      monitored, recorded, and audited. By accessing this system, you
      consent to such monitoring and recording.
    dest: /etc/issue
    mode: "0644"
  failed_when: false

- name: Deploy SSH login banner
  ansible.builtin.copy:
    content: |
      NOTICE: This system is for authorized users only. Unauthorized access
      or use is strictly prohibited and may result in disciplinary action
      and/or criminal prosecution. All activities on this system may be
      monitored, recorded, and audited. By accessing this system, you
      consent to such monitoring and recording.
    dest: /etc/issue.net
    mode: "0644"
  failed_when: false

# --- Sudoers hardening ---
- name: Configure sudoers security defaults
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      Defaults logfile=/var/log/sudo.log
      Defaults log_input,log_output
      Defaults timestamp_timeout=15
      Defaults passwd_timeout=5
      Defaults passwd_tries=3
      Defaults umask=0027
      Defaults use_pty
    dest: /etc/sudoers.d/99-hardening
    mode: "0440"
    validate: visudo -cf %s

# --- Password aging ---
- name: Configure password aging in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.name }}\\s+"
    line: "{{ item.name }}\t{{ item.value }}"
    insertafter: EOF
    create: false
  loop:
    - { name: PASS_MAX_DAYS, value: "365" }
    - { name: PASS_MIN_DAYS, value: "1" }
    - { name: PASS_WARN_AGE, value: "7" }
    - { name: UMASK, value: "027" }
    - { name: HOME_MODE, value: "0750" }  # CIS: explicit home dir permissions (Fedora 38+ shadow-utils)
    - { name: INACTIVE, value: "30" }

- name: Enforce yescrypt password hashing in login.defs (CIS 5.3.6)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^ENCRYPT_METHOD'
    line: 'ENCRYPT_METHOD YESCRYPT'
    mode: "0644"

- name: Enforce yescrypt cost factor in login.defs (CIS 5.4.1)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?YESCRYPT_COST_FACTOR'
    line: 'YESCRYPT_COST_FACTOR 5'
    mode: "0644"

- name: Restrict existing user home directory to 0750 (CIS 6.2.x, retroactive)
  ansible.builtin.file:
    path: "{{ real_user_home }}"
    mode: "0750"
    state: directory
  when:
    - real_user_home is defined
    - real_user_home | length > 0
    - real_user_home != '/'
  failed_when: false

# --- Inactive account lockout (CIS 5.5.1.5: lock accounts inactive >30 days) ---
- name: Check useradd default INACTIVE setting
  ansible.builtin.command:
    cmd: useradd -D
  register: system_useradd_defaults
  changed_when: false

- name: Set default inactive days for new accounts to 30
  ansible.builtin.command:
    cmd: useradd -D -f 30
  when: "'INACTIVE=30' not in system_useradd_defaults.stdout"
  changed_when: true

# --- Rootless container prerequisites (subuid/subgid for podman) ---
- name: Ensure subuid entry exists for user
  ansible.builtin.lineinfile:
    path: /etc/subuid
    regexp: "^{{ real_user_id }}:"
    line: "{{ real_user_id }}:100000:65536"
    create: true
    mode: "0644"
  when: real_user_id is defined

- name: Ensure subgid entry exists for user
  ansible.builtin.lineinfile:
    path: /etc/subgid
    regexp: "^{{ real_user_id }}:"
    line: "{{ real_user_id }}:100000:65536"
    create: true
    mode: "0644"
  when: real_user_id is defined

- name: Enable session lingering for rootless podman socket persistence
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ real_user_id }}
  changed_when: false
  failed_when: false  # loginctl absent on macOS; system role runs Linux-only via site.yml
  when: real_user_id is defined
  # Without linger, systemd kills the user session (and podman.socket) when the
  # provisioning SSH session ends. DOCKER_HOST in dotfiles points to the socket.

# --- Lock root account ---
- name: Check root account status
  ansible.builtin.command:
    cmd: passwd -S root
  register: system_root_status
  changed_when: false

- name: Lock root account
  ansible.builtin.command:
    cmd: passwd -l root
  when: "'LK' not in system_root_status.stdout and 'L ' not in system_root_status.stdout"
  changed_when: true
  failed_when: false

# --- User account integrity (CIS 6.2.1/6.2.2/6.2.9) ---
- name: Find non-root UID 0 accounts (CIS 6.2.9)
  ansible.builtin.command:
    argv:
      - awk
      - "-F:"
      - "($3==0 && $1!=\"root\"){print $1}"
      - /etc/passwd
  register: system_uid0_accounts
  changed_when: false

- name: Assert no non-root UID 0 accounts (CIS 6.2.9)
  ansible.builtin.assert:
    that: system_uid0_accounts.stdout | length == 0
    fail_msg: "Non-root UID 0 accounts found: {{ system_uid0_accounts.stdout }}"
    success_msg: "CIS 6.2.9: no non-root UID 0 accounts"

- name: Find accounts with GID 0 (root group) as primary group (CIS 6.2.x)
  ansible.builtin.command:
    argv:
      - awk
      - "-F:"
      - "($4==0 && $1!~/^(root|sync|shutdown|halt|operator)$/){print $1}"
      - /etc/passwd
  register: system_gid0_accounts
  changed_when: false

- name: Assert no non-root GID 0 primary group accounts (CIS 6.2.x)
  ansible.builtin.assert:
    that: system_gid0_accounts.stdout | length == 0
    fail_msg: "Non-root accounts with root primary GID: {{ system_gid0_accounts.stdout }}"
    success_msg: "CIS 6.2.x: no non-root GID 0 primary group accounts"

- name: Find accounts with empty passwords in shadow (CIS 6.2.2)
  ansible.builtin.command:
    argv:
      - awk
      - "-F:"
      - "($2==\"\"){print $1}"
      - /etc/shadow
  register: system_empty_pw_accounts
  changed_when: false

- name: Assert no empty password accounts (CIS 6.2.2)
  ansible.builtin.assert:
    that: system_empty_pw_accounts.stdout | length == 0
    fail_msg: "Accounts with empty passwords: {{ system_empty_pw_accounts.stdout }}"
    success_msg: "CIS 6.2.2: no empty passwords"

- name: Find accounts with unmasked passwords in passwd (CIS 6.2.1)
  ansible.builtin.command:
    argv:
      - awk
      - "-F:"
      - "($2!=\"x\" && $2!=\"*\" && $2!=\"!\"){print $1}"
      - /etc/passwd
  register: system_unshadowed_accounts
  changed_when: false

- name: Assert all passwd entries use shadowed passwords (CIS 6.2.1)
  ansible.builtin.assert:
    that: system_unshadowed_accounts.stdout | length == 0
    fail_msg: "Unshadowed passwd entries: {{ system_unshadowed_accounts.stdout }}"
    success_msg: "CIS 6.2.1: all passwd entries shadowed"

# --- Critical file permissions (CIS 6.1.2/6.1.4/6.1.6/6.1.8) ---
- name: Enforce permissions on critical auth files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/passwd, group: root, mode: "0644"}
    - {path: /etc/shadow, group: shadow, mode: "0000"}
    - {path: /etc/group, group: root, mode: "0644"}
    - {path: /etc/gshadow, group: shadow, mode: "0000"}
  failed_when: false

# --- System-level dconf hardening (CIS 1.8.3/1.8.6-1.8.8) ---
# Written as root to /etc/dconf/db/ so settings are locked and cannot be
# overridden by users (unlike user-level community.general.dconf tasks).
- name: Ensure dconf local.d locks directory exists
  ansible.builtin.file:
    path: /etc/dconf/db/local.d/locks
    state: directory
    mode: "0755"
  when: ansible_system == 'Linux'

- name: Deploy system-level GNOME media-handling hardening (CIS 1.8.6-1.8.8)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # CIS 1.8.6-1.8.8: disable removable media automount/autorun
      [org/gnome/desktop/media-handling]
      automount=false
      autorun-never=true
      automount-open=false
    dest: /etc/dconf/db/local.d/50-hardening
    mode: "0644"
  when: ansible_system == 'Linux'
  notify: Run dconf update

- name: Deploy dconf locks for media-handling (CIS 1.8.6-1.8.8)
  ansible.builtin.copy:
    content: |
      /org/gnome/desktop/media-handling/automount
      /org/gnome/desktop/media-handling/autorun-never
      /org/gnome/desktop/media-handling/automount-open
    dest: /etc/dconf/db/local.d/locks/50-hardening
    mode: "0644"
  when: ansible_system == 'Linux'
  notify: Run dconf update

- name: Ensure gdm.d locks directory exists (CIS 1.8.3)
  ansible.builtin.file:
    path: /etc/dconf/db/gdm.d/locks
    state: directory
    mode: "0755"
  when: ansible_system == 'Linux'

- name: Disable GDM user list on login screen and deploy banner (CIS 1.8.2/1.8.3)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # CIS 1.8.2: GDM login banner
      # CIS 1.8.3: prevent username enumeration on GDM login screen
      [org/gnome/login-screen]
      banner-message-enable=true
      banner-message-text='Authorized users only. All activity is monitored and logged.'
      disable-user-list=true
    dest: /etc/dconf/db/gdm.d/03-hardening
    mode: "0644"
  when: ansible_system == 'Linux'
  notify: Run dconf update

- name: Lock GDM login-screen keys (CIS 1.8.2/1.8.3)
  ansible.builtin.copy:
    content: |
      /org/gnome/login-screen/banner-message-enable
      /org/gnome/login-screen/banner-message-text
      /org/gnome/login-screen/disable-user-list
    dest: /etc/dconf/db/gdm.d/locks/03-hardening
    mode: "0644"
  when: ansible_system == 'Linux'
  notify: Run dconf update

- name: Deploy screensaver/idle lock policy (CIS 1.8.4/1.8.5)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # CIS 1.8.4/1.8.5: GNOME screen lock on idle (≤900s per benchmark)
      [org/gnome/desktop/session]
      idle-delay=uint32 300

      [org/gnome/desktop/screensaver]
      lock-enabled=true
      lock-delay=uint32 0
    dest: /etc/dconf/db/local.d/51-screensaver
    mode: "0644"
  when: ansible_system == 'Linux'
  notify: Run dconf update

- name: Lock screensaver/idle settings (CIS 1.8.5)
  ansible.builtin.copy:
    content: |
      /org/gnome/desktop/session/idle-delay
      /org/gnome/desktop/screensaver/lock-enabled
      /org/gnome/desktop/screensaver/lock-delay
    dest: /etc/dconf/db/local.d/locks/51-screensaver
    mode: "0644"
  when: ansible_system == 'Linux'
  notify: Run dconf update

- name: Disable XDCMP in GDM (CIS 1.8.10)
  community.general.ini_file:
    path: /etc/gdm/custom.conf
    section: xdmcp
    option: Enable
    value: "false"
    create: true
    mode: "0644"
    no_extra_spaces: true
  when: ansible_system == 'Linux'
  failed_when: false

# --- AIDE file integrity monitoring ---
- name: Install AIDE
  ansible.builtin.dnf:
    name: aide
    state: present
  when: system_aide_enabled | bool

- name: Ensure AIDE monitors /usr/local/bin
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/usr/local/bin'
    line: '/usr/local/bin NORMAL'
    state: present
  when: system_aide_enabled | bool
  notify: Reinitialize AIDE database

- name: Ensure AIDE monitors sshd drop-in config directory
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/etc/ssh/sshd_config\.d'
    line: '/etc/ssh/sshd_config.d NORMAL'
    insertbefore: '^/etc\s'  # must precede the /etc PERMS catch-all (longest-match-wins)
    state: present
  when: system_aide_enabled | bool
  notify: Reinitialize AIDE database

- name: Add NetworkManager conf.d to AIDE monitoring (MAC randomization and DNS policy)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/etc/NetworkManager/conf\.d'
    line: '/etc/NetworkManager/conf.d NORMAL'
    insertbefore: '^/etc\s'
    state: present
  when: system_aide_enabled | bool
  notify: Reinitialize AIDE database

- name: Add systemd resolved conf.d to AIDE monitoring (DNS-over-TLS policy)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/etc/systemd/resolved\.conf\.d'
    line: '/etc/systemd/resolved.conf.d NORMAL'
    insertbefore: '^/etc\s'
    state: present
  when: system_aide_enabled | bool
  notify: Reinitialize AIDE database

- name: Add systemd logind conf.d to AIDE monitoring (session timeout policy)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/etc/systemd/logind\.conf\.d'
    line: '/etc/systemd/logind.conf.d NORMAL'
    insertbefore: '^/etc\s'
    state: present
  when: system_aide_enabled | bool
  notify: Reinitialize AIDE database

- name: Add TLP conf.d to AIDE monitoring (battery/power policy)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/etc/tlp\.d'
    line: '/etc/tlp.d NORMAL'
    insertbefore: '^/etc\s'
    state: present
  when:
    - system_aide_enabled | bool
    - system_tlp_enabled | bool
  notify: Reinitialize AIDE database

- name: Add /etc/tlp.conf to AIDE monitoring (TLP global config)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/etc/tlp\.conf\s'  # whitespace-anchor prevents matching /etc/tlp.conf.bak etc.
    line: '/etc/tlp.conf NORMAL'
    insertbefore: '^/etc\s'
    state: present
  when:
    - system_aide_enabled | bool
    - system_tlp_enabled | bool
  notify: Reinitialize AIDE database

- name: Add crypto-policies to AIDE monitoring (system-wide crypto algorithm enforcement)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/etc/crypto-policies'
    line: '/etc/crypto-policies NORMAL'
    insertbefore: '^/etc\s'
    state: present
  when: system_aide_enabled | bool
  notify: Reinitialize AIDE database
  # Default aide.conf only PERMS-checks /etc; without this, root silently
  # re-enabling SHA1 (update-crypto-policies --set DEFAULT) goes undetected.

- name: Add SELinux policy directory to AIDE monitoring
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/etc/selinux'
    line: '/etc/selinux NORMAL'
    insertbefore: '^/etc\s'
    state: present
  when: system_aide_enabled | bool
  notify: Reinitialize AIDE database
  # Default aide.conf only PERMS-checks /etc; auditd watches /etc/selinux for
  # writes (-k mac-policy) but AIDE needs content-level integrity verification.

- name: Add /etc/bpfman to AIDE monitoring (eBPF program manager config)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/etc/bpfman'
    line: '/etc/bpfman NORMAL'
    insertbefore: '^/etc\s'
    state: present
  when: system_aide_enabled | bool
  notify: Reinitialize AIDE database
  # Default aide.conf only PERMS-checks /etc; bpfman has kernel-level eBPF access
  # so config mutations by root must be content-verified, not just perm-checked.
  # Paired with the auditd -w /etc/bpfman/ watch in auditd-claude.rules.j2.

- name: Add /etc/usbguard to AIDE monitoring (USB device whitelist integrity)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/etc/usbguard'
    line: '/etc/usbguard NORMAL'
    insertbefore: '^/etc\s'
    state: present
  when: system_aide_enabled | bool
  notify: Reinitialize AIDE database

- name: Add /etc/audit to AIDE monitoring (audit rules and config integrity)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/etc/audit'
    line: '/etc/audit NORMAL'
    insertbefore: '^/etc\s'
    state: present
  when: system_aide_enabled | bool
  notify: Reinitialize AIDE database

- name: Add /etc/aide.conf to AIDE monitoring (self-reference — detect config tampering)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/etc/aide\.conf\s'
    line: '/etc/aide.conf NORMAL'
    insertbefore: '^/etc\s'
    state: present
  when: system_aide_enabled | bool
  notify: Reinitialize AIDE database

- name: Add /boot to AIDE monitoring (kernel cmdline parameter protection)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/boot'
    line: '/boot NORMAL'
    state: present
  when: system_aide_enabled | bool
  notify: Reinitialize AIDE database
  # grubby modifies /boot/loader/entries/ directly; auditd watches /boot for writes
  # but AIDE provides the content integrity baseline to detect unauthorized changes.

# Fire the AIDE reinit handler here if any conf path changed — this avoids
# running aide --init twice on first provision (once from the handler, once
# from the first-run block below when stat shows DB absent after handler built it).
- name: Flush AIDE handlers before database existence check
  ansible.builtin.meta: flush_handlers

- name: Check if AIDE database exists
  ansible.builtin.stat:
    path: /var/lib/aide/aide.db.gz
  register: system_aide_db
  when: system_aide_enabled | bool

- name: Warn that AIDE initialization takes 5-10 minutes
  ansible.builtin.debug:
    msg: "Starting AIDE database initialization — this scans the filesystem and takes 5-10 minutes. Do not cancel."
  when:
    - system_aide_enabled | bool
    - not (system_aide_db.stat.exists | default(false))

- name: Initialize AIDE database (first run only)
  ansible.builtin.command:
    cmd: aide --init
  when:
    - system_aide_enabled | bool
    - not (system_aide_db.stat.exists | default(false))
  changed_when: true

- name: Promote initial AIDE database
  ansible.builtin.copy:
    src: /var/lib/aide/aide.db.new.gz
    dest: /var/lib/aide/aide.db.gz
    remote_src: true
    mode: "0600"
  when:
    - system_aide_enabled | bool
    - not (system_aide_db.stat.exists | default(false))

- name: Deploy AIDE check service
  ansible.builtin.template:
    src: aide-check.service.j2
    dest: /etc/systemd/system/aide-check.service
    mode: "0644"
  notify: Restart aide-check timer
  when: system_aide_enabled | bool

- name: Deploy AIDE check timer
  ansible.builtin.template:
    src: aide-check.timer.j2
    dest: /etc/systemd/system/aide-check.timer
    mode: "0644"
  notify: Restart aide-check timer
  when: system_aide_enabled | bool

- name: Enable AIDE check timer
  ansible.builtin.systemd:
    name: aide-check.timer
    state: started
    enabled: true
    daemon_reload: true
  when: system_aide_enabled | bool
