---
# roles/system/tasks/main.yml
# System hardening: firewall, sysctl, kernel lockdown, auditd, services.
# All tasks require become (Play 1 has become: true at play level).

# --- SECURITY: Input validation for sysctl key and value format ---
# Prevents injection attacks via newlines, shell metacharacters in sysctl keys and values.
# This assertion runs before any hardening tasks to catch malformed input early.
- name: "SECURITY: Validate sysctl key and value format in all extra dicts"
  ansible.builtin.assert:
    that:
      - "(_sysctl_keys | map('regex_search', '^[a-zA-Z0-9._-]+$') | all)"
      - "(_sysctl_values_invalid | length == 0)"
    fail_msg: >-
      Invalid sysctl key or value format.
      Sysctl keys must match [a-zA-Z0-9._-]+ only.
      Sysctl values must be alphanumeric, dots, slashes, hyphens, underscores, pipes only (no other shell metacharacters).
      Found invalid keys: {{ _sysctl_keys | select('not', 'regex_search', '^[a-zA-Z0-9._-]+$') | list }}
      Found invalid values: {{ _sysctl_values_invalid }}
  vars:
    _sysctl_keys: "{{ (system_sysctl_extra.keys() | list) + (system_sysctl_extra_additional.keys() | list) }}"
    _sysctl_all_dicts: "{{ [system_sysctl_extra | default({}), system_sysctl_extra_additional | default({})] }}"
    # yamllint disable-line rule:line-length
    _sysctl_values_invalid: "{{ _sysctl_all_dicts | map('dict2items') | flatten | map(attribute='value') | map('string') | select('not', 'regex_search', '^[a-zA-Z0-9._/\\-_|]+$') | list }}"
  when: not (system_is_container or csb_rhel)
  tags: [always]

# --- SECURITY: Enforce collections-dist integrity against supply chain tampering ---
# Detects commits created with `git commit --no-verify` that bypass pre-commit SHA256SUMS
# check. Paired with CI collections-integrity job for defense-in-depth protection.
- name: "SECURITY: Verify collections-dist SHA256SUMS before provisioning"
  ansible.builtin.assert:
    that:
      - lookup('file', 'collections-dist/SHA256SUMS') is defined
      - "'ansible-posix-2.2.2.tar.gz' in lookup('file', 'collections-dist/SHA256SUMS')"
      - "'community-general-13.2.0.tar.gz' in lookup('file', 'collections-dist/SHA256SUMS')"
      - "'community-library_inventory_filtering_v1-1.1.5.tar.gz' in lookup('file', 'collections-dist/SHA256SUMS')"
      - "'containers-podman-1.20.2.tar.gz' in lookup('file', 'collections-dist/SHA256SUMS')"
    fail_msg: |
      SECURITY FAILURE: collections-dist/SHA256SUMS missing or incomplete.
      This indicates collections-dist/*.tar.gz may have been modified without updating
      SHA256SUMS. Common cause: `git commit --no-verify` bypassed the pre-commit guard.

      To fix: cd collections-dist && sha256sum *.tar.gz > SHA256SUMS
      Then commit normally: git add SHA256SUMS && git commit (no --no-verify)
  tags: [always]

# --- Gather service facts (needed for firewalld/auditd/resolved conditionals) ---
- name: Gather service facts
  ansible.builtin.service_facts:
  when: not system_is_container  # systemctl list-units --all crashes PID 1 in Debian 13 privileged Podman containers

- name: Seed empty service facts for container environments
  # Ensures ansible_facts.services is defined so downstream 'is defined' guards
  # (firewall.yml, sshd.yml, main.yml gdm check) evaluate safely to False.
  ansible.builtin.set_fact:
    ansible_facts: "{{ ansible_facts | combine({'services': {}}) }}"
  when: system_is_container

# --- Prerequisites (needed by seport and other system tasks) ---
- name: Ensure policycoreutils-python-utils is installed
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  when:
    - is_dnf
    - not csb_rhel
    - not system_is_container  # RPM post-install calls daemon-reload, crashes Podman container systemd; installed in prepare instead

- name: "SECURITY: Reject system_selinux_enforcing_required: false on managed dnf hosts"
  ansible.builtin.assert:
    that:
      - system_selinux_enforcing_required | bool
    fail_msg: >-
      SECURITY: system_selinux_enforcing_required is false — all SELinux enforcement tasks are skipped.
      Threat: config.yml sets system_selinux_enforcing_required: false to silently bypass MAC enforcement.
      Input: system_selinux_enforcing_required={{ system_selinux_enforcing_required }}.
      Mechanism: hardening_core.yml outer block when-condition evaluates false — setenforce, fact refresh,
      and enforce assert are all skipped; provisioning completes with SELinux in permissive or disabled state.
      Impact: SELinux MAC bypass — all DAC-equivalent attacks succeed without audit log entries.
      Fix: remove system_selinux_enforcing_required from config.yml or set it to true.
  when: is_dnf and not csb_rhel and not system_is_container
  tags: [always]

- name: "Hardening core (mounts, firewall, kernel, sysctl, coredumps, modules blacklist, kernel lockdown)"
  ansible.builtin.import_tasks: hardening_core.yml

- name: "GRUB bootloader password (CIS 1.4.2)"
  ansible.builtin.import_tasks: grub_password.yml

# --- Auditd ---
- name: Auditd tasks
  ansible.builtin.import_tasks: auditd.yml

- name: "Bolt hardening"
  ansible.builtin.import_tasks: bolt.yml

- name: Authselect and fingerprint auth
  ansible.builtin.import_tasks: authselect_fingerprint.yml

- name: "Service masking"
  ansible.builtin.import_tasks: service_masking.yml

- name: "Logind configuration"
  ansible.builtin.import_tasks: logind.yml

- name: "Service enable/disable"
  ansible.builtin.import_tasks: services.yml

- name: Firmware updates
  ansible.builtin.import_tasks: firmware.yml

- name: SSHD hardening, SELinux port label, and crypto policy
  ansible.builtin.import_tasks: sshd.yml

- name: Kernel modules for kind
  ansible.builtin.include_tasks: kernel_modules_kind.yml
  when: profile == 'work' or install_virtualization | bool

- name: NetworkManager configuration
  ansible.builtin.import_tasks: nm.yml

- name: Dnf-automatic
  ansible.builtin.import_tasks: dnf_automatic.yml

- name: DNS-over-TLS
  ansible.builtin.import_tasks: dns_over_tls.yml
  when: not system_is_container

# --- Session timeout (CIS 5.5.5: TMOUT <= 900s) ---
- name: "Session timeout"
  ansible.builtin.import_tasks: session_timeout.yml

- name: Timezone and locale
  ansible.builtin.import_tasks: timezone_locale.yml

- name: Chrony NTS
  ansible.builtin.import_tasks: chrony.yml
  when: not system_is_container  # chrony apt install + systemd start hang in Debian 13 privileged Podman containers

- name: PAM hardening (faillock, pwhistory, pwquality, pam_wheel)
  ansible.builtin.import_tasks: pam.yml

- name: Journald persistent logging
  ansible.builtin.import_tasks: journald.yml

- name: Logrotate for sudo.log
  ansible.builtin.import_tasks: logrotate_sudo.yml

- name: "Cron access restriction"
  ansible.builtin.import_tasks: cron.yml

- name: Deploy login banners (/etc/issue and /etc/issue.net)
  ansible.builtin.copy:
    content: |
      NOTICE: This system is for authorized users only. Unauthorized access
      or use is strictly prohibited and may result in disciplinary action
      and/or criminal prosecution. All activities on this system may be
      monitored, recorded, and audited. By accessing this system, you
      consent to such monitoring and recording.
    dest: "{{ item }}"
    mode: "0644"
  loop: [/etc/issue, /etc/issue.net]
  when:
    - not csb_rhel  # no IT banner at home
    - not system_is_container  # /etc/issue writes trigger getty inotify; crashes privileged Podman container PID 1
  failed_when: false

- name: Account hardening
  ansible.builtin.import_tasks: account_hardening.yml
  tags: [account, become]

- name: System-level dconf hardening
  ansible.builtin.include_tasks: dconf.yml
  when:
    - '"gdm.service" in ansible_facts.services'
    - not csb_rhel

- name: "AIDE cleanup"
  ansible.builtin.import_tasks: aide_cleanup.yml

- name: AIDE configuration
  ansible.builtin.import_tasks: aide.yml
