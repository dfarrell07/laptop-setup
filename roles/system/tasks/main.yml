---
# roles/system/tasks/main.yml
# System hardening: firewall, sysctl, kernel lockdown, auditd, services.
# All tasks require become (Play 1 has become: true at play level).

# --- Gather service facts (needed for firewalld/auditd/resolved conditionals) ---
- name: Gather service facts
  ansible.builtin.service_facts:

# --- Prerequisites (needed by seport and other system tasks) ---
- name: Ensure policycoreutils-python-utils is installed
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  when: ansible_facts['pkg_mgr'] in ['dnf', 'dnf5'] and not csb_rhel

# --- SELinux enforcement check ---
- name: Verify SELinux is enforcing
  ansible.builtin.assert:
    that:
      - ansible_facts['selinux'].status == 'enabled'
      - ansible_facts['selinux'].mode == 'enforcing'
      - ansible_facts['selinux'].type == 'targeted'
    fail_msg: >-
      SELinux is {{ ansible_facts['selinux'].mode | default('disabled') }}
      (type: {{ ansible_facts['selinux'].type | default('unknown') }}).
      Fix: sudo setenforce 1 && sudo sed -i
      's/^SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config
  when: ansible_facts['selinux'] is defined and ansible_facts['selinux'] is mapping and ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']

# --- Harden /tmp mount options (CIS 1.1.2.x) ---
- name: Ensure tmp.mount drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/tmp.mount.d
    state: directory
    mode: "0755"

- name: Configure /tmp hardening drop-in (nosuid/nodev always; noexec when system_tmp_noexec)
  vars:
    _noexec_opt: "{{ ',noexec' if system_tmp_noexec | bool else '' }}"
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # IMPORTANT: Options= replaces all base unit options (no merge).
      # Must include all options from tmp.mount base unit.
      # Base: mode=1777,strictatime,nosuid,nodev,size=50%,nr_inodes=1m,x-systemd.graceful-option=usrquota
      [Mount]
      Options=mode=1777,strictatime,nosuid,nodev{{ _noexec_opt }},size=50%%,nr_inodes=1m,x-systemd.graceful-option=usrquota
    dest: /etc/systemd/system/tmp.mount.d/hardening.conf
    mode: "0644"
  notify: Remount /tmp  # handler live-removes noexec; daemon_reload below handles first-provision

- name: Reload systemd after deploying tmp.mount drop-in
  ansible.builtin.systemd:
    daemon_reload: true

- name: Check /tmp current mount options
  ansible.builtin.command:
    cmd: findmnt -n -o OPTIONS /tmp
  register: system_tmp_opts
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Apply /tmp hardening immediately via remount  # noqa: command-instead-of-module
  vars:
    _noexec_opt: "{{ ',noexec' if system_tmp_noexec | bool else '' }}"
  ansible.builtin.command:
    cmd: "mount -o remount,nosuid,nodev{{ _noexec_opt }} /tmp"
  register: _tmp_remount_result
  changed_when: _tmp_remount_result.rc == 0
  when:
    - >-
      'nosuid' not in (system_tmp_opts.stdout | default('')) or
      'nodev' not in (system_tmp_opts.stdout | default('')) or
      (system_tmp_noexec | bool and 'noexec' not in (system_tmp_opts.stdout | default('')))
  failed_when: false

- name: Warn if /tmp remount failed
  ansible.builtin.debug:
    msg: >-
      WARNING: remount of /tmp failed (rc={{ _tmp_remount_result.rc }});
      live nosuid/nodev{{ '/noexec' if system_tmp_noexec | bool else '' }} may not be active
  when:
    - _tmp_remount_result.rc | default(0) != 0

# --- Harden /dev/shm mount options ---
# Fedora 44 does NOT ship a dev-shm.mount systemd unit, so a drop-in under
# dev-shm.mount.d/ is silently ignored. Use fstab for persistence and a
# direct remount for immediate effect.
- name: Ensure /dev/shm fstab entry has noexec (CIS 1.1.7.x)
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^tmpfs\s+/dev/shm\s+'
    line: 'tmpfs /dev/shm tmpfs defaults,nosuid,nodev,noexec,usrquota 0 0'
    create: true   # must be true on Fedora 44 — /dev/shm has no fstab line by default
    backup: true   # fstab corruption causes non-recoverable boot failure without console access
    mode: "0644"
  when:
    - not csb_rhel  # CSB (RHEL): IT-managed fstab

- name: Check /dev/shm current mount options
  ansible.builtin.command:
    cmd: findmnt -n -o OPTIONS /dev/shm
  register: system_devshm_opts
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Apply /dev/shm hardening immediately via remount  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: mount -o remount,nosuid,nodev,noexec /dev/shm
  register: _devshm_remount_result
  changed_when: _devshm_remount_result.rc == 0
  when:
    - >-
      'noexec' not in (system_devshm_opts.stdout | default('')) or
      'nosuid' not in (system_devshm_opts.stdout | default('')) or
      'nodev' not in (system_devshm_opts.stdout | default(''))
  failed_when: false

- name: Warn if /dev/shm remount failed
  ansible.builtin.debug:
    msg: "WARNING: remount of /dev/shm failed (rc={{ _devshm_remount_result.rc }}); live nosuid/nodev/noexec may not be active"
  when:
    - _devshm_remount_result.rc | default(0) != 0

# On CSB, fstab is IT-managed so we cannot add the /dev/shm entry for persistence.
# Deploy a one-shot service to re-apply hardening on every boot instead.
- name: Deploy dev-shm-harden.service (CSB — fstab not modified)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # On CSB, /etc/fstab is IT-managed. This one-shot service remounts
      # /dev/shm with nosuid,nodev,noexec at every boot (CIS 1.1.7.x).
      [Unit]
      Description=Harden /dev/shm mount options (CIS 1.1.7.x)
      DefaultDependencies=no
      After=local-fs.target
      Before=sysinit.target

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/mount -o remount,nosuid,nodev,noexec /dev/shm
      RemainAfterExit=yes

      [Install]
      WantedBy=sysinit.target
    dest: /etc/systemd/system/dev-shm-harden.service
    mode: "0644"
    owner: root
    group: root
  when:
    - csb_rhel

- name: Enable dev-shm-harden.service (CSB)
  ansible.builtin.systemd:
    name: dev-shm-harden.service
    enabled: true
    daemon_reload: true
  when:
    - csb_rhel
  # ignore_errors (not failed_when: false): RHEL CSB IT policy may reject custom unit enables;
  # failed_when: false would set .failed=False and silently suppress the downstream warning.
  ignore_errors: true
  register: system_dev_shm_enable

- name: Warn if dev-shm-harden.service could not be enabled (CSB)
  ansible.builtin.debug:
    msg: >-
      dev-shm-harden.service could not be enabled (systemd policy restriction or
      daemon-reload failure). /dev/shm hardening will NOT persist across reboots.
  when:
    - csb_rhel
    - system_dev_shm_enable.failed | default(false)

# --- Harden /home mount options (CIS 1.1.9) ---
# nosuid prevents any setuid binary a user copies into their home directory from
# gaining elevated privileges on exec. No standard Fedora package installs setuid
# binaries in /home; the only setuid files found there are container image overlay
# layers (~/.local/share/containers/storage/overlay/) which are unaffected because:
# (1) overlayfs/fuse-overlayfs creates independent submounts with their own flags —
# nosuid on /home does NOT propagate to those submounts; (2) rootless Podman uses
# user namespaces so setuid inside containers has no host-level effect regardless.
#
# CSB: RHEL CSB home directories may be NFS/autofs-mounted for LDAP users.
# fstab is IT-managed and remounting NFS with nosuid may break home directory
# access entirely. Skip on RHEL CSB — IT's mount policy governs /home there.
# Fedora hybrid (csb_detected=true, Fedora distribution): /home is a local
# btrfs partition from the Fedora installer; nosuid is safe and applied.
# Set system_home_nosuid_force: true in config.yml to override this skip when
# /home is a known local mount on a RHEL CSB machine (does not affect Fedora hybrid).
#
# Implementation uses backrefs (not create: true) because /home has an existing
# fstab entry from the Fedora installer; we append nosuid to the options field.
# Separate fstab vs live-mount checks allow the fstab and remount tasks to be
# independently idempotent (e.g. fstab updated on prior run but not yet rebooted).
- name: Check if /home is a separate mountpoint (CIS 1.1.9)
  ansible.builtin.command:
    cmd: findmnt -n /home
  register: system_home_mountpoint
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Check /home fstab options (CIS 1.1.9)
  ansible.builtin.command:
    cmd: findmnt -n -o OPTIONS --fstab /home
  register: system_home_fstab_opts
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - system_home_mountpoint.rc == 0
    - not csb_rhel or (system_home_nosuid_force | bool)
  failed_when: false

- name: Warn if /home has no fstab entry — fstab hardening cannot persist (CIS 1.1.9)
  ansible.builtin.debug:
    msg: >-
      WARNING: /home is a separate mountpoint but has no /etc/fstab entry.
      The fstab lineinfile tasks will silently no-op (backrefs: true). Live nosuid/nodev
      is applied for this session but will not survive a reboot. Add /home to /etc/fstab
      or set system_home_nosuid_force: false to suppress this block.
  when:
    - system_home_mountpoint.rc == 0
    - not csb_rhel or (system_home_nosuid_force | bool)
    - system_home_fstab_opts.rc | default(-1) != 0

- name: Add nosuid to /home fstab entry (CIS 1.1.9)
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^(\S+\s+/home\s+\S+\s+)(\S+)(\s+\d+\s+\d+\s*)$'
    backrefs: true
    line: '\1\2,nosuid\3'
    backup: true
    mode: "0644"
  when:
    - system_home_mountpoint.rc == 0
    - >-
      not csb_rhel
      or (system_home_nosuid_force | bool)
    - >-
      'nosuid' not in (system_home_fstab_opts.stdout | default(''))

- name: Add nodev to /home fstab entry (CIS 1.1.9)
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^(\S+\s+/home\s+\S+\s+)(\S+)(\s+\d+\s+\d+\s*)$'
    backrefs: true
    line: '\1\2,nodev\3'
    backup: true
    mode: "0644"
  when:
    - system_home_mountpoint.rc == 0
    - >-
      not csb_rhel
      or (system_home_nosuid_force | bool)
    - >-
      'nodev' not in (system_home_fstab_opts.stdout | default(''))

- name: Check /home current mount options (CIS 1.1.9)
  ansible.builtin.command:
    cmd: findmnt -n -o OPTIONS /home
  register: system_home_opts
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - system_home_mountpoint.rc == 0
    - not csb_rhel or (system_home_nosuid_force | bool)
  failed_when: false

- name: Apply /home nosuid immediately via remount (CIS 1.1.9)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: mount -o remount,nosuid,nodev /home
  register: _home_remount_result
  changed_when: _home_remount_result.rc == 0
  when:
    - system_home_mountpoint.rc == 0
    - >-
      not csb_rhel
      or (system_home_nosuid_force | bool)
    - >-
      'nosuid' not in (system_home_opts.stdout | default(''))
      or 'nodev' not in (system_home_opts.stdout | default(''))
  failed_when: false

- name: Warn if /home nosuid remount failed
  ansible.builtin.debug:
    msg: "WARNING: remount of /home failed (rc={{ _home_remount_result.rc }}); live nosuid may not be active"
  when:
    - _home_remount_result.rc | default(0) != 0

# --- Harden /boot mount options ---
# nosuid,nodev,noexec: no setuid binaries, device nodes, or executable code needs to
# be invoked from /boot at runtime. grubby and kernel-install write kernel/initramfs
# images there but do not exec from /boot, so noexec is safe.
#
# Implementation mirrors /home: separate fstab and live-mount idempotency checks so
# that each task can run independently (e.g. fstab updated on prior run but not yet
# rebooted). Uses backrefs to append to the installer's existing fstab entry.
#
# CSB: fstab is IT-managed; skip fstab modification on CSB and deploy a one-shot
# service to re-apply hardening at every boot instead (same pattern as dev-shm-harden.service).
# The live remount runs unconditionally to harden the current boot session.
- name: Check if /boot is a separate mountpoint
  ansible.builtin.command:
    cmd: findmnt -n /boot
  register: system_boot_mountpoint
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Check /boot fstab options
  ansible.builtin.command:
    cmd: findmnt -n -o OPTIONS --fstab /boot
  register: system_boot_fstab_opts
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - system_boot_mountpoint.rc == 0
    - not csb_rhel
  failed_when: false

- name: Add nosuid to /boot fstab entry
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^(\S+\s+/boot\s+\S+\s+)(\S+)(\s+\d+\s+\d+\s*)$'
    backrefs: true
    line: '\1\2,nosuid\3'
    backup: true
    mode: "0644"
  when:
    - system_boot_mountpoint.rc == 0
    - not csb_rhel
    - "'nosuid' not in (system_boot_fstab_opts.stdout | default(''))"

- name: Add nodev to /boot fstab entry
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^(\S+\s+/boot\s+\S+\s+)(\S+)(\s+\d+\s+\d+\s*)$'
    backrefs: true
    line: '\1\2,nodev\3'
    backup: true
    mode: "0644"
  when:
    - system_boot_mountpoint.rc == 0
    - not csb_rhel
    - "'nodev' not in (system_boot_fstab_opts.stdout | default(''))"

- name: Add noexec to /boot fstab entry
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^(\S+\s+/boot\s+\S+\s+)(\S+)(\s+\d+\s+\d+\s*)$'
    backrefs: true
    line: '\1\2,noexec\3'
    backup: true
    mode: "0644"
  when:
    - system_boot_mountpoint.rc == 0
    - not csb_rhel
    - "'noexec' not in (system_boot_fstab_opts.stdout | default(''))"

- name: Check /boot current mount options
  ansible.builtin.command:
    cmd: findmnt -n -o OPTIONS /boot
  register: system_boot_opts
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - system_boot_mountpoint.rc == 0
  failed_when: false

- name: Apply /boot hardening immediately via remount  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: mount -o remount,nosuid,nodev,noexec /boot
  register: _boot_remount_result
  changed_when: _boot_remount_result.rc == 0
  when:
    - system_boot_mountpoint.rc == 0
    - >-
      'nosuid' not in (system_boot_opts.stdout | default('')) or
      'nodev' not in (system_boot_opts.stdout | default('')) or
      'noexec' not in (system_boot_opts.stdout | default(''))
  failed_when: false

- name: Warn if /boot remount failed
  ansible.builtin.debug:
    msg: "WARNING: remount of /boot failed (rc={{ _boot_remount_result.rc }}); live nosuid/nodev/noexec may not be active"
  when:
    - _boot_remount_result.rc | default(0) != 0

- name: Deploy boot-harden.service (CSB — fstab not modified)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # On CSB, /etc/fstab is IT-managed. This one-shot service remounts
      # /boot with nosuid,nodev,noexec at every boot.
      [Unit]
      Description=Harden /boot mount options
      DefaultDependencies=no
      After=local-fs.target
      Before=sysinit.target

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/mount -o remount,nosuid,nodev,noexec /boot
      RemainAfterExit=yes

      [Install]
      WantedBy=sysinit.target
    dest: /etc/systemd/system/boot-harden.service
    mode: "0644"
    owner: root
    group: root
  when:
    - system_boot_mountpoint.rc == 0
    - csb_rhel

- name: Enable boot-harden.service (CSB)
  ansible.builtin.systemd:
    name: boot-harden.service
    enabled: true
    daemon_reload: true
  when:
    - system_boot_mountpoint.rc == 0
    - csb_rhel
  # ignore_errors (not failed_when: false): RHEL CSB IT policy may reject custom unit enables;
  # failed_when: false would set .failed=False and silently suppress the downstream warning.
  ignore_errors: true
  register: system_boot_harden_enable

- name: Warn if boot-harden.service could not be enabled (CSB)
  ansible.builtin.debug:
    msg: >-
      boot-harden.service could not be enabled (systemd policy restriction or
      daemon-reload failure). /boot hardening will NOT persist across reboots.
  when:
    - system_boot_mountpoint.rc == 0
    - csb_rhel
    - system_boot_harden_enable.failed | default(false)

# --- Harden /boot/efi mount options ---
# vfat does not support device nodes, so nodev is omitted (the kernel ignores it for
# vfat, but the canonical approach is to omit it). nosuid and noexec are valid and
# meaningful: no EFI binaries need setuid or exec from a running Linux system.
#
# CSB: same fstab management constraint as /boot — deploy one-shot service for persistence.
- name: Check if /boot/efi is a separate mountpoint
  ansible.builtin.command:
    cmd: findmnt -n /boot/efi
  register: system_boot_efi_mountpoint
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Check /boot/efi fstab options
  ansible.builtin.command:
    cmd: findmnt -n -o OPTIONS --fstab /boot/efi
  register: system_boot_efi_fstab_opts
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - system_boot_efi_mountpoint.rc == 0
    - not csb_rhel
  failed_when: false

- name: Add nosuid to /boot/efi fstab entry
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^(\S+\s+/boot/efi\s+\S+\s+)(\S+)(\s+\d+\s+\d+\s*)$'
    backrefs: true
    line: '\1\2,nosuid\3'
    backup: true
    mode: "0644"
  when:
    - system_boot_efi_mountpoint.rc == 0
    - not csb_rhel
    - "'nosuid' not in (system_boot_efi_fstab_opts.stdout | default(''))"

- name: Add noexec to /boot/efi fstab entry
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^(\S+\s+/boot/efi\s+\S+\s+)(\S+)(\s+\d+\s+\d+\s*)$'
    backrefs: true
    line: '\1\2,noexec\3'
    backup: true
    mode: "0644"
  when:
    - system_boot_efi_mountpoint.rc == 0
    - not csb_rhel
    - "'noexec' not in (system_boot_efi_fstab_opts.stdout | default(''))"

- name: Check /boot/efi current mount options
  ansible.builtin.command:
    cmd: findmnt -n -o OPTIONS /boot/efi
  register: system_boot_efi_opts
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - system_boot_efi_mountpoint.rc == 0
  failed_when: false

- name: Apply /boot/efi hardening immediately via remount  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: mount -o remount,nosuid,noexec /boot/efi
  register: _boot_efi_remount_result
  changed_when: _boot_efi_remount_result.rc == 0
  when:
    - system_boot_efi_mountpoint.rc == 0
    - >-
      'nosuid' not in (system_boot_efi_opts.stdout | default('')) or
      'noexec' not in (system_boot_efi_opts.stdout | default(''))
  failed_when: false

- name: Warn if /boot/efi remount failed
  ansible.builtin.debug:
    msg: "WARNING: remount of /boot/efi failed (rc={{ _boot_efi_remount_result.rc }}); live nosuid/noexec may not be active"
  when:
    - _boot_efi_remount_result.rc | default(0) != 0

- name: Deploy boot-efi-harden.service (CSB — fstab not modified)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # On CSB, /etc/fstab is IT-managed. This one-shot service remounts
      # /boot/efi with nosuid,noexec at every boot.
      [Unit]
      Description=Harden /boot/efi mount options
      DefaultDependencies=no
      After=local-fs.target
      Before=sysinit.target

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/mount -o remount,nosuid,noexec /boot/efi
      RemainAfterExit=yes

      [Install]
      WantedBy=sysinit.target
    dest: /etc/systemd/system/boot-efi-harden.service
    mode: "0644"
    owner: root
    group: root
  when:
    - system_boot_efi_mountpoint.rc == 0
    - csb_rhel

- name: Enable boot-efi-harden.service (CSB)
  ansible.builtin.systemd:
    name: boot-efi-harden.service
    enabled: true
    daemon_reload: true
  when:
    - system_boot_efi_mountpoint.rc == 0
    - csb_rhel
  # ignore_errors (not failed_when: false): RHEL CSB IT policy may reject custom unit enables;
  # failed_when: false would set .failed=False and silently suppress the downstream warning.
  ignore_errors: true
  register: system_boot_efi_harden_enable

- name: Warn if boot-efi-harden.service could not be enabled (CSB)
  ansible.builtin.debug:
    msg: >-
      boot-efi-harden.service could not be enabled (systemd policy restriction or
      daemon-reload failure). /boot/efi hardening will NOT persist across reboots.
  when:
    - system_boot_efi_mountpoint.rc == 0
    - csb_rhel
    - system_boot_efi_harden_enable.failed | default(false)

# --- Harden /var/tmp via bind-mount to /tmp (CIS 1.1.8) ---
# A complete unit file is required — /var/tmp has no base unit on Fedora
# so a drop-in directory would be silently ignored.
- name: Deploy var-tmp.mount unit (bind /var/tmp to /tmp)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # /var/tmp bind-mounted to /tmp so it inherits noexec,nosuid,nodev.
      [Unit]
      Description=Bind mount /var/tmp to /tmp
      After=tmp.mount
      Requires=tmp.mount

      [Mount]
      What=/tmp
      Where=/var/tmp
      Type=none
      Options=bind,noexec,nosuid,nodev

      [Install]
      WantedBy=local-fs.target
    dest: /etc/systemd/system/var-tmp.mount
    mode: "0644"
  when:
    - system_var_tmp_noexec | bool
    - not csb_rhel

- name: Enable and start var-tmp.mount
  when:
    - system_var_tmp_noexec | bool
    - not csb_rhel
  block:
    - name: Enable and start var-tmp.mount
      ansible.builtin.systemd:
        name: var-tmp.mount
        enabled: true
        state: started
        daemon_reload: true
  rescue:
    - name: Warn that /var/tmp is not hardened
      ansible.builtin.debug:
        msg: >-
          WARNING: var-tmp.mount could not be enabled or started. /var/tmp is NOT
          hardened — world-writable space can execute code. Check: systemctl status
          var-tmp.mount; journalctl -u var-tmp.mount.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.

- name: Check if var-tmp.mount unit file exists
  ansible.builtin.stat:
    path: /etc/systemd/system/var-tmp.mount
  register: system_var_tmp_unit_stat
  when: not (system_var_tmp_noexec | bool)

- name: Remove var-tmp.mount when system_var_tmp_noexec disabled
  when:
    - not (system_var_tmp_noexec | bool)
    - system_var_tmp_unit_stat.stat.exists
  block:
    - name: Stop and disable var-tmp.mount
      ansible.builtin.systemd:
        name: var-tmp.mount
        state: stopped
        enabled: false
        daemon_reload: true
      failed_when: false

    - name: Remove var-tmp.mount unit file
      ansible.builtin.file:
        path: /etc/systemd/system/var-tmp.mount
        state: absent
      register: system_var_tmp_unit_removal

    - name: Reload systemd after removing var-tmp.mount  # noqa: no-handler
      ansible.builtin.systemd:
        daemon_reload: true
      when: system_var_tmp_unit_removal.changed

# --- Kernel module blacklist ---
- name: Deploy kernel module blacklist
  ansible.builtin.template:
    src: modprobe-hardening.conf.j2
    dest: /etc/modprobe.d/hardening.conf
    mode: "0644"

# --- Sysctl hardening ---
# Merge system_sysrq into the dict so config.yml can override without replacing
# the entire system_sysctl_hardening dict. Default is 0 (CIS); set 176 in
# config.yml for sync(16)+remount-ro(32)+reboot(128) on a kernel dev workstation.
- name: Merge configurable sysctl values into hardening dict
  ansible.builtin.set_fact:
    system_sysctl_hardening: "{{ system_sysctl_hardening | combine({
        'kernel.sysrq': system_sysrq | int,
        'net.ipv6.conf.all.accept_ra': system_ipv6_accept_ra | int,
        'net.ipv6.conf.default.accept_ra': system_ipv6_accept_ra | int,
        'net.core.bpf_jit_harden': system_bpf_jit_harden | int,
        'kernel.unprivileged_bpf_disabled': system_unprivileged_bpf_disabled | int,
        'kernel.panic': system_kernel_panic | int,
        'kernel.panic_on_oops': system_kernel_panic_on_oops | int,
        'kernel.core_pattern': system_core_pattern,
        'kernel.yama.ptrace_scope': system_ptrace_scope | int,
        'kernel.kexec_load_disabled': system_kexec_load_disabled | int,
        'kernel.io_uring_disabled': system_io_uring_disabled | int
      }) | combine(system_sysctl_extra) }}" # noqa: jinja[spacing]

# CIS 3.3.9 sets tcp_timestamps=0 to prevent OS fingerprinting and uptime disclosure.
# On CSB, Red Hat IT network diagnostics rely on TCP timestamps for RTT measurement
# (tcpdump analysis, network quality monitoring, PAWS). Restore to the kernel default
# (1) so IT tooling is not silently broken. The fingerprinting risk is accepted: CSB
# hosts are on a managed corporate network where uptime disclosure is low-risk, and
# disabling timestamps has measurable latency/throughput impact on high-BDP links.
- name: Deploy sysctl hardening config
  ansible.builtin.template:
    src: sysctl-hardening.conf.j2
    dest: /etc/sysctl.d/90-hardening.conf
    mode: "0644"

- name: Apply sysctl hardening values immediately  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: sysctl --system
  become: true
  changed_when: false
  failed_when: false  # bridge/conntrack keys absent if br_netfilter/nf_conntrack not yet loaded

# --- Firewall (drop zone) ---
- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true
  failed_when: false

- name: Re-gather service facts after firewalld start
  ansible.builtin.service_facts:

- name: Set firewalld running fact
  ansible.builtin.set_fact:
    system_firewalld_running: >-
      {{ ansible_facts.services['firewalld.service'] is defined and
         ansible_facts.services['firewalld.service'].state == 'running' }}

- name: Warn that firewalld is not running — all firewall hardening tasks will be skipped
  ansible.builtin.debug:
    msg: >-
      WARNING: firewalld is not running. All firewall hardening tasks (drop zone,
      port 722, ICMP rules, tailscale0, libvirt zone) will be skipped. Install
      and start firewalld before re-running if firewall management is required.
  when: not (system_firewalld_running | bool)

- name: Check current default firewall zone
  ansible.posix.firewalld_info:
  register: system_firewall_info
  failed_when: false
  when: system_firewalld_running | bool

- name: Set default firewall zone to drop
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: firewall-cmd --set-default-zone=drop
  changed_when: true
  when:
    - system_firewalld_running | bool
    - system_firewall_info.firewalld_info.default_zone | default('') != 'drop'
    - system_firewall_manage_zone | bool  # CSB IT manages zone policy; drop zone breaks VPN/management
  notify:
    - Apply firewall rules

- name: Move all physical network interfaces to drop zone
  ansible.posix.firewalld:
    zone: drop
    interface: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ ansible_facts['interfaces'] | reject('match', '^(lo|tailscale\\d*|virbr.*|podman.*|br-.*|veth.*|docker.*)$') | list }}"
  when:
    - system_firewalld_running | bool
    - system_firewall_manage_zone | bool  # paired with zone guard above
  failed_when: false

- name: Remove default services from public zone
  ansible.posix.firewalld:
    zone: public
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: disabled
  loop:
    - ssh
    - dhcpv6-client
    - mdns
    - cockpit
  when:
    - system_firewalld_running | bool
    - system_firewall_manage_zone | bool
  failed_when: false

- name: Remove default services from FedoraWorkstation zone
  ansible.posix.firewalld:
    zone: FedoraWorkstation
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: disabled
  loop:
    - ssh
    - dhcpv6-client
    - mdns
    - samba-client
  when:
    - system_firewalld_running | bool
    - system_firewall_manage_zone | bool
  failed_when: false

- name: Enable ICMP block inversion on drop zone
  ansible.posix.firewalld:
    zone: drop
    icmp_block_inversion: true
    permanent: true
    state: enabled
  when:
    - system_firewalld_running | bool
    - system_firewall_manage_zone | bool
  notify: Apply firewall rules

# NOTE: With icmp-block-inversion enabled, adding icmp-block ALLOWS these types
# (semantics are inverted). Without inversion, this command would block them.
- name: Allow essential ICMP types through drop zone
  ansible.posix.firewalld:
    zone: drop
    icmp_block: "{{ item }}"
    permanent: true
    state: enabled
  loop: "{{ system_firewall_icmp_types }}"
  when:
    - system_firewalld_running | bool
    - system_firewall_manage_zone | bool  # drop zone has no interface on CSB — rule is a no-op
  notify: Apply firewall rules

- name: Allow ICMPv6 router-advertisement through drop zone (SLAAC enabled)
  ansible.posix.firewalld:
    zone: drop
    icmp_block: router-advertisement
    permanent: true
    state: enabled
  when:
    - system_firewalld_running | bool
    - system_firewall_manage_zone | bool
    - system_ipv6_accept_ra | int >= 2
  notify: Apply firewall rules

# On CSB, IT manages firewall zones — the primary interface is not in the drop zone,
# so adding 722/tcp to the drop zone would create a dead rule. Skip on CSB; the
# Fedora hybrid case (csb_detected + Fedora) opens port 722 in the redhat zone (system_firewall_csb_zone)
# via a separate task below; for RHEL CSB, IT's zone policy governs reachability.
- name: Open SSH port in firewall
  ansible.posix.firewalld:
    port: "{{ ssh_port }}/tcp"
    zone: drop
    permanent: true
    immediate: true
    state: enabled
  when:
    - system_firewalld_running | bool
    - system_firewall_manage_zone | bool
  notify: Apply firewall rules

# Fallback for RHEL CSB machines where IT manages firewall zone policy
# (system_firewall_manage_zone=false) and the primary interface stays in whatever
# the default zone is. On Fedora hybrid, system_firewall_manage_zone=true so the
# drop zone tasks already handle port 722 and this task is skipped. The guard on
# not(system_firewall_manage_zone) is the primary discriminator; the default-zone
# guard prevents a redundant rule if the default zone is already drop.
- name: Open SSH port in default firewall zone (fallback — zone management disabled in config)
  ansible.posix.firewalld:
    port: "{{ ssh_port }}/tcp"
    zone: "{{ system_firewall_info.firewalld_info.default_zone | default('FedoraWorkstation') }}"
    permanent: true
    immediate: true
    state: enabled
  when:
    - system_firewalld_running | bool
    - csb_detected
    - not (system_firewall_manage_zone | bool)
    - system_firewall_info.firewalld_info.default_zone | default('') not in ['drop', '']
  failed_when: false
  notify: Apply firewall rules

- name: Open SSH port in redhat firewall zone (CSB Fedora — VPN tun0 uses this zone)
  ansible.posix.firewalld:
    port: "{{ ssh_port }}/tcp"
    zone: "{{ system_firewall_csb_zone }}"
    permanent: true
    immediate: true
    state: enabled
  when:
    - system_firewalld_running | bool
    - csb_detected
    - ansible_facts['distribution'] == 'Fedora'
  failed_when: false
  notify: Apply firewall rules

- name: Remove legacy ssh service (port 22) from redhat firewall zone (sshd moved to {{ ssh_port }})
  ansible.posix.firewalld:
    zone: "{{ system_firewall_csb_zone }}"
    service: ssh
    permanent: true
    immediate: true
    state: disabled
  when:
    - system_firewalld_running | bool
    - csb_detected
    - ansible_facts['distribution'] == 'Fedora'
    - ssh_port | int != 22
  failed_when: false
  notify: Apply firewall rules

# --- Kernel lockdown ---
- name: Check current kernel cmdline
  ansible.builtin.command:
    cmd: grubby --info=DEFAULT
  register: system_grubby_info
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode to enable kernel-cmdline task conditionals

# On RHEL CSB, IT manages the boot configuration — grubby --update-kernel=ALL and
# /etc/kernel/cmdline edits are skipped. Fedora hybrid CSB runs its own kernel — lockdown applies.
- name: Skip grubby kernel param tasks on CSB (IT manages boot config)
  ansible.builtin.debug:
    verbosity: 1
    msg: "RHEL CSB detected — skipping grubby/kernel-cmdline hardening (IT manages RHEL boot config)"
  when: csb_rhel

- name: Kernel cmdline hardening block (skipped on RHEL CSB)
  when: not csb_rhel
  block:
    - name: Remove stale kernel lockdown parameter before mode change
      ansible.builtin.command:
        cmd: grubby --remove-args="lockdown" --update-kernel=ALL
      when:
        - system_kernel_lockdown | length > 0
        - system_grubby_info.rc == 0
        - "'lockdown=' in (system_grubby_info.stdout)"
        - "('lockdown=' ~ system_kernel_lockdown) not in (system_grubby_info.stdout)"
      changed_when: true
      failed_when: false

    - name: Enable kernel lockdown (integrity mode)
      ansible.builtin.command:
        cmd: "grubby --args='lockdown={{ system_kernel_lockdown }}' --update-kernel=ALL"
      register: system_lockdown_result
      when:
        - system_kernel_lockdown | length > 0
        - system_grubby_info.rc == 0
        - "('lockdown=' ~ system_kernel_lockdown) not in (system_grubby_info.stdout)"
      changed_when: system_lockdown_result.rc == 0
      failed_when: false

    - name: Remove kernel lockdown grub parameter (lockdown disabled)
      ansible.builtin.command:
        cmd: grubby --remove-args="lockdown" --update-kernel=ALL
      register: system_lockdown_remove_result
      when:
        - system_kernel_lockdown | length == 0
        - system_grubby_info.rc == 0
        - "'lockdown=' in (system_grubby_info.stdout)"
      changed_when: system_lockdown_remove_result.rc == 0
      failed_when: false

    - name: Enable IOMMU for DMA protection (AMD)
      ansible.builtin.command:
        cmd: grubby --args="amd_iommu=on" --update-kernel=ALL
      register: system_iommu_amd_result
      when:
        - system_grubby_info.rc == 0
        - "'amd_iommu=on' not in (system_grubby_info.stdout)"
        - ansible_facts['processor'] | join(' ') | lower is search('amd')
      changed_when: system_iommu_amd_result.rc == 0
      failed_when: false

    - name: Enable IOMMU for DMA protection (Intel)
      ansible.builtin.command:
        cmd: grubby --args="intel_iommu=on" --update-kernel=ALL
      register: system_iommu_intel_result
      when:
        - system_grubby_info.rc == 0
        - "'intel_iommu=on' not in (system_grubby_info.stdout)"
        - ansible_facts['processor'] | join(' ') | lower is search('intel')
      changed_when: system_iommu_intel_result.rc == 0
      failed_when: false

    - name: Enable iommu=pt passthrough mode for VFIO/libvirt PCI passthrough
      ansible.builtin.command:
        cmd: grubby --args="iommu=pt" --update-kernel=ALL
      register: system_iommu_pt_result
      # iommu=pt switches the IOMMU from Translated (full DMA isolation per device) to
      # Passthrough mode, bypassing DMA remapping for devices not assigned to a VM.
      # This improves performance for VFIO PCI passthrough but degrades DMA protection
      # for all other devices. Leave false unless actively using PCI passthrough to VMs.
      when:
        - system_iommu_passthrough | bool
        - system_grubby_info.rc == 0
        - "'iommu=pt' not in (system_grubby_info.stdout)"
        - (ansible_facts['processor'] | join(' ') | lower is search('amd')) or
          (ansible_facts['processor'] | join(' ') | lower is search('intel'))
      changed_when: system_iommu_pt_result.rc == 0
      failed_when: false

    - name: Remove iommu=pt grub parameter (system_iommu_passthrough false)
      ansible.builtin.command:
        cmd: grubby --remove-args="iommu=pt" --update-kernel=ALL
      register: system_iommu_pt_remove_result
      when:
        - not (system_iommu_passthrough | bool)
        - system_grubby_info.rc == 0
        - "'iommu=pt' in (system_grubby_info.stdout)"
      changed_when: system_iommu_pt_remove_result.rc == 0
      failed_when: false

    - name: Disable legacy vsyscall page (exploit gadget source)
      ansible.builtin.command:
        cmd: grubby --args="vsyscall=none" --update-kernel=ALL
      register: system_vsyscall_result
      when:
        - system_grubby_info.rc == 0
        - "'vsyscall=none' not in (system_grubby_info.stdout)"
      changed_when: system_vsyscall_result.rc == 0
      failed_when: false

    - name: Zero-fill freed memory pages (init_on_free — not a Fedora default)
      ansible.builtin.command:
        cmd: grubby --args="init_on_free=1" --update-kernel=ALL
      register: system_init_on_free_result
      when:
        - system_grubby_info.rc == 0
        - "'init_on_free=1' not in (system_grubby_info.stdout)"
        - system_init_on_free | bool
      changed_when: system_init_on_free_result.rc == 0
      failed_when: false

    - name: Remove init_on_free grub parameter (system_init_on_free false — removes performance/security tradeoff param)
      ansible.builtin.command:
        cmd: grubby --remove-args="init_on_free" --update-kernel=ALL
      register: system_init_on_free_remove_result
      when:
        - system_grubby_info.rc == 0
        - "'init_on_free=1' in (system_grubby_info.stdout)"
        - not (system_init_on_free | bool)
      changed_when: system_init_on_free_remove_result.rc == 0
      failed_when: false

    - name: Randomize page allocator free-list order (heap-spray defense)
      ansible.builtin.command:
        cmd: grubby --args="page_alloc.shuffle=1" --update-kernel=ALL
      register: system_page_shuffle_result
      when:
        - system_grubby_info.rc == 0
        - "'page_alloc.shuffle=1' not in (system_grubby_info.stdout)"
      changed_when: system_page_shuffle_result.rc == 0
      failed_when: false

    - name: Remove rd.luks.key grub parameter (leaks LUKS UUID; dracut falls back to passphrase)
      ansible.builtin.command:
        cmd: grubby --remove-args="rd.luks.key" --update-kernel=ALL
      register: system_luks_key_cleanup
      when:
        - system_grubby_info.rc == 0
        - "'rd.luks.key' in (system_grubby_info.stdout)"
        - system_remove_luks_key | bool
      changed_when: system_luks_key_cleanup.rc == 0
      failed_when: false
      # WARNING: set system_remove_luks_key: true in config.yml only if this machine does NOT
      # use a LUKS keyfile for auto-unlock at boot. Removing rd.luks.key from the cmdline means
      # LUKS will require manual passphrase entry on every reboot. Default: false (preserve keyfile auth).

    - name: Remove rd.luks.key from /etc/default/grub (prevents grub2-mkconfig re-introducing it)
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '\s*rd\.luks\.key=\S+'
        replace: ''
      when:
        - system_grubby_info.rc == 0
        - system_remove_luks_key | bool
      failed_when: false

    # Merge security hardening params into /etc/kernel/cmdline so new kernel installs
    # via 'dnf update kernel' include them automatically. Uses append-only logic to
    # PRESERVE existing essential boot params (root=UUID, rd.luks.uuid, rootflags, etc.)
    # that would be lost if the file were replaced with only the hardening params.
    - name: Merge security hardening params into /etc/kernel/cmdline  # noqa: command-instead-of-module
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          # Seed from existing file; fall back to current cmdline (strip BOOT_IMAGE= entry)
          if [[ -f /etc/kernel/cmdline ]]; then
            current=$(cat /etc/kernel/cmdline)
          else
            current=$(sed 's|BOOT_IMAGE=[^ ]* ||g' /proc/cmdline)
          fi
          {% if system_remove_luks_key | bool %}
          current=$(echo "$current" | sed 's| *rd\.luks\.key=[^ ]*||g')
          {% endif %}
          {% if system_kernel_lockdown | length == 0 %}
          current=$(echo "$current" | sed 's| *lockdown=[^ ]*||g')
          {% endif %}
          {% if not (system_init_on_free | bool) %}
          current=$(echo "$current" | sed 's| *init_on_free=1||g')
          {% endif %}
          {% if not (system_iommu_passthrough | bool) %}
          current=$(echo "$current" | sed 's| *iommu=pt||g')
          {% endif %}
          {% if system_kernel_lockdown | length > 0 %}
          current=$(echo "$current" | sed 's| *lockdown=[^ ]*||g')
          {% endif %}
          new="$current"
          # Append each missing hardening param (check by key prefix only)
          _add() {local p="$1" k="${1%%=*}" ke; ke="${k//./\\.}"; echo "$new" | grep -qE "(^| )${ke}(=| |$)" || new="$new $p";}
          {{ '_add "lockdown=' ~ system_kernel_lockdown ~ '"' if system_kernel_lockdown | length > 0 else '' }}
          _add "vsyscall=none"
          {{ '_add "init_on_free=1"' if system_init_on_free | bool else '' }}
          _add "page_alloc.shuffle=1"
          {% set is_amd = ansible_facts['processor'] | join(' ') | lower is search('amd') %}
          {% set is_intel = ansible_facts['processor'] | join(' ') | lower is search('intel') %}
          {{ '_add "amd_iommu=on"' if is_amd else '' }}
          {{ '_add "iommu=pt"' if system_iommu_passthrough | bool and (is_amd or is_intel) else '' }}
          {{ '_add "intel_iommu=on"' if is_intel else '' }}
          new=$(echo "$new" | tr -s ' ' | sed 's/^ //;s/ $//')
          if [[ "$new" != "$current" ]]; then
            echo "$new" > /etc/kernel/cmdline
            echo changed
          fi
        executable: /bin/bash
      register: system_kernel_cmdline_result
      changed_when: "'changed' in (system_kernel_cmdline_result.stdout | default(''))"
      when:
        - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
      become: true
      failed_when: false

    - name: Log grubby stderr for any non-zero return code
      ansible.builtin.debug:
        msg: "grubby failed ({{ item.key }}): rc={{ item.value.rc }} stderr={{ item.value.stderr | default('') }}"
      loop: "{{ _grubby_results | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value.rc | default(0) | int != 0
      vars:
        _grubby_results:
          lockdown: "{{ system_lockdown_result | default({}) }}"
          lockdown_remove: "{{ system_lockdown_remove_result | default({}) }}"
          iommu_amd: "{{ system_iommu_amd_result | default({}) }}"
          iommu_intel: "{{ system_iommu_intel_result | default({}) }}"
          iommu_pt: "{{ system_iommu_pt_result | default({}) }}"
          iommu_pt_remove: "{{ system_iommu_pt_remove_result | default({}) }}"
          vsyscall: "{{ system_vsyscall_result | default({}) }}"
          init_on_free: "{{ system_init_on_free_result | default({}) }}"
          init_on_free_remove: "{{ system_init_on_free_remove_result | default({}) }}"
          page_shuffle: "{{ system_page_shuffle_result | default({}) }}"
          luks_key_cleanup: "{{ system_luks_key_cleanup | default({}) }}"
          kernel_cmdline: "{{ system_kernel_cmdline_result | default({}) }}"


- name: Notify that reboot is required for kernel parameters
  ansible.builtin.debug:
    msg: "REBOOT REQUIRED: kernel params changed (lockdown/iommu/vsyscall/init_on_free/shuffle/luks-key). Reboot."
  when: >-
    system_lockdown_result is changed or
    system_lockdown_remove_result is changed or
    system_iommu_amd_result is changed or
    system_iommu_intel_result is changed or
    system_iommu_pt_result is changed or
    system_iommu_pt_remove_result is changed or
    system_vsyscall_result is changed or
    system_init_on_free_result is changed or
    system_init_on_free_remove_result is changed or
    system_page_shuffle_result is changed or
    system_luks_key_cleanup is changed or
    system_kernel_cmdline_result is changed

# --- Core dumps ---
- name: Ensure coredump config directory
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    mode: "0755"

- name: Remove legacy coredump disable.conf drop-in (renamed in cycle 2)
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d/disable.conf
    state: absent

- name: Configure coredump storage
  ansible.builtin.template:
    src: coredump.conf.j2
    dest: /etc/systemd/coredump.conf.d/coredump.conf
    mode: "0644"

# --- Auditd ---
- name: Install audit package
  ansible.builtin.dnf:
    name: audit
    state: present
  when: ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
  register: _audit_pkg_install
  failed_when: false

- name: Warn if audit package install failed
  ansible.builtin.debug:
    msg: >-
      WARNING: audit package install failed (rc={{ _audit_pkg_install.rc | default('n/a') }});
      auditd rules and configuration deployment may also fail on this host
  when:
    - _audit_pkg_install.rc | default(0) != 0

- name: Install auditd package (Debian/Ubuntu)
  ansible.builtin.apt:
    name: auditd
    state: present
  when: ansible_facts['pkg_mgr'] == 'apt'

- name: Assert real_user_home is a valid absolute path before deploying auditd rules
  ansible.builtin.assert:
    that:
      - real_user_home is regex('^/[a-zA-Z0-9_/.-]{1,254}$')
      - real_user_home != '/'
    fail_msg: >-
      real_user_home='{{ real_user_home }}' is not a valid absolute path.
      A newline or special character in HOME would inject arbitrary directives into
      the auditd rules file. Ensure HOME is set correctly before running.
  when: not csb_rhel

- name: Deploy auditd rules
  ansible.builtin.template:
    src: auditd-claude.rules.j2
    dest: /etc/audit/rules.d/claude-code.rules
    mode: "0640"
  notify: Restart auditd
  when:
    - not csb_rhel  # no SIEM at home

- name: Deploy auditd main configuration (CIS 4.1.2.x disk-space settings)
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0640"
  notify: Restart auditd
  when:
    - not csb_rhel  # no audisp-remote at home

- name: Ensure auditd is enabled and started
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started
  become: true
  when:
    - not csb_rhel
    - ansible_facts['virtualization_type'] not in ['container', 'docker', 'podman']

# --- Bolt (Thunderbolt device authorization daemon) ---
- name: Install bolt for Thunderbolt device authorization
  ansible.builtin.dnf:
    name: bolt
    state: present
  when: ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
  failed_when: false

- name: Start bolt service (D-Bus activated, no [Install] section — cannot be enabled)
  ansible.builtin.systemd:
    name: bolt
    state: started
  when: ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
  failed_when: false

# --- Authselect profile baseline ---
# authselect enable-feature requires the 'sssd' profile to be active; 'minimal' and
# 'local' (used by some Vagrant boxes and minimal installs) don't have with-faillock
# or with-pwhistory feature snippets and silently fail. Also required for Anaconda-
# installed systems where PAM files may have been edited outside authselect (dirty state).
- name: Check authselect binary exists
  ansible.builtin.stat:
    path: /usr/bin/authselect
  register: system_authselect_bin

- name: Check current authselect profile
  ansible.builtin.command:
    cmd: authselect current --raw
  register: system_authselect_current
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - system_authselect_bin.stat.exists
    - not csb_rhel

- name: Select authselect sssd profile and clear PAM drift
  ansible.builtin.command:
    cmd: authselect select sssd --force
  register: system_authselect_select_result
  when:
    - system_authselect_bin.stat.exists
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']  # authselect is RHEL/Fedora only; avoids spurious changed=1 on Debian
    - system_authselect_current.stdout | default('') is not search('^sssd\b')
    - not csb_rhel
  changed_when: true
  failed_when: false

- name: Warn if authselect sssd profile selection failed
  ansible.builtin.debug:
    msg: >-
      WARNING: authselect select sssd --force returned non-zero (rc={{ system_authselect_select_result.rc }}).
      enable-feature with-faillock and with-pwhistory may not activate — PAM lockout and
      password reuse prevention will be unconfigured. Check authselect status manually.
  when:
    - system_authselect_select_result.rc | default(0) != 0

# --- Fingerprint auth (bypasses pam_faillock; disable unless fingerprint reader is desired) ---
- name: Probe authselect with-fingerprint feature state
  ansible.builtin.command:
    cmd: authselect is-feature-enabled with-fingerprint
  register: system_authselect_fingerprint_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when: system_authselect_bin.stat.exists

- name: Disable authselect with-fingerprint feature
  ansible.builtin.command:
    cmd: authselect disable-feature with-fingerprint
  when:
    - system_disable_fingerprint | bool
    - system_authselect_bin.stat.exists
    - system_authselect_fingerprint_check.rc == 0
    - not csb_rhel  # CSB: IT manages authselect profile; all other authselect action tasks carry this guard
  changed_when: true
  failed_when: false

- name: Mask fprintd.service (PAM fingerprint disabled; prevent D-Bus activation)
  ansible.builtin.systemd:
    name: fprintd.service
    masked: true
    state: stopped
  when:
    - system_disable_fingerprint | bool
    - not csb_rhel  # CSB: IT manages fprintd/fingerprint auth via authselect
  failed_when: false

- name: Unmask fprintd.service (fingerprint auth enabled)
  ansible.builtin.systemd:
    name: fprintd.service
    masked: false
  when:
    - not (system_disable_fingerprint | bool)
    - not csb_rhel  # CSB: IT manages fprintd/fingerprint auth
  failed_when: false

- name: Enable authselect with-fingerprint feature
  ansible.builtin.command:
    cmd: authselect enable-feature with-fingerprint
  when:
    - not (system_disable_fingerprint | bool)
    - system_authselect_bin.stat.exists
    - system_authselect_fingerprint_check.rc != 0
    - not csb_rhel  # CSB: IT manages authselect; all authselect action tasks carry this guard
  changed_when: true
  failed_when: false

# --- Mask bluetooth (default: enabled; set system_disable_bluetooth: true in config.yml to disable) ---
- name: Mask bluetooth service
  ansible.builtin.systemd:
    name: bluetooth.service
    masked: true
    state: stopped
  when:
    - system_disable_bluetooth | bool
    - not csb_rhel  # CSB: IT manages bluetooth hardware policy
  failed_when: false

- name: Unmask bluetooth service when system_disable_bluetooth disabled
  ansible.builtin.systemd:
    name: bluetooth.service
    masked: false
    enabled: true
    state: started
  when:
    - not (system_disable_bluetooth | bool)
    - not csb_rhel  # CSB: IT manages bluetooth hardware policy
  failed_when: false

- name: Set BlueZ Privacy=device in /etc/bluetooth/main.conf
  ansible.builtin.lineinfile:
    path: /etc/bluetooth/main.conf
    regexp: '^#?Privacy\s*='
    line: 'Privacy = {{ system_bluetooth_privacy }}'
    insertafter: '^\[General\]'
    create: false
  when:
    - not (system_disable_bluetooth | bool)
    - not csb_rhel
  failed_when: false
  notify: Restart bluetooth

# --- Mask thermald (Intel-only; exits immediately on AMD hardware) ---
- name: Mask thermald on non-Intel hardware
  ansible.builtin.systemd:
    name: thermald
    masked: true
    state: stopped
  when: "'Intel' not in (ansible_facts['processor'] | join(' '))"
  failed_when: false

- name: Unmask thermald on Intel hardware
  ansible.builtin.systemd:
    name: thermald
    masked: false
  when: "'Intel' in (ansible_facts['processor'] | join(' '))"
  failed_when: false

# --- Mask ModemManager (no WWAN hardware — AMD ThinkPad has no cellular modem) ---
- name: Mask ModemManager (no WWAN interface detected)
  ansible.builtin.systemd:
    name: ModemManager.service
    masked: true
    state: stopped
  when:
    - ansible_facts['interfaces'] | select('match', '^wwan') | list | length == 0
  failed_when: false

- name: Unmask ModemManager (WWAN interface detected)
  ansible.builtin.systemd:
    name: ModemManager.service
    masked: false
  when:
    - ansible_facts['interfaces'] | select('match', '^wwan') | list | length > 0
  failed_when: false

# --- TLP battery charge management (ThinkPad) ---
- name: Install TLP for ThinkPad battery charge thresholds
  ansible.builtin.dnf:
    name:
      - tlp
      - tlp-rdw
    state: present
  when:
    - system_tlp_enabled | bool
    - not csb_rhel  # RHEL CSB: IT manages power daemons; do not override
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
  failed_when: false

- name: Mask power management daemons that conflict with TLP
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
    state: stopped
  loop:
    - power-profiles-daemon
    - tuned-ppd
  when:
    - system_tlp_enabled | bool
    - not csb_rhel  # RHEL CSB: IT manages power-profiles-daemon and tuned-ppd
  failed_when: false

- name: Unmask power management daemons when TLP disabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: false
    enabled: true
    state: started
  loop:
    - power-profiles-daemon
    - tuned-ppd
  when: not (system_tlp_enabled | bool) or csb_rhel
  failed_when: false

- name: Deploy TLP ThinkPad charge threshold config
  ansible.builtin.template:
    src: tlp-thinkpad.conf.j2
    dest: /etc/tlp.d/50-thinkpad.conf
    mode: "0644"
  when:
    - system_tlp_enabled | bool
    - not csb_rhel
  failed_when: false
  notify: Restart tlp

- name: Enable and start TLP service
  ansible.builtin.systemd:
    name: tlp
    state: started
    enabled: true
  when:
    - system_tlp_enabled | bool
    - not csb_rhel
  failed_when: false

# --- Mask cups-browsed (RCE entry point: CVE-2024-47176); disable/mask cups ---
# cups-browsed is masked (not just disabled) because it's an active RCE target.
# cups.service is disabled/stopped but NOT masked — Flatpak print dialogs rely on
# cups.socket for activation, and masking cups.service while leaving cups.socket
# enabled creates a broken half-masked state (socket accepts, activation fails).
# When system_disable_printing is true (default), cups.socket and cups.path are also
# masked so socket activation cannot start the CUPS daemon regardless of cups.service
# state. Set system_disable_printing: false in config.yml if printing is required.
- name: Mask cups-browsed (RCE entry point)
  ansible.builtin.systemd:
    name: cups-browsed
    masked: true
    state: stopped
  failed_when: false

- name: Configure cups.service (disable when system_disable_printing)
  ansible.builtin.systemd:
    name: cups
    state: "{{ 'stopped' if system_disable_printing else 'started' }}"
    enabled: "{{ not (system_disable_printing | bool) }}"
  failed_when: false

- name: Configure cups.socket and cups.path masking
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: "{{ system_disable_printing | bool }}"
    state: "{{ 'stopped' if system_disable_printing else 'started' }}"
    enabled: "{{ not (system_disable_printing | bool) }}"
  loop:
    - cups.socket
    - cups.path
  failed_when: false

# --- Mask avahi-daemon (mDNS hostname exposure on local network) ---
- name: Configure avahi-daemon masking (mask when system_disable_avahi)
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: "{{ system_disable_avahi | bool }}"
    state: "{{ 'stopped' if system_disable_avahi else 'started' }}"
    enabled: "{{ not (system_disable_avahi | bool) }}"
  loop:
    - avahi-daemon.service
    - avahi-daemon.socket
  failed_when: false

# --- Mask NFS server and rpcbind (CIS 2.2.7 — no NFS server needed on a workstation) ---
# Note: NFS stays stopped/disabled even when unmasked — workstations never serve NFS.
- name: Configure NFS server and rpcbind masking (CIS 2.2.7)
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: "{{ system_mask_nfs_server | bool }}"
    enabled: false
    state: stopped
  loop:
    - nfs-server.service
    - rpcbind.service
    - rpcbind.socket
  failed_when: false

# --- Cockpit (web console — port 9090; disabled by default) ---
- name: Configure cockpit masking (mask when not system_enable_cockpit)
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: "{{ not (system_enable_cockpit | bool) }}"
    state: "{{ 'started' if system_enable_cockpit else 'stopped' }}"
    enabled: "{{ system_enable_cockpit | bool }}"
  loop:
    - cockpit.service
    - cockpit.socket
  failed_when: false

# --- Logind lid close ---
# Write to a drop-in so package upgrades can't clobber the settings.
- name: Ensure logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    mode: "0755"

- name: Configure lid close behavior
  community.general.ini_file:
    path: /etc/systemd/logind.conf.d/99-hardening.conf
    section: Login
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
    create: true
  loop:
    - key: HandleLidSwitch
      value: "{{ system_lid_switch }}"
    - key: HandleLidSwitchExternalPower
      value: "{{ system_lid_switch_external }}"
    - key: HandleLidSwitchDocked
      value: "{{ system_lid_switch_docked }}"
    - key: HandleHibernateKey
      value: ignore
    - key: HandlePowerKey
      value: lock
    - key: IdleAction
      value: lock
    - key: IdleActionSec
      value: "{{ system_logind_idle_sec }}"
    - key: KillUserProcesses
      value: "no"
  loop_control:
    label: "{{ item.key }}"
  notify: Reload logind

# --- Disable Ctrl+Alt+Delete reboot ---
- name: Mask Ctrl+Alt+Delete reboot target
  ansible.builtin.systemd:
    name: ctrl-alt-del.target
    masked: true
  failed_when: false

# --- Services ---
- name: Detect libvirt daemon architecture (modular vs monolithic)
  ansible.builtin.command: # noqa: command-instead-of-module
    cmd: systemctl cat virtqemud.socket
  register: system_virtqemud_check
  failed_when: false
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when: system_enable_libvirtd | bool

- name: Enable modular libvirt sockets (Fedora 35+)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - virtqemud.socket
    - virtnetworkd.socket
  when:
    - system_enable_libvirtd | bool
    - (system_virtqemud_check.rc | default(-1)) == 0
  failed_when: false

- name: Enable libvirtd (monolithic, pre-Fedora 35 fallback)
  ansible.builtin.systemd:
    name: libvirtd
    state: started
    enabled: true
  when:
    - system_enable_libvirtd | bool
    - (system_virtqemud_check.rc | default(-1)) != 0
  failed_when: false

- name: Detect bpfman.socket (may not be installed yet on first provision)
  ansible.builtin.command: # noqa: command-instead-of-module
    cmd: systemctl cat bpfman.socket
  register: system_bpfman_check
  failed_when: false
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - profile == 'work'
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']

- name: Enable bpfman.socket (no-op if bpfman not yet installed)
  ansible.builtin.systemd:
    name: bpfman.socket
    state: started
    enabled: true
  when:
    - profile == 'work'
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - (system_bpfman_check.rc | default(-1)) == 0
  failed_when: false

- name: Add user to libvirt and kvm groups
  ansible.builtin.user:
    name: "{{ real_user_id }}"
    groups: [libvirt, kvm]
    append: true
  when: system_enable_libvirtd | bool
  failed_when: false
  # libvirt/kvm groups are created by package install in Play 2 (packages role).
  # On first provision this task runs in Play 1 before the packages exist — usermod
  # fails with "group does not exist". failed_when: false prevents play abort;
  # the packages role re-runs this after installing libvirt, completing membership.

- name: Remove ssh from libvirt firewall zone (VMs must not reach host sshd)
  ansible.posix.firewalld:
    zone: libvirt
    service: ssh
    permanent: true
    immediate: true
    state: disabled
  register: _system_libvirt_ssh_remove
  when:
    - system_firewalld_running | bool
    - system_enable_libvirtd | bool
  failed_when: >-
    (_system_libvirt_ssh_remove.failed | default(false)) and
    'INVALID_ZONE' not in (_system_libvirt_ssh_remove.msg | default(''))
  # INVALID_ZONE (rc=112) is tolerated: the libvirt firewall zone is created by
  # the libvirt daemon on first start, which may not have run yet on first provision
  # before the packages role installs and starts libvirt. All other failures surface.
  notify: Apply firewall rules

- name: Install Mullvad VPN
  ansible.builtin.dnf:
    name: mullvad-vpn
    state: present
  when:
    - system_enable_mullvad | bool
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - ansible_facts['distribution'] == 'Fedora'
  failed_when: false

- name: Enable Mullvad VPN service
  ansible.builtin.systemd:
    name: mullvad-daemon
    state: started
    enabled: true
  when:
    - system_enable_mullvad | bool
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - ansible_facts['distribution'] == 'Fedora'
  failed_when: false

# --- USBGuard ---
- name: Configure USBGuard
  when:
    - system_install_usbguard | bool
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']  # usbguard-selinux is Fedora/RHEL-only
  block:
    - name: Install USBGuard
      ansible.builtin.dnf:
        name:
          - usbguard
          - usbguard-selinux
        state: present

    - name: Deploy USBGuard whitelist rules
      ansible.builtin.template:
        src: usbguard-rules.conf.j2
        dest: /etc/usbguard/rules.conf
        owner: root
        group: root
        mode: "0600"
      notify: Restart usbguard
      # No failed_when: false — a missing or corrupt rules.conf means USBGuard starts
      # with ImplicitPolicyTarget=block and an empty ruleset, blocking all USB devices
      # including the keyboard. Template failure must be a hard stop.

    - name: Verify USBGuard rules.conf is non-empty before enabling service
      ansible.builtin.stat:
        path: /etc/usbguard/rules.conf
      register: system_usbguard_rules_stat

    - name: Assert USBGuard rules.conf exists and is non-empty (keyboard safety check)
      ansible.builtin.assert:
        that:
          - system_usbguard_rules_stat.stat.exists | default(false)
          - system_usbguard_rules_stat.stat.size | default(0) > 0
        fail_msg: >-
          /etc/usbguard/rules.conf is missing or empty. Starting USBGuard now would block
          ALL USB devices including the keyboard. Fix the template and re-run before enabling.

    - name: Enforce ImplicitPolicyTarget=block in usbguard-daemon.conf
      ansible.builtin.lineinfile:
        path: /etc/usbguard/usbguard-daemon.conf
        regexp: '^ImplicitPolicyTarget='
        line: 'ImplicitPolicyTarget=block'
        state: present
      notify: Restart usbguard

    - name: Enforce AuditBackend=LinuxAudit in usbguard-daemon.conf
      ansible.builtin.lineinfile:
        path: /etc/usbguard/usbguard-daemon.conf
        regexp: '^AuditBackend='
        line: 'AuditBackend=LinuxAudit'
        state: present
      notify: Restart usbguard

    - name: Enforce IPCAllowedGroups=wheel in usbguard-daemon.conf
      ansible.builtin.lineinfile:
        path: /etc/usbguard/usbguard-daemon.conf
        regexp: '^IPCAllowedGroups='
        line: 'IPCAllowedGroups=wheel'
        state: present
      notify: Restart usbguard

    - name: Enable USBGuard service
      ansible.builtin.systemd:
        name: usbguard
        state: started
        enabled: true
        daemon_reload: true
      register: system_usbguard_enable_result
      failed_when:
        - system_usbguard_enable_result.failed
        - ansible_facts['virtualization_type'] not in ['container', 'docker', 'podman']

# --- Firmware updates (LVFS/fwupd) ---
- name: Install fwupd
  ansible.builtin.dnf:
    name: fwupd
    state: present
  register: system_fwupd_install_result
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - not csb_rhel  # CSB: IT manages firmware via Satellite/RHSM, not LVFS
  failed_when: false

- name: Enable fwupd-refresh.timer for automatic LVFS metadata updates
  ansible.builtin.systemd:
    name: fwupd-refresh.timer
    state: started
    enabled: true
  when: not csb_rhel  # CSB: IT manages firmware; LVFS timer not needed
  failed_when: false

- name: Refresh LVFS firmware metadata  # noqa: no-handler — one-shot refresh after install; handler would defer to play end
  ansible.builtin.command:
    cmd: fwupdmgr refresh
  when: system_fwupd_install_result is changed
  changed_when: false
  failed_when: false

- name: Mask passim (fwupd P2P caching dependency — unauthenticated HTTP on 0.0.0.0:27500)
  ansible.builtin.systemd:
    name: passim
    masked: true
    state: stopped
    daemon_reload: true
  when: not csb_rhel  # passim is only installed alongside fwupd; skip if fwupd was not installed
  failed_when: false
  # passim is an implicit fwupd dependency that opens port 27500 on all interfaces.
  # tailscale0 is in the 'trusted' firewall zone so any Tailscale peer can reach it.
  # Masking does not affect fwupd firmware update functionality.

- name: Check for firmware updates
  ansible.builtin.command:
    cmd: fwupdmgr get-updates --no-device-prompt
  register: system_fwupd_check_result
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Report available firmware updates
  ansible.builtin.debug:
    msg: "Firmware updates available: {{ system_fwupd_check_result.stdout | default('') | trim }}\nRun: sudo fwupdmgr update"
  when:
    - system_fwupd_check_result.rc == 0
    - "'no available firmware updates' not in (system_fwupd_check_result.stdout | default('') | lower)"

# --- sshd hardening ---
- name: Ensure sshd is enabled and started
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started
  become: true
  failed_when: false
  when:
    - ansible_facts.services['sshd.service'] is defined

- name: SSHD pre-deployment checks
  when:
    - ansible_facts.services['sshd.service'] is defined
    - not csb_rhel  # CSB: IT manages sshd; non-FIPS algorithms in 00-hardening.conf rejected in FIPS mode
  block:
    - name: Assert real_user_id is non-empty and not root before deploying AllowUsers
      ansible.builtin.assert:
        that:
          - real_user_id | default('') | length > 0
          - real_user_id != 'root'
        fail_msg: >-
          real_user_id='{{ real_user_id | default("(empty)") }}' — AllowUsers in sshd would
          lock out all SSH users. Run as your normal user with -K (make all), not as root.
          'sudo -i && make all' sets USER=root and would write 'AllowUsers root'.

    - name: Assert real_user_id matches valid Linux username character set
      ansible.builtin.assert:
        that:
          - real_user_id is regex('^[a-z_][a-z0-9_.@-]{0,31}$')
        fail_msg: >-
          real_user_id='{{ real_user_id }}' contains characters outside the allowed set
          [a-z0-9_.@-] or exceeds 32 characters. A newline or space in USER would inject
          arbitrary directives into the sshd drop-in. Unset or correct the USER environment
          variable before re-running.

    - name: Assert system_ssh_allow_tcp_forwarding is a recognised sshd value
      ansible.builtin.assert:
        that:
          - system_ssh_allow_tcp_forwarding in ['yes', 'no', 'all', 'local', 'remote']
        fail_msg: >-
          system_ssh_allow_tcp_forwarding='{{ system_ssh_allow_tcp_forwarding }}' is not a
          valid AllowTcpForwarding value. Accepted: yes, no, all, local, remote.

    - name: Assert system_ssh_allow_agent_forwarding is a recognised sshd value
      ansible.builtin.assert:
        that:
          - system_ssh_allow_agent_forwarding in ['yes', 'no']
        fail_msg: >-
          system_ssh_allow_agent_forwarding='{{ system_ssh_allow_agent_forwarding }}' is not
          a valid AllowAgentForwarding value. Accepted: yes, no.

    - name: Ensure sshd config drop-in directory
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        mode: "0700"

    - name: Verify sshd_config includes drop-in directory  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: grep -qE '^\s*Include\s+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config
      changed_when: false
      failed_when: false
      check_mode: false  # read-only probe — must run in check mode
      become: true
      register: system_sshd_include_check

    - name: Add Include /etc/ssh/sshd_config.d/*.conf when missing (rpmnew unmerged or old config)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: 'Include /etc/ssh/sshd_config.d/*.conf'
        insertbefore: BOF
        state: present
        backup: true
      become: true
      when: system_sshd_include_check.rc != 0

    - name: Warn if unreviewed sshd_config.rpmnew is present
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.rpmnew
      register: system_sshd_rpmnew
      become: true

    - name: Emit warning for unmerged sshd_config.rpmnew
      ansible.builtin.debug:
        msg: >-
          WARNING: /etc/ssh/sshd_config.rpmnew exists and has not been merged.
          The package shipped a new default sshd_config that may contain security
          or functional changes. Review and merge before next reprovisioning:
            sudo diff /etc/ssh/sshd_config /etc/ssh/sshd_config.rpmnew
      when: system_sshd_rpmnew.stat.exists | default(false)

- name: Deploy and validate sshd hardening config
  when:
    - ansible_facts.services['sshd.service'] is defined
    - not csb_rhel  # CSB: IT manages sshd via Satellite/SCAP; AllowUsers + non-FIPS algorithms conflict
  block:
    - name: Deploy sshd hardening config
      ansible.builtin.template:
        src: sshd-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        owner: root
        group: root
        mode: "0600"
      notify: Restart sshd

    - name: Validate sshd config syntax after deploying drop-in  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: sshd -t
      changed_when: false

  rescue:
    - name: Remove broken sshd drop-in to prevent SSH lockout on next restart
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/00-hardening.conf
        state: absent

    - name: Fail after cleaning up broken sshd drop-in
      ansible.builtin.fail:
        msg: >-
          sshd -t rejected 00-hardening.conf — the broken drop-in has been removed
          to prevent SSH lockout on reboot. Review template rendering above.

# Mask sshd.socket to prevent port-22 socket activation (sshd.service on port 722 is authoritative).
# Without masking, 'systemctl start sshd.socket' would reopen port 22 bypassing the drop-in.
- name: Mask sshd.socket to prevent port-22 socket activation
  ansible.builtin.systemd:
    name: sshd.socket
    masked: true
    enabled: false
  when: not csb_rhel  # only relevant when our port-722 sshd drop-in is deployed above
  failed_when: false

# --- SELinux SSH port label ---
- name: Label non-default SSH port for SELinux
  when:
    - ssh_port | int != 22
    - ansible_facts['selinux'].status | default('') == 'enabled'
    - not csb_rhel  # CSB: sshd port-722 drop-in not deployed above; no need to label port 722
  block:
    - name: Apply SELinux port label for non-default SSH port
      community.general.seport:
        ports: "{{ ssh_port }}"
        proto: tcp
        setype: ssh_port_t
        state: present
      # No failed_when: false — if the SELinux port label fails, sshd CANNOT bind the
      # new port under SELinux enforcing. Without this label, the sshd restart handler
      # will kill sshd (stop succeeds, start denied by SELinux) leaving the machine
      # SSH-inaccessible. Make this a hard failure so the operator sees it before restart.

  rescue:
    - name: Remove sshd drop-in after SELinux port label failure to prevent SSH lockout
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/00-hardening.conf
        state: absent

    - name: Fail after cleaning up sshd drop-in due to SELinux port label failure
      ansible.builtin.fail:
        msg: >-
          SELinux port label for port 722 failed — 00-hardening.conf has been removed
          to prevent SSH lockout on next sshd restart. Install policycoreutils-python-utils
          and re-run make system.

# --- Crypto policy ---
- name: Check current crypto policy
  ansible.builtin.command:
    cmd: update-crypto-policies --show
  register: system_crypto_policy
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - not csb_rhel
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']

- name: Set crypto policy to DEFAULT:NO-SHA1
  ansible.builtin.command:
    cmd: update-crypto-policies --set DEFAULT:NO-SHA1
  when:
    - system_crypto_policy.rc | default(-1) == 0
    - system_crypto_policy.stdout | default('') != 'DEFAULT:NO-SHA1'
    - not csb_rhel  # RHEL CSB: IT may enforce FIPS/FUTURE
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
  register: system_crypto_policy_set
  changed_when: system_crypto_policy_set.rc == 0
  failed_when: false
  notify:
    - Restart sshd
    - Restart chronyd

- name: Warn if crypto policy update failed (SHA1 may remain active)
  ansible.builtin.debug:
    msg: >-
      WARNING: update-crypto-policies --set DEFAULT:NO-SHA1 failed
      (rc={{ system_crypto_policy_set.rc }}). SHA1-based cipher suites
      may remain permitted — CIS DEFAULT:NO-SHA1 policy not enforced.
  when:
    - system_crypto_policy_set.rc | default(0) != 0

# --- Kernel modules for kind ---
- name: Load iptables kernel modules for kind
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  register: system_modprobe_results
  loop:
    - ip6_tables
    - ip6table_nat
    - ip_tables
    - iptable_nat
    - br_netfilter
    - nf_conntrack  # explicit load so nf_conntrack_max sysctl applies even if firewalld fails to start
    - overlay
  when:
    - not csb_rhel  # kind runs inside dev container on CSB; persistent modules on host unnecessary
  failed_when: false

- name: Apply module-dependent sysctl values immediately  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: sysctl --system
  become: true
  changed_when: false
  failed_when: false

- name: Warn if br_netfilter failed (bridge-nf-call-iptables sysctl would not apply)
  ansible.builtin.debug:
    msg: >-
      WARNING: br_netfilter module failed to load. net.bridge.bridge-nf-call-iptables
      will not be applied — Kubernetes/kind networking (NetworkPolicy) may be broken.
  when: >-
    not csb_rhel and
    (system_modprobe_results.results | default([])
    | selectattr('item', 'equalto', 'br_netfilter')
    | selectattr('rc', 'defined')
    | selectattr('rc', 'ne', 0)
    | list | length > 0)

# --- NetworkManager Tailscale unmanaged ---
- name: Ensure NetworkManager conf.d exists
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d
    state: directory
    mode: "0755"
  failed_when: false

# On CSB, IT may use MAC-based NAC that requires the hardware MAC for 802.1X RADIUS
# authentication. stable-ssid presents a SSID-hashed pseudo-random MAC which could
# break corporate WiFi auth. Skip on CSB (default) and rely on IT's NM configuration.
- name: Set WiFi MAC randomization effective flag
  ansible.builtin.set_fact:
    _system_wifi_mac_rand: "{{ system_wifi_mac_rand | default(not csb_detected) | bool }}"

- name: Configure WiFi MAC address randomization
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [device]
      wifi.scan-rand-mac-address=yes
      [connection]
      wifi.cloned-mac-address=stable-ssid
    dest: /etc/NetworkManager/conf.d/99-wifi-mac-rand.conf
    mode: "0644"
  when: _system_wifi_mac_rand
  failed_when: false
  notify: Restart NetworkManager

- name: Remove WiFi MAC address randomization config when disabled
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d/99-wifi-mac-rand.conf
    state: absent
  when: not _system_wifi_mac_rand
  notify: Restart NetworkManager

- name: Configure NetworkManager to ignore Tailscale and kind interfaces
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [keyfile]
      unmanaged-devices+=interface-name:tailscale*,interface-name:kind*,interface-name:podman*,interface-name:br-*,interface-name:virbr*,interface-name:ovs-system,interface-name:br-int,interface-name:br-ex,interface-name:br-local,interface-name:genev_sys_*,interface-name:wg*,interface-name:ovn-k8s-mp0
    dest: /etc/NetworkManager/conf.d/tailscale.conf
    mode: "0644"
  failed_when: false
  notify: Restart NetworkManager

- name: Deploy NM dns=systemd-resolved config (required for Tailscale MagicDNS split-DNS)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [main]
      dns=systemd-resolved
    dest: /etc/NetworkManager/conf.d/99-dns.conf
    mode: "0644"
  when:
    - not csb_rhel  # paired with resolv.conf
  failed_when: false
  notify: Restart NetworkManager

- name: Disable WiFi power saving (prevents latency spikes and drops on ThinkPad)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [connection]
      wifi.powersave=2
    dest: /etc/NetworkManager/conf.d/99-wifi-powersave.conf
    mode: "0644"
  failed_when: false
  notify: Restart NetworkManager

- name: Suppress DHCP hostname advertisement (privacy — prevents hostname leakage to DHCP servers)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [connection]
      ipv4.dhcp-send-hostname=false
      ipv6.dhcp-send-hostname=false
    dest: /etc/NetworkManager/conf.d/99-dhcp-privacy.conf
    mode: "0644"
  when: not csb_detected
  failed_when: false
  notify: Restart NetworkManager

# tailscale0 is intentionally not CSB-guarded: Tailscale is a user-managed VPN
# interface, not controlled by IT's firewalld policy. Trusted zone is required for
# Tailscale exit-node and peer-to-peer routing to work. Side effect: all Tailscale
# peers can reach any listening port on this machine (passim, etc. are masked separately).
- name: Assign tailscale0 to firewall trusted zone
  ansible.posix.firewalld:
    zone: trusted
    interface: tailscale0
    permanent: true
    immediate: true
    state: enabled
  when: system_firewalld_running | bool
  failed_when: false  # tailscale0 doesn't exist on first provision; permanent config succeeds, immediate fails
  notify:
    - Apply firewall rules
    - Restart tailscaled

# failed_when: false — on CSB where the Tailscale repo is blocked, the package
# may not be installed; silently skip rather than fail the play.
- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
  failed_when: false

# --- dnf-automatic ---
# CSB machines are managed by Red Hat IT via RHSM/Satellite with their own
# maintenance windows. Running dnf-automatic in parallel could install packages
# ahead of IT's approval cycle or outside maintenance windows.
- name: Install dnf-automatic
  ansible.builtin.dnf:
    name: "{{ 'dnf5-plugin-automatic' if ansible_facts['pkg_mgr'] == 'dnf5' else 'dnf-automatic' }}"
    state: present
  register: system_dnf_automatic_installed
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - not csb_rhel
  failed_when: false

- name: Deploy dnf-automatic config
  ansible.builtin.template:
    src: dnf-automatic.conf.j2
    dest: /etc/dnf/automatic.conf
    mode: "0644"
  notify: Restart dnf-automatic timer
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - not csb_rhel
    - system_dnf_automatic_installed is not failed

- name: Enable dnf-automatic timer
  ansible.builtin.systemd:
    name: "{{ 'dnf5-automatic.timer' if ansible_facts['pkg_mgr'] == 'dnf5' else 'dnf-automatic.timer' }}"
    state: started
    enabled: true
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - not csb_rhel
    - system_dnf_automatic_installed is not failed
  failed_when: false

# --- AIDE database update after dnf-automatic (prevent false-positive alerts) ---
- name: Ensure dnf-automatic service drop-in directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ 'dnf5-automatic.service' if ansible_facts['pkg_mgr'] == 'dnf5' else 'dnf-automatic.service' }}.d"
    state: directory
    mode: "0755"
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - system_aide_enabled | bool
    - not csb_rhel
  failed_when: false

- name: Deploy AIDE update hook for dnf-automatic
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # Run aide --update after dnf-automatic applies security updates.
      # Without this, every update causes AIDE false-positive alerts that
      # train operators to ignore them, defeating the purpose of AIDE.
      [Service]
      ExecStartPost=/usr/bin/bash -c '/usr/bin/aide --update; mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz || true'
    dest: "/etc/systemd/system/{{ 'dnf5-automatic.service' if ansible_facts['pkg_mgr'] == 'dnf5' else 'dnf-automatic.service' }}.d/aide-update.conf"  # yamllint disable-line rule:line-length
    mode: "0644"
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - system_aide_enabled | bool
    - not csb_rhel  # dnf-automatic not installed on CSB
  notify: Restart dnf-automatic timer
  failed_when: false

# --- DNS-over-TLS ---
- name: Enable systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: started
    enabled: true
  failed_when: false

- name: Ensure resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Disable LLMNR and mDNS via resolved drop-in
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [Resolve]
      LLMNR=no
      MulticastDNS=no
    dest: /etc/systemd/resolved.conf.d/98-llmnr.conf
    mode: "0644"
  notify: Restart systemd-resolved

# yamllint disable rule:line-length
- name: Deploy DNS-over-TLS resolved config
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [Resolve]
      DNS={{ system_dns_primary }}
      Domains={{ system_dns_domains }}
      DNSOverTLS={{ system_dot_mode }}
      DNSSEC=allow-downgrade
      FallbackDNS={{ system_dns_fallback }}
    dest: /etc/systemd/resolved.conf.d/99-dot.conf
    mode: "0644"
  when:
    - not csb_rhel  # CSB corporate networks block outbound 1.1.1.1; Domains=~. catch-all breaks DNS
  notify: Restart systemd-resolved
# yamllint enable rule:line-length

# --- Verify resolv.conf symlink for split DNS ---
- name: Ensure resolv.conf points to systemd-resolved stub (required for split DNS/MagicDNS)
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when:
    - not csb_rhel
  failed_when: false

# --- Session timeout (CIS 5.5.5: TMOUT <= 900s) ---
- name: Deploy session timeout via profile.d (bash login shells)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # Auto-logout after inactivity (CIS 5.5.5 requires <=900s). Override system_tmout in config.yml.
      readonly TMOUT={{ system_tmout }}
      export TMOUT
    dest: /etc/profile.d/tmout.sh
    mode: "0644"
  when:
    - system_tmout | int > 0

# /etc/profile.d/*.sh is bash-only; zsh needs TMOUT set directly.
# On Fedora/RHEL: /etc/zshrc (compiled default GLOBAL_ZSHRC=/etc/zshrc).
# On Debian: /etc/zsh/zshrc (compiled default GLOBAL_ZSHRC=/etc/zsh/zshrc;
# /etc/zshrc is silently ignored by Debian's zsh binary).
- name: Deploy session timeout to /etc/zshrc (Fedora/RHEL zsh)
  ansible.builtin.lineinfile:
    path: /etc/zshrc
    line: "typeset -xr TMOUT={{ system_tmout }}  # CIS 5.5.5"
    regexp: '^\s*(typeset -xr\s+|readonly\s+)?TMOUT='
    create: true
    mode: "0644"
  when:
    - ansible_facts['os_family'] != 'Debian'
    - system_tmout | int > 0

- name: Deploy session timeout to /etc/zsh/zshrc (Debian zsh — GLOBAL_ZSHRC)
  ansible.builtin.lineinfile:
    path: /etc/zsh/zshrc
    line: "typeset -xr TMOUT={{ system_tmout }}  # CIS 5.5.5"
    regexp: '^\s*(typeset -xr\s+|readonly\s+)?TMOUT='
    create: true
    mode: "0644"
  when:
    - ansible_facts['os_family'] == 'Debian'
    - system_tmout | int > 0

# Cleanup: remove TMOUT artifacts when system_tmout=0 (operator disables timeout).
# Without this, readonly TMOUT=600 persists and cannot be overridden in user dotfiles.
- name: Remove session timeout from profile.d when disabled
  ansible.builtin.file:
    path: /etc/profile.d/tmout.sh
    state: absent
  when:
    - system_tmout | int == 0

- name: Remove session timeout from /etc/zshrc when disabled (Fedora/RHEL)
  ansible.builtin.lineinfile:
    path: /etc/zshrc
    regexp: '^\s*(typeset -xr\s+|readonly\s+)?TMOUT='
    state: absent
  when:
    - ansible_facts['os_family'] != 'Debian'
    - system_tmout | int == 0

- name: Remove session timeout from /etc/zsh/zshrc when disabled (Debian)
  ansible.builtin.lineinfile:
    path: /etc/zsh/zshrc
    regexp: '^\s*(typeset -xr\s+|readonly\s+)?TMOUT='
    state: absent
  when:
    - ansible_facts['os_family'] == 'Debian'
    - system_tmout | int == 0

# --- Timezone and locale ---
- name: Set system timezone
  community.general.timezone:
    name: "{{ system_timezone }}"

- name: Set system locale
  ansible.builtin.copy:
    content: "LANG={{ system_locale }}\n"
    dest: /etc/locale.conf
    mode: "0644"

- name: Set console keymap
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^KEYMAP='
    line: "KEYMAP={{ system_keymap }}"
    create: true
    mode: "0644"
  when: ansible_facts['system'] == 'Linux'
  # lineinfile: manages only the KEYMAP line; preserves FONT and other vconsole.conf settings
  # (copy would overwrite the entire file, destroying eurlatgr FONT on fresh Fedora)

# --- Chrony NTS (authenticated time sync) ---
- name: Install chrony (Debian/Ubuntu — must happen in system role Play 1; packages role runs after)
  ansible.builtin.apt:
    name: chrony
    state: present
  when: ansible_facts['pkg_mgr'] == 'apt'

- name: Deploy NTS-authenticated chrony config
  ansible.builtin.template:
    src: chrony-nts.conf.j2
    dest: /etc/chrony.conf
    mode: "0644"
  notify: Restart chronyd
  when:
    # Skip on RHEL CSB (IT manages NTP via IPA/Kerberos; replacing chrony.conf breaks kinit).
    # On Fedora CSB hybrid (csb_detected=true, Fedora distribution), NTS is safe to deploy.
    - not csb_rhel

- name: Ensure chrony/chronyd is enabled
  ansible.builtin.systemd:
    name: "{{ 'chrony' if ansible_facts['pkg_mgr'] == 'apt' else 'chronyd' }}"
    state: started
    enabled: true

# CSB: faillock/pwhistory/pwquality govern local-account PAM policy. On RHEL CSB hybrid,
# IT's security baseline sets lockout thresholds (NIST SP 800-53 AC-7); overwriting them
# silently violates corporate policy. Fedora hybrid is owner-managed — apply hardening there.
# --- PAM faillock (account lockout after failed attempts) ---
- name: Configure pam_faillock value settings
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - key: deny
      value: "{{ system_faillock_deny }}"
    - key: unlock_time
      value: "{{ system_faillock_unlock_time }}"
  loop_control:
    label: "{{ item.key }}"
  when: not csb_rhel

- name: Configure pam_faillock boolean flags
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: "{{ item }}"
    allow_no_value: true
    mode: "0644"
  loop:
    - audit
    - local_users_only  # prevent double-lockout with SSSD/IPA domain users
  when: not csb_rhel

- name: Configure pam_faillock even_deny_root flag
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: even_deny_root
    allow_no_value: true
    mode: "0644"
  when: system_faillock_even_deny_root | bool and not csb_rhel

- name: Remove pam_faillock even_deny_root flag (when disabled)
  community.general.ini_file:
    path: /etc/security/faillock.conf
    section: null
    option: even_deny_root
    state: absent
    mode: "0644"
  when: not (system_faillock_even_deny_root | bool) and not csb_rhel

- name: Check if authselect with-faillock feature is already enabled
  ansible.builtin.command:
    cmd: authselect is-feature-enabled with-faillock
  register: system_authselect_faillock_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - system_authselect_bin.stat.exists
    - not csb_rhel

- name: Enable authselect with-faillock feature
  ansible.builtin.command:
    cmd: authselect enable-feature with-faillock
  register: system_authselect_faillock_enable
  when:
    - system_authselect_bin.stat.exists
    - not csb_rhel
    - system_authselect_faillock_check.rc | default(0) != 0
  changed_when: true
  failed_when: false

- name: Warn if authselect enable-feature with-faillock failed
  ansible.builtin.debug:
    msg: >-
      WARNING: authselect enable-feature with-faillock exited
      {{ system_authselect_faillock_enable.rc }} — faillock PAM feature may not be active
  when:
    - system_authselect_faillock_enable.rc | default(0) != 0

# --- Debian PAM faillock (no authselect; direct PAM stack insertion) ---
# On Debian, authselect is absent; pam_faillock.so must be added directly to
# /etc/pam.d/common-auth and /etc/pam.d/common-account. faillock.conf (deployed
# above) provides deny/unlock_time values — without pam_faillock.so in the stack
# those settings have NO effect. Two insertions are required:
#   preauth  — before pam_unix.so, checks if account is already locked
#   authfail — after pam_unix.so, records failed attempts
- name: Ensure pam_faillock.so preauth line is in common-auth (Debian)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-auth
    regexp: '^auth\s+required\s+pam_faillock\.so\s+preauth'
    line: 'auth    required                        pam_faillock.so preauth'
    insertbefore: '^auth\s'
    mode: "0644"
  when: ansible_facts['pkg_mgr'] == 'apt'

- name: Ensure pam_faillock.so authfail line is in common-auth (Debian)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-auth
    regexp: '^auth\s+\[default=die\]\s+pam_faillock\.so\s+authfail'
    line: 'auth    [default=die]                  pam_faillock.so authfail'
    insertafter: '^auth.*pam_unix\.so'
    mode: "0644"
  when: ansible_facts['pkg_mgr'] == 'apt'

- name: Ensure pam_faillock.so account line is in common-account (Debian)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-account
    regexp: '^account\s+required\s+pam_faillock\.so$'
    line: 'account required                        pam_faillock.so'
    insertbefore: '^account\s'
    mode: "0644"
  when: ansible_facts['pkg_mgr'] == 'apt'

# Debian: pam_pwhistory.so must be inserted directly (no authselect).
# authselect enable-feature with-pwhistory (below) is RHEL/Fedora only.
# This mirrors the pam_faillock Debian block above.
- name: Ensure pam_pwhistory.so line is in common-password (Debian)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-password
    regexp: '^password\s+required\s+pam_pwhistory\.so'
    line: 'password required                        pam_pwhistory.so use_authtok remember={{ system_pwhistory_remember }} enforce_for_root'
    insertbefore: '^password.*pam_unix\.so'
    mode: "0644"
  when: ansible_facts['pkg_mgr'] == 'apt'

# --- PAM pwhistory (password reuse prevention, CIS 5.3.5) ---
- name: Check if authselect with-pwhistory feature is already enabled
  ansible.builtin.command:
    cmd: authselect is-feature-enabled with-pwhistory
  register: system_authselect_pwhistory_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - system_authselect_bin.stat.exists
    - not csb_rhel

- name: Enable authselect with-pwhistory feature
  ansible.builtin.command:
    cmd: authselect enable-feature with-pwhistory
  register: system_authselect_pwhistory_enable
  when:
    - system_authselect_bin.stat.exists
    - not csb_rhel
    - system_authselect_pwhistory_check.rc | default(0) != 0
  changed_when: true
  failed_when: false

- name: Warn if authselect enable-feature with-pwhistory failed
  ansible.builtin.debug:
    msg: >-
      WARNING: authselect enable-feature with-pwhistory exited
      {{ system_authselect_pwhistory_enable.rc }} — pwhistory PAM feature may not be active
  when:
    - system_authselect_pwhistory_enable.rc | default(0) != 0

- name: Configure pam_pwhistory remember count (CIS 5.3.5)
  community.general.ini_file:
    path: /etc/security/pwhistory.conf
    section: null
    option: remember
    value: "{{ system_pwhistory_remember }}"
    mode: "0644"
  when: not csb_rhel

- name: Enforce pam_pwhistory for root (CIS 5.3.5)
  community.general.ini_file:
    path: /etc/security/pwhistory.conf
    section: null
    option: enforce_for_root
    allow_no_value: true
    mode: "0644"
  when: not csb_rhel

# --- PAM pwquality (password complexity) ---
- name: Configure password quality requirements
  community.general.ini_file:
    path: /etc/security/pwquality.conf
    section: null
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - key: minlen
      value: "{{ system_pwquality_minlen }}"
    - key: dcredit
      value: "{{ system_pwquality_dcredit }}"
    - key: ucredit
      value: "{{ system_pwquality_ucredit }}"
    - key: lcredit
      value: "{{ system_pwquality_lcredit }}"
    - key: ocredit
      value: "{{ system_pwquality_ocredit }}"
    - key: difok
      value: "{{ system_pwquality_difok }}"
    - key: maxrepeat
      value: "{{ system_pwquality_maxrepeat }}"
  loop_control:
    label: "{{ item.key }}"
  when: not csb_rhel

- name: Enforce pwquality for root (CIS 5.3.4)
  community.general.ini_file:
    path: /etc/security/pwquality.conf
    section: null
    option: enforce_for_root
    allow_no_value: true
    mode: "0644"
  when: not csb_rhel

# --- Restrict su to wheel group ---
- name: Enable pam_wheel.so for su
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^#?\s*auth\s+required\s+pam_wheel\.so\s+use_uid'
    line: 'auth		required	pam_wheel.so use_uid'
    insertafter: '^#.*pam_wheel.so'
  when:
    - ansible_facts['pkg_mgr'] != 'apt'  # Debian uses 'sudo' group not 'wheel'; skip entirely
    - not csb_rhel

# --- Journald persistent logging and retention ---
# The drop-in directory and /var/log/journal are created unconditionally (no CSB guard).
# Rationale: Storage=auto (journald's default) writes to /var/log/journal only when that
# directory exists; creating it is additive. If CSB IT has set Storage=volatile in their
# own drop-in, it wins and this directory has no effect. If they use Storage=auto, switching
# to persistent logging is a security benefit (logs survive reboots for incident response),
# not a conflict. journald persistence does NOT interfere with SIEM forwarding — CSB's SIEM
# pipeline uses audisp-remote (auditd), a completely separate subsystem.
# The opinionated config below (rate limits, disk quota) IS CSB-guarded because those
# specific numbers may conflict with IT's journald tuning or centralized log management.
- name: Ensure journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Ensure /var/log/journal exists for persistent storage
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: Deploy journald hardening config
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [Journal]
      Storage=persistent
      SystemMaxUse=4G
      MaxRetentionSec=6month
      SystemKeepFree=1G
      RateLimitIntervalSec=30s
      RateLimitBurst=20000
    dest: /etc/systemd/journald.conf.d/99-hardening.conf
    mode: "0644"
  when: not csb_rhel
  notify: Restart systemd-journald

# --- Logrotate for sudo.log (created by sudoers Defaults logfile) ---
- name: Install logrotate (Debian/Ubuntu)
  ansible.builtin.apt:
    name: logrotate
    state: present
  when: ansible_facts['pkg_mgr'] == 'apt'

- name: Deploy logrotate config for sudo.log
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      /var/log/sudo.log {
          weekly
          rotate 8
          compress
          delaycompress
          missingok
          notifempty
          create 0640 root root
      }
    dest: /etc/logrotate.d/sudo
    mode: "0644"
  when: not csb_rhel  # only meaningful when sudoers hardening task below creates /var/log/sudo.log

# --- Cron access restriction (defense-in-depth if cronie is ever installed) ---
# RHEL CSB: Satellite katello-agent, Insights client, and IT monitoring agents commonly run
# cron jobs under dedicated non-root system users. Creating cron.allow with only 'root'
# would silently block those IT management jobs. Skip on RHEL CSB only.
# Fedora hybrid: those IT tools are absent — cron.allow=root is safe CIS 5.1.8/5.1.9 hardening.
- name: Warn if non-root user crontabs exist before restricting cron access
  ansible.builtin.find:
    paths: /var/spool/cron
    excludes: root
    file_type: file
  register: system_existing_crontabs
  failed_when: false
  when: not csb_rhel

- name: Alert operator about user crontabs that will be silently blocked
  ansible.builtin.debug:
    msg: >-
      WARNING: Non-root crontabs found and will be silently blocked by cron.allow=root:
      {{ system_existing_crontabs.files | map(attribute='path') | list }}.
      Review these jobs before proceeding.
  when:
    - (system_existing_crontabs.files | default([])) | length > 0
    - not csb_rhel

- name: Restrict cron access to root only
  ansible.builtin.copy:
    content: "root\n"
    dest: /etc/cron.allow
    mode: "0600"
  when: not csb_rhel

- name: Restrict at access to root only
  ansible.builtin.copy:
    content: "root\n"
    dest: /etc/at.allow
    mode: "0600"
  when: not csb_rhel

- name: Remove cron.deny (CIS 5.1.8 — cron.allow is authoritative)
  ansible.builtin.file:
    path: /etc/cron.deny
    state: absent
  when: not csb_rhel

- name: Remove at.deny (CIS 5.1.9 — at.allow is authoritative)
  ansible.builtin.file:
    path: /etc/at.deny
    state: absent
  when: not csb_rhel

- name: Harden cron directory permissions (CIS 5.1.2-5.1.7)
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /etc/crontab
      mode: "0600"
    - path: /etc/cron.hourly
      mode: "0700"
    - path: /etc/cron.daily
      mode: "0700"
    - path: /etc/cron.weekly
      mode: "0700"
    - path: /etc/cron.monthly
      mode: "0700"
    - path: /etc/cron.d
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"
  when: not csb_rhel
  failed_when: false

# --- Login banner ---
- name: Deploy login banners (/etc/issue and /etc/issue.net)
  ansible.builtin.copy:
    content: |
      NOTICE: This system is for authorized users only. Unauthorized access
      or use is strictly prohibited and may result in disciplinary action
      and/or criminal prosecution. All activities on this system may be
      monitored, recorded, and audited. By accessing this system, you
      consent to such monitoring and recording.
    dest: "{{ item }}"
    mode: "0644"
  loop: [/etc/issue, /etc/issue.net]
  when: not csb_rhel  # no IT banner at home
  failed_when: false

# --- Sudoers hardening ---
- name: Configure sudoers security defaults
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      Defaults logfile=/var/log/sudo.log
      Defaults log_input,log_output
      Defaults timestamp_timeout=15
      Defaults passwd_timeout=5
      Defaults passwd_tries=3
      Defaults umask=0027
      Defaults use_pty
    dest: /etc/sudoers.d/99-hardening
    mode: "0440"
    validate: visudo -cf %s
  when: not csb_rhel  # CSB: IT manages sudoers via Satellite/SCAP; log_input/log_output conflict with IT monitoring

- name: Propagate GOTMPDIR through sudo (go test under sudo)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      Defaults env_keep += GOTMPDIR
    dest: /etc/sudoers.d/go-env
    mode: "0440"
    validate: visudo -cf %s
  become: true
  when: not csb_rhel  # CSB: IT manages all sudoers.d; unmanaged drop-ins may be removed by compliance

# --- Password aging ---
# CSB: login.defs governs local account policy. INACTIVE=30 could lock IT-managed local
# service accounts that don't rotate passwords. YESCRYPT is the RHEL 9 default already.
# Skip on CSB and rely on IPA/SSSD + IT group policy for account management.
- name: Configure password aging in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.name }}\\s+"
    line: "{{ item.name }}\t{{ item.value }}"
    insertafter: EOF
    create: false
    mode: "0644"
  loop:
    - name: PASS_MAX_DAYS
      value: "{{ system_pass_max_days }}"
    - name: PASS_MIN_DAYS
      value: "{{ system_pass_min_days }}"
    - name: PASS_WARN_AGE
      value: "{{ system_pass_warn_age }}"
    - name: UMASK
      value: "{{ system_umask }}"
    - name: HOME_MODE
      value: "0750"  # CIS: explicit home dir permissions (Fedora 38+ shadow-utils)
    - name: INACTIVE
      value: "{{ system_inactive_days }}"
  loop_control:
    label: "{{ item.name }}"
  when: not csb_rhel

- name: Enforce yescrypt password hashing in login.defs (CIS 5.3.6)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^ENCRYPT_METHOD'
    line: 'ENCRYPT_METHOD YESCRYPT'
    mode: "0644"
  when: not csb_rhel

- name: Enforce yescrypt cost factor in login.defs (CIS 5.4.1)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?YESCRYPT_COST_FACTOR'
    line: 'YESCRYPT_COST_FACTOR 5'
    mode: "0644"
  when: not csb_rhel

- name: Restrict existing user home directory to 0750 (CIS 6.2.x, retroactive)
  ansible.builtin.file:
    path: "{{ real_user_home }}"
    mode: "0750"
    state: directory
  when:
    - real_user_home | length > 0
    - real_user_home != '/'
    - not csb_rhel  # CSB: IPA/SSSD manages home directory permissions via oddjob-mkhomedir
  failed_when: false

# --- Inactive account lockout (CIS 5.5.1.5: lock accounts inactive >30 days) ---
- name: Check useradd default INACTIVE setting
  ansible.builtin.command:
    cmd: useradd -D
  register: system_useradd_defaults
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when: not csb_rhel

- name: Set default inactive days for new accounts to 30
  ansible.builtin.command:
    cmd: useradd -D -f {{ system_inactive_days }}
  when:
    - "'INACTIVE=' ~ system_inactive_days not in (system_useradd_defaults.stdout | default(''))"
    - not csb_rhel  # same rationale as login.defs INACTIVE guard
  changed_when: true

# useradd -D -f 30 only governs future accounts. Apply the same 30-day
# inactive lockout to the pre-existing real user account (CIS 5.5.1.5).
- name: Check current inactive lockout setting for existing user account
  # Read /etc/shadow field 7 (inactive-days integer) directly; chage -l prints
  # a human-readable calendar date, not the raw integer, so regex_search('30') never matches.
  ansible.builtin.command:
    cmd: "awk -F: -v u={{ real_user_id }} '$1==u{print $7}' /etc/shadow"
  register: system_chage_inactive_days
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  become: true
  when:
    - not csb_rhel

- name: Set inactive lock for existing user account (CIS 5.5.1.5)
  ansible.builtin.command:
    cmd: chage -I {{ system_inactive_days }} {{ real_user_id }}
  when:
    # CSB: IPA/SSSD domain users have no /etc/shadow entry; chage silently fails.
    # IPA manages inactive lockout via krbPwdPolicy, not shadow aging.
    - not csb_rhel
    - system_chage_inactive_days.stdout | default('') | trim != system_inactive_days | string
  changed_when: true
  failed_when: false

- name: Check current minimum password age for existing user account
  ansible.builtin.command:
    cmd: "awk -F: -v u={{ real_user_id }} '$1==u{print $4}' /etc/shadow"
  register: system_chage_min_days
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  when:
    - not csb_rhel
    - real_user_id | length > 0

- name: Set minimum password age for existing user account (CIS 5.5.1.2)
  ansible.builtin.command:
    cmd: chage -m {{ system_pass_min_days }} {{ real_user_id }}
  when:
    - not csb_rhel
    - real_user_id | length > 0
    - system_chage_min_days.stdout | default('') | trim != system_pass_min_days | string
  changed_when: true
  failed_when: false

- name: Check current maximum password age for existing user account
  ansible.builtin.command:
    cmd: "awk -F: -v u={{ real_user_id }} '$1==u{print $5}' /etc/shadow"
  register: system_chage_max_days
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  when:
    - not csb_rhel
    - real_user_id | length > 0

- name: Set maximum password age for existing user account (CIS 5.5.1.1)
  ansible.builtin.command:
    cmd: chage -M {{ system_pass_max_days }} {{ real_user_id }}
  when:
    - not csb_rhel
    - real_user_id | length > 0
    - system_chage_max_days.stdout | default('') | trim != system_pass_max_days | string
  changed_when: true
  failed_when: false

- name: Check current password warning age for existing user account
  ansible.builtin.command:
    cmd: "awk -F: -v u={{ real_user_id }} '$1==u{print $6}' /etc/shadow"
  register: system_chage_warn_age
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  when:
    - not csb_rhel
    - real_user_id | length > 0

- name: Set password warning age for existing user account (CIS 5.5.1.3)
  ansible.builtin.command:
    cmd: chage -W {{ system_pass_warn_age }} {{ real_user_id }}
  when:
    - not csb_rhel
    - real_user_id | length > 0
    - system_chage_warn_age.stdout | default('') | trim != system_pass_warn_age | string
  changed_when: true
  failed_when: false

# --- Rootless container prerequisites (subuid/subgid for podman) ---
- name: Ensure rootless podman prerequisites for user
  when: real_user_id | length > 0
  block:
    - name: Ensure subuid entry exists for user
      ansible.builtin.lineinfile:
        path: /etc/subuid
        regexp: "^{{ real_user_id }}:"
        line: "{{ real_user_id }}:100000:65536"
        create: true
        mode: "0644"

    - name: Ensure subgid entry exists for user
      ansible.builtin.lineinfile:
        path: /etc/subgid
        regexp: "^{{ real_user_id }}:"
        line: "{{ real_user_id }}:100000:65536"
        create: true
        mode: "0644"

    - name: Enable session lingering for rootless podman socket persistence
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ real_user_id }}
        creates: /var/lib/systemd/linger/{{ real_user_id }}
      failed_when: false
      # Without linger, systemd kills the user session (and podman.socket) when the
      # provisioning SSH session ends. DOCKER_HOST in dotfiles points to the socket.

# --- Lock root account ---
- name: Lock root account
  ansible.builtin.user:
    name: root
    password_lock: true
  failed_when: false

# --- User account integrity (CIS 6.2.1/6.2.2/6.2.9) ---
- name: Find non-root UID 0 accounts (CIS 6.2.9)
  ansible.builtin.command:
    argv:
      - awk
      - "-F:"
      - "($3==0 && $1!=\"root\"){print $1}"
      - /etc/passwd
  register: system_uid0_accounts
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Assert no non-root UID 0 accounts (CIS 6.2.9)
  ansible.builtin.assert:
    that: system_uid0_accounts.stdout | length == 0
    fail_msg: "Non-root UID 0 accounts found: {{ system_uid0_accounts.stdout }} -- Fix: sudo usermod -u <new_uid> <account>"
    success_msg: "CIS 6.2.9: no non-root UID 0 accounts"
  when: not csb_rhel  # CSB: IT-provisioned service accounts may have unusual UID/GID — assert would abort play

- name: Find accounts with GID 0 (root group) as primary group (CIS 6.2.x)
  ansible.builtin.command:
    argv:
      - awk
      - "-F:"
      - "($4==0 && $1!~/^(root|sync|shutdown|halt|operator)$/){print $1}"
      - /etc/passwd
  register: system_gid0_accounts
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Assert no non-root GID 0 primary group accounts (CIS 6.2.x)
  ansible.builtin.assert:
    that: system_gid0_accounts.stdout | length == 0
    fail_msg: "Non-root accounts with root primary GID: {{ system_gid0_accounts.stdout }} -- Fix: sudo usermod -g <new_gid> <account>"
    success_msg: "CIS 6.2.x: no non-root GID 0 primary group accounts"
  when: not csb_rhel  # CSB: IT-provisioned service accounts may have GID 0

- name: Find accounts with empty passwords in shadow (CIS 6.2.2)
  ansible.builtin.command:
    argv:
      - awk
      - "-F:"
      - "($2==\"\"){print $1}"
      - /etc/shadow
  register: system_empty_pw_accounts
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Assert no empty password accounts (CIS 6.2.2)
  ansible.builtin.assert:
    that: system_empty_pw_accounts.stdout | length == 0
    fail_msg: >-
      Accounts with empty passwords: {{ system_empty_pw_accounts.stdout }}
      -- Fix: sudo passwd -l <account> (lock) or sudo passwd <account> (set password)
    success_msg: "CIS 6.2.2: no empty passwords"
  when: not csb_rhel  # CSB: IPA-managed accounts may appear empty in local shadow

- name: Find accounts with unmasked passwords in passwd (CIS 6.2.1)
  ansible.builtin.command:
    argv:
      - awk
      - "-F:"
      - "($2!=\"x\" && $2!=\"*\" && $2!=\"!\"){print $1}"
      - /etc/passwd
  register: system_unshadowed_accounts
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Assert all passwd entries use shadowed passwords (CIS 6.2.1)
  ansible.builtin.assert:
    that: system_unshadowed_accounts.stdout | length == 0
    fail_msg: "Unshadowed passwd entries: {{ system_unshadowed_accounts.stdout }} -- Fix: sudo pwconv"
    success_msg: "CIS 6.2.1: all passwd entries shadowed"
  when: not csb_rhel  # CSB: IPA manages passwords; some entries may appear unshadowed

# --- Critical file permissions (CIS 6.1.2/6.1.4/6.1.6/6.1.8) ---
- name: Enforce permissions on critical auth files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: /etc/passwd
      group: root
      mode: "0644"
    - path: /etc/shadow
      group: "{{ 'shadow' if ansible_facts['pkg_mgr'] == 'apt' else 'root' }}"
      mode: "{{ '0640' if ansible_facts['pkg_mgr'] == 'apt' else '0000' }}"
    - path: /etc/group
      group: root
      mode: "0644"
    - path: /etc/gshadow
      group: "{{ 'shadow' if ansible_facts['pkg_mgr'] == 'apt' else 'root' }}"
      mode: "{{ '0640' if ansible_facts['pkg_mgr'] == 'apt' else '0000' }}"
  loop_control:
    label: "{{ item.path }}"

# --- System-level dconf hardening (CIS 1.8.x — GNOME/GDM only) ---
# Written as root to /etc/dconf/db/ so settings are locked and cannot be
# overridden by users (unlike user-level community.general.dconf tasks).
# Skipped on Sway/i3 systems where GDM is not installed (service facts check).
- name: System-level dconf hardening (GNOME/GDM, CIS 1.8.x)
  when:
    - '"gdm.service" in ansible_facts.services'
    - not csb_rhel  # CSB: IT manages GDM banner and screensaver policy via Satellite/SCAP; lock files conflict
  block:
    - name: Ensure dconf local.d locks directory exists
      ansible.builtin.file:
        path: /etc/dconf/db/local.d/locks
        state: directory
        mode: "0755"

    - name: Deploy system-level GNOME media-handling hardening (CIS 1.8.6-1.8.8)
      ansible.builtin.copy:
        content: |
          # {{ ansible_managed }}
          # CIS 1.8.6-1.8.8: disable removable media automount/autorun
          [org/gnome/desktop/media-handling]
          automount=false
          autorun-never=true
          automount-open=false
        dest: /etc/dconf/db/local.d/50-hardening
        mode: "0644"
      notify: Run dconf update

    - name: Deploy dconf locks for media-handling (CIS 1.8.6-1.8.8)
      ansible.builtin.copy:
        content: |
          /org/gnome/desktop/media-handling/automount
          /org/gnome/desktop/media-handling/autorun-never
          /org/gnome/desktop/media-handling/automount-open
        dest: /etc/dconf/db/local.d/locks/50-hardening
        mode: "0644"
      notify: Run dconf update

    - name: Ensure gdm.d locks directory exists (CIS 1.8.3)
      ansible.builtin.file:
        path: /etc/dconf/db/gdm.d/locks
        state: directory
        mode: "0755"

    - name: Disable GDM user list on login screen and deploy banner (CIS 1.8.2/1.8.3)
      ansible.builtin.copy:
        content: |
          # {{ ansible_managed }}
          # CIS 1.8.2: GDM login banner
          # CIS 1.8.3: prevent username enumeration on GDM login screen
          [org/gnome/login-screen]
          banner-message-enable=true
          banner-message-text='Authorized users only. All activity is monitored and logged.'
          disable-user-list=true
        dest: /etc/dconf/db/gdm.d/03-hardening
        mode: "0644"
      notify: Run dconf update

    - name: Lock GDM login-screen keys (CIS 1.8.2/1.8.3)
      ansible.builtin.copy:
        content: |
          /org/gnome/login-screen/banner-message-enable
          /org/gnome/login-screen/banner-message-text
          /org/gnome/login-screen/disable-user-list
        dest: /etc/dconf/db/gdm.d/locks/03-hardening
        mode: "0644"
      notify: Run dconf update

    - name: Deploy screensaver/idle lock policy (CIS 1.8.4/1.8.5)
      ansible.builtin.copy:
        content: |
          # {{ ansible_managed }}
          # CIS 1.8.4/1.8.5: GNOME screen lock on idle (≤900s per benchmark)
          [org/gnome/desktop/session]
          idle-delay=uint32 300

          [org/gnome/desktop/screensaver]
          lock-enabled=true
          lock-delay=uint32 0
        dest: /etc/dconf/db/local.d/51-screensaver
        mode: "0644"
      notify: Run dconf update

    - name: Lock screensaver/idle settings (CIS 1.8.5)
      ansible.builtin.copy:
        content: |
          /org/gnome/desktop/session/idle-delay
          /org/gnome/desktop/screensaver/lock-enabled
          /org/gnome/desktop/screensaver/lock-delay
        dest: /etc/dconf/db/local.d/locks/51-screensaver
        mode: "0644"
      notify: Run dconf update

    - name: Disable XDCMP in GDM (CIS 1.8.10)
      community.general.ini_file:
        path: /etc/gdm/custom.conf
        section: xdmcp
        option: Enable
        value: "false"
        create: true
        mode: "0644"
        no_extra_spaces: true
      failed_when: false

# --- AIDE cleanup when disabled (prevents one-way ratchet) ---
# When system_aide_enabled is toggled false, stop and remove the AIDE infrastructure
# so aide-check.timer doesn't keep running on an unmanaged installation.
- name: Remove AIDE infrastructure when disabled
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - not (system_aide_enabled | bool)
    - not csb_rhel  # CSB IT manages AIDE baseline; don't interfere
  block:
    - name: Disable and stop aide-check.timer when AIDE disabled
      ansible.builtin.systemd:
        name: aide-check.timer
        state: stopped
        enabled: false
        daemon_reload: true
      failed_when: false

    - name: Remove AIDE systemd unit files when disabled
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/aide-check.service
        - /etc/systemd/system/aide-check.timer
        - /etc/systemd/system/aide-notify@.service
        - "/etc/systemd/system/{{ 'dnf5-automatic' if ansible_facts['pkg_mgr'] == 'dnf5' else 'dnf-automatic' }}.service.d/aide-update.conf"  # yamllint disable-line rule:line-length
      loop_control:
        label: "{{ item }}"
      register: system_aide_unit_removal

    - name: Reload systemd after removing AIDE units  # noqa: no-handler
      ansible.builtin.systemd:
        daemon_reload: true
      when: system_aide_unit_removal.changed

    - name: Remove aide package when AIDE disabled
      ansible.builtin.dnf:
        name: aide
        state: absent

# --- AIDE file integrity monitoring ---
# Block-level guard: AIDE is DNF/RPM-only (aide package from Fedora/RHEL repos).
# On non-DNF systems (Debian, macOS) this entire section skips cleanly.
# Individual tasks drop their redundant 'when: system_aide_enabled | bool' —
# the block-level condition covers both the pkg_mgr and enabled checks.
- name: AIDE file integrity monitoring
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - system_aide_enabled | bool
    - not csb_rhel  # CSB IT manages AIDE baseline; don't overwrite
  block:
    - name: Install AIDE
      ansible.builtin.dnf:
        name: aide
        state: present

    - name: Ensure AIDE monitors /usr/local/bin
      ansible.builtin.lineinfile:
        path: /etc/aide.conf
        regexp: '^/usr/local/bin'
        line: '/usr/local/bin NORMAL'
        state: present
      register: _aide_conf_r1

    - name: Add /etc paths to AIDE monitoring
      ansible.builtin.lineinfile:
        path: /etc/aide.conf
        regexp: "^{{ item | replace('.', '\\.') }}(\\s|$)"  # anchor: prevents matching /path.bak (consistent with /etc/tlp.conf\s)
        line: "{{ item }} NORMAL"
        insertbefore: '^/etc\s'  # must precede the /etc PERMS catch-all (longest-match-wins)
        state: present
      loop: "{{ system_aide_monitoring_etc_paths }}"
      loop_control:
        label: "{{ item }}"
      register: _aide_conf_r2

    - name: Add TLP conf.d to AIDE monitoring (battery/power policy)
      ansible.builtin.lineinfile:
        path: /etc/aide.conf
        regexp: '^/etc/tlp\.d'
        line: '/etc/tlp.d NORMAL'
        insertbefore: '^/etc\s'
        state: present
      when: system_tlp_enabled | bool
      register: _aide_conf_r3

    - name: Add /etc/tlp.conf to AIDE monitoring (TLP global config)
      ansible.builtin.lineinfile:
        path: /etc/aide.conf
        regexp: '^/etc/tlp\.conf\s'  # whitespace-anchor prevents matching /etc/tlp.conf.bak etc.
        line: '/etc/tlp.conf NORMAL'
        insertbefore: '^/etc\s'
        state: present
      when: system_tlp_enabled | bool
      register: _aide_conf_r4

    - name: Add /etc/usbguard to AIDE monitoring (USB device whitelist integrity)
      ansible.builtin.lineinfile:
        path: /etc/aide.conf
        regexp: '^/etc/usbguard'
        line: '/etc/usbguard NORMAL'
        insertbefore: '^/etc\s'
        state: present
      register: _aide_conf_r5
      when: system_install_usbguard | bool

    - name: Add /boot to AIDE monitoring (kernel cmdline parameter protection)
      ansible.builtin.lineinfile:
        path: /etc/aide.conf
        regexp: '^/boot'
        line: '/boot NORMAL'
        state: present
      register: _aide_conf_r6
      # grubby modifies /boot/loader/entries/ directly; auditd watches /boot for writes
      # but AIDE provides the content integrity baseline to detect unauthorized changes.

    - name: Reinitialize AIDE database when conf changed
      ansible.builtin.shell:  # noqa: command-instead-of-module
        cmd: aide --init && mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
      become: true
      changed_when: true
      when:
        - _aide_conf_r1 is changed
          or _aide_conf_r2 is changed
          or _aide_conf_r3 is changed
          or _aide_conf_r4 is changed
          or _aide_conf_r5 is changed
          or _aide_conf_r6 is changed
        - system_aide_enabled | bool
        - not csb_rhel

    - name: Check if AIDE database exists
      ansible.builtin.stat:
        path: /var/lib/aide/aide.db.gz
      register: system_aide_db

    - name: Check if partial AIDE new database exists
      ansible.builtin.stat:
        path: /var/lib/aide/aide.db.new.gz
      register: system_aide_db_new

    - name: Initialize AIDE database (first run only)
      when:
        - not (system_aide_db.stat.exists | default(false))
        - not (system_aide_db_new.stat.exists | default(false))
      block:
        - name: Warn that AIDE initialization takes 5-10 minutes
          ansible.builtin.debug:
            msg: "Starting AIDE database initialization — this scans the filesystem and takes 5-10 minutes. Do not cancel."

        - name: Initialize AIDE database and promote to active baseline
          ansible.builtin.command:
            cmd: bash -c "aide --init && mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz"
          changed_when: true

    - name: Deploy AIDE failure notification unit
      ansible.builtin.template:
        src: aide-notify@.service.j2
        dest: /etc/systemd/system/aide-notify@.service
        mode: "0644"
      notify: Restart aide-check timer

    - name: Deploy AIDE check service
      ansible.builtin.template:
        src: aide-check.service.j2
        dest: /etc/systemd/system/aide-check.service
        mode: "0644"
      notify: Restart aide-check timer

    - name: Deploy AIDE check timer
      ansible.builtin.template:
        src: aide-check.timer.j2
        dest: /etc/systemd/system/aide-check.timer
        mode: "0644"
      notify: Restart aide-check timer

    - name: Enable AIDE check timer
      ansible.builtin.systemd:
        name: aide-check.timer
        state: started
        enabled: true
        daemon_reload: true
  rescue:
    - name: Warn on AIDE initialization failure
      ansible.builtin.debug:
        msg: >-
          AIDE initialization failed (disk exhaustion, OOM, or signal interruption).
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          To recover: free disk space, remove any partial /var/lib/aide/aide.db.new.gz,
          then run 'sudo aide --init && sudo cp /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz'.
          Re-run this playbook once space is available to complete AIDE setup.
