---
# roles/system/tasks/main.yml
# System hardening: firewall, sysctl, kernel lockdown, auditd, services.
# All tasks require become (Play 1 has become: true at play level).

# --- Gather service facts (needed for firewalld/auditd/resolved conditionals) ---
- name: Gather service facts
  ansible.builtin.service_facts:

# --- Prerequisites (needed by seport and other system tasks) ---
- name: Ensure policycoreutils-python-utils is installed
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  when:
    - is_dnf
    - not csb_rhel

# --- SELinux enforcement check ---
- name: Verify SELinux is enforcing
  ansible.builtin.assert:
    that:
      - ansible_facts['selinux'].status == 'enabled'
      - ansible_facts['selinux'].mode == 'enforcing'
      - ansible_facts['selinux'].type == 'targeted'
    fail_msg: >-
      SELinux is {{ ansible_facts['selinux'].mode | default('disabled') }}
      (type: {{ ansible_facts['selinux'].type | default('unknown') }}).
      Fix: sudo setenforce 1 && sudo sed -i
      's/^SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config
  when:
    - ansible_facts['selinux'] is defined
    - ansible_facts['selinux'] is mapping
    - is_dnf
    - system_selinux_enforcing_required | bool

- name: Mount hardening
  ansible.builtin.include_tasks: mounts.yml

# --- Kernel module blacklist ---
- name: Ensure /etc/modprobe.d exists
  ansible.builtin.file:
    path: /etc/modprobe.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy kernel module blacklist
  ansible.builtin.template:
    src: modprobe-hardening.conf.j2
    dest: /etc/modprobe.d/hardening.conf
    mode: "0644"

- name: Sysctl hardening
  ansible.builtin.include_tasks: sysctl.yml

- name: Firewall configuration
  ansible.builtin.include_tasks: firewall.yml

- name: Kernel lockdown
  ansible.builtin.include_tasks: kernel_lockdown.yml

# --- Core dumps ---
- name: Ensure coredump config directory
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    mode: "0755"

- name: Remove legacy coredump disable.conf drop-in (renamed in cycle 2)
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d/disable.conf
    state: absent

- name: Configure coredump storage
  ansible.builtin.template:
    src: coredump.conf.j2
    dest: /etc/systemd/coredump.conf.d/coredump.conf
    mode: "0644"

- name: Set RLIMIT_CORE=0 in security limits (CIS 1.5.1 — prevent core dumps)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # CIS 1.5.1: restrict core dump acquisition to root-controlled processes.
      # Hard limit prevents users from overriding the soft limit.
      *    hard    core    0
      root hard    core    0
    dest: /etc/security/limits.d/90-coredump.conf
    mode: "0644"
  when:
    - system_coredump_storage == 'none'

# --- Auditd ---
- name: Auditd tasks
  ansible.builtin.include_tasks: auditd.yml

# --- Bolt (Thunderbolt device authorization daemon) ---
- name: Install bolt for Thunderbolt device authorization
  ansible.builtin.dnf:
    name: bolt
    state: present
  when: is_dnf
  failed_when: false

- name: Start bolt service (D-Bus activated, no [Install] section — cannot be enabled)
  ansible.builtin.systemd:
    name: bolt
    state: started
  when:
    - is_dnf
    - not system_is_container  # D-Bus activation crashes Podman containers
  failed_when: false

- name: Authselect and fingerprint auth
  ansible.builtin.include_tasks: authselect_fingerprint.yml

- ansible.builtin.include_tasks: service_masking.yml

- ansible.builtin.include_tasks: logind.yml

- ansible.builtin.include_tasks: services.yml

- name: Firmware updates
  ansible.builtin.include_tasks: firmware.yml

- name: SSHD hardening, SELinux port label, and crypto policy
  ansible.builtin.include_tasks: sshd.yml

# --- Kernel modules for kind ---
- name: Load iptables kernel modules for kind
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  register: system_modprobe_results
  loop:
    - ip6_tables
    - ip6table_nat
    - ip_tables
    - iptable_nat
    - br_netfilter
    - nf_conntrack  # explicit load so nf_conntrack_max sysctl applies even if firewalld fails to start
    - overlay
  when:
    - not csb_rhel  # kind runs inside dev container on CSB; persistent modules on host unnecessary
    - not system_is_container
    # Loading iptables modules in a Podman container disrupts host iptables/networking
    # and kills the container connection; modules are managed by the host on container hosts.
  failed_when: false

- name: Apply module-dependent sysctl values immediately  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false
  failed_when: false
  when: not system_is_container

- name: Warn if br_netfilter failed (bridge-nf-call-iptables sysctl would not apply)
  ansible.builtin.debug:
    msg: >-
      WARNING: br_netfilter module failed to load. net.bridge.bridge-nf-call-iptables
      will not be applied — Kubernetes/kind networking (NetworkPolicy) may be broken.
  when: >-
    not csb_rhel and
    (system_modprobe_results.results | default([])
    | selectattr('item', 'equalto', 'br_netfilter')
    | selectattr('rc', 'defined')
    | selectattr('rc', 'ne', 0)
    | list | length > 0)

- name: NetworkManager configuration
  ansible.builtin.include_tasks: nm.yml

# --- dnf-automatic ---
# CSB machines are managed by Red Hat IT via RHSM/Satellite with their own
# maintenance windows. Running dnf-automatic in parallel could install packages
# ahead of IT's approval cycle or outside maintenance windows.
- name: Install dnf-automatic
  ansible.builtin.dnf:
    name: "{{ 'dnf5-plugin-automatic' if is_dnf5 else 'dnf-automatic' }}"
    state: present
  register: system_dnf_automatic_installed
  when:
    - is_dnf
    - not csb_rhel
  failed_when: false

- name: Deploy dnf-automatic config
  ansible.builtin.template:
    src: dnf-automatic.conf.j2
    dest: /etc/dnf/automatic.conf
    mode: "0644"
  notify: Restart dnf-automatic timer
  when:
    - is_dnf
    - not csb_rhel
    - system_dnf_automatic_installed.rc is defined and system_dnf_automatic_installed.rc == 0

- name: Enable dnf-automatic timer
  ansible.builtin.systemd:
    name: "{{ 'dnf5-automatic.timer' if is_dnf5 else 'dnf-automatic.timer' }}"
    state: started
    enabled: true
  when:
    - is_dnf
    - not csb_rhel
    - system_dnf_automatic_installed.rc is defined and system_dnf_automatic_installed.rc == 0
    - not system_is_container
  failed_when: false

# --- AIDE database update after dnf-automatic (prevent false-positive alerts) ---
- name: Ensure dnf-automatic service drop-in directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ 'dnf5-automatic.service' if is_dnf5 else 'dnf-automatic.service' }}.d"
    state: directory
    mode: "0755"
  when:
    - is_dnf
    - system_aide_enabled | bool
    - not csb_rhel
  failed_when: false

- name: Deploy AIDE update hook for dnf-automatic
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # Run aide --update after dnf-automatic applies security updates.
      # Without this, every update causes AIDE false-positive alerts that
      # train operators to ignore them, defeating the purpose of AIDE.
      [Service]
      ExecStartPost=/usr/bin/bash -c '/usr/bin/aide --update; mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz || true'
    dest: "/etc/systemd/system/{{ 'dnf5-automatic.service' if is_dnf5 else 'dnf-automatic.service' }}.d/aide-update.conf"  # yamllint disable-line rule:line-length
    mode: "0644"
  when:
    - is_dnf
    - system_aide_enabled | bool
    - not csb_rhel  # dnf-automatic not installed on CSB
  notify: Restart dnf-automatic timer
  failed_when: false

# --- DNS-over-TLS ---
- name: Enable systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: started
    enabled: true
  when: not system_is_container  # starting resolved triggers systemd re-exec, crashes privileged Podman containers
  failed_when: false

- name: Ensure resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Disable LLMNR and mDNS via resolved drop-in
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [Resolve]
      LLMNR=no
      MulticastDNS=no
    dest: /etc/systemd/resolved.conf.d/98-llmnr.conf
    mode: "0644"
  notify: Restart systemd-resolved

# yamllint disable rule:line-length
- name: Deploy DNS-over-TLS resolved config
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [Resolve]
      DNS={{ system_dns_primary }}
      Domains={{ system_dns_domains }}
      DNSOverTLS={{ system_dot_mode }}
      DNSSEC=allow-downgrade
      FallbackDNS={{ system_dns_fallback }}
    dest: /etc/systemd/resolved.conf.d/99-dot.conf
    mode: "0644"
  when:
    - not csb_rhel  # CSB corporate networks block outbound 1.1.1.1; Domains=~. catch-all breaks DNS
  notify: Restart systemd-resolved
# yamllint enable rule:line-length

# --- Verify resolv.conf symlink for split DNS ---
- name: Ensure resolv.conf points to systemd-resolved stub (required for split DNS/MagicDNS)
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when:
    - not csb_rhel
  failed_when: false

# --- Session timeout (CIS 5.5.5: TMOUT <= 900s) ---
- ansible.builtin.include_tasks: session_timeout.yml

# --- Timezone and locale ---
- name: Set system timezone
  community.general.timezone:
    name: "{{ system_timezone }}"

- name: Set system locale
  ansible.builtin.copy:
    content: "LANG={{ system_locale }}\n"
    dest: /etc/locale.conf
    mode: "0644"

- name: Set console keymap
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^KEYMAP='
    line: "KEYMAP={{ system_keymap }}"
    create: true
    mode: "0644"
  # lineinfile: manages only the KEYMAP line; preserves FONT and other vconsole.conf settings
  # (copy would overwrite the entire file, destroying eurlatgr FONT on fresh Fedora)

# --- Chrony NTS (authenticated time sync) ---
- name: Install chrony (Debian/Ubuntu — must happen in system role Play 1; packages role runs after)
  ansible.builtin.apt:
    name: chrony
    state: present
  when:
    - is_apt
    # Debian postinst starts chrony automatically; skip in containers (system_chrony_service_enabled:
    # false) to prevent the daemon start from crashing the Podman container.
    - system_chrony_service_enabled | bool

- name: Deploy NTS-authenticated chrony config
  ansible.builtin.template:
    src: chrony-nts.conf.j2
    dest: /etc/chrony.conf
    mode: "0644"
  notify: Restart chronyd
  when:
    # Skip on RHEL CSB (IT manages NTP via IPA/Kerberos; replacing chrony.conf breaks kinit).
    # On Fedora CSB hybrid (csb_detected=true, Fedora distribution), NTS is safe to deploy.
    - not csb_rhel
    # Skip if chrony is not installed (system_chrony_service_enabled: false skips the install above).
    - system_chrony_service_enabled | bool

- name: Ensure chrony/chronyd is enabled
  ansible.builtin.systemd:
    name: "{{ 'chrony' if is_apt else 'chronyd' }}"
    state: started
    enabled: true
  when: system_chrony_service_enabled | bool

- name: PAM hardening (faillock, pwhistory, pwquality, pam_wheel)
  ansible.builtin.include_tasks: pam.yml

# --- Journald persistent logging and retention ---
# The drop-in directory and /var/log/journal are created unconditionally (no CSB guard).
# Rationale: Storage=auto (journald's default) writes to /var/log/journal only when that
# directory exists; creating it is additive. If CSB IT has set Storage=volatile in their
# own drop-in, it wins and this directory has no effect. If they use Storage=auto, switching
# to persistent logging is a security benefit (logs survive reboots for incident response),
# not a conflict. journald persistence does NOT interfere with SIEM forwarding — CSB's SIEM
# pipeline uses audisp-remote (auditd), a completely separate subsystem.
# The opinionated config below (rate limits, disk quota) IS CSB-guarded because those
# specific numbers may conflict with IT's journald tuning or centralized log management.
- name: Ensure journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Ensure /var/log/journal exists for persistent storage
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: Deploy journald hardening config
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [Journal]
      Storage=persistent
      SystemMaxUse=4G
      MaxRetentionSec=6month
      SystemKeepFree=1G
      RateLimitIntervalSec=30s
      RateLimitBurst=20000
    dest: /etc/systemd/journald.conf.d/99-hardening.conf
    mode: "0644"
  when: not csb_rhel
  notify: Restart systemd-journald

# --- Logrotate for sudo.log (created by sudoers Defaults logfile) ---
- name: Install logrotate
  ansible.builtin.package:
    name: logrotate
    state: present

- name: Deploy logrotate config for sudo.log
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      /var/log/sudo.log {
          weekly
          rotate 8
          compress
          delaycompress
          missingok
          notifempty
          create 0640 root root
      }
    dest: /etc/logrotate.d/sudo
    mode: "0644"
  when: not csb_rhel  # only meaningful when sudoers hardening task below creates /var/log/sudo.log

- ansible.builtin.include_tasks: cron.yml

# --- Login banner ---
- name: Deploy login banners (/etc/issue and /etc/issue.net)
  ansible.builtin.copy:
    content: |
      NOTICE: This system is for authorized users only. Unauthorized access
      or use is strictly prohibited and may result in disciplinary action
      and/or criminal prosecution. All activities on this system may be
      monitored, recorded, and audited. By accessing this system, you
      consent to such monitoring and recording.
    dest: "{{ item }}"
    mode: "0644"
  loop: [/etc/issue, /etc/issue.net]
  when: not csb_rhel  # no IT banner at home
  failed_when: false

- name: Account hardening
  ansible.builtin.import_tasks: account_hardening.yml
  tags: [account, become]

- name: System-level dconf hardening
  ansible.builtin.include_tasks: dconf.yml
  when:
    - '"gdm.service" in ansible_facts.services'
    - not csb_rhel

# --- AIDE cleanup when disabled (prevents one-way ratchet) ---
# When system_aide_enabled is toggled false, stop and remove the AIDE infrastructure
# so aide-check.timer doesn't keep running on an unmanaged installation.
- name: Remove AIDE infrastructure when disabled
  when:
    - is_dnf
    - not (system_aide_enabled | bool)
    - not csb_rhel  # CSB IT manages AIDE baseline; don't interfere
  block:
    - name: Disable and stop aide-check.timer when AIDE disabled
      ansible.builtin.systemd:
        name: aide-check.timer
        state: stopped
        enabled: false
        daemon_reload: true
      failed_when: false

    - name: Remove AIDE systemd unit files when disabled
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/aide-check.service
        - /etc/systemd/system/aide-check.timer
        - /etc/systemd/system/aide-notify@.service
        - "/etc/systemd/system/{{ 'dnf5-automatic' if is_dnf5 else 'dnf-automatic' }}.service.d/aide-update.conf"  # yamllint disable-line rule:line-length
      loop_control:
        label: "{{ item }}"
      register: system_aide_unit_removal

    - name: Reload systemd after removing AIDE units  # noqa: no-handler
      ansible.builtin.systemd:
        daemon_reload: true
      when: system_aide_unit_removal.changed

    - name: Remove aide package when AIDE disabled
      ansible.builtin.dnf:
        name: aide
        state: absent

- name: AIDE configuration
  ansible.builtin.include_tasks: aide.yml
