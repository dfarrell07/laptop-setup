---
# roles/system/tasks/main.yml
# System hardening: firewall, sysctl, kernel lockdown, auditd, services.
# All tasks require become (Play 1 has become: true at play level).

# --- SECURITY: Input validation for sysctl key and value format ---
# Prevents injection attacks via newlines, shell metacharacters in sysctl keys and values.
# This assertion runs before any hardening tasks to catch malformed input early.
- name: "SECURITY: Validate sysctl key and value format in all extra dicts"
  ansible.builtin.assert:
    that:
      - "_sysctl_keys | reject('match', _sysctl_key_re) | list | length == 0"
      - "(_sysctl_values_invalid | length == 0)"
    fail_msg: >-
      Invalid sysctl key or value format.
      Sysctl keys must match [a-zA-Z0-9._-]+ only.
      Sysctl values must be alphanumeric, dots, slashes, hyphens, underscores, pipes only (no other shell metacharacters).
      Found invalid keys: {{ _sysctl_keys | reject('match', _sysctl_key_re) | list }}
      Found invalid values: {{ _sysctl_values_invalid }}
  vars:
    _sysctl_key_re: '^[a-zA-Z0-9._-]+\Z'
    _sysctl_value_re: '^[a-zA-Z0-9._/|-]+( [a-zA-Z0-9._/|-]+)*\Z'  # multi-number values: '4 4 1 7'
    _sysctl_keys: "{{ (system_sysctl_extra.keys() | list) + (system_sysctl_extra_additional.keys() | list) }}"
    _sysctl_all_dicts: "{{ [system_sysctl_extra | default({}), system_sysctl_extra_additional | default({})] }}"
    # yamllint disable-line rule:line-length
    _sysctl_values_invalid: >-
      {{ _sysctl_all_dicts | map('dict2items') | flatten | map(attribute='value') | map('string')
      | reject('match', _sysctl_value_re) | list }}
  when: not (system_is_container or csb_rhel)
  tags: [always]

# --- Gather service facts (needed for firewalld/auditd/resolved conditionals) ---
- name: Gather service facts
  ansible.builtin.service_facts:
  when: not system_is_container  # systemctl list-units --all crashes PID 1 in Debian 13 privileged Podman containers

# Containers skip service_facts; readers use (ansible_facts.services | default({})). Do not
# set_fact ansible_facts here: that creates a variable shadowing the real facts for the
# rest of the run, hiding facts gathered later (e.g. package_facts in repos_dnf).

# --- Prerequisites (needed by seport and the SELinux block; it also pulls in the SELinux Python bindings) ---
# Not tagged with a chunk: two chunks (sys_baseline, sys_remote_access) need it and a task is skipped when ANY of
# its tags is skipped. It is installed only when at least one of them is not in --skip-tags.
- name: Ensure policycoreutils-python-utils is installed
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  when:
    - is_dnf
    - not csb_rhel
    - "['sys_baseline', 'sys_remote_access'] | difference(ansible_skip_tags) | length > 0"
    - not system_is_container  # RPM post-install calls daemon-reload, crashes Podman container systemd; installed in prepare instead

- name: "SECURITY: Validate system_kernel_lockdown value (injection guard)"
  ansible.builtin.assert:
    that:
      - system_kernel_lockdown | string is match('^(integrity|confidentiality|none|)$')
    fail_msg: >-
      SECURITY: system_kernel_lockdown has an invalid value: '{{ system_kernel_lockdown }}'.
      Threat: a crafted -e override like "none' --update-kernel=ALL --args='" passes shlex
      through the old cmd: string form and disables lockdown on all kernels after reboot.
      Allowed values: integrity, confidentiality, none, or empty string (disabled).
      Input: system_kernel_lockdown={{ system_kernel_lockdown }}.
      Fix: remove the override or set system_kernel_lockdown to a permitted value in config.yml.
  when: not (system_is_container or csb_rhel)
  tags: [always]

- name: "SECURITY: Find systemd drop-in directories under /etc/systemd/system"
  ansible.builtin.find:
    paths: /etc/systemd/system
    file_type: any
    patterns: "*.d"
  register: _systemd_dropin_find
  when: not system_is_container
  tags: [always]

# Tolerate only an empty, root-owned, non-writable sshd.service.d; any entry in it is unexpected.
- name: Inspect the SSH service drop-in directory
  ansible.builtin.stat:
    path: /etc/systemd/system/sshd.service.d
    follow: false
    get_checksum: false
  register: _system_ssh_dropin_stat
  when: not system_is_container
  tags: [always]

- name: Inspect all entries in the SSH service override directory
  ansible.builtin.find:
    paths: /etc/systemd/system/sshd.service.d
    file_type: any
    recurse: true
    hidden: true
  register: _system_ssh_dropin_entries
  when:
    - not system_is_container
    - _system_ssh_dropin_stat.stat.isdir | default(false)
    - not _system_ssh_dropin_stat.stat.islnk | default(false)
  tags: [always]

- name: Recognize the safe empty SSH service drop-in directory
  ansible.builtin.set_fact:
    _system_empty_ssh_dropin: >-
      {{ (_system_ssh_dropin_stat.stat.isdir | default(false))
         and not (_system_ssh_dropin_stat.stat.islnk | default(false))
         and (_system_ssh_dropin_stat.stat.uid | default(-1)) == 0
         and (_system_ssh_dropin_stat.stat.mode | default('')) is match('^[0-7]*[0145][0145]$')
         and (_system_ssh_dropin_entries.matched | default(-1)) == 0 }}
  when: not system_is_container
  tags: [always]

- name: "SECURITY: Warn on unexpected systemd drop-in directories (CSB — IT may deploy drop-ins)"
  ansible.builtin.debug:
    msg: >-
      WARNING: Unexpected systemd drop-in dir(s) under /etc/systemd/system/.
      On CSB machines IT may deploy service drop-ins — verify these are IT-managed.
      Unexpected: {{ _unexpected_dropin_dirs | join(', ') }}
      Whitelist: {{ system_systemd_dropin_whitelist | join(', ') }}
      To suppress: add dir name(s) to system_systemd_dropin_whitelist in config.yml.
  vars:
    _found_dropin_dirs: >-
      {{ _systemd_dropin_find.files | default([]) | map(attribute='path') | map('basename') | list }}
    _unexpected_dropin_dirs: >-
      {{ _found_dropin_dirs
         | reject('in', system_systemd_dropin_whitelist + (['sshd.service.d'] if _system_empty_ssh_dropin else [])
           + system_csb_systemd_dropin_whitelist) | list }}
  when:
    - csb_detected
    - not system_is_container
    - _unexpected_dropin_dirs | length > 0
  tags: [always]

- name: "SECURITY: Fail on unexpected systemd drop-in directories (pre-plant backdoor guard)"
  ansible.builtin.assert:
    that:
      - _unexpected_dropin_dirs | length == 0
    fail_msg: |
      SECURITY: Unexpected systemd drop-in dir(s) under /etc/systemd/system/.
      Threat: a pre-planted override.conf with ExecStartPre= executes as root
      when a handler restarts the service (sshd, NetworkManager, polkit, dbus).
      Unexpected: {{ _unexpected_dropin_dirs | join(', ') }}
      Whitelist: {{ system_systemd_dropin_whitelist | join(', ') }}
      Fix: remove the unexpected director(ies), or add them to
      system_systemd_dropin_whitelist in config.yml if they are legitimate.
  vars:
    _found_dropin_dirs: >-
      {{ _systemd_dropin_find.files | default([]) | map(attribute='path') | map('basename') | list }}
    _unexpected_dropin_dirs: >-
      {{ _found_dropin_dirs
         | reject('in', system_systemd_dropin_whitelist + (['sshd.service.d'] if _system_empty_ssh_dropin else [])) | list }}
  when:
    - not csb_detected
    - not system_is_container
  tags: [always]

- name: "SECURITY: Find /etc/dbus-1/system.d files not owned by any RPM (pre-plant audit)"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      rpm -q rpm &>/dev/null || { echo 'rpm database query failed' >&2; exit 3; }
      find /etc/dbus-1/system.d -maxdepth 1 -type f \
        | while IFS= read -r f; do rpm -qf "$f" &>/dev/null || printf '%s\n' "$f"; done
    executable: /bin/bash
  register: _dbus_unowned
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - not csb_rhel
    - not system_is_container
    - is_dnf
  tags: [always]

- name: "WARNING: /etc/dbus-1/system.d ownership scan itself failed"
  ansible.builtin.debug:
    msg: >-
      WARNING: the pre-plant ownership scan of /etc/dbus-1/system.d failed
      (rc={{ _dbus_unowned.rc | default('n/a') }}), so unowned files were NOT checked.
      stderr: {{ _dbus_unowned.stderr | default('') | trim }}
  when:
    - _dbus_unowned is not skipped
    - (_dbus_unowned.rc | default(1)) != 0
    - not csb_rhel
    - not system_is_container
    - is_dnf
  tags: [always]

- name: "SECURITY: Warn on /etc/dbus-1/system.d files not owned by any RPM (CSB — IT may deploy policies)"
  ansible.builtin.debug:
    msg: >-
      WARNING: Unpackaged file(s) in /etc/dbus-1/system.d/.
      On CSB machines IT may deploy non-RPM D-Bus policy files — verify these are IT-managed.
      Unpackaged: {{ _dbus_unowned.stdout_lines | default([]) | difference(system_dbus_system_d_allowlist) | list }}
      To suppress: add full path(s) to system_dbus_system_d_allowlist in config.yml.
  when:
    - csb_detected
    - not system_is_container
    - is_dnf
    - (_dbus_unowned.stdout_lines | default([]) | difference(system_dbus_system_d_allowlist) | list) | length > 0
  tags: [always]

- name: "SECURITY: Fail on /etc/dbus-1/system.d files not owned by any RPM (pre-plant attack)"
  ansible.builtin.fail:
    msg: >-
      SECURITY: Unpackaged file(s) in /etc/dbus-1/system.d/.
      Attack: a pre-planted D-Bus policy grants an unprivileged process ownership of a
      privileged bus name (e.g., org.freedesktop.PolicyKit1), enabling polkit impersonation
      and privileged D-Bus message injection.
      Unpackaged: {{ _dbus_unowned.stdout_lines | default([]) | difference(system_dbus_system_d_allowlist) | list }}
      Fix: remove the file(s) or add full path(s) to system_dbus_system_d_allowlist in config.yml.
  when:
    - not csb_detected
    - not system_is_container
    - is_dnf
    - (_dbus_unowned.stdout_lines | default([]) | difference(system_dbus_system_d_allowlist) | list) | length > 0
  tags: [always]

- name: "Hardening core (mounts, firewall, kernel, sysctl, coredumps, modules blacklist, kernel lockdown)"
  ansible.builtin.import_tasks: hardening_core.yml

# Apply all handlers queued so far (flush_handlers is play-wide) now: force_handlers is deliberately
# false, so a later failure would otherwise drop them, and the rerun sees no change and never applies the config.
- name: Apply pending handlers (hardening core)
  ansible.builtin.meta: flush_handlers

# --- Load kernel modules for kind AFTER sysctl.yml deploys 90-hardening.conf ---
# NOTE: with system_modules_disabled: 1 (opt-in; default 0), kernel-modules-lockdown.service
# blocks ALL kernel module loading after provisioning until reboot, so modules needed later
# must be loaded here first. Rationale: system_modules_disabled in roles/system/defaults/main.yml.
#
# kernel.modules_disabled=1 is a one-way ratchet (cannot be disabled until reboot).
# Task order satisfies two constraints:
# 1. kernel_modules_kind.yml runs AFTER sysctl.yml deploys 90-hardening.conf
#    (fixes bridge-nf-call-iptables assertion failure on first provision)
# 2. modprobe runs BEFORE the final module lockdown service activates the ratchet
#    (boot activation is also ordered after networking and firewalld)
- name: Kernel modules for kind
  ansible.builtin.include_tasks: kernel_modules_kind.yml
  when: not system_is_container and not csb_rhel
  tags: [sys_sysctl]
  # Always load on non-container, non-RHEL-CSB hosts — unused modules are harmless; NOT loading them
  # when needed is catastrophic with modules_disabled=1. The include file already uses
  # failed_when:false to tolerate Intel/AMD mismatch.

- name: "GRUB bootloader password (CIS 1.4.2)"
  ansible.builtin.import_tasks: grub_password.yml
  tags: [sys_optional]

# Apply all handlers queued so far (flush_handlers is play-wide) now: force_handlers is deliberately
# false, so a later failure would otherwise drop them, and the rerun sees no change and never applies the config.
- name: Apply pending handlers (GRUB)
  ansible.builtin.meta: flush_handlers

# --- Auditd ---
- name: Auditd tasks
  ansible.builtin.import_tasks: auditd.yml
  tags: [sys_auditd]

# Apply all handlers queued so far (flush_handlers is play-wide) now: force_handlers is deliberately
# false, so a later failure would otherwise drop them, and the rerun sees no change and never applies the config.
- name: Apply pending handlers (auditd)
  ansible.builtin.meta: flush_handlers

- name: "Bolt hardening"
  ansible.builtin.import_tasks: bolt.yml
  tags: [sys_baseline]

- name: Authselect and fingerprint auth
  ansible.builtin.import_tasks: authselect_fingerprint.yml
  tags: [sys_signin]

- name: "Service masking"
  ansible.builtin.import_tasks: service_masking.yml
  tags: [sys_baseline]

- name: "Logind configuration"
  ansible.builtin.import_tasks: logind.yml
  tags: [sys_baseline]

- name: "Service enable/disable"
  ansible.builtin.import_tasks: services.yml
  tags: [sys_baseline]

- name: USBGuard install/enable
  ansible.builtin.import_tasks: usbguard.yml
  tags: [sys_usbguard]

# Apply all handlers queued so far (flush_handlers is play-wide) now: force_handlers is deliberately
# false, so a later failure would otherwise drop them, and the rerun sees no change and never applies the config.
- name: Apply pending handlers (baseline, USBGuard)
  ansible.builtin.meta: flush_handlers

- name: Firmware updates
  ansible.builtin.import_tasks: firmware.yml
  tags: [sys_baseline]

- name: "SECURITY: Validate system_ssh_extra_allow_users entries (sshd AllowUsers injection guard)"
  ansible.builtin.assert:
    that:
      - system_ssh_extra_allow_users | default([]) is sequence
      - system_ssh_extra_allow_users | default([]) is not string
      - >-
        system_ssh_extra_allow_users | default([])
        | map('string') | select()
        | reject('match', '^[a-z_][a-z0-9_.@-]{0,31}$') | list | length == 0
    fail_msg: >-
      SECURITY: system_ssh_extra_allow_users contains an invalid entry.
      Threat: a newline-embedded entry like "validuser\nPermitRootLogin yes" passes sshd -t
      and loads a malicious directive overriding PermitRootLogin no.
      Input: system_ssh_extra_allow_users={{ system_ssh_extra_allow_users | default([]) | to_json }}.
      Mechanism: entries are joined verbatim into AllowUsers in sshd_config.d/00-hardening.conf;
      a newline splits the directive and the next token is parsed as a top-level sshd directive.
      Impact: PermitRootLogin or other hardened directives silently overridden; root SSH enabled.
      Fix: each entry must match ^[a-z_][a-z0-9_.@-]{0,31}$ (valid Linux username, 32 chars max).
      Offending entries: {{ system_ssh_extra_allow_users | default([]) | reject('match', '^[a-z_][a-z0-9_.@-]{0,31}$') | list }}.
  when:
    - not csb_rhel
    - system_ssh_extra_allow_users | default([]) | length > 0
  tags: [always]

- name: SSHD hardening, SELinux port label, and crypto policy
  ansible.builtin.import_tasks: sshd.yml
  tags: [sys_remote_access]

- name: NetworkManager configuration
  ansible.builtin.import_tasks: nm.yml
  tags: [sys_remote_access]

- name: Dnf-automatic
  ansible.builtin.import_tasks: dnf_automatic.yml
  when: not csb_detected  # IT owns update policy on CSB (RHEL and hybrid Fedora)
  tags: [sys_time_dns]

- name: DNS-over-TLS
  ansible.builtin.import_tasks: dns_over_tls.yml
  when: not system_is_container
  tags: [sys_time_dns]

# --- Session timeout (CIS 5.5.5: TMOUT <= 900s) ---
- name: "Session timeout"
  ansible.builtin.import_tasks: session_timeout.yml
  tags: [sys_optional]

- name: Timezone and locale
  ansible.builtin.import_tasks: timezone_locale.yml
  tags: [sys_baseline]

- name: Chrony NTS
  ansible.builtin.import_tasks: chrony.yml
  # chrony apt install + systemd start hang in Debian 13 privileged Podman containers; IT owns time sync on CSB
  when: not system_is_container and not csb_detected
  tags: [sys_time_dns]

# Apply all handlers queued so far (flush_handlers is play-wide) now: force_handlers is deliberately
# false, so a later failure would otherwise drop them, and the rerun sees no change and never applies the config.
- name: Apply pending handlers (chrony)
  ansible.builtin.meta: flush_handlers

- name: PAM hardening (faillock, pwhistory, pwquality, pam_wheel)
  ansible.builtin.import_tasks: pam.yml
  tags: [sys_signin]

- name: Journald persistent logging
  ansible.builtin.import_tasks: journald.yml
  tags: [sys_baseline]

- name: Logrotate for sudo.log
  ansible.builtin.import_tasks: logrotate_sudo.yml
  tags: [sys_signin]  # sudo.log is written by the sudoers drop-in that sys_signin installs

- name: "Cron access restriction"
  ansible.builtin.import_tasks: cron.yml
  tags: [sys_baseline]

- name: Deploy login banners (/etc/issue and /etc/issue.net)
  ansible.builtin.copy:
    content: |
      NOTICE: This system is for authorized users only. Unauthorized access
      or use is strictly prohibited and may result in disciplinary action
      and/or criminal prosecution. All activities on this system may be
      monitored, recorded, and audited. By accessing this system, you
      consent to such monitoring and recording.
    dest: "{{ item }}"
    mode: "0644"
  loop: [/etc/issue, /etc/issue.net]
  when:
    - not csb_rhel  # RHEL CSB: IT maintains compliant login banner; csb-fedora does not touch /etc/issue
    - not system_is_container  # /etc/issue writes trigger getty inotify; crashes privileged Podman container PID 1
  tags: [sys_baseline]

- name: Account hardening
  ansible.builtin.import_tasks: account_hardening.yml
  tags: [become, sys_signin]

- name: System-level dconf hardening
  ansible.builtin.include_tasks: dconf.yml
  when:
    - '"gdm.service" in (ansible_facts.services | default({}))'
    - not csb_rhel
  tags: [sys_baseline]

- name: "AIDE cleanup"
  ansible.builtin.import_tasks: aide_cleanup.yml
  tags: [sys_optional]

- name: AIDE configuration
  ansible.builtin.import_tasks: aide.yml
  tags: [sys_optional]

- name: Apply the module loading lock after system provisioning and handlers
  ansible.builtin.include_tasks: kernel_modules_lockdown.yml
  when:
    - not system_is_container
    - not csb_rhel
  tags: [sys_optional]
