---
# roles/system/tasks/main.yml
# System hardening: firewall, sysctl, kernel lockdown, auditd, services.
# All tasks require become (Play 1 has become: true at play level).

# --- Gather service facts (needed for firewalld/auditd/resolved conditionals) ---
- name: Gather service facts
  ansible.builtin.service_facts:
  when: not system_is_container  # systemctl list-units --all crashes PID 1 in Debian 13 privileged Podman containers

- name: Seed empty service facts for container environments
  # Ensures ansible_facts.services is defined so downstream 'is defined' guards
  # (firewall.yml, sshd.yml, main.yml gdm check) evaluate safely to False.
  ansible.builtin.set_fact:
    ansible_facts: "{{ ansible_facts | combine({'services': {}}) }}"
  when: system_is_container

# --- Prerequisites (needed by seport and other system tasks) ---
- name: Ensure policycoreutils-python-utils is installed
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  when:
    - is_dnf
    - not csb_rhel
    - not system_is_container  # RPM post-install calls daemon-reload, crashes Podman container systemd; installed in prepare instead

- name: "Hardening core (mounts, firewall, kernel, sysctl, coredumps, modules blacklist, kernel lockdown)"
  ansible.builtin.import_tasks: hardening_core.yml

# --- Auditd ---
- name: Auditd tasks
  ansible.builtin.import_tasks: auditd.yml

- name: "Bolt hardening"
  ansible.builtin.import_tasks: bolt.yml

- name: Authselect and fingerprint auth
  ansible.builtin.import_tasks: authselect_fingerprint.yml

- name: "Service masking"
  ansible.builtin.import_tasks: service_masking.yml

- name: "Logind configuration"
  ansible.builtin.import_tasks: logind.yml

- name: "Service enable/disable"
  ansible.builtin.import_tasks: services.yml

- name: Firmware updates
  ansible.builtin.import_tasks: firmware.yml

- name: SSHD hardening, SELinux port label, and crypto policy
  ansible.builtin.import_tasks: sshd.yml

- name: Kernel modules for kind
  ansible.builtin.include_tasks: kernel_modules_kind.yml
  when: profile == 'work' or install_virtualization | bool

- name: NetworkManager configuration
  ansible.builtin.import_tasks: nm.yml

- name: Dnf-automatic
  ansible.builtin.import_tasks: dnf_automatic.yml

- name: DNS-over-TLS
  ansible.builtin.import_tasks: dns_over_tls.yml

# --- Session timeout (CIS 5.5.5: TMOUT <= 900s) ---
- name: "Session timeout"
  ansible.builtin.import_tasks: session_timeout.yml

- name: Timezone and locale
  ansible.builtin.import_tasks: timezone_locale.yml

- name: Chrony NTS
  ansible.builtin.import_tasks: chrony.yml
  when: not system_is_container  # chrony apt install + systemd start hang in Debian 13 privileged Podman containers

- name: PAM hardening (faillock, pwhistory, pwquality, pam_wheel)
  ansible.builtin.import_tasks: pam.yml

- name: Journald persistent logging
  ansible.builtin.import_tasks: journald.yml

- name: Logrotate for sudo.log
  ansible.builtin.import_tasks: logrotate_sudo.yml

- name: "Cron access restriction"
  ansible.builtin.import_tasks: cron.yml

- name: Login banner
  ansible.builtin.import_tasks: login_banner.yml

- name: Account hardening
  ansible.builtin.import_tasks: account_hardening.yml
  tags: [account, become]

- name: System-level dconf hardening
  ansible.builtin.include_tasks: dconf.yml
  when:
    - '"gdm.service" in ansible_facts.services'
    - not csb_rhel

- name: "AIDE cleanup"
  ansible.builtin.import_tasks: aide_cleanup.yml

- name: AIDE configuration
  ansible.builtin.import_tasks: aide.yml
