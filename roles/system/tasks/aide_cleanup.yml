---
# roles/system/tasks/aide_cleanup.yml
# AIDE cleanup when system_aide_enabled=false (prevents one-way ratchet).
# Stops aide-check.timer, removes systemd units, and removes the aide package.
# --- AIDE cleanup when disabled (prevents one-way ratchet) ---
# When system_aide_enabled is toggled false, stop and remove the AIDE infrastructure
# so aide-check.timer doesn't keep running on an unmanaged installation.
- name: Remove AIDE infrastructure when disabled
  when:
    - is_dnf
    - not (system_aide_enabled | bool)
    - not csb_rhel  # CSB IT manages AIDE baseline; don't interfere
    - not system_is_container  # daemon_reload: true always runs systemctl daemon-reload, crashing privileged Podman container PID 1
  block:
    - name: Disable and stop aide-check.timer when AIDE disabled
      ansible.builtin.systemd:
        name: aide-check.timer
        state: stopped
        enabled: false
        daemon_reload: true
      failed_when: false

    - name: Remove AIDE systemd unit files when disabled
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/aide-check.service
        - /etc/systemd/system/aide-check.timer
        - /etc/systemd/system/aide-notify@.service
        - "/etc/systemd/system/{{ 'dnf5-automatic' if is_dnf5 else 'dnf-automatic' }}.service.d/aide-update.conf"  # yamllint disable-line rule:line-length
      loop_control:
        label: "{{ item }}"
      register: system_aide_unit_removal

    - name: Reload systemd after removing AIDE units  # noqa: no-handler
      ansible.builtin.systemd:
        daemon_reload: true
      when: system_aide_unit_removal.changed

    - name: Remove aide package when AIDE disabled
      ansible.builtin.dnf:
        name: aide
        state: absent

    - name: Warn that AIDE database is being removed
      ansible.builtin.debug:
        msg: 'AIDE database at /var/lib/aide/aide.db.gz is being removed (system_aide_enabled=false). Re-enabling AIDE will require a full 5-10 minute baseline rebuild.'  # yamllint disable-line rule:line-length

    - name: Remove AIDE database when AIDE disabled (force fresh init on re-enable)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/aide/aide.db.gz
        - /var/lib/aide/aide.db.new.gz
