---
# roles/system/tasks/journald.yml
# --- Journald persistent logging and retention ---
# Skipped entirely in containers: inotify on /etc/systemd/journald.conf.d and creating
# /var/log/journal both trigger journald restart, which crashes privileged Podman containers.
# Rationale for /var/log/journal: Storage=auto writes there only when the directory exists;
# creating it is additive. If CSB IT uses Storage=volatile in their own drop-in, it wins;
# if they use Storage=auto, persistent logging is a security benefit (logs survive reboots).
# journald persistence does NOT interfere with SIEM forwarding — CSB's SIEM pipeline uses
# audisp-remote (auditd), a completely separate subsystem.
# The opinionated config (rate limits, disk quota) is also CSB-guarded because those specific
# numbers may conflict with IT's journald tuning or centralized log management.
- name: Configure journald (skip in containers)
  when: not system_is_container
  block:
    - name: Ensure journald drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"

    - name: Ensure /var/log/journal exists for persistent storage
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: "2755"

    - name: Remove journald hardening config on CSB RHEL
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d/99-hardening.conf
        state: absent
      when: csb_rhel
      notify: Restart systemd-journald

    - name: Deploy journald hardening config
      ansible.builtin.copy:
        content: |
          # {{ ansible_managed }}
          [Journal]
          Storage=persistent
          SystemMaxUse={{ system_journald_max_use }}
          MaxRetentionSec={{ system_journald_max_retention }}
          SystemKeepFree={{ system_journald_keep_free }}
          RateLimitIntervalSec=30s
          RateLimitBurst={{ system_journald_rate_burst }}
        dest: /etc/systemd/journald.conf.d/99-hardening.conf
        mode: "0644"
      when: not csb_rhel
      notify: Restart systemd-journald
