---
# roles/system/tasks/logrotate_sudo.yml
# --- Logrotate for sudo.log (created by sudoers Defaults logfile) ---
- name: Install logrotate
  ansible.builtin.package:
    name: logrotate
    state: present
  when: not system_is_container  # apt install logrotate triggers deb-systemd-helper daemon-reload, crashes Debian containers

- name: Deploy logrotate config for sudo.log
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      /var/log/sudo.log {
          weekly
          rotate 26
          compress
          delaycompress
          missingok
          notifempty
          create 0600 root root
      }
    dest: /etc/logrotate.d/sudo
    mode: "0644"
  when:
    - not csb_rhel  # only meaningful when sudoers hardening task below creates /var/log/sudo.log
    - not system_is_container  # logrotate not installed in containers (guarded above); /etc/logrotate.d does not exist

- name: Remove logrotate config for sudo.log on CSB RHEL
  ansible.builtin.file:
    path: /etc/logrotate.d/sudo
    state: absent
  when:
    - csb_rhel
    - not system_is_container
