---
# roles/git_repos/tasks/main.yml
# Clone repos (HTTPS or SSH), add fork remotes. Filter by category.

# --- Pre-role validation (defense-in-depth: protects against --start-at-task / --skip-tags always bypass) ---
- name: Assert git_repos_base_dir is within user home directory (path traversal guard)
  ansible.builtin.assert:
    that:
      - git_repos_base_dir | string is match(ansible_facts['user_dir'] | regex_escape ~ '(/.*)?$')
      - git_repos_base_dir | string is not search('\.\.|\./')
    fail_msg: >-
      SECURITY: git_repos_base_dir must be within the user home directory.
      Input: git_repos_base_dir='{{ git_repos_base_dir }}' (from config.yml or -e flag).
      Mechanism: git_repos_base_dir is mkdir'd and used as clone destination without path
      validation; a value outside home dir writes repos to attacker-chosen locations.
      Example: make repos -e git_repos_base_dir=/etc/cron.d clones repo files as
      root-owned cron entries executed system-wide.
      Impact: arbitrary file write outside ~/src — LPE or persistent code execution.
      Fix: omit git_repos_base_dir or set it under {{ ansible_facts['user_dir'] }} (e.g. ~/src).
  tags: [always]

- name: Check gh auth status
  ansible.builtin.command:
    cmd: gh auth status
  register: git_repos_gh_auth
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run even in --check mode

- name: Warn if gh missing or not authenticated
  ansible.builtin.debug:
    msg: >-
      gh not found or not authenticated: run 'make packages', then
      'gh auth login', before 'make repos'. Cloning will fail for private repos.
  when: git_repos_gh_auth.rc != 0

- name: Determine active categories for profile
  ansible.builtin.set_fact:
    git_repos_active_categories: >-
      {{
        [git_repos_category_filter] if git_repos_category_filter | length > 0
        else (git_repos_work_categories if profile == 'work'
        else git_repos_personal_categories)
      }}

- name: Filter repos by category and enabled status
  ansible.builtin.set_fact:
    git_repos_filtered: >-
      {{
        (git_repos_list | selectattr('category', 'in', git_repos_active_categories)
        | rejectattr('enabled', 'defined') | list)
        + (git_repos_list | selectattr('category', 'in', git_repos_active_categories)
        | selectattr('enabled', 'defined') | rejectattr('enabled', 'equalto', false) | list)
      }}

- name: Fail when explicit category filter matches no enabled repos
  ansible.builtin.fail:
    msg: >-
      Category '{{ git_repos_category_filter }}' matched no enabled repos.
      Valid categories: {{ (git_repos_work_categories + git_repos_personal_categories) | unique | sort | join(', ') }}.
  when:
    - git_repos_category_filter | length > 0
    - git_repos_filtered | length == 0

# Hosts other than github.com (internal ones answer only on the VPN) get a TCP probe, no ssh and so no key touch: the
# URL's port, else 22 for git@ and ssh://, else 443 for https:// (not probed when a proxy is set: git would use it). Repos
# on a host and port that do not answer are left out of this run, so their clones and make update's pulls are not
# reported as failures. Tested in scripts/test-git-repos.py.
- name: Set git hosts to probe
  ansible.builtin.set_fact:
    _git_repos_probe: >-
      {{ git_repos_filtered | map(attribute='url')
         | map('regex_replace', '^git@([^:/]+):.*$', '\1:22')
         | map('regex_replace', '^(?:ssh|https)://(?:[^@/]+@)?([^/:]+):([0-9]+)/.*$', '\1:\2')
         | map('regex_replace', '^ssh://(?:[^@/]+@)?([^/:]+)/.*$', '\1:22')
         | map('regex_replace', '^https://(?:[^@/]+@)?([^/:]+)/.*$', '\1:443')
         | select('match', '^[A-Za-z0-9.-]+:[0-9]+$') | reject('match', '^github\.com:') | unique
         | reject('in', _git_repos_https if (lookup('env', 'https_proxy') or lookup('env', 'HTTPS_PROXY')) else []) | list }}
  vars:
    _git_repos_https: >-
      {{ git_repos_filtered | map(attribute='url') | select('match', '^https://')
         | map('regex_replace', '^https://(?:[^@/]+@)?([^/:]+)(?::([0-9]+))?/.*$', '\1:\2')
         | map('regex_replace', ':$', ':443') | list }}

- name: Probe git hosts
  ansible.builtin.wait_for:
    host: "{{ item | regex_replace(':[0-9]+$', '') }}"
    port: "{{ item | regex_replace('^.*:', '') | int }}"
    timeout: 3
  loop: "{{ _git_repos_probe }}"
  register: _git_repos_probed
  failed_when: false  # an unreachable host is reported below, not as a failed task
  check_mode: false  # read-only probe; wait_for is otherwise skipped in check mode

- name: Skip repos on unreachable git hosts
  vars:
    # host:port pairs whose probe timed out (it has no state)
    _unreachable: "{{ _git_repos_probed.results | default([]) | rejectattr('state', 'defined') | map(attribute='item') | list }}"
    # the URLs that use one of them: an explicit port, or the scheme's default
    _unreachable_urls: >-
      {%- set ps = [] -%}
      {%- for hp in _unreachable -%}
      {%- set h = hp | regex_replace(':[0-9]+$', '') | regex_escape -%}
      {%- set port = hp | regex_replace('^.*:', '') -%}
      {%- set _ = ps.append('^[a-z]+://([^@/]+@)?' ~ h ~ ':' ~ port ~ '/') -%}
      {%- if port == '22' -%}{%- set _ = ps.extend(['^git@' ~ h ~ ':', '^ssh://([^@/]+@)?' ~ h ~ '/']) -%}{%- endif -%}
      {%- if port == '443' -%}{%- set _ = ps.append('^https://([^@/]+@)?' ~ h ~ '/') -%}{%- endif -%}
      {%- endfor -%}
      {{ ps | join('|') }}
  when: _unreachable | length > 0
  block:
    - name: Warn about unreachable git hosts
      ansible.builtin.debug:
        msg: >-
          Skipping repos on {{ _unreachable | map('regex_replace', ':[0-9]+$', '') | unique | join(', ') }} this run:
          unreachable (VPN down?) on {{ _unreachable | join(', ') }}. Run 'make apply CHUNK=repos' once it answers.

    - name: Drop repos on unreachable git hosts
      ansible.builtin.set_fact:
        git_repos_filtered: "{{ git_repos_filtered | rejectattr('url', 'search', _unreachable_urls) | list }}"

# Internal hosts (dotfiles_ssh_work_hosts) take the Red Hat git key the ssh role deploys from the vault; without it
# every clone there would fail with "Permission denied".
- name: Set internal git hosts in use
  ansible.builtin.set_fact:
    _git_repos_work_hosts: >-
      {{ dotfiles_ssh_work_hosts | default([]) | map(attribute='host') | select('in', git_repos_filtered | map(attribute='url')
         | map('regex_replace', '^(git@|[a-z]+://([^@/]+@)?)([^:/]+)[:/].*$', '\3') | list) | list }}

- name: Check for the Red Hat git key
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.ssh/{{ dotfiles_ssh_redhat_key_basename }}"
  register: _git_repos_rh_key
  when: _git_repos_work_hosts | length > 0

- name: Skip repos on internal hosts without the Red Hat git key
  when:
    - _git_repos_work_hosts | length > 0
    - not _git_repos_rh_key.stat.exists | default(true)
  block:
    - name: Warn about the missing Red Hat git key
      ansible.builtin.debug:
        msg: >-
          Skipping repos on {{ _git_repos_work_hosts | join(', ') }}: no Red Hat git key
          (~/.ssh/{{ dotfiles_ssh_redhat_key_basename }}): add vault_rh_git_key (make vault-edit), then make apply
          CHUNK=ssh_client.

    - name: Drop repos on internal hosts
      ansible.builtin.set_fact:
        git_repos_filtered: >-
          {{ git_repos_filtered | rejectattr('url', 'search',
             '^(git@|[a-z]+://([^@/]+@)?)(' ~ (_git_repos_work_hosts | map('regex_escape') | join('|')) ~ ')[:/]') | list }}

- name: Stat base directory without following symlinks
  ansible.builtin.stat:
    path: "{{ git_repos_base_dir }}"
    follow: false
  register: _git_repos_base_dir_stat
  when: git_repos_filtered | length > 0

- name: Assert base directory is not a symlink
  ansible.builtin.assert:
    that: not _git_repos_base_dir_stat.stat.exists or not _git_repos_base_dir_stat.stat.islnk
    fail_msg: >-
      SECURITY: git_repos_base_dir ({{ git_repos_base_dir }}) is a symlink. A malicious
      package could pre-create ~/src as a symlink to a privileged path (e.g. /etc/cron.d),
      causing clone tasks to write attacker-controlled content there. Remove the symlink and
      re-run, or set git_repos_base_dir to a non-symlinked path.
  when: git_repos_filtered | length > 0

- name: Ensure base directory exists
  ansible.builtin.file:
    path: "{{ git_repos_base_dir }}"
    state: directory
    mode: "u+rwx"  # never widens a mode the user tightened (e.g. 0700)
  when: git_repos_filtered | length > 0

- name: Set up git-lfs smudge/clean filter drivers
  ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/git-lfs-setup.yml"
  when: git_repos_filtered | length > 0

# accept_newhostkey below would trust an unseen host key, so SSH repos are cloned only from
# hosts the ssh role already seeded (pinned fingerprint, TOFU keyscan or the pinned github.com key).
# Unseeded hosts (off VPN, fingerprint not yet pinned) are deferred to a later 'make apply CHUNK=ssh_client', then
# 'make apply CHUNK=repos', instead of failing the run.
- name: Check SSH git repo hosts are in known_hosts
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -F "{{ item }}" -f "{{ ansible_facts['user_dir'] }}/.ssh/known_hosts"
  loop: >-
    {{ git_repos_filtered | default([]) | map(attribute='url')
       | select('match', '^(git@|ssh://)') | map('regex_replace', '^git@([^:]+):.*', '\1')
       | map('regex_replace', '^ssh://(?:[^@/]+@)?([^/:]+).*', '\1')
       | unique | list }}
  register: _git_repos_known_hosts
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe
  tags: [always]

- name: Defer SSH repos whose host key is not seeded
  vars:
    _unseeded: >-
      {{ _git_repos_known_hosts.results | default([]) | rejectattr('rc', 'equalto', 0)
         | map(attribute='item') | list }}
  when: _unseeded | length > 0
  tags: [always]
  block:
    - name: Warn about deferred SSH repos
      ansible.builtin.debug:
        msg: >-
          Skipping SSH repos on {{ _unseeded | join(', ') }}: no known_hosts entry (host
          unreachable or its fingerprint is not pinned in ssh_work_keyscan_hosts). Pin the
          fingerprint, then run 'make apply CHUNK=ssh_client' and 'make apply CHUNK=repos' on a network that reaches the host.

    - name: Drop SSH repos on unseeded hosts
      ansible.builtin.set_fact:
        git_repos_filtered: >-
          {{ git_repos_filtered | rejectattr('url', 'match',
             '^(git@|ssh://([^@/]+@)?)(' ~ (_unseeded | map('regex_escape') | join('|')) ~ ')[:/]') | list }}

- name: Display repos to clone
  ansible.builtin.debug:
    verbosity: 1
    msg: "Will clone {{ git_repos_filtered | length }} repos (categories: {{ git_repos_active_categories | join(', ') }})"

- name: Clone repositories  # noqa: latest[git] SECURITY WARNING see SECURITY.md Internal SSH Git Host Setup
  ansible.builtin.git:
    repo: "{{ item.url }}"
    dest: "{{ git_repos_base_dir }}/{{ item.dest }}"
    update: false
    # SECURITY: submodule URLs not validated by pre-flight TOFU guard; disable to prevent attacker-controlled .gitmodules redirect
    recursive: false
    depth: "{{ item.depth | default(omit) }}"
    # SECURITY: TOFU: SSH git hostnames should be pre-seeded via
    # ssh_work_keyscan_hosts (github.com exempt — always seeded from a pinned key); add new hosts to ssh_work_keyscan_hosts in config.yml
    accept_newhostkey: true
  environment:
    GIT_TERMINAL_PROMPT: "0"  # prevent interactive credential prompt from hanging make repos
    GIT_CONFIG_NOSYSTEM: "1"  # prevent /etc/gitconfig injection (core.fsmonitor RCE, url.insteadOf redirect)
  loop: "{{ git_repos_filtered }}"
  loop_control:
    label: "{{ item.dest }}"
  register: git_repos_clone_results
  ignore_errors: true  # noqa: ignore-errors — per-item failure must be captured in .results for the Report task below
  timeout: 300

- name: Set available repo destinations fact
  ansible.builtin.set_fact:
    git_repos_available_dests: >-
      {{ git_repos_clone_results.results | default([])
         | rejectattr('failed', 'equalto', true)
         | map(attribute='item.dest') | list }}

# A repo whose entry dropped `depth` (it became one you push to) keeps its shallow, single-branch clone, since the
# clone task never updates existing checkouts: deepen it and track every branch, as a fresh full clone would.
- name: Check full-history repos for a shallow clone  # noqa: command-instead-of-module
  ansible.builtin.command:
    argv: [git, -C, "{{ git_repos_base_dir }}/{{ item.dest }}", rev-parse, --is-shallow-repository]
  loop: "{{ git_repos_filtered | rejectattr('depth', 'defined') | selectattr('dest', 'in', git_repos_available_dests) | list }}"
  loop_control:
    label: "{{ item.dest }}"
  register: _git_repos_shallow
  changed_when: false
  failed_when: false
  check_mode: false

- name: Fetch full history and all branches for formerly shallow clones  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: >-
      git remote set-branches origin '*' &&
      git -c core.hooksPath=/dev/null fetch --quiet --unshallow origin
    chdir: "{{ git_repos_base_dir }}/{{ item.item.dest }}"
  environment:
    GIT_TERMINAL_PROMPT: "0"
    GIT_CONFIG_NOSYSTEM: "1"
  loop: "{{ _git_repos_shallow.results | default([]) | selectattr('stdout', 'defined') | selectattr('stdout', 'equalto', 'true') | list }}"
  loop_control:
    label: "{{ item.item.dest }}"
  changed_when: true
  ignore_errors: true  # noqa: ignore-errors — offline or auth failure must not stop the other repos
  timeout: 600

- name: Warn when all clones failed
  ansible.builtin.debug:
    msg: >-
      WARNING: All {{ git_repos_filtered | length }} clone(s) failed (see per-repo errors
      below; offline?). Continuing. Re-run `make repos` when online.
  when:
    - git_repos_filtered | length > 0
    - git_repos_available_dests | length == 0

- name: Report failed clones
  ansible.builtin.debug:
    msg: >-
      FAILED to clone {{ item.item.url }} -> {{ item.item.dest }}:
      {{ ((item.stderr | default('', true) or item.msg | default('unknown error')) | string).splitlines() | map('trim')
         | reject('match', '^([+|]|Host key fingerprint is|$)') | join(' ') }}
  loop: "{{ git_repos_clone_results.results | default([]) | selectattr('failed', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.item.dest }}"

- name: Pull upstream changes (ff-only)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: git -c core.hooksPath=/dev/null pull --ff-only
    chdir: "{{ git_repos_base_dir }}/{{ item.dest }}"
  environment:
    LC_ALL: C  # ensure 'Already up to date' string is stable regardless of system locale
    GIT_TERMINAL_PROMPT: "0"  # prevent interactive credential prompt from hanging on expired HTTPS auth
    GIT_CONFIG_NOSYSTEM: "1"  # prevent /etc/gitconfig injection (core.fsmonitor RCE, url.insteadOf redirect)
  loop: "{{ git_repos_filtered }}"
  loop_control:
    label: "{{ item.dest }}"
  when:
    - git_repos_pull | bool
    - item.dest in git_repos_available_dests
  register: git_repos_pull_results
  # during per-iteration eval, git_repos_pull_results is the current item result (not the accumulated .results list)
  changed_when: >-
    git_repos_pull_results.rc == 0 and
    'Already up to date' not in git_repos_pull_results.stdout
  # NOTE: ignore_errors: true sets failed=true on non-zero rc in .results, making rc and failed attribute filters reliable
  ignore_errors: true  # retries omitted: ignore_errors still records failed=true per item, so retries would never trigger
  timeout: 120

- name: Report failed pulls
  ansible.builtin.debug:
    msg: "FAILED to pull {{ item.item.dest }}: {{ item.stderr | default('', true) or item.msg | default('unknown error') }}"
  loop: "{{ (git_repos_pull_results.results | default([])) | selectattr('failed', 'defined') | selectattr('failed') | list }}"
  loop_control:
    label: "{{ item.item.dest }}"

- name: Configure fork remotes  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: >-
      set -euo pipefail;
      old=$(git config --get-all remote.{{ item.1.name | quote }}.url) || old="";
      if [ "$old" = {{ item.1.url | quote }} ]; then true;
      elif [ -n "$old" ]; then git config --replace-all remote.{{ item.1.name | quote }}.url {{ item.1.url | quote }} && echo updated;
      else git remote add {{ item.1.name | quote }} {{ item.1.url | quote }} && echo added; fi;
      if git config --get-all remote.{{ item.1.name | quote }}.pushurl >/dev/null; then
      git config --unset-all remote.{{ item.1.name | quote }}.pushurl && echo updated; fi
    chdir: "{{ git_repos_base_dir }}/{{ item.0.dest }}"
  loop: "{{ git_repos_filtered | subelements('extra_remotes', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.dest }} -> {{ item.1.name }}"
  when:
    - item.0.dest in git_repos_available_dests
    - not ansible_check_mode  # check mode clones nothing, so the chdir target may not exist
  register: git_repos_remote_result
  # A fork remote is one plain URL: a leftover pushurl (a hand-made workaround) is removed, so git push uses it.
  changed_when: git_repos_remote_result.stdout | trim | length > 0

# Repos of the owner's that ship their own hooks (repos.yml hooks: true): the global hooks (core.hooksPath, with the
# gitleaks scan and the token-push guard) chain to <repo>/.githooks/<name>. Any repo-local core.hooksPath (a repo's
# make install-hooks, in any spelling) would replace the global hooks, guards included, so it is removed here. Upstream repos never
# opt in: their hooks would run their code on every commit.
- name: Opt the owner's repos into their own .githooks  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: >-
      set -euo pipefail;
      out="";
      [ "$(git config --local --get laptop.repoHooks || true)" = .githooks ] ||
      { git config --local laptop.repoHooks .githooks; out=updated; };
      if [ -n "$(git config --local --get-all core.hooksPath || true)" ]; then
      git config --local --unset-all core.hooksPath; out=updated; fi;
      if [ -n "$(git config --worktree --get-all core.hooksPath 2>/dev/null || true)" ]; then
      git config --worktree --unset-all core.hooksPath; out=updated; fi;
      if [ "$(git config --get core.hooksPath || true)" != "$(git config --global --get core.hooksPath || true)" ]; then
      out="$out included-hooksPath"; fi;
      echo "$out"
    chdir: "{{ git_repos_base_dir }}/{{ item.dest }}"
  loop: "{{ git_repos_filtered | selectattr('hooks', 'defined') | selectattr('hooks') | list }}"
  loop_control:
    label: "{{ item.dest }}"
  when:
    - item.dest in git_repos_available_dests
    - item.url is match('^https://github\.com/' ~ (dotfiles_github_user | regex_escape) ~ '/')
    - not ansible_check_mode
  register: git_repos_hooks_result
  changed_when: "'updated' in git_repos_hooks_result.stdout"

- name: Warn about a core.hooksPath that a local include brings back
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ item.item.dest }} still has its own core.hooksPath (from a file its .git/config includes, or another
      scope), which replaces the global hooks (gitleaks, the token-push guard). Find and remove it:
      git -C {{ git_repos_base_dir }}/{{ item.item.dest }} config --show-origin --show-scope --includes --get-all core.hooksPath
  loop: "{{ git_repos_hooks_result.results | default([]) | selectattr('stdout', 'defined')
            | selectattr('stdout', 'search', 'included-hooksPath') | list }}"
  loop_control:
    label: "{{ item.item.dest }}"

# Last, so one repo that cannot fast-forward does not stop fork remotes being configured
- name: Fail if any pulls failed
  ansible.builtin.fail:
    msg: >-
      git pull failed for: {{ (git_repos_pull_results.results | default([]))
        | selectattr('failed', 'defined') | selectattr('failed')
        | map(attribute='item.dest') | list | join(', ') }}
  when:
    - git_repos_pull | bool
    - >-
      (git_repos_pull_results.results | default([])
      | selectattr('failed', 'defined') | selectattr('failed')
      | list | length) > 0
