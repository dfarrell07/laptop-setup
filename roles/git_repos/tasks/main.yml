---
# roles/git_repos/tasks/main.yml
# Clone repos (HTTPS or SSH), add fork remotes. Filter by category.

- name: Check gh auth status
  ansible.builtin.command:
    cmd: gh auth status
  register: git_repos_gh_auth
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Warn if gh not authenticated
  ansible.builtin.debug:
    msg: >-
      GitHub CLI not authenticated. Run 'gh auth login' before
      'make repos'. Cloning will fail for private repos.
  when: git_repos_gh_auth.rc != 0

- name: Determine active categories for profile
  ansible.builtin.set_fact:
    git_repos_active_categories: >-
      {{
        [git_repos_category_filter] if git_repos_category_filter | length > 0
        else (git_repos_work_categories if profile == 'work'
        else git_repos_personal_categories)
      }}

- name: Filter repos by category and enabled status
  ansible.builtin.set_fact:
    git_repos_filtered: >-
      {{
        git_repos_list
        | selectattr('category', 'in', git_repos_active_categories)
        | rejectattr('enabled', 'equalto', false) | list
      }}

- name: Fail when explicit category filter matches no enabled repos
  ansible.builtin.fail:
    msg: >-
      Category '{{ git_repos_category_filter }}' matched no enabled repos.
      Valid categories: {{ (git_repos_work_categories + git_repos_personal_categories) | unique | sort | join(', ') }}.
  when:
    - git_repos_category_filter | length > 0
    - git_repos_filtered | length == 0

- name: Display repos to clone
  ansible.builtin.debug:
    verbosity: 1
    msg: "Will clone {{ git_repos_filtered | length }} repos (categories: {{ git_repos_active_categories | join(', ') }})"

- name: Check SSH agent has loaded identities
  ansible.builtin.command:
    cmd: ssh-add -l
  register: git_repos_ssh_agent
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Warn if SSH agent has no identities loaded
  ansible.builtin.debug:
    msg: >-
      SSH agent not ready (rc={{ git_repos_ssh_agent.rc }} —
      {{ 'no identities loaded' if git_repos_ssh_agent.rc == 1 else 'cannot connect to agent' }}).
      Run 'ssh-add' before 'make repos'. The following filtered repos use SSH and will likely fail:
      {{ git_repos_filtered | selectattr('url', 'match', 'ssh://|git@') | map(attribute='dest') | list | join(', ') }}
  when:
    - git_repos_ssh_agent.rc in [1, 2]
    - git_repos_filtered | selectattr('url', 'match', 'ssh://|git@') | list | length > 0

# Coverage gap: the wait_for task is never invoked in any molecule scenario.
# Molecule overrides git_repos_list to a single CI test repo (HTTPS GitHub URL).
# No CI test repo URL matches gitlab.cee.redhat.com so the when: condition is
# always false and wait_for is skipped.
# A functional end-to-end test would require VPN access unavailable in CI.
- name: Check connectivity to VPN-gated repo hosts
  ansible.builtin.wait_for:
    host: "{{ git_repos_vpn_check_host }}"
    port: "{{ git_repos_vpn_check_port }}"
    timeout: 3
    state: started
  when: git_repos_filtered | map(attribute='url') | select('search', git_repos_vpn_check_host) | list | length > 0
  register: git_repos_vpn_check
  ignore_errors: true

- name: Warn if VPN-gated repo hosts are unreachable
  ansible.builtin.debug:
    msg: >-
      VPN-gated host {{ git_repos_vpn_check_host }} is unreachable (port 22).
      Repos at {{ git_repos_vpn_check_host }} require Red Hat VPN — connect to VPN or expect clone failures.
  when: git_repos_vpn_check.failed | default(false)

- name: Ensure base directory exists
  ansible.builtin.file:
    path: "{{ git_repos_base_dir }}"
    state: directory
    mode: "0755"

- name: Check git-lfs availability
  ansible.builtin.command:
    cmd: git lfs version
  register: git_repos_lfs_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Warn if git-lfs is not installed
  ansible.builtin.debug:
    msg: >-
      git-lfs is not installed. Repos with LFS-tracked files will clone with
      pointer text files instead of real content.
      Install git-lfs ('dnf install git-lfs') before cloning repos that track large files.
  when: git_repos_lfs_check.rc != 0

- name: Check if git-lfs filter is already registered  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: git config --global filter.lfs.smudge
  register: git_repos_lfs_configured
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when: git_repos_lfs_check.rc == 0

- name: Register git-lfs smudge/clean filter drivers
  ansible.builtin.command:
    cmd: git lfs install --skip-repo
  register: git_repos_lfs_install
  changed_when: git_repos_lfs_install.rc == 0
  failed_when: false
  when:
    - git_repos_lfs_check.rc == 0
    - git_repos_lfs_configured.rc | default(0) != 0

- name: Clone repositories  # noqa: latest[git]
  ansible.builtin.git:
    repo: "{{ item.url }}"
    dest: "{{ git_repos_base_dir }}/{{ item.dest }}"
    update: false
    version: HEAD
    depth: "{{ item.depth | default(omit) }}"
    accept_hostkey: true
  environment:
    GIT_TERMINAL_PROMPT: "0"  # prevent interactive credential prompt from hanging make repos
  loop: "{{ git_repos_filtered }}"
  loop_control:
    label: "{{ item.dest }}"
  register: git_repos_clone_results
  ignore_errors: true  # noqa: ignore-errors — per-item failure must be captured in .results for the Report task below
  timeout: 300

- name: Set available repo destinations fact
  ansible.builtin.set_fact:
    git_repos_available_dests: >-
      {{ git_repos_clone_results.results
         | selectattr('failed', 'equalto', false)
         | map(attribute='item.dest') | list }}

- name: Report failed clones
  ansible.builtin.debug:
    msg: "FAILED to clone {{ item.item.url }} -> {{ item.item.dest }}: {{ item.msg | default('unknown error') }}"
  loop: "{{ git_repos_clone_results.results | selectattr('failed', 'defined') | selectattr('failed') | list }}"
  loop_control:
    label: "{{ item.item.dest }}"

- name: Pull upstream changes (ff-only)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: git pull --ff-only
    chdir: "{{ git_repos_base_dir }}/{{ item.dest }}"
  environment:
    LC_ALL: C  # ensure 'Already up to date' string is stable regardless of system locale
    GIT_TERMINAL_PROMPT: "0"  # prevent interactive credential prompt from hanging on expired HTTPS auth
  loop: "{{ git_repos_filtered }}"
  loop_control:
    label: "{{ item.dest }}"
  when:
    - git_repos_pull | bool
    - item.dest in git_repos_available_dests
  register: git_repos_pull_results
  changed_when: "git_repos_pull_results.rc == 0 and 'Already up to date' not in git_repos_pull_results.stdout"
  failed_when: false  # retries omitted: failed_when: false makes every run appear succeeded, so retries would never trigger
  timeout: 120

- name: Report failed pulls
  ansible.builtin.debug:
    msg: "FAILED to pull {{ item.item.dest }}: {{ item.stderr | default(item.msg) | default('unknown error') }}"
  loop: "{{ git_repos_pull_results.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when: git_repos_pull | bool

- name: Fail if any pulls failed
  ansible.builtin.fail:
    msg: >-
      git pull failed for: {{ git_repos_pull_results.results
        | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0)
        | map(attribute='item.dest') | list | join(', ') }}
  when:
    - git_repos_pull | bool
    - >-
      (git_repos_pull_results.results
      | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0)
      | list | length) > 0

- name: Configure fork remotes  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: >-
      old=$(git remote get-url {{ item.1.name | quote }} 2>/dev/null);
      if [ "$old" = {{ item.1.url | quote }} ]; then true;
      elif [ -n "$old" ]; then git remote set-url {{ item.1.name | quote }} {{ item.1.url | quote }} && echo updated;
      else git remote add {{ item.1.name | quote }} {{ item.1.url | quote }} && echo added; fi
    chdir: "{{ git_repos_base_dir }}/{{ item.0.dest }}"
  loop: "{{ git_repos_filtered | subelements('extra_remotes', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.dest }} -> {{ item.1.name }}"
  when: item.0.dest in git_repos_available_dests
  register: git_repos_remote_result
  changed_when: >-
    'added' in git_repos_remote_result.stdout or
    'updated' in git_repos_remote_result.stdout
