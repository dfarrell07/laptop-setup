---
profile: work  # fallback for standalone invocation

git_repos_base_dir: "{{ ansible_facts['user_dir'] }}/src"

git_repos_pull: false  # set true via -e git_repos_pull=true (done by make update) to fetch upstream with --ff-only

# Filter: set via -e repo_category=ovnk to clone only one category.
# Empty string means "all enabled repos for this profile."
git_repos_category_filter: "{{ repo_category | default('') }}"

# Profile-based category defaults
git_repos_work_categories:
  - personal
  - bpfman
  - downstream
  - konflux
  - ovnk

git_repos_personal_categories:
  - personal
  - ovnk

# VPN-gated repo host checked for connectivity before cloning downstream repos.
# Extracted to a variable to avoid hardcoding internal hostnames in task files.
git_repos_vpn_check_host: ''
git_repos_vpn_check_port: 22

git_repos_list: []  # populated from group_vars/all/repos.yml; [] fallback prevents undefined-var error on standalone invocation
