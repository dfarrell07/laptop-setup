---
profile: work  # fallback for standalone invocation (--tags claude)
# Fallback; authoritative in group_vars/all/vars.yml; consumed by packages, claude, distrobox
packages_install_binaries: true
is_linux: false  # fallback; authoritative value in group_vars/all/vars.yml
is_macos: false  # fallback; authoritative value in group_vars/all/vars.yml
system_is_container: false  # fallback; authoritative value in group_vars/all/vars.yml
csb_rhel: false  # fallback; authoritative in group_vars/all/vars.yml
dotfiles_github_user: "CHANGE_ME"  # shared cross-role variable, intentionally unprefixed
claude_install_method: native  # native (recommended) or skip (CI/testing — bypasses install)
claude_install_url: "https://claude.ai/install.sh"  # Fetches latest at provision time; post-install upgrades use `claude update`
# SECURITY: SHA256 integrity verification is MANDATORY — set in config.yml before make all
claude_install_sha256: ""
claude_pinned_version: ""  # minimum version; REQUIRED for native install with packages_install_binaries on (like the sha256), e.g. "1.0.3"
claude_bin_path: "{{ ansible_facts['user_dir'] }}/.local/bin/claude"
claude_queue_poller_path: "{{ ansible_facts['user_dir'] }}/.local/bin/claude-queue-poller.sh"

claude_default_config_dir: "{{ ansible_facts['user_dir'] }}/.claude"
claude_work_config_dir: "{{ ansible_facts['user_dir'] }}/.claude-work"
claude_personal2_config_dir: "{{ ansible_facts['user_dir'] }}/.claude-per2"
claude_personal2_instance_enabled: true
# More Claude config dirs managed like the ones above (settings policy, CLAUDE.md, privacy), e.g. a second person's
# login for a shared tool on this machine: a list of absolute paths, each /Users/<you>/.claude-<name> (Linux:
# /home/<you>/.claude-<name>). Set it in config.yml as literal paths: the SSTI guard rejects Jinja there.
claude_extra_config_dirs: []

claude_telemetry_env:
  DISABLE_ERROR_REPORTING: "1"
  DISABLE_FEEDBACK_COMMAND: "1"
  # Do NOT set DISABLE_TELEMETRY — breaks feature flags (extended context window models)
  # Do NOT set CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC — same + disables updater

# Claude Code's Bash sandbox (bubblewrap on Linux). Off by default: on Fedora it left every command with a read-only
# filesystem (no writable project dir or TMPDIR). The deny lists below still apply to the Read and Edit tools.
# When true, the policy also sets failIfUnavailable and allowUnsandboxedCommands: false, and Linux gets bubblewrap and socat.
claude_sandbox_enabled: false

# settings-policy.json.j2 always writes sandbox.enableWeakerNestedSandbox; its value is true only when this instance runs inside a
# container (system_is_container, distrobox, CSB container tier) and false on normal hosts.
claude_nested_sandbox: "{{ (system_is_container | default(false)) or (needs_container_tier | default('host-only')) == 'container' }}"

# Seed-only user preferences; CLI edits remain user-owned.
claude_user_preferences:
  model: opus
  effortLevel: medium
  alwaysThinkingEnabled: false
  includeCoAuthoredBy: false
  tui: fullscreen
  agentPushNotifEnabled: true  # proactive mobile notifications (Remote Control / claude.ai app)
  inputNeededNotifEnabled: true  # mobile push when a permission prompt or question is waiting

# Plugin declarations from repositories, not cached marketplace paths or installed state. Every run adds
# the ones missing from settings.json and never changes a value already there, so a disabled plugin
# ("...": false) stays disabled; work plugins go only to the isolated work home.
claude_personal_plugin_settings:
  extraKnownMarketplaces:
    claude-skills:
      source: {source: github, repo: "{{ dotfiles_github_user }}/claude-skills"}
  enabledPlugins:
    claude-skills@claude-skills: true
claude_work_plugin_settings:
  extraKnownMarketplaces:
    ai-helpers:
      source: {source: github, repo: openshift-eng/ai-helpers}
    submariner:
      source: {source: github, repo: submariner-io/shipyard}
    submariner-release:
      source: {source: github, repo: stolostron/submariner-release-management}
  enabledPlugins:
    shipyard@submariner: true
    release-management@submariner-release: true

# Approval prompts. Every launcher already passes --dangerously-skip-permissions; this makes sessions started any
# other way (plain `claude`, `rc`, IDEs, the sessions skill) match, so cross-session messages are not held for approval
# between sessions in different modes. The queue poller pins its own --permission-mode dontAsk. Set "default" to
# be asked again.
claude_default_mode: bypassPermissions
# Messages from your other Claude sessions (SendMessage): accept delivers them whatever either session's permission
# mode, hold parks them for your review, refuse opts out. Any session on this account can then steer this one.
claude_cross_session_inbound: accept
# remoteControlAtStartup seeded (set only when absent; turning it off in /config sticks) in ~/.claude and
# ~/.claude-per2, so plain `claude` starts with Remote Control like the launchers. Not in the work home (under Vertex
# Claude starts normally and Remote Control stays off) nor in claude_extra_config_dirs (another person's login).
claude_remote_control_at_startup: true
# A repository's committed .claude/settings.json defaultMode outranks claude_default_mode for sessions started there
# without a flag. When true, every run writes claude_default_mode into the git-ignored .claude/settings.local.json
# (that key only) of each checkout under claude_project_mode_roots (worktrees included) whose project settings pick
# another mode. false leaves those repositories in their own mode; make verify CHUNK=agents still reports them.
claude_project_mode_override: true
claude_project_mode_roots:
  - "{{ ansible_facts['user_dir'] }}"
claude_project_mode_depth: 4  # directory levels searched below each root (~/src/<owner>/<repo> is 3)
# Checkouts that keep their own committed mode (a repository whose owner chose prompts on purpose); a path covers
# everything below it. Rendered to ~/.config/claude/project-mode-exclude, which make verify reads too.
claude_project_mode_exclude: []
# Bash rules every instance denies outright (a denial never prompts). Prefix rules on the command text: a wrapper
# such as `env sudo` or `bash -c` is not caught, and sudo still needs a password the agent cannot type. Deny
# lists are unioned: to drop an entry from existing settings, also add it to claude_retired_deny.
claude_deny_bash:
  - "Bash(sudo *)"
  - "Bash(su *)"
# Deny entries removed from existing settings.json on every run. The hand-written Bash rules blocked routine work
# even with bypass: `rm -rf /*` matches every rm -rf of an absolute path (scratch cleanup included), and curl/wget/dd
# rules block API checks and downloads. The wholesale Chrome read rules were generated by earlier releases. Set []
# before the first run to keep them; to restore removed rules, add them to claude_deny_bash (a rule the policy denies is
# never retired).
claude_retired_deny:
  - "Bash(rm -rf /*)"
  - "Bash(rm -rf ~*)"
  - "Bash(curl *)"
  - "Bash(wget *)"
  - "Bash(dd *)"
  # Whole Chrome and Chromium dirs, read: replaced by claude_chromium_deny_globs (writes stay denied wholesale)
  - "Read(~/.config/google-chrome/**)"
  - "Read(~/.config/chromium/**)"
  - "Read(~/Library/Application Support/Google/Chrome/**)"

claude_enable_all_project_mcp_servers: false  # true = auto-trust all project-local MCP servers; false = prompt (more secure)

claude_queue_enabled: false

# agent-getty (docs/agent-getty.md): at boot, keep each listed harness/profile pair's remote-control daemon running in
# detached tmux (systemd user unit on Linux, LaunchAgent on macOS), so new sessions can be started from the phone/web
# (empty: off).
agent_getty_pairs: []
agent_getty_dir: "{{ ansible_facts['user_dir'] }}"  # where Claude starts new sessions; its trust prompt is answered
agent_getty_host: "{{ ansible_facts['hostname'] | regex_replace('[^A-Za-z0-9-]', '-') }}"  # prefix of daemon names
# Pairs agent-getty runs, and pairs it skips with a warning until they have a profile home or Remote Control works there
_getty_supported: [claude/personal, claude/personal2, codex/work, codex/personal, agy/personal]
_getty_not_yet: [claude/work, agy/work, codex/personal2, agy/personal2]
codex_work_config_dir: "{{ ansible_facts['user_dir'] }}/.codex"  # fallback; mirrors roles/codex/defaults
codex_personal_config_dir: "{{ ansible_facts['user_dir'] }}/.codex-personal"  # fallback; mirrors roles/codex/defaults
claude_queue_allowed_authors: []  # GitHub logins allowed to trigger queue; MUST set when enabled — empty makes the poller refuse to run
claude_log_dir: "{{ ansible_facts['user_dir'] }}/.local/state/claude/logs"
claude_runtime_config_dir: "{{ ansible_facts['user_dir'] }}/.config/claude"
claude_queue_repo: ""
claude_queue_poll_interval_sec: 120
claude_queue_boot_delay_sec: 60
claude_queue_memory_max: '4G'
claude_queue_cpu_quota: '80%'
claude_queue_max_turns: 50    # --max-turns passed to claude; limits runaway sessions
claude_queue_timeout: 1800    # seconds before SIGTERM is sent to claude process
claude_queue_max_issues_per_run: 5    # max issues processed per poller invocation; caps lock hold time
claude_queue_host_label: ""   # optional human-readable label posted in issue comments; leave empty to omit host identity
claude_queue_config_dir: "{{ claude_work_config_dir if profile == 'work' else claude_default_config_dir }}"  # config dir for queue daemon

claude_deny_sensitive:
  - "~/.claude.json"  # default instance's account state and MCP servers (other instances keep it in their dir)
  - "~/.codex/**"
  - "~/.codex-personal/**"
  - "~/.gemini/**"
  - "~/.gemini-per2/**"  # gper2 account
  - "~/.config/claude-code-vertex/**"
  - "~/.config/submariner-release-management/**"
  - "~/.ssh/**"
  - "~/.aws/**"
  - "~/.gnupg/**"
  - "~/.kube/**"
  - "~/.config/gh/**"
  - "~/.config/gcloud/**"
  - "~/.config/acli/**"
  - "~/.config/sops/age/**"
  - "~/.config/containers/auth.json"
  - "~/.docker/config.json"
  - "~/.local/share/keyrings/**"
  - "~/.config/helm/**"
  - "~/.config/claude/**"  # queue-repos.conf, work-env and the hooks every instance runs; Read and Edit denied
  - "~/.azure/**"
  - "~/.config/rclone/**"
  - "~/.gitconfig"
  - "~/.config/git/config"
  - "~/.vault_pass*"
  - "~/laptop-setup-backup-*/**"  # scripts/backup.sh copies ~/.ssh, credentials and tokens here
  - "~/.netrc"
  - "~/.git-credentials"
  - "~/.pypirc"
  - "~/.cargo/credentials.toml"
  - "~/.npmrc"
  - "**/.env"
  - "**/.git/config"
  # No //proc/*/... rules: the Linux sandbox expands each glob into one bind mount per host process, which fails
  # and leaves Bash unable to start; sandboxed commands get their own PID namespace and /proc anyway.
  - "~/.password-store/**"
  - "~/.mozilla/**"
  - "~/.config/mozilla/**"  # Firefox 147+ puts new Linux profiles here
  - "~/.cache/mozilla/**"
  - "~/Library/Caches/Firefox/**"
  - "~/Library/Application Support/Firefox/**"  # macOS Firefox profiles: cookies, logins.json, key4.db
  # Chrome and Chromium caches (outside the user data dir; they can hold authenticated responses)
  - "~/.cache/google-chrome/**"
  - "~/.cache/chromium/**"
  - "~/Library/Caches/Google/Chrome/**"
  - "~/Library/Caches/Chromium/**"
  # macOS: browser data and cookies, Mail, Messages and Internet Accounts (rules for absent paths are inert). Not
  # ~/Library/Keychains: its files are encrypted, and with the sandbox on, denying them breaks gh and git's helper.
  - "~/Library/Cookies/**"
  - "~/Library/Safari/**"
  - "~/Library/Containers/com.apple.Safari/**"
  - "~/Library/Application Support/Bitwarden/**"
  - "~/Library/Mail/**"
  - "~/Library/Containers/com.apple.mail/**"
  - "~/Library/Messages/**"
  - "~/Library/Accounts/**"
  # Claude desktop: sign-in storage and MCP server config (not the whole dir: its sessions work under scratch-workspaces)
  - "~/Library/Application Support/Claude/Cookies*"
  - "~/Library/Application Support/Claude/Local Storage/**"
  - "~/Library/Application Support/Claude/Session Storage/**"
  - "~/Library/Application Support/Claude/IndexedDB/**"
  - "~/Library/Application Support/Claude/claude_desktop_config.json"
  - "~/Library/Application Support/Claude/config.json"
  - "~/.pki/**"
  - "~/.local/share/gnome-keyring/**"
  - "~/.Xauthority"
  - "~/.local/state/zsh/history"
  - "~/.zsh_history"  # macOS /etc/zshrc default HISTFILE; written by any zsh that skips ~/.zshrc
  - "~/.zsh_sessions/**"  # macOS Terminal's per-window history (/etc/zshrc_Apple_Terminal)
  - "~/Library/Preferences/helm/**"  # Helm's config dir on macOS (repository credentials)
  - "~/.bash_history"
  - "//run/host/**"
  - "//etc/shadow"
  - "//etc/sudoers"
  - "//etc/sudoers.d/**"

# Chrome and Chromium user data dirs (this host's OS only): their secret stores are denied to Read file by file, so
# Bookmarks, Preferences and Local State (profile names and signed-in accounts; no key: macOS keeps it in the
# Keychain, Linux in the keyring or, with the basic store, a constant compiled into Chrome) stay readable for make
# chrome-bookmarks-*. Writes to the dirs are denied wholesale (claude_deny_write_only). Claude Code cannot carve an
# allow out of a broad deny, so this is a deny list by file class: names, extensions and directories of cookies,
# passwords, autofill, history, sessions, web and extension storage, and sync data. Each glob names a file
# or dir at any depth ("**/") under each dir; a dir it names is denied with everything in it.
claude_chromium_user_data_dirs: >-
  {{ ['~/Library/Application Support/Google/Chrome', '~/Library/Application Support/Chromium']
     if ansible_facts['system'] | default('Linux') == 'Darwin' else ['~/.config/google-chrome', '~/.config/chromium'] }}
claude_chromium_deny_globs:
  - "*Cookies*"  # Cookies, Network/Cookies, Extension Cookies, Safe Browsing Cookies
  - "*Login Data*"  # saved passwords, Login Data For Account
  - "*Web Data*"  # autofill, addresses, cards, Account Web Data
  - "*History*"  # History, Media History and their journals
  - "*Session*"  # Sessions/, Current Session, Last Session, Session Storage/
  - "*Tabs*"
  - "*Storage*"  # Local Storage/, Session Storage/, WebStorage/, Storage/
  - "*Extension Settings"  # extensions' stored data: Local, Sync and Managed Extension Settings/ (Extensions/ is code)
  - "Extension State"
  - "Extension Rules"
  - "Extension Scripts"
  - "*Encrypted*"
  - "*Trust Tokens*"
  - "Safe Browsing*"
  - "Sync Data"
  - "Network"
  - "IndexedDB"
  - "Service Worker"
  - "File System"
  - "blob_storage"
  - "databases"
  - "GCM Store"
  - "shared_proto_db"
  - "Shared Dictionary"
  - "Affiliation Database*"
  - "Top Sites*"
  - "Visited Links"
  - "Shortcuts*"
  - "Favicons*"
  - "Network Action Predictor*"
  - "Network Persistent State"
  - "TransportSecurity"
  - "Reporting and NEL*"
  - "QuotaManager*"
  - "trusted_vault*"  # sync's trusted-vault keys
  - "DIPS*"
  - "Conversions*"
  - "InterestGroups*"
  - "BrowsingTopics*"
  - "PrivateAggregation*"
  - "heavy_ad_intervention*"
  - "Crashpad"  # crash dumps hold process memory (macOS)
  - "Crash Reports"  # (Linux)
  - "Policy"  # User Policy (a managed account's device-management token), Enrollment/ (browser enrollment token)
  - "*.ldb"
  - "*.log"
  - "*-journal"
  - "*.sqlite*"

# Paths inside the running instance's own config dir (other instances are denied wholesale).
claude_own_instance_deny_read:
  - ".credentials.json"
  - "history.jsonl"
  - "shell-snapshots/**"
  - "file-history/**"
  - "session-env/**"
  - ".claude.json"  # account state and MCP server definitions (may hold tokens)
  - "backups/**"  # Claude Code's copies of .claude.json
# Paths Claude Code loads as code or configuration on its next start are not agent-writable:
# a prompt-injected session (e.g. the queue poller) must not persist hooks, MCP servers,
# plugins, commands, agents, skills or output styles outside the sandbox. projects/** (memory,
# plans) stays writable.
claude_own_instance_deny_write:
  - ".credentials.json"
  - ".claude.json"
  - "settings.json"
  - "settings.local.json"
  - "CLAUDE.md"  # Ansible-managed; per-project local edits go in the project CLAUDE.local.md
  - "hooks/**"
  - "plugins/**"
  - "commands/**"
  - "agents/**"
  - "skills/**"
  - "output-styles/**"

claude_deny_write_only:
  - "~/.config/systemd/user/**"  # Claude-the-agent only; Ansible deploys claude-queue.service/timer here
  - "~/.bashrc"
  - "~/.zshrc"
  - "~/.profile"
  - "~/.bash_profile"
  - "~/.zshenv"
  - "~/.zprofile"
  - "~/.config/zsh/**"  # zshrc sources local.zsh from here on every interactive shell; a write is code execution outside the sandbox
  - "~/.local/bin/**"  # Claude-the-agent only; Ansible deploys claude-queue-poller.sh here
  - "~/.config/autostart/**"
  - "~/Library/LaunchAgents/**"
  # Chrome and Chromium user data dirs: reads are denied per secret file (claude_chromium_deny_globs), writes wholesale.
  # NativeMessagingHosts manifests name binaries Chrome runs outside its sandbox; Local State turns on flags.
  - "~/.config/google-chrome/**"
  - "~/.config/chromium/**"
  - "~/Library/Application Support/Google/Chrome/**"
  - "~/Library/Application Support/Chromium/**"
  - "~/.config/git/template/hooks/**"  # Git hooks deployed by dotfiles; must not be overwritten by Claude
  - "~/.config/git/allowed_signers"  # the vault trusts these keys for its commits (scripts/vault-shared.sh)
  - "~/.config/laptop-setup/**"  # vault trust state: approved age recipients and the signer cache
  - "**/.githooks/**"  # Repos here use core.hooksPath=.githooks; a planted hook runs on the next git command
  - "**/.git/hooks/**"  # Per-repo hook files; Write + git config --local core.hooksPath enables hook injection
  - "**/.claude/settings.json"  # Project settings load hooks, MCP servers and permissions on the next start
  - "**/.claude/settings.local.json"  # Same, per-checkout local override
  - "**/.mcp.json"  # Project MCP server definitions run commands on the next start
  - "~/.config/environment.d/**"  # DOCKER_HOST + KIND_EXPERIMENTAL_PROVIDER; overwrite breaks Makefile-based kind/Podman workflows
  - "~/.local/share/oh-my-zsh/**"  # oh-my-zsh sources custom/*.zsh on every interactive zsh
  - "~/.config/direnv/**"  # direnvrc is sourced before every .envrc without a direnv allow
  - "~/.config/tmux/**"  # tmux.conf run-shell executes on server start
  - "~/.vimrc"  # vimscript can run system() on every vim start

# acli (Atlassian CLI, used by the Jira skill): every profile, logged in to acli_site from the vault's
# vault_acli_api_token (an Atlassian API token) whenever that token is set. acli keeps the token in the OS keyring
# (Secret Service on Linux, Keychain on macOS); the login needs an unlocked keyring, so it is skipped with a warning
# over SSH or without a desktop session. Set or replace the token (they expire within a year) with make acli-token,
# which asks for it, stores it and logs in; make acli-login repeats only the login.
# Work profile only by default, so a personal machine that shares the vault stays off Red Hat's Jira unless its
# config.yml names a site. Another site: set it in config.yml; '' turns the login and its smoke check off.
acli_site: "{{ 'redhat.atlassian.net' if profile | default('work') == 'work' else '' }}"
acli_email: "{{ dotfiles_user_email_work | default('') }}"
acli_products: [jira]  # confluence works with the same token
