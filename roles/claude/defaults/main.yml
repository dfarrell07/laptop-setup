---
# noqa: var-naming[no-role-prefix] — fallback for standalone invocation (--tags claude)
profile: work  # noqa: var-naming[no-role-prefix] — fallback for standalone invocation
dotfiles_github_user: "dfarrell07"  # noqa: var-naming[no-role-prefix] — shared cross-role variable, intentionally unprefixed
claude_install_method: native  # native (recommended) or skip (CI/testing — bypasses install)
claude_install_url: "https://claude.ai/install.sh"  # Fetches latest at provision time; post-install upgrades use `claude update`

claude_work_config_dir: "{{ ansible_user_dir }}/.claude-work"
claude_personal_config_dir: "{{ ansible_user_dir }}/.claude-personal"

claude_telemetry_env:
  DISABLE_ERROR_REPORTING: "1"
  DISABLE_FEEDBACK_COMMAND: "1"
  # Do NOT set DISABLE_TELEMETRY — breaks feature flags (Opus 1M context)
  # Do NOT set CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC — same + disables updater

# Keys must match Claude settings.json camelCase format — do NOT convert to snake_case
claude_sandbox_config:
  enabled: true
  allowUnsandboxedCommands: false
  failIfUnavailable: true
  enableWeakerNestedSandbox: true

claude_cleanup_period_days: 7

claude_queue_enabled: false
claude_queue_repo: ""
claude_queue_poll_interval_sec: 120
claude_queue_boot_delay_sec: 60
claude_queue_memory_max: '4G'
claude_queue_cpu_quota: '80%'
claude_remote_control_enabled: false

claude_deny_read:
  - "~/.ssh/**"
  - "~/.aws/**"
  - "~/.gnupg/**"
  - "~/.kube/**"
  - "~/.config/gh/**"
  - "~/.config/gcloud/**"
  - "~/.config/acli/**"
  - "~/.config/containers/auth.json"
  - "~/.docker/config.json"
  - "~/.local/share/keyrings/**"
  - "~/.claude-work/**"
  - "~/.claude-personal/**"
  - "~/.claude/.credentials.json"
  - "~/.claude/history.jsonl"
  - "~/.claude/shell-snapshots/**"
  - "~/.claude/file-history/**"
  - "~/.claude/session-env/**"
  - "~/.config/helm/**"
  - "~/.azure/**"
  - "~/.gitconfig"
  - "~/.config/git/config"
  - "~/.vault_pass*"
  - "~/.netrc"
  - "~/.npmrc"
  - "**/.env"
  - "**/.git/config"
  - "/proc/*/environ"
  - "/proc/*/cmdline"
  - "/proc/*/mem"
  - "/proc/*/maps"
  - "/proc/*/smaps"
  - "/proc/*/fd/**"
  - "~/.password-store/**"
  - "~/.mozilla/**"
  - "~/.config/google-chrome/**"
  - "~/.config/chromium/**"
  - "~/.pki/**"
  - "~/.local/share/gnome-keyring/**"
  - "~/.Xauthority"
  - "~/.local/state/zsh/history"
  - "~/.bash_history"
  - "/run/host/**"
  - "/etc/shadow"
  - "/etc/sudoers"
  - "/etc/sudoers.d/**"

claude_deny_write:
  - "~/.ssh/**"
  - "~/.aws/**"
  - "~/.gnupg/**"
  - "~/.kube/**"
  - "~/.config/gh/**"
  - "~/.config/gcloud/**"
  - "~/.config/acli/**"
  - "~/.config/containers/auth.json"
  - "~/.docker/config.json"
  - "~/.config/helm/**"
  - "~/.azure/**"
  - "~/.local/share/keyrings/**"
  - "~/.claude-work/**"
  - "~/.claude-personal/**"
  - "~/.claude/.credentials.json"
  - "~/.claude/CLAUDE.md"
  - "~/.claude/projects/**"
  - "~/.claude/settings.json"
  - "~/.claude/settings.local.json"
  - "~/.config/claude/**"
  - "~/.gitconfig"
  - "~/.config/git/config"
  - "~/.config/systemd/user/**"
  - "~/.bashrc"
  - "~/.zshrc"
  - "~/.profile"
  - "~/.bash_profile"
  - "~/.zshenv"
  - "~/.local/bin/**"
  - "~/.config/autostart/**"
  - "~/.vault_pass*"
  - "~/.netrc"
  - "~/.npmrc"
  - "**/.env"
  - "**/.git/config"
  - "~/.password-store/**"
  - "~/.mozilla/**"
  - "~/.config/google-chrome/**"
  - "~/.config/chromium/**"
  - "~/.pki/**"
  - "~/.local/share/gnome-keyring/**"
  - "~/.Xauthority"
  - "~/.local/state/zsh/history"
  - "~/.bash_history"
  - "/run/host/**"
  - "/etc/shadow"
