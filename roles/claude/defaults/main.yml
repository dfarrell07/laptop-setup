---
profile: work  # fallback for standalone invocation (--tags claude)
# Fallback; authoritative in group_vars/all/vars.yml; consumed by packages, claude, distrobox
packages_install_binaries: true
is_linux: false  # fallback; authoritative value in group_vars/all/vars.yml
is_macos: false  # fallback; authoritative value in group_vars/all/vars.yml
system_is_container: false  # fallback; authoritative value in group_vars/all/vars.yml
csb_rhel: false  # fallback; authoritative in group_vars/all/vars.yml
dotfiles_github_user: "CHANGE_ME"  # shared cross-role variable, intentionally unprefixed
claude_install_method: native  # native (recommended) or skip (CI/testing — bypasses install)
claude_install_url: "https://claude.ai/install.sh"  # Fetches latest at provision time; post-install upgrades use `claude update`
# SECURITY: SHA256 integrity verification is MANDATORY — set in config.yml before make all
claude_install_sha256: ""
claude_pinned_version: ""  # minimum version; REQUIRED for native install with packages_install_binaries on (like the sha256), e.g. "1.0.3"
claude_bin_path: "{{ ansible_facts['user_dir'] }}/.local/bin/claude"
claude_queue_poller_path: "{{ ansible_facts['user_dir'] }}/.local/bin/claude-queue-poller.sh"

claude_default_config_dir: "{{ ansible_facts['user_dir'] }}/.claude"
claude_work_config_dir: "{{ ansible_facts['user_dir'] }}/.claude-work"
claude_personal2_config_dir: "{{ ansible_facts['user_dir'] }}/.claude-per2"
claude_personal2_instance_enabled: true

claude_telemetry_env:
  DISABLE_ERROR_REPORTING: "1"
  DISABLE_FEEDBACK_COMMAND: "1"
  # Do NOT set DISABLE_TELEMETRY — breaks feature flags (extended context window models)
  # Do NOT set CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC — same + disables updater

# Claude Code's Bash sandbox (bubblewrap on Linux). Off by default: on Fedora it left every command with a read-only
# filesystem (no writable project dir or TMPDIR). The deny lists below still apply to the Read and Edit tools.
# When true, the policy also sets failIfUnavailable and allowUnsandboxedCommands: false, and Linux gets bubblewrap and socat.
claude_sandbox_enabled: false

# settings-policy.json.j2 always writes sandbox.enableWeakerNestedSandbox; its value is true only when this instance runs inside a
# container (system_is_container, distrobox, CSB container tier) and false on normal hosts.
claude_nested_sandbox: "{{ (system_is_container | default(false)) or (needs_container_tier | default('host-only')) == 'container' }}"

# Seed-only user preferences; CLI edits remain user-owned.
claude_user_preferences:
  model: opus
  effortLevel: medium
  alwaysThinkingEnabled: false
  includeCoAuthoredBy: false
  tui: fullscreen
  agentPushNotifEnabled: true  # proactive mobile notifications (Remote Control / claude.ai app)
  inputNeededNotifEnabled: true  # mobile push when a permission prompt or question is waiting

# Plugin declarations from repositories, not cached marketplace paths or installed state. Every run adds
# the ones missing from settings.json and never changes a value already there, so a disabled plugin
# ("...": false) stays disabled; work plugins go only to the isolated work home.
claude_personal_plugin_settings:
  extraKnownMarketplaces:
    claude-skills:
      source: {source: github, repo: "{{ dotfiles_github_user }}/claude-skills"}
  enabledPlugins:
    claude-skills@claude-skills: true
claude_work_plugin_settings:
  extraKnownMarketplaces:
    ai-helpers:
      source: {source: github, repo: openshift-eng/ai-helpers}
    submariner:
      source: {source: github, repo: submariner-io/shipyard}
    submariner-release:
      source: {source: github, repo: stolostron/submariner-release-management}
  enabledPlugins:
    shipyard@submariner: true
    release-management@submariner-release: true

claude_enable_all_project_mcp_servers: false  # true = auto-trust all project-local MCP servers; false = prompt (more secure)

claude_queue_enabled: false
claude_queue_allowed_authors: []  # GitHub logins allowed to trigger queue; MUST set when enabled — empty makes the poller refuse to run
claude_log_dir: "{{ ansible_facts['user_dir'] }}/.local/state/claude/logs"
claude_runtime_config_dir: "{{ ansible_facts['user_dir'] }}/.config/claude"
claude_queue_repo: ""
claude_queue_poll_interval_sec: 120
claude_queue_boot_delay_sec: 60
claude_queue_memory_max: '4G'
claude_queue_cpu_quota: '80%'
claude_queue_max_turns: 50    # --max-turns passed to claude; limits runaway sessions
claude_queue_timeout: 1800    # seconds before SIGTERM is sent to claude process
claude_queue_max_issues_per_run: 5    # max issues processed per poller invocation; caps lock hold time
claude_queue_host_label: ""   # optional human-readable label posted in issue comments; leave empty to omit host identity
claude_queue_config_dir: "{{ claude_work_config_dir if profile == 'work' else claude_default_config_dir }}"  # config dir for queue daemon

claude_deny_sensitive:
  - "~/.claude.json"  # default instance's account state and MCP servers (other instances keep it in their dir)
  - "~/.codex/**"
  - "~/.codex-personal/**"
  - "~/.gemini/**"
  - "~/.gemini-per2/**"  # gper2 account
  - "~/.config/claude-code-vertex/**"
  - "~/.config/submariner-release-management/**"
  - "~/.ssh/**"
  - "~/.aws/**"
  - "~/.gnupg/**"
  - "~/.kube/**"
  - "~/.config/gh/**"
  - "~/.config/gcloud/**"
  - "~/.config/acli/**"
  - "~/.config/sops/age/**"
  - "~/.config/containers/auth.json"
  - "~/.docker/config.json"
  - "~/.local/share/keyrings/**"
  - "~/.config/helm/**"
  - "~/.config/claude/**"  # queue-repos.conf and work-env; Read and Edit denied
  - "~/.azure/**"
  - "~/.config/rclone/**"
  - "~/.gitconfig"
  - "~/.config/git/config"
  - "~/.vault_pass*"
  - "~/.netrc"
  - "~/.git-credentials"
  - "~/.pypirc"
  - "~/.cargo/credentials.toml"
  - "~/.npmrc"
  - "**/.env"
  - "**/.git/config"
  # No //proc/*/... rules: the Linux sandbox expands each glob into one bind mount per host process, which fails
  # and leaves Bash unable to start; sandboxed commands get their own PID namespace and /proc anyway.
  - "~/.password-store/**"
  - "~/.mozilla/**"
  - "~/.config/google-chrome/**"
  - "~/.config/chromium/**"
  - "~/.pki/**"
  - "~/.local/share/gnome-keyring/**"
  - "~/.Xauthority"
  - "~/.local/state/zsh/history"
  - "~/.bash_history"
  - "//run/host/**"
  - "//etc/shadow"
  - "//etc/sudoers"
  - "//etc/sudoers.d/**"

# Paths inside the running instance's own config dir (other instances are denied wholesale).
claude_own_instance_deny_read:
  - ".credentials.json"
  - "history.jsonl"
  - "shell-snapshots/**"
  - "file-history/**"
  - "session-env/**"
  - ".claude.json"  # account state and MCP server definitions (may hold tokens)
# Paths Claude Code loads as code or configuration on its next start are not agent-writable:
# a prompt-injected session (e.g. the queue poller) must not persist hooks, MCP servers,
# plugins, commands, agents, skills or output styles outside the sandbox. projects/** (memory,
# plans) stays writable.
claude_own_instance_deny_write:
  - ".credentials.json"
  - ".claude.json"
  - "settings.json"
  - "settings.local.json"
  - "CLAUDE.md"  # Ansible-managed; per-project local edits go in the project CLAUDE.local.md
  - "hooks/**"
  - "plugins/**"
  - "commands/**"
  - "agents/**"
  - "skills/**"
  - "output-styles/**"

claude_deny_write_only:
  - "~/.config/systemd/user/**"  # Claude-the-agent only; Ansible deploys claude-queue.service/timer here
  - "~/.bashrc"
  - "~/.zshrc"
  - "~/.profile"
  - "~/.bash_profile"
  - "~/.zshenv"
  - "~/.zprofile"
  - "~/.config/zsh/**"  # zshrc sources local.zsh from here on every interactive shell; a write is code execution outside the sandbox
  - "~/.local/bin/**"  # Claude-the-agent only; Ansible deploys claude-queue-poller.sh here
  - "~/.config/autostart/**"
  - "~/Library/LaunchAgents/**"
  - "~/.config/git/template/hooks/**"  # Git hooks deployed by dotfiles; must not be overwritten by Claude
  - "**/.githooks/**"  # Repos here use core.hooksPath=.githooks; a planted hook runs on the next git command
  - "**/.git/hooks/**"  # Per-repo hook files; Write + git config --local core.hooksPath enables hook injection
  - "**/.claude/settings.json"  # Project settings load hooks, MCP servers and permissions on the next start
  - "**/.claude/settings.local.json"  # Same, per-checkout local override
  - "**/.mcp.json"  # Project MCP server definitions run commands on the next start
  - "~/.config/environment.d/**"  # DOCKER_HOST + KIND_EXPERIMENTAL_PROVIDER; overwrite breaks Makefile-based kind/Podman workflows
  - "~/.local/share/oh-my-zsh/**"  # oh-my-zsh sources custom/*.zsh on every interactive zsh
  - "~/.config/direnv/**"  # direnvrc is sourced before every .envrc without a direnv allow
  - "~/.config/tmux/**"  # tmux.conf run-shell executes on server start
  - "~/.vimrc"  # vimscript can run system() on every vim start
