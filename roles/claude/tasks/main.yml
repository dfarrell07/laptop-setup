---
# roles/claude/tasks/main.yml
# Claude Code install, instance isolation, settings.

# --- Install Claude Code ---
- name: Check if Claude Code is installed
  ansible.builtin.command:
    cmd: claude --version
  register: claude_version_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Set claude install-needed fact
  ansible.builtin.set_fact:
    _claude_needs_install: |-
      {{ claude_version_check.rc != 0 or
         (claude_pinned_version | length > 0 and
          (claude_pinned_version + ' ') not in ((claude_version_check.stdout | default('')) + ' ')) }}

- name: Fail when install method is unrecognized
  ansible.builtin.fail:
    msg: >-
      claude_install_method '{{ claude_install_method }}' is unrecognized;
      Claude was not installed. Valid values: 'native', 'skip'.
      Note: 'npm' was never implemented (supply chain risk — see troubleshooting.md).
  when: claude_install_method not in ['native', 'skip']

- name: Install Claude Code via native binary
  when:
    - _claude_needs_install
    - claude_install_method == 'native'
    - packages_install_binaries | bool
  block:
    - name: Run Claude Code install script
      ansible.builtin.shell:  # noqa: command-instead-of-shell risky-shell-pipe command-instead-of-module no-changed-when
        cmd: >-
          set -o pipefail && curl --max-time 120 --connect-timeout 15 -fsSL
          {{ claude_install_url }} |
          {% if claude_pinned_version %}CLAUDE_VERSION={{ claude_pinned_version }} {% endif %}bash
        executable: /bin/bash
      timeout: 150
  rescue:
    - name: Record Claude install failure (CSB restriction)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: claude
        _csb_task_name: "Install Claude Code via native binary"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Install Claude Code manually after provisioning:
          curl -fsSL {{ claude_install_url }} | bash
        _csb_ticket_summary: "Cannot install Claude Code on CSB (fapolicyd blocks curl | bash)"
        _csb_ticket_body: >-
          The Claude Code installer could not run ({{ claude_install_url }} may be blocked
          by fapolicyd). Install manually after provisioning:
          curl -fsSL {{ claude_install_url }} | bash
      when: csb_rhel
    - name: Fail — Claude Code install failed on non-CSB machine
      ansible.builtin.fail:
        msg: >-
          Claude Code install failed ({{ claude_install_url }} may be blocked).
          Install manually: curl -fsSL {{ claude_install_url }} | bash
      when: not csb_rhel

# --- Instance isolation directories and settings ---
# Build the active instance list: default + personal always present; work added when profile=work or queue enabled.
- name: Set active Claude instance directories
  ansible.builtin.set_fact:
    _claude_instances: >-
      {{ [claude_default_config_dir, claude_personal_config_dir]
         + ([claude_work_config_dir] if (profile == 'work' or claude_queue_enabled | bool) else []) }}

- name: Create Claude instance config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop: "{{ _claude_instances }}"
  loop_control:
    label: "{{ item | basename }}"

# Deploy security-critical settings (sandbox, deny lists, telemetry, MCP policy)
# to settings.local.json, not settings.json.  Claude Code's /config command
# overwrites settings.json (theme, model, etc.) but does NOT touch
# settings.local.json, so security policy survives user preference changes.
# Claude Code merges both files; settings.local.json takes precedence.
- name: Deploy instance settings.local.json
  ansible.builtin.template:
    src: settings.json.j2
    dest: "{{ item }}/settings.local.json"
    mode: "0600"
  loop: "{{ _claude_instances }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Deploy instance CLAUDE.md (preserve local edits, force false)
  ansible.builtin.template:
    src: CLAUDE.md.j2
    dest: "{{ item }}/CLAUDE.md"
    mode: "0600"
    force: false
  loop: "{{ _claude_instances }}"
  loop_control:
    label: "{{ item | basename }}"

# --- Security: ~/.claude permissions ---
# Claude Code resets ~/.claude to 0755 on every launch, defeating a one-time
# chmod.  Use systemd-tmpfiles to re-apply 0700 at each boot instead.
- name: Deploy claude-privacy tmpfiles config
  ansible.builtin.template:
    src: claude-privacy.conf.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/user-tmpfiles.d/claude-privacy.conf"
    mode: "0644"
  when: is_linux
  notify: Apply claude-privacy tmpfiles

- name: Set ~/.claude directory permissions (macOS fallback)
  ansible.builtin.file:
    path: "{{ claude_default_config_dir }}"
    mode: "0700"
  when: is_macos
  failed_when: false

# --- Git safety (defense-in-depth) ---
# core.fsmonitor, safe.bareRepository, core.hooksPath are set via gitconfig.j2
- name: Remove unsafe safe.directory wildcard entries  # noqa: command-instead-of-module risky-shell-pipe
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      found=$(git config --global --get-all safe.directory 2>/dev/null | grep -cE '^\*{1,2}$|^/$' || echo 0)
      if [[ "$found" -gt 0 ]]; then
        for pat in '^\*$' '^\*\*$' '^/$'; do
          git config --global --unset-all safe.directory "$pat" 2>/dev/null || true
        done
        exit 0
      fi
      exit 1
    executable: /bin/bash
  register: claude_safe_dir
  changed_when: claude_safe_dir.rc == 0
  failed_when: false

# --- Task queue (systemd timer + poller script) ---
- name: Assert claude_queue_repo is set when queue is enabled
  ansible.builtin.assert:
    that:
      - claude_queue_repo | length > 0
    fail_msg: "claude_queue_repo must be set in config.yml when claude_queue_enabled=true"
  when: claude_queue_enabled | bool

- name: Install util-linux for flock (macOS, queue enabled)
  community.general.homebrew:
    name: util-linux
    state: present
  when:
    - claude_queue_enabled | bool
    - is_macos

- name: Ensure ~/.config/claude directory exists (queue config)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/claude"
    state: directory
    mode: "0700"
  when: claude_queue_enabled | bool

- name: Deploy queue-repos.conf stub (first run only — edit to add repos)
  ansible.builtin.template:
    src: queue-repos.conf.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/claude/queue-repos.conf"
    mode: "0600"
    force: false
  when: claude_queue_enabled | bool

- name: Deploy task queue poller script
  ansible.builtin.copy:
    src: claude-queue-poller.sh
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/claude-queue-poller.sh"
    mode: "0700"
  when: claude_queue_enabled | bool

- name: Deploy task queue systemd service
  ansible.builtin.template:
    src: claude-queue.service.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/claude-queue.service"
    mode: "0644"
  when:
    - claude_queue_enabled | bool
    - is_linux
    - not (system_is_container | default(false))  # user inotify triggers daemon-reload, crashes container PID 1

- name: Deploy task queue systemd timer
  ansible.builtin.template:
    src: claude-queue.timer.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/claude-queue.timer"
    mode: "0644"
  when:
    - claude_queue_enabled | bool
    - is_linux
    - not (system_is_container | default(false))  # user inotify triggers daemon-reload, crashes container PID 1

- name: Enable task queue timer
  ansible.builtin.systemd:
    name: claude-queue.timer
    scope: user
    state: started
    enabled: true
    daemon_reload: true
  when:
    - claude_queue_enabled | bool
    - is_linux
    - not (system_is_container | default(false))  # scope:user daemon-reload crashes Podman container PID 1
  register: _timer_enable
  failed_when: false

- name: Warn if timer enable failed (no active user systemd session)
  ansible.builtin.debug:
    msg: >-
      WARNING: claude-queue.timer enable failed ({{ _timer_enable.msg | default('unknown error') }}).
      This is expected on real machines provisioned without an active user session; the timer will be active after login.
  when:
    - claude_queue_enabled | bool
    - is_linux
    - _timer_enable.failed | default(false)

- name: Deploy logrotate config for claude-queue-poller.log
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      {{ ansible_facts['user_dir'] }}/.local/share/claude-queue/logs/poller.log {
          su {{ ansible_facts['user_id'] }} {{ ansible_facts['user_id'] }}
          daily
          rotate 14
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
      }
    dest: /etc/logrotate.d/claude-queue-poller
    mode: "0644"
  become: true
  tags: [become]
  when:
    - claude_queue_enabled | bool
    - is_linux
    - not (system_is_container | default(false))

# --- Disable task queue when not enabled (cleanup if previously enabled) ---
- name: Stop and disable task queue timer (when disabled)
  ansible.builtin.systemd:
    name: claude-queue.timer
    scope: user
    state: stopped
    enabled: false
  when:
    - not (claude_queue_enabled | bool)
    - is_linux
    - not (system_is_container | default(false))  # scope:user systemd stop crashes Podman container PID 1
  failed_when: false

- name: Remove task queue systemd unit files (when disabled)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/{{ item }}"
    state: absent
  loop:
    - claude-queue.service
    - claude-queue.timer
  register: _claude_queue_unit_removal
  when:
    - not (claude_queue_enabled | bool)
    - is_linux
    - not (system_is_container | default(false))  # files do not exist in containers (deploy was skipped)

- name: Remove task queue poller script (when disabled)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin/claude-queue-poller.sh"
    state: absent
  when:
    - not (claude_queue_enabled | bool)

- name: Reload systemd user daemon after removing task queue unit files  # noqa: no-handler
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  when:
    - not (claude_queue_enabled | bool)
    - is_linux
    - not (system_is_container | default(false))  # scope:user daemon-reload crashes Podman container PID 1
    - _claude_queue_unit_removal.changed
  failed_when: false

- name: Remove logrotate config for claude-queue-poller.log (when disabled)
  ansible.builtin.file:
    path: /etc/logrotate.d/claude-queue-poller
    state: absent
  become: true
  tags: [become]
  when:
    - not (claude_queue_enabled | bool)
    - is_linux
    - not (system_is_container | default(false))

# --- macOS: launchd cleanup when disabled ---
- name: Check if task queue launchd plist exists (macOS)
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-queue.plist"
  register: _claude_queue_plist_stat
  when:
    - is_macos
    - not (claude_queue_enabled | bool)

- name: Unload task queue launchd agent (macOS, when disabled)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-  # yamllint disable-line rule:line-length
      launchctl bootout gui/{{ ansible_facts['user_uid'] }}
      {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-queue.plist
  register: _claude_queue_bootout_result
  when:
    - is_macos
    - not (claude_queue_enabled | bool)
    - _claude_queue_plist_stat.stat.exists
  changed_when: _claude_queue_bootout_result.rc == 0
  failed_when: false

- name: Remove task queue launchd plist (macOS, when disabled)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-queue.plist"
    state: absent
  when:
    - is_macos
    - not (claude_queue_enabled | bool)
    - _claude_queue_plist_stat.stat.exists

- name: Check if Remote Control launchd plist exists (macOS)
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-remote-control.plist"
  register: _claude_rc_plist_stat
  when:
    - is_macos
    - not (claude_remote_control_enabled | bool)

- name: Unload Remote Control launchd agent (macOS, when disabled)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-  # yamllint disable-line rule:line-length
      launchctl bootout gui/{{ ansible_facts['user_uid'] }}
      {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-remote-control.plist
  register: _claude_rc_bootout_result
  when:
    - is_macos
    - not (claude_remote_control_enabled | bool)
    - _claude_rc_plist_stat.stat.exists
  changed_when: _claude_rc_bootout_result.rc == 0
  failed_when: false

- name: Remove Remote Control launchd plist (macOS, when disabled)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-remote-control.plist"
    state: absent
  when:
    - is_macos
    - not (claude_remote_control_enabled | bool)
    - _claude_rc_plist_stat.stat.exists

- name: Warn that Remote Control is not implemented on Linux
  ansible.builtin.debug:
    msg: >-
      claude_remote_control_enabled is true but Remote Control is macOS-only (launchd);
      no systemd unit exists — ignoring.
  when: claude_remote_control_enabled | bool and is_linux

# --- macOS: launchd services ---
- name: Ensure log directory exists (macOS)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/state/log"
    state: directory
    mode: "0755"
  when:
    - is_macos
    - claude_queue_enabled | bool or claude_remote_control_enabled | bool

- name: Deploy task queue launchd plist (macOS)
  ansible.builtin.template:
    src: claude-queue.plist.j2
    dest: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-queue.plist"
    mode: "0644"
  when:
    - is_macos
    - claude_queue_enabled | bool
  register: _claude_queue_plist_result

- name: Bootout task queue launchd agent when plist changed (macOS)  # noqa: command-instead-of-module
  # Bootout the running agent so the subsequent bootstrap picks up the new plist.
  # failed_when: false — agent may not be running on first deploy; bootout exits non-zero in that case.
  ansible.builtin.command:
    cmd: >-  # yamllint disable-line rule:line-length
      launchctl bootout gui/{{ ansible_facts['user_uid'] }}
      {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-queue.plist
  when:
    - is_macos
    - claude_queue_enabled | bool
    - _claude_queue_plist_result.changed
  changed_when: false
  failed_when: false

- name: Load task queue launchd plist (macOS)  # noqa: command-instead-of-module
  # 'launchctl bootstrap' is the modern replacement for the deprecated
  # 'launchctl load -w' (deprecated since macOS 10.10 Yosemite).
  # failed_when: false handles the non-zero exit when the agent is already bootstrapped.
  ansible.builtin.command:
    cmd: "launchctl bootstrap gui/{{ ansible_facts['user_uid'] }} {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-queue.plist"  # yamllint disable-line rule:line-length
  when:
    - is_macos
    - claude_queue_enabled | bool
  register: _claude_queue_bootstrap_result
  changed_when: _claude_queue_bootstrap_result.rc == 0
  failed_when: false

- name: Deploy Remote Control launchd plist (macOS)
  ansible.builtin.template:
    src: claude-remote-control.plist.j2
    dest: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-remote-control.plist"
    mode: "0644"
  when:
    - is_macos
    - claude_remote_control_enabled | bool
  register: _claude_rc_plist_result

- name: Bootout Remote Control launchd agent when plist changed (macOS)  # noqa: command-instead-of-module
  # Bootout the running agent so the subsequent bootstrap picks up the new plist.
  # failed_when: false — agent may not be running on first deploy; bootout exits non-zero in that case.
  ansible.builtin.command:
    cmd: >-  # yamllint disable-line rule:line-length
      launchctl bootout gui/{{ ansible_facts['user_uid'] }}
      {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-remote-control.plist
  when:
    - is_macos
    - claude_remote_control_enabled | bool
    - _claude_rc_plist_result.changed
  changed_when: false
  failed_when: false

- name: Load Remote Control launchd plist (macOS)  # noqa: command-instead-of-module
  # 'launchctl bootstrap' is the modern replacement for the deprecated
  # 'launchctl load -w' (deprecated since macOS 10.10 Yosemite).
  # failed_when: false handles the non-zero exit when the agent is already bootstrapped.
  ansible.builtin.command:
    cmd: "launchctl bootstrap gui/{{ ansible_facts['user_uid'] }} {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-remote-control.plist"  # yamllint disable-line rule:line-length
  when:
    - is_macos
    - claude_remote_control_enabled | bool
  register: _claude_rc_bootstrap_result
  changed_when: _claude_rc_bootstrap_result.rc == 0
  failed_when: false
