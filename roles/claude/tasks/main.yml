---
# roles/claude/tasks/main.yml
# Claude Code install, instance isolation, settings.

# --- Install Claude Code ---
- name: Fail if claude_install_method is npm (removed, not implemented)
  ansible.builtin.fail:
    msg: "npm install method is removed; set claude_install_method to native"
  when: claude_install_method == 'npm'

- name: Check if Claude Code is installed
  ansible.builtin.command:
    cmd: claude --version
  register: claude_version_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Install Claude Code via native binary
  when:
    - claude_version_check.rc != 0
    - claude_install_method == 'native'
    - packages_install_binaries | bool
  block:
    - name: Install Claude Code via native binary
      ansible.builtin.shell:  # noqa: command-instead-of-shell risky-shell-pipe command-instead-of-module no-changed-when
        cmd: "set -o pipefail && curl -fsSL {{ claude_install_url }} | bash"
        executable: /bin/bash
  rescue:
    - name: Record Claude install failure (CSB restriction)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: claude
        _csb_task_name: "Install Claude Code via native binary"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Install Claude Code manually after provisioning:
          curl -fsSL {{ claude_install_url }} | bash
        _csb_ticket_summary: "Cannot install Claude Code on CSB (fapolicyd blocks curl | bash)"
        _csb_ticket_body: >-
          The Claude Code installer could not run ({{ claude_install_url }} may be blocked
          by fapolicyd). Install manually after provisioning:
          curl -fsSL {{ claude_install_url }} | bash
      when: csb_detected

    - name: Warn if Claude install failed (non-CSB)
      ansible.builtin.debug:
        msg: >-
          WARNING: Claude Code install failed ({{ claude_install_url }} may be blocked).
          Install manually: curl -fsSL {{ claude_install_url }} | bash
      when: not csb_rhel

- name: Fail when install method is unrecognized
  ansible.builtin.fail:
    msg: >-
      claude_install_method '{{ claude_install_method }}' is unrecognized;
      Claude was not installed. Set 'claude_install_method: native' in config.yml and re-run.
  when: claude_install_method not in ['native', 'skip']

# --- Instance isolation directories and settings ---
# Build the active instance list: default + personal always present; work added when profile=work or queue enabled.
- name: Set active Claude instance directories
  ansible.builtin.set_fact:
    _claude_instances: >-
      {{ [ansible_facts['user_dir'] + '/.claude', claude_personal_config_dir]
         + ([claude_work_config_dir] if (profile == 'work' or claude_queue_enabled | bool) else []) }}

- name: Create Claude instance config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop: "{{ _claude_instances }}"
  loop_control:
    label: "{{ item | basename }}"

# Deploy security-critical settings (sandbox, deny lists, telemetry, MCP policy)
# to settings.local.json, not settings.json.  Claude Code's /config command
# overwrites settings.json (theme, model, etc.) but does NOT touch
# settings.local.json, so security policy survives user preference changes.
# Claude Code merges both files; settings.local.json takes precedence.
- name: Deploy instance settings.local.json
  ansible.builtin.template:
    src: settings.json.j2
    dest: "{{ item }}/settings.local.json"
    mode: "0600"
  loop: "{{ _claude_instances }}"
  loop_control:
    label: "{{ item | basename }}"

- name: "Deploy instance CLAUDE.md (force: false — preserve local edits)"
  ansible.builtin.template:
    src: CLAUDE.md.j2
    dest: "{{ item }}/CLAUDE.md"
    mode: "0600"
    force: false
  loop: "{{ _claude_instances }}"
  loop_control:
    label: "{{ item | basename }}"

# --- Security: ~/.claude permissions ---
# Claude Code resets ~/.claude to 0755 on every launch, defeating a one-time
# chmod.  Use systemd-tmpfiles to re-apply 0700 at each boot instead.
- name: Deploy claude-privacy tmpfiles config
  ansible.builtin.copy:
    content: |
      # Create ~/.claude at 0700 before first launch; restores 0700 at each boot.
      # Claude Code resets to 0755 on launch — 'd' creates, 'Z' fixes recursively.
      # 'z' (non-recursive) leaves subdirs at 0755; 'Z' protects session-env,
      # shell-snapshots, cache, etc.  No symlinks exist under ~/.claude.
      d %h/.claude 0700 - - -
      Z %h/.claude 0700 - - -
    dest: "{{ ansible_facts['user_dir'] }}/.config/user-tmpfiles.d/claude-privacy.conf"
    mode: "0644"
  when: ansible_facts['system'] == 'Linux'

- name: Apply claude-privacy tmpfiles now
  ansible.builtin.command:
    cmd: systemd-tmpfiles --user --create
  changed_when: false
  when: ansible_facts['system'] == 'Linux'

- name: Set ~/.claude directory permissions (macOS fallback)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.claude"
    mode: "0700"
  when: ansible_facts['system'] == 'Darwin'
  failed_when: false

# --- Git safety (defense-in-depth) ---
# core.fsmonitor, safe.bareRepository, core.hooksPath are set via gitconfig.j2
- name: Remove unsafe safe.directory wildcard entries  # noqa: command-instead-of-module risky-shell-pipe
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      found=$(git config --global --get-all safe.directory 2>/dev/null | grep -cE '^\*{1,2}$|^/$' || echo 0)
      if [[ "$found" -gt 0 ]]; then
        for pat in '^\*$' '^\*\*$' '^/$'; do
          git config --global --unset-all safe.directory "$pat" 2>/dev/null || true
        done
        exit 0
      fi
      exit 1
    executable: /bin/bash
  register: claude_safe_dir
  changed_when: claude_safe_dir.rc == 0
  failed_when: false

# --- Task queue (systemd timer + poller script) ---
- name: Install util-linux for flock (macOS, queue enabled)
  community.general.homebrew:
    name: util-linux
    state: present
  when:
    - claude_queue_enabled | bool
    - ansible_facts['os_family'] == 'Darwin'

- name: Ensure ~/.config/claude directory exists (queue config)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/claude"
    state: directory
    mode: "0700"
  when: claude_queue_enabled | bool

- name: Deploy queue-repos.conf stub (first run only — edit to add repos)
  ansible.builtin.template:
    src: queue-repos.conf.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/claude/queue-repos.conf"
    mode: "0600"
    force: false
  when: claude_queue_enabled | bool

- name: Deploy task queue poller script
  ansible.builtin.copy:
    src: claude-queue-poller.sh
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/claude-queue-poller.sh"
    mode: "0700"
  when: claude_queue_enabled | bool

- name: Deploy task queue systemd service
  ansible.builtin.template:
    src: claude-queue.service.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/claude-queue.service"
    mode: "0644"
  when:
    - claude_queue_enabled | bool
    - ansible_facts['system'] == 'Linux'

- name: Deploy task queue systemd timer
  ansible.builtin.template:
    src: claude-queue.timer.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/claude-queue.timer"
    mode: "0644"
  when:
    - claude_queue_enabled | bool
    - ansible_facts['system'] == 'Linux'

- name: Enable task queue timer
  ansible.builtin.systemd:
    name: claude-queue.timer
    scope: user
    state: started
    enabled: true
    daemon_reload: true
  when:
    - claude_queue_enabled | bool
    - ansible_facts['system'] == 'Linux'
  failed_when: false

# --- Disable task queue when not enabled (cleanup if previously enabled) ---
- name: Stop and disable task queue timer (when disabled)
  ansible.builtin.systemd:
    name: claude-queue.timer
    scope: user
    state: stopped
    enabled: false
  when:
    - not (claude_queue_enabled | bool)
    - ansible_facts['system'] == 'Linux'
  failed_when: false

- name: Remove task queue systemd unit files (when disabled)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/{{ item }}"
    state: absent
  loop:
    - claude-queue.service
    - claude-queue.timer
  register: _claude_queue_unit_removal
  when:
    - not (claude_queue_enabled | bool)
    - ansible_facts['system'] == 'Linux'

- name: Reload systemd user daemon after removing task queue unit files  # noqa: no-handler
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  when:
    - not (claude_queue_enabled | bool)
    - ansible_facts['system'] == 'Linux'
    - _claude_queue_unit_removal.changed
  failed_when: false

# --- macOS: launchd cleanup when disabled ---
- name: Unload task queue launchd agent (macOS, when disabled)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-  # yamllint disable-line rule:line-length
      launchctl bootout gui/$(id -u)
      {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-queue.plist
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - not (claude_queue_enabled | bool)
  changed_when: false
  failed_when: false

- name: Remove task queue launchd plist (macOS, when disabled)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-queue.plist"
    state: absent
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - not (claude_queue_enabled | bool)

- name: Unload Remote Control launchd agent (macOS, when disabled)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-  # yamllint disable-line rule:line-length
      launchctl bootout gui/$(id -u)
      {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-remote-control.plist
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - not (claude_remote_control_enabled | bool)
  changed_when: false
  failed_when: false

- name: Remove Remote Control launchd plist (macOS, when disabled)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-remote-control.plist"
    state: absent
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - not (claude_remote_control_enabled | bool)

# --- macOS: launchd services ---
- name: Ensure log directory exists (macOS)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/state/log"
    state: directory
    mode: "0755"
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - claude_queue_enabled | bool or claude_remote_control_enabled | bool

- name: Deploy task queue launchd plist (macOS)
  ansible.builtin.template:
    src: claude-queue.plist.j2
    dest: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-queue.plist"
    mode: "0644"
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - claude_queue_enabled | bool

- name: Load task queue launchd plist (macOS)  # noqa: command-instead-of-module
  # 'launchctl bootstrap' is the modern replacement for the deprecated
  # 'launchctl load -w' (deprecated since macOS 10.10 Yosemite).
  # failed_when: false handles the non-zero exit when the agent is already bootstrapped.
  ansible.builtin.command:
    cmd: "launchctl bootstrap gui/$(id -u) {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-queue.plist"  # yamllint disable-line rule:line-length
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - claude_queue_enabled | bool
  changed_when: false
  failed_when: false

- name: Deploy Remote Control launchd plist (macOS)
  ansible.builtin.template:
    src: claude-remote-control.plist.j2
    dest: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-remote-control.plist"
    mode: "0644"
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - claude_remote_control_enabled | bool

- name: Load Remote Control launchd plist (macOS)  # noqa: command-instead-of-module
  # 'launchctl bootstrap' is the modern replacement for the deprecated
  # 'launchctl load -w' (deprecated since macOS 10.10 Yosemite).
  # failed_when: false handles the non-zero exit when the agent is already bootstrapped.
  ansible.builtin.command:
    cmd: "launchctl bootstrap gui/$(id -u) {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.claude-remote-control.plist"  # yamllint disable-line rule:line-length
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - claude_remote_control_enabled | bool
  changed_when: false
  failed_when: false

# brew autoupdate moved to roles/packages/tasks/main.yml — it manages all Homebrew
# packages, not Claude-specific functionality, and belongs with the packages role.
