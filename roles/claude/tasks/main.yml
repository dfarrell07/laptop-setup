---
# roles/claude/tasks/main.yml
# Claude Code install, instance isolation, settings.

# --- Install Claude Code ---
- name: Check if Claude Code is installed
  ansible.builtin.command:
    cmd: "{{ claude_bin_path }} --version"
  register: claude_version_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Set claude install-needed fact
  ansible.builtin.set_fact:
    _claude_needs_install: >-
      {{ claude_version_check.rc != 0 or (claude_pinned_version | length > 0
      and claude_pinned_version not in
      (claude_version_check.stdout | default('') | trim).split()) }}

- name: Fail when install method is unrecognized
  ansible.builtin.assert:
    that:
      - claude_install_method in ['native', 'skip']
    fail_msg: >-
      claude_install_method '{{ claude_install_method }}' is unrecognized; valid values: 'native', 'skip'.

- name: Install Claude Code via native binary
  when:
    - _claude_needs_install
    - claude_install_method == 'native'
    - packages_install_binaries | bool
  block:
    - name: Run Claude Code install script
      ansible.builtin.shell:  # noqa: risky-shell-pipe command-instead-of-module no-changed-when
        cmd: >-
          set -o pipefail && curl --max-time 120 --connect-timeout 15 -fsSL
          {{ claude_install_url }} |
          {% if claude_pinned_version %}CLAUDE_VERSION={{ claude_pinned_version }} {% endif %}bash
        executable: /bin/bash
      timeout: 150
  rescue:
    - name: Record Claude install failure (CSB restriction)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: claude
        _csb_task_name: "Install Claude Code via native binary"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Install Claude Code manually after provisioning:
          curl -fsSL {{ claude_install_url }} | bash
        _csb_ticket_summary: "Cannot install Claude Code on CSB (fapolicyd blocks curl | bash)"
        _csb_ticket_body: >-
          The Claude Code installer could not run ({{ claude_install_url }} may be blocked
          by fapolicyd). Install manually after provisioning:
          curl -fsSL {{ claude_install_url }} | bash
      when: csb_rhel
    - name: Fail — Claude Code install failed on non-CSB machine
      ansible.builtin.fail:
        msg: >-
          Claude Code install failed ({{ claude_install_url }} may be blocked).
          Install manually: curl -fsSL {{ claude_install_url }} | bash
      when: not csb_rhel

# --- Instance isolation directories and settings ---
# Build the active instance list. Three cases:
#   default only:    default always present; personal when claude_personal_instance_enabled
#   +work:           profile=work adds claude_work_config_dir
#   +remote-control: is_macos + claude_remote_control_enabled adds claude_remote_control_config_dir
- name: Set active Claude instance directories
  ansible.builtin.set_fact:
    _claude_instances: >-
      {{ ([claude_default_config_dir]
          + ([claude_personal_config_dir] if (claude_personal_instance_enabled | bool) else [])
          + ([claude_work_config_dir] if (profile == 'work') else [])
          + ([claude_remote_control_config_dir] if (is_macos and claude_remote_control_enabled | bool) else []))
         | unique }}

- name: Create Claude instance config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop: "{{ _claude_instances }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Ensure ~/.config/claude directory exists
  ansible.builtin.file:
    path: "{{ claude_queue_runtime_config_dir }}"
    state: directory
    mode: "0700"
  when: profile == 'work' or claude_queue_enabled | bool

- name: Deploy Claude work-env file
  ansible.builtin.copy:
    content: |
      export CLAUDE_CONFIG_DIR={{ claude_work_config_dir }}
      # Uncomment after adding companion vars (ANTHROPIC_VERTEX_PROJECT_ID, CLOUD_ML_REGION, GOOGLE_CLOUD_PROJECT):
      # export CLAUDE_CODE_USE_VERTEX=1
      # export ANTHROPIC_VERTEX_PROJECT_ID=...
    dest: "{{ claude_queue_runtime_config_dir }}/work-env"
    mode: "0600"
    force: false
  when: profile == 'work'

- name: Remove Claude work-env file when not work profile
  ansible.builtin.file:
    path: "{{ claude_queue_runtime_config_dir }}/work-env"
    state: absent
  when: profile != 'work'

# Deploy security-critical settings (sandbox, deny lists, telemetry, MCP policy)
# to settings.local.json, not settings.json.  Claude Code's /config command
# overwrites settings.json (theme, model, etc.) but does NOT touch
# settings.local.json, so security policy survives user preference changes.
# Claude Code merges both files; settings.local.json takes precedence.
- name: Deploy instance settings.local.json
  ansible.builtin.template:
    src: settings.local.json.j2
    dest: "{{ item }}/settings.local.json"
    mode: "0600"
  loop: "{{ _claude_instances }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Deploy instance CLAUDE.md (preserve local edits, force false)
  ansible.builtin.template:
    src: CLAUDE.md.j2
    dest: "{{ item }}/CLAUDE.md"
    mode: "0600"
    force: false
  loop: "{{ _claude_instances }}"
  loop_control:
    label: "{{ item | basename }}"

# --- Security: ~/.claude permissions ---
# Claude Code resets ~/.claude to 0755 on every launch, defeating a one-time
# chmod.  Use systemd-tmpfiles to re-apply 0700 at each boot instead.
- name: Deploy claude-privacy tmpfiles config
  ansible.builtin.template:
    src: claude-privacy.conf.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/user-tmpfiles.d/claude-privacy.conf"
    mode: "0644"
  when: is_linux
  notify: Apply claude-privacy tmpfiles

# --- Git safety (defense-in-depth) ---
# core.fsmonitor, safe.bareRepository, core.hooksPath are set via gitconfig.j2
- name: Remove unsafe safe.directory wildcard entries  # noqa: command-instead-of-module risky-shell-pipe
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      found=$(git config --global --get-all safe.directory 2>/dev/null | grep -cE '^\*{1,2}$|^/$' || true)
      if [[ "$found" -gt 0 ]]; then
        for pat in '^\*$' '^\*\*$' '^/$'; do
          git config --global --unset-all safe.directory "$pat" 2>/dev/null || true
        done
        echo CHANGED; exit 0
      fi
      exit 0
    executable: /bin/bash
  register: claude_safe_dir
  changed_when: "'CHANGED' in claude_safe_dir.stdout"
  failed_when: false

# --- Task queue (systemd timer + poller script) ---
- name: Assert claude_queue_repo is set when queue is enabled
  ansible.builtin.assert:
    that:
      - claude_queue_repo | length > 0
    fail_msg: "claude_queue_repo must be set in config.yml when claude_queue_enabled=true"
  when: claude_queue_enabled | bool

- name: Assert dotfiles_github_user is set for macOS launchd agent naming
  ansible.builtin.assert:
    that:
      - dotfiles_github_user | length > 0
      - dotfiles_github_user != 'CHANGE_ME'
    fail_msg: "dotfiles_github_user must be set in config.yml (used in launchd reverse-DNS label)"
  when:
    - is_macos
    - claude_queue_enabled | bool or claude_remote_control_enabled | bool

- name: Install util-linux for flock (macOS, queue enabled)
  community.general.homebrew:
    name: util-linux
    state: present
  when:
    - claude_queue_enabled | bool
    - is_macos

- name: Deploy queue-repos.conf stub (first run only — edit to add repos)
  ansible.builtin.template:
    src: queue-repos.conf.j2
    dest: "{{ claude_queue_runtime_config_dir }}/queue-repos.conf"
    mode: "0600"
    force: false
  when: claude_queue_enabled | bool

- name: Deploy task queue poller script
  ansible.builtin.copy:
    src: claude-queue-poller.sh
    dest: "{{ claude_queue_poller_path }}"
    mode: "0700"
  when: claude_queue_enabled | bool

- name: Deploy and enable task queue systemd units
  when:
    - claude_queue_enabled | bool
    - is_linux
    - not (system_is_container)  # user inotify triggers daemon-reload, crashes container PID 1
  block:
    - name: Ensure ~/.config/systemd/user directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: Deploy task queue systemd service
      ansible.builtin.template:
        src: claude-queue.service.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/claude-queue.service"
        mode: "0644"
      register: _queue_service

    - name: Deploy task queue systemd timer
      ansible.builtin.template:
        src: claude-queue.timer.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/claude-queue.timer"
        mode: "0644"
      register: _queue_timer

    - name: Reload systemd user daemon after deploying queue units  # noqa: no-handler
      ansible.builtin.systemd:
        scope: user
        daemon_reload: true
      when: _queue_service.changed or _queue_timer.changed
      failed_when: false

    - name: Enable task queue timer
      ansible.builtin.systemd:
        name: claude-queue.timer
        scope: user
        state: started
        enabled: true
      register: _timer_enable
      ignore_errors: true  # required: sets .failed=True so Warn task below can trigger; do NOT replace with failed_when: false

- name: Warn if timer enable failed (no active user systemd session)
  ansible.builtin.debug:
    msg: >-
      WARNING: claude-queue.timer enable failed ({{ _timer_enable.msg | default('unknown error') }}).
      This is expected on real machines provisioned without an active user session; the timer will be active after login.
  when:
    - claude_queue_enabled | bool
    - is_linux
    - not (system_is_container)
    - _timer_enable.failed | default(false)

- name: Get primary group name for logrotate su directive
  ansible.builtin.command:
    cmd: id -gn
  register: _primary_group_name
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - claude_queue_enabled | bool
    - is_linux
    - not (system_is_container)

- name: Deploy logrotate config for claude-queue-poller.log
  ansible.builtin.template:
    src: claude-queue-poller-logrotate.j2
    dest: /etc/logrotate.d/claude-queue-poller
    mode: "0644"
  become: true
  tags: [become]
  when:
    - claude_queue_enabled | bool
    - is_linux
    - not (system_is_container)

# --- Disable task queue when not enabled (cleanup if previously enabled) ---
- name: Stop and disable task queue timer (when disabled)
  ansible.builtin.systemd:
    name: claude-queue.timer
    scope: user
    state: stopped
    enabled: false
  when:
    - not (claude_queue_enabled | bool)
    - is_linux
    - not (system_is_container)  # scope:user systemd stop crashes Podman container PID 1
  failed_when: false

- name: Remove task queue systemd unit files (when disabled)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/{{ item }}"
    state: absent
  loop:
    - claude-queue.service
    - claude-queue.timer
  register: _claude_queue_unit_removal
  when:
    - not (claude_queue_enabled | bool)
    - is_linux
    - not (system_is_container)  # files do not exist in containers (deploy was skipped)

- name: Remove task queue poller script (when disabled)
  ansible.builtin.file:
    path: "{{ claude_queue_poller_path }}"
    state: absent
  when:
    - not (claude_queue_enabled | bool)

- name: Reload systemd user daemon after removing task queue unit files  # noqa: no-handler
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  when:
    - not (claude_queue_enabled | bool)
    - is_linux
    - not (system_is_container)  # scope:user daemon-reload crashes Podman container PID 1
    - _claude_queue_unit_removal.changed
  failed_when: false

- name: Remove logrotate config for claude-queue-poller.log (when disabled)
  ansible.builtin.file:
    path: /etc/logrotate.d/claude-queue-poller
    state: absent
  become: true
  tags: [become]
  when:
    - not (claude_queue_enabled | bool)
    - is_linux
    - not (system_is_container)

# --- macOS: launchd agent list (single source of truth for cleanup and load loops) ---
- name: Set launchd agent list
  ansible.builtin.set_fact:
    _claude_launchd_agents: >-
      {{ [] if not is_macos else [
         {'label': 'queue',
          'plist_path': ansible_facts['user_dir'] ~
          '/Library/LaunchAgents/com.' ~ dotfiles_github_user ~
          '.claude-queue.plist',
          'enabled': claude_queue_enabled | bool},
         {'label': 'remote-control',
          'plist_path': ansible_facts['user_dir'] ~
          '/Library/LaunchAgents/com.' ~ dotfiles_github_user ~
          '.claude-remote-control.plist',
          'enabled': claude_remote_control_enabled | bool}] }}

# --- macOS: launchd cleanup when disabled ---
- name: Cleanup disabled launchd agents (macOS)
  ansible.builtin.include_tasks: launchd_cleanup.yml
  vars:
    _launchd_label: "{{ item.label }}"
    _launchd_plist_path: "{{ item.plist_path }}"
    _launchd_enabled: "{{ item.enabled }}"
  loop: "{{ _claude_launchd_agents }}"
  loop_control:
    label: "{{ item.label }}"
  when: is_macos

- name: Warn when Remote Control is enabled on Linux (macOS-only feature)
  ansible.builtin.debug:
    msg: >-
      claude_remote_control_enabled is true but no systemd unit is configured for Linux
      — launchd autostart is macOS-only. Run `claude --remote-control` manually on Linux if needed.
  when: claude_remote_control_enabled | bool and is_linux

# --- macOS: launchd services ---
- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ claude_log_dir }}"
    state: directory
    mode: "0750"
  when: claude_queue_enabled | bool or (is_macos and claude_remote_control_enabled | bool)

- name: Manage enabled launchd agents (macOS)
  ansible.builtin.include_tasks: launchd_load.yml
  vars:
    _launchd_label: "{{ item.label }}"
    _launchd_plist_path: "{{ item.plist_path }}"
    _launchd_enabled: "{{ item.enabled }}"
  loop: "{{ _claude_launchd_agents }}"
  loop_control:
    label: "{{ item.label }}"
  when: is_macos
