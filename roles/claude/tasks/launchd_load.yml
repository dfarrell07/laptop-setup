---
# roles/claude/tasks/launchd_load.yml
# Deploy a launchd agent and load it, reloading it when its plist changed (macOS only).
# Vars: _launchd_label, _launchd_plist_path, _launchd_enabled
- name: Deploy launchd plist (macOS) — {{ _launchd_label }}
  ansible.builtin.template:
    src: claude-{{ _launchd_label }}.plist.j2
    dest: "{{ _launchd_plist_path }}"
    mode: "0644"
  when: _launchd_enabled | bool
  register: _launchd_plist_result

- name: Load launchd agent (macOS) — {{ _launchd_label }}
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/launchd-agent.yml"
  vars:
    _launchd_agent_label: "com.{{ dotfiles_github_user }}.claude-{{ _launchd_label }}"
    _launchd_agent_plist: "{{ _launchd_plist_path }}"
    _launchd_agent_changed: "{{ _launchd_plist_result is changed }}"
  when: _launchd_enabled | bool
