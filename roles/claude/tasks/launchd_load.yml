---
# roles/claude/tasks/launchd_load.yml
# Deploy a launchd agent and load it, reloading it when its plist changed (macOS only).
# Vars: _launchd_label, _launchd_plist_path, _launchd_enabled, _launchd_template
- name: Check for an earlier agent-getty plist (macOS) — {{ _launchd_label }}
  ansible.builtin.stat:
    path: "{{ _launchd_plist_path }}"
  register: _launchd_plist_before
  when:
    - _launchd_enabled | bool
    - _launchd_label is match('getty-')

- name: Deploy launchd plist (macOS) — {{ _launchd_label }}
  ansible.builtin.template:
    src: "{{ _launchd_template }}"
    dest: "{{ _launchd_plist_path }}"
    mode: "0644"
  when: _launchd_enabled | bool
  register: _launchd_plist_result

# Reloading a changed plist stops the pair, which ends the sessions its daemon started
- name: Warn that a changed agent-getty plist restarts the pair (macOS) — {{ _launchd_label }}
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ _launchd_label }}'s LaunchAgent changed: reloading it restarts the pair, which ends the sessions its
      daemon started.
  when:
    - _launchd_enabled | bool
    - _launchd_plist_before.stat.exists | default(false)
    - _launchd_plist_result is changed

- name: Load launchd agent (macOS) — {{ _launchd_label }}
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/launchd-agent.yml"
  vars:
    _launchd_agent_label: "com.{{ dotfiles_github_user }}.claude-{{ _launchd_label }}"
    _launchd_agent_plist: "{{ _launchd_plist_path }}"
    _launchd_agent_changed: "{{ _launchd_plist_result is changed }}"
  when: _launchd_enabled | bool
