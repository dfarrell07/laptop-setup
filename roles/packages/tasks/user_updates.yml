---
# roles/packages/tasks/user_updates.yml — daily user-space updates (laptop-user-update.timer).
# Logs: journalctl --user -u laptop-user-update; a failed run shows as UPD in the status bar.
- name: Validate user update settings
  ansible.builtin.assert:
    that:
      - packages_user_updates_calendar is match('^[A-Za-z0-9 *:,./~-]+$')
      - packages_user_updates_container is match('^[A-Za-z0-9_.-]*$')
      - packages_user_updates_pipx_skip is sequence and packages_user_updates_pipx_skip is not string
      - packages_user_updates_pipx_skip | reject('match', '^[A-Za-z0-9_.-]+$') | list | length == 0
    fail_msg: >-
      packages_user_updates_calendar must be a plain systemd OnCalendar expression, packages_user_updates_container a
      container name and packages_user_updates_pipx_skip a list of package names (letters, digits, '_', '.', '-').

- name: Create user bin and systemd unit directories
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - .local/bin
    - .config/systemd/user

- name: Deploy the user update script
  ansible.builtin.copy:
    src: laptop-user-update.sh
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/laptop-user-update"
    mode: "0755"

- name: Deploy the user update service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/{{ item }}"
    mode: "0644"
  loop:
    - laptop-user-update.service
    - laptop-user-update.timer
  register: _packages_user_update_units

- name: Check for a running systemd user manager
  ansible.builtin.stat:
    path: "/run/user/{{ ansible_facts['user_uid'] | default('none') }}/systemd/private"
  register: _packages_user_manager

- name: Enable the daily user update timer
  ansible.builtin.systemd:
    name: laptop-user-update.timer
    scope: user
    enabled: true
    state: started
    daemon_reload: "{{ _packages_user_update_units is changed }}"
  when:
    - _packages_user_manager.stat.exists
    - not (ansible_check_mode and _packages_user_update_units is changed)
