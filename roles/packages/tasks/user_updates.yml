---
# roles/packages/tasks/user_updates.yml — daily user-space updates (laptop-user-update.timer; on macOS the launchd
# agent com.laptop-setup.user-update). Logs: journalctl --user -u laptop-user-update, where a failed run shows as UPD
# in the status bar; macOS: ~/.local/state/log/laptop-user-update.log.
- name: Validate user update settings
  ansible.builtin.assert:
    that:
      - packages_user_updates_calendar is match('^[A-Za-z0-9 *:,./~-]+$')
      - packages_user_updates_container is match('^[A-Za-z0-9_.-]*$')
      - packages_user_updates_npm is sequence and packages_user_updates_npm is not string
      - packages_user_updates_npm | reject('match', '^(@[a-z0-9._-]+/)?[a-z0-9._-]+$') | list | length == 0
      - packages_user_updates_pipx_skip is sequence and packages_user_updates_pipx_skip is not string
      - packages_user_updates_pipx_skip | reject('match', '^[A-Za-z0-9_.-]+$') | list | length == 0
    fail_msg: >-
      packages_user_updates_calendar must be a plain systemd OnCalendar expression, packages_user_updates_container a
      container name, and packages_user_updates_npm and packages_user_updates_pipx_skip lists of package names
      (letters, digits, '_', '.', '-', and an npm @scope/).

- name: Create user bin and systemd unit (macOS LaunchAgents and log) directories
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ ['.local/bin'] + (['Library/LaunchAgents', '.local/state/log'] if is_macos else ['.config/systemd/user']) }}"

- name: Deploy the user update script
  ansible.builtin.copy:
    src: laptop-user-update.sh
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/laptop-user-update"
    mode: "0755"

- name: Deploy the user update service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/{{ item }}"
    mode: "0644"
  loop:
    - laptop-user-update.service
    - laptop-user-update.timer
  register: _packages_user_update_units
  when: is_linux

- name: Check for a running systemd user manager
  ansible.builtin.stat:
    path: "/run/user/{{ ansible_facts['user_uid'] | default('none') }}/systemd/private"
  register: _packages_user_manager
  when: is_linux

- name: Enable the daily user update timer
  ansible.builtin.systemd:
    name: laptop-user-update.timer
    scope: user
    enabled: true
    state: started
    daemon_reload: "{{ _packages_user_update_units is changed }}"
  when:
    - is_linux
    - _packages_user_manager.stat.exists
    - not (ansible_check_mode and _packages_user_update_units is changed)

# macOS: a launchd agent runs the same script daily. It goes in the GUI login domain, or the user domain when no one
# is logged in at the console (an SSH-only session), as the Homebrew update agent does.
- name: Daily user update launchd agent (macOS)
  when: is_macos
  vars:
    _packages_user_update_domain: >-
      {{ 'gui' if _packages_user_update_gui.rc | default(1) == 0 else 'user' }}/{{ ansible_facts['user_uid'] }}
  block:
    - name: Deploy the user update launchd agent (macOS)
      ansible.builtin.template:
        src: laptop-user-update.plist.j2
        dest: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.laptop-setup.user-update.plist"
        mode: "0644"
      register: _packages_user_update_plist

    - name: Check whether the graphical launchd domain is available (macOS)  # noqa: command-instead-of-module
      ansible.builtin.command:
        argv: [/bin/launchctl, print, "gui/{{ ansible_facts['user_uid'] }}"]
      register: _packages_user_update_gui
      changed_when: false
      failed_when: false
      check_mode: false  # read-only probe

    - name: Register the user update job (macOS)
      ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/launchd-agent.yml"
      vars:
        _launchd_agent_label: com.laptop-setup.user-update
        _launchd_agent_plist: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.laptop-setup.user-update.plist"
        _launchd_agent_changed: "{{ _packages_user_update_plist is changed }}"
        _launchd_agent_domain: "{{ _packages_user_update_domain }}"
