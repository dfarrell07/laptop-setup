---
# roles/packages/tasks/install_dnf_packages.yml
# Main dnf package installation (cli, languages, yubikey/fido2 security, containers, networking, support).
# Runs only when is_dnf; includes CSB rescue handler.
# --- DNF package installation ---
- name: Install dnf packages
  when: is_dnf
  block:
    - name: Build combined dnf package list
      ansible.builtin.set_fact:
        _packages_dnf_all: >-
          {{ (packages_cli | reject('equalto', 'gh') | list
             if not repo_gh_cli and ansible_distribution != 'Fedora'
             else packages_cli)
             + packages_languages
             + (packages_languages_work if profile == 'work' else [])
             + packages_security
             + (packages_security_yubikey if packages_yubikey_enabled | bool else [])
             + (packages_security_rhel if ansible_distribution != 'Fedora' else [])
             + packages_containers
             + (packages_containers_work if profile == 'work' else [])
             + (packages_containers_kubectl
                if (profile != 'work'
                    or ansible_facts['architecture'] != 'x86_64'
                    or not (packages_install_binaries | bool))
                else [])
             + (packages_networking | reject('equalto', 'tailscale') | list
                if not repo_tailscale else packages_networking)
             + (packages_networking_work if profile == 'work' else [])
             + (packages_support_work if profile == 'work' else [])
             + (['bpfman'] if packages_bpfman_enabled | bool else [])
             + (packages_aws_cli_fedora_work if profile == 'work' and ansible_distribution == 'Fedora' else [])
             + packages_extra_dnf }}

    - name: Apply dnf package list to host
      ansible.builtin.dnf:
        name: "{{ _packages_dnf_all }}"
        state: present
      become: true
      tags: [become]
      when: not system_is_container

    - name: Apply dnf package list to container (scriptlets suppressed)  # noqa: command-instead-of-module
      ansible.builtin.command:
        # --setopt=tsflags=noscripts,notriggers: suppresses all RPM script execution in the
        # DNF5 transaction. noscripts covers %pre/%post/%preun/%postun scriptlets;
        # notriggers covers %trigger/%triggerin/%triggerun/%triggerpostun — both call
        # systemd-update-helper / daemon-reload and crash systemd PID 1 in privileged
        # containers. rpm_opts (DNF4) is silently ignored by DNF5/libdnf5; tsflags is correct.
        # Skipped safely in containers (services aren't started; /etc/shells not needed for CI).
        cmd: >-
          dnf install -y --setopt=tsflags=noscripts,notriggers
          {{ _packages_dnf_all | join(' ') }}
      become: true
      register: _packages_dnf_container_result
      changed_when: "'Nothing to do' not in _packages_dnf_container_result.stdout"
      failed_when: _packages_dnf_container_result.rc != 0
      when: system_is_container

    - name: Check packaged Go binary after suppressed RPM scriptlets
      ansible.builtin.stat:
        path: /usr/lib/golang/bin/go
      register: _packages_go_target
      when: system_is_container

    - name: Restore packaged Go alternatives after suppressed RPM scriptlets
      # Match golang-bin's RPM post-install registration, including the gofmt slave.
      ansible.builtin.command:
        argv:
          - alternatives
          - --install
          - /usr/bin/go
          - go
          - /usr/lib/golang/bin/go
          - '90'
          - --slave
          - /usr/bin/gofmt
          - gofmt
          - /usr/lib/golang/bin/gofmt
        creates: /etc/alternatives/go
      become: true
      when:
        - system_is_container
        - _packages_go_target.stat.exists | default(false)
        - _packages_go_target.stat.executable | default(false)
  rescue:
    - name: Record dnf package install failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "Install dnf packages"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: "One or more dnf packages failed; see ticket body for package list and remediation details."
        _csb_ticket_summary: "Cannot install core dnf packages on CSB"
        _csb_ticket_body: >-
          One or more packages from packages_cli, packages_languages_work,
          packages_security_yubikey (when packages_yubikey_enabled),
          packages_security_rhel (non-Fedora only), packages_security, packages_containers, packages_containers_work,
          packages_containers_kubectl (personal/non-x86_64/no-binaries), packages_networking, packages_networking_work,
          or packages_support_work could not be installed.
          This may be due to fapolicyd repo policy or a missing repository.
      when: csb_rhel
    # The install is one transaction: on failure none of the core tools (golang, pipx, ...) exist,
    # and the later Go/pipx steps would skip quietly, so the run must not report success.
    - name: Fail when dnf package install failed (non-CSB)
      ansible.builtin.fail:
        msg: >-
          PACKAGE INSTALL FAILED: no core packages were installed (one dnf transaction).
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(300) }}.
          Fix the cause (network, repo access, a package name) and re-run make packages.
      when: not csb_rhel

# OVS/OVN units are masked by the system role (service_masking.yml); masking works before the
# packages exist (it only writes the /dev/null symlink), so it is not repeated here.
