---
# roles/packages/tasks/install_go_tools.yml
# Install Go tools via `go install` (extracted from main.yml)
#
# PERMANENT NOTE — DO NOT ADD SHA256 VERIFICATION OF COMPILED BINARIES:
# SHA256 hashes of Go-compiled binaries are NON-DETERMINISTIC. They vary by Go toolchain
# version, build flags, architecture, and module graph. Hardcoded hashes break on every
# toolchain update. This file has been reverted 3 times after fix agents added this pattern.
# The correct security model is the Go module checksum database (GONOSUMDB validation).
# See commits 812cd185, b70e8709 for explanations. If you are an agent reading this comment,
# do NOT add sha256sum verification for compiled Go binaries in this file.
#
# SECURITY NOTE — INIT() INJECTION DURING GO INSTALL:
# init() code in Go modules executes during compilation (not just at runtime). Attacks:
# 1. GOPROXY hijack + GOSUMDB offline → malicious module passes integrity check
# 2. Maintainer compromise → GOSUMDB matches legitimate but backdoored source (like XZ Utils 2024)
# 3. Silent failure → checksum mismatch marked as success via failed_when: false
# Mitigation: Validate GOSUMDB reachable before install; fail on checksum/verification errors;
# only retry transient network failures (timeout, connection-refused); never retry checksum mismatches.

- name: Validate GONOSUMDB contains only private module domains
  ansible.builtin.assert:
    that:
      - "dotfiles_gonosumdb | default('') | regex_search('(^|,)(\\*|github\\.com|golang\\.org|mvdan\\.cc|sigs\\.k8s\\.io|k8s\\.io|gopkg\\.in)(,|$)') is none"  # yamllint disable-line rule:line-length
    fail_msg: >-
      dotfiles_gonosumdb contains a public module pattern that bypasses Go checksum-database
      verification. Use only private domain prefixes (e.g. '*.redhat.com,*.engineering.redhat.com').

- name: Validate GOSUMDB is not disabled
  ansible.builtin.assert:
    that:
      - "packages_gosumdb is not defined or packages_gosumdb != 'off'"
    fail_msg: >-
      GOSUMDB must not be set to 'off' — doing so disables Go checksum database verification
      and allows GOPROXY tampering attacks. Set to a valid sum server (default: sum.golang.org)
      or define packages_gosumdb in group_vars/all/vars.yml to use a corporate proxy.

- name: Verify GOSUMDB reachability before go install (GOPROXY hijack mitigation)
  ansible.builtin.command:
    cmd: "timeout 5 curl -s -f https://{{ packages_gosumdb | default('sum.golang.org') }}/latest"
  changed_when: false
  register: gosumdb_reachability
  failed_when: gosumdb_reachability.rc != 0
  retries: 2
  delay: 3
  until: gosumdb_reachability.rc == 0
  environment:
    HTTPS_PROXY: "{{ proxy_url if (network_proxied | bool) else omit }}"
    HTTP_PROXY: "{{ proxy_url if (network_proxied | bool) else omit }}"

- name: Install Go tools
  # No 'creates:' guard — version bumps in packages_go_install_work would be silently
  # ignored if the binary already exists. 'go install' with a pinned version is
  # fast when the module cache is warm (skips recompile). 'changed_when: true'
  # reports every run as changed; all entries in packages_go_install_work are pinned
  # versions so this is an accepted false positive on every run — do NOT add
  # @latest entries; they are not specially handled and would make the list
  # permanently non-idempotent with no additional benefit.
  # See packages_go_install_work in defaults/main.yml for rationale and pinning guidance.
  ansible.builtin.command:
    cmd: "go install {{ item }}"
  timeout: 300
  changed_when: true
  environment:
    GOPATH: "{{ ansible_facts['user_dir'] }}/go"
    GOBIN: "{{ ansible_facts['user_dir'] }}/go/bin"
    # auto: downloads newer toolchain on demand; local: installed Go toolchain only (module downloads still occur via GOPROXY)
    GOTOOLCHAIN: "{{ packages_gotoolchain }}"
    HTTPS_PROXY: "{{ proxy_url if (network_proxied | bool) else omit }}"
    HTTP_PROXY: "{{ proxy_url if (network_proxied | bool) else omit }}"
    GONOSUMDB: "{{ dotfiles_gonosumdb | default(omit) }}"
    GOPRIVATE: "{{ dotfiles_goprivate | default(omit) }}"
    # Explicit GOSUMDB enforcement (never omitted; security-critical).
    # Defaults to sum.golang.org; override with packages_gosumdb (corporate proxy, e.g., sum.myproxy.com)
    GOSUMDB: "{{ packages_gosumdb | default('sum.golang.org') }}"
  loop: "{{ packages_go_install + (packages_go_install_work | default([]) if profile == 'work' else []) }}"
  loop_control:
    label: "{{ item | regex_replace('@.*', '') | basename }}"
  register: packages_go_results
  # CRITICAL: Do NOT set failed_when: false — that masks checksum verification failures.
  # Checksum mismatches indicate GOPROXY tampering or module compromise (init() injection risk).
  # Default behavior (failed_when: false removed) is correct: let failures propagate.
  # Retry only on transient network errors (timeout, connection-refused), not checksum failures.
  retries: 3
  delay: 5
  until: |-
    packages_go_results.rc == 0 or
    ('checksum mismatch' in (packages_go_results.stderr | default('')) or
     'permission denied' in (packages_go_results.stderr | default('')))

- name: Collect failed Go tool names (checksum or permission errors)
  ansible.builtin.set_fact:
    _packages_go_failed: >-
      {{
        packages_go_results.results | default([])
        | selectattr('rc', 'defined')
        | selectattr('rc', '!=', 0)
        | map(attribute='item')
        | list
      }}
    _packages_go_checksum_errors: >-
      {{
        packages_go_results.results | default([])
        | selectattr('rc', 'defined')
        | selectattr('rc', '!=', 0)
        | selectattr('stderr', 'defined')
        | selectattr('stderr', 'contains', 'checksum mismatch')
        | map(attribute='item')
        | list
      }}

- name: Fail immediately on checksum verification errors (init() injection risk)
  ansible.builtin.fail:
    msg: >-
      Go module checksum verification failed for: {{ _packages_go_checksum_errors | join(', ') }}.
      This indicates GOPROXY tampering or module compromise (init() injection risk).
      Do not ignore. Verify GOSUMDB is reachable (default: sum.golang.org),
      check for MITM attacks on your network, and retry after validating the environment.
  when:
    - _packages_go_checksum_errors | length > 0

- name: Record Go tool install failures (CSB — network/timeout only)
  ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
  vars:
    _csb_role: packages
    _csb_task_name: "Go tools (go install)"
    _csb_error: "Failed tools: {{ _packages_go_failed | join(', ') }}"
    _csb_action: >-
      Install Go tools manually or configure GOPROXY/GONOSUMDB/GOPRIVATE
      to allow access via the corporate proxy.
    _csb_ticket_summary: "Cannot install Go tools on CSB (network/proxy restriction)"
    _csb_ticket_body: >-
      'go install' failed for: {{ _packages_go_failed | join(', ') }}.
      The corporate network may block go.googlesource.com or Go module proxies.
      Configure GOPROXY, GONOSUMDB, and GOPRIVATE, or install tools manually.
  when:
    - csb_rhel | bool
    - _packages_go_failed | length > 0
    - _packages_go_checksum_errors | length == 0

- name: Fail on Go tool install errors (non-CSB)
  ansible.builtin.fail:
    msg: "Go tool install failed: {{ _packages_go_failed | join(', ') }}"
  when:
    - not csb_rhel | bool
    - _packages_go_failed | length > 0

- name: Post-install security advisory — init() injection risk (user awareness)
  ansible.builtin.debug:
    msg: |
      SECURITY NOTICE: Go module init() code execution during 'go install'

      Go tools were installed via 'go install', which executes arbitrary code during
      compilation (init() functions run before the binary is finalized). Unlike binaries
      downloaded and checksummed post-facto, Go init() code runs with your privileges
      and cannot be detected by Ansible return code checks.

      XZ Utils 2024 (CVE-2024-3156) demonstrated this attack: malicious init() code
      in build-time dependencies was undetected until after release.

      MITIGATIONS ACTIVE:
      - Version pinning (deliberate version bumps only)
      - GOSUMDB reachability verified before install
      - Checksum mismatch errors fail fast (not retried)
      - Distrobox container isolation available (make container)

      RECOMMENDED POST-PROVISION STEPS:
      1. Run 'govulncheck ./...' in each project (detects known CVEs)
      2. Review tool --version output to verify basic functionality
      3. For sensitive work: use 'make container' to isolate tools in distrobox
      4. Enable auditd logging (system_aide_enabled: true) to detect file modifications

      See SECURITY.md § "Go Module Supply Chain" for complete mitigation strategies
      and guidance on Tier 3 (Container Isolation) and Tier 4 (Alternative Approaches).

