---
# roles/packages/tasks/install_go_tools.yml
# Install Go tools via `go install` (extracted from main.yml)

- name: Validate GONOSUMDB contains only private module domains
  # SECURITY: GONOSUMDB prevents sumdb bypass for specified domains but does NOT prevent:
  # - GOPROXY serving malicious code for golang.org/github.com modules
  # - Upstream maintainer account compromise
  # - TLS MITM attacks on go.googlesource.com (sumdb validation is HTTP/2, not separately protected)
  # - Typosquatting attacks (registry content validation only, not source audit)
  # Users who set GONOSUMDB accept explicit trust in the upstream module sources.
  # All Go tools below (gofumpt, gopls, golangci-lint, govulncheck, gci, controller-gen,
  # client-gen, subctl, stern) compile and execute init() functions during 'go install'.
  # No binary verification occurs after installation — malicious init() code executes
  # at compile time. XZ Utils (2024) demonstrated this vector in production.
  # MITIGATION: Monitor supply chain advisories (govulncheck runs during provisioning),
  # pin versions (see packages_*_version), use distrobox tier for sensitive dev environments,
  # and upgrade aggressively when advisories emerge. Consider download+verify for tools
  # with published binaries (gofumpt, golangci-lint have GitHub Releases with checksums).
  ansible.builtin.assert:
    that:
      - "dotfiles_gonosumdb | default('') | regex_search('(^|,)(\\*|github\\.com|golang\\.org|mvdan\\.cc|sigs\\.k8s\\.io|k8s\\.io|gopkg\\.in)(,|$)') is none"  # yamllint disable-line rule:line-length
    fail_msg: >-
      dotfiles_gonosumdb contains a public module pattern that bypasses Go checksum-database
      verification. Use only private domain prefixes (e.g. '*.redhat.com,*.engineering.redhat.com').

- name: Install Go tools
  # No 'creates:' guard — version bumps in packages_go_install_work would be silently
  # ignored if the binary already exists. 'go install' with a pinned version is
  # fast when the module cache is warm (skips recompile). 'changed_when: true'
  # reports every run as changed; all entries in packages_go_install_work are pinned
  # versions so this is an accepted false positive on every run — do NOT add
  # @latest entries; they are not specially handled and would make the list
  # permanently non-idempotent with no additional benefit.
  # See packages_go_install_work in defaults/main.yml for rationale and pinning guidance.
  ansible.builtin.command:
    cmd: "go install {{ item }}"
  timeout: 300
  changed_when: true
  environment:
    GOPATH: "{{ ansible_facts['user_dir'] }}/go"
    GOBIN: "{{ ansible_facts['user_dir'] }}/go/bin"
    # auto: downloads newer toolchain on demand; local: installed Go toolchain only (module downloads still occur via GOPROXY)
    GOTOOLCHAIN: "{{ packages_gotoolchain }}"
    HTTPS_PROXY: "{{ proxy_url if (network_proxied | bool) else omit }}"
    HTTP_PROXY: "{{ proxy_url if (network_proxied | bool) else omit }}"
    GONOSUMDB: "{{ dotfiles_gonosumdb | default(omit) }}"
    GOPRIVATE: "{{ dotfiles_goprivate | default(omit) }}"
  loop: "{{ packages_go_install + (packages_go_install_work | default([]) if profile == 'work' else []) }}"
  loop_control:
    label: "{{ item | regex_replace('@.*', '') | basename }}"
  register: packages_go_results
  failed_when: false
  retries: 3
  delay: 5
  until: packages_go_results.rc == 0

- name: Report failed Go tool installs
  ansible.builtin.debug:
    msg: "Failed to install {{ item.item }}: {{ item.stderr | default('unknown error') | trim }}"
  loop: "{{ packages_go_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when:
    - item.rc | default(0) != 0

- name: Report failed Go tool runtime version checks
  ansible.builtin.debug:
    msg: "Go tool version check failed: {{ item.item | regex_replace('@.*', '') | basename }}"
  loop: "{{ packages_go_version_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item | regex_replace('@.*', '') | basename }}"
  when:
    - item.rc | default(0) != 0

- name: Collect failed Go tool names
  ansible.builtin.set_fact:
    _packages_go_failed: >-
      {{
        packages_go_results.results | default([])
        | selectattr('rc', 'defined')
        | selectattr('rc', '!=', 0)
        | map(attribute='item')
        | list
      }}

- name: Sanity-check installed Go tools for runtime availability (corruption detection)
  # SECURITY: Post-install runtime validation catches obvious init() corruption
  # or incomplete installations. Go init() functions run during compilation
  # ('go install'), not tool runtime—this check detects obvious failures only,
  # not stealthy supply-chain attacks. Intended as a defense-in-depth signal.
  ansible.builtin.command:
    cmd: "{{ ansible_facts['user_dir'] }}/go/bin/{{ item | regex_replace('@.*', '') | basename }} --version"
  timeout: 30
  changed_when: false
  loop: "{{ packages_go_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | regex_replace('@.*', '') | basename }}"
  when:
    - item.rc | default(0) == 0
  register: packages_go_version_check
  failed_when: false

- name: Record Go tool install failures (CSB)
  ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
  vars:
    _csb_role: packages
    _csb_task_name: "Go tools (go install)"
    _csb_error: "Failed tools: {{ _packages_go_failed | join(', ') }}"
    _csb_action: >-
      Install Go tools manually or configure GOPROXY/GONOSUMDB/GOPRIVATE
      to allow access via the corporate proxy.
    _csb_ticket_summary: "Cannot install Go tools on CSB (network/proxy restriction)"
    _csb_ticket_body: >-
      'go install' failed for: {{ _packages_go_failed | join(', ') }}.
      The corporate network may block go.googlesource.com or Go module proxies.
      Configure GOPROXY, GONOSUMDB, and GOPRIVATE, or install tools manually.
  when:
    - csb_rhel | bool
    - _packages_go_failed | length > 0

- name: Fail on Go tool install errors (non-CSB)
  ansible.builtin.fail:
    msg: "Go tool install failed: {{ _packages_go_failed | join(', ') }}"
  when:
    - not csb_rhel | bool
    - _packages_go_failed | length > 0
