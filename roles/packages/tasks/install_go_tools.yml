---
# roles/packages/tasks/install_go_tools.yml
# Install Go tools via `go install` (extracted from main.yml)
#
# WHY NOT SHA256 COMPILED BINARIES: Go binary SHA256 is non-deterministic (toolchain
# version, build flags, architecture all affect output). The Go module checksum database
# (GOSUMDB) is the correct integrity mechanism — it's validated below. See 812cd185.
#
# SUPPLY CHAIN MODEL: GOSUMDB prevents tampered modules; this file fails on checksum
# mismatches and never retries them (retry logic stops on 'checksum mismatch' in stderr).
# Known gap: maintainer compromise passes GOSUMDB (same as XZ Utils 2024 vector).

- name: Compute effective GOSUMDB proxy environment
  # Prefers packages_gosumdb_proxy; falls back to auto-detected proxy when
  # network_proxied=true. Decouples GOSUMDB proxy from general network proxy.
  ansible.builtin.set_fact:
    _gosumdb_proxy_env: >-
      {{
        packages_gosumdb_proxy if (packages_gosumdb_proxy | default('') | length > 0)
        else (proxy_url if (network_proxied | bool) else '')
      }}
  become: false

- name: "Validate GONOSUMDB/GOSUMDB: (1/3) no public module domains in GONOSUMDB"
  vars:
    _pub_mod_re: '(^|,)(\*|github\.com|golang\.org|mvdan\.cc|sigs\.k8s\.io|k8s\.io|gopkg\.in)(,|$)'
  ansible.builtin.assert:
    that:
      - dotfiles_gonosumdb | default('') | regex_search(_pub_mod_re) is none
    fail_msg: >-
      dotfiles_gonosumdb contains a public module pattern that bypasses Go checksum-database
      verification. Use only private domain prefixes (e.g. '*.redhat.com,*.engineering.redhat.com').

- name: "Validate GONOSUMDB/GOSUMDB: (2/3) GOSUMDB not disabled and valid hostname"
  # Accepts: FQDN (e.g. sum.golang.org) and FQDN:port (e.g. sum.corp.com:443)
  # Rejects: 'off', empty string, IP addresses, single-label hostnames (localhost)
  vars:
    _gosumdb_fqdn_re: '^[a-zA-Z]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\\.([a-zA-Z]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+)*$|^[a-zA-Z]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\\.([a-zA-Z]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+)*:[0-9]{1,5}$'  # yamllint disable-line rule:line-length
  ansible.builtin.assert:
    that:
      - "packages_gosumdb != 'off' and packages_gosumdb | length > 0"
      - "packages_gosumdb | type_debug == 'str'"
      - "packages_gosumdb | regex_search(_gosumdb_fqdn_re) is not none"
      - "packages_gosumdb | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}') is none"
      - "packages_gosumdb not in ['localhost', 'localhost:']"
    fail_msg: >-
      GOSUMDB must not be 'off' or empty (enables GOPROXY tampering/init() injection) and must
      be a valid FQDN or FQDN:port (not IP/localhost). Invalid value: {{ packages_gosumdb | default('(undefined)') }}
  when: packages_gosumdb is defined

- name: "Validate GONOSUMDB/GOSUMDB: (3/3) GOSUMDB server reachable (hijack mitigation)"
  ansible.builtin.uri:
    url: "https://{{ packages_gosumdb | default('sum.golang.org') }}/latest"
    timeout: 5
    status_code: 200
    return_content: false
  changed_when: false
  register: gosumdb_reachability
  failed_when: gosumdb_reachability.status != 200
  retries: 2
  delay: 3
  until: gosumdb_reachability.status == 200
  environment:
    HTTPS_PROXY: "{{ _gosumdb_proxy_env if _gosumdb_proxy_env else omit }}"  # omit preserves inherited proxy; only override when explicitly configured
    HTTP_PROXY: "{{ _gosumdb_proxy_env if _gosumdb_proxy_env else omit }}"  # omit preserves inherited proxy; only override when explicitly configured


- name: Create GOTMPDIR directory for Go tool compilation
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/tmp"
    state: directory
    mode: "0700"

- name: Install Go tools
  # No 'creates:' guard — version bumps would be silently ignored. Pinned versions
  # with warm cache are fast. Every run reports as changed (false positive, accepted).
  # Do NOT add @latest entries. See defaults/main.yml for rationale.
  ansible.builtin.command:
    cmd: "go install {{ item }}"
  timeout: 300
  changed_when: true
  when: _golang_available | default(false)
  environment:
    GOPATH: "{{ ansible_facts['user_dir'] }}/go"
    GOBIN: "{{ ansible_facts['user_dir'] }}/go/bin"
    GOTMPDIR: "{{ ansible_facts['user_dir'] }}/tmp"  # security: prevent /tmp noexec failures + explicit tmpdir for Go compiler
    GOTOOLCHAIN: "{{ packages_gotoolchain }}"
    HTTPS_PROXY: "{{ _gosumdb_proxy_env if _gosumdb_proxy_env else omit }}"  # omit preserves inherited proxy; only override when explicitly configured
    HTTP_PROXY: "{{ _gosumdb_proxy_env if _gosumdb_proxy_env else omit }}"  # omit preserves inherited proxy; only override when explicitly configured
    GOPROXY: 'https://proxy.golang.org,direct'  # security-critical: pin proxy, prevent GOPROXY env injection
    GONOSUMDB: "{{ dotfiles_gonosumdb | default('') }}"  # explicit empty overrides inherited shell GONOSUMDB=*
    GOPRIVATE: "{{ dotfiles_goprivate | default(omit) }}"
    GOSUMDB: "{{ packages_gosumdb | default('sum.golang.org') }}"  # security-critical
    CC: /usr/bin/gcc  # pin compiler identity; prevent caller CC injection into CGO builds
    CGO_CFLAGS: ''  # clear inherited flags; prevent CGO_CFLAGS injection
    CGO_CXXFLAGS: ''  # clear inherited flags; prevent CGO_CXXFLAGS injection
    CGO_LDFLAGS: ''  # clear inherited flags; prevent CGO_LDFLAGS injection
    CGO_ENABLED: '1'  # explicit; some tools (subctl, golangci-lint) require CGO
  loop: "{{ packages_go_install + (packages_go_install_work | default([]) if profile == 'work' else []) }}"
  loop_control:
    label: "{{ item | regex_replace('@.*', '') | basename }}"
  register: packages_go_results
  # PERMISSION-DENIED IS TRANSIENT: Retried (not task failure). All other errors
  # (checksum mismatch, GOSUMDB timeout) halt immediately to prevent TOCTOU bypass.
  # Do NOT set failed_when: false — masks checksum mismatches (init() injection risk).
  failed_when: |-
    packages_go_results.rc != 0 and
    'permission denied' not in (packages_go_results.stderr | default(''))
  retries: 3
  delay: 5
  until: |-
    packages_go_results.rc == 0 or
    (packages_go_results.rc != 0 and 'permission denied' not in (packages_go_results.stderr | default('')))

- name: Collect failed Go tool names (checksum or permission errors)
  ansible.builtin.set_fact:
    _packages_go_failed: >-
      {{
        packages_go_results.results | default([])
        | selectattr('rc', 'defined')
        | selectattr('rc', '!=', 0)
        | map(attribute='item')
        | list
      }}
    _packages_go_checksum_errors: >-
      {{
        packages_go_results.results | default([])
        | selectattr('rc', 'defined')
        | selectattr('rc', '!=', 0)
        | selectattr('stderr', 'defined')
        | selectattr('stderr', 'contains', 'checksum mismatch')
        | map(attribute='item')
        | list
      }}

- name: Fail immediately on checksum verification errors (init() injection risk)
  ansible.builtin.fail:
    msg: >-
      Go module checksum verification failed for: {{ _packages_go_checksum_errors | join(', ') }}.
      This indicates GOPROXY tampering or module compromise. Verify GOSUMDB reachability
      (default: sum.golang.org), check for MITM attacks, and retry.
  when:
    - _packages_go_checksum_errors | length > 0

- name: Record Go tool install failures (CSB — network/timeout only)
  ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
  vars:
    _csb_role: packages
    _csb_task_name: "Go tools (go install)"
    _csb_error: "Failed tools: {{ _packages_go_failed | join(', ') }}"
    _csb_action: >-
      Install Go tools manually or configure GOPROXY/GONOSUMDB/GOPRIVATE
      to allow access via the corporate proxy.
    _csb_ticket_summary: "Cannot install Go tools on CSB (network/proxy restriction)"
    _csb_ticket_body: >-
      'go install' failed for: {{ _packages_go_failed | join(', ') }}.
      The corporate network may block go.googlesource.com or Go module proxies.
      Configure GOPROXY, GONOSUMDB, and GOPRIVATE, or install tools manually.
  when:
    - csb_rhel | bool
    - _packages_go_failed | length > 0
    - _packages_go_checksum_errors | length == 0

- name: Fail on Go tool install errors (non-CSB)
  ansible.builtin.fail:
    msg: "Go tool install failed: {{ _packages_go_failed | join(', ') }}"
  when:
    - not csb_rhel | bool
    - _packages_go_failed | length > 0

