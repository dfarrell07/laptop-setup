---
# --- Standalone script/binary downloads ---

- name: Install transcrypt
  when:
    - is_linux
    - profile == 'work'
  ansible.builtin.include_tasks: install_binary.yml
  vars:
    binary_name: transcrypt
    url: "https://raw.githubusercontent.com/elasticdog/transcrypt/v{{ packages_transcrypt_version }}/transcrypt"
    dest: /usr/local/bin/transcrypt
    checksum: "sha256:{{ packages_transcrypt_sha256 }}"
    version_check_cmd: /usr/local/bin/transcrypt --version
    version_string: "{{ packages_transcrypt_version }}"
    csb_action: >-
      Install transcrypt manually from https://github.com/elasticdog/transcrypt
    csb_ticket_summary: "Cannot download transcrypt binary on CSB"
    csb_ticket_body: >-
      transcrypt script could not be downloaded from github.com/elasticdog/transcrypt.
      Install manually from https://github.com/elasticdog/transcrypt

- name: Install SOPS
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.include_tasks: install_binary.yml
  vars:
    binary_name: sops
    url: >-
      https://github.com/getsops/sops/releases/download/v{{ packages_sops_version
      }}/sops-v{{ packages_sops_version }}.linux.{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}
    dest: /usr/local/bin/sops
    checksum: "sha256:{{ packages_sops_sha256_arm64 if ansible_facts['architecture'] == 'aarch64' else packages_sops_sha256 }}"
    version_check_cmd: /usr/local/bin/sops --version
    version_string: "{{ packages_sops_version }}"
    csb_action: >-
      Install sops manually from https://github.com/getsops/sops/releases
    csb_ticket_summary: "Cannot download sops binary on CSB"
    csb_ticket_body: >-
      sops binary could not be downloaded from github.com/getsops/sops.
      Install manually from https://github.com/getsops/sops/releases

- name: Install gitleaks (secret scanner; version pinned to match CI linting.yml)
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
  ansible.builtin.include_tasks: install_tarball.yml
  vars:
    binary_name: gitleaks
    url: >-
      https://github.com/gitleaks/gitleaks/releases/download/v{{ packages_gitleaks_version
      }}/gitleaks_{{ packages_gitleaks_version }}_linux_{{
      'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x64' }}.tar.gz
    tarball: /tmp/gitleaks.tar.gz
    dest: /usr/local/bin/gitleaks
    checksum: >-
      sha256:{{ packages_gitleaks_sha256_arm64 if ansible_facts['architecture'] == 'aarch64'
      else packages_gitleaks_sha256 }}
    version_check_cmd: /usr/local/bin/gitleaks version
    version_string: "{{ packages_gitleaks_version }}"
    binary_in_archive: gitleaks
    csb_action: >-
      Install gitleaks manually from https://github.com/gitleaks/gitleaks/releases
    csb_ticket_summary: "Cannot download gitleaks binary on CSB"
    csb_ticket_body: >-
      gitleaks binary could not be downloaded from github.com/gitleaks/gitleaks.
      Install manually from https://github.com/gitleaks/gitleaks/releases

