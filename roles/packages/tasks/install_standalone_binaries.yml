---
# Standalone binary/script downloads for work-profile tools.
#
# To add a new binary:
#   1. Add packages_BINARY_version and packages_BINARY_sha256 to defaults/main.yml
#   2. Use include_tasks: install_binary.yml (single binary) or install_tarball.yml (archive)
#   3. For binaries with upstream signatures: add verification after download (see cosign/sops pattern)
#   4. Gate with: when: _packages_linux_x86_work (Linux x86_64 work profile) or is_linux/is_macos
#   5. Handle CSB restriction: set csb_action/csb_ticket_* vars for fapolicyd environments

- name: Install transcrypt
  when:
    - is_linux
    - profile == 'work'
  ansible.builtin.include_tasks: install_binary.yml
  vars:
    binary_name: transcrypt
    url: "https://raw.githubusercontent.com/elasticdog/transcrypt/v{{ packages_transcrypt_version }}/transcrypt"
    dest: /usr/local/bin/transcrypt
    checksum: "sha256:{{ packages_transcrypt_sha256 }}"
    version_check_cmd: /usr/local/bin/transcrypt --version
    version_string: "{{ packages_transcrypt_version }}"
    csb_action: >-
      Install transcrypt manually from https://github.com/elasticdog/transcrypt
    csb_ticket_summary: "Cannot download transcrypt binary on CSB"
    csb_ticket_body: >-
      transcrypt script could not be downloaded from github.com/elasticdog/transcrypt.
      Install manually from https://github.com/elasticdog/transcrypt

- name: Install SOPS
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.include_tasks: install_binary.yml
  vars:
    binary_name: sops
    url: >-
      https://github.com/getsops/sops/releases/download/v{{ packages_sops_version
      }}/sops-v{{ packages_sops_version }}.linux.{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}
    dest: /usr/local/bin/sops
    checksum: "sha256:{{ packages_sops_sha256_arm64 if ansible_facts['architecture'] == 'aarch64' else packages_sops_sha256 }}"
    version_check_cmd: /usr/local/bin/sops --version
    version_string: "{{ packages_sops_version }}"
    csb_action: >-
      Install sops manually from https://github.com/getsops/sops/releases
    csb_ticket_summary: "Cannot download sops binary on CSB"
    csb_ticket_body: >-
      sops binary could not be downloaded from github.com/getsops/sops.
      Install manually from https://github.com/getsops/sops/releases

- name: Install gitleaks (secret scanner; version pinned to match CI linting.yml)
  # No profile guard — gitleaks is useful for personal repos; macOS brew also installs it universally.
  # Binary download (not dnf) required: Fedora 44 ships 8.30.0 but CI linting.yml pins 8.30.1; version must match CI.
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
  ansible.builtin.include_tasks: install_tarball.yml
  vars:
    binary_name: gitleaks
    url: >-
      https://github.com/gitleaks/gitleaks/releases/download/v{{ packages_gitleaks_version
      }}/gitleaks_{{ packages_gitleaks_version }}_linux_{{
      'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x64' }}.tar.gz
    dest: /usr/local/bin/gitleaks
    checksum: >-
      sha256:{{ packages_gitleaks_sha256_arm64 if ansible_facts['architecture'] == 'aarch64'
      else packages_gitleaks_sha256 }}
    version_check_cmd: /usr/local/bin/gitleaks version
    version_string: "{{ packages_gitleaks_version }}"
    binary_in_archive: gitleaks
    csb_action: >-
      Install gitleaks manually from https://github.com/gitleaks/gitleaks/releases
    csb_ticket_summary: "Cannot download gitleaks binary on CSB"
    csb_ticket_body: >-
      gitleaks binary could not be downloaded from github.com/gitleaks/gitleaks.
      Install manually from https://github.com/gitleaks/gitleaks/releases

- name: Install actionlint (GitHub Actions linter; version pinned to match CI linting.yml)
  # actionlint uses GitHub attestations (actions/attest-build-provenance) for released binaries
  # — not cosign bundles. No .bundle files appear in release assets; verification uses
  # gh attestation verify (GitHub Actions OIDC keyless signing). See task "Verify actionlint
  # binary via GitHub attestation" below for the post-install verification logic.
  # cosign verify-blob cannot be used here; gh CLI attestation verify is the correct tool.
  when:
    - is_linux
    - ansible_facts['architecture'] == 'x86_64'  # aarch64: needs sha256_arm64 default + guard extension
    - profile == 'work'
  ansible.builtin.include_tasks: install_tarball.yml
  vars:
    binary_name: actionlint
    url: >-
      https://github.com/rhysd/actionlint/releases/download/v{{ packages_actionlint_version
      }}/actionlint_{{ packages_actionlint_version }}_linux_{{
      'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}.tar.gz
    dest: /usr/local/bin/actionlint
    checksum: "sha256:{{ packages_actionlint_sha256_arm64 if ansible_facts['architecture'] == 'aarch64' else packages_actionlint_sha256 }}"
    version_check_cmd: /usr/local/bin/actionlint --version
    version_string: "{{ packages_actionlint_version }}"
    binary_in_archive: actionlint
    csb_action: >-
      Install actionlint manually from https://github.com/rhysd/actionlint/releases
    csb_ticket_summary: "Cannot download actionlint binary on CSB"
    csb_ticket_body: >-
      actionlint binary could not be downloaded from github.com/rhysd/actionlint.
      Install manually from https://github.com/rhysd/actionlint/releases

- name: Install zizmor
  # zizmor uses GitHub attestations (actions/attest) for released binaries — not cosign bundles.
  # No .bundle files appear in release assets; verification uses gh attestation verify
  # (GitHub Actions OIDC keyless signing). See task "Verify zizmor binary via GitHub attestation"
  # below for the post-install verification logic. cosign verify-blob cannot be used here;
  # gh CLI attestation verify is the correct tool.
  when:
    - is_linux
    - ansible_facts['architecture'] == 'x86_64'  # no arm64 release; x86_64-only CI pin
    - profile == 'work'
  ansible.builtin.include_tasks: install_tarball.yml
  vars:
    binary_name: zizmor
    url: >-
      https://github.com/zizmorcore/zizmor/releases/download/v{{ packages_zizmor_version
      }}/zizmor-x86_64-unknown-linux-gnu.tar.gz
    dest: /usr/local/bin/zizmor
    checksum: "sha256:{{ packages_zizmor_sha256 }}"
    version_check_cmd: /usr/local/bin/zizmor --version
    version_string: "{{ packages_zizmor_version }}"
    binary_in_archive: zizmor
    csb_action: >-
      Install zizmor manually from https://github.com/zizmorcore/zizmor/releases
    csb_ticket_summary: "Cannot download zizmor binary on CSB"
    csb_ticket_body: >-
      zizmor binary could not be downloaded from github.com/zizmorcore/zizmor.
      Install manually from https://github.com/zizmorcore/zizmor/releases

# --- GitHub attestation verification for actionlint and zizmor ---
# Both tools use GitHub Actions attestations (actions/attest-build-provenance and actions/attest)
# for the released binaries. Unlike cosign bundles (.sigstore.json), attestations require the
# GitHub CLI (gh attestation verify) to validate. These tasks verify the downloaded binaries
# against the public attestation transparency log (rekor) via Sigstore infrastructure.

- name: Verify actionlint binary attestation
  when:
    - is_linux
    - ansible_facts['architecture'] == 'x86_64'
    - profile == 'work'
    - ansible_facts.get('packages_gh_available', false)
  block:
    - name: Check actionlint attestation
      ansible.builtin.command:
        argv:
          - gh
          - attestation
          - verify
          - /usr/local/bin/actionlint
          - --repo
          - rhysd/actionlint
          - --signer-workflow
          - rhysd/actionlint/.github/workflows/release.yaml
      changed_when: false
      failed_when: false
      register: _actionlint_attest_result

    - name: Assert actionlint attestation verification succeeded
      ansible.builtin.assert:
        that:
          - _actionlint_attest_result.rc == 0
        fail_msg: >-
          actionlint binary attestation verification failed (rc={{ _actionlint_attest_result.rc }}).
          The binary at /usr/local/bin/actionlint could not be verified against the GitHub
          attestation (OIDC keyless signing via rhysd/actionlint/.github/workflows/release.yaml).
          This indicates the binary may not have been signed by the official release workflow.
          Reinstall actionlint: rm /usr/local/bin/actionlint and re-run 'make packages'.
          If attestation verification is not yet implemented upstream, verify manually via:
          'gh attestation verify /usr/local/bin/actionlint --repo rhysd/actionlint'

- name: Verify zizmor binary attestation
  when:
    - is_linux
    - ansible_facts['architecture'] == 'x86_64'
    - profile == 'work'
    - ansible_facts.get('packages_gh_available', false)
  block:
    - name: Check zizmor attestation
      ansible.builtin.command:
        argv:
          - gh
          - attestation
          - verify
          - /usr/local/bin/zizmor
          - --repo
          - zizmorcore/zizmor
          - --signer-workflow
          - zizmorcore/zizmor/.github/workflows/release-binaries.yml
      changed_when: false
      failed_when: false
      register: _zizmor_attest_result

    - name: Assert zizmor attestation verification succeeded
      ansible.builtin.assert:
        that:
          - _zizmor_attest_result.rc == 0
        fail_msg: >-
          zizmor binary attestation verification failed (rc={{ _zizmor_attest_result.rc }}).
          The binary at /usr/local/bin/zizmor could not be verified against the GitHub
          attestation (OIDC keyless signing via zizmorcore/zizmor/.github/workflows/release-binaries.yml).
          This indicates the binary may not have been signed by the official release workflow.
          Reinstall zizmor: rm /usr/local/bin/zizmor and re-run 'make packages'.
          If attestation verification is not yet implemented upstream, verify manually via:
          'gh attestation verify /usr/local/bin/zizmor --repo zizmorcore/zizmor'

- name: Install operator-sdk
  # operator-sdk releases are GPG/PGP signed (checksums.txt.asc) — not cosign/Sigstore.
  # No .bundle files are published; cosign verify-blob cannot be used here.
  # GPG verification requires the release team's public key from
  # https://github.com/operator-framework/operator-sdk/releases.
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.include_tasks: install_binary.yml
  vars:
    binary_name: operator-sdk
    url: >-
      https://github.com/operator-framework/operator-sdk/releases/download/v{{ packages_operator_sdk_version
      }}/operator-sdk_linux_{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}
    dest: /usr/local/bin/operator-sdk
    checksum: >-
      sha256:{{ packages_operator_sdk_sha256_arm64 if ansible_facts['architecture'] ==
      'aarch64' else packages_operator_sdk_sha256 }}
    version_check_cmd: /usr/local/bin/operator-sdk version
    version_string: "{{ packages_operator_sdk_version }}"
    download_timeout: 300
    csb_action: >-
      Install operator-sdk manually from
      https://github.com/operator-framework/operator-sdk/releases
    csb_ticket_summary: "Cannot download operator-sdk binary on CSB"
    csb_ticket_body: >-
      operator-sdk binary could not be downloaded from
      github.com/operator-framework/operator-sdk.
      Install manually from https://github.com/operator-framework/operator-sdk/releases

# --- operator-sdk GPG verification ---
# operator-sdk releases are GPG/PGP signed (checksums.txt.asc). This block downloads
# the checksums file and its GPG signature, imports the operator-framework release
# team's public key, and verifies the signature. After GPG verification, the installed
# binary's SHA256 is checked against the GPG-verified checksums.txt to confirm the
# binary matches the attested checksum.

- name: Create secure temp directory for operator-sdk GPG verification
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.tempfile:
    state: directory
    suffix: _operator_sdk_gpg
  register: _operator_sdk_tmpdir

- name: Download operator-sdk checksums file for GPG verification
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.get_url:
    url: >-
      https://github.com/operator-framework/operator-sdk/releases/download/v{{ packages_operator_sdk_version
      }}/checksums.txt
    dest: "{{ _operator_sdk_tmpdir.path }}/checksums.txt"
    mode: "0600"

- name: Download operator-sdk checksums GPG signature
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.get_url:
    url: >-
      https://github.com/operator-framework/operator-sdk/releases/download/v{{ packages_operator_sdk_version
      }}/checksums.txt.asc
    dest: "{{ _operator_sdk_tmpdir.path }}/checksums.txt.asc"
    mode: "0600"

- name: Import operator-framework GPG key
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.command:
    argv:
      - gpg
      - --keyserver
      - keyserver.ubuntu.com
      - --recv-keys
      - "{{ packages_operator_sdk_gpg_key_id }}"
  changed_when: false
  failed_when: false
  register: _operator_sdk_gpg_import

- name: Verify operator-sdk checksums file GPG signature
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.command:
    argv:
      - gpg
      - --verify
      - "{{ _operator_sdk_tmpdir.path }}/checksums.txt.asc"
      - "{{ _operator_sdk_tmpdir.path }}/checksums.txt"
  changed_when: false
  failed_when: _operator_sdk_gpg_verify.rc != 0 and (not network_proxied | bool)
  register: _operator_sdk_gpg_verify

- name: Warn if operator-sdk GPG verification failed
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - _operator_sdk_gpg_verify.rc != 0
  ansible.builtin.debug:
    msg: >-
      WARNING: operator-sdk checksums file GPG verification failed (rc={{ _operator_sdk_gpg_verify.rc }}).
      This can occur in offline environments or networks where GPG keyserver access is unavailable.
      Proceeding without GPG verification. operator-sdk binary was verified via SHA256 checksum at
      download time. If this is unexpected, verify manually:
      gpg --verify checksums.txt.asc checksums.txt

- name: Verify installed operator-sdk binary SHA256 against GPG-verified checksums
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - _operator_sdk_gpg_verify.rc == 0
  ansible.builtin.shell: |
    set -euo pipefail
    arch="{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    expected=$(grep "operator-sdk_linux_${arch}" \
      {{ _operator_sdk_tmpdir.path }}/checksums.txt | awk '{print $1}')
    actual=$(sha256sum /usr/local/bin/operator-sdk | awk '{print $1}')
    [ "$expected" = "$actual" ]
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: _operator_sdk_sha256_verify.rc != 0
  register: _operator_sdk_sha256_verify

- name: Warn if operator-sdk SHA256 verification against GPG-verified checksums failed
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - _operator_sdk_gpg_verify.rc == 0
    - _operator_sdk_sha256_verify.rc != 0
  ansible.builtin.debug:
    msg: >-
      WARNING: operator-sdk binary SHA256 verification against GPG-verified checksums failed
      (rc={{ _operator_sdk_sha256_verify.rc }}). The installed binary does not match the
      GPG-attested checksum. This may indicate tampering or a checksum file format change.
      Verify the installed binary manually: sha256sum /usr/local/bin/operator-sdk

- name: Clean up operator-sdk GPG verification temporary directory
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.file:
    path: "{{ _operator_sdk_tmpdir.path }}"
    state: absent

# --- Cosign pre-install self-verification (second trust root on re-provisioning) ---
# TRUST MODEL: cosign uses Sigstore (Google OIDC keyless signing). The verification below
# depends on trusting:
#   1. Google's OIDC issuer (accounts.google.com) to issue valid tokens to the cosign release bot
#   2. Sigstore's public root CA to have signed the cosign release bot's certificate
# No certificate fingerprints are pinned in cosign verify-blob commands because the
# Sigstore transparency log entry (sigstore.json bundle) embeds the full certificate chain.
# ALTERNATIVE VERIFICATION: For high-security environments that cannot trust Google OIDC
# or Sigstore infrastructure, disable cosign installation via config.yml and manually verify
# with the upstream cosign GitHub releases, which publish GPG signatures (though the signing
# key is not currently pinned in this playbook either).
#
# On first install, bootstrapping is impossible; SHA256 (packages_cosign_sha256) is the
# sole anchor. On re-provisioning, the existing binary verifies the new download against
# the .sigstore.json bundle — a Sigstore transparency log entry that is a different trust
# root from the GitHub release SHA256.
#
# SECURITY: TOCTOU vulnerability remediated — temporary files use per-run random directory
# (mode 0700) to prevent TOCTOU attacks during bundle verification window.

- name: Stat existing cosign binary (pre-install; enables bundle verification on re-provision)
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
  ansible.builtin.stat:
    path: /usr/local/bin/cosign
  register: _cosign_pre_stat

- name: Create atomic temporary directory for cosign bundle verification (TOCTOU mitigation)
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - _cosign_pre_stat.stat.exists
  ansible.builtin.tempfile:
    state: directory
    prefix: "ansible_cosign_"
  register: _cosign_tmpdir

- name: Download cosign binary to atomic temp path for bundle verification (re-provision only)
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - _cosign_pre_stat.stat.exists
  ansible.builtin.get_url:
    url: >-
      https://github.com/sigstore/cosign/releases/download/v{{ packages_cosign_version
      }}/cosign-linux-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}
    dest: "{{ _cosign_tmpdir.path }}/cosign-new"
    checksum: "sha256:{{ packages_cosign_sha256_arm64 if ansible_facts['architecture'] == 'aarch64' else packages_cosign_sha256 }}"
    mode: "0755"
    timeout: 300

- name: Download cosign sigstore bundle for self-verification (re-provision only)
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - _cosign_pre_stat.stat.exists
  ansible.builtin.get_url:
    url: >-
      https://github.com/sigstore/cosign/releases/download/v{{ packages_cosign_version
      }}/cosign-linux-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}.sigstore.json
    dest: "{{ _cosign_tmpdir.path }}/cosign.sigstore.json"
    mode: "0600"

- name: Verify new cosign binary via Sigstore bundle (existing cosign as second trust root)
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - _cosign_pre_stat.stat.exists
  ansible.builtin.command:
    argv:
      - /usr/local/bin/cosign
      - verify-blob
      - "{{ _cosign_tmpdir.path }}/cosign-new"
      - --bundle
      - "{{ _cosign_tmpdir.path }}/cosign.sigstore.json"
      - --certificate-identity
      - keyless@projectsigstore.iam.gserviceaccount.com
      - --certificate-oidc-issuer
      - https://accounts.google.com
      - --certificate-oidc-issuer-regexp
      - "^https://accounts\\.google\\.com$"
  environment:
    SIGSTORE_NO_VERIFY: "0"
    SIGSTORE_ROOT_FILE: ""
    SIGSTORE_REKOR_PUBLIC_KEY: ""
    COSIGN_EXPERIMENTAL: "0"
  changed_when: false
  failed_when: _cosign_verify_result.rc != 0 and (not network_proxied | bool)
  register: _cosign_verify_result


- name: Warn if cosign self-verification failed (offline/restricted environment)
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - _cosign_pre_stat.stat.exists
    - _cosign_verify_result.rc != 0
  ansible.builtin.debug:
    msg: >-
      WARNING: cosign binary verification via Sigstore bundle failed (rc={{ _cosign_verify_result.rc }}).
      This can occur in offline environments or networks where cosign/Sigstore verification infrastructure
      is unavailable. Proceeding without Sigstore verification. cosign will be updated from the downloaded
      binary, which was verified via SHA256 checksum at download time. If this is unexpected, review network
      connectivity to accounts.google.com and api.sigstore.dev, and check cosign availability.

- name: Install verified cosign binary from bundle verification (re-provision only)
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - _cosign_pre_stat.stat.exists
    - _cosign_verify_result.rc == 0
  ansible.builtin.copy:
    src: "{{ _cosign_tmpdir.path }}/cosign-new"
    dest: /usr/local/bin/cosign
    remote_src: true
    mode: "0755"
    follow_symlinks: false
  become: true
  tags: [become]

- name: Clean up atomic cosign temporary directory
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - _cosign_pre_stat.stat.exists
  ansible.builtin.file:
    path: "{{ _cosign_tmpdir.path }}"
    state: absent

# Bootstrap trust limitation: the SHA256 checksum and the cosign binary are both served from
# the GitHub releases CDN — they share the same trust domain. A CDN compromise or GitHub
# release tampering that simultaneously updates the binary and the release-page SHA256 would
# produce a malicious cosign binary that passes this SHA256 check unchanged.
# Sigstore bundle verification (used on re-provision via the block above) is structurally
# impossible here because cosign is not yet installed. As a mitigation, a post-install
# self-attestation block below uses the just-installed cosign to verify its own
# sigstore.json bundle against the Rekor transparency log, providing a second trust root
# independent of the GitHub releases CDN immediately after bootstrap.
- name: Install cosign (first install; bootstrap — SHA256 and binary share GitHub releases CDN trust domain)
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - not _cosign_pre_stat.stat.exists
  ansible.builtin.include_tasks: install_binary.yml
  vars:
    binary_name: cosign
    url: >-
      https://github.com/sigstore/cosign/releases/download/v{{ packages_cosign_version
      }}/cosign-linux-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}
    dest: /usr/local/bin/cosign
    checksum: "sha256:{{ packages_cosign_sha256_arm64 if ansible_facts['architecture'] == 'aarch64' else packages_cosign_sha256 }}"
    version_check_cmd: /usr/local/bin/cosign version
    version_string: "{{ packages_cosign_version }}"
    download_timeout: 300
    csb_action: >-
      Install cosign manually from https://github.com/sigstore/cosign/releases
    csb_ticket_summary: "Cannot download cosign binary on CSB"
    csb_ticket_body: >-
      cosign binary could not be downloaded from github.com/sigstore/cosign.
      Install manually from https://github.com/sigstore/cosign/releases

# Post-install cosign self-attestation (first install only):
# The bootstrap step above uses only SHA256 (same trust domain as binary — GitHub releases CDN).
# After install, the newly placed cosign verifies its own Sigstore bundle against the Rekor
# transparency log. Rekor is an independent trust root: a tampered binary whose SHA256 was
# also updated on GitHub releases would still fail Rekor inclusion-proof verification.
# Accepted limitation: a compromised cosign binary could lie about its own verify-blob result.
# This step is still valuable — it confirms the installed binary matches a transparency-log
# entry and catches CDN tampering that does NOT control the Rekor log.
- name: Create temporary directory for cosign post-install self-attestation
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - not _cosign_pre_stat.stat.exists
  ansible.builtin.tempfile:
    state: directory
    prefix: "ansible_cosign_self_"
  register: _cosign_self_tmpdir

- name: Download cosign sigstore bundle for post-install self-attestation (first install only)
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - not _cosign_pre_stat.stat.exists
  ansible.builtin.get_url:
    url: >-
      https://github.com/sigstore/cosign/releases/download/v{{ packages_cosign_version
      }}/cosign-linux-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}.sigstore.json
    dest: "{{ _cosign_self_tmpdir.path }}/cosign.sigstore.json"
    mode: "0600"

- name: Verify installed cosign binary via Sigstore bundle self-attestation (first install only)
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - not _cosign_pre_stat.stat.exists
  ansible.builtin.command:
    argv:
      - /usr/local/bin/cosign
      - verify-blob
      - /usr/local/bin/cosign
      - --bundle
      - "{{ _cosign_self_tmpdir.path }}/cosign.sigstore.json"
      - --certificate-identity
      - keyless@projectsigstore.iam.gserviceaccount.com
      - --certificate-oidc-issuer
      - https://accounts.google.com
      - --certificate-oidc-issuer-regexp
      - "^https://accounts\\.google\\.com$"
  changed_when: false
  failed_when: _cosign_self_verify_result.rc != 0 and (not network_proxied | bool)
  register: _cosign_self_verify_result

- name: Warn if cosign post-install self-attestation failed (offline or restricted environment)
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - not _cosign_pre_stat.stat.exists
    - _cosign_self_verify_result.rc != 0
  ansible.builtin.debug:
    msg: >-
      WARNING: cosign post-install self-attestation via Sigstore bundle failed
      (rc={{ _cosign_self_verify_result.rc }}). Bootstrap used SHA256 from GitHub releases CDN
      (same trust domain as binary). Sigstore self-attestation adds a second trust root via
      Rekor transparency log. Failure here may indicate a network restriction, offline
      environment, or a compromised binary. If unexpected, verify manually:
      cosign verify-blob /usr/local/bin/cosign --bundle <cosign.sigstore.json>
      --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com
      --certificate-oidc-issuer https://accounts.google.com

- name: Clean up cosign post-install self-attestation temporary directory
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - not _cosign_pre_stat.stat.exists
  ansible.builtin.file:
    path: "{{ _cosign_self_tmpdir.path }}"
    state: absent

# --- Post-install cosign signature verification ---
# cosign verify-blob --bundle is offline-capable: the bundle embeds the certificate,
# signature, and Rekor inclusion proof.
# Gates on profile == 'work' because cosign is only installed for that profile.

- name: Create secure temp directory for sops verification
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
  ansible.builtin.tempfile:
    state: directory
    suffix: _sops_verify
  register: _sops_tmpdir

- name: Download sops checksums file for cosign verification
  # sops v3.13.0+ signs only the checksums file (not per-arch binaries).
  # Verifying this file proves the SHA256 pins in packages_sops_sha256 originate from the
  # legitimate release workflow; the binary's own SHA256 (checked by install_binary.yml)
  # is then confirmed against this attested checksums file below.
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
  ansible.builtin.get_url:
    url: >-
      https://github.com/getsops/sops/releases/download/v{{ packages_sops_version
      }}/sops-v{{ packages_sops_version }}.checksums.txt
    dest: "{{ _sops_tmpdir.path }}/sops-checksums.txt"
    checksum: "sha256:{{ packages_sops_checksums_txt_sha256 }}"
    mode: "0600"

- name: Download sops checksums cosign bundle
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
  ansible.builtin.get_url:
    url: >-
      https://github.com/getsops/sops/releases/download/v{{ packages_sops_version
      }}/sops-v{{ packages_sops_version }}.checksums.sigstore.json
    dest: "{{ _sops_tmpdir.path }}/sops-cosign.bundle"
    checksum: "sha256:{{ packages_sops_bundle_sha256 }}"
    mode: "0600"

- name: Verify sops checksums file via cosign bundle
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
  ansible.builtin.command:
    argv:
      - /usr/local/bin/cosign
      - verify-blob
      - "{{ _sops_tmpdir.path }}/sops-checksums.txt"
      - --bundle
      - "{{ _sops_tmpdir.path }}/sops-cosign.bundle"
      - --certificate-identity
      - "https://github.com/getsops/sops/.github/workflows/release.yml@refs/tags/v{{ packages_sops_version }}"
      - --certificate-oidc-issuer
      - https://token.actions.githubusercontent.com
      - --certificate-oidc-issuer-regexp
      - "^https://token\\.actions\\.githubusercontent\\.com$"
  environment:
    SIGSTORE_NO_VERIFY: "0"
    SIGSTORE_ROOT_FILE: ""
    SIGSTORE_REKOR_PUBLIC_KEY: ""
    COSIGN_EXPERIMENTAL: "0"
  changed_when: false
  failed_when: _sops_checksums_verify_result.rc != 0 and (not network_proxied | bool)
  register: _sops_checksums_verify_result


- name: Warn if sops checksums verification failed (offline/restricted environment)
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - _sops_checksums_verify_result.rc != 0
  ansible.builtin.debug:
    msg: >-
      WARNING: sops checksums file verification via Sigstore bundle failed (rc={{ _sops_checksums_verify_result.rc }}).
      This can occur in offline environments or networks where cosign/Sigstore verification infrastructure
      is unavailable. Proceeding without Sigstore verification. sops binary was verified via SHA256 checksum at
      download time. If this is unexpected, review network connectivity to token.actions.githubusercontent.com
      and api.sigstore.dev, and check cosign availability.

- name: Verify installed sops binary SHA256 against attested checksums file
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - _sops_checksums_verify_result.rc == 0
  ansible.builtin.shell: |
    set -euo pipefail
    arch="{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    expected=$(grep "sops-v{{ packages_sops_version }}.linux.${arch}" \
      {{ _sops_tmpdir.path }}/sops-checksums.txt | awk '{print $1}')
    actual=$(sha256sum /usr/local/bin/sops | awk '{print $1}')
    [ "$expected" = "$actual" ]
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: _sops_sha256_verify_result.rc != 0
  register: _sops_sha256_verify_result


- name: Warn if sops SHA256 attestation verification failed (offline/restricted environment)
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
    - _sops_sha256_verify_result.rc != 0
  ansible.builtin.debug:
    msg: >-
      WARNING: sops binary SHA256 verification against attested checksums file failed (rc={{ _sops_sha256_verify_result.rc }}).
      This can occur when the checksums file download failed or contains an unexpected format. Proceeding without
      checksums attestation verification. sops binary was verified via direct SHA256 checksum at download time.
      If this is unexpected, verify that the checksums file exists and contains the expected format
      (SHA256 hash followed by filename). Check that the entry matches packages_sops_version {{ packages_sops_version }}
      on your architecture.

- name: Clean up secure sops verification temporary directory
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
    - packages_cosign_install_enabled
  ansible.builtin.file:
    path: "{{ _sops_tmpdir.path }}"
    state: absent

- name: Install tkn (Tekton CLI for Konflux pipeline inspection)
  # VERIFICATION: NOT IMPLEMENTED. tektoncd/cli releases provide only checksums.txt
  # (plain SHA256 hashes); no cosign bundles, .sig files, or Sigstore attestations
  # are published. SHA256 pinned in packages_tkn_sha256 / packages_tkn_sha256_arm64
  # is the sole integrity control. cosign verify-blob cannot be used here.
  # TODO: Add post-install cosign verification once tektoncd/cli publishes Sigstore attestations.
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.include_tasks: install_tarball.yml
  vars:
    binary_name: tkn
    url: >-
      https://github.com/tektoncd/cli/releases/download/v{{ packages_tkn_version
      }}/tkn_{{ packages_tkn_version }}_Linux_{{
      'aarch64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}.tar.gz
    dest: /usr/local/bin/tkn
    checksum: >-
      sha256:{{ packages_tkn_sha256_arm64 if ansible_facts['architecture'] == 'aarch64'
      else packages_tkn_sha256 }}
    version_check_cmd: /usr/local/bin/tkn version --component=client
    version_string: "{{ packages_tkn_version }}"
    download_timeout: 300
    binary_in_archive: tkn
    csb_action: >-
      Install tkn manually from https://github.com/tektoncd/cli/releases
    csb_ticket_summary: "Cannot download tkn binary on CSB"
    csb_ticket_body: >-
      tkn (Tekton CLI) binary could not be downloaded from github.com/tektoncd/cli.
      Install manually from https://github.com/tektoncd/cli/releases

- name: Install ec CLI (Enterprise Contract policy enforcement for Konflux releases)
  # VERIFICATION: NOT IMPLEMENTED. ec-cli moved from github.com/enterprise-contract/ec-cli
  # to github.com/conforma/cli (conforma = Red Hat Konflux team's upstream org; permanent
  # redirect in place). conforma/cli releases do NOT yet publish Sigstore-signed attestations
  # — only plain .sha256 files ship alongside each binary. Until cosign .bundle/.sig assets
  # appear in the release, a post-install `cosign verify-blob` step cannot be added.
  # The SHA256 in packages_ec_sha256 / packages_ec_sha256_arm64 (defaults/main.yml) is
  # the primary integrity control; a compromised release requires both a tampered GitHub
  # release AND an independent SHA256 update to this repo.
  # TODO: Add post-install cosign verification once conforma/cli publishes Sigstore attestations.
  when:
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.include_tasks: install_binary.yml
  vars:
    binary_name: ec
    url: >-
      https://github.com/conforma/cli/releases/download/v{{ packages_ec_version
      }}/ec_linux_{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}
    dest: /usr/local/bin/ec
    checksum: "sha256:{{ packages_ec_sha256_arm64 if ansible_facts['architecture'] == 'aarch64' else packages_ec_sha256 }}"
    version_check_cmd: /usr/local/bin/ec version
    version_string: "{{ packages_ec_version }}"
    download_timeout: 300
    csb_action: >-
      Install ec manually from https://github.com/conforma/cli/releases
    csb_ticket_summary: "Cannot download ec binary on CSB"
    csb_ticket_body: >-
      ec (Enterprise Contract CLI) binary could not be downloaded from github.com/conforma/cli.
      Install manually from https://github.com/conforma/cli/releases
