---
# roles/packages/tasks/install_pipx.yml
# Install yamllint and ansible-lint via pipx (version-pinned).
# Called from main.yml when is_dnf or is_apt or is_macos, and packages_install_binaries.

- name: Check for pipx
  ansible.builtin.command: sh -c 'command -v pipx'
  register: _packages_pipx_probe
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - is_dnf or is_apt or is_macos
    - packages_install_binaries | bool

- name: Report pipx packages not simulated in check mode
  ansible.builtin.debug:
    msg: "CHECK MODE: pipx is not installed yet (its package install was only simulated); yamllint and ansible-lint not simulated."
  when:
    - ansible_check_mode
    - _packages_pipx_probe.rc | default(0) != 0

- name: Install pipx packages (yamllint, ansible-lint)
  when:
    - is_dnf or is_apt or is_macos
    - packages_install_binaries | bool
    - not ansible_check_mode or _packages_pipx_probe.rc | default(0) == 0
  block:
    - name: Yamllint present at {{ packages_yamllint_version }}
      community.general.pipx:
        executable: pipx
        name: "yamllint=={{ packages_yamllint_version }}"
        state: install
      timeout: 300

    - name: Ansible-lint present at {{ packages_ansible_lint_version }}
      community.general.pipx:
        executable: pipx
        name: "ansible-lint=={{ packages_ansible_lint_version }}"
        state: install
      timeout: 300
  rescue:
    - name: Record pipx install failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "pipx install (yamllint/ansible-lint)"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Install yamllint and ansible-lint manually via pipx or an alternative method
        _csb_ticket_summary: "Cannot install yamllint/ansible-lint via pipx on CSB"
        _csb_ticket_body: >-
          yamllint and ansible-lint could not be installed via pipx on CSB.
          This may be due to fapolicyd policy blocking pip/pipx or missing network access.
          Install manually via pipx or an alternative method.
      when: csb_rhel
    - name: Fail on pipx install errors (non-CSB)
      ansible.builtin.fail:
        msg: >-
          PACKAGE INSTALL FAILED: Install pipx packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing pipx/pip access.
      when: not csb_rhel

- name: Validate optional pipx package pins
  ansible.builtin.assert:
    that:
      - item is match('^[a-zA-Z0-9_.-]+==[0-9]+\.[0-9]+(\.[0-9]+)?$')
  loop: "{{ packages_extra_pipx }}"

- name: Install optional pinned pipx tools
  community.general.pipx:
    name: "{{ item }}"
    state: install
  loop: "{{ packages_extra_pipx }}"
