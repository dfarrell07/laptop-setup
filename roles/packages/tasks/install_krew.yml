---
# Install the verified executable and a standard local receipt for the pinned version.
# `krew install krew` consults the live index and does not upgrade an existing receipt.
- name: Install pinned krew bootstrap executable
  when: _packages_linux_x86_work
  vars:
    _krew_release_url: >-
      https://github.com/kubernetes-sigs/krew/releases/download/v{{ packages_krew_bootstrap_version }}/krew-linux_amd64.tar.gz
  block:
    - name: Inspect installed krew executable without executing it
      ansible.builtin.stat:
        path: "{{ ansible_facts['user_dir'] }}/.krew/store/krew/v{{ packages_krew_bootstrap_version }}/krew"
        follow: true
        checksum_algorithm: sha256
      register: packages_krew_check

    - name: Inspect existing krew self receipt
      ansible.builtin.stat:
        path: "{{ ansible_facts['user_dir'] }}/.krew/receipts/krew.yaml"
      register: _krew_self_receipt_stat

    - name: Read existing krew self receipt
      ansible.builtin.slurp:
        src: "{{ _krew_self_receipt_stat.stat.path }}"
      register: _krew_self_receipt
      when: _krew_self_receipt_stat.stat.exists

    - name: Record installed krew receipt version
      ansible.builtin.set_fact:
        _krew_self_version: >-
          {{ ((_krew_self_receipt.content | b64decode | from_yaml).spec.version | default(''))
             if _krew_self_receipt_stat.stat.exists else '' }}

    - name: Report krew install not simulated in check mode
      ansible.builtin.debug:
        msg: "CHECK MODE: krew v{{ packages_krew_bootstrap_version }} would be downloaded, verified and installed; not simulated."
      when:
        - ansible_check_mode
        - >-
          (packages_krew_check.stat.checksum | default('')) != packages_krew_binary_sha256 or
          (packages_krew_check.stat.mode | default('')) != '0755' or
          _krew_self_version != 'v' ~ packages_krew_bootstrap_version

    - name: Install or repair the verified krew executable
      when:
        - not ansible_check_mode  # downloads into a temp dir that check mode never creates
        - >-
          (packages_krew_check.stat.checksum | default('')) != packages_krew_binary_sha256 or
          (packages_krew_check.stat.mode | default('')) != '0755' or
          _krew_self_version != 'v' ~ packages_krew_bootstrap_version
      block:
        - name: Create private krew bootstrap directory
          ansible.builtin.tempfile:
            state: directory
            prefix: ansible_krew_
          register: _krew_bootstrap_tmpdir

        - name: Download and verify pinned krew archive
          ansible.builtin.get_url:
            url: "{{ _krew_release_url }}"
            dest: "{{ _krew_bootstrap_tmpdir.path }}/krew.tar.gz"
            checksum: "sha256:{{ packages_krew_sha256 }}"
            mode: "0600"
            timeout: 120
          register: packages_krew_download
          retries: 3
          delay: 10
          until: packages_krew_download is succeeded

        - name: Extract verified krew executable in its private directory
          ansible.builtin.unarchive:
            src: "{{ _krew_bootstrap_tmpdir.path }}/krew.tar.gz"
            dest: "{{ _krew_bootstrap_tmpdir.path }}"
            remote_src: true

        - name: Verify the extracted krew executable checksum
          ansible.builtin.stat:
            path: "{{ _krew_bootstrap_tmpdir.path }}/krew-linux_amd64"
            checksum_algorithm: sha256
          register: _krew_verified_binary
          failed_when: (_krew_verified_binary.stat.checksum | default('')) != packages_krew_binary_sha256

        - name: Create standard krew installation directories
          ansible.builtin.file:
            path: "{{ ansible_facts['user_dir'] }}/.krew/{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - bin
            - receipts
            - "store/krew/v{{ packages_krew_bootstrap_version }}"

        - name: Install the verified krew executable into its versioned store
          ansible.builtin.copy:
            src: "{{ _krew_bootstrap_tmpdir.path }}/krew-linux_amd64"
            dest: "{{ ansible_facts['user_dir'] }}/.krew/store/krew/v{{ packages_krew_bootstrap_version }}/krew"
            remote_src: true
            mode: "0755"

        - name: Write standard receipt for locally managed krew
          vars:
            _krew_self_manifest:
              apiVersion: krew.googlecontainertools.github.com/v1alpha2
              kind: Plugin
              metadata:
                name: krew
              spec:
                version: "v{{ packages_krew_bootstrap_version }}"
                shortDescription: kubectl plugin manager
                homepage: https://krew.sigs.k8s.io
                platforms:
                  - selector:
                      matchLabels:
                        os: linux
                        arch: amd64
                    uri: "{{ _krew_release_url }}"
                    sha256: "{{ packages_krew_sha256 }}"
                    bin: krew
                    files:
                      - from: krew-linux_amd64
                        to: krew
              status:
                source:
                  name: ''  # local pin; do not self-upgrade from a mutable index
          ansible.builtin.copy:
            content: "{{ _krew_self_manifest | to_nice_yaml }}"
            dest: "{{ ansible_facts['user_dir'] }}/.krew/receipts/krew.yaml"
            mode: "0644"

      always:
        - name: Remove private krew bootstrap directory
          ansible.builtin.file:
            path: "{{ _krew_bootstrap_tmpdir.path }}"
            state: absent
          when: _krew_bootstrap_tmpdir.path is defined

    - name: Ensure krew launcher points to its canonical verified store
      ansible.builtin.file:
        src: "{{ ansible_facts['user_dir'] }}/.krew/store/krew/v{{ packages_krew_bootstrap_version }}/krew"
        dest: "{{ ansible_facts['user_dir'] }}/.krew/bin/kubectl-krew"
        state: link
        force: true

  rescue:
    - name: Record krew installation failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: Install krew
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: Install krew manually from its verified release archive or request access.
        _csb_ticket_summary: Cannot install krew on CSB
        _csb_ticket_body: The pinned krew release archive or executable could not be installed.
      when: csb_rhel

    - name: Fail after non-CSB krew installation failure
      ansible.builtin.fail:
        msg: "krew installation failed: {{ ansible_failed_result.msg | default('unknown error') }}"
      when: not csb_rhel
