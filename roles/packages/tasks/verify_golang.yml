---
# roles/packages/tasks/verify_golang.yml
# Verify golang binary after installation via dnf/apt/brew.
# Implements defense-in-depth: ensures system golang is present before GOTOOLCHAIN=local
# forces its use in go install tasks.

- name: Find golang binary in PATH
  ansible.builtin.command:
    cmd: which go
  register: _go_binary_path
  changed_when: false
  check_mode: false
  failed_when: false

- name: Warn if golang is missing (likely package install failure)
  ansible.builtin.debug:
    msg: >-
      {{ 'CHECK MODE: golang is not installed yet (its package install was only simulated);
      golang verification and go install tasks are skipped.' if ansible_check_mode else
      'WARNING: golang binary not found in PATH. golang install may have failed in
      install_dnf_packages.yml, install_brew.yml, or apt install. Skipping golang verification
      and go install tasks. Re-run provisioning to retry golang installation.' }}
  when: _go_binary_path.rc != 0

- name: Verify golang version
  ansible.builtin.command:
    cmd: go version
  register: _golang_version_check
  changed_when: false
  check_mode: false
  failed_when: _golang_version_check.rc != 0
  when: _go_binary_path.rc == 0

- name: Extract and validate version (when found)
  when: _go_binary_path.rc == 0
  block:
    - name: Extract installed golang version
      ansible.builtin.set_fact:
        _golang_installed_version: >-
          {{ _golang_version_check.stdout | regex_search('go([\d.]+)', '\1') | first | default('') }}

    - name: Set golang available guard fact after successful verification
      ansible.builtin.set_fact:
        _golang_available: true

    - name: Log golang verification success
      ansible.builtin.debug:
        msg: >-
          golang binary verified: {{ _golang_installed_version }} at {{ _go_binary_path.stdout | trim }}
        verbosity: 1
