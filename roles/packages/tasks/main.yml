---
# roles/packages/tasks/main.yml
# Install packages via dnf (Fedora), apt (Debian), or brew (macOS).

# On CSB container tier (fapolicyd enforcing), binaries installed to /usr/local/bin
# outside dnf won't be in fapolicyd's trust database and will be blocked at runtime.
# Downloads would succeed but every invocation would fail with EPERM.
- name: Disable binary downloads on fapolicyd-enforcing CSB container tier
  ansible.builtin.set_fact:
    packages_install_binaries: false
  when: needs_container_tier == 'container'

- name: Install dnf packages
  when: is_dnf
  block:
    - name: Install dnf packages
      ansible.builtin.dnf:
        name: >-
          {{ packages_cli
             + packages_languages
             + packages_security
             + packages_containers
             + (packages_containers_kubectl
                if (profile != 'work'
                    or ansible_facts['architecture'] != 'x86_64'
                    or not (packages_install_binaries | bool))
                else [])
             + packages_networking
             + (packages_networking_work if profile == 'work' else []) }}
        state: present
      become: true
      tags: [become]
  rescue:
    - name: Record dnf package install failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "Install dnf packages"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          One or more packages in packages_cli/languages/security/containers/networking/networking_work
          could not be installed; check repo access or install manually
        _csb_ticket_summary: "Cannot install core dnf packages on CSB"
        _csb_ticket_body: >-
          One or more packages from packages_cli, packages_languages, packages_security,
          packages_containers, packages_networking, or packages_networking_work could not be installed.
          This may be due to fapolicyd repo policy or a missing repository.
      when: csb_rhel
    - name: Warn dnf package install failed (non-CSB)
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install dnf packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing repo access.
          Continuing playbook execution.
      when: not csb_rhel

# Enable bpfman.socket here (Play 2 packages role) to catch the case where bpfman
# was just installed in this play. The system role (Play 1) also attempts this, but
# on first provision bpfman is not yet installed when Play 1 runs, so that attempt
# is a no-op. Both roles use failed_when: false for container/macOS safety.
- name: Enable bpfman.socket after package install (required for bpfman load/list to work)
  ansible.builtin.systemd:
    name: bpfman.socket
    state: started
    enabled: true
  become: true
  tags: [become]
  when:
    - is_dnf
    - profile == 'work'  # bpfman is in packages_networking_work (work-profile only)
  failed_when: false

- name: Install virtualization packages
  when:
    - is_dnf
    - install_virtualization | bool
  block:
    - name: Install virtualization packages
      ansible.builtin.dnf:
        name: "{{ packages_virtualization }}"
        state: present
      become: true
      tags: [become]
  rescue:
    - name: Record virtualization package install failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "Install virtualization packages"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Virtualization packages could not be installed; request repo access
          or install libvirt/QEMU/virt-manager manually
        _csb_ticket_summary: "Cannot install virtualization packages on CSB"
        _csb_ticket_body: >-
          One or more virtualization packages (libvirt, QEMU, virt-manager, etc.)
          could not be installed. This may affect container and VM workflows.
      when: csb_rhel
    - name: Warn virtualization package install failed (non-CSB)
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install virtualization packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing repo access.
          Continuing playbook execution.
      when: not csb_rhel

# Enable virtqemud.socket here (Play 2) in addition to system role (Play 1).
# On first provision, libvirt isn't installed when Play 1 runs, so the system role's
# enable attempt silently fails (failed_when: false). This task enables the socket
# after the package is present. Mirrors the bpfman.socket pattern above.
- name: Enable virtqemud.socket after libvirt package install
  ansible.builtin.systemd:
    name: virtqemud.socket
    state: started
    enabled: true
  become: true
  tags: [become]
  when:
    - is_dnf
    - install_virtualization | bool
    - "'libvirt' in packages_virtualization"
  failed_when: false

- name: Refresh /etc/group facts for libvirt/kvm membership check
  ansible.builtin.getent:
    database: group
  become: true
  tags: [become]
  when:
    - is_dnf
    - install_virtualization | bool

- name: Add user to libvirt and kvm groups (Play 2 — groups exist after install)
  ansible.builtin.user:
    name: "{{ real_user_id }}"
    groups: [libvirt, kvm]
    append: true
  become: true
  tags: [become]
  when:
    - is_dnf
    - install_virtualization | bool
    - real_user_id | length > 0
    - "'libvirt' in ansible_etc_group"
    - "'kvm' in ansible_etc_group"
  # No failed_when:false — groups are confirmed present, failures are real errors.

- name: Install apt packages (Debian/Ubuntu)
  when: is_apt
  block:
    - name: Install apt packages (Debian/Ubuntu)
      ansible.builtin.apt:
        name: "{{ packages_apt }}"
        state: present
        update_cache: true
      become: true
      tags: [become]
  rescue:
    - name: Warn apt package install failed
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install apt packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing repo access.
          Continuing playbook execution.

- name: Add Homebrew taps (macOS)
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ packages_brew_taps }}"
  when: is_macos

- name: Install Homebrew packages (macOS)
  when: is_macos
  block:
    - name: Install Homebrew packages (macOS)
      community.general.homebrew:
        name: "{{ packages_brew }}"
        state: present
        update_homebrew: "{{ packages_brew_update }}"
  rescue:
    - name: Warn Homebrew package install failed
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install Homebrew packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or a missing formula.
          Continuing playbook execution.

- name: Install Homebrew cask packages (macOS)
  when: is_macos
  block:
    - name: Install Homebrew cask packages (macOS)
      community.general.homebrew_cask:
        name: "{{ packages_brew_cask }}"
        state: present
  rescue:
    - name: Warn Homebrew cask package install failed
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install Homebrew cask packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or a missing cask.
          Continuing playbook execution.

- name: Install ssh-askpass (macOS)
  community.general.homebrew:
    name: theseal/ssh-askpass/ssh-askpass
    state: present
  when: is_macos

- name: Start brew autoupdate (macOS)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: brew autoupdate start 43200 --upgrade --cleanup
  when: is_macos
  changed_when: false
  failed_when: false
  register: _packages_brew_autoupdate

- name: Warn if brew autoupdate failed (may need interactive trust step)
  ansible.builtin.debug:
    msg: >-
      brew autoupdate start failed (rc={{ _packages_brew_autoupdate.rc }}).
      Run 'brew autoupdate' interactively to complete trust if this is the first run.
  when:
    - is_macos
    - _packages_brew_autoupdate.rc | default(0) != 0

# --- Binary downloads (SHA256-verified, pinned versions) ---

- name: Set Linux x86 work binary install fact
  ansible.builtin.set_fact:
    _packages_linux_x86_work: "{{ packages_install_binaries | bool
      and is_linux
      and ansible_facts['architecture'] == 'x86_64'
      and profile == 'work' }}"

- name: Install oc, kubectl, and opm
  when: _packages_linux_x86_work
  ansible.builtin.include_tasks: install_oc_opm.yml

- name: Install kind
  when:
    - packages_install_binaries | bool
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
  ansible.builtin.include_tasks: install_binary.yml
  vars:
    binary_name: kind
    url: >-
      https://kind.sigs.k8s.io/dl/v{{ packages_kind_version
      }}/kind-linux-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}
    dest: /usr/local/bin/kind
    checksum: "sha256:{{ packages_kind_sha256_arm64 if ansible_facts['architecture'] == 'aarch64' else packages_kind_sha256 }}"
    version_check_cmd: /usr/local/bin/kind version
    version_string: "{{ packages_kind_version }}"
    csb_action: >-
      Install kind manually from https://kind.sigs.k8s.io/dl/
    csb_ticket_summary: "Cannot download kind binary on CSB"
    csb_ticket_body: >-
      kind binary could not be downloaded from kind.sigs.k8s.io.
      Install manually from https://kind.sigs.k8s.io/dl/

- name: Install helm
  when:
    - packages_install_binaries | bool
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
  ansible.builtin.include_tasks: install_tarball.yml
  vars:
    binary_name: helm
    url: >-
      https://get.helm.sh/helm-v{{ packages_helm_version }}-linux-{{
      'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}.tar.gz
    tarball: /tmp/helm.tar.gz
    dest: /usr/local/bin/helm
    checksum: >-
      sha256:{{ packages_helm_sha256_arm64 if ansible_facts['architecture'] == 'aarch64'
      else packages_helm_sha256 }}
    version_check_cmd: /usr/local/bin/helm version
    version_string: "{{ packages_helm_version }}"
    strip_components: 1
    binary_in_archive: >-
      linux-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}/helm
    csb_action: >-
      Install helm manually from https://helm.sh/docs/intro/install/
    csb_ticket_summary: "Cannot download helm binary on CSB"
    csb_ticket_body: >-
      helm binary could not be downloaded from get.helm.sh.
      Install manually from https://helm.sh/docs/intro/install/

- name: Install kustomize
  when:
    - packages_install_binaries | bool
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
  ansible.builtin.include_tasks: install_tarball.yml
  vars:
    binary_name: kustomize
    url: >-
      {{ packages_kustomize_url_base }}/kustomize%2Fv{{ packages_kustomize_version
      }}/kustomize_v{{ packages_kustomize_version }}_linux_{{
      'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}.tar.gz
    tarball: /tmp/kustomize.tar.gz
    dest: /usr/local/bin/kustomize
    checksum: >-
      sha256:{{ packages_kustomize_sha256_arm64 if ansible_facts['architecture'] == 'aarch64'
      else packages_kustomize_sha256 }}
    version_check_cmd: /usr/local/bin/kustomize version
    version_string: "{{ packages_kustomize_version }}"
    csb_action: >-
      Install kustomize manually from
      https://kubectl.docs.kubernetes.io/installation/kustomize/
    csb_ticket_summary: "Cannot download kustomize binary on CSB"
    csb_ticket_body: >-
      kustomize binary could not be downloaded from github.com/kubernetes-sigs/kustomize.
      Install manually from https://kubectl.docs.kubernetes.io/installation/kustomize/

# --- Standalone script/binary downloads ---

- name: Install transcrypt
  when:
    - packages_install_binaries | bool
    - is_linux
  ansible.builtin.include_tasks: install_binary.yml
  vars:
    binary_name: transcrypt
    url: "https://raw.githubusercontent.com/elasticdog/transcrypt/v{{ packages_transcrypt_version }}/transcrypt"
    dest: /usr/local/bin/transcrypt
    checksum: "sha256:{{ packages_transcrypt_sha256 }}"
    version_check_cmd: /usr/local/bin/transcrypt --version
    version_string: "{{ packages_transcrypt_version }}"
    csb_action: >-
      Install transcrypt manually from https://github.com/elasticdog/transcrypt
    csb_ticket_summary: "Cannot download transcrypt binary on CSB"
    csb_ticket_body: >-
      transcrypt script could not be downloaded from github.com/elasticdog/transcrypt.
      Install manually from https://github.com/elasticdog/transcrypt

- name: Install SOPS
  when:
    - packages_install_binaries | bool
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
  ansible.builtin.include_tasks: install_binary.yml
  vars:
    binary_name: sops
    url: >-
      https://github.com/getsops/sops/releases/download/v{{ packages_sops_version
      }}/sops-v{{ packages_sops_version }}.linux.{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}
    dest: /usr/local/bin/sops
    checksum: "sha256:{{ packages_sops_sha256_arm64 if ansible_facts['architecture'] == 'aarch64' else packages_sops_sha256 }}"
    version_check_cmd: /usr/local/bin/sops --version
    version_string: "{{ packages_sops_version }}"
    csb_action: >-
      Install sops manually from https://github.com/getsops/sops/releases
    csb_ticket_summary: "Cannot download sops binary on CSB"
    csb_ticket_body: >-
      sops binary could not be downloaded from github.com/getsops/sops.
      Install manually from https://github.com/getsops/sops/releases

- name: Install gitleaks (secret scanner; version pinned to match CI linting.yml)
  when:
    - packages_install_binaries | bool
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
  ansible.builtin.include_tasks: install_tarball.yml
  vars:
    binary_name: gitleaks
    url: >-
      https://github.com/gitleaks/gitleaks/releases/download/v{{ packages_gitleaks_version
      }}/gitleaks_{{ packages_gitleaks_version }}_linux_{{
      'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x64' }}.tar.gz
    tarball: /tmp/gitleaks.tar.gz
    dest: /usr/local/bin/gitleaks
    checksum: >-
      sha256:{{ packages_gitleaks_sha256_arm64 if ansible_facts['architecture'] == 'aarch64'
      else packages_gitleaks_sha256 }}
    version_check_cmd: /usr/local/bin/gitleaks version
    version_string: "{{ packages_gitleaks_version }}"
    binary_in_archive: gitleaks
    csb_action: >-
      Install gitleaks manually from https://github.com/gitleaks/gitleaks/releases
    csb_ticket_summary: "Cannot download gitleaks binary on CSB"
    csb_ticket_body: >-
      gitleaks binary could not be downloaded from github.com/gitleaks/gitleaks.
      Install manually from https://github.com/gitleaks/gitleaks/releases

- name: Install actionlint (GitHub Actions linter; version pinned to match CI linting.yml)
  when:
    - packages_install_binaries | bool
    - is_linux
    - ansible_facts['architecture'] == 'x86_64'
  ansible.builtin.include_tasks: install_tarball.yml
  vars:
    binary_name: actionlint
    url: >-
      https://github.com/rhysd/actionlint/releases/download/v{{ packages_actionlint_version
      }}/actionlint_{{ packages_actionlint_version }}_linux_amd64.tar.gz
    tarball: /tmp/actionlint.tar.gz
    dest: /usr/local/bin/actionlint
    checksum: "sha256:{{ packages_actionlint_sha256 }}"
    version_check_cmd: /usr/local/bin/actionlint --version
    version_string: "{{ packages_actionlint_version }}"
    binary_in_archive: actionlint
    csb_action: >-
      Install actionlint manually from https://github.com/rhysd/actionlint/releases
    csb_ticket_summary: "Cannot download actionlint binary on CSB"
    csb_ticket_body: >-
      actionlint binary could not be downloaded from github.com/rhysd/actionlint.
      Install manually from https://github.com/rhysd/actionlint/releases

- name: Install zizmor (GitHub Actions security scanner; version pinned to match CI linting.yml)
  when:
    - packages_install_binaries | bool
    - is_linux
    - ansible_facts['architecture'] == 'x86_64'
  ansible.builtin.include_tasks: install_tarball.yml
  vars:
    binary_name: zizmor
    url: >-
      https://github.com/zizmorcore/zizmor/releases/download/v{{ packages_zizmor_version
      }}/zizmor-x86_64-unknown-linux-gnu.tar.gz
    tarball: /tmp/zizmor.tar.gz
    dest: /usr/local/bin/zizmor
    checksum: "sha256:{{ packages_zizmor_sha256 }}"
    version_check_cmd: /usr/local/bin/zizmor --version
    version_string: "{{ packages_zizmor_version }}"
    binary_in_archive: zizmor
    csb_action: >-
      Install zizmor manually from https://github.com/zizmorcore/zizmor/releases
    csb_ticket_summary: "Cannot download zizmor binary on CSB"
    csb_ticket_body: >-
      zizmor binary could not be downloaded from github.com/zizmorcore/zizmor.
      Install manually from https://github.com/zizmorcore/zizmor/releases

- name: Install operator-sdk
  when:
    - packages_install_binaries | bool
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.include_tasks: install_binary.yml
  vars:
    binary_name: operator-sdk
    url: >-
      https://github.com/operator-framework/operator-sdk/releases/download/v{{ packages_operator_sdk_version
      }}/operator-sdk_linux_{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}
    dest: /usr/local/bin/operator-sdk
    checksum: >-
      sha256:{{ packages_operator_sdk_sha256_arm64 if ansible_facts['architecture'] ==
      'aarch64' else packages_operator_sdk_sha256 }}
    version_check_cmd: /usr/local/bin/operator-sdk version
    version_string: "{{ packages_operator_sdk_version }}"
    download_timeout: 300
    csb_action: >-
      Install operator-sdk manually from
      https://github.com/operator-framework/operator-sdk/releases
    csb_ticket_summary: "Cannot download operator-sdk binary on CSB"
    csb_ticket_body: >-
      operator-sdk binary could not be downloaded from
      github.com/operator-framework/operator-sdk.
      Install manually from https://github.com/operator-framework/operator-sdk/releases

- name: Install cosign (image signing and verification for Konflux pipelines)
  when:
    - packages_install_binaries | bool
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.include_tasks: install_binary.yml
  vars:
    binary_name: cosign
    url: >-
      https://github.com/sigstore/cosign/releases/download/v{{ packages_cosign_version
      }}/cosign-linux-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}
    dest: /usr/local/bin/cosign
    checksum: "sha256:{{ packages_cosign_sha256_arm64 if ansible_facts['architecture'] == 'aarch64' else packages_cosign_sha256 }}"
    version_check_cmd: /usr/local/bin/cosign version
    version_string: "{{ packages_cosign_version }}"
    download_timeout: 300
    csb_action: >-
      Install cosign manually from https://github.com/sigstore/cosign/releases
    csb_ticket_summary: "Cannot download cosign binary on CSB"
    csb_ticket_body: >-
      cosign binary could not be downloaded from github.com/sigstore/cosign.
      Install manually from https://github.com/sigstore/cosign/releases

- name: Install tkn (Tekton CLI for Konflux pipeline inspection)
  when:
    - packages_install_binaries | bool
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.include_tasks: install_tarball.yml
  vars:
    binary_name: tkn
    url: >-
      https://github.com/tektoncd/cli/releases/download/v{{ packages_tkn_version
      }}/tkn_{{ packages_tkn_version }}_Linux_{{
      'aarch64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}.tar.gz
    tarball: /tmp/tkn.tar.gz
    dest: /usr/local/bin/tkn
    checksum: >-
      sha256:{{ packages_tkn_sha256_arm64 if ansible_facts['architecture'] == 'aarch64'
      else packages_tkn_sha256 }}
    version_check_cmd: /usr/local/bin/tkn version --component=client
    version_string: "{{ packages_tkn_version }}"
    binary_in_archive: tkn
    csb_action: >-
      Install tkn manually from https://github.com/tektoncd/cli/releases
    csb_ticket_summary: "Cannot download tkn binary on CSB"
    csb_ticket_body: >-
      tkn (Tekton CLI) binary could not be downloaded from github.com/tektoncd/cli.
      Install manually from https://github.com/tektoncd/cli/releases

- name: Install ec CLI (Enterprise Contract policy enforcement for Konflux releases)
  # ec-cli moved from github.com/enterprise-contract/ec-cli to github.com/conforma/cli
  when:
    - packages_install_binaries | bool
    - is_linux
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    - profile == 'work'
  ansible.builtin.include_tasks: install_binary.yml
  vars:
    binary_name: ec
    url: >-
      https://github.com/conforma/cli/releases/download/v{{ packages_ec_version
      }}/ec_linux_{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}
    dest: /usr/local/bin/ec
    checksum: "sha256:{{ packages_ec_sha256_arm64 if ansible_facts['architecture'] == 'aarch64' else packages_ec_sha256 }}"
    version_check_cmd: /usr/local/bin/ec version
    version_string: "{{ packages_ec_version }}"
    csb_action: >-
      Install ec manually from https://github.com/conforma/cli/releases
    csb_ticket_summary: "Cannot download ec binary on CSB"
    csb_ticket_body: >-
      ec (Enterprise Contract CLI) binary could not be downloaded from github.com/conforma/cli.
      Install manually from https://github.com/conforma/cli/releases

- name: Install k9s (Kubernetes TUI)
  when: _packages_linux_x86_work
  ansible.builtin.include_tasks: install_tarball.yml
  vars:
    binary_name: k9s
    url: >-
      https://github.com/derailed/k9s/releases/download/v{{ packages_k9s_version
      }}/k9s_Linux_amd64.tar.gz
    tarball: /tmp/k9s.tar.gz
    dest: /usr/local/bin/k9s
    checksum: "sha256:{{ packages_k9s_sha256 }}"
    version_check_cmd: /usr/local/bin/k9s version
    version_string: "{{ packages_k9s_version }}"
    binary_in_archive: k9s
    csb_action: >-
      Install k9s manually from https://github.com/derailed/k9s/releases
    csb_ticket_summary: "Cannot download k9s binary on CSB"
    csb_ticket_body: >-
      k9s binary could not be downloaded from github.com/derailed/k9s.
      Install manually from https://github.com/derailed/k9s/releases

# --- Go install tools ---

- name: Install Go tools
  ansible.builtin.include_tasks: install_go_tools.yml
  when:
    - packages_install_binaries | bool
    - is_linux or is_macos

# --- pip/pipx installs ---

- name: Install pipx packages (yamllint, ansible-lint)
  when:
    - is_dnf or is_apt or is_macos
    - packages_install_binaries | bool
  block:
    - name: Install yamllint (pipx, version-pinned)
      community.general.pipx:
        name: "yamllint=={{ packages_yamllint_version }}"
        state: install

    - name: Install ansible-lint (pipx, version-pinned)
      community.general.pipx:
        name: "ansible-lint=={{ packages_ansible_lint_version }}"
        state: install
  rescue:
    - name: Record pipx install failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "pipx install (yamllint/ansible-lint)"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Install yamllint and ansible-lint manually via pipx or an alternative method
        _csb_ticket_summary: "Cannot install yamllint/ansible-lint via pipx on CSB"
        _csb_ticket_body: >-
          yamllint and ansible-lint could not be installed via pipx on CSB.
          This may be due to fapolicyd policy blocking pip/pipx or missing network access.
          Install manually via pipx or an alternative method.
      when: csb_rhel
    - name: Warn pipx install failed
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install pipx packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing pipx/pip access.
          Continuing playbook execution.
      when: not csb_rhel

- name: Install krew
  when: _packages_linux_x86_work
  block:
    - name: Check if krew is installed at target version
      ansible.builtin.command:
        cmd: "{{ ansible_facts['user_dir'] }}/.krew/bin/kubectl-krew version"
      register: packages_krew_check
      changed_when: false
      failed_when: false

    - name: Install krew from tarball
      when: packages_krew_check.rc != 0
      block:
        - name: Download krew tarball
          ansible.builtin.get_url:
            url: "https://github.com/kubernetes-sigs/krew/releases/download/v{{ packages_krew_bootstrap_version }}/krew-linux_amd64.tar.gz"
            dest: /tmp/krew.tar.gz
            checksum: "sha256:{{ packages_krew_sha256 }}"
            mode: "0644"
            timeout: 120
          register: packages_krew_download
          retries: 3
          delay: 10
          until: packages_krew_download is succeeded

        - name: Extract krew installer
          ansible.builtin.unarchive:
            src: /tmp/krew.tar.gz
            dest: "{{ ansible_facts['user_dir'] }}/.local/bin"
            remote_src: true

        - name: Set krew installer executable
          ansible.builtin.file:
            path: "{{ ansible_facts['user_dir'] }}/.local/bin/krew-linux_amd64"
            mode: "0755"

        - name: Run krew installer
          ansible.builtin.command:
            cmd: "{{ ansible_facts['user_dir'] }}/.local/bin/krew-linux_amd64 install krew"
          changed_when: true

    - name: Upgrade krew
      when:
        - packages_krew_bootstrap_version not in (packages_krew_check.stdout + packages_krew_check.stderr)
        - packages_krew_check.rc == 0
      ansible.builtin.command:
        cmd: "{{ ansible_facts['user_dir'] }}/.krew/bin/kubectl-krew upgrade krew"
      register: packages_krew_upgrade
      # NOTE: krew self-manages its upgrade path — this upgrades to krew's own latest release,
      # NOT necessarily to packages_krew_bootstrap_version. packages_krew_bootstrap_version only pins the initial tarball
      # install (above). Subsequent upgrades follow krew's own release cadence.
      changed_when: packages_krew_upgrade.stdout | length > 0

  rescue:
    - name: Record krew installation failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "krew"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Install krew manually from
          https://krew.sigs.k8s.io/docs/user-guide/setup/install/
        _csb_ticket_summary: "Cannot install krew on CSB"
        _csb_ticket_body: >-
          krew (kubectl plugin manager) could not be downloaded or installed from
          github.com/kubernetes-sigs/krew.
          Install manually from https://krew.sigs.k8s.io/docs/user-guide/setup/install/
      when: csb_rhel
    - name: Warn krew installation failed
      ansible.builtin.debug:
        msg: >-
          Failed to install krew: {{ ansible_failed_result.msg | default('unknown error') }}.
          Install manually from https://krew.sigs.k8s.io/docs/user-guide/setup/install/.
      when: not csb_rhel

  always:
    - name: Clean up krew installer files
      when: packages_krew_check.rc != 0
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/krew.tar.gz
        - "{{ ansible_facts['user_dir'] }}/.local/bin/krew-linux_amd64"
        - "{{ ansible_facts['user_dir'] }}/.local/bin/krew-linux_amd64.yaml"
        - "{{ ansible_facts['user_dir'] }}/.local/bin/LICENSE"

- name: Install subctl multi-version binaries
  ansible.builtin.include_tasks: install_subctl_versions.yml
  when: _packages_linux_x86_work

- name: Update krew plugin index
  ansible.builtin.command:
    cmd: "{{ ansible_facts['user_dir'] }}/.krew/bin/kubectl-krew update"
  timeout: 60
  changed_when: false
  failed_when: false
  when: _packages_linux_x86_work

- name: Bootstrap essential krew plugins (ctx, ns) for kind/OVN-K context switching
  ansible.builtin.command:
    cmd: "{{ ansible_facts['user_dir'] }}/.krew/bin/kubectl-krew install ctx ns"
  timeout: 120
  register: packages_krew_plugins_result
  changed_when: '"Installed plugin" in packages_krew_plugins_result.stdout'
  failed_when: false
  when: _packages_linux_x86_work
