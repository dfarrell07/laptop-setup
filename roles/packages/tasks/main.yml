# --- Go install tools ---

- name: Install Go tools
  # No 'creates:' guard — version bumps in packages_go_install would be silently
  # ignored if the binary already exists. 'go install' with a pinned version is
  # fast when the module cache is warm (skips recompile). 'changed_when: true'
  # reports every run as changed; all entries in packages_go_install are pinned
  # versions so this is an accepted false positive on every run — do NOT add
  # @latest entries; they are not specially handled and would make the list
  # permanently non-idempotent with no additional benefit.
  # See packages_go_install in defaults/main.yml for rationale and pinning guidance.
  ansible.builtin.command:
    cmd: "go install {{ item }}"
  timeout: 300
  changed_when: true
  environment:
    GOPATH: "{{ ansible_facts['user_dir'] }}/go"
    GOBIN: "{{ ansible_facts['user_dir'] }}/go/bin"
    GOTOOLCHAIN: auto  # gofumpt/govulncheck need Go 1.25+, gopls needs 1.26+; auto downloads on demand
    HTTPS_PROXY: "{{ proxy_url | default(omit) }}"
    HTTP_PROXY: "{{ proxy_url | default(omit) }}"
    GONOSUMDB: "{{ dotfiles_gonosumdb | default(omit) }}"
    GOPRIVATE: "{{ dotfiles_goprivate | default(omit) }}"
  loop: "{{ packages_go_install + (packages_go_install_work | default([]) if profile == 'work' else []) }}"
  loop_control:
    label: "{{ item | regex_replace('@.*', '') | basename }}"
  register: packages_go_results
  failed_when: false
  retries: 3
  delay: 5
  until: packages_go_results.rc == 0
  when:
    - packages_install_binaries | bool
    - ansible_facts['system'] == 'Linux' or ansible_facts['system'] == 'Darwin'

- name: Report failed Go tool installs
  ansible.builtin.debug:
    msg: "Failed to install {{ item.item }}: {{ item.stderr | default('unknown error') | trim }}"
  loop: "{{ packages_go_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when:
    - item.rc | default(0) != 0

- name: Collect failed Go tool names
  ansible.builtin.set_fact:
    _packages_go_failed: >-
      {{
        packages_go_results.results | default([])
        | selectattr('rc', 'defined')
        | selectattr('rc', '!=', 0)
        | map(attribute='item')
        | list
      }}

- name: Record Go tool install failures (CSB)
  ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
  vars:
    _csb_role: packages
    _csb_task_name: "Go tools (go install)"
    _csb_error: "Failed tools: {{ _packages_go_failed | join(', ') }}"
    _csb_action: >-
      Install Go tools manually or configure GOPROXY/GONOSUMDB/GOPRIVATE
      to allow access via the corporate proxy.
    _csb_ticket_summary: "Cannot install Go tools on CSB (network/proxy restriction)"
    _csb_ticket_body: >-
      'go install' failed for: {{ _packages_go_failed | join(', ') }}.
      The corporate network may block go.googlesource.com or Go module proxies.
      Configure GOPROXY, GONOSUMDB, and GOPRIVATE, or install tools manually.
  when:
    - csb_rhel | bool
    - _packages_go_failed | length > 0

# --- pip/pipx installs ---

- name: Install pipx packages (yamllint, ansible-lint)
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5', 'apt'] or ansible_facts['os_family'] == 'Darwin'
    - packages_install_binaries | bool
  block:
    - name: Install yamllint (pipx, version-pinned)
      community.general.pipx:
        name: "yamllint=={{ packages_yamllint_version }}"
        state: install

    - name: Install ansible-lint (pipx, version-pinned)
      community.general.pipx:
        name: "ansible-lint=={{ packages_ansible_lint_version }}"
        state: install
  rescue:
    - name: Record pipx install failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "pipx install (yamllint/ansible-lint)"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Install yamllint and ansible-lint manually via pipx or an alternative method
        _csb_ticket_summary: "Cannot install yamllint/ansible-lint via pipx on CSB"
        _csb_ticket_body: >-
          yamllint and ansible-lint could not be installed via pipx on CSB.
          This may be due to fapolicyd policy blocking pip/pipx or missing network access.
          Install manually via pipx or an alternative method.
      when: csb_rhel
    - name: Warn pipx install failed
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install pipx packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing pipx/pip access.
          Continuing playbook execution.
      when: not csb_rhel

- name: Install krew
  when: _packages_linux_x86_work
  block:
    - name: Check if krew is installed at target version
      ansible.builtin.command:
        cmd: "{{ ansible_facts['user_dir'] }}/.krew/bin/kubectl-krew version"
      register: packages_krew_check
      changed_when: false
      failed_when: false

    - name: Install krew from tarball
      when: packages_krew_check.rc != 0
      block:
        - name: Download krew tarball
          ansible.builtin.get_url:
            url: "https://github.com/kubernetes-sigs/krew/releases/download/v{{ packages_krew_bootstrap_version }}/krew-linux_amd64.tar.gz"
            dest: /tmp/krew.tar.gz
            checksum: "sha256:{{ packages_krew_sha256 }}"
            mode: "0644"
            timeout: 120
          register: packages_krew_download
          retries: 3
          delay: 10
          until: packages_krew_download is succeeded

        - name: Extract krew installer
          ansible.builtin.unarchive:
            src: /tmp/krew.tar.gz
            dest: "{{ ansible_facts['user_dir'] }}/.local/bin"
            remote_src: true

        - name: Set krew installer executable
          ansible.builtin.file:
            path: "{{ ansible_facts['user_dir'] }}/.local/bin/krew-linux_amd64"
            mode: "0755"

        - name: Run krew installer
          ansible.builtin.command:
            cmd: "{{ ansible_facts['user_dir'] }}/.local/bin/krew-linux_amd64 install krew"
          changed_when: true

    - name: Upgrade krew
      when:
        - packages_krew_bootstrap_version not in (packages_krew_check.stdout + packages_krew_check.stderr)
        - packages_krew_check.rc == 0
      ansible.builtin.command:
        cmd: "{{ ansible_facts['user_dir'] }}/.krew/bin/kubectl-krew upgrade krew"
      register: packages_krew_upgrade
      # NOTE: krew self-manages its upgrade path — this upgrades to krew's own latest release,
      # NOT necessarily to packages_krew_bootstrap_version. packages_krew_bootstrap_version only pins the initial tarball
      # install (above). Subsequent upgrades follow krew's own release cadence.
      changed_when: packages_krew_upgrade.stdout | length > 0

  rescue:
    - name: Record krew installation failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "krew"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Install krew manually from
          https://krew.sigs.k8s.io/docs/user-guide/setup/install/
        _csb_ticket_summary: "Cannot install krew on CSB"
        _csb_ticket_body: >-
          krew (kubectl plugin manager) could not be downloaded or installed from
          github.com/kubernetes-sigs/krew.
          Install manually from https://krew.sigs.k8s.io/docs/user-guide/setup/install/
      when: csb_rhel
    - name: Warn krew installation failed
      ansible.builtin.debug:
        msg: >-
          Failed to install krew: {{ ansible_failed_result.msg | default('unknown error') }}.
          Install manually from https://krew.sigs.k8s.io/docs/user-guide/setup/install/.
      when: not csb_rhel

  always:
    - name: Clean up krew installer files
      when: packages_krew_check.rc != 0
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/krew.tar.gz
        - "{{ ansible_facts['user_dir'] }}/.local/bin/krew-linux_amd64"
        - "{{ ansible_facts['user_dir'] }}/.local/bin/krew-linux_amd64.yaml"
        - "{{ ansible_facts['user_dir'] }}/.local/bin/LICENSE"

- name: Install versioned subctl binaries (subctlXX) for multi-cluster Submariner management
  when: _packages_linux_x86_work and packages_subctl_versioned | default([]) | length > 0
  block:
    - name: Check installed version of versioned subctl binaries
      ansible.builtin.command:
        cmd: "{{ ansible_facts['user_dir'] }}/.local/bin/subctl{{ item.suffix }} version"
      changed_when: false
      failed_when: false
      check_mode: false
      register: packages_subctl_version_check
      loop: "{{ packages_subctl_versioned }}"
      loop_control:
        label: "subctl{{ item.suffix }}"

    - name: Install subctl version with temp GOBIN
      ansible.builtin.command:
        cmd: go install github.com/submariner-io/subctl/cmd/subctl@v{{ item.version }}
      timeout: 600
      environment:
        GOPATH: "{{ ansible_facts['user_dir'] }}/go"
        GOBIN: "/tmp/subctl-v{{ item.version }}-bin"
        GOTOOLCHAIN: auto
        HTTPS_PROXY: "{{ proxy_url | default(omit) }}"
        HTTP_PROXY: "{{ proxy_url | default(omit) }}"
      vars:
        _subctl_installed: >-
          {{ ((packages_subctl_version_check.results[loop_idx].stdout | default('')) ~
              (packages_subctl_version_check.results[loop_idx].stderr | default('')))
             | regex_findall('subctl v?(\S+)') | first | default('') }}
      when: >-
        packages_subctl_version_check.results[loop_idx].rc != 0 or
        _subctl_installed != item.version
      changed_when: true
      failed_when: false
      register: packages_subctl_install_results
      loop: "{{ packages_subctl_versioned }}"
      loop_control:
        label: "subctl{{ item.suffix }}"
        index_var: loop_idx

    - name: Warn if versioned subctl go install failed
      ansible.builtin.debug:
        msg: >-
          WARNING: go install failed for subctl@v{{ item.item.version }};
          subctl{{ item.item.suffix }} may be missing. Check Go installation.
      loop: >-
        {{ packages_subctl_install_results.results | default([])
           | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list }}
      loop_control:
        label: "subctl{{ item.item.suffix }}"

    - name: Copy versioned subctl to ~/.local/bin/subctlXX
      ansible.builtin.copy:
        src: "/tmp/subctl-v{{ item.version }}-bin/subctl"
        dest: "{{ ansible_facts['user_dir'] }}/.local/bin/subctl{{ item.suffix }}"
        mode: "0755"
        remote_src: true
      when: >-
        (packages_subctl_version_check.results[loop_idx].rc != 0 or
        item.version not in (packages_subctl_version_check.results[loop_idx].stdout +
        packages_subctl_version_check.results[loop_idx].stderr)) and
        (packages_subctl_install_results.results[loop_idx].rc | default(0)) == 0
      loop: "{{ packages_subctl_versioned }}"
      loop_control:
        label: "subctl{{ item.suffix }}"
        index_var: loop_idx

    - name: Clean up temp GOBIN directories
      ansible.builtin.file:
        path: "/tmp/subctl-v{{ item.version }}-bin"
        state: absent
      loop: "{{ packages_subctl_versioned }}"
      loop_control:
        label: "subctl{{ item.suffix }}"

- name: Install downstream RH subctl versions (registry.redhat.io/rhacm2/subctl-rhel{8,9})
  when: _packages_linux_x86_work and packages_subctl_rh_versions | default([]) | length > 0
  block:
    - name: Check installed version of downstream RH subctl binaries
      ansible.builtin.command:
        cmd: "{{ ansible_facts['user_dir'] }}/.local/bin/subctl{{ item.suffix }} version"
      changed_when: false
      failed_when: false
      check_mode: false
      register: packages_subctl_rh_version_check
      loop: "{{ packages_subctl_rh_versions }}"
      loop_control:
        label: "subctl{{ item.suffix }}"

    - name: Extract downstream subctl tarball from registry image
      ansible.builtin.command:
        cmd: >-
          oc image extract registry.redhat.io/rhacm2/{{ item.image }}:{{ item.tag }}
          --path="/dist/subctl-{{ item.tag }}*-linux-amd64.tar.xz":/tmp/
          --confirm
      timeout: 300
      register: _pkg_subctl_extract
      changed_when: _pkg_subctl_extract.rc == 0
      when: >-
        packages_subctl_rh_version_check.results[loop_idx].rc != 0 or
        item.tag not in (packages_subctl_rh_version_check.results[loop_idx].stdout | default('')) +
                        (packages_subctl_rh_version_check.results[loop_idx].stderr | default(''))
      loop: "{{ packages_subctl_rh_versions }}"
      loop_control:
        label: "{{ item.image }}:{{ item.tag }} → subctl{{ item.suffix }}"
        index_var: loop_idx

    - name: Extract and install versioned RH subctl to ~/.local/bin  # noqa: command-instead-of-module risky-shell-pipe
      ansible.builtin.shell:
        cmd: |
          set -eo pipefail
          TARBALL=$(ls /tmp/subctl-{{ item.tag }}*-linux-amd64.tar.xz 2>/dev/null | head -1)
          [[ -z "$TARBALL" ]] && exit 0
          TMPDIR=$(mktemp -d)
          tar -C "$TMPDIR" -xf "$TARBALL"
          BINARY=$(find "$TMPDIR" -name "subctl-{{ item.tag }}*-linux-amd64" -type f | head -1)
          [[ -z "$BINARY" ]] && exit 0
          install -m755 "$BINARY" "{{ ansible_facts['user_dir'] }}/.local/bin/subctl{{ item.suffix }}"
          rm -rf "$TMPDIR" "$TARBALL"
          echo "INSTALLED"
        executable: /bin/bash
      register: _pkg_subctl_install
      changed_when: '"INSTALLED" in _pkg_subctl_install.stdout'
      failed_when: false
      when: >-
        packages_subctl_rh_version_check.results[loop_idx].rc != 0 or
        item.tag not in (packages_subctl_rh_version_check.results[loop_idx].stdout | default('')) +
                        (packages_subctl_rh_version_check.results[loop_idx].stderr | default(''))
      loop: "{{ packages_subctl_rh_versions }}"
      loop_control:
        label: "{{ item.suffix }}"
        index_var: loop_idx

    - name: Warn if versioned RH subctl install failed
      ansible.builtin.debug:
        msg: >-
          WARNING: subctl install failed for {{ item.item.suffix }};
          RC={{ item.rc }} stderr={{ item.stderr | default('') | truncate(200) }}
      loop: >-
        {{ _pkg_subctl_install.results | default([])
           | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list }}
      loop_control:
        label: "{{ item.item.suffix }}"

  rescue:
    - name: Record downstream RH subctl installation failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "downstream RH subctl (oc image extract)"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Run `podman login registry.redhat.io` with your Red Hat credentials, then
          re-run `make packages`. Alternatively, use `make container` to provision
          subctl inside the dev container where registry auth is pre-configured.
        _csb_ticket_summary: "Cannot pull downstream subctl from registry.redhat.io on CSB"
        _csb_ticket_body: >-
          oc image extract from registry.redhat.io/rhacm2 failed. This typically means
          registry auth is missing. Run `podman login registry.redhat.io` or use
          `make container` for the dev-container path.
      when: csb_rhel
    - name: Warn downstream RH subctl extraction failed
      ansible.builtin.debug:
        msg: >-
          WARNING: oc image extract from registry.redhat.io failed for downstream subctl.
          Run `podman login registry.redhat.io` then retry, or use `make container`.
          Error: {{ ansible_failed_result.msg | default('unknown error') | truncate(200) }}
      when: not csb_rhel

- name: Update krew plugin index
  ansible.builtin.command:
    cmd: "{{ ansible_facts['user_dir'] }}/.krew/bin/kubectl-krew update"
  timeout: 60
  changed_when: false
  failed_when: false
  when: _packages_linux_x86_work

- name: Bootstrap essential krew plugins (ctx, ns) for kind/OVN-K context switching
  ansible.builtin.command:
    cmd: "{{ ansible_facts['user_dir'] }}/.krew/bin/kubectl-krew install {{ item }}"
  timeout: 120
  loop: [ctx, ns]
  register: packages_krew_plugins_result
  changed_when: '"Installed plugin" in packages_krew_plugins_result.stdout'
  failed_when: false
  when: _packages_linux_x86_work
