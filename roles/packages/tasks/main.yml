# --- Go install tools ---

- name: Install Go tools
  # No 'creates:' guard — version bumps in packages_go_install would be silently
  # ignored if the binary already exists. 'go install' with a pinned version is
  # fast when the module cache is warm (skips recompile). 'changed_when: true'
  # reports every run as changed; for pinned tools this is a minor false positive,
  # but it is necessary so that @latest entries (gofumpt, govulncheck, gci, gopls,
  # stern) give the operator a visible signal when a binary actually changes.
  # NOTE: entries using @latest are intentionally non-idempotent — the installed
  # binary can change on each run.
  # See packages_go_install in defaults/main.yml for rationale and pinning guidance.
  ansible.builtin.command:
    cmd: "go install {{ item }}"
  changed_when: true
  environment:
    GOPATH: "{{ ansible_user_dir }}/go"
    GOBIN: "{{ ansible_user_dir }}/go/bin"
    HTTPS_PROXY: "{{ proxy_url | default(omit) }}"
    HTTP_PROXY: "{{ proxy_url | default(omit) }}"
  loop: "{{ packages_go_install }}"
  register: packages_go_results
  failed_when: false
  when:
    - packages_install_binaries | default(true) | bool
    - ansible_system == 'Linux' or ansible_system == 'Darwin'

- name: Report failed Go tool installs
  ansible.builtin.debug:
    msg: "Failed to install {{ item.item }}: {{ item.stderr | default('unknown error') | trim }}"
  loop: "{{ packages_go_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when:
    - packages_go_results is defined
    - item.rc | default(0) != 0
    - item.skipped is not defined or not item.skipped

# --- pip/pipx installs ---

- name: Install pipx packages (yamllint, ansible-lint)
  when: ansible_pkg_mgr in ['dnf', 'dnf5', 'apt']
  block:
    - name: Install yamllint (pipx, version-pinned)
      community.general.pipx:
        name: yamllint
        source: "yamllint=={{ packages_yamllint_version }}"
        state: install

    - name: Install ansible-lint (pipx, version-pinned)
      community.general.pipx:
        name: ansible-lint
        source: "ansible-lint=={{ packages_ansible_lint_version }}"
        state: install
  rescue:
    - name: Warn pipx install failed
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install pipx packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing pipx/pip access.
          Continuing playbook execution.

- name: Install krew
  when:
    - packages_install_binaries | default(true) | bool
    - ansible_system == 'Linux'
    - ansible_architecture == 'x86_64'
  block:
    - name: Check if krew is installed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.krew/bin/krew"
      register: packages_krew_stat

    - name: Download krew tarball
      when: not packages_krew_stat.stat.exists
      ansible.builtin.get_url:
        url: "https://github.com/kubernetes-sigs/krew/releases/download/v{{ packages_krew_version }}/krew-linux_amd64.tar.gz"
        dest: /tmp/krew.tar.gz
        checksum: "sha256:{{ packages_krew_sha256 }}"
        mode: "0644"
      register: packages_krew_download
      retries: 3
      delay: 10
      until: packages_krew_download is succeeded

    - name: Extract krew installer
      when: not packages_krew_stat.stat.exists
      ansible.builtin.unarchive:
        src: /tmp/krew.tar.gz
        dest: /tmp
        remote_src: true

    - name: Run krew installer
      when: not packages_krew_stat.stat.exists
      ansible.builtin.command:
        cmd: /tmp/krew-linux_amd64 install krew
      changed_when: true

    - name: Clean up krew installer files
      when: not packages_krew_stat.stat.exists
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/krew.tar.gz
        - /tmp/krew-linux_amd64

  rescue:
    - name: Warn krew installation failed
      ansible.builtin.debug:
        msg: >-
          Failed to install krew: {{ ansible_failed_result.msg | default('unknown error') }}.
          Install manually from https://krew.sigs.k8s.io/docs/user-guide/setup/install/.
