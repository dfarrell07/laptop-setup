---
# roles/packages/tasks/main.yml
# Install packages via dnf (Fedora), apt (Debian), or brew (macOS).

# On CSB container tier (fapolicyd enforcing), binaries installed to /usr/local/bin
# outside dnf won't be in fapolicyd's trust database and will be blocked at runtime.
# Downloads would succeed but every invocation would fail with EPERM.
- name: Disable binary downloads on fapolicyd-enforcing CSB container tier
  ansible.builtin.set_fact:
    packages_install_binaries: false
  when: needs_container_tier == 'container'

- name: Install dnf packages
  when: ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
  block:
    - name: Install dnf packages
      ansible.builtin.dnf:
        name: >-
          {{ packages_cli
             + packages_languages
             + packages_security
             + packages_containers
             + (packages_containers_kubectl
                if (profile != 'work'
                    or ansible_facts['architecture'] != 'x86_64'
                    or not (packages_install_binaries | bool))
                else [])
             + packages_networking
             + (packages_networking_work if profile == 'work' else []) }}
        state: present
      become: true
      tags: [become]
  rescue:
    - name: Record dnf package install failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "Install dnf packages"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          One or more packages in packages_cli/languages/security/containers/networking/networking_work
          could not be installed; check repo access or install manually
        _csb_ticket_summary: "Cannot install core dnf packages on CSB"
        _csb_ticket_body: >-
          One or more packages from packages_cli, packages_languages, packages_security,
          packages_containers, packages_networking, or packages_networking_work could not be installed.
          This may be due to fapolicyd repo policy or a missing repository.
      when: csb_rhel
    - name: Warn dnf package install failed (non-CSB)
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install dnf packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing repo access.
          Continuing playbook execution.
      when: not csb_rhel

# Enable bpfman.socket here (Play 2 packages role) to catch the case where bpfman
# was just installed in this play. The system role (Play 1) also attempts this, but
# on first provision bpfman is not yet installed when Play 1 runs, so that attempt
# is a no-op. Both roles use failed_when: false for container/macOS safety.
- name: Enable bpfman.socket after package install (required for bpfman load/list to work)
  ansible.builtin.systemd:
    name: bpfman.socket
    state: started
    enabled: true
  become: true
  tags: [become]
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - ansible_facts['system'] == 'Linux'
    - profile == 'work'  # bpfman is in packages_networking_work (work-profile only)
  failed_when: false

- name: Install virtualization packages
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - install_virtualization | bool
  block:
    - name: Install virtualization packages
      ansible.builtin.dnf:
        name: "{{ packages_virtualization }}"
        state: present
      become: true
      tags: [become]
  rescue:
    - name: Record virtualization package install failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "Install virtualization packages"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Virtualization packages could not be installed; request repo access
          or install libvirt/QEMU/virt-manager manually
        _csb_ticket_summary: "Cannot install virtualization packages on CSB"
        _csb_ticket_body: >-
          One or more virtualization packages (libvirt, QEMU, virt-manager, etc.)
          could not be installed. This may affect container and VM workflows.
      when: csb_rhel
    - name: Warn virtualization package install failed (non-CSB)
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install virtualization packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing repo access.
          Continuing playbook execution.
      when: not csb_rhel

# Enable virtqemud.socket here (Play 2) in addition to system role (Play 1).
# On first provision, libvirt isn't installed when Play 1 runs, so the system role's
# enable attempt silently fails (failed_when: false). This task enables the socket
# after the package is present. Mirrors the bpfman.socket pattern above.
- name: Enable virtqemud.socket after libvirt package install
  ansible.builtin.systemd:
    name: virtqemud.socket
    state: started
    enabled: true
  become: true
  tags: [become]
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - ansible_facts['system'] == 'Linux'
    - install_virtualization | bool
    - "'libvirt' in packages_virtualization"
  failed_when: false

- name: Add user to libvirt and kvm groups (Play 2 — groups exist after install)
  ansible.builtin.user:
    name: "{{ real_user_id }}"
    groups: [libvirt, kvm]
    append: true
  become: true
  tags: [become]
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - ansible_facts['system'] == 'Linux'
    - install_virtualization | bool
    - real_user_id | length > 0
  failed_when: false
  # System role (Play 1) and this task both use failed_when:false because libvirt/kvm groups
  # may not exist if the package install was rescued. This task completes the membership.

- name: Install apt packages (Debian/Ubuntu)
  when: ansible_facts['pkg_mgr'] == 'apt'
  block:
    - name: Install apt packages (Debian/Ubuntu)
      ansible.builtin.apt:
        name: "{{ packages_apt }}"
        state: present
        update_cache: true
      become: true
      tags: [become]
  rescue:
    - name: Warn apt package install failed
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install apt packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing repo access.
          Continuing playbook execution.

- name: Add Homebrew taps (macOS)
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ packages_brew_taps }}"
  when: ansible_facts['os_family'] == 'Darwin'

- name: Install Homebrew packages (macOS)
  when: ansible_facts['os_family'] == 'Darwin'
  block:
    - name: Install Homebrew packages (macOS)
      community.general.homebrew:
        name: "{{ packages_brew }}"
        state: present
        update_homebrew: "{{ packages_brew_update }}"
  rescue:
    - name: Warn Homebrew package install failed
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install Homebrew packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or a missing formula.
          Continuing playbook execution.

- name: Install Homebrew cask packages (macOS)
  when: ansible_facts['os_family'] == 'Darwin'
  block:
    - name: Install Homebrew cask packages (macOS)
      community.general.homebrew_cask:
        name: "{{ packages_brew_cask }}"
        state: present
  rescue:
    - name: Warn Homebrew cask package install failed
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install Homebrew cask packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or a missing cask.
          Continuing playbook execution.

- name: Install ssh-askpass (macOS)
  community.general.homebrew:
    name: theseal/ssh-askpass/ssh-askpass
    state: present
  when: ansible_facts['os_family'] == 'Darwin'

- name: Start brew autoupdate (macOS)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: brew autoupdate start 43200 --upgrade --cleanup
  when: ansible_facts['os_family'] == 'Darwin'
  changed_when: false
  failed_when: false
  register: _packages_brew_autoupdate

- name: Warn if brew autoupdate failed (may need interactive trust step)
  ansible.builtin.debug:
    msg: >-
      brew autoupdate start failed (rc={{ _packages_brew_autoupdate.rc }}).
      Run 'brew autoupdate' interactively to complete trust if this is the first run.
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - _packages_brew_autoupdate.rc | default(0) != 0

# --- Binary downloads (SHA256-verified, pinned versions) ---

- name: Install oc and kubectl
  when:
    - packages_install_binaries | bool
    - ansible_facts['system'] == 'Linux'
    - ansible_facts['architecture'] == 'x86_64'
    - profile == 'work'
  block:
    - name: Check if oc is installed
      ansible.builtin.command:
        cmd: /usr/local/bin/oc version --client
      register: packages_oc_check
      changed_when: false
      failed_when: false

    - name: Download and install oc + kubectl
      when: >-
        packages_oc_check.rc != 0 or
        packages_oc_version == 'stable' or
        packages_oc_version not in (packages_oc_check.stdout)
      block:
        - name: Fetch OpenShift client sha256sum.txt
          ansible.builtin.uri:
            url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ packages_oc_version }}/sha256sum.txt"
            return_content: true
          register: packages_oc_sha256sums
          check_mode: false
          retries: 3
          delay: 10
          until: packages_oc_sha256sums.status == 200
          when: packages_oc_version == 'stable'

        - name: Extract SHA256 for openshift-client-linux.tar.gz
          ansible.builtin.set_fact:
            packages_oc_sha256: >-
              {{ packages_oc_sha256sums.content
                 | regex_search('^([0-9a-f]{64})\s+openshift-client-linux\.tar\.gz$',
                                '\1', multiline=True)
                 | default([]) | first | default('') }}
          when: packages_oc_version == 'stable'

        - name: Assert oc SHA256 was found
          ansible.builtin.assert:
            that: packages_oc_sha256 | length == 64
            fail_msg: "Could not extract SHA256 for openshift-client-linux.tar.gz from checksum file"

        - name: Download OpenShift client tarball (SHA256-verified)
          ansible.builtin.get_url:
            url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ packages_oc_version }}/openshift-client-linux.tar.gz"
            dest: /tmp/openshift-client-linux.tar.gz
            checksum: "sha256:{{ packages_oc_sha256 }}"
            mode: "0644"
          register: packages_oc_download
          retries: 3
          delay: 10
          until: packages_oc_download is succeeded

        - name: Extract oc and kubectl
          # Idempotency guard: skip re-extraction when get_url reports the tarball
          # is unchanged (sha256 matches the cached /tmp copy).  Still extracts
          # when oc is absent from disk (rc != 0) even if the tarball is cached,
          # covering the edge case of a manually deleted binary.  This matters
          # most for packages_oc_version == 'stable', where the outer when-clause
          # always fires and creates: /usr/local/bin/oc would wrongly prevent
          # upgrades when the stable pointer advances to a new release.
          ansible.builtin.unarchive:
            src: /tmp/openshift-client-linux.tar.gz
            dest: /usr/local/bin
            remote_src: true
            extra_opts:
              - --no-same-owner
              - oc
              - kubectl
          when: packages_oc_download.changed or packages_oc_check.rc != 0
          become: true
          tags: [become]

        - name: Set permissions on oc and kubectl
          ansible.builtin.file:
            path: "/usr/local/bin/{{ item }}"
            mode: "0755"
          loop: [oc, kubectl]
          become: true
          tags: [become]

      always:
        - name: Clean up oc tarball
          ansible.builtin.file:
            path: /tmp/openshift-client-linux.tar.gz
            state: absent

  rescue:
    - name: Record oc/kubectl download failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "oc/kubectl"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Install oc and kubectl manually from
          https://mirror.openshift.com/pub/openshift-v4/clients/ocp/
        _csb_ticket_summary: "Cannot download oc/kubectl binary on CSB"
        _csb_ticket_body: >-
          oc and kubectl binaries could not be downloaded from mirror.openshift.com.
          Install manually from https://mirror.openshift.com/pub/openshift-v4/clients/ocp/
      when: csb_rhel
    - name: Warn oc/kubectl download failed
      ansible.builtin.debug:
        msg: >-
          Failed to download oc/kubectl: {{ ansible_failed_result.msg | default('unknown error') }}.
          Install manually from https://mirror.openshift.com/pub/openshift-v4/clients/ocp/.
      when: not csb_rhel

- name: Install opm (Operator Package Manager)
  when:
    - packages_install_binaries | bool
    - ansible_facts['system'] == 'Linux'
    - ansible_facts['architecture'] == 'x86_64'
    - profile == 'work'
  block:
    - name: Check if opm binary exists
      ansible.builtin.command:
        cmd: /usr/local/bin/opm version
      register: packages_opm_check
      changed_when: false
      failed_when: false

    - name: Read opm OCP version marker
      ansible.builtin.slurp:
        src: /usr/local/bin/.opm-ocp-version
      register: packages_opm_marker
      failed_when: false

    - name: Download and install opm
      when: >-
        packages_opm_check.rc != 0 or
        'content' not in packages_opm_marker or
        packages_oc_version not in (packages_opm_marker.content | b64decode)
      block:
        - name: Fetch OPM sha256sum.txt
          ansible.builtin.uri:
            url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ packages_oc_version }}/sha256sum.txt"
            return_content: true
          register: packages_opm_sha256sums
          check_mode: false
          retries: 3
          delay: 10
          until: packages_opm_sha256sums.status == 200
          when: packages_oc_version == 'stable'

        - name: Extract SHA256 for opm-linux.tar.gz
          ansible.builtin.set_fact:
            packages_opm_sha256: >-
              {{ packages_opm_sha256sums.content
                 | regex_search('^([0-9a-f]{64})\s+opm-linux\.tar\.gz$',
                                '\1', multiline=True)
                 | default([]) | first | default('') }}
          when: packages_oc_version == 'stable'

        - name: Assert opm SHA256 was found
          ansible.builtin.assert:
            that: packages_opm_sha256 | length == 64
            fail_msg: "Could not extract SHA256 for opm-linux.tar.gz from checksum file"

        - name: Download opm tarball (SHA256-verified)
          ansible.builtin.get_url:
            url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ packages_oc_version }}/opm-linux.tar.gz"
            dest: /tmp/opm-linux.tar.gz
            checksum: "sha256:{{ packages_opm_sha256 }}"
            mode: "0644"
          register: packages_opm_download
          retries: 3
          delay: 10
          until: packages_opm_download is succeeded

        - name: Extract opm binary
          ansible.builtin.unarchive:
            src: /tmp/opm-linux.tar.gz
            dest: /usr/local/bin
            remote_src: true
            extra_opts:
              - --no-same-owner
              - opm-rhel8
          become: true
          tags: [become]

        - name: Rename opm-rhel8 to opm
          ansible.builtin.copy:
            src: /usr/local/bin/opm-rhel8
            dest: /usr/local/bin/opm
            remote_src: true
            mode: "0755"
          become: true
          tags: [become]

        - name: Remove opm-rhel8 source after rename
          ansible.builtin.file:
            path: /usr/local/bin/opm-rhel8
            state: absent
          become: true
          tags: [become]

        - name: Write OCP version marker for opm (enables idempotent version-drift detection)
          ansible.builtin.copy:
            content: "{{ packages_oc_version }}"
            dest: /usr/local/bin/.opm-ocp-version
            mode: "0644"
          become: true
          tags: [become]

      always:
        - name: Clean up opm tarball
          ansible.builtin.file:
            path: /tmp/opm-linux.tar.gz
            state: absent

  rescue:
    - name: Record opm download failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "opm"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Install opm manually from
          https://mirror.openshift.com/pub/openshift-v4/clients/ocp/
        _csb_ticket_summary: "Cannot download opm binary on CSB"
        _csb_ticket_body: >-
          opm binary could not be downloaded from mirror.openshift.com.
          Install manually from https://mirror.openshift.com/pub/openshift-v4/clients/ocp/
      when: csb_rhel
    - name: Warn opm download failed
      ansible.builtin.debug:
        msg: >-
          Failed to download opm: {{ ansible_failed_result.msg | default('unknown error') }}.
          Install manually from https://mirror.openshift.com/pub/openshift-v4/clients/ocp/.
      when: not csb_rhel

- name: Install kind
  when:
    - packages_install_binaries | bool
    - ansible_facts['system'] == 'Linux'
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
  vars:
    _kind_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    _kind_sha256: "{{ packages_kind_sha256_arm64 if ansible_facts['architecture'] == 'aarch64' else packages_kind_sha256 }}"
  block:
    - name: Check if kind is installed at target version
      ansible.builtin.command:
        cmd: /usr/local/bin/kind version
      register: packages_kind_check
      changed_when: false
      failed_when: false

    - name: Download kind binary
      when: "packages_kind_version not in (packages_kind_check.stdout)"
      ansible.builtin.get_url:
        url: "https://kind.sigs.k8s.io/dl/v{{ packages_kind_version }}/kind-linux-{{ _kind_arch }}"
        dest: /usr/local/bin/kind
        checksum: "sha256:{{ _kind_sha256 }}"
        mode: "0755"
      become: true
      tags: [become]
      register: packages_kind_download
      retries: 3
      delay: 10
      until: packages_kind_download is succeeded

  rescue:
    - name: Record kind download failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "kind"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Install kind manually from https://kind.sigs.k8s.io/dl/
        _csb_ticket_summary: "Cannot download kind binary on CSB"
        _csb_ticket_body: >-
          kind binary could not be downloaded from kind.sigs.k8s.io.
          Install manually from https://kind.sigs.k8s.io/dl/
      when: csb_rhel
    - name: Warn kind download failed
      ansible.builtin.debug:
        msg: >-
          Failed to download kind: {{ ansible_failed_result.msg | default('unknown error') }}.
          Install manually from https://kind.sigs.k8s.io/dl/.
      when: not csb_rhel

- name: Install helm
  when:
    - packages_install_binaries | bool
    - ansible_facts['system'] == 'Linux'
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
  vars:
    _helm_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    _helm_sha256: "{{ packages_helm_sha256_arm64 if ansible_facts['architecture'] == 'aarch64' else packages_helm_sha256 }}"
  block:
    - name: Check if helm is installed at target version
      ansible.builtin.command:
        cmd: /usr/local/bin/helm version --short
      register: packages_helm_check
      changed_when: false
      failed_when: false

    - name: Download and extract helm
      when: "packages_helm_version not in (packages_helm_check.stdout)"
      block:
        - name: Download helm tarball
          ansible.builtin.get_url:
            url: "https://get.helm.sh/helm-v{{ packages_helm_version }}-linux-{{ _helm_arch }}.tar.gz"
            dest: /tmp/helm.tar.gz
            checksum: "sha256:{{ _helm_sha256 }}"
            mode: "0644"
          register: packages_helm_download
          retries: 3
          delay: 10
          until: packages_helm_download is succeeded

        - name: Extract helm binary
          ansible.builtin.unarchive:
            src: /tmp/helm.tar.gz
            dest: /usr/local/bin
            remote_src: true
            extra_opts:
              - --no-same-owner
              - --strip-components=1
              - "linux-{{ _helm_arch }}/helm"
          become: true
          tags: [become]

        - name: Set permissions on helm
          ansible.builtin.file:
            path: /usr/local/bin/helm
            mode: "0755"
          become: true
          tags: [become]

      always:
        - name: Clean up helm tarball
          ansible.builtin.file:
            path: /tmp/helm.tar.gz
            state: absent

  rescue:
    - name: Record helm download failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "helm"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Install helm manually from https://helm.sh/docs/intro/install/
        _csb_ticket_summary: "Cannot download helm binary on CSB"
        _csb_ticket_body: >-
          helm binary could not be downloaded from get.helm.sh.
          Install manually from https://helm.sh/docs/intro/install/
      when: csb_rhel
    - name: Warn helm download failed
      ansible.builtin.debug:
        msg: >-
          Failed to download helm: {{ ansible_failed_result.msg | default('unknown error') }}.
          Install manually from https://helm.sh/docs/intro/install/.
      when: not csb_rhel

- name: Install kustomize
  when:
    - packages_install_binaries | bool
    - ansible_facts['system'] == 'Linux'
    - ansible_facts['architecture'] in ['x86_64', 'aarch64']
  vars:
    _kustomize_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    _kustomize_sha256: "{{ packages_kustomize_sha256_arm64 if ansible_facts['architecture'] == 'aarch64' else packages_kustomize_sha256 }}"
  block:
    - name: Check if kustomize is installed at target version
      ansible.builtin.command:
        cmd: /usr/local/bin/kustomize version
      register: packages_kustomize_check
      changed_when: false
      failed_when: false

    - name: Download and extract kustomize
      when: "packages_kustomize_version not in (packages_kustomize_check.stdout)"
      block:
        - name: Download kustomize tarball
          vars:
            _ver: "{{ packages_kustomize_version }}"
          ansible.builtin.get_url:
            url: "{{ packages_kustomize_url_base }}/kustomize%2Fv{{ _ver }}/kustomize_v{{ _ver }}_linux_{{ _kustomize_arch }}.tar.gz"
            dest: /tmp/kustomize.tar.gz
            checksum: "sha256:{{ _kustomize_sha256 }}"
            mode: "0644"
          register: packages_kustomize_download
          retries: 3
          delay: 10
          until: packages_kustomize_download is succeeded

        - name: Extract kustomize binary
          ansible.builtin.unarchive:
            src: /tmp/kustomize.tar.gz
            dest: /usr/local/bin
            remote_src: true
            extra_opts:
              - --no-same-owner
          become: true
          tags: [become]

        - name: Set permissions on kustomize
          ansible.builtin.file:
            path: /usr/local/bin/kustomize
            mode: "0755"
          become: true
