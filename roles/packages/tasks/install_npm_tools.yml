---
- name: Validate optional npm package pins
  ansible.builtin.assert:
    that:
      - item.name is match('^(@[a-z0-9_-]+/)?[a-z0-9_-]+$')
      - item.version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
  loop: "{{ packages_extra_npm }}"

- name: Create user npm prefix
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.npm-global"
    state: directory
    mode: "0755"

- name: Isolate optional npm global configuration
  ansible.builtin.copy:
    content: "# Managed empty npm configuration.\n"
    dest: "{{ ansible_facts['user_dir'] }}/.npm-global/global.npmrc"
    mode: "0644"

- name: Install optional pinned npm tools without lifecycle scripts
  community.general.npm:
    name: "{{ item.name }}"
    version: "{{ item.version }}"
    global: true
    state: present
    ignore_scripts: true
  environment:
    NPM_CONFIG_PREFIX: "{{ ansible_facts['user_dir'] }}/.npm-global"
    NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    NPM_CONFIG_USERCONFIG: /dev/null
    NPM_CONFIG_GLOBALCONFIG: "{{ ansible_facts['user_dir'] }}/.npm-global/global.npmrc"
  loop: "{{ packages_extra_npm }}"
