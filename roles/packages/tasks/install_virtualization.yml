---
# roles/packages/tasks/install_virtualization.yml
# Install virtualization packages and perform post-install setup.
# Included from main.yml when is_dnf and install_virtualization | bool.

- name: Install virtualization packages
  when:
    - is_dnf
    - install_virtualization | bool
  block:
    - name: Install virtualization packages
      ansible.builtin.dnf:
        name: "{{ packages_virtualization }}"
        state: present
      become: true
      tags: [become]
  rescue:
    - name: Record virtualization package install failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "Install virtualization packages"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Virtualization packages could not be installed; request repo access
          or install libvirt/QEMU/virt-manager manually
        _csb_ticket_summary: "Cannot install virtualization packages on CSB"
        _csb_ticket_body: >-
          One or more virtualization packages (libvirt, QEMU, virt-manager, etc.)
          could not be installed. This may affect container and VM workflows.
      when: csb_rhel
    - name: Warn virtualization package install failed (non-CSB)
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install virtualization packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing repo access.
          Continuing playbook execution.
      when: not csb_rhel

# Enable virtqemud.socket here (Play 2) in addition to system role (Play 1).
# On first provision, libvirt isn't installed when Play 1 runs, so the system role's
# enable attempt silently fails (failed_when: false). This task enables the socket
# after the package is present. Mirrors the bpfman.socket pattern above.
- name: Enable virtqemud.socket after libvirt package install
  ansible.builtin.systemd:
    name: virtqemud.socket
    state: started
    enabled: true
  become: true
  tags: [become]
  when:
    - is_dnf
    - install_virtualization | bool
    - "'libvirt' in packages_virtualization"
  failed_when: false

- name: Refresh /etc/group facts for libvirt/kvm membership check
  ansible.builtin.getent:
    database: group
  become: true
  tags: [become]
  when:
    - is_dnf
    - install_virtualization | bool

- name: Add user to libvirt and kvm groups (Play 2 — groups exist after install)
  ansible.builtin.user:
    name: "{{ real_user_id }}"
    groups: [libvirt, kvm]
    append: true
  become: true
  tags: [become]
  when:
    - is_dnf
    - install_virtualization | bool
    - real_user_id | length > 0
    - "'libvirt' in ansible_etc_group"
    - "'kvm' in ansible_etc_group"
  # No failed_when:false — groups are confirmed present, failures are real errors.
