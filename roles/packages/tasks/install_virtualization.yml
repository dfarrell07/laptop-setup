---
# roles/packages/tasks/install_virtualization.yml
# Install virtualization packages and perform post-install setup.
# Included from main.yml when is_dnf and install_virtualization | bool.

- name: Install virtualization packages
  block:
    - name: Install virtualization packages
      ansible.builtin.dnf:
        name: "{{ packages_virtualization }}"
        state: present
      become: true
      tags: [become]
      timeout: 300
  rescue:
    - name: Record virtualization package install failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "Install virtualization packages"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Virtualization packages could not be installed; request repo access
          or install libvirt, libvirt-client, qemu-kvm, virt-install manually
        _csb_ticket_summary: "Cannot install virtualization packages on CSB"
        _csb_ticket_body: >-
          One or more virtualization packages (libvirt, libvirt-client, qemu-kvm, virt-install)
          could not be installed. This may affect container and VM workflows.
      when: csb_rhel
    - name: Warn virtualization package install failed (non-CSB)
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install virtualization packages in role packages.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing repo access.
          Continuing playbook execution.
      when: not csb_rhel

# Enable virtqemud.socket and virtnetworkd.socket here (Play 2) after package install.
# Ensure sockets are enabled and started after package install; systemd socket units
# are not guaranteed to be in started state on all configurations (e.g. re-runs after
# a manual disable), and the system role has no logic to enable these socket units.
- name: Enable virtqemud.socket and virtnetworkd.socket after libvirt package install
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - virtqemud.socket
    - virtnetworkd.socket
  become: true
  tags: [become]
  ignore_errors: true
  register: _virt_socket_result
  when:
    - "'libvirt' in packages_virtualization"
    - not system_is_container

- name: Warn if virtqemud/virtnetworkd socket enable failed
  ansible.builtin.debug:
    msg: "WARNING: libvirt socket enable failed: {{ _virt_socket_result.results | selectattr('failed', 'equalto', true) | map(attribute='msg') | join(', ') | default('unknown') }}"
  when: _virt_socket_result is failed

- name: Refresh /etc/group facts for libvirt/kvm membership check
  ansible.builtin.getent:
    database: group
  become: true
  tags: [become]

- name: Add user to libvirt and kvm groups (Play 2 — groups exist after install)
  ansible.builtin.user:
    name: "{{ real_user_id }}"
    groups: [libvirt, kvm]
    append: true
  become: true
  tags: [become]
  when:
    - real_user_id | length > 0
    - "'libvirt' in ansible_etc_group"
    - "'kvm' in ansible_etc_group"
  # No failed_when:false — groups are confirmed present, failures are real errors.
