---
# roles/packages/tasks/install_subctl_versions.yml
# Multi-version subctl installation for Submariner management (work profile only).
# Installs subctl18, subctl19, etc. alongside the current version.
- name: Validate versioned subctl checksum exceptions
  ansible.builtin.assert:
    that:
      - >-
        ((dotfiles_gonosumdb | default('')) or (dotfiles_goprivate | default('')))
        | go_checksum_exceptions_safe((packages_go_install | default([])) + (packages_go_install_work | default([]))
                                     + ['github.com/submariner-io/subctl/cmd'])
    fail_msg: >-
      The effective checksum exception contains a public module pattern that bypasses Go checksum-database
      verification, or uses unsupported pattern syntax. Use private domain prefixes
      or literal private owners; only literals and '*' globs are supported.

- name: Report versioned subctl builds not simulated in check mode
  ansible.builtin.debug:
    msg: "CHECK MODE: subctl {{ packages_subctl_versioned | map(attribute='version') | join(', ') }} go builds not simulated."
  when:
    - ansible_check_mode
    - _packages_linux_x86_work and packages_subctl_versioned | default([]) | length > 0

- name: Install versioned subctl binaries (subctlXX) for multi-cluster Submariner management
  when:
    - not ansible_check_mode  # builds into a temp dir that check mode never creates
    - _packages_linux_x86_work and packages_subctl_versioned | default([]) | length > 0
  vars:
    _subctl_installed: >-
      {{ ((packages_subctl_version_check.results[loop_idx].stdout | default('')) ~
          (packages_subctl_version_check.results[loop_idx].stderr | default('')))
         | regex_findall('subctl version: v?(\S+)') | first | default('') }}
  block:
    - name: Check installed version of versioned subctl binaries
      ansible.builtin.command:
        cmd: "{{ ansible_facts['user_dir'] }}/.local/bin/subctl{{ item.suffix }} version"
      changed_when: false
      failed_when: false
      check_mode: false
      register: packages_subctl_version_check
      loop: "{{ packages_subctl_versioned }}"
      loop_control:
        label: "subctl{{ item.suffix }}"

    - name: Create GOTMPDIR directory for subctl compilation
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/tmp"
        state: directory
        mode: "0700"

    - name: Create secure temp directory for subctl binary (TOCTOU mitigation)
      ansible.builtin.tempfile:
        state: directory
        prefix: ansible_subctl_
        path: "{{ ansible_facts['user_dir'] }}/.cache"
      register: _subctl_tmpdir

    - name: Install subctl version
      ansible.builtin.command:
        argv:
          - go
          - install
          - -ldflags
          - "-X github.com/submariner-io/subctl/pkg/version.Version={{ item.version }}"
          - "github.com/submariner-io/subctl/cmd@v{{ item.version }}"
      timeout: 600
      environment:
        GOPATH: "{{ ansible_facts['user_dir'] }}/go"
        GOBIN: "{{ _subctl_tmpdir.path }}/subctl-v{{ item.version }}-bin"
        GOTMPDIR: "{{ ansible_facts['user_dir'] }}/tmp"
        GOTOOLCHAIN: "{{ packages_gotoolchain }}"
        HTTPS_PROXY: "{{ proxy_url if (network_proxied | bool) else omit }}"
        HTTP_PROXY: "{{ proxy_url if (network_proxied | bool) else omit }}"
        GOPROXY: 'https://proxy.golang.org,direct'
        GONOSUMDB: "{{ (dotfiles_gonosumdb | default('')) or (dotfiles_goprivate | default('')) or 'none' }}"
        GOPRIVATE: "{{ (dotfiles_goprivate | default('')) or 'none' }}"
        GOSUMDB: "{{ packages_gosumdb | default('sum.golang.org') }}"
        CC: /usr/bin/gcc
        CGO_CFLAGS: ''
        CGO_CXXFLAGS: ''
        CGO_LDFLAGS: ''
        CGO_ENABLED: '1'
      when: >-
        packages_subctl_version_check.results[loop_idx].rc != 0 or
        _subctl_installed != item.version
      changed_when: true
      ignore_errors: true
      register: packages_subctl_install_results
      loop: "{{ packages_subctl_versioned }}"
      loop_control:
        label: "subctl{{ item.suffix }}"
        index_var: loop_idx

    - name: Warn if versioned subctl go install failed
      ansible.builtin.debug:
        msg: >-
          WARNING: go install failed for subctl@v{{ item.item.version }}
          ({{ item.stderr | default(item.msg | default(''), true) | truncate(200) }});
          subctl{{ item.item.suffix }} is missing or outdated. Re-run make packages when the
          Go proxy is reachable.
      loop: >-
        {{ packages_subctl_install_results.results | default([])
           | selectattr('failed', 'defined') | selectattr('failed') | list }}
      loop_control:
        label: "subctl{{ item.item.suffix }}"


    - name: Inspect versioned subctl destination without following symlinks
      ansible.builtin.stat:
        path: "{{ ansible_facts['user_dir'] }}/.local/bin/subctl{{ item.suffix }}"
        follow: false
      loop: "{{ packages_subctl_versioned }}"
      register: _subctl_destinations
      loop_control:
        label: "subctl{{ item.suffix }}"

    - name: Reject non-regular versioned subctl destinations
      ansible.builtin.assert:
        that:
          - not item.stat.exists or item.stat.isreg | default(false)
        fail_msg: "Versioned subctl destination must be absent or a regular file."
      loop: "{{ _subctl_destinations.results }}"
      loop_control:
        label: "subctl{{ item.item.suffix }}"

    - name: Verify subctl binary exists in temp GOBIN
      ansible.builtin.stat:
        path: "{{ _subctl_tmpdir.path }}/subctl-v{{ item.version }}-bin/cmd"
      register: _subctl_binary_stat
      when: >-
        (packages_subctl_version_check.results[loop_idx].rc != 0 or
        _subctl_installed != item.version) and
        (packages_subctl_install_results.results[loop_idx].rc | default(0)) == 0
      loop: "{{ packages_subctl_versioned }}"
      loop_control:
        label: "subctl{{ item.suffix }}"
        index_var: loop_idx

    - name: Copy versioned subctl to ~/.local/bin/subctlXX
      ansible.builtin.copy:
        src: "{{ _subctl_tmpdir.path }}/subctl-v{{ item.version }}-bin/cmd"
        dest: "{{ ansible_facts['user_dir'] }}/.local/bin/subctl{{ item.suffix }}"
        mode: "0755"
        remote_src: true
      when: >-
        (packages_subctl_version_check.results[loop_idx].rc != 0 or
        _subctl_installed != item.version) and
        (packages_subctl_install_results.results[loop_idx].rc | default(0)) == 0 and
        _subctl_binary_stat.results[loop_idx].stat.exists | default(false)
      loop: "{{ packages_subctl_versioned }}"
      loop_control:
        label: "subctl{{ item.suffix }}"
        index_var: loop_idx

  always:
    - name: Clean up temp GOBIN directory
      ansible.builtin.file:
        path: "{{ _subctl_tmpdir.path }}"
        state: absent
      when: _subctl_tmpdir.path is defined
