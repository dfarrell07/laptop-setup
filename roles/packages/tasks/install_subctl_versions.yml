---
# roles/packages/tasks/install_subctl_versions.yml
# Multi-version subctl installation for Submariner management (work profile only).
# Installs subctl18, subctl19, etc. alongside the current version.
- name: Install versioned subctl binaries (subctlXX) for multi-cluster Submariner management
  when: _packages_linux_x86_work and packages_subctl_versioned | default([]) | length > 0
  block:
    - name: Check installed version of versioned subctl binaries
      ansible.builtin.command:
        cmd: "{{ ansible_facts['user_dir'] }}/.local/bin/subctl{{ item.suffix }} version"
      changed_when: false
      failed_when: false
      check_mode: false
      register: packages_subctl_version_check
      loop: "{{ packages_subctl_versioned }}"
      loop_control:
        label: "subctl{{ item.suffix }}"

    - name: Install subctl version with temp GOBIN
      ansible.builtin.command:
        cmd: go install github.com/submariner-io/subctl/cmd/subctl@v{{ item.version }}
      timeout: 600
      environment:
        GOPATH: "{{ ansible_facts['user_dir'] }}/go"
        GOBIN: "/tmp/subctl-v{{ item.version }}-bin"
        GOTOOLCHAIN: "{{ packages_gotoolchain }}"
        HTTPS_PROXY: "{{ proxy_url if (network_proxied | bool) else omit }}"
        HTTP_PROXY: "{{ proxy_url if (network_proxied | bool) else omit }}"
      vars:
        _subctl_installed: >-
          {{ ((packages_subctl_version_check.results[loop_idx].stdout | default('')) ~
              (packages_subctl_version_check.results[loop_idx].stderr | default('')))
             | regex_findall('subctl v?(\S+)') | first | default('') }}
      when: >-
        packages_subctl_version_check.results[loop_idx].rc != 0 or
        _subctl_installed != item.version
      changed_when: true
      failed_when: false
      register: packages_subctl_install_results
      loop: "{{ packages_subctl_versioned }}"
      loop_control:
        label: "subctl{{ item.suffix }}"
        index_var: loop_idx

    - name: Warn if versioned subctl go install failed
      ansible.builtin.debug:
        msg: >-
          WARNING: go install failed for subctl@v{{ item.item.version }};
          subctl{{ item.item.suffix }} may be missing. Check Go installation.
      loop: >-
        {{ packages_subctl_install_results.results | default([])
           | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list }}
      loop_control:
        label: "subctl{{ item.item.suffix }}"

    - name: Copy versioned subctl to ~/.local/bin/subctlXX
      ansible.builtin.copy:
        src: "/tmp/subctl-v{{ item.version }}-bin/subctl"
        dest: "{{ ansible_facts['user_dir'] }}/.local/bin/subctl{{ item.suffix }}"
        mode: "0755"
        remote_src: true
      when: >-
        (packages_subctl_version_check.results[loop_idx].rc != 0 or
        item.version not in (packages_subctl_version_check.results[loop_idx].stdout +
        packages_subctl_version_check.results[loop_idx].stderr)) and
        (packages_subctl_install_results.results[loop_idx].rc | default(0)) == 0
      loop: "{{ packages_subctl_versioned }}"
      loop_control:
        label: "subctl{{ item.suffix }}"
        index_var: loop_idx

    - name: Clean up temp GOBIN directories
      ansible.builtin.file:
        path: "/tmp/subctl-v{{ item.version }}-bin"
        state: absent
      loop: "{{ packages_subctl_versioned }}"
      loop_control:
        label: "subctl{{ item.suffix }}"

- name: Install downstream RH subctl versions (registry.redhat.io/rhacm2/subctl-rhel{8,9})
  when: _packages_linux_x86_work and packages_subctl_rh_versions | default([]) | length > 0
  block:
    - name: Check installed version of downstream RH subctl binaries
      ansible.builtin.command:
        cmd: "{{ ansible_facts['user_dir'] }}/.local/bin/subctl{{ item.suffix }} version"
      changed_when: false
      failed_when: false
      check_mode: false
      register: packages_subctl_rh_version_check
      loop: "{{ packages_subctl_rh_versions }}"
      loop_control:
        label: "subctl{{ item.suffix }}"

    - name: Extract downstream subctl tarball from registry image
      ansible.builtin.command:
        argv:
          - oc
          - image
          - extract
          - "registry.redhat.io/rhacm2/{{ item.image }}:{{ item.tag }}"
          - "--path=/dist/subctl-{{ item.tag }}*-linux-amd64.tar.xz:/tmp/"
          - "--confirm"
      timeout: 300
      register: _pkg_subctl_extract
      changed_when: _pkg_subctl_extract.rc == 0
      when: >-
        packages_subctl_rh_version_check.results[loop_idx].rc != 0 or
        item.tag not in (packages_subctl_rh_version_check.results[loop_idx].stdout | default('')) +
                        (packages_subctl_rh_version_check.results[loop_idx].stderr | default(''))
      loop: "{{ packages_subctl_rh_versions }}"
      loop_control:
        label: "{{ item.image }}:{{ item.tag }} → subctl{{ item.suffix }}"
        index_var: loop_idx

    - name: Extract and install versioned RH subctl to ~/.local/bin  # noqa: command-instead-of-module risky-shell-pipe
      ansible.builtin.shell:
        cmd: |
          set -eo pipefail
          TARBALL=$(ls /tmp/subctl-{{ item.tag }}*-linux-amd64.tar.xz 2>/dev/null | head -1)
          [[ -z "$TARBALL" ]] && exit 0
          TMPDIR=$(mktemp -d)
          tar -C "$TMPDIR" -xf "$TARBALL"
          BINARY=$(find "$TMPDIR" -name "subctl-{{ item.tag }}*-linux-amd64" -type f | head -1)
          [[ -z "$BINARY" ]] && exit 0
          install -m755 "$BINARY" "{{ ansible_facts['user_dir'] }}/.local/bin/subctl{{ item.suffix }}"
          rm -rf "$TMPDIR" "$TARBALL"
          echo "INSTALLED"
        executable: /bin/bash
      register: _pkg_subctl_install
      changed_when: '"INSTALLED" in _pkg_subctl_install.stdout'
      failed_when: false
      when: >-
        packages_subctl_rh_version_check.results[loop_idx].rc != 0 or
        item.tag not in (packages_subctl_rh_version_check.results[loop_idx].stdout | default('')) +
                        (packages_subctl_rh_version_check.results[loop_idx].stderr | default(''))
      loop: "{{ packages_subctl_rh_versions }}"
      loop_control:
        label: "{{ item.suffix }}"
        index_var: loop_idx

    - name: Warn if versioned RH subctl install failed
      ansible.builtin.debug:
        msg: >-
          WARNING: subctl install failed for {{ item.item.suffix }};
          RC={{ item.rc }} stderr={{ item.stderr | default('') | truncate(200) }}
      loop: >-
        {{ _pkg_subctl_install.results | default([])
           | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list }}
      loop_control:
        label: "{{ item.item.suffix }}"

  rescue:
    - name: Record downstream RH subctl installation failure (CSB)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "downstream RH subctl (oc image extract)"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: >-
          Run `podman login registry.redhat.io` with your Red Hat credentials, then
          re-run `make packages`. Alternatively, use `make container` to provision
          subctl inside the dev container where registry auth is pre-configured.
        _csb_ticket_summary: "Cannot pull downstream subctl from registry.redhat.io on CSB"
        _csb_ticket_body: >-
          oc image extract from registry.redhat.io/rhacm2 failed. This typically means
          registry auth is missing. Run `podman login registry.redhat.io` or use
          `make container` for the dev-container path.
      when: csb_rhel
    - name: Warn downstream RH subctl extraction failed
      ansible.builtin.debug:
        msg: >-
          WARNING: oc image extract from registry.redhat.io failed for downstream subctl.
          Run `podman login registry.redhat.io` then retry, or use `make container`.
          Error: {{ ansible_failed_result.msg | default('unknown error') | truncate(200) }}
      when: not csb_rhel
