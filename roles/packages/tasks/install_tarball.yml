---
# roles/packages/tasks/install_tarball.yml
# Shared block/rescue skeleton for tarball downloads with binary extraction.
# Mirrors install_binary.yml for the download-tarball → extract → chmod pattern.
#
# Required vars (pass via include_tasks vars:):
#   binary_name        — display name, e.g. "helm"
#   url                — download URL
#   dest               — install path, e.g. /usr/local/bin/helm
#   checksum           — e.g. "sha256:{{ computed_sha }}"
#   version_check_cmd  — shell command to test installed version
#   version_string     — expected string in version output
#   csb_action         — manual install instructions
#   csb_ticket_summary — CSB ticket one-liner
#   csb_ticket_body    — CSB ticket detail
#
# Note: tarball path is now created atomically via tempfile (no longer required as input var)
#
# Optional vars:
#   strip_components      — integer; adds --strip-components=N to tar (default: omit)
#   binary_in_archive     — path inside the tarball to extract (default: extract all)
#   download_timeout      — get_url timeout in seconds (default: 120)
#   version_check_timeout — version check shell timeout in seconds (default: 10)
#   attest_repo           — GitHub repository attesting to the archive (default: none)
#   attest_workflow       — exact upstream signing workflow; required with attest_repo

- name: Fetch and install tarball — {{ binary_name }}
  block:
    - name: "Version check: {{ binary_name }}"
      ansible.builtin.command:
        cmd: "timeout {{ version_check_timeout | default(10) }} {{ version_check_cmd }}"
      register: _install_tarball_check
      changed_when: false
      failed_when: _install_tarball_check.rc not in [0, 1, 127]
      check_mode: false

    - name: "Download and extract {{ binary_name }}"
      when: >-
        version_string not in (_install_tarball_check.stdout + _install_tarball_check.stderr)
        or attest_repo | default('') | length > 0
      block:
        - name: "Create atomic temporary directory for {{ binary_name }}"
          ansible.builtin.tempfile:
            state: directory
            prefix: "ansible_{{ binary_name }}_"
          register: _install_tarball_tmpdir
          become: true
          tags: [become]

        - name: Fetch archive — {{ binary_name }}
          ansible.builtin.get_url:
            url: "{{ url }}"
            dest: "{{ _install_tarball_tmpdir.path }}/{{ binary_name }}.tar.gz"
            checksum: "{{ checksum }}"
            mode: "0644"
            timeout: "{{ download_timeout | default(120) }}"
          environment:
            HTTP_PROXY: ''
            HTTPS_PROXY: ''
            http_proxy: ''
            https_proxy: ''
          register: _install_tarball_download
          retries: 3
          delay: 10
          until: _install_tarball_download is succeeded
          become: true
          tags: [become]

        - name: Read target user GitHub credentials for archive verification — {{ binary_name }}
          ansible.builtin.command: gh auth token
          environment:
            GH_HOST: github.com
          changed_when: false
          failed_when: false
          register: _install_tarball_gh_token
          no_log: true
          when:
            - attest_repo | default('') | length > 0
            - lookup('env', 'GH_TOKEN') | length == 0

        - name: Verify release archive attestation before extraction — {{ binary_name }}
          ansible.builtin.command:
            argv:
              - gh
              - attestation
              - verify
              - "{{ _install_tarball_download.dest }}"
              - --repo
              - "{{ attest_repo }}"
              - --signer-workflow
              - "{{ attest_workflow }}"
          environment:
            GH_TOKEN: "{{ lookup('env', 'GH_TOKEN') | default(_install_tarball_gh_token.stdout | default(''), true) }}"
            GH_HOST: github.com
          changed_when: false
          no_log: true  # credentials must never appear in task arguments
          become: true  # archive is in a root-owned mode-0700 temporary directory
          tags: [become]
          when: attest_repo | default('') | length > 0

        - name: Extract binary to /usr/local/bin — {{ binary_name }}
          ansible.builtin.unarchive:
            src: "{{ _install_tarball_tmpdir.path }}/{{ binary_name }}.tar.gz"
            dest: /usr/local/bin
            remote_src: true
            extra_opts: >-
              {{ ['--no-same-owner']
                 + (['--strip-components=' ~ strip_components] if strip_components is defined else [])
                 + ([binary_in_archive] if binary_in_archive is defined else []) }}
          become: true
          tags: [become]

        - name: "Set permissions on {{ binary_name }}"
          ansible.builtin.file:
            path: "{{ dest }}"
            mode: "0755"
          become: true
          tags: [become]

      always:
        - name: "Temporary directory cleanup: {{ binary_name }}"
          ansible.builtin.file:
            path: "{{ _install_tarball_tmpdir.path }}"
            state: absent
          become: true
          tags: [become]
          when: _install_tarball_tmpdir.path is defined

  rescue:
    - name: Fail closed when an attested archive cannot be installed — {{ binary_name }}
      ansible.builtin.fail:
        msg: >-
          Cannot install {{ binary_name }} with verified GitHub provenance.
          Authenticate gh on the target or supply GH_TOKEN on the controller, then retry.
          The release archive must match its pinned checksum and official signing workflow.
      when: attest_repo | default('') | length > 0

    - name: "CSB failure record: {{ binary_name }}"
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: packages
        _csb_task_name: "{{ binary_name }}"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: "{{ csb_action }}"
        _csb_ticket_summary: "{{ csb_ticket_summary }}"
        _csb_ticket_body: "{{ csb_ticket_body }}"
      when: csb_rhel
    - name: "Download failure warning: {{ binary_name }}"
      ansible.builtin.debug:
        msg: >-
          Failed to download {{ binary_name }}: {{ ansible_failed_result.msg | default('unknown error') }}.
          {{ csb_action }}
      when: not csb_rhel
