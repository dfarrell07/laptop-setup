---
profile: work  # fallback for standalone invocation

# Package lists by category. Override in config.yml or group_vars.
# Base lists (packages_cli, packages_languages, packages_security, packages_containers)
# are shared across all profiles. Lists with a _work suffix are work-profile-only
# and guarded by 'when: profile == "work"' in the install tasks.

packages_cli:
  - make
  - htop
  - tmux
  - mosh
  - jq
  - yq
  - direnv
  - vim-enhanced  # provides /usr/bin/vim binary; neovim does not symlink vim on Fedora (smoke-test checks command -v vim)
  - neovim
  - zsh-autosuggestions  # depends on zsh (pulled in automatically)
  - zsh-syntax-highlighting
  - fzf
  - pipx
  - python3-pip  # pipx uses pip at runtime; the Fedora RPM does not declare python3-pip as an RPM dep, so explicit install is required
  - zoxide
  - ShellCheck
  - shfmt
  - gh
  - ripgrep
  - fd-find
  - bat
  - tree  # Fedora Workstation group default; explicit for RHEL/Rocky non-Workstation targets
  - git-lfs            # large file support — git_repos and notes roles register lfs filters; both profiles need this

packages_languages: []  # intentionally empty; override in config.yml or molecule to add language runtimes

# Work-profile-only language tools (OVN-K/Submariner host builds; personal profile does no host Go
# development — gcc is CGO-only, but golang is needed for any Go build)
packages_languages_work:
  - golang
  - gcc           # needed for Go CGO builds

packages_security:
  - yubikey-manager
  - ykpers  # provides ykchalresp for HMAC-SHA1 vault challenge-response (preflight test)
  - openssl  # openssl-libs is a system dep; openssl CLI is not a Fedora 44 / RHEL default — needed for s_client, genrsa, and vault scripts

# RHEL/Rocky-only security packages: Fedora's libssh pulls in libfido2.so.1 as a
# capability dep; on RHEL/Rocky, libssh lacks FIDO2 so an explicit install is needed.
# Merged into _packages_dnf_all only when ansible_distribution != 'Fedora'.
packages_security_rhel:
  - libfido2

packages_containers:
  - podman  # Fedora Workstation default since F33; explicit for RHEL/Rocky and non-Workstation targets
  - distrobox

# Work-profile-only container tools (OCI image builder — not needed for personal distrobox/podman-run usage)
packages_containers_work:
  - buildah
  - skopeo

# kubectl via dnf only when the OCP tarball download is skipped (personal profile,
# non-x86_64, or packages_install_binaries=false). On work+x86_64 with
# packages_install_binaries=true, the OCP tarball provides /usr/local/bin/kubectl,
# which shadows /usr/bin/kubectl in PATH; the dnf install is unused and wastes disk.
# tasks/main.yml merges this list conditionally. Override to [] to suppress.
packages_containers_kubectl:
  - kubectl

packages_virtualization:
  - libvirt
  - libvirt-client
  - qemu-kvm
  - virt-install
  - virt-viewer

# Desktop packages managed by the desktop role, not here.

packages_networking:
  # tcpdump, traceroute, mtr, ethtool, bind-utils, nftables are Fedora Workstation defaults (always installed)
  # nftables: firewalld pulls it in as a dependency; no task calls nft directly
  # VPN
  - tailscale       # WireGuard mesh VPN (moved from packages_cli — it's a networking daemon)

# Work-profile-only networking tools (OVN-K/bpfman development at Red Hat)
packages_networking_work:
  - ovn            # Open Virtual Network (OVN-K dep; pulls in openvswitch automatically)
  - bpfman         # bpfman daemon for eBPF program management; must run on host for kernel BPF access
  - iproute-tc     # tc split from iproute on Fedora 38+; required for OVS/eBPF TC programs (OVN-K, bpfman)
  - wireshark-cli  # tshark — scripting-safe CLI capture; GUI wireshark intentionally omitted; work profile only
  - conntrack-tools  # netfilter connection tracking debugger; work profile only (OVN-K/Kubernetes)
  - iperf3         # network bandwidth measurement; work profile only
  - socat          # socket relay utility; work profile only
  - nmap           # network scanner; work profile only (OVN-K/Kubernetes debugging)

# Work-profile-only support tools (Red Hat diagnostic utilities + debug/profiling tools)
packages_support_work:
  - sos      # general RH support diagnostic bundle tool (sosreport); work profile only
             # (no RH support contract on personal)
  - strace   # system call tracer; needed on host for bpfman daemon debugging
  - gdb      # GNU debugger; 'gdb -p <pid>' attaches to bpfman daemon for live inspection
  - perf     # kernel performance profiling
  - bpftrace # eBPF dynamic tracing; host install for tracing bpfman daemon without entering container
  - bpftool  # eBPF program/map introspection

packages_apt:
  - git-lfs  # depends on git (pulled in automatically)
  - make
  - curl
  - tree
  - htop
  - tmux
  - mosh
  - jq
  - direnv
  - vim-nox  # full-featured vim with +clipboard; 'vim' pkg on Debian lacks clipboard support
  - neovim
  - zsh-autosuggestions  # depends on zsh (pulled in automatically)
  - zsh-syntax-highlighting
  - fzf
  - zoxide
  - gnupg          # Debian does not auto-install gnupg; needed for SSH role and git commit signing
  - openssh-client  # not a Debian 13 desktop default in minimal/container images;
                    # needed by ansible.builtin.known_hosts hash_host:true in ssh role
  # Networking tools (not Debian defaults):
  - dnsutils       # dig/nslookup/host; Fedora ships bind-utils as a Workstation default, Debian does not
  - python3-pip    # Fedora installs via packages_cli; Debian requires explicit install
  - pipx
  - shellcheck
  - ripgrep
  - fd-find
  - bat
  - shfmt
  # wl-clipboard moved to desktop_apt_packages (Wayland-only; belongs with desktop packages)
  # gh (GitHub CLI) is not in Debian standard repos; requires cli.github.com/packages apt source
  # yq: Debian 13 ships a Python-based yq (jq wrapper) incompatible with the Go-based yq here

# Work-profile-only apt packages (Debian/Ubuntu).
# Kubernetes CLIs (kubectl/kind/helm/kustomize) come from binary downloads, not apt.
packages_apt_work:
  # Debian 13 ships Go 1.24; gofumpt/govulncheck need 1.25, gopls needs 1.26.
  # GOTOOLCHAIN=auto (set in packages tasks) downloads the toolchain on demand.
  - golang  # work-only on Debian (mirrors packages_languages_work on Fedora); 300+ MB — skip for personal
  - gcc     # CGO builds — mirrors packages_languages_work on Fedora
  - nmap    # network scanner; work-only (mirrors packages_networking_work on Fedora)
  - socat   # socket relay; work-only (mirrors packages_networking_work on Fedora)
  - tshark  # tshark — scripting-safe CLI capture; mirrors packages_networking_work wireshark-cli on Fedora
  - buildah  # OCI image builder — mirrors packages_containers_work (work-only on dnf)
  - skopeo  # OCI image inspection/copy — mirrors packages_containers_work (work-only on dnf)

