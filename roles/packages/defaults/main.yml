---
profile: work  # noqa: var-naming[no-role-prefix] — fallback for standalone invocation

# Package lists by category. Override in config.yml or group_vars.
# All lists below are work-profile-oriented. Personal users should override
# heavy work-specific categories (e.g. packages_networking, packages_virtualization)
# in config.yml to trim unneeded packages.

packages_cli:
  - git
  - make
  - curl
  - tree
  - htop
  - tmux
  - mosh
  - jq
  - yq
  - meld
  - direnv
  - vim-enhanced
  - neovim
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - fzf
  - pipx
  - zoxide
  - ShellCheck
  - shfmt
  - gh
  - ripgrep
  - fd-find
  - bat

packages_languages:
  - golang
  - python3
  - python3-pip
  - gcc
  - gcc-c++
  - clang

packages_security:
  - yubikey-manager
  - ykpers  # provides ykchalresp for HMAC-SHA1 vault challenge-response (preflight test)
  - policycoreutils-python-utils
  - libfido2
  - openssl
  - gnupg2
  - gitleaks

packages_containers:
  - podman
  - buildah
  - skopeo
  - distrobox
  - kubernetes-client  # kubectl — needed on all profiles for KIND cluster interaction

packages_virtualization:
  - libvirt
  - libvirt-client
  - qemu-kvm
  - virt-install
  - virt-viewer

# Desktop packages managed by the desktop role, not here.

packages_networking:
  # packet capture
  - tcpdump
  - wireshark-cli   # tshark — scripting-safe CLI capture; GUI wireshark belongs in distrobox
  # path analysis
  - traceroute
  - mtr
  # socket/connection
  - socat           # socket relay utility (moved from packages_cli)
  - conntrack-tools
  # interface/routing
  - iproute
  - ethtool
  # scanning/perf
  - nmap            # network scanner (moved from packages_cli)
  - iperf3
  # firewall/DNS
  - nftables
  - bind-utils
  # VPN
  - tailscale       # WireGuard mesh VPN (moved from packages_cli — it's a networking daemon)

# Work-profile-only networking tools (OVN-K/bpfman development at Red Hat)
packages_networking_work:
  - ovn            # Open Virtual Network control plane (OVN-K dependency)
  - openvswitch    # Open vSwitch dataplane (OVN-K dependency)
  - bpfman         # bpfman daemon for eBPF program management; must run on host for kernel BPF access
  - bpftool        # eBPF program/map introspection
  - iproute-tc     # tc split from iproute on Fedora 38+; required for OVS/eBPF TC programs (OVN-K, bpfman)
  - strace         # system call tracer; needed on host for bpfman daemon debugging
  - gdb            # GNU debugger; 'gdb -p <pid>' attaches to bpfman daemon for live inspection
  - perf           # kernel performance profiling
  - bpftrace       # eBPF dynamic tracing; must be on host for kernel access
  - sos            # Red Hat support diagnostic bundle tool; required for CSB/RHEL support cases

packages_apt:
  - git
  - make
  - curl
  - tree
  - htop
  - tmux
  - mosh
  - jq
  - nmap
  - meld
  - direnv
  - vim-nox  # full-featured vim with +clipboard; 'vim' pkg on Debian lacks clipboard support
  - neovim
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - fzf
  - zoxide
  - socat
  - pipx
  - shellcheck
  - ripgrep
  - fd-find
  - bat
  - shfmt
  - golang  # needed for packages_go_install; Debian 13 ships 1.22 (sufficient to bootstrap)
  # wl-clipboard moved to desktop_apt_packages (Wayland-only; belongs with desktop packages)
  # gh (GitHub CLI) is not in Debian standard repos; requires cli.github.com/packages apt source
  # yq: Debian 13 ships a Python-based yq (jq wrapper) incompatible with the Go-based yq here

