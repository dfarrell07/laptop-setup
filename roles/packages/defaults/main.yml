packages_ansible_lint_version: "26.6.0"

# Also governs opm download — opm co-releases with oc on mirror.openshift.com.
# kubectl is extracted from the same OCP tarball (openshift-client-linux.tar.gz)
# and therefore tracks the OCP release cadence, not upstream Kubernetes.  OCP 4.22
# ships Kubernetes 1.35 (OCP 4.x → k8s 1.(x+13); update this line when
# packages_oc_version changes).  If you need a newer kubectl for upstream clusters, replace
# the Extract task in tasks/main.yml with a standalone dl.k8s.io download and pin
# packages_kubectl_version independently.
packages_oc_version: "4.22.7"

packages_go_install:
  # General Go development tools (all profiles)
  - mvdan.cc/gofumpt@v0.11.0
  - golang.org/x/vuln/cmd/govulncheck@v1.6.0
  - github.com/daixiang0/gci@v0.14.0
  - golang.org/x/tools/gopls@v0.23.0

# Work-profile-only Go tools (OVN-K codegen + Submariner + Kubernetes)
packages_go_install_work:
  # Pin controller-gen and code-generator tools to match OVN-K's go.mod
  # (hack/update-codegen.sh uses v0.36.2). Bump together when OVN-K upgrades k8s.
  - sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0
  - k8s.io/code-generator/cmd/client-gen@v0.36.2
  - k8s.io/code-generator/cmd/informer-gen@v0.36.2
  - k8s.io/code-generator/cmd/lister-gen@v0.36.2
  - k8s.io/code-generator/cmd/deepcopy-gen@v0.36.2
  - k8s.io/code-generator/cmd/applyconfiguration-gen@v0.36.2
  - k8s.io/code-generator/cmd/defaulter-gen@v0.36.2
  # subctl: latest version installed as 'subctl'; packages_subctl_version governs the pin.
  # See packages_subctl_versioned below for older-version multi-install.
  - "github.com/submariner-io/subctl/cmd/subctl@v{{ packages_subctl_version }}"
  # Kubernetes log viewer — multi-pod log tail for OVN-K/Konflux debugging
  - github.com/stern/stern@v1.34.0

# Versioned subctl installs: each entry becomes subctl<major><minor> in ~/.local/bin.
# Example: {version: "0.18.0", suffix: "18"} → installs /usr/local/bin → ~/.local/bin/subctl18
# Useful when managing Submariner clusters at different broker API versions.
# The latest version should also be in packages_go_install_work (as plain 'subctl').
packages_subctl_version: "0.24.0"  # governs go install and distrobox_subctl_version; bump together

packages_subctl_versioned:
  - version: "0.18.0"
    suffix: "18"

# Downstream RH subctl (registry.redhat.io/rhacm2/subctl-rhel{8,9}) — RHACM-bundled builds.
# Extracted via 'oc image extract'; each entry installed as subctlRH<suffix> in ~/.local/bin.
# Requires: oc installed (from OCP tarball) + podman login registry.redhat.io.
# Image name: subctl-rhel8 for RHACM <=2.8 (Submariner <=0.15); subctl-rhel9 for RHACM 2.9+
# Binary inside image: /dist/subctl-v<tag>*-linux-amd64.tar.xz
packages_subctl_rh_versions: []
# Example to enable:
# packages_subctl_rh_versions:
#   - tag: "v0.18"            # image tag (e.g. v0.18 for Submariner 0.18.x / RHACM 2.11)
#     image: "subctl-rhel8"   # image name: subctl-rhel8 (<=RHACM 2.8) or subctl-rhel9 (2.9+)
#     suffix: "RH18"          # binary name: ~/.local/bin/subctlRH18
#   - tag: "v0.22"
#     image: "subctl-rhel9"
#     suffix: "RH22"

