---
profile: work  # noqa: var-naming[no-role-prefix] — fallback for standalone invocation

# Package lists by category. Override in config.yml or group_vars.
# All lists below are work-profile-oriented. Personal users should override
# heavy work-specific categories (e.g. packages_networking, packages_virtualization)
# in config.yml to trim unneeded packages.

packages_cli:
  - make
  - htop
  - tmux
  - mosh
  - jq
  - yq
  - meld
  - direnv
  - vim-enhanced
  - neovim
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - fzf
  - pipx
  - zoxide
  - ShellCheck
  - shfmt
  - gh
  - ripgrep
  - fd-find
  - bat
  - tree
  - git-lfs            # large file support — repos in group_vars/all/repos.yml may use LFS

packages_languages:
  - golang
  - python3
  - python3-pip
  - gcc
  - gcc-c++

packages_security:
  - yubikey-manager
  - ykpers  # provides ykchalresp for HMAC-SHA1 vault challenge-response (preflight test)
  - policycoreutils-python-utils
  - libfido2
  - openssl
  - gitleaks

packages_containers:
  - podman
  - buildah
  - skopeo
  - distrobox

# kubectl via dnf only when the OCP tarball download is skipped (personal profile,
# non-x86_64, or packages_install_binaries=false). On work+x86_64 with
# packages_install_binaries=true, the OCP tarball provides /usr/local/bin/kubectl,
# which shadows /usr/bin/kubectl in PATH; the dnf install is unused and wastes disk.
# tasks/main.yml merges this list conditionally. Override to [] to suppress.
packages_containers_kubectl:
  - kubectl

packages_virtualization:
  - libvirt
  - libvirt-client
  - qemu-kvm
  - virt-install
  - virt-viewer

# Desktop packages managed by the desktop role, not here.

packages_networking:
  # packet capture
  - wireshark-cli   # tshark — scripting-safe CLI capture; GUI wireshark intentionally omitted
  # socket/connection
  - socat           # socket relay utility (moved from packages_cli)
  - conntrack-tools
  # scanning/perf
  - nmap            # network scanner (moved from packages_cli)
  - iperf3
  # tcpdump, traceroute, mtr, ethtool, bind-utils, nftables are Fedora Workstation defaults (always installed)
  # nftables: firewalld pulls it in as a dependency; no task calls nft directly
  # VPN
  - tailscale       # WireGuard mesh VPN (moved from packages_cli — it's a networking daemon)

# Work-profile-only networking tools (OVN-K/bpfman development at Red Hat)
packages_networking_work:
  - ovn            # Open Virtual Network control plane (OVN-K dependency)
  - openvswitch    # Open vSwitch dataplane (OVN-K dependency)
  - bpfman         # bpfman daemon for eBPF program management; must run on host for kernel BPF access
  - bpftool        # eBPF program/map introspection
  - iproute-tc     # tc split from iproute on Fedora 38+; required for OVS/eBPF TC programs (OVN-K, bpfman)
  - strace         # system call tracer; needed on host for bpfman daemon debugging
  - gdb            # GNU debugger; 'gdb -p <pid>' attaches to bpfman daemon for live inspection
  - perf           # kernel performance profiling
  - bpftrace       # eBPF dynamic tracing; host install for tracing bpfman daemon without entering container
  - sos            # Red Hat support diagnostic bundle tool (sosreport); work profile only (CSB/RHEL support cases)

packages_apt:
  - git
  - git-lfs
  - make
  - curl
  - tree
  - htop
  - tmux
  - mosh
  - jq
  - meld
  - direnv
  - vim-nox  # full-featured vim with +clipboard; 'vim' pkg on Debian lacks clipboard support
  - neovim
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - fzf
  - zoxide
  - gnupg          # Debian does not auto-install gnupg; needed for SSH role and git commit signing
  # Networking tools (not Debian defaults):
  - dnsutils       # dig/nslookup/host; Fedora ships bind-utils as a Workstation default, Debian does not
  - socat
  - nmap
  - python3-pip    # Fedora installs via packages_languages; Debian requires explicit install
  - pipx
  - shellcheck
  - ripgrep
  - fd-find
  - bat
  - shfmt
  - golang  # needed for packages_go_install; Debian 13 ships 1.22 (sufficient to bootstrap)
  # wl-clipboard moved to desktop_apt_packages (Wayland-only; belongs with desktop packages)
  # gh (GitHub CLI) is not in Debian standard repos; requires cli.github.com/packages apt source
  # yq: Debian 13 ships a Python-based yq (jq wrapper) incompatible with the Go-based yq here

# Binary downloads — pinned versions with SHA256 verification.
# Override versions in config.yml when upgrading.
