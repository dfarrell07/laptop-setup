# Also governs opm download — opm co-releases with oc on mirror.openshift.com.
# kubectl is extracted from the same OCP tarball (openshift-client-linux.tar.gz)
# and therefore tracks the OCP release cadence, not upstream Kubernetes.  OCP 4.22
# ships Kubernetes 1.31.  If you need a newer kubectl for upstream clusters, replace
# the Extract task in tasks/main.yml with a standalone dl.k8s.io download and pin
# packages_kubectl_version independently.
packages_oc_version: "4.22.6"

