---
# Package lists by category. Override in config.yml or group_vars.

packages_cli:
  - git
  - make
  - curl
  - tree
  - htop
  - tmux
  - mosh
  - jq
  - yq
  - procps-ng
  - nmap
  - meld
  - direnv
  - vim
  - zsh
  - fzf
  - socat
  - pipx
  - zoxide
  - ShellCheck
  - shfmt
  - gh
  - golangci-lint
  - tailscale
  - ripgrep
  - fd-find

packages_languages:
  - golang
  - python3
  - python3-pip
  - gcc
  - gcc-c++
  - clang

packages_security:
  - yubikey-manager
  - ykpers  # provides ykchalresp for HMAC-SHA1 vault challenge-response (preflight test)
  - bubblewrap
  - policycoreutils-python-utils
  - age
  - pass
  - libfido2
  - openssl
  - gnupg2
  - gitleaks

packages_containers:
  - podman
  - buildah
  - skopeo
  - distrobox
  - wl-clipboard

packages_virtualization:
  - libvirt
  - libvirt-client
  - qemu-kvm
  - virt-install
  - virt-viewer

# Desktop packages managed by the desktop role, not here.

packages_networking:
  - tcpdump
  - bridge-utils
  - conntrack-tools
  - ethtool
  - iperf3
  - traceroute
  - iproute
  - ovn
  - openvswitch
  - mtr
  - nftables
  - bind-utils
  - bpftool
  - wireshark
  - wireshark-cli  # tshark — scripting-safe CLI capture; wireshark pkg may not install on headless CSB
  - iproute-tc     # tc split from iproute on Fedora 38+; required for OVS/eBPF TC programs (OVN-K, bpfman)
  - strace         # system call tracer; needed on host for bpfman daemon debugging (not just container)
  - perf
  - sos            # Red Hat support diagnostic bundle tool (sos report); required for CSB/RHEL support cases

packages_apt:
  - git
  - make
  - curl
  - tree
  - htop
  - tmux
  - mosh
  - jq
  - nmap
  - meld
  - direnv
  - vim-nox  # full-featured vim with +clipboard; 'vim' pkg on Debian lacks clipboard support
  - zsh
  - fzf
  - zoxide
  - socat
  - pipx
  - shellcheck
  - ripgrep
  - fd-find
  - shfmt
  - golang  # needed for packages_go_install; Debian 12 ships 1.19 (sufficient to bootstrap)
  - wl-clipboard  # wl-copy for tmux copy-pipe on Wayland (tmux.conf Linux clipboard chain)
  # gh (GitHub CLI) is not in Debian standard repos; requires cli.github.com/packages apt source
  # yq: Debian 12 ships a Python-based yq (jq wrapper) incompatible with the Go-based yq here

# Binary downloads — pinned versions with SHA256 verification.
