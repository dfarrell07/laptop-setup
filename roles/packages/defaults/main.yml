packages_ansible_lint_version: "26.6.0"

# Also governs opm download — opm co-releases with oc on mirror.openshift.com.
# kubectl is extracted from the same OCP tarball (openshift-client-linux.tar.gz)
# and therefore tracks the OCP release cadence, not upstream Kubernetes.  OCP 4.22
# ships Kubernetes 1.35 (OCP 4.x → k8s 1.(x+13); update this line when
# packages_oc_version changes).  If you need a newer kubectl for upstream clusters, replace
# the Extract task in tasks/main.yml with a standalone dl.k8s.io download and pin
# packages_kubectl_version independently.
packages_oc_version: "4.22.7"
# packages_oc_sha256 and packages_opm_sha256 must be updated together whenever packages_oc_version is bumped.
packages_oc_sha256: "3d02d45ae5037a723afbbdda1063c08d4788a9b9ace6c6f44aa329764ee648a1"
packages_opm_sha256: "d3779a2c28450ff5b3e0b5f1cc63c6e63891f3b63467062a89aed0304128bd85"

packages_go_install: []  # no universal Go tools; all dev tools are profile-scoped below

# Work-profile-only Go tools (OVN-K codegen + Submariner + Kubernetes + Go IDE/CI toolchain)
packages_golangci_lint_version: "2.12.2"
packages_gofumpt_version: "0.11.0"
packages_govulncheck_version: "1.6.0"
packages_gci_version: "0.14.0"
packages_gopls_version: "0.23.0"
packages_controller_gen_version: "0.19.0"
packages_stern_version: "1.34.0"

packages_go_install_work:
  # Go IDE / CI tools — work profile only (not needed on personal workstations)
  - "mvdan.cc/gofumpt@v{{ packages_gofumpt_version }}"
  - "golang.org/x/vuln/cmd/govulncheck@v{{ packages_govulncheck_version }}"
  - "github.com/daixiang0/gci@v{{ packages_gci_version }}"
  - "golang.org/x/tools/gopls@v{{ packages_gopls_version }}"
  - "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v{{ packages_golangci_lint_version }}"
  # Pin controller-gen to match OVN-K's update-codegen.sh (not go.mod — controller-tools is not a go.mod dep).
  # Bump packages_code_generator_version together when OVN-K upgrades k8s (tracks upstream OVN-K; openshift fork lags).
  - "sigs.k8s.io/controller-tools/cmd/controller-gen@v{{ packages_controller_gen_version }}"
  - "k8s.io/code-generator/cmd/client-gen@v{{ packages_code_generator_version }}"
  - "k8s.io/code-generator/cmd/informer-gen@v{{ packages_code_generator_version }}"
  - "k8s.io/code-generator/cmd/lister-gen@v{{ packages_code_generator_version }}"
  - "k8s.io/code-generator/cmd/deepcopy-gen@v{{ packages_code_generator_version }}"
  - "k8s.io/code-generator/cmd/applyconfiguration-gen@v{{ packages_code_generator_version }}"
  # subctl: latest version installed as 'subctl'; packages_subctl_version governs the pin.
  # See packages_subctl_versioned below for older-version multi-install.
  - "github.com/submariner-io/subctl/cmd/subctl@v{{ packages_subctl_version }}"
  # Kubernetes log viewer — multi-pod log tail for OVN-K/Konflux debugging
  - "github.com/stern/stern@v{{ packages_stern_version }}"

# Versioned subctl installs: each entry becomes subctl<major><minor> in ~/.local/bin.
# Example: {version: "0.18.0", suffix: "18"} → installs /usr/local/bin → ~/.local/bin/subctl18
# Useful when managing Submariner clusters at different broker API versions.
# The latest version should also be in packages_go_install_work (as plain 'subctl').
packages_code_generator_version: "0.36.2"  # governs all k8s.io/code-generator/* tools; bump with OVN-K k8s upgrade
packages_subctl_version: "0.24.0"  # governs go install and distrobox_subctl_version; bump together

packages_subctl_versioned:
  - version: "0.18.0"
    suffix: "18"

# Downstream RH subctl (registry.redhat.io/rhacm2/subctl-rhel{8,9}) — RHACM-bundled builds.
# Extracted via 'oc image extract'; each entry installed as subctlRH<suffix> in ~/.local/bin.
# Requires: oc installed (from OCP tarball) + podman login registry.redhat.io.
# Image name: subctl-rhel8 for RHACM <=2.8 (Submariner <=0.15); subctl-rhel9 for RHACM 2.9+
# Binary inside image: /dist/subctl-v<tag>*-linux-amd64.tar.xz
packages_subctl_rh_versions: []
# Example to enable:
# packages_subctl_rh_versions:
#   - tag: "v0.18"            # image tag (e.g. v0.18 for Submariner 0.18.x / RHACM 2.11)
#     image: "subctl-rhel8"   # image name: subctl-rhel8 (<=RHACM 2.8) or subctl-rhel9 (2.9+)
#     suffix: "RH18"          # binary name: ~/.local/bin/subctlRH18
#   - tag: "v0.22"
#     image: "subctl-rhel9"
#     suffix: "RH22"

packages_k9s_version: "0.51.0"
packages_k9s_sha256: "c3752ad51a5a4015a113819c4eeb6e55a4d0e4b8e652494797532f6fc8161dd7"
