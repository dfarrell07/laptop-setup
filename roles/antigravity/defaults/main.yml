---
# Antigravity CLI (`agy`), used by the gper/gper2 launchers. The vendor publishes no package or pinned release: a
# manifest names the latest tarball and its SHA-512. The role installs from it only when agy is missing (agy updates
# itself afterwards) and never runs `agy install`, which would edit the managed shell rc files.
antigravity_enabled: true
packages_install_binaries: true  # shared offline switch
antigravity_manifest_base: https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests
antigravity_bin_dir: "{{ ansible_facts['user_dir'] }}/.local/bin"
# Homes that get the managed GEMINI.md (shared agent baseline): gper's, and gper2's on Linux (zshrc.j2).
antigravity_gemini_homes: >-
  {{ [ansible_facts['user_dir'] ~ '/.gemini']
     + ([ansible_facts['user_dir'] ~ '/.gemini-per2'] if ansible_facts['system'] == 'Linux' else []) }}
# Seeded once into each home's antigravity-cli/settings.json (agy owns the file afterwards). Logins are browser OAuth
# per account and machine: no token is seeded, stored in the vault or committed.
antigravity_model: Gemini 3.8 Flash (High)
antigravity_verbosity: low
antigravity_trusted_workspaces: []  # absolute paths; per machine in config.yml (agy appends as you trust workspaces)
