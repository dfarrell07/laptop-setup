---
# roles/ssh/tasks/main.yml
# Deploy SSH keys from vault + pre-seed known_hosts.

# --- Pre-role validation (defense-in-depth: protects against --start-at-task / --skip-tags always bypass) ---
# FAIL_MSG TEMPLATE (six elements for defense-in-depth assertions):
# (1) SECURITY + threat, (2) input source, (3) injection mechanism, (4) attack example,
# (5) impact, (6) allowed pattern. Guides rootcause diagnosis in remote/batch provisioning.

- name: SECURITY assert ssh_work_keyscan_hosts entries are safe hostnames (SSH role guard)
  # Deliberately NO tags — only way to survive --skip-tags always.
  vars:
    _keyscan_hosts: "{{ ssh_work_keyscan_hosts | default([]) }}"
    _hostnames: >-
      {{ _keyscan_hosts | map(attribute='host', default='') | map('string') | select() | list +
         (_keyscan_hosts | selectattr('host', 'undefined') | map('string') | select() | list) }}
  ansible.builtin.assert:
    that:
      - _hostnames | select('search', '[^a-zA-Z0-9._-]') | list | length == 0
    fail_msg: >-
      SECURITY: Command Injection via Unvalidated SSH Hostname.
      Input: ssh_work_keyscan_hosts contains hostname outside [a-zA-Z0-9._-].
      Mechanism: Unsafe hostnames in ProxyCommand or -R port forwarding expand via shell.
      Example: "ProxyCommand ssh gateway -W localhost;rm%20-rf%20/:22" executes shell commands.
      Impact: SSH session hijacking, key compromise, arbitrary code execution.
      Fix: Hostnames must strictly match ^[a-zA-Z0-9._-]+$.
  when: ssh_work_keyscan_hosts | default([]) | length > 0

- name: Ensure SSH directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.ssh"
    state: directory
    mode: "0700"

- name: Restrict known_hosts to owner-only
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.ssh/known_hosts"
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Fetch GitHub SSH host keys from API
  ansible.builtin.uri:
    url: "{{ ssh_github_known_hosts_url }}"
    return_content: true
    timeout: 10
  register: ssh_github_meta
  changed_when: false
  check_mode: false
  failed_when: false
  retries: 2
  delay: 3
  until: ssh_github_meta.status | default(0) == 200

- name: Set GitHub ed25519 keys fact
  ansible.builtin.set_fact:
    ssh_github_ed25519_keys: "{{ ssh_github_meta.json.ssh_keys | default([]) | select('match', 'ssh-ed25519 ') | list }}"

- name: Set GitHub API fetch success fact
  ansible.builtin.set_fact:
    ssh_github_ok: "{{ ssh_github_meta.status | default(0) == 200 and ssh_github_ed25519_keys | length > 0 }}"

- name: Pre-seed GitHub known_hosts
  ansible.builtin.known_hosts:
    name: github.com
    key: "github.com {{ item }}"
    state: present
    hash_host: true
  loop: "{{ ssh_github_ed25519_keys if ssh_github_ok else ssh_github_known_hosts_fallback }}"
  loop_control:
    label: "{{ item.split()[0] }}"

- name: Warn if GitHub SSH key fetch failed (used pinned fallback)
  ansible.builtin.debug:
    msg: >-
      WARNING: Could not fetch GitHub SSH host keys from api.github.com
      (status: {{ ssh_github_meta.status | default('no response') }}).
      Seeded github.com known_hosts from pinned fallback keys instead.
  when: not ssh_github_ok

- name: Pre-seed work git host known_hosts
  ansible.builtin.include_tasks: keyscan_host.yml
  loop: "{{ ssh_work_keyscan_hosts }}"
  loop_control:
    loop_var: _keyscan_host
  when: profile == 'work'

- name: Assert SSH auth public key type is accepted by sshd hardening
  ansible.builtin.assert:
    that:
      - ssh_auth_key_pub.split()[0] in ssh_pubkey_accepted_algorithms
    fail_msg: >-
      SECURITY: SSH Authentication Lockout via Incompatible Key Algorithm.
      Input: ssh_auth_key_pub (vault) has key type '{{ ssh_auth_key_pub.split()[0] }}'.
      Mechanism: sshd-hardening.conf.j2 PubkeyAcceptedAlgorithms restricts accepted types;
      non-matching types silently rejected at auth time with no fallback.
      Example: RSA key deployed when only ed25519/ecdsa accepted causes permanent lockout.
      Impact: SSH login failure, potential lockout from provisioned machine.
      Fix: Use only {{ ssh_pubkey_accepted_algorithms | join(', ') }}.
  when: ssh_auth_key_pub | trim | length > 0
  tags: [always]

- name: Deploy SSH auth key
  ansible.builtin.copy:
    content: "{{ ssh_auth_key }}"
    dest: "{{ ansible_facts['user_dir'] }}/.ssh/{{ dotfiles_ssh_hardware_key_basename }}"
    mode: "0600"
  no_log: true
  when: ssh_auth_key | trim | length > 0

- name: Deploy SSH auth public key
  ansible.builtin.copy:
    content: "{{ ssh_auth_key_pub }}"
    dest: "{{ ansible_facts['user_dir'] }}/.ssh/{{ dotfiles_ssh_hardware_key_basename }}.pub"
    mode: "0644"
  when: ssh_auth_key_pub | trim | length > 0

- name: Stat authorized_keys before writing (symlink-to-device guard)
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.ssh/authorized_keys"
  register: _ssh_authkeys_stat
  tags: [always]

- name: Assert authorized_keys is not a symlink
  ansible.builtin.assert:
    that:
      - not _ssh_authkeys_stat.stat.exists or _ssh_authkeys_stat.stat.isreg
    fail_msg: >-
      SECURITY: ~/.ssh/authorized_keys is a symlink (target:
      {{ _ssh_authkeys_stat.stat.lnk_target | default('unknown') }}).
      A symlink-to-device attack would silently discard written keys.
      Remove the symlink and re-run provisioning.
  tags: [always]

- name: Add SSH auth public key to authorized_keys
  ansible.posix.authorized_key:
    user: "{{ ansible_facts['user_id'] }}"
    key: "{{ ssh_auth_key_pub }}"
    state: present
    exclusive: true
  no_log: true
  when: ssh_auth_key_pub | trim | length > 0

- name: Deploy SSH signing key
  ansible.builtin.copy:
    content: "{{ ssh_signing_key }}"
    dest: "{{ ansible_facts['user_dir'] }}/.ssh/{{ ssh_signing_key_basename }}"
    mode: "0600"
  no_log: true
  when: ssh_signing_key | trim | length > 0

- name: Deploy SSH signing public key
  ansible.builtin.copy:
    content: "{{ ssh_signing_key_pub }}"
    dest: "{{ ansible_facts['user_dir'] }}/.ssh/{{ ssh_signing_key_basename }}.pub"
    mode: "0644"
  when: ssh_signing_key_pub | trim | length > 0

- name: Deploy Red Hat internal git key
  ansible.builtin.copy:
    content: "{{ rh_git_key }}"
    dest: "{{ ansible_facts['user_dir'] }}/.ssh/{{ dotfiles_ssh_redhat_key_basename }}"
    mode: "0600"
  no_log: true
  when:
    - rh_git_key | trim | length > 0
    - profile == 'work'

- name: Remove Red Hat internal git key when not work profile
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.ssh/{{ dotfiles_ssh_redhat_key_basename }}"
    state: absent
  when: profile != 'work'
