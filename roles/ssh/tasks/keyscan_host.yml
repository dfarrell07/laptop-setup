---
# Fetch SSH host keys and seed known_hosts.
# Called via include_tasks with loop_var: _keyscan_host.
# _keyscan_host may be a plain hostname string or a dict:
#   {host: hostname, fingerprint: "SHA256:..."}  (fingerprint is optional;
#   when set, the scanned key fingerprint is asserted before known_hosts is seeded)
# A fingerprint field that is set but not a full SHA256 (e.g. a placeholder awaiting the real
# value) defers the host: nothing is seeded, so git_repos skips its SSH repos. Never TOFU here.
- name: Defer host with unpinned fingerprint {{ _keyscan_host.host | default(_keyscan_host) }}
  ansible.builtin.debug:
    msg: >-
      Not seeding {{ _keyscan_host.host }}: fingerprint '{{ _keyscan_host.fingerprint }}' is not a
      full SHA256 value. Its SSH repos are skipped until the real fingerprint is set in config.yml.
  when:
    - _keyscan_host.fingerprint is defined
    - _keyscan_host.fingerprint is not match('^SHA256:[A-Za-z0-9+/]{43}$')

- name: Pre-seed known_hosts for {{ _keyscan_host.host | default(_keyscan_host) }}
  when: >-
    _keyscan_host.fingerprint is not defined or
    _keyscan_host.fingerprint is match('^SHA256:[A-Za-z0-9+/]{43}$')
  vars:
    _ks_host: "{{ _keyscan_host.host | default(_keyscan_host) }}"
    _ks_fingerprint: "{{ _keyscan_host.fingerprint | default('') }}"
  block:
    - name: Fetch SSH host keys for {{ _ks_host }}
      ansible.builtin.command:
        cmd: ssh-keyscan -t ed25519,ecdsa -T 5 {{ _ks_host }}
      register: ssh_keyscan_result
      check_mode: false
      timeout: 10
      changed_when: false
      ignore_errors: true
      retries: 1
      delay: 5
      until: ssh_keyscan_result.rc == 0 and ssh_keyscan_result.stdout | length > 0

    - name: Verify host key fingerprint for {{ _ks_host }}
      ansible.builtin.command:
        cmd: ssh-keygen -lf /dev/stdin
        stdin: "{{ ssh_keyscan_result.stdout }}"
      register: _ks_fp_result
      check_mode: false
      changed_when: false
      # Exact match against the scanned key fingerprints (field 2 of each ssh-keygen -l line)
      failed_when: >-
        _ks_fingerprint not in (_ks_fp_result.stdout_lines | map('split') | map(attribute=1, default='') | list)
      # An unreachable host (e.g. off VPN) is reported below, not as a key mismatch
      when: _ks_fingerprint | length > 0 and ssh_keyscan_result is succeeded

    - name: Warn — TOFU key acceptance (no fingerprint configured) for {{ _ks_host }}
      ansible.builtin.debug:
        msg: >-
          NOTICE: SSH host key for {{ _ks_host }} accepted on first-use (TOFU) —
          no fingerprint pin configured. To guard against MITM on first provision,
          obtain the expected SHA256 fingerprint via an out-of-band channel and set
          it in ssh_work_keyscan_hosts as: {host: {{ _ks_host }}, fingerprint: "SHA256:..."}.
      when: _ks_fingerprint | length == 0 and ssh_keyscan_result.rc == 0

    - name: Seed known_hosts entries for {{ _ks_host }}
      ansible.builtin.known_hosts:
        name: "{{ _ks_host }}"
        key: "{{ item }}"
        state: present
        hash_host: true
      loop: >-
        {{ ssh_keyscan_result.stdout_lines
           | select('match', '^' + (_ks_host | regex_escape))
           | list }}
      loop_control:
        label: "{{ item.split()[1] | default('key') }}"

    - name: Warn — keyscan returned no matching lines for {{ _ks_host }}
      ansible.builtin.debug:
        msg: >
          WARNING: ssh-keyscan output contained no lines starting with '{{ _ks_host }}'.
          known_hosts was not pre-seeded — git clone will prompt on first connection.
      when: (ssh_keyscan_result.stdout_lines | select('match', '^' + (_ks_host | regex_escape)) | list | length) == 0

  rescue:
    - name: Abort — fingerprint mismatch (MITM risk) for {{ _ks_host }}
      ansible.builtin.fail:
        msg: >
          SECURITY: SSH host key fingerprint mismatch for {{ _ks_host }}.
          Expected {{ _ks_fingerprint }} — aborting, possible MITM attack.
      when: "'Verify host key fingerprint' in (ansible_failed_task.name | default(''))"

    - name: Re-raise unexpected block failure for {{ _ks_host }}
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('unexpected error in keyscan block') }}"
      when: "'Verify host key fingerprint' not in (ansible_failed_task.name | default(''))"

- name: Warn — could not fetch host keys for {{ _keyscan_host.host | default(_keyscan_host) }}
  ansible.builtin.debug:
    msg: >
      WARNING: Could not fetch {{ _keyscan_host.host | default(_keyscan_host) }} SSH host keys
      (VPN may be required). known_hosts not pre-seeded.
  when: ssh_keyscan_result is failed
