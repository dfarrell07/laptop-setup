---
# Fetch SSH host keys and seed known_hosts.
# Called via include_tasks with loop_var: _keyscan_host.
- name: Pre-seed known_hosts for {{ _keyscan_host }}
  block:
    - name: Fetch SSH host keys for {{ _keyscan_host }}
      ansible.builtin.command:
        cmd: ssh-keyscan -t ed25519,ecdsa -T 10 {{ _keyscan_host }}
      register: ssh_keyscan_result
      check_mode: false
      timeout: 15
      changed_when: false
      retries: 3
      delay: 5
      until: ssh_keyscan_result.rc == 0 and ssh_keyscan_result.stdout | length > 0

    - name: Seed known_hosts entries for {{ _keyscan_host }}
      ansible.builtin.known_hosts:
        name: "{{ _keyscan_host }}"
        key: "{{ item }}"
        state: present
        hash_host: true
      loop: >-
        {{ ssh_keyscan_result.stdout_lines
           | select('match', '^' + (_keyscan_host | regex_escape))
           | list }}
      loop_control:
        label: "{{ item.split()[1] | default('key') }}"

    - name: Warn — keyscan returned no matching lines for {{ _keyscan_host }}
      ansible.builtin.debug:
        msg: >
          WARNING: ssh-keyscan output contained no lines starting with '{{ _keyscan_host }}'.
          known_hosts was not pre-seeded — git clone will prompt on first connection.
      when: (ssh_keyscan_result.stdout_lines | select('match', '^' + (_keyscan_host | regex_escape)) | list | length) == 0

  rescue:
    - name: Warn — could not fetch host keys for {{ _keyscan_host }}
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not fetch {{ _keyscan_host }} SSH host keys
          (VPN may be required). known_hosts not pre-seeded — git clone
          for {{ _keyscan_host }} repos will prompt on first connection.
