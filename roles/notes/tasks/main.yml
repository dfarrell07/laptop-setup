---
- name: Notes role tasks
  when: notes_enabled | bool
  block:
    - name: Check if notes repo exists
      ansible.builtin.stat:
        path: "{{ notes_repo_path }}/.git"
      register: notes_repo_stat

    - name: Check if git-lfs filter is already registered  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: git config --global filter.lfs.smudge
      register: notes_lfs_configured
      changed_when: false
      failed_when: false
      check_mode: false  # read-only probe — must run in check mode

    - name: Check git-lfs availability  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: git lfs version
      register: notes_lfs_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Warn if git-lfs is not installed
      ansible.builtin.debug:
        msg: >-
          git-lfs is not installed. Repos with LFS-tracked files will clone with
          pointer text files instead of real content.
          Install git-lfs ('{{ is_dnf | ternary('dnf', 'apt') }} install git-lfs') before cloning repos that track large files.
      when:
        - notes_lfs_check.rc != 0

    - name: Register git-lfs smudge/clean filters before clone (if git-lfs installed)
      ansible.builtin.command:
        cmd: git lfs install --skip-repo
      changed_when: true
      failed_when: false
      when:
        - notes_lfs_configured.rc != 0
        - notes_lfs_check.rc == 0

    - name: Clone notes repo (SSH, then HTTPS fallback)
      when: not notes_repo_stat.stat.exists
      block:
        - name: Clone notes repo via SSH
          ansible.builtin.git:  # noqa: latest[git]
            repo: "{{ notes_remote_url }}"
            dest: "{{ notes_repo_path }}"
            update: false  # Never auto-pull: transcrypt init required first; do not overwrite plaintext working tree
          environment:
            GIT_TERMINAL_PROMPT: "0"
          timeout: 60
      rescue:
        - name: Warn that SSH clone failed
          ansible.builtin.debug:
            msg: >-
              SSH clone of notes repo failed (is your SSH key loaded?). Trying HTTPS
              fallback — push and signed commits will still require SSH.

        - name: Clone notes repo via HTTPS (SSH fallback)
          ansible.builtin.git:  # noqa: latest[git]
            repo: "{{ notes_remote_url_https }}"
            dest: "{{ notes_repo_path }}"
            update: false  # Never auto-pull: transcrypt init required first; do not overwrite plaintext working tree
          environment:
            GIT_TERMINAL_PROMPT: "0"  # prevent interactive credential prompt from hanging make all
          failed_when: false

    - name: Re-check if notes repo exists after clone attempts
      ansible.builtin.stat:
        path: "{{ notes_repo_path }}/.git"
      register: notes_repo_post_clone
      when: not notes_repo_stat.stat.exists

    - name: Set notes repo available fact
      ansible.builtin.set_fact:
        notes_repo_available: >-
          {{ notes_repo_stat.stat.exists or
             (notes_repo_post_clone.stat.exists | default(false)) }}

    - name: Warn if notes repo could not be cloned
      ansible.builtin.debug:
        msg: >-
          Could not clone notes repo via SSH or HTTPS.
          Run 'gh auth login' or load SSH keys, then re-run 'make notes'.
      when: not notes_repo_available | bool

    - name: Check if transcrypt is available  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: which transcrypt
      register: notes_transcrypt_bin
      changed_when: false
      failed_when: false
      check_mode: false  # read-only probe — must run in check mode
      when: notes_repo_available | bool

    - name: Set transcrypt availability fact
      ansible.builtin.set_fact:
        notes_transcrypt_available: "{{ notes_transcrypt_bin.rc == 0 }}"
      when: notes_repo_available | bool

    - name: Deploy gitleaks allowlist for notes repo (before transcrypt init — prevents ciphertext flagging)
      ansible.builtin.copy:
        dest: "{{ notes_repo_path }}/.gitleaks.toml"
        mode: "0644"
        content: |
          # Allow all blobs — transcrypt encrypts file contents before staging.
          # The global pre-commit hook (core.hooksPath) would otherwise flag
          # every commit in this repo as containing "secrets" (AES-256-CBC ciphertext).
          [allowlist]
            description = "Transcrypt-encrypted notes repo — all blobs are encrypted ciphertext"
            paths = ['.*']
      when: notes_repo_available | bool

    - name: Check if transcrypt is initialized
      ansible.builtin.command:
        cmd: transcrypt --display
        chdir: "{{ notes_repo_path }}"
      register: notes_transcrypt_check
      changed_when: false
      failed_when: false
      check_mode: false  # read-only probe — must run in check mode
      no_log: true
      when:
        - notes_transcrypt_available | bool

    - name: Set transcrypt initialized fact
      ansible.builtin.set_fact:
        notes_transcrypt_inited: "{{ notes_transcrypt_check.rc == 0 }}"
      when:
        - notes_transcrypt_available | bool

    - name: Initialize transcrypt
      ansible.builtin.command:
        argv:
          - transcrypt
          - -c
          - "{{ notes_transcrypt_cipher }}"
          - -p
          - "{{ notes_transcrypt_password }}"
          - -y
        chdir: "{{ notes_repo_path }}"
      register: notes_transcrypt_init_result
      no_log: true
      changed_when: notes_transcrypt_init_result.rc == 0
      failed_when: false
      when:
        - notes_transcrypt_available | bool
        - not (notes_transcrypt_inited | bool)
        - notes_transcrypt_password | length > 0
        - notes_transcrypt_password != 'REPLACE_ME'

    - name: Warn if transcrypt password is placeholder
      ansible.builtin.debug:
        msg: >-
          notes_transcrypt_password is still set to 'REPLACE_ME' — transcrypt not initialized.
          Replace vault_notes_transcrypt_password in vault.yml with the real password.
      when:
        - notes_transcrypt_available | bool
        - not (notes_transcrypt_inited | bool)
        - notes_transcrypt_password == 'REPLACE_ME'

    - name: Warn if transcrypt initialization failed
      ansible.builtin.debug:
        msg: >-
          transcrypt initialization exited {{ notes_transcrypt_init_result.rc }} —
          notes may not be decrypted. Check the password in vault.yml.
      when:
        - notes_transcrypt_available | bool
        - notes_transcrypt_init_result is not skipped
        - notes_transcrypt_init_result.rc | default(0) != 0

    - name: Warn if transcrypt already initialized (password rotation not automatic)
      ansible.builtin.debug:
        verbosity: 1
        msg: >-
          transcrypt is already initialized — if vault_notes_transcrypt_password changed,
          re-provisioning silently skips re-init. To rotate credentials, manually run:
          cd {{ notes_repo_path }} && transcrypt --flush-credentials &&
          transcrypt -c {{ notes_transcrypt_cipher }} -p <new_password> -y
      when:
        - notes_transcrypt_available | bool
        - notes_transcrypt_inited | bool


    - name: Restrict notes repo directory and .git/config permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: '{{ notes_repo_path }}', mode: '0700'}
        - {path: '{{ notes_repo_path }}/.git/config', mode: '0600'}
      when: notes_repo_available | bool

    - name: Warn if transcrypt not available
      ansible.builtin.debug:
        msg: "transcrypt not installed — run 'make packages' first"
      when:
        - notes_repo_available | bool
        - not (notes_transcrypt_available | bool)

    - name: Warn if transcrypt password not set
      ansible.builtin.debug:
        msg: >-
          notes_transcrypt_password is empty — transcrypt not initialized.
          Set vault_notes_transcrypt_password in vault.yml to enable.
      when:
        - notes_transcrypt_available | bool
        - not (notes_transcrypt_inited | bool)
        - notes_transcrypt_password | length == 0
