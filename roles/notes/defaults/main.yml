---
notes_enabled: false  # opt-in: set true in config.yml; needs a GitHub repo notes_repo_name (default "notes") under dotfiles_github_user
notes_repo_name: notes
notes_repo_path: "{{ ansible_facts['user_dir'] }}/{{ notes_repo_name }}"
notes_remote_url: "git@github.com:{{ dotfiles_github_user }}/{{ notes_repo_name }}.git"
notes_remote_url_https: "https://github.com/{{ dotfiles_github_user }}/{{ notes_repo_name }}.git"
notes_transcrypt_cipher: aes-256-cbc
notes_transcrypt_password: ''  # sentinel fallback; group_vars/all/vars.yml sets this via vault_notes_transcrypt_password
notes_transcrypt_linux_bin_path: /usr/local/bin/transcrypt
notes_transcrypt_bin_path: >-
  {{ (dotfiles_homebrew_prefix + '/bin/transcrypt') if ansible_facts['os_family'] == 'Darwin'
  else notes_transcrypt_linux_bin_path }}
