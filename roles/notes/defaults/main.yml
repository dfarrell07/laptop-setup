---
notes_enabled: false  # opt-in: set true in config.yml (private repo — dfarrell07 account only)
notes_repo_path: "{{ ansible_facts['user_dir'] }}/notes"
notes_remote_url: "git@github.com:{{ dotfiles_github_user }}/notes.git"
notes_remote_url_https: "https://github.com/{{ dotfiles_github_user }}/notes.git"
notes_transcrypt_cipher: aes-256-cbc
# notes_transcrypt_password: owned by group_vars/all/vars.yml via vault_notes_transcrypt_password;
# empty string = transcrypt init skipped
notes_transcrypt_available: false  # set via set_fact in tasks/main.yml when transcrypt is found
notes_transcrypt_inited: false      # set via set_fact in tasks/main.yml when transcrypt --display succeeds
