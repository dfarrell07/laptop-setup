---
# roles/redhat/tasks/main.yml
# Red Hat-specific: CA certs, VPN. Work profile only.

- name: Stat and deploy Red Hat CA certificates
  when: not csb_rhel
  block:
    - name: Stat Red Hat CA certificate files in role
      ansible.builtin.stat:
        path: "{{ role_path }}/files/{{ item }}"
      loop: "{{ redhat_ca_certs }}"
      register: redhat_ca_stat
      delegate_to: localhost

    - name: Deploy Red Hat CA certificates
      block:
        - name: Copy CA cert files to anchors directory
          ansible.builtin.copy:
            src: "{{ item.item }}"
            dest: "{{ redhat_ca_dest }}/{{ item.item }}"
            mode: "0644"
          loop: "{{ redhat_ca_stat.results }}"
          loop_control:
            label: "{{ item.item }}"
          become: true
          tags: [become]
          notify: Update CA trust
          when: item.stat.exists
      rescue:
        - name: Record CA certificate deploy failure
          ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
          vars:
            _csb_role: redhat
            _csb_task_name: "Deploy Red Hat CA certificates"
            _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
            _csb_action: "Red Hat internal CA certs may be missing; verify {{ redhat_ca_dest }} exists and is writable"
            _csb_ticket_summary: "Cannot deploy Red Hat CA certificates on CSB"
            _csb_ticket_body: >-
              Red Hat CA certificate files could not be copied to
              {{ redhat_ca_dest }}/. Internal CA trust may be
              broken, affecting access to internal HTTPS services.
          when: csb_detected
        - name: Warn CA certificate deploy failed (non-CSB)
          ansible.builtin.debug:
            msg: >-
              TASK FAILED: Deploy Red Hat CA certificates in role redhat.
              Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
              Continuing playbook execution.
          when: not csb_detected

    - name: Warn when no CA cert files found in role
      ansible.builtin.debug:
        msg: >-
          No Red Hat CA certificate files found in {{ role_path }}/files/.
          Populate the files listed in redhat_ca_certs to deploy CA trust.
      when: redhat_ca_stat.results | selectattr('stat.exists') | list | length == 0

- name: Install Red Hat cert packages
  # File-based cert deploy (above) covers CSB Fedora hybrid; the RPM is RHEL CSB only (IT-managed repos)
  when: csb_rhel
  block:
    - name: Install cert packages via dnf
      ansible.builtin.dnf:
        name: "{{ redhat_cert_packages }}"
        state: present
      become: true
      tags: [become]
      notify: Update CA trust
  rescue:
    - name: Record cert package install failure
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: redhat
        _csb_task_name: "Install Red Hat cert packages"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: "Red Hat internal CA certs may be missing; request redhat-internal-cert-install access or install manually"
        _csb_ticket_priority: High
        _csb_ticket_summary: "Cannot install redhat-internal-cert-install on CSB"
        _csb_ticket_body: >-
          The redhat-internal-cert-install package could not be installed.
          Affected CA cert files: {{ redhat_ca_certs | join(' and ') }}
          (deployed to {{ redhat_ca_dest }}).
          Without these certificates, internal HTTPS endpoints fail:
          Jira, Confluence, and internal container registries all require
          the Red Hat internal CA chain.
          The redhat-internal-cert-install package is the supported
          distribution mechanism for these certs on CSB systems.
          Blocked workflows: internal web services, container image pulls
          from internal registries, authenticated internal API calls.

- name: Install VPN packages
  when:
    - install_vpn
    - csb_detected  # corporate VPN: RHEL CSB or CSB-detected Fedora only
  block:
    - name: Install VPN packages via dnf
      ansible.builtin.dnf:
        name: "{{ redhat_vpn_packages }}"
        state: present
      become: true
      tags: [become]
  rescue:
    - name: Record VPN package install failure
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: redhat
        _csb_task_name: "Install VPN packages"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: "VPN client not installed; request redhat-internal-globalprotect-ui or redhat-internal-openvpn-profiles access"
        _csb_ticket_summary: "Cannot install VPN packages on CSB"
        _csb_ticket_body: >-
          The VPN client package could not be installed. Package name:
          {{ redhat_vpn_packages | join(' or ') }}.
          Without VPN, all internal Red Hat network access is blocked
          off-site: internal registries, Jira, Confluence, source repos,
          and build infrastructure are unreachable without an active tunnel.
          Blocked workflows: all internal network access when off the
          Red Hat corporate network.
      when: csb_detected
    - name: Warn VPN package install failed (non-CSB)
      ansible.builtin.debug:
        msg: >-
          TASK FAILED: Install VPN packages in role redhat.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          Continuing playbook execution.
      when: not csb_detected

# --- CSB system account hardening (CIS 5.6) ---
# splunkforwarder CSB package creates a 'splunk' account with /bin/bash shell.
# CIS 5.6 requires non-login system accounts use /sbin/nologin or be locked.
- name: Check if splunk user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ redhat_splunk_service_account }}"
    fail_key: false
  when: csb_detected

- name: Restrict splunk system account shell (CIS 5.6)
  when:
    - csb_detected
    - redhat_splunk_service_account in (ansible_facts.getent_passwd | default({}))
  block:
    - name: Set splunk account shell to nologin
      ansible.builtin.user:
        name: "{{ redhat_splunk_service_account }}"
        shell: "{{ redhat_splunk_nologin_shell }}"
      become: true
      tags: [become]
  rescue:
    - name: Record splunk account hardening failure
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: redhat
        _csb_task_name: "Restrict splunk system account shell"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: "Splunk shell remains default; account may be used for login"
        _csb_ticket_priority: High
        _csb_ticket_summary: "Cannot restrict splunk account shell on CSB"
        _csb_ticket_body: >-
          The splunk service account shell could not be set to /sbin/nologin.
          CIS Benchmark 5.6 requires non-login system accounts use
          /sbin/nologin or be locked to prevent interactive login.
          Root cause: the splunk-managed CSB package creates the splunk
          user with /bin/bash, allowing interactive login via a service
          account — a privilege escalation risk if the account is
          compromised or misconfigured.
          Remediation: request IT/CSB modify the splunk-managed package
          to set shell=/sbin/nologin at install time.
          Blocked workflows: CIS 5.6 compliance cannot be achieved while
          the CSB splunk package sets an interactive shell.
      when: csb_detected
    - name: Warn splunk account hardening failed (non-CSB)
      ansible.builtin.debug:
        msg: >-
          TASK FAILED: Restrict splunk system account shell in role redhat.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          Continuing playbook execution.
      when: not csb_detected
