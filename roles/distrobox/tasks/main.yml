---
# roles/distrobox/tasks/main.yml
# Create Distrobox/Toolbx container + register for Play 3 provisioning.

# --- Detect container tool ---
- name: Probe distrobox binary availability  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: which distrobox
  register: distrobox_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Probe toolbox binary availability  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: which toolbox
  register: distrobox_toolbox_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode

- name: Set container tool facts
  ansible.builtin.set_fact:
    distrobox_use_distrobox: "{{ distrobox_check.rc == 0 }}"
    distrobox_use_toolbox: "{{ distrobox_check.rc != 0 and distrobox_toolbox_check.rc == 0 }}"
    distrobox_tool: >-
      {{ 'distrobox' if (distrobox_check.rc == 0)
         else ('toolbox' if (distrobox_toolbox_check.rc == 0)
         else 'none') }}

- name: Warn if RHEL host will use wrong default container image version
  ansible.builtin.debug:
    msg: >-
      On RHEL hosts the default container_image inherits the host OS major version
      (e.g. fedora-toolbox:{{ ansible_facts['distribution_major_version'] }}) which does not
      correspond to any Fedora toolbox image. Add the following to config.yml before
      running 'make container':
        container_image: 'registry.fedoraproject.org/fedora-toolbox:44'
        container_release: '44'
      Replace 44 with the current Fedora major version you want.
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution'] != 'Fedora'
    - container_image is not defined

- name: Skip container setup if no tool available
  ansible.builtin.debug:
    verbosity: 1
    msg: "Neither distrobox nor toolbox found — skipping container setup"
  when: distrobox_tool == 'none'

# Re-check subuid/subgid at task-time: the system role may write /etc/subuid
# and /etc/subgid after Play 1 completes, so any fact gathered before the
# system role ran is stale on first provision. Grep the files directly here
# rather than relying on any cached Play 1 fact.
- name: Re-check subuid entry for current user
  ansible.builtin.command:
    cmd: "grep -q ^{{ ansible_facts['user_id'] }}: /etc/subuid"
  register: distrobox_subuid_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when: distrobox_tool != 'none'

- name: Re-check subgid entry for current user
  ansible.builtin.command:
    cmd: "grep -q ^{{ ansible_facts['user_id'] }}: /etc/subgid"
  register: distrobox_subgid_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when: distrobox_tool != 'none'

- name: Warn if rootless podman prerequisites are missing
  ansible.builtin.debug:
    msg: >-
      subuid/subgid missing for {{ ansible_facts['user_id'] }}.
      Rootless podman will fail. The system role provisions these entries;
      run 'make system' as root to fix, or manually:
      sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 {{ ansible_facts['user_id'] }}
  when:
    - distrobox_tool != 'none'
    - (distrobox_subuid_check.rc != 0) or (distrobox_subgid_check.rc != 0)

- name: Check Podman socket is active  # noqa: command-instead-of-module
  ansible.builtin.command:  # user-scope systemd requires command; service_facts uses system scope
    cmd: systemctl --user is-active podman.socket
  register: distrobox_podman_socket_active
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when: distrobox_tool != 'none'

- name: Warn if Podman socket failed
  ansible.builtin.debug:
    msg: >-
      Podman socket is not active. kind will not work without it.
      Fix: systemctl --user enable --now podman.socket.
      If that fails, check: systemctl --user status podman.socket
  when:
    - distrobox_tool != 'none'
    - distrobox_podman_socket_active.rc != 0

# --- Check if container exists ---
- name: Check if container exists
  ansible.builtin.command:
    argv:
      - podman
      - container
      - exists
      - "{{ distrobox_container_name }}"
  register: distrobox_container_exists
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when: distrobox_tool != 'none'

# --- Distrobox path ---
- name: Ensure distrobox config directory
  ansible.builtin.file:
    path: "{{ distrobox_ini_path | dirname }}"
    state: directory
    mode: "0755"
  when:
    - distrobox_use_distrobox | bool
    - not (fapolicyd_enforcing)

- name: Deploy distrobox.ini
  ansible.builtin.template:
    src: distrobox.ini.j2
    dest: "{{ distrobox_ini_path }}"
    mode: "0644"
  when:
    - distrobox_use_distrobox | bool
    - not (fapolicyd_enforcing)

- name: Mark container unavailable when offline and container does not exist (distrobox path)
  ansible.builtin.set_fact:
    distrobox_tool: "none"
  when:
    - distrobox_use_distrobox | bool
    - not (fapolicyd_enforcing)
    - not (packages_install_binaries | bool)
    - distrobox_container_exists.rc != 0

- name: Create container via Distrobox
  when:
    - distrobox_use_distrobox | bool
    - not (fapolicyd_enforcing)
    - packages_install_binaries | bool
    - distrobox_container_exists.rc != 0 or distrobox_container_replace | bool
  block:
    - name: Create container with distrobox assemble
      ansible.builtin.command:
        cmd: >-
          distrobox assemble create
          {{ '--replace' if distrobox_container_replace | bool else '' }}
          --file {{ distrobox_ini_path }}
      timeout: "{{ distrobox_create_timeout }}"
      register: distrobox_create_result
      changed_when: >-
        'already exists' not in
        (distrobox_create_result.stdout + distrobox_create_result.stderr)
  rescue:
    - name: Record distrobox create failure for CSB report
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: distrobox
        _csb_task_name: "Create dev container via distrobox"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: "Check registry connectivity and disk space; re-run 'make container' once resolved"
        _csb_ticket_summary: "Cannot create distrobox dev container on CSB"
        _csb_ticket_body: >-
          distrobox assemble create failed on a CSB-detected host. The dev
          container is the primary development environment on CSB-managed
          machines. Registry access restrictions or disk space may be the cause.
          Re-run 'make container' once the underlying issue is resolved.
        _csb_ticket_priority: "High"
      when: csb_rhel
    - name: Warn on distrobox assemble create failure (non-CSB)
      ansible.builtin.debug:
        msg: >-
          distrobox assemble create failed — container will not be available.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          Check registry connectivity and available disk space.
          Re-run 'make container' once the issue is resolved.
      when: not csb_rhel
    - name: Mark container unavailable after distrobox failure
      ansible.builtin.set_fact:
        distrobox_tool: "none"

# --- Toolbx path ---
- name: Mark container unavailable when offline and container does not exist (toolbox path)
  ansible.builtin.set_fact:
    distrobox_tool: "none"
  when:
    - distrobox_use_toolbox | bool
    - not (fapolicyd_enforcing)
    - not (packages_install_binaries | bool)
    - distrobox_container_exists.rc != 0

- name: Create container via Toolbx
  when:
    - distrobox_use_toolbox | bool
    - not (fapolicyd_enforcing)
    - packages_install_binaries | bool
    - distrobox_container_exists.rc != 0 or distrobox_container_replace | bool
  block:
    - name: Remove existing Toolbx container for replacement
      ansible.builtin.command:
        cmd: "toolbox rm --force {{ distrobox_container_name }}"
      changed_when: true
      when:
        - distrobox_container_exists.rc == 0
        - distrobox_container_replace | bool

    - name: Create Toolbx container
      ansible.builtin.command:
        cmd: >-
          toolbox create
          --distro {{ container_distro | default('fedora') }}
          --release {{ container_release | default(ansible_facts['distribution_major_version']) }}
          {{ distrobox_container_name }}
      timeout: "{{ distrobox_create_timeout }}"
      register: distrobox_toolbox_create
      changed_when: distrobox_toolbox_create.rc == 0
  rescue:
    - name: Record toolbox create failure for CSB report
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: distrobox
        _csb_task_name: "Create dev container via toolbox"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        _csb_action: "Check registry connectivity and disk space; re-run 'make container' once resolved"
        _csb_ticket_summary: "Cannot create toolbox dev container on CSB"
        _csb_ticket_body: >-
          toolbox create failed on a CSB-detected host. The dev container is
          the primary development environment on CSB-managed machines.
          Registry access restrictions or disk space may be the cause.
          Re-run 'make container' once the underlying issue is resolved.
        _csb_ticket_priority: "High"
      when: csb_rhel
    - name: Warn on toolbox create failure (non-CSB)
      ansible.builtin.debug:
        msg: >-
          toolbox create failed — container will not be available.
          Error: {{ ansible_failed_result.msg | default("unknown") | truncate(200) }}.
          Check registry connectivity and available disk space.
          Re-run 'make container' once the issue is resolved.
      when: not csb_rhel
    - name: Mark container unavailable after toolbox failure
      ansible.builtin.set_fact:
        distrobox_tool: "none"

# --- Start and register for Play 3 ---
- name: Check if container is running
  ansible.builtin.command:
    argv:
      - podman
      - inspect
      - --format
      - "{% raw %}{{.State.Running}}{% endraw %}"
      - "{{ distrobox_container_name }}"
  register: distrobox_running
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when: distrobox_tool != 'none'

- name: Start container
  ansible.builtin.command:
    cmd: "podman start {{ distrobox_container_name }}"
  register: distrobox_start_result
  changed_when: distrobox_start_result.rc == 0
  failed_when: false
  when:
    - distrobox_tool != 'none'
    - (distrobox_running.stdout | default('') | trim | lower) != 'true'

- name: Warn if container start failed
  ansible.builtin.debug:
    msg: >-
      podman start {{ distrobox_container_name }} failed (rc={{ distrobox_start_result.rc | default('') }}).
      Container provisioning (Play 3) may be skipped.
      Check: podman logs {{ distrobox_container_name }}
  when:
    - distrobox_tool != 'none'
    - distrobox_start_result.rc | default(0) != 0

- name: Detect Python inside container
  ansible.builtin.command:
    cmd: >-
      podman exec {{ distrobox_container_name }}
      sh -c 'command -v python3 || command -v python'
  register: distrobox_python
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when: distrobox_tool != 'none'

- name: Register container as Ansible host for Play 3
  ansible.builtin.add_host:
    name: "{{ distrobox_container_name }}"
    groups: containers
    ansible_connection: containers.podman.podman
    ansible_host: "{{ distrobox_container_name }}"
    ansible_python_interpreter: "{{ distrobox_python.stdout | trim }}"
    distrobox_packages: "{{ distrobox_packages }}"
    distrobox_host_exec_commands: "{{ distrobox_host_exec_commands }}"
    distrobox_oc_version: "{{ distrobox_oc_version }}"
    distrobox_golangci_lint_version: "{{ distrobox_golangci_lint_version }}"
    distrobox_subctl_version: "{{ distrobox_subctl_version }}"
    distrobox_oc_fetch_timeout: "{{ distrobox_oc_fetch_timeout }}"
    distrobox_oc_fetch_retries: "{{ distrobox_oc_fetch_retries }}"
    distrobox_oc_fetch_delay: "{{ distrobox_oc_fetch_delay }}"
    distrobox_oc_mirror_url: "{{ distrobox_oc_mirror_url }}"
  when:
    - distrobox_tool != 'none'
    - distrobox_python.rc == 0

- name: Warn if Python not found in container
  ansible.builtin.debug:
    msg: >-
      Python not found inside {{ distrobox_container_name }}.
      Container provisioning (Play 3) will be skipped.
  when:
    - distrobox_tool != 'none'
    - distrobox_python.rc != 0
