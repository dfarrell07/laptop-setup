---
distrobox_container_name: "{{ container_name | default('fedora-dev') }}"
distrobox_container_image: "{{ container_image | default('registry.fedoraproject.org/fedora-toolbox:44') }}"
distrobox_container_replace: "{{ container_replace | default(false) }}"

distrobox_ini_path: "{{ ansible_user_dir }}/.config/distrobox/distrobox.ini"

distrobox_packages:
  - git
  - vim
  - tmux
  - zsh
  - fzf
  - direnv
  - jq
  - curl
  - wget
  - tar
  - unzip
  - gcc
  - gcc-c++
  - clang
  - make
  - cmake
  - autoconf
  - automake
  - libtool
  - golang
  - rust    # bpfman MSRV 1.85.0; Fedora 44 ships 1.97.1 (stable, no nightly features needed)
  - cargo   # Rust package manager (companion to rust package)
  - protobuf-compiler  # protoc — hard bpfman build requirement (tonic/prost gRPC code generation)
  - pkgconf-pkg-config  # pkg-config — Rust build scripts for libbpf and openssl use it
  - python3
  - python3-pip
  - python3-devel
  - nodejs
  - npm
  - openssl-devel
  - libffi-devel
  - zlib-devel
  - ShellCheck
  - yamllint
  - ripgrep
  - fd-find
  - buildah
  - skopeo
  - zoxide
  - shfmt
  - procps-ng
  - findutils
  - which
  - hostname
  - bash-completion
  - tcpdump
  - wireshark-cli  # tshark — scripting-safe CLI capture for OVN-K/bpfman traffic analysis
  - iproute
  - iproute-tc  # tc split from iproute on Fedora 38+; required for OVS/eBPF traffic control
  - nmap-ncat
  - bind-utils
  - traceroute
  - mtr
  - nftables
  - ethtool
  - conntrack-tools
  - socat
  - iperf3
  - strace
  - bpftool  # eBPF program/map introspection (essential for bpfman development)
  - libbpf-devel  # eBPF development headers
  - llvm  # complements clang for eBPF bytecode compilation
  - gh
  - gitleaks
  - ovn
  - openvswitch

distrobox_host_exec_commands:
  - podman
  - docker
  - flatpak

distrobox_exports:
  - /usr/bin/jq
  - /usr/bin/vim

# Binary versions for container provisioning (Play 3)
# Reference packages_oc_version so host and container stay in sync.
distrobox_oc_version: "{{ packages_oc_version | default('4.22.6') }}"
distrobox_golangci_lint_version: "v2.12.2"
