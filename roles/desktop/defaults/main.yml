---
desktop_environment: auto  # auto, sway, i3, gnome

desktop_alacritty_font_family: DejaVu Sans Mono
desktop_alacritty_font_size: 12.0
desktop_wm_font_family: DejaVu Sans Mono
desktop_wm_font_size: 10
desktop_terminal: alacritty

desktop_sway_hidpi_scale: "1.0"  # ThinkPad P16v 2560x1600: set 1.5 in config.yml; check with: swaymsg -t get_outputs
desktop_sway_cursor_theme: Adwaita  # cursor theme; propagated to seat config and XCURSOR_THEME for XWayland apps
desktop_sway_cursor_size: 24     # cursor size in physical pixels; propagated to both seat config and XCURSOR_SIZE for XWayland apps
desktop_sway_libva_driver: radeonsi  # VA-API driver for hardware video decode: radeonsi (AMD), iHD (Intel), auto (let driver detect)
desktop_sway_vdpau_driver: radeonsi  # VDPAU driver: radeonsi (AMD), va_gl (Intel via libva), nvidia (NVIDIA proprietary)
desktop_sway_idle_lock_timeout: 300   # seconds of idle before swaylock activates
desktop_sway_idle_display_timeout: 600  # seconds of idle before display powers off
desktop_sway_lock_color: "000000"     # swaylock background color (hex, no #)
desktop_sway_keyboard_layout: us     # XKB keyboard layout
desktop_sway_repeat_delay: 200       # ms before key repeat starts (lower = snappier)
desktop_sway_repeat_rate: 50         # key repeats per second after delay
desktop_sway_browser: firefox  # browser executable for $mod+Shift+b keybinding
desktop_i3status_battery_num: 0  # battery device number; ThinkPad: typically 0 (BAT0)
desktop_gtk_theme: Adwaita-dark  # GTK theme for Sway (no GNOME settings daemon; written to gtk-3.0/gtk-4.0 settings.ini)
desktop_gtk_icon_theme: Adwaita  # GTK icon theme for Sway

# AMD k10temp PCI path for i3status CPU temperature block.
# k10temp hwmon index on ThinkPad P16v Gen 1 AMD. hwmon index varies by machine/kernel; verify with:
# ls /sys/devices/pci0000:00/0000:00:18.3/hwmon/hwmon*/temp1_input
desktop_i3status_cpu_temp_path: "/sys/devices/pci0000:00/0000:00:18.3/hwmon/hwmon8/temp1_input"
desktop_sway_output: "eDP-1"  # built-in display identifier (AMD ThinkPad)
desktop_sway_adaptive_sync: "enabled"  # VRR/FreeSync; silently ignored on non-VRR displays; set "disabled" to suppress
desktop_sway_xwayland: "enable"  # set "disable" for pure-Wayland sessions (breaks XWayland-only apps)
desktop_sway_polkit_agent: "/usr/libexec/lxqt-policykit-agent"  # Fedora path; Debian: /usr/bin/lxqt-policykit-agent
# Workspace-to-output assignments for multi-monitor setups; empty = no assignments written.
# Example (config.yml):
#   desktop_sway_workspace_outputs:
#     - { workspace: 1, output: eDP-1 }
#     - { workspace: 2, output: HDMI-A-1 }
# Find output names with: swaymsg -t get_outputs | grep name
desktop_sway_workspace_outputs: []

# TrackPoint scroll device identifier (intentionally undefined — no TrackPoint config
# applied unless set). Find with: swaymsg -t get_inputs | grep -A2 TrackPoint
# Example: desktop_sway_trackpoint_id: "2:10:TPPS/2_IBM_TrackPoint"
desktop_sway_trackpoint_accel_profile: flat  # flat avoids libinput adaptive curve that makes TrackPoint erratic
desktop_sway_trackpoint_pointer_accel: "-0.5"  # negative = slower; tune between -0.4 and -0.6 for ThinkPads

# TrackPoint libinput config for X11/i3 (/etc/X11/xorg.conf.d/90-trackpoint.conf).
# Intentionally undefined — no xorg.conf.d file written unless set.
# Find device name with: xinput list | grep -i trackpoint
# Example: desktop_i3_trackpoint_id: "TPPS/2 IBM TrackPoint"
desktop_i3_trackpoint_accel_profile: flat
desktop_i3_trackpoint_pointer_accel: "-0.5"

desktop_sway_packages:
  - sway
  - swayidle
  - swaylock
  - swaybg
  - wofi
  - grim
  - slurp
  - brightnessctl
  - i3status
  - mako
  - lxqt-policykit  # polkit-gnome removed from Fedora 41+; Qt6 Wayland-native polkit agent (binary: /usr/libexec/lxqt-policykit-agent)
  - network-manager-applet
  - xdg-desktop-portal
  - xdg-desktop-portal-wlr
  - xdg-desktop-portal-gtk
  - wireplumber
  - wdisplays
  - pulseaudio-utils  # provides pactl for audio keybindings and i3status volume display
  - wl-clipboard      # wl-copy/wl-paste — essential for clipboard in Wayland terminal workflows
  - cliphist          # clipboard history manager for Wayland (clipboard dies with source app without it)
  - playerctl         # media key control (play/pause/next/prev via sway keybindings)
  - pavucontrol       # PulseAudio/PipeWire volume GUI

desktop_i3_packages:
  - i3
  - i3status   # i3status-rust is not in Fedora repos; install via COPR or cargo
  - i3lock
  - dmenu
  - pulseaudio-utils  # provides pactl for audio keybindings and i3status volume display
  - xss-lock
  - autorandr
  - brightnessctl
  - playerctl
  - network-manager-applet
  - lxpolkit  # polkit-gnome removed from Fedora 41+; lxpolkit is the lightweight graphical polkit agent
  - arandr
  - dunst
  - scrot
  - xautolock
  - xset          # X11 DPMS + keyboard repeat rate (used in i3 config autostart)
  - clipit        # X11 clipboard manager daemon — persists clipboard content after app close; clipit -n runs headless
  - wireplumber   # WirePlumber session manager — required for wpctl (audio volume keybindings via XF86Audio*)
  - pavucontrol   # PulseAudio/PipeWire volume GUI

desktop_gnome_packages:
  - gnome-tweaks
  - gnome-extensions-app
  - dconf-editor

desktop_common_packages:
  - alacritty
  - vim-X11  # gvim was renamed to vim-X11 in Fedora 41+
  - dejavu-sans-mono-fonts
  - terminus-fonts
  - gnome-keyring
  - meld  # GTK graphical diff/merge tool; requires display session

desktop_apt_packages:
  - alacritty
  - vim-gtk3
  - fonts-dejavu-core
  - fonts-terminus
  - gnome-keyring
  - wl-clipboard  # wl-copy for tmux copy-pipe on Wayland (desktop-conditional, mirrors Fedora pattern)
  - meld  # GTK graphical diff/merge tool; requires display session

desktop_deploy_chrome_policies: false

# Alacritty terminal color scheme — Catppuccin Mocha defaults; override any key in config.yml
desktop_alacritty_color_bg: "#1e1e2e"
desktop_alacritty_color_fg: "#cdd6f4"
desktop_alacritty_color_normal_black: "#45475a"
desktop_alacritty_color_normal_red: "#f38ba8"
desktop_alacritty_color_normal_green: "#a6e3a1"
desktop_alacritty_color_normal_yellow: "#f9e2af"
desktop_alacritty_color_normal_blue: "#89b4fa"
desktop_alacritty_color_normal_magenta: "#cba6f7"
desktop_alacritty_color_normal_cyan: "#89dceb"
desktop_alacritty_color_normal_white: "#bac2de"
desktop_alacritty_color_bright_black: "#585b70"
desktop_alacritty_color_bright_red: "#f38ba8"
desktop_alacritty_color_bright_green: "#a6e3a1"
desktop_alacritty_color_bright_yellow: "#f9e2af"
desktop_alacritty_color_bright_blue: "#89b4fa"
desktop_alacritty_color_bright_magenta: "#cba6f7"
desktop_alacritty_color_bright_cyan: "#89dceb"
desktop_alacritty_color_bright_white: "#a6adc8"

# Bar theme colors — Catppuccin Mocha defaults; override any key in config.yml
desktop_bar_bg: "#1e1e2e"
desktop_bar_fg: "#cdd6f4"
desktop_bar_separator: "#585b70"
desktop_bar_focused_ws_bg: "#89b4fa"
desktop_bar_focused_ws_text: "#1e1e2e"
desktop_bar_active_ws_bg: "#313244"
desktop_bar_active_ws_text: "#cdd6f4"
desktop_bar_inactive_ws_bg: "#1e1e2e"
desktop_bar_inactive_ws_text: "#6c7086"
desktop_bar_urgent_ws_bg: "#f38ba8"
desktop_bar_urgent_ws_text: "#1e1e2e"
desktop_bar_binding_mode_bg: "#cba6f7"
desktop_bar_binding_mode_text: "#1e1e2e"

desktop_macos_defaults:
  - domain: NSGlobalDomain
    key: KeyRepeat
    type: int
    value: 2
  - domain: NSGlobalDomain
    key: InitialKeyRepeat
    type: int
    value: 15
  - domain: NSGlobalDomain
    key: NSAutomaticQuoteSubstitutionEnabled
    type: bool
    value: false
  - domain: NSGlobalDomain
    key: NSAutomaticDashSubstitutionEnabled
    type: bool
    value: false
  - domain: com.apple.finder
    key: AppleShowAllExtensions
    type: bool
    value: true
  - domain: com.apple.finder
    key: _FXShowPosixPathInTitle
    type: bool
    value: true
  - domain: com.apple.screencapture
    key: location
    type: string
    value: "{{ ansible_facts['user_dir'] }}/Downloads"
