---
# roles/desktop/tasks/main.yml
# Desktop environment: Sway/GNOME/i3 (Linux), AeroSpace (macOS), Alacritty, fonts.

- name: Detect desktop environment
  ansible.builtin.set_fact:
    desktop_detected: >-
      {{ 'sway' if (ansible_facts['env']['XDG_SESSION_TYPE'] | default('') == 'wayland' and
                    ansible_facts['env']['XDG_CURRENT_DESKTOP'] | default('') == 'sway')
         else ('gnome' if (ansible_facts['env']['XDG_CURRENT_DESKTOP'] | default('') is search('GNOME'))
         else ('i3' if (ansible_facts['env']['XDG_CURRENT_DESKTOP'] | default('') == 'i3')
         else 'unknown')) }}
  when: desktop_environment == 'auto'

- name: Set effective desktop
  ansible.builtin.set_fact:
    desktop_effective: "{{ desktop_environment if desktop_environment != 'auto' else desktop_detected | default('unknown') }}"

- name: Warn when desktop_environment explicitly set to unknown
  ansible.builtin.debug:
    msg: >-
      desktop_environment is set to 'unknown' — no WM packages will be installed.
      Set desktop_environment: sway, i3, or gnome in config.yml if a WM is needed.
  when: desktop_effective == 'unknown' and desktop_environment != 'auto'

- name: Fail when auto-detection falls through to unknown on Linux
  ansible.builtin.fail:
    msg: >-
      desktop_environment is 'auto' but no desktop session was detected
      (XDG_SESSION_TYPE='{{ ansible_facts['env']['XDG_SESSION_TYPE'] | default('') }}',
      XDG_CURRENT_DESKTOP='{{ ansible_facts['env']['XDG_CURRENT_DESKTOP'] | default('') }}').
      Set desktop_environment: sway, i3, or gnome in config.yml before running
      make all — auto-detection requires an active desktop session and will not
      work on bare installs or remote SSH provisioning.
  when:
    - desktop_effective == 'unknown'
    - desktop_environment == 'auto'
    - ansible_facts['system'] == 'Linux'

- name: Install common desktop packages
  ansible.builtin.dnf:
    name: "{{ desktop_common_packages }}"
    state: present
  become: true
  tags: [become]
  when: ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']

- name: Install Sway packages
  ansible.builtin.dnf:
    name: "{{ desktop_sway_packages }}"
    state: present
  become: true
  tags: [become]
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - desktop_effective == 'sway'

- name: Install i3 packages
  ansible.builtin.dnf:
    name: "{{ desktop_i3_packages }}"
    state: present
  become: true
  tags: [become]
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - desktop_effective == 'i3'

- name: Install GNOME packages
  ansible.builtin.dnf:
    name: "{{ desktop_gnome_packages }}"
    state: present
  become: true
  tags: [become]
  when:
    - ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
    - desktop_effective == 'gnome'

- name: Install desktop packages (apt)
  when: ansible_facts['pkg_mgr'] == 'apt'
  block:
    - name: Install desktop packages (apt)
      ansible.builtin.apt:
        name: "{{ desktop_apt_packages }}"
        state: present
        update_cache: true
      become: true
      tags: [become]
  rescue:
    - name: Warn apt desktop package install failed
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install desktop packages in role desktop.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing repo access.
          Continuing playbook execution.

- name: Install Sway packages (apt)
  when:
    - ansible_facts['pkg_mgr'] == 'apt'
    - desktop_effective == 'sway'
  block:
    - name: Install Sway packages (apt)
      ansible.builtin.apt:
        name: "{{ desktop_sway_apt_packages }}"
        state: present
      become: true
      tags: [become]
  rescue:
    - name: Warn apt Sway package install failed
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install Sway packages in role desktop.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing repo access.
          Continuing playbook execution.

# --- Alacritty config ---
- name: Ensure Alacritty config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/alacritty"
    state: directory
    mode: "0755"

- name: Deploy Alacritty config
  ansible.builtin.template:
    src: alacritty.toml.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/alacritty/alacritty.toml"
    mode: "0644"

# --- i3 config ---
- name: Deploy i3 configuration
  when: desktop_effective == 'i3'
  block:
    - name: Ensure i3 config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/i3"
        state: directory
        mode: "0755"

    - name: Deploy i3 config
      ansible.builtin.template:
        src: i3.config.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/i3/config"
        mode: "0644"

# --- i3 TrackPoint config (X11 persistent, via xorg.conf.d) ---
- name: Ensure /etc/X11/xorg.conf.d exists (i3 TrackPoint)
  ansible.builtin.file:
    path: /etc/X11/xorg.conf.d
    state: directory
    mode: "0755"
  become: true
  tags: [become]
  when:
    - desktop_effective == 'i3'
    - desktop_i3_trackpoint_id is defined
    - desktop_i3_trackpoint_id

- name: Deploy TrackPoint libinput config (i3/X11)
  ansible.builtin.template:
    src: xorg-trackpoint.conf.j2
    dest: /etc/X11/xorg.conf.d/90-trackpoint.conf
    mode: "0644"
  become: true
  tags: [become]
  when:
    - desktop_effective == 'i3'
    - desktop_i3_trackpoint_id is defined
    - desktop_i3_trackpoint_id

# --- Sway config ---
- name: Ensure Pictures directory exists for screenshots
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Pictures"
    state: directory
    mode: "0755"
  when: desktop_effective in ['sway', 'i3']

- name: Override polkit agent path on Debian (lxqt-policykit installs to /usr/bin, not /usr/libexec)
  ansible.builtin.set_fact:
    desktop_sway_polkit_agent: /usr/bin/lxqt-policykit-agent
  when:
    - ansible_facts['pkg_mgr'] == 'apt'
    - desktop_effective == 'sway'

- name: Deploy Sway configuration and GTK settings
  when: desktop_effective == 'sway'
  block:
    - name: Ensure Sway config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/sway"
        state: directory
        mode: "0755"

    - name: Deploy Sway config
      ansible.builtin.template:
        src: sway.config.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/sway/config"
        mode: "0644"

    - name: Ensure swaylock config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/swaylock"
        state: directory
        mode: "0755"

    - name: Deploy swaylock config (show-failed-attempts, indicator-caps-lock)
      ansible.builtin.template:
        src: swaylock.config.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/swaylock/config"
        mode: "0644"

    - name: Ensure xdg-desktop-portal config directory (Sway)
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/xdg-desktop-portal"
        state: directory
        mode: "0755"

    - name: Deploy xdg-desktop-portal portals.conf (Sway screen sharing)
      ansible.builtin.copy:
        dest: "{{ ansible_facts['user_dir'] }}/.config/xdg-desktop-portal/portals.conf"
        mode: "0644"
        content: |
          # {{ ansible_managed }}
          [preferred]
          default=gtk
          org.freedesktop.impl.portal.Screenshot=wlr
          org.freedesktop.impl.portal.ScreenCast=wlr

    # GTK settings.ini (Sway: no GNOME settings daemon; GTK reads files directly)
    - name: Ensure GTK config directories (Sway)
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/{{ item }}"
        state: directory
        mode: "0755"
      loop: [gtk-3.0, gtk-4.0]

    - name: Deploy GTK settings (Sway)
      ansible.builtin.template:
        src: gtk-settings.ini.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/{{ item }}/settings.ini"
        mode: "0644"
        force: false
      loop: [gtk-3.0, gtk-4.0]

- name: Deploy TERMINAL environment.d config (Sway)
  ansible.builtin.copy:
    content: "TERMINAL={{ desktop_terminal }}\n"
    dest: "{{ ansible_facts['user_dir'] }}/.config/environment.d/terminal.conf"
    mode: "0644"
    backup: true
  when:
    - ansible_facts['system'] == 'Linux'
    - desktop_effective == 'sway'

- name: Set GTK dark color-scheme via dconf (xdg-desktop-portal-gtk)
  community.general.dconf:
    key: /org/gnome/desktop/interface/color-scheme
    value: "'prefer-dark'"
  failed_when: false
  when:
    - ansible_facts['system'] == 'Linux'
    - desktop_effective == 'sway'

# --- i3status config (shared by i3 and Sway) ---
- name: Ensure i3status config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/i3status"
    state: directory
    mode: "0755"
  when: desktop_effective in ['i3', 'sway']

- name: Deploy i3status config
  ansible.builtin.template:
    src: i3status.conf.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/i3status/config"
    mode: "0644"
  when: desktop_effective in ['i3', 'sway']

# --- Chrome managed policies ---
- name: Check for CSB-managed Chrome policies
  ansible.builtin.stat:
    path: /etc/opt/chrome/policies/managed/csb-chrome-policies.json
  register: desktop_csb_chrome
  when:
    - desktop_deploy_chrome_policies
    - ansible_facts['system'] == 'Linux'

- name: Chrome and Chromium managed policies
  when:
    - desktop_deploy_chrome_policies
    - ansible_facts['system'] == 'Linux'
    - not (desktop_csb_chrome.stat.exists | default(false))
  block:
    - name: Create Chrome managed policies directory
      ansible.builtin.file:
        path: /etc/opt/chrome/policies/managed
        state: directory
        mode: "0755"
      become: true
      tags: [become]

    - name: Deploy Chrome security policy
      ansible.builtin.copy:
        src: chrome-security-policy.json
        dest: /etc/opt/chrome/policies/managed/security.json
        mode: "0644"
        validate: "python3 -c \"import json; json.load(open('%s'))\""
      become: true
      tags: [become]

    - name: Create Chromium managed policies directory
      ansible.builtin.file:
        path: /etc/chromium/policies/managed
        state: directory
        mode: "0755"
      become: true
      tags: [become]

    - name: Deploy Chromium security policy
      ansible.builtin.copy:
        src: chrome-security-policy.json
        dest: /etc/chromium/policies/managed/security.json
        mode: "0644"
        validate: "python3 -c \"import json; json.load(open('%s'))\""
      become: true
      tags: [become]

# --- Shell ---
- name: Set zsh as default shell
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /bin/zsh
  become: true
  tags: [become]
  when:
    - ansible_facts['system'] == 'Linux'
    - ansible_facts['user_shell'] != '/bin/zsh'

# --- macOS: AeroSpace config ---
- name: Ensure AeroSpace config directory (macOS)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/aerospace"
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == 'Darwin'

- name: Deploy AeroSpace config (macOS)
  ansible.builtin.copy:
    src: aerospace.toml
    dest: "{{ ansible_facts['user_dir'] }}/.config/aerospace/aerospace.toml"
    mode: "0644"
  when: ansible_facts['os_family'] == 'Darwin'

# --- macOS: defaults ---
- name: Set macOS defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
  loop: "{{ desktop_macos_defaults }}"
  loop_control:
    label: "{{ item.domain }} {{ item.key }}"
  when: ansible_facts['os_family'] == 'Darwin'

# --- macOS: firewall ---
- name: Check macOS firewall state
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate
  register: _fw_state
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  become: true
  tags: [become]
  when: ansible_facts['os_family'] == 'Darwin'
  failed_when: false

- name: Enable macOS firewall
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on
  register: _fw_enable_result
  changed_when: _fw_enable_result.rc == 0
  become: true
  tags: [become]
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - "'State = 1' not in (_fw_state.stdout | default(''))"
  failed_when: false

- name: Warn if macOS firewall enable failed
  ansible.builtin.debug:
    msg: "WARNING: socketfilterfw --setglobalstate on exited {{ _fw_enable_result.rc }} — application firewall may still be off"
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - _fw_enable_result.rc | default(0) != 0

- name: Check macOS firewall stealth mode state
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --getstealthmode
  register: _fw_stealth
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  become: true
  tags: [become]
  when: ansible_facts['os_family'] == 'Darwin'
  failed_when: false

- name: Enable macOS firewall stealth mode
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on
  register: _fw_stealth_enable_result
  changed_when: _fw_stealth_enable_result.rc == 0
  become: true
  tags: [become]
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - "'Stealth Mode = 1' not in (_fw_stealth.stdout | default(''))"
  failed_when: false

- name: Warn if macOS firewall stealth mode enable failed
  ansible.builtin.debug:
    msg: "WARNING: socketfilterfw --setstealthmode on exited {{ _fw_stealth_enable_result.rc }} — firewall stealth mode may still be off"
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - _fw_stealth_enable_result.rc | default(0) != 0

# --- GNOME hardening (Linux only, GNOME desktops) ---
- name: Check if GNOME is installed
  ansible.builtin.command:
    cmd: gnome-shell --version
  register: desktop_gnome_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  when:
    - ansible_facts['system'] == 'Linux'
    - desktop_effective == 'gnome'

- name: GNOME hardening dconf settings
  when:
    - ansible_facts['system'] == 'Linux'
    - desktop_effective == 'gnome'
    - desktop_gnome_check.rc == 0
  block:
    - name: Apply GNOME hardening dconf settings
      community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
      loop: "{{ desktop_gnome_hardening_dconf }}"
      loop_control:
        label: "{{ item.key }}"
      failed_when: false
