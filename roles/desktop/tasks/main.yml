---
# roles/desktop/tasks/main.yml
# Desktop environment: Sway/GNOME/i3 (Linux), AeroSpace (macOS), Alacritty, fonts.

- name: Set effective desktop
  ansible.builtin.set_fact:
    desktop_effective: >-
      {{ desktop_environment if desktop_environment != 'auto'
         else ('sway' if (ansible_facts['env']['XDG_SESSION_TYPE'] | default('') == 'wayland' and
                          ansible_facts['env']['XDG_CURRENT_DESKTOP'] | default('') == 'sway')
               else ('gnome' if (ansible_facts['env']['XDG_CURRENT_DESKTOP'] | default('') is search('GNOME'))
               else ('i3' if (ansible_facts['env']['XDG_CURRENT_DESKTOP'] | default('') == 'i3')
               else 'unknown'))) }}

- name: Warn when desktop_environment explicitly set to unknown
  ansible.builtin.debug:
    msg: >-
      desktop_environment is set to 'unknown' — no WM packages will be installed.
      Set desktop_environment: sway, i3, or gnome in config.yml if a WM is needed.
  when:
    - desktop_effective == 'unknown'
    - desktop_environment != 'auto'

- name: Fail when auto-detection falls through to unknown on Linux
  ansible.builtin.fail:
    msg: >-
      desktop_environment is 'auto' but no desktop session was detected
      (XDG_SESSION_TYPE='{{ ansible_facts['env']['XDG_SESSION_TYPE'] | default('') }}',
      XDG_CURRENT_DESKTOP='{{ ansible_facts['env']['XDG_CURRENT_DESKTOP'] | default('') }}').
      Set desktop_environment: sway, i3, or gnome in config.yml before running
      make all — auto-detection requires an active desktop session and will not
      work on bare installs or remote SSH provisioning.
  when:
    - desktop_effective == 'unknown'
    - desktop_environment == 'auto'
    - is_linux

- name: Assert display timeout is greater than lock timeout
  ansible.builtin.assert:
    that: desktop_wm_idle_display_timeout | int > desktop_wm_idle_lock_timeout | int
    fail_msg: >-
      desktop_wm_idle_display_timeout ({{ desktop_wm_idle_display_timeout }}s) must be greater
      than desktop_wm_idle_lock_timeout ({{ desktop_wm_idle_lock_timeout }}s). If the display
      powers off before the screen locks, the resume handler will wake the display and expose
      an unlocked desktop. Set display_timeout > lock_timeout in config.yml.
  when: desktop_effective in ['sway', 'i3']

- name: Install desktop packages (dnf)
  vars:
    _wm_pkgs: >-
      {{ (desktop_sway_packages if desktop_effective == 'sway' else [])
         + (desktop_i3_packages if desktop_effective == 'i3' else [])
         + (desktop_gnome_packages if desktop_effective == 'gnome' else []) }}
  ansible.builtin.dnf:
    name: "{{ desktop_dnf_packages + _wm_pkgs }}"
    state: present
  become: true
  tags: [become]
  when: is_dnf

- name: Install desktop packages (apt)
  vars:
    _apt_wm_pkgs: "{{ desktop_sway_apt_packages if desktop_effective == 'sway' else [] }}"
  ansible.builtin.apt:
    name: "{{ desktop_apt_packages + _apt_wm_pkgs }}"
    state: present
    update_cache: true
  become: true
  tags: [become]
  when: is_apt

# --- Alacritty config ---
- when: desktop_terminal == 'alacritty'
  block:
    - name: Ensure Alacritty config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/alacritty"
        state: directory
        mode: "0755"

    - name: Deploy Alacritty config
      ansible.builtin.template:
        src: alacritty.toml.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/alacritty/alacritty.toml"
        mode: "0644"

# --- i3 config ---
- name: Deploy i3 configuration
  when: desktop_effective == 'i3'
  block:
    - name: Ensure i3 config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/i3"
        state: directory
        mode: "0755"

    - name: Deploy i3 config
      ansible.builtin.template:
        src: i3.config.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/i3/config"
        mode: "0644"

# --- i3 TrackPoint config (X11 persistent, via xorg.conf.d) ---
- name: TrackPoint config for i3 (X11, xorg.conf.d)
  when:
    - desktop_effective == 'i3'
    - desktop_i3_trackpoint_id | length > 0
  become: true
  tags: [become]
  block:
    - name: Ensure /etc/X11/xorg.conf.d exists (i3 TrackPoint)
      ansible.builtin.file:
        path: /etc/X11/xorg.conf.d
        state: directory
        mode: "0755"

    - name: Deploy TrackPoint libinput config (i3/X11)
      ansible.builtin.template:
        src: xorg-trackpoint.conf.j2
        dest: /etc/X11/xorg.conf.d/90-trackpoint.conf
        mode: "0644"

# --- Sway config ---
- name: Ensure Pictures directory exists for screenshots
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Pictures"
    state: directory
    mode: "0755"
  when: desktop_effective in ['sway', 'i3']

- name: Deploy Sway configuration and GTK settings
  when: desktop_effective == 'sway'
  block:
    - name: Ensure Sway config directories
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/{{ item }}"
        state: directory
        mode: "0755"
      loop: [sway, swaylock, xdg-desktop-portal, gtk-3.0, gtk-4.0]

    - name: Deploy Sway config
      ansible.builtin.template:
        src: sway.config.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/sway/config"
        mode: "0644"

    - name: Deploy swaylock config (show-failed-attempts, indicator-caps-lock)
      ansible.builtin.template:
        src: swaylock.config.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/swaylock/config"
        mode: "0644"

    - name: Deploy xdg-desktop-portal portals.conf (Sway screen sharing)
      ansible.builtin.copy:
        dest: "{{ ansible_facts['user_dir'] }}/.config/xdg-desktop-portal/portals.conf"
        mode: "0644"
        content: |
          # {{ ansible_managed }}
          [preferred]
          default=gtk
          org.freedesktop.impl.portal.Screenshot=wlr
          org.freedesktop.impl.portal.ScreenCast=wlr

    # GTK settings.ini (Sway: no GNOME settings daemon; GTK reads files directly)
    - name: Deploy GTK settings (Sway)
      ansible.builtin.template:
        src: gtk-settings.ini.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/{{ item }}/settings.ini"
        mode: "0644"
      loop: [gtk-3.0, gtk-4.0]

    - name: Set GTK dark color-scheme via dconf (xdg-desktop-portal-gtk)
      community.general.dconf:
        key: /org/gnome/desktop/interface/color-scheme
        value: "'prefer-dark'"
      register: _desktop_dconf_dark
      ignore_errors: true

    - name: Warn if GTK dark color-scheme dconf write failed
      ansible.builtin.debug:
        msg: >-
          WARNING: dconf write for color-scheme failed (dbus/dconf unavailable?).
          GTK3/4 direct reads use settings.ini; portal-querying GTK4 apps may not see dark theme.
      when: _desktop_dconf_dark.failed | default(false)

- name: Deploy TERMINAL environment.d config (Sway/i3)
  ansible.builtin.copy:
    content: "TERMINAL={{ desktop_terminal }}\n"
    dest: "{{ ansible_facts['user_dir'] }}/.config/environment.d/terminal.conf"
    mode: "0644"
  when:
    - is_linux
    - desktop_effective in ['sway', 'i3']
    - not system_is_container  # ~/.config/environment.d not created in containers (common task guards it)

# --- i3status config (shared by i3 and Sway) ---
- name: Deploy i3status config (shared by i3 and Sway)
  when: desktop_effective in ['i3', 'sway']
  block:
    - name: Ensure i3status config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/i3status"
        state: directory
        mode: "0755"

    - name: Deploy i3status config
      ansible.builtin.template:
        src: i3status.conf.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/i3status/config"
        mode: "0644"

# --- Chrome managed policies ---
- name: Chrome and Chromium managed policies
  when:
    - desktop_deploy_chrome_policies
    - is_linux
    - not system_is_container
  block:
    - name: Stat CSB Chrome managed policy file
      ansible.builtin.stat:
        path: /etc/opt/chrome/policies/managed/csb-chrome-policies.json
      register: desktop_csb_chrome

    - when: not desktop_csb_chrome.stat.exists
      become: true
      tags: [become]
      block:
        - name: Create managed policies directory
          ansible.builtin.file:
            path: "{{ item }}/policies/managed"
            state: directory
            mode: "0755"
          loop:
            - /etc/opt/chrome
            - /etc/chromium

        - name: Deploy security policy
          ansible.builtin.copy:
            src: chrome-security-policy.json
            dest: "{{ item }}/policies/managed/security.json"
            mode: "0644"
          loop:
            - /etc/opt/chrome
            - /etc/chromium

# --- Shell ---
- name: Set zsh as default shell
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /bin/zsh
  become: true
  tags: [become]
  when: is_linux

# --- macOS: AeroSpace config ---
- name: Ensure AeroSpace config directory (macOS)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/aerospace"
    state: directory
    mode: "0755"
  when: is_macos

- name: Deploy AeroSpace config (macOS)
  ansible.builtin.copy:
    src: aerospace.toml
    dest: "{{ ansible_facts['user_dir'] }}/.config/aerospace/aerospace.toml"
    mode: "0644"
    force: false
  when: is_macos

# --- macOS: defaults ---
- name: Set macOS defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
  loop: "{{ desktop_macos_defaults }}"
  loop_control:
    label: "{{ item.domain }} {{ item.key }}"
  when: is_macos

# --- macOS: firewall ---
- name: Check macOS firewall settings
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw {{ item.check_cmd }}
  register: _fw_check_results
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  become: true
  tags: [become]
  when: is_macos
  failed_when: false
  timeout: 30
  loop: "{{ desktop_macos_firewall_settings }}"
  loop_control:
    label: "{{ item.name }}"

- name: Enable macOS firewall settings
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw {{ item.set_cmd }}
  register: _fw_enable_results
  changed_when: _fw_enable_results.rc == 0
  become: true
  tags: [become]
  when:
    - is_macos
    - item.match_str not in (_fw_check_results.results[ansible_loop.index0].stdout | default(''))
  failed_when: false
  timeout: 30
  loop: "{{ desktop_macos_firewall_settings }}"
  loop_control:
    label: "{{ item.name }}"
    extended: true

- name: Warn if macOS firewall settings enable failed
  ansible.builtin.debug:
    msg: >-
      WARNING: socketfilterfw {{ item.set_cmd }} exited {{ _fw_enable_results.results[ansible_loop.index0].rc | default(0) }}
      — {{ item.name }} firewall setting may still be off
  when:
    - is_macos
    - _fw_enable_results.results[ansible_loop.index0].rc | default(0) != 0
  loop: "{{ desktop_macos_firewall_settings }}"
  loop_control:
    label: "{{ item.name }}"
    extended: true

# --- GNOME hardening (Linux only, GNOME desktops) ---
- name: GNOME hardening dconf settings
  when:
    - is_linux
    - desktop_effective == 'gnome'
  block:
    - name: Apply GNOME dconf settings
      community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
      loop: "{{ desktop_gnome_hardening_dconf + desktop_gnome_ui_dconf }}"
      loop_control:
        label: "{{ item.key }}"
      ignore_errors: true
      register: _desktop_gnome_dconf_results

    - name: Warn if GNOME dconf hardening writes failed
      ansible.builtin.debug:
        msg: >-
          WARNING: some GNOME dconf hardening writes failed (dbus/dconf unavailable?).
          Failed keys: {{ _desktop_gnome_dconf_results.results | selectattr('failed') | map(attribute='item.key') | list | join(', ') }}
      when: _desktop_gnome_dconf_results.results | selectattr('failed') | list | length > 0
