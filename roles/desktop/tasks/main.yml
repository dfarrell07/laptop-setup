---
# roles/desktop/tasks/main.yml
# Desktop environment: Sway/GNOME/i3 (Linux), AeroSpace (macOS), Alacritty, fonts.

- name: Assert display timeout is greater than lock timeout
  ansible.builtin.assert:
    that: desktop_wm_idle_display_timeout | int > desktop_wm_idle_lock_timeout | int
    fail_msg: >-
      desktop_wm_idle_display_timeout ({{ desktop_wm_idle_display_timeout }}s) must be greater
      than desktop_wm_idle_lock_timeout ({{ desktop_wm_idle_lock_timeout }}s). If the display
      powers off before the screen locks, the resume handler will wake the display and expose
      an unlocked desktop. Set display_timeout > lock_timeout in config.yml.
  when: desktop_environment in ['sway', 'i3']

- name: Install desktop packages (dnf)
  when: is_dnf
  block:
    - name: Install desktop packages (dnf)
      vars:
        _wm_pkgs: >-
          {{ (desktop_sway_packages if desktop_environment == 'sway' else [])
             + (desktop_i3_packages if desktop_environment == 'i3' else [])
             + (desktop_gnome_packages if desktop_environment == 'gnome' else [])
             + (desktop_alacritty_packages if desktop_terminal == 'alacritty' else []) }}
      ansible.builtin.dnf:
        name: "{{ desktop_dnf_packages + _wm_pkgs }}"
        state: present
      become: true
      tags: [become]
      register: _desktop_dnf_install
  rescue:
    - name: Fail if desktop packages install failed
      ansible.builtin.fail:
        msg: >-
          DESKTOP PACKAGE INSTALL FAILED: {{ ansible_failed_result.msg | default('unknown error') | truncate(300) }}.
          The install is one transaction, so none of the desktop packages were installed; fix the
          cause (network, repos) and re-run make apply CHUNK=desktop.

- name: Install desktop packages (apt)
  when: is_apt
  block:
    - name: Install desktop packages (apt)
      vars:
        _apt_wm_pkgs: >-
          {{ (desktop_sway_apt_packages if desktop_environment == 'sway' else [])
             + (desktop_i3_apt_packages if desktop_environment == 'i3' else [])
             + (desktop_alacritty_packages if desktop_terminal == 'alacritty' else []) }}
      ansible.builtin.apt:
        name: "{{ desktop_apt_packages + _apt_wm_pkgs }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      become: true
      tags: [become]
      register: _desktop_apt_install
  rescue:
    - name: Fail if desktop packages install failed (apt)
      ansible.builtin.fail:
        msg: >-
          DESKTOP PACKAGE INSTALL FAILED: {{ ansible_failed_result.msg | default('unknown error') | truncate(300) }}.
          The install is one transaction, so none of the desktop packages were installed; fix the
          cause (network, repos) and re-run make apply CHUNK=desktop.

# --- Alacritty config ---
- name: Deploy Alacritty configuration
  when:
    - desktop_terminal == 'alacritty'
    - not (_desktop_dnf_install.failed | default(false))
    - not (_desktop_apt_install.failed | default(false))
  block:
    - name: Ensure Alacritty config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/alacritty"
        state: directory
        mode: "0755"

    - name: Deploy Alacritty config
      ansible.builtin.template:
        src: alacritty.toml.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/alacritty/alacritty.toml"
        mode: "0644"
        backup: true  # hand edits survive as <file>.<timestamp>~ (written only when content changes)

# --- i3 config ---
- name: Deploy i3 configuration
  when: desktop_environment == 'i3'
  block:
    - name: Ensure i3 config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/i3"
        state: directory
        mode: "0755"

    - name: Deploy i3 config
      ansible.builtin.template:
        src: i3.config.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/i3/config"
        mode: "0644"
        force: false

# --- i3 TrackPoint config (X11 persistent, via xorg.conf.d) ---
- name: TrackPoint config for i3 (X11, xorg.conf.d)
  when:
    - desktop_environment == 'i3'
    - desktop_i3_trackpoint_id | length > 0
  become: true
  tags: [become]
  block:
    - name: Ensure /etc/X11/xorg.conf.d exists (i3 TrackPoint)
      ansible.builtin.file:
        path: /etc/X11/xorg.conf.d
        state: directory
        mode: "0755"

    - name: Deploy TrackPoint libinput config (i3/X11)
      ansible.builtin.template:
        src: xorg-trackpoint.conf.j2
        dest: /etc/X11/xorg.conf.d/90-trackpoint.conf
        mode: "0644"

# --- Sway config ---
- name: Ensure Pictures directory exists for screenshots
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Pictures"
    state: directory
    mode: "0755"
  when: desktop_environment in ['sway', 'i3']

- name: Deploy Sway configuration and GTK settings
  when: desktop_environment == 'sway'
  block:
    - name: Ensure Sway config directories
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/{{ item }}"
        state: directory
        mode: "u+rwx"  # never widens an existing dir (gtk-3.0 is often 0700: bookmarks)
      loop: [sway, swaylock, xdg-desktop-portal, gtk-3.0, gtk-4.0]

    - name: Deploy Sway config
      ansible.builtin.template:
        src: sway.config.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/sway/config"
        mode: "0644"
        backup: true  # hand edits survive as <file>.<timestamp>~ (written only when content changes)

    - name: Deploy swaylock config (show-failed-attempts, indicator-caps-lock)
      ansible.builtin.template:
        src: swaylock.config.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/swaylock/config"
        mode: "0644"
        backup: true  # hand edits survive as <file>.<timestamp>~ (written only when content changes)

    # sway-portals.conf applies only when XDG_CURRENT_DESKTOP=sway; a plain portals.conf would
    # also route GNOME sessions' screen sharing to the wlr backend, which fails on mutter.
    - name: Deploy xdg-desktop-portal sway-portals.conf (Sway screen sharing)
      ansible.builtin.copy:
        dest: "{{ ansible_facts['user_dir'] }}/.config/xdg-desktop-portal/sway-portals.conf"
        mode: "0644"
        content: |
          # {{ ansible_managed }}
          [preferred]
          default=gtk
          org.freedesktop.impl.portal.Screenshot=wlr
          org.freedesktop.impl.portal.ScreenCast=wlr

    # GTK settings.ini (Sway: no GNOME settings daemon; GTK reads files directly)
    - name: Deploy GTK settings (Sway)
      ansible.builtin.template:
        src: gtk-settings.ini.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/{{ item }}/settings.ini"
        mode: "0644"
        backup: true  # hand edits survive as <file>.<timestamp>~ (written only when content changes)
      loop: [gtk-3.0, gtk-4.0]

    - name: Set GTK dark color-scheme via dconf (xdg-desktop-portal-gtk)
      community.general.dconf:
        key: /org/gnome/desktop/interface/color-scheme
        value: "'prefer-dark'"
      when: not (system_is_container | default(false))
      register: _desktop_dconf_dark
      ignore_errors: true

    - name: Warn if GTK dark color-scheme dconf write failed
      ansible.builtin.debug:
        msg: >-
          WARNING: dconf write for color-scheme failed (dbus/dconf unavailable?).
          GTK3/4 direct reads use settings.ini; portal-querying GTK4 apps may not see dark theme.
      when: _desktop_dconf_dark.failed | default(false)

- name: Deploy TERMINAL environment.d config (Sway/i3)
  ansible.builtin.copy:
    content: "TERMINAL={{ desktop_terminal }}\n"
    dest: "{{ ansible_facts['user_dir'] }}/.config/environment.d/terminal.conf"
    mode: "0644"
  when:
    - is_linux
    - desktop_environment in ['sway', 'i3']
    - not system_is_container  # ~/.config/environment.d not created in containers (common task guards it)

# --- i3status config (shared by i3 and Sway) ---
# The sway/i3 bar wrapper and the macOS bar (macos_bar.yml) render the same VPN list
- name: Validate desktop_i3status_vpns
  ansible.builtin.assert:
    that:
      - desktop_i3status_vpns is sequence and desktop_i3status_vpns is not string
      - desktop_i3status_vpns | select('mapping') | list | length == desktop_i3status_vpns | length
      - desktop_i3status_vpns | rejectattr('name', 'defined') | list | length == 0
      - desktop_i3status_vpns | map(attribute='name') | reject('match', '^[A-Za-z0-9][A-Za-z0-9 ._-]{0,31}$') | list | length == 0
      - desktop_i3status_vpns | rejectattr('command', 'defined') | list | length == 0
      - desktop_i3status_vpns | map(attribute='command') | reject('sequence') | list | length == 0
      - desktop_i3status_vpns | map(attribute='command') | select('string') | list | length == 0
      - desktop_i3status_vpns | map(attribute='command') | map('length') | select('eq', 0) | list | length == 0
      - desktop_i3status_vpns | map(attribute='command') | flatten | reject('string') | list | length == 0
      - desktop_i3status_vpns | rejectattr('connected', 'defined') | list | length == 0
      - desktop_i3status_vpns | map(attribute='connected') | reject('string') | list | length == 0
      - desktop_i3status_vpns | map(attribute='connected') | select('eq', '') | list | length == 0
      # control characters (a YAML block scalar's trailing newline) would break the bar's JSON or match every line
      - desktop_i3status_vpns | map(attribute='name') | select('search', '[\x00-\x1f\x7f]') | list | length == 0
      - desktop_i3status_vpns | map(attribute='connected') | select('search', '[\x00-\x1f\x7f]') | list | length == 0
    fail_msg: >-
      desktop_i3status_vpns must be a list of {name, command, connected}: name 1-32 letters, digits, space, . _ -;
      command a non-empty list of strings (argv, no shell); connected a non-empty extended regex. Example:
      {name: Mullvad, command: [mullvad, status], connected: '^Connected'}
  when:
    - desktop_i3status_vpn | bool
    - desktop_environment in ['i3', 'sway'] or (is_macos and desktop_macos_bar | bool)

- name: Deploy i3status config (shared by i3 and Sway)
  when: desktop_environment in ['i3', 'sway']
  block:
    - name: Ensure i3status config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/i3status"
        state: directory
        mode: "0755"

    - name: Deploy i3status config
      ansible.builtin.template:
        src: i3status.conf.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/i3status/config"
        mode: "0644"
        backup: true  # hand edits survive as <file>.<timestamp>~ (written only when content changes)

    - name: Deploy the bar status_command wrapper (RAM units, VPN blocks)
      ansible.builtin.template:
        src: i3status-bar.sh.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/i3status/bar-status"
        mode: "0755"

# --- Shell ---
# ansible.builtin.user calls usermod, which cannot modify SSSD/LDAP-only accounts
# that have no /etc/passwd entry. Probe first; for SSSD/LDAP accounts, chsh and
# usermod both read only /etc/passwd and cannot write to LDAP backends —
# the correct approach is override_shell in sssd.conf.
# CI gap: all molecule scenarios use the vagrant/root user which is in /etc/passwd,
# so the SSSD path (tasks below with _local_user.rc != 0 condition) is never
# exercised in CI. A real SSSD/LDAP environment cannot be reproduced in Podman-based
# molecule. The failed_when: false + warn task provides runtime resilience.
- name: Check if user has a local /etc/passwd entry
  ansible.builtin.command:
    cmd: grep -q "^{{ ansible_facts['user_id'] }}:" /etc/passwd
  register: _zsh_local_user_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode
  tags: [login_shell]
  when: is_linux

- name: Check if zsh is installed
  ansible.builtin.stat:
    path: /bin/zsh
  register: _zsh_binary_stat
  tags: [login_shell]
  when: is_linux

- name: Fail if zsh binary is missing (prevents broken login)
  ansible.builtin.fail:
    msg: >-
      Cannot set zsh as default shell: /bin/zsh does not exist.
      The packages role may have failed to install zsh, or this role was run
      without packages. Run 'make packages' first to install zsh, then retry.
  tags: [login_shell]
  when:
    - is_linux
    - not _zsh_binary_stat.stat.exists
    - not ansible_check_mode

- name: Report zsh not installed yet in check mode
  ansible.builtin.debug:
    msg: "CHECK MODE: /bin/zsh is absent; the packages role installs it before this step in a real run."
  tags: [login_shell]
  when:
    - is_linux
    - not _zsh_binary_stat.stat.exists
    - ansible_check_mode

- name: Set zsh as default shell (local /etc/passwd user)
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /bin/zsh
  become: true
  tags: [become, login_shell]
  when:
    - is_linux
    - _zsh_local_user_check.rc | default(1) == 0

# For SSSD/LDAP domain accounts, chsh and usermod only modify /etc/passwd
# and cannot write to LDAP backends. Set override_shell for the domain instead —
# this applies to every user of that domain on next login after sssd restarts.
- name: Get SSSD domain section for override_shell
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      result=$(awk -F'[][]' '/^\[domain\// {print $2; exit}' /etc/sssd/sssd.conf 2>/dev/null)
      if [ -z "$result" ]; then
        result=$(find /etc/sssd/conf.d/ -name '*.conf' 2>/dev/null |
          xargs -r awk -F'[][]' '/^\[domain\// {print $2; exit}' 2>/dev/null |
          head -1)
      fi
      echo "$result"
    executable: /bin/bash
  register: _sssd_domain_section
  changed_when: false
  failed_when: false
  become: true
  check_mode: false  # read-only probe — must run in check mode
  tags: [login_shell]
  when:
    - is_linux
    - _zsh_local_user_check.rc | default(1) != 0

# A conf.d snippet, not an edit of sssd.conf: Red Hat IT re-templates sssd.conf on CSB
# (dropping override_shell), and sssd on Fedora 41+ runs as the sssd user, so the file it
# reads must have sssd.conf's group, mode 0640 when that group is not root (root:sssd there). Mode 0600 would make
# sssd unable to read its config and break domain logins.
- name: Read sssd.conf ownership for the override_shell snippet
  ansible.builtin.stat:
    path: /etc/sssd/sssd.conf
  register: _sssd_conf_stat
  become: true
  tags: [become, login_shell]
  when:
    - is_linux
    - _zsh_local_user_check.rc | default(1) != 0
    - _sssd_domain_section.stdout | default('') | length > 0

- name: Set zsh via override_shell in an sssd conf.d snippet (SSSD/LDAP user)
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [{{ _sssd_domain_section.stdout | trim }}]
      override_shell = /bin/zsh
    dest: /etc/sssd/conf.d/90-laptop-setup-shell.conf
    owner: root
    group: "{{ _sssd_conf_stat.stat.gr_name | default('root') }}"
    mode: "{{ '0640' if (_sssd_conf_stat.stat.gr_name | default('root')) != 'root' else '0600' }}"
  become: true
  tags: [become, login_shell]
  register: _sssd_override_shell_result
  when:
    - is_linux
    - _zsh_local_user_check.rc | default(1) != 0
    - _sssd_domain_section.stdout | default('') | length > 0
    - _zsh_binary_stat.stat.exists
    - _sssd_conf_stat.stat.exists | default(false)

- name: Restart sssd after override_shell change
  ansible.builtin.systemd:
    name: sssd
    state: restarted
  become: true
  tags: [become, login_shell]
  when:
    - is_linux
    - _sssd_override_shell_result is defined
    - _sssd_override_shell_result is changed

- name: Warn if SSSD domain not found (cannot set shell automatically)
  ansible.builtin.debug:
    msg: >-
      WARNING: could not set zsh as default shell for {{ ansible_facts['user_id'] }}.
      The account has no local /etc/passwd entry (SSSD/LDAP-managed) and no
      [domain/...] section was found in /etc/sssd/sssd.conf.
      Manual fix: add 'override_shell = /bin/zsh' to the [domain/...] stanza in a
      root-owned /etc/sssd/conf.d/*.conf (same group/mode as sssd.conf), then run
      'systemctl restart sssd'.
  tags: [login_shell]
  when:
    - is_linux
    - _zsh_local_user_check.rc | default(1) != 0
    - _sssd_domain_section.stdout | default('') | length == 0

# --- macOS: is the bar built? (_desktop_macos_bar_on: the AeroSpace gap and the menu bar hiding wait for it) ---
- name: Check whether SketchyBar is installed (macOS)
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin/sketchybar"
  register: _desktop_sketchybar_bin
  when: is_macos and desktop_macos_bar | bool

# --- macOS: AeroSpace config ---
- name: Deploy AeroSpace configuration (macOS)
  when: is_macos
  block:
    - name: Validate supported macOS terminal application
      ansible.builtin.assert:
        that:
          - desktop_terminal in ['ghostty', 'terminal', 'alacritty']
          - desktop_macos_terminal_app == {'ghostty':'Ghostty', 'terminal':'Terminal', 'alacritty':'Alacritty'}[desktop_terminal]
          - >-
            desktop_macos_terminal_path == ('/System/Applications/Utilities/Terminal.app' if desktop_terminal == 'terminal'
            else '/Applications/' + desktop_macos_terminal_app + '.app')
        fail_msg: >-
          Choose ghostty or terminal on macOS, with the matching application name
          and path; Alacritty requires an existing independently installed app.

    - name: Ensure AeroSpace config directory (macOS)
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/aerospace"
        state: directory
        mode: "0755"

    - name: Deploy AeroSpace config (macOS)
      ansible.builtin.template:
        src: aerospace.toml.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/aerospace/aerospace.toml"
        mode: "0644"
        backup: true  # hand edits survive as <file>.<timestamp>~ (written only when content changes)
      register: _desktop_aerospace_config

    # The CLI from the pinned release (packages role, install_brew.yml); as the user, no sudo
    - name: Reload the changed AeroSpace config (macOS)  # noqa: no-handler
      ansible.builtin.command:
        argv: ["{{ ansible_facts['user_dir'] }}/.local/bin/aerospace", reload-config]
      register: _desktop_aerospace_reload
      changed_when: _desktop_aerospace_reload.rc == 0
      failed_when: false  # not running or not installed yet: it reads the new file when it starts
      when: _desktop_aerospace_config is changed

    # start-at-login in the config starts AeroSpace from the next login on; this starts it now, in the background
    # and without sudo, so the first run tiles without a logout
    - name: Check whether AeroSpace is running (macOS)
      ansible.builtin.command:
        argv: [/usr/bin/pgrep, -x, AeroSpace]
      register: _desktop_aerospace_running
      changed_when: false
      failed_when: false
      check_mode: false  # read-only probe
      when: desktop_macos_tiling_wm | bool

    - name: Start AeroSpace (macOS)
      ansible.builtin.command:
        argv: [/usr/bin/open, -ga, AeroSpace]
      register: _desktop_aerospace_open
      changed_when: _desktop_aerospace_open.rc == 0
      failed_when: false  # not installed yet (packages chunk): warned below rather than failing the chunk
      when:
        - desktop_macos_tiling_wm | bool
        - _desktop_aerospace_running.rc | default(0) == 1

    - name: Warn that AeroSpace did not start (macOS)
      ansible.builtin.debug:
        msg: >-
          AeroSpace is the window manager (desktop_environment: aerospace) but `/usr/bin/open -ga AeroSpace` failed:
          {{ _desktop_aerospace_open.stderr | default('') | trim }}. Install it with make apply CHUNK=packages, then
          re-run make apply CHUNK=desktop.
      when: _desktop_aerospace_open.rc | default(0) != 0

# --- macOS: defaults ---
- name: Set macOS defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    host: "{{ item.host | default(omit) }}"  # currentHost: per-machine (ByHost) preferences such as the screen saver
    check_type: false  # a value stored with another type (e.g. autohide-delay -int 0) is compared, not a failure
  loop: "{{ desktop_macos_defaults }}"
  loop_control:
    label: "{{ item.domain }} {{ item.key }}"
  register: _desktop_macos_defaults
  when: is_macos and item.manage | default(true) | bool

# --- macOS: display sleep as on Linux, plus the opt-in always-on power settings ---
- name: Read macOS power settings
  ansible.builtin.command:
    argv: [/usr/bin/pmset, -g, custom]
  register: _desktop_pmset
  changed_when: false
  check_mode: false  # read-only probe
  when: is_macos

# -c (AC power) only, so a MacBook that opts in still sleeps on battery. Only the "AC Power:" section of
# `pmset -g custom` is compared, and keys this Mac does not report are skipped, so re-runs stay unchanged.
- name: Apply macOS power settings (display sleep; always-on when enabled)
  ansible.builtin.command:
    argv: [/usr/bin/pmset, -c, "{{ item.key }}", "{{ item.value | string }}"]
  become: true
  tags: [become]
  changed_when: true
  loop: >-
    {{ ({'displaysleep': desktop_macos_display_sleep_minutes | int}
        | combine(desktop_macos_always_on_pmset if desktop_macos_always_on | bool else {})) | dict2items }}
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  vars:
    _desktop_pmset_ac: >-
      {{ _desktop_pmset.stdout | regex_search('(?s)AC Power:\n(.*?)(?:\n\S|$)', '\1') | default([''], true) | first }}
    _desktop_pmset_now: "{{ _desktop_pmset_ac | regex_findall('(?m)^\\s*' ~ item.key ~ '\\s+(\\d+)') }}"
  when:
    - is_macos
    - _desktop_pmset_now | length > 0
    - _desktop_pmset_now != [item.value | string]

# The Dock and the screenshot service cache their settings; restarting them (no sudo) applies the change now.
- name: Restart macOS UI services whose defaults changed
  ansible.builtin.command:
    argv: [killall, "{{ item.service }}"]
  changed_when: true
  failed_when: false  # not running is fine: it reads the new value when it starts
  loop:
    - {service: Dock, domains: [com.apple.dock]}
    - {service: SystemUIServer, domains: [com.apple.screencapture]}
    - {service: Finder, domains: [com.apple.finder]}
  loop_control:
    label: "{{ item.service }}"
  when:
    - is_macos
    - not ansible_check_mode
    - >-
      _desktop_macos_defaults.results | default([]) | selectattr('changed')
      | map(attribute='item.domain') | select('in', item.domains) | list | length > 0

# --- macOS: SketchyBar in place of the menu bar, JankyBorders focus border ---
- name: Deploy the bar and window borders (macOS)
  ansible.builtin.include_tasks: macos_bar.yml
  when: is_macos

# --- macOS: Ghostty config ---
- name: Deploy Ghostty configuration (macOS)
  when: is_macos and desktop_terminal == 'ghostty'
  block:
    - name: Ensure Ghostty config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/ghostty"
        state: directory
        mode: "0755"

    - name: Deploy Ghostty config
      ansible.builtin.template:
        src: ghostty.config.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/ghostty/config"
        mode: "0644"
        backup: true  # hand edits survive as <file>.<timestamp>~ (written only when content changes)

# --- macOS: firewall ---
- name: Check macOS firewall settings
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw {{ item.check_cmd }}
  register: _fw_check_results
  changed_when: false
  check_mode: false  # read-only probe — must run in check mode
  become: true
  tags: [become]
  when: is_macos
  failed_when: false
  timeout: 30
  loop: "{{ desktop_macos_firewall_settings }}"
  loop_control:
    label: "{{ item.name }}"

- name: Enable macOS firewall settings
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw {{ item.set_cmd }}
  register: _fw_enable_results
  changed_when: _fw_enable_results.rc == 0
  become: true
  tags: [become]
  when:
    - is_macos
    - >-
      not (_fw_check_results.results[ansible_loop.index0].stdout | default('')
           | regex_search(item.match_re | default(item.match_str | regex_escape)))
  failed_when: false
  timeout: 30
  loop: "{{ desktop_macos_firewall_settings }}"
  loop_control:
    label: "{{ item.name }}"
    extended: true

- name: Warn if macOS firewall settings enable failed
  ansible.builtin.debug:
    msg: >-
      WARNING: socketfilterfw {{ item.set_cmd }} exited {{ _fw_enable_results.results[ansible_loop.index0].rc | default(0) }}
      — {{ item.name }} firewall setting may still be off
  when:
    - is_macos
    - _fw_enable_results.results[ansible_loop.index0].rc | default(0) != 0
  loop: "{{ desktop_macos_firewall_settings }}"
  loop_control:
    label: "{{ item.name }}"
    extended: true

# --- macOS: remote access (Remote Login with the Linux key policy, mosh, optional Screen Sharing) ---
# sshd is macOS's OpenSSH, started per connection by a launchd job of ours on ssh_port. It is only turned on together
# with the key-only, tailnet-only policy below, so it never accepts passwords: until the ssh_authorized_keys chunk
# writes ~/.ssh/authorized_keys it stays off and the macos-remote-access smoke check says so.
- name: Check for authorized SSH keys (macOS)
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.ssh/authorized_keys"
  register: _desktop_authorized_keys
  when: is_macos and desktop_macos_remote_login | bool

# The Linux algorithm lists follow Fedora's OpenSSH; an older macOS sshd rejects names it lacks (mlkem768x25519-sha256
# needs OpenSSH 9.9), so the drop-in keeps the ones this Mac supports. Apple's sshd has no -Q; its ssh, from the same
# OpenSSH build, lists the same algorithms.
- name: Read the SSH algorithms this Mac supports (macOS)
  ansible.builtin.command:
    argv: [/usr/bin/ssh, -Q, "{{ item }}"]
  register: _desktop_ssh_supported
  changed_when: false
  check_mode: false  # read-only
  loop: [KexAlgorithms, Ciphers, MACs, HostKeyAlgorithms, PubkeyAcceptedAlgorithms]
  when:
    - is_macos and desktop_macos_remote_login | bool
    - _desktop_authorized_keys.stat.size | default(0) > 0

# In the group_vars order; sshd-macos.conf.j2 falls back to the full lists when this did not run
- name: Keep the sshd algorithms this Mac supports (macOS)
  ansible.builtin.set_fact:
    _desktop_sshd_algorithms: >-
      {{ _desktop_sshd_algorithms | default({}) | combine({item.item: _wanted[item.item] | map('trim')
                                                           | select('in', item.stdout_lines | map('trim') | list) | list}) }}
  vars:
    _wanted:
      KexAlgorithms: "{{ ssh_kex_algorithms.split(',') }}"
      Ciphers: "{{ ssh_ciphers.split(',') }}"
      MACs: "{{ ssh_macs.split(',') }}"
      HostKeyAlgorithms: "{{ ssh_host_key_algorithms.split(',') }}"
      PubkeyAcceptedAlgorithms: "{{ ssh_pubkey_accepted_algorithms }}"
  loop: "{{ _desktop_ssh_supported.results | default([]) | selectattr('stdout_lines', 'defined') }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check each sshd algorithm list keeps a supported algorithm (macOS)
  ansible.builtin.assert:
    that: _empty | length == 0
    fail_msg: >-
      This Mac's OpenSSH (/usr/bin/ssh -Q) supports none of the configured {{ _empty | join(', ') }} (group_vars/all/vars.yml
      ssh_* lists): sshd would refuse every connection. Update macOS, or add an algorithm it supports to that list.
    quiet: true
  vars:
    _empty: "{{ _desktop_sshd_algorithms | dict2items | rejectattr('value') | map(attribute='key') | list }}"
  when: _desktop_sshd_algorithms is defined

# Each entry lands in AllowUsers user@<entry>: only an address range, never spaces, newlines or patterns
- name: Check the sshd tailnet ranges are CIDRs (macOS)
  ansible.builtin.assert:
    that:
      - desktop_macos_ssh_allow_from is sequence and desktop_macos_ssh_allow_from is not string
      - desktop_macos_ssh_allow_from | length > 0
      - _not_cidr | length == 0
    fail_msg: >-
      desktop_macos_ssh_allow_from must be a non-empty list of CIDRs (a.b.c.d/n or IPv6 hex:colons/n, no spaces);
      not CIDRs: {{ _not_cidr | default([]) }}
    quiet: true
  vars:
    _octet: (25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])
    # every way to write 1 to 8 groups of 1 to 4 hex digits (H), with at most one :: standing for the rest
    _v6_forms: ['(H:){7}H', '(H:){1,7}:', '(H:){1,6}:H', '(H:){1,5}(:H){1,2}', '(H:){1,4}(:H){1,3}', '(H:){1,3}(:H){1,4}',
                '(H:){1,2}(:H){1,5}', 'H:(:H){1,6}', ':((:H){1,7}|:)']
    _v6: "{{ _v6_forms | join('|') | replace('H', '[0-9A-Fa-f]{1,4}') }}"
    _cidr: >-
      ({{ _octet }}\.){3}{{ _octet }}/(3[0-2]|[12]?[0-9])|({{ _v6 }})/(12[0-8]|1[01][0-9]|[1-9]?[0-9])
    _not_cidr: "{{ desktop_macos_ssh_allow_from | map('string') | reject('regex', _cidr, match_type='fullmatch') | list }}"
  when: is_macos and desktop_macos_remote_login | bool

- name: Apply the sshd login policy and start sshd (macOS)
  when:
    - is_macos and desktop_macos_remote_login | bool
    - _desktop_authorized_keys.stat.size | default(0) > 0
  become: true
  tags: [become]
  block:
    # A fresh Mac has no host keys until its first ssh connection; sshd -t needs them
    - name: Create missing SSH host keys (macOS)
      ansible.builtin.command:
        argv: [/usr/bin/ssh-keygen, -A]
      register: _desktop_sshd_hostkeys
      changed_when: "'generating' in _desktop_sshd_hostkeys.stdout"

    # launchd starts sshd per connection, so the next login reads the file: sshd checks it (alone, with the default
    # host keys, as root) before it replaces the live one, so a file it rejects never lands
    - name: Deploy the sshd login policy drop-in (macOS)
      ansible.builtin.template:
        src: sshd-macos.conf.j2
        dest: "{{ desktop_macos_sshd_dropin }}"
        mode: "0644"
        owner: root
        group: wheel
        validate: /usr/sbin/sshd -t -f %s

    # The whole configuration, sshd_config and the other drop-ins with ours, before the job starts sshd with it
    - name: Validate the sshd configuration (macOS)
      ansible.builtin.command:
        argv: [/usr/sbin/sshd, -t]
      changed_when: false

    # What sshd applies to a login from the tailnet and from outside it (TEST-NET-3): a sshd_config without the drop-in
    # Include, a drop-in sorting before ours (sshd keeps the first value; AllowUsers lines add up) or a Match block for
    # other addresses would leave passwords on or other users in. Checked before the job loads or reloads.
    - name: Read the effective sshd settings for a tailnet and an outside login (macOS)
      ansible.builtin.command:
        argv: [/usr/sbin/sshd, -T, -C, "user={{ ansible_facts['user_id'] }},addr={{ item }},host=x"]
      loop: [100.64.0.1, 203.0.113.5]
      register: _desktop_sshd_effective
      changed_when: false

    # sshd -T prints lowercase keywords and one allowusers line per entry, values as written
    - name: Check the effective sshd settings are key-only and this user only (macOS)
      ansible.builtin.assert:
        that:
          - ansible_facts['user_id'] != 'root'
          - _missing | length == 0
          - _allow | sort == _allow_wanted | sort
        fail_msg: >-
          sshd -T for a login from {{ item.item }} as {{ ansible_facts['user_id'] }} shows {{ _shown | join(', ') }}
          and allowusers {{ _allow | join(' ') }}, not {{ _wanted | join(', ') }} and allowusers
          {{ _allow_wanted | join(' ') }}. /etc/ssh/sshd_config must Include sshd_config.d/*, no file there sorting
          before {{ desktop_macos_sshd_dropin | basename }} may set these or add AllowUsers, and no Match block may
          change them. The job was not (re)loaded.
        quiet: true
      loop: "{{ _desktop_sshd_effective.results }}"
      loop_control:
        label: "{{ item.item }}"
      vars:
        _lines: "{{ item.stdout_lines | map('trim') | list }}"
        _wanted: [passwordauthentication no, kbdinteractiveauthentication no, authenticationmethods publickey]
        _missing: "{{ _wanted | reject('in', _lines) | list }}"
        _shown: "{{ _lines | select('match', '(' ~ _wanted | map('split', ' ') | map('first') | join('|') ~ ') ') | list }}"
        _allow: "{{ _lines | select('match', 'allowusers ') | map('regex_replace', '^allowusers ', '') | list }}"
        _allow_wanted: "{{ [ansible_facts['user_id']] | product(desktop_macos_ssh_allow_from) | map('join', '@') | list }}"
      when: item is not skipped  # check mode: the drop-in was not written

    - name: Deploy the sshd launchd job on the SSH port (macOS)
      ansible.builtin.template:
        src: sshd-launchd.plist.j2
        dest: "/Library/LaunchDaemons/{{ desktop_macos_sshd_label }}.plist"
        mode: "0644"
        owner: root
        group: wheel
      register: _desktop_sshd_plist

    - name: Check the sshd launchd job (macOS)  # noqa: command-instead-of-module
      ansible.builtin.command:
        argv: [/bin/launchctl, print, "system/{{ desktop_macos_sshd_label }}"]
      register: _desktop_sshd_job
      changed_when: false
      failed_when: false
      check_mode: false

    # A changed plist needs bootout and bootstrap (kickstart -k restarts the loaded definition, it does not reread the
    # file). bootout also ends the sshd processes the job started, so a run over this sshd loses its session there
    # and would never reach bootstrap, leaving the Mac without sshd. Both steps therefore run as one detached job
    # (async, poll 0: Ansible's async wrapper starts it in its own session), which finishes even if this run dies;
    # rerun the desktop chunk afterwards to finish it. bootout returns before launchd has torn the job down
    # ("Bootstrap failed: 5"), so bootstrap retries.
    - name: Reload the changed sshd launchd job, detached (macOS)  # noqa: command-instead-of-module
      ansible.builtin.shell:
        cmd: >-
          /bin/launchctl bootout {{ ('system/' ~ desktop_macos_sshd_label) | quote }};
          i=0; until /bin/launchctl bootstrap system {{ ('/Library/LaunchDaemons/' ~ desktop_macos_sshd_label ~ '.plist') | quote }};
          do i=$((i + 1)); [ "$i" -lt 15 ] || exit 1; /bin/sleep 1; done
      async: 120
      poll: 0
      changed_when: true
      register: _desktop_sshd_reload
      when: _desktop_sshd_job.rc == 0 and _desktop_sshd_plist is changed

    - name: Wait for the sshd launchd job reload (macOS)
      ansible.builtin.async_status:
        jid: "{{ _desktop_sshd_reload.ansible_job_id }}"
      register: _desktop_sshd_reload_status
      until: _desktop_sshd_reload_status.finished
      retries: 60
      delay: 1
      when: _desktop_sshd_reload.ansible_job_id is defined

    - name: Load the sshd launchd job (macOS)  # noqa: command-instead-of-module
      ansible.builtin.command:
        argv: [/bin/launchctl, bootstrap, system, "/Library/LaunchDaemons/{{ desktop_macos_sshd_label }}.plist"]
      changed_when: true
      when: _desktop_sshd_job.rc != 0

    - name: Check the sshd launchd job is loaded (macOS)  # noqa: command-instead-of-module
      ansible.builtin.command:
        argv: [/bin/launchctl, print, "system/{{ desktop_macos_sshd_label }}"]
      changed_when: false
      when: not ansible_check_mode and (_desktop_sshd_job.rc != 0 or _desktop_sshd_plist is changed)

# Screen Sharing: the same launchd switch as System Settings > General > Sharing; enable clears the job's Disabled
# override and bootstrap loads it now. Reading the state needs no sudo.
- name: Choose the macOS remote access services to turn on
  ansible.builtin.set_fact:
    _desktop_remote_wanted: >-
      {{ [{'name': 'Screen Sharing', 'label': 'com.apple.screensharing',
           'plist': '/System/Library/LaunchDaemons/com.apple.screensharing.plist'}]
         if desktop_macos_screen_sharing | bool else [] }}
  when: is_macos

- name: Check macOS remote access services
  ansible.builtin.command:  # noqa: command-instead-of-module
    argv: [/bin/launchctl, print, "system/{{ item.label }}"]
  register: _desktop_remote_services
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe
  when: is_macos
  loop: "{{ _desktop_remote_wanted | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Enable macOS remote access services
  ansible.builtin.command:  # noqa: command-instead-of-module
    argv: [/bin/launchctl, enable, "system/{{ item.item.label }}"]
  changed_when: true
  become: true
  tags: [become]
  when: is_macos and item.rc is defined and item.rc != 0
  loop: "{{ _desktop_remote_services.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Load macOS remote access services
  ansible.builtin.command:  # noqa: command-instead-of-module
    argv: [/bin/launchctl, bootstrap, system, "{{ item.item.plist }}"]
  changed_when: true
  register: _desktop_remote_bootstrap
  # 5 or 37: launchd already has the job (loaded by System Settings meanwhile)
  failed_when: _desktop_remote_bootstrap.rc not in [0, 5, 37]
  become: true
  tags: [become]
  when: is_macos and item.rc is defined and item.rc != 0
  loop: "{{ _desktop_remote_services.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

# mosh (the zshrc `mac` / `mac-claude` aliases) talks UDP to mosh-server. The app firewall asks on screen the first
# time an unlisted, ad-hoc signed program accepts a connection, which unattended means blocked: allow the resolved
# Cellar path (it changes when Homebrew upgrades mosh; the smoke check notices).
- name: Resolve programs to allow through the macOS firewall
  ansible.builtin.command:
    argv: [/bin/realpath, "{{ item }}"]
  register: _desktop_fw_allow_paths
  changed_when: false
  failed_when: false
  check_mode: false
  when: is_macos
  loop: "{{ desktop_macos_firewall_allow }}"

- name: Read the macOS firewall app list
  ansible.builtin.command:
    argv: [/usr/libexec/ApplicationFirewall/socketfilterfw, --listapps]
  register: _desktop_fw_apps
  changed_when: false
  check_mode: false
  when: is_macos and desktop_macos_firewall_allow | length > 0

- name: Allow programs through the macOS firewall
  ansible.builtin.shell:
    cmd: >-
      /usr/libexec/ApplicationFirewall/socketfilterfw --add {{ item.stdout | quote }} &&
      /usr/libexec/ApplicationFirewall/socketfilterfw --unblockapp {{ item.stdout | quote }}
  changed_when: true
  become: true
  tags: [become]
  when:
    - is_macos
    - item.rc | default(1) == 0
    - (item.stdout ~ ' ') not in (_desktop_fw_apps.stdout | default('') ~ ' ')
  loop: "{{ _desktop_fw_allow_paths.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"

# Each Homebrew upgrade of mosh leaves the previous Cellar path in the list, still allowed: remove those
- name: Remove stale mosh-server entries from the macOS firewall
  ansible.builtin.command:
    argv: [/usr/libexec/ApplicationFirewall/socketfilterfw, --remove, "{{ item }}"]
  changed_when: true
  become: true
  tags: [become]
  when: is_macos and desktop_macos_firewall_allow | length > 0
  loop: >-
    {{ _desktop_fw_apps.stdout | default('') | regex_findall('(/[^ ]*/Cellar/mosh/[^/ ]+/bin/mosh-server)(?= |$)') | unique
       | difference(_desktop_fw_allow_paths.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0)
                    | map(attribute='stdout') | list) }}

# --- Scroll direction in GNOME, whichever desktop_environment is chosen ---
- name: GNOME scroll direction
  when:
    - is_linux
    - not (system_is_container | default(false))
  block:
    - name: Check whether GNOME is installed
      ansible.builtin.stat:
        path: /usr/bin/gnome-shell
      register: _desktop_gnome_shell

    - name: Set the GNOME touchpad and mouse scroll direction
      when: _desktop_gnome_shell.stat.exists
      block:
        - name: Validate the scroll direction settings
          ansible.builtin.assert:
            that:
              - desktop_gnome_touchpad_natural_scroll is boolean
              - desktop_gnome_mouse_natural_scroll is boolean

        - name: Write the GNOME scroll direction keys
          community.general.dconf:
            key: "{{ item.key }}"
            value: "{{ item.value }}"
          loop: "{{ desktop_gnome_scroll_dconf }}"
          loop_control:
            label: "{{ item.key }}"
          ignore_errors: true  # no session bus (an SSH run): warned below, as the GNOME block does
          register: _desktop_gnome_scroll_results

        - name: Warn if the GNOME scroll direction writes failed
          ansible.builtin.debug:
            msg: >-
              WARNING: GNOME scroll direction not set (dbus/dconf unavailable?):
              {{ _desktop_gnome_scroll_results.results | selectattr('failed') | map(attribute='item.key') | join(', ') }}
          when: _desktop_gnome_scroll_results.results | selectattr('failed') | list | length > 0

# --- Chrome (Linux and macOS): policies, extensions, profile settings and page zoom (docs/chrome.md) ---
# Its own chunk (chrome), inside the desktop role: make apply CHUNK=desktop skips it.
- name: Check whether Google Chrome is installed
  ansible.builtin.stat:
    path: "{{ '/Applications/Google Chrome.app' if is_macos else '/opt/google/chrome/chrome' }}"
  register: _desktop_chrome_app
  when: is_linux or is_macos
  tags: [chrome]

- name: Chrome
  ansible.builtin.include_tasks:
    file: chrome.yml
    apply:
      tags: [chrome]
  tags: [chrome]
  when:
    - is_linux or is_macos
    - not (system_is_container | default(false))
    - _desktop_chrome_app.stat.exists | default(false)

# --- GNOME hardening (Linux only, GNOME desktops) ---
- name: GNOME hardening dconf settings
  when:
    - is_linux
    - desktop_environment == 'gnome'
    - not (system_is_container | default(false))
  block:
    - name: Validate GNOME preference types
      ansible.builtin.assert:
        that:
          - desktop_gnome_clock_format in ['12h', '24h']
          - desktop_gnome_clock_show_date is boolean
          - desktop_gnome_touchpad_tap is boolean
          - desktop_gnome_dynamic_workspaces is boolean
          - desktop_gnome_workspace_count | string is match('^[0-9]+$')
          - desktop_gnome_workspace_count | int >= 1
          - desktop_gnome_workspace_count | int <= 36
          - desktop_gnome_xkb_options is sequence and desktop_gnome_xkb_options is not string and desktop_gnome_xkb_options is not mapping
          - desktop_gnome_xkb_options | reject('string') | list | length == 0
          - desktop_gnome_xkb_options | reject('match', '^[a-zA-Z0-9_:-]+$') | list | length == 0

    - name: Apply GNOME dconf hardening and UI settings
      community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
      loop: "{{ desktop_gnome_hardening_dconf + desktop_gnome_ui_dconf }}"
      loop_control:
        label: "{{ item.key }}"
      ignore_errors: true
      register: _desktop_gnome_dconf_results

    - name: Warn if GNOME dconf writes failed
      ansible.builtin.debug:
        msg: >-
          WARNING: some GNOME dconf writes failed (dbus/dconf unavailable?).
          Failed keys: {{ _desktop_gnome_dconf_results.results | selectattr('failed') | map(attribute='item.key') | list | join(', ') }}
      when: _desktop_gnome_dconf_results.results | selectattr('failed') | list | length > 0
