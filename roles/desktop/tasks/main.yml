---
# roles/desktop/tasks/main.yml
# Desktop environment: Sway/GNOME/i3 (Linux), AeroSpace (macOS), Alacritty, fonts.

- name: Detect desktop environment
  ansible.builtin.set_fact:
    desktop_detected: >-
      {{ 'sway' if (ansible_env.XDG_SESSION_TYPE | default('') == 'wayland' and
                    ansible_env.XDG_CURRENT_DESKTOP | default('') == 'sway')
         else ('gnome' if (ansible_env.XDG_CURRENT_DESKTOP | default('') is search('GNOME'))
         else ('i3' if (ansible_env.XDG_CURRENT_DESKTOP | default('') == 'i3')
         else 'unknown')) }}
  when: desktop_environment == 'auto'

- name: Set effective desktop
  ansible.builtin.set_fact:
    desktop_effective: "{{ desktop_environment if desktop_environment != 'auto' else desktop_detected | default('unknown') }}"

- name: Warn when desktop_environment explicitly set to unknown
  ansible.builtin.debug:
    msg: >-
      desktop_environment is set to 'unknown' — no WM packages will be installed.
      Set desktop_environment: sway, i3, or gnome in config.yml if a WM is needed.
  when: desktop_effective == 'unknown' and desktop_environment != 'auto'

- name: Fail when auto-detection falls through to unknown on Linux
  ansible.builtin.fail:
    msg: >-
      desktop_environment is 'auto' but no desktop session was detected
      (XDG_SESSION_TYPE='{{ ansible_env.XDG_SESSION_TYPE | default('') }}',
      XDG_CURRENT_DESKTOP='{{ ansible_env.XDG_CURRENT_DESKTOP | default('') }}').
      Set desktop_environment: sway, i3, or gnome in config.yml before running
      make all — auto-detection requires an active desktop session and will not
      work on bare installs or remote SSH provisioning.
  when:
    - desktop_effective == 'unknown'
    - desktop_environment == 'auto'
    - ansible_system == 'Linux'

- name: Install common desktop packages
  ansible.builtin.dnf:
    name: "{{ desktop_common_packages }}"
    state: present
  become: true
  tags: [become]
  when: ansible_pkg_mgr in ['dnf', 'dnf5']

- name: Install Sway packages
  ansible.builtin.dnf:
    name: "{{ desktop_sway_packages }}"
    state: present
  become: true
  tags: [become]
  when:
    - ansible_pkg_mgr in ['dnf', 'dnf5']
    - desktop_effective == 'sway'

- name: Install i3 packages
  ansible.builtin.dnf:
    name: "{{ desktop_i3_packages }}"
    state: present
  become: true
  tags: [become]
  when:
    - ansible_pkg_mgr in ['dnf', 'dnf5']
    - desktop_effective == 'i3'

- name: Install GNOME packages
  ansible.builtin.dnf:
    name: "{{ desktop_gnome_packages }}"
    state: present
  become: true
  tags: [become]
  when:
    - ansible_pkg_mgr in ['dnf', 'dnf5']
    - desktop_effective == 'gnome'

- name: Install desktop packages (apt)
  when: ansible_pkg_mgr == 'apt'
  block:
    - name: Install desktop packages (apt)
      ansible.builtin.apt:
        name: "{{ desktop_apt_packages }}"
        state: present
        update_cache: true
      become: true
      tags: [become]
  rescue:
    - name: Warn apt desktop package install failed
      ansible.builtin.debug:
        msg: >-
          PACKAGE INSTALL FAILED: Install desktop packages in role desktop.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This may be a transient network error or missing repo access.
          Continuing playbook execution.

# --- Alacritty config ---
- name: Ensure Alacritty config directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/alacritty"
    state: directory
    mode: "0755"

- name: Deploy Alacritty config
  ansible.builtin.template:
    src: alacritty.toml.j2
    dest: "{{ ansible_user_dir }}/.config/alacritty/alacritty.toml"
    mode: "0644"

# --- i3 config ---
- name: Ensure i3 config directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/i3"
    state: directory
    mode: "0755"
  when: desktop_effective == 'i3'

- name: Deploy i3 config
  ansible.builtin.template:
    src: i3.config.j2
    dest: "{{ ansible_user_dir }}/.config/i3/config"
    mode: "0644"
  when: desktop_effective == 'i3'

# --- i3 TrackPoint config (X11 persistent, via xorg.conf.d) ---
- name: Ensure /etc/X11/xorg.conf.d exists (i3 TrackPoint)
  ansible.builtin.file:
    path: /etc/X11/xorg.conf.d
    state: directory
    mode: "0755"
  become: true
  tags: [become]
  when:
    - desktop_effective == 'i3'
    - desktop_i3_trackpoint_id is defined
    - desktop_i3_trackpoint_id

- name: Deploy TrackPoint libinput config (i3/X11)
  ansible.builtin.template:
    src: xorg-trackpoint.conf.j2
    dest: /etc/X11/xorg.conf.d/90-trackpoint.conf
    mode: "0644"
  become: true
  tags: [become]
  when:
    - desktop_effective == 'i3'
    - desktop_i3_trackpoint_id is defined
    - desktop_i3_trackpoint_id

# --- Sway config ---
- name: Ensure Sway config directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/sway"
    state: directory
    mode: "0755"
  when: desktop_effective == 'sway'

- name: Ensure Pictures directory exists for screenshots
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/Pictures"
    state: directory
    mode: "0755"
  when: desktop_effective in ['sway', 'i3']

- name: Deploy Sway config
  ansible.builtin.template:
    src: sway.config.j2
    dest: "{{ ansible_user_dir }}/.config/sway/config"
    mode: "0644"
  when: desktop_effective == 'sway'

- name: Ensure swaylock config directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/swaylock"
    state: directory
    mode: "0755"
  when: desktop_effective == 'sway'

- name: Deploy swaylock config (show-failed-attempts, indicator-caps-lock)
  ansible.builtin.template:
    src: swaylock.config.j2
    dest: "{{ ansible_user_dir }}/.config/swaylock/config"
    mode: "0644"
  when: desktop_effective == 'sway'

- name: Ensure xdg-desktop-portal config directory (Sway)
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/xdg-desktop-portal"
    state: directory
    mode: "0755"
  when: desktop_effective == 'sway'

- name: Deploy xdg-desktop-portal portals.conf (Sway screen sharing)
  ansible.builtin.copy:
    dest: "{{ ansible_user_dir }}/.config/xdg-desktop-portal/portals.conf"
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      [preferred]
      default=gtk
      org.freedesktop.impl.portal.Screenshot=wlr
      org.freedesktop.impl.portal.ScreenCast=wlr
  when: desktop_effective == 'sway'

# --- i3status config (shared by i3 and Sway) ---
- name: Ensure i3status config directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/i3status"
    state: directory
    mode: "0755"
  when: desktop_effective in ['i3', 'sway']

- name: Deploy i3status config
  ansible.builtin.template:
    src: i3status.conf.j2
    dest: "{{ ansible_user_dir }}/.config/i3status/config"
    mode: "0644"
  when: desktop_effective in ['i3', 'sway']

# --- Chrome managed policies ---
- name: Check for CSB-managed Chrome policies
  ansible.builtin.stat:
    path: /etc/opt/chrome/policies/managed/csb-chrome-policies.json
  register: desktop_csb_chrome
  when:
    - desktop_deploy_chrome_policies | default(false) | bool
    - ansible_system == 'Linux'

- name: Create Chrome managed policies directory
  ansible.builtin.file:
    path: /etc/opt/chrome/policies/managed
    state: directory
    mode: "0755"
  become: true
  tags: [become]
  when:
    - desktop_deploy_chrome_policies | default(false) | bool
    - ansible_system == 'Linux'
    - not (desktop_csb_chrome.stat.exists | default(false))

- name: Deploy Chrome security policy
  ansible.builtin.copy:
    src: chrome-security-policy.json
    dest: /etc/opt/chrome/policies/managed/security.json
    mode: "0644"
    validate: "python3 -c \"import json; json.load(open('%s'))\""
  become: true
  tags: [become]
  when:
    - desktop_deploy_chrome_policies | default(false) | bool
    - ansible_system == 'Linux'
    - not (desktop_csb_chrome.stat.exists | default(false))

- name: Create Chromium managed policies directory
  ansible.builtin.file:
    path: /etc/chromium/policies/managed
    state: directory
    mode: "0755"
  become: true
  tags: [become]
  when:
    - desktop_deploy_chrome_policies | default(false) | bool
    - ansible_system == 'Linux'
    - not (desktop_csb_chrome.stat.exists | default(false))

- name: Deploy Chromium security policy
  ansible.builtin.copy:
    src: chrome-security-policy.json
    dest: /etc/chromium/policies/managed/security.json
    mode: "0644"
    validate: "python3 -c \"import json; json.load(open('%s'))\""
  become: true
  tags: [become]
  when:
    - desktop_deploy_chrome_policies | default(false) | bool
    - ansible_system == 'Linux'
    - not (desktop_csb_chrome.stat.exists | default(false))

# --- Shell ---
- name: Set zsh as default shell
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: /bin/zsh
  become: true
  tags: [become]
  when:
    - ansible_system == 'Linux'
    - ansible_env.SHELL | default('/bin/bash') != '/bin/zsh'

# --- macOS: AeroSpace config ---
- name: Ensure AeroSpace config directory (macOS)
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/aerospace"
    state: directory
    mode: "0755"
  when: ansible_os_family == 'Darwin'

- name: Deploy AeroSpace config (macOS)
  ansible.builtin.template:
    src: aerospace.toml.j2
    dest: "{{ ansible_user_dir }}/.config/aerospace/aerospace.toml"
    mode: "0644"
  when: ansible_os_family == 'Darwin'

# --- macOS: defaults ---
- name: Set macOS defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
  loop: "{{ desktop_macos_defaults }}"
  loop_control:
    label: "{{ item.domain }} {{ item.key }}"
  when: ansible_os_family == 'Darwin'

# --- macOS: firewall ---
- name: Enable macOS firewall
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on
  changed_when: false
  become: true
  tags: [become]
  when: ansible_os_family == 'Darwin'
  failed_when: false

- name: Enable macOS firewall stealth mode
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on
  changed_when: false
  become: true
  tags: [become]
  when: ansible_os_family == 'Darwin'
  failed_when: false

# --- GNOME hardening (Linux only, GNOME desktops) ---
- name: Check if GNOME is installed
  ansible.builtin.command:
    cmd: gnome-shell --version
  register: desktop_gnome_check
  changed_when: false
  failed_when: false
  when: ansible_system == 'Linux'

- name: Disable notifications on lock screen
  community.general.dconf:
    key: /org/gnome/desktop/notifications/show-in-lock-screen
    value: "false"
  failed_when: false
  when:
    - ansible_system == 'Linux'
    - desktop_gnome_check.rc | default(1) == 0

- name: Ensure screen lock is enabled
  community.general.dconf:
    key: /org/gnome/desktop/screensaver/lock-enabled
    value: "true"
  failed_when: false
  when:
    - ansible_system == 'Linux'
    - desktop_gnome_check.rc | default(1) == 0

- name: Set screen idle timeout (CIS requires ≤900s; set to 300s)
  community.general.dconf:
    key: /org/gnome/desktop/session/idle-delay
    value: "uint32 300"
  failed_when: false
  when:
    - ansible_system == 'Linux'
    - desktop_gnome_check.rc | default(1) == 0

- name: Set screen lock delay after idle
  community.general.dconf:
    key: /org/gnome/desktop/screensaver/lock-delay
    value: "uint32 0"
  failed_when: false
  when:
    - ansible_system == 'Linux'
    - desktop_gnome_check.rc | default(1) == 0

- name: Disable location services
  community.general.dconf:
    key: /org/gnome/system/location/enabled
    value: "false"
  failed_when: false
  when:
    - ansible_system == 'Linux'
    - desktop_gnome_check.rc | default(1) == 0

- name: Disable recent files tracking
  community.general.dconf:
    key: /org/gnome/desktop/privacy/remember-recent-files
    value: "false"
  failed_when: false
  when:
    - ansible_system == 'Linux'
    - desktop_gnome_check.rc | default(1) == 0

- name: Disable GNOME RDP
  community.general.dconf:
    key: /org/gnome/desktop/remote-desktop/rdp/enable
    value: "false"
  failed_when: false
  when:
    - ansible_system == 'Linux'
    - desktop_gnome_check.rc | default(1) == 0

- name: Disable GNOME VNC
  community.general.dconf:
    key: /org/gnome/desktop/remote-desktop/vnc/enable
    value: "false"
  failed_when: false
  when:
    - ansible_system == 'Linux'
    - desktop_gnome_check.rc | default(1) == 0

- name: Set keyboard repeat delay (match Sway/i3 200ms)
  community.general.dconf:
    key: /org/gnome/desktop/peripherals/keyboard/repeat-delay
    value: "uint32 200"
  failed_when: false
  when:
    - ansible_system == 'Linux'
    - desktop_gnome_check.rc | default(1) == 0

- name: Set keyboard repeat interval (match Sway/i3 50 rep/s → 20ms)
  community.general.dconf:
    key: /org/gnome/desktop/peripherals/keyboard/repeat-interval
    value: "uint32 20"
  failed_when: false
  when:
    - ansible_system == 'Linux'
    - desktop_gnome_check.rc | default(1) == 0
