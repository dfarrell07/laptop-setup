---
# Chrome (Linux and macOS): docs/chrome.md. Three levels, each from its own variables:
#   default     recommended policies (desktop_chrome_policies_recommended), where this machine's Chrome policy is ours
#   enforced    mandatory policies (desktop_chrome_policies_enforced), Linux only, same condition
#   reconciled  Preferences of personal profiles (color scheme, site settings, and on a machine whose policy is not
#               ours the policy-equivalent preferences), plus the page zoom in every profile; written only while
#               Chrome is closed (it rewrites Preferences from memory), by files/chrome.py.
# Policy reaches every profile on a machine, the work profile too, so on a CSB laptop (IT owns Chrome policy) nothing
# is written under /etc and extensions are only audited.

- name: Combine the Chrome settings
  ansible.builtin.set_fact:
    _chrome_manage: "{{ desktop_chrome_manage | bool }}"
    _chrome_extensions: >-
      {{ (desktop_chrome_extensions + desktop_chrome_extensions_extra) if desktop_chrome_manage | bool else [] }}
    _chrome_policies: >-
      {{ (desktop_chrome_policies_recommended | combine(desktop_chrome_policies_recommended_extra) | dict2items
          | rejectattr('value', 'none') | items2dict) if desktop_chrome_manage | bool else {} }}
    _chrome_policies_enforced: "{{ desktop_chrome_policies_enforced if desktop_chrome_manage | bool else {} }}"

- name: Check the declared Chrome settings
  ansible.builtin.assert:
    that:
      - desktop_chrome_page_zoom | string is match('^([0-9]{2,3})?$')
      - desktop_chrome_page_zoom | string | length == 0 or 25 <= (desktop_chrome_page_zoom | int) <= 500
      - desktop_chrome_color_scheme in ['', 'dark', 'light', 'system']
      - _chrome_extensions | map(attribute='id') | select('match', '^[a-p]{32}$') | list | length
        == _chrome_extensions | length
      - _chrome_extensions | map(attribute='id') | unique | list | length == _chrome_extensions | length
    fail_msg: >-
      desktop_chrome_page_zoom must be a whole percent from 25 to 500 (or ''), desktop_chrome_color_scheme dark, light,
      system or '', and every desktop_chrome_extensions(_extra) id a Chrome Web Store ID (32 letters a-p) listed once.
    quiet: true

# --- Whose Chrome policy is this? Ours only when nobody else writes it: never on a CSB laptop, never beside another
# party's policy files (IT's Kerberos ones on an older work laptop), never under a macOS configuration profile. Two
# independent tests, so a wrong csb_detected alone cannot put our files next to IT's.
# Every file Chrome would load, symlinks and unreadable directories included: anything not found for sure counts
# as someone else's (fail closed; a symlinked managed/ or recommended/ directory therefore does too).
- name: Check for a Chrome policy directory (Linux)
  ansible.builtin.stat:
    path: /etc/opt/chrome/policies
  register: _chrome_policy_dir
  when: is_linux

- name: Find Chrome policy files (Linux)
  ansible.builtin.find:
    paths: [/etc/opt/chrome/policies]
    patterns: ['*']
    file_type: any
    hidden: true
    follow: true
    recurse: true
    depth: 3
  register: _chrome_policy_files
  when: is_linux and (_chrome_policy_dir.stat.exists | default(false))

# A configuration profile for Chrome, Chrome Browser Cloud Management enrollment, or MDM enrollment of the Mac.
- name: Find a Chrome configuration profile or cloud enrollment (macOS)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: ['/Library/Managed Preferences/com.google.Chrome.plist',
         "/Library/Managed Preferences/{{ ansible_facts['user_id'] }}/com.google.Chrome.plist",
         /Library/Google/Chrome/CloudManagementEnrollmentToken]
  register: _chrome_foreign_macos
  when: is_macos

- name: Check MDM enrollment (macOS)
  ansible.builtin.command:
    argv: [/usr/bin/profiles, status, -type, enrollment]
  register: _chrome_mdm
  changed_when: false
  failed_when: false
  check_mode: false
  when: is_macos

- name: Decide whether this machine's Chrome policy is ours
  ansible.builtin.set_fact:
    # Also only on a personal machine (profile: personal): on a work machine policy would reach a work profile even
    # where nothing else manages Chrome yet (CSB detection missed, IT's files not there yet).
    _chrome_policy_ours: >-
      {{ _chrome_manage and profile | default('work') == 'personal' and (
           (is_linux and not (csb_detected | bool) and _chrome_foreign_linux | length == 0
            and (_chrome_policy_files.skipped_paths | default({}) | length == 0))
           or (is_macos and _chrome_foreign_macos.results | default([]) | selectattr('stat.exists') | list | length == 0
               and (_chrome_mdm.rc | default(1)) == 0 and 'MDM enrollment: No' in (_chrome_mdm.stdout | default('')))) }}
    _chrome_state_dir: "{{ ansible_facts['user_dir'] }}/.config/laptop-setup"
    _chrome_own_linux: >-
      {{ _chrome_policy_paths
         | select('match', '^/etc/opt/chrome/policies/(managed|recommended)/laptop-setup\.json$') | list }}
  vars:
    # Every file there counts (an enrollment token too, a cloud-managed browser), except our own two.
    _chrome_policy_paths: >-
      {{ _chrome_policy_files.files | default([]) | rejectattr('isdir', 'true') | map(attribute='path') | list }}
    _chrome_foreign_linux: >-
      {{ _chrome_policy_paths
         | reject('match', '^/etc/opt/chrome/policies/(managed|recommended)/laptop-setup\.json$') | list }}

- name: Create the laptop-setup state directory
  ansible.builtin.file:
    path: "{{ _chrome_state_dir }}"
    state: directory
    mode: "0700"

# --- Default and enforced policy, Linux: one root-owned file per level, removed when its map is empty ---
- name: Chrome policy files (Linux)
  when: is_linux
  become: true
  tags: [become]
  block:
    - name: Create the Chrome policy directories
      ansible.builtin.file:
        path: "/etc/opt/chrome/policies/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: [recommended, managed]
      when: _chrome_policy_ours | bool

    - name: Write the Chrome policy files
      ansible.builtin.copy:
        content: "{{ item.policies | to_nice_json(sort_keys=true) }}\n"
        dest: "/etc/opt/chrome/policies/{{ item.level }}/laptop-setup.json"
        owner: root
        group: root
        mode: "0644"
      loop:
        - {level: recommended, policies: "{{ _chrome_policies }}"}
        - {level: managed, policies: "{{ _chrome_policies_enforced }}"}
      loop_control:
        label: "{{ item.level }}"
      when: _chrome_policy_ours | bool and item.policies | length > 0

    # Only our own file name, and only when it exists, so another party's policy directory is left alone.
    - name: Remove Chrome policy files that are no longer wanted
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ _chrome_own_linux }}"
      when: >-
        not (_chrome_policy_ours | bool)
        or (_chrome_policies if '/recommended/' in item else _chrome_policies_enforced) | length == 0

# --- Default policy, macOS: user defaults in com.google.Chrome load as recommended policy without MDM ---
- name: Chrome policies (macOS)
  when: is_macos
  vars:
    _chrome_keys_file: "{{ _chrome_state_dir }}/chrome-policy-keys.json"
    _chrome_mac_policies: >-
      {{ (_chrome_policies | dict2items | rejectattr('key', 'equalto', 'RestoreOnStartup') | items2dict)
         if _chrome_policy_ours | bool else {} }}
  block:
    - name: Check the macOS Chrome policy values
      ansible.builtin.assert:
        that: >-
          _chrome_mac_policies | dict2items | map(attribute='value') | reject('boolean') | reject('integer')
          | reject('string') | list | length == 0
        fail_msg: On macOS desktop_chrome_policies_recommended values must be booleans, integers or strings.
        quiet: true

    - name: Read the Chrome policy keys set before
      ansible.builtin.slurp:
        src: "{{ _chrome_keys_file }}"
      register: _chrome_keys_before
      failed_when: false

    - name: Remove Chrome policies no longer declared
      community.general.osx_defaults:
        domain: com.google.Chrome
        key: "{{ item }}"
        state: absent
      loop: >-
        {{ (_chrome_keys_before.content | default('W10=') | b64decode | from_yaml | default([], true))
           | select('string') | select('match', '^[A-Za-z0-9]+$') | difference(_chrome_mac_policies.keys() | list) }}

    - name: Set the Chrome policies
      community.general.osx_defaults:
        domain: com.google.Chrome
        key: "{{ item.key }}"
        type: "{{ 'bool' if item.value is boolean else ('int' if item.value is integer else 'string') }}"
        value: "{{ item.value }}"
      loop: "{{ _chrome_mac_policies | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Record the Chrome policy keys set
      ansible.builtin.copy:
        content: "{{ _chrome_mac_policies.keys() | list | sort | to_json }}\n"
        dest: "{{ _chrome_keys_file }}"
        mode: "0600"

    - name: Note that enforced Chrome policies need MDM on macOS
      ansible.builtin.debug:
        msg: >-
          NOTE: desktop_chrome_policies_enforced is not applied on macOS: without MDM or a configuration profile Chrome
          reads only recommended policy here.
      when: _chrome_policies_enforced | length > 0

# --- Extensions: external-extension files (Web Store; Chrome installs them, the user can remove them) ---
- name: Chrome external extensions
  vars:
    _chrome_ext_dir: >-
      {{ '/Library/Application Support/Google/Chrome/External Extensions' if is_macos
         else '/usr/share/google-chrome/extensions' }}
    _chrome_ext_state: "{{ _chrome_state_dir }}/chrome-external-extensions.json"
    # Declared to install (empty with desktop_chrome_manage: false); written only where machine policy is ours
    _chrome_ext_declared: >-
      {{ _chrome_extensions | rejectattr('install', 'defined') | map(attribute='id') | list
         + _chrome_extensions | selectattr('install', 'defined') | selectattr('install') | map(attribute='id') | list }}
    _chrome_ext_want_all: "{{ _chrome_ext_declared if _chrome_policy_ours | bool else [] }}"
    # IDs this role wrote before, from its state file (validated: it is user-writable and drives root deletions)
    _chrome_ext_before_ids: >-
      {{ (_chrome_ext_before.content | default('W10=') | b64decode | from_yaml | default([], true))
         | select('string') | select('match', '^[a-p]{32}$') | list }}
    # A file the distribution ships (Fedora's GNOME Shell integration) belongs to its package: never written or removed
    _chrome_ext_owned_ids: >-
      {{ _chrome_ext_owned.stdout_lines | default([]) | map('basename') | map('regex_replace', '\.json$', '') | list }}
    _chrome_ext_want: "{{ _chrome_ext_want_all | difference(_chrome_ext_owned_ids) }}"
    _chrome_ext_remove: >-
      {{ _chrome_ext_before_ids | difference(_chrome_ext_declared) | difference(_chrome_ext_owned_ids) }}
  when: is_linux or is_macos
  block:
    - name: Read the Chrome external extensions written before
      ansible.builtin.slurp:
        src: "{{ _chrome_ext_state }}"
      register: _chrome_ext_before
      failed_when: false

    - name: Find Chrome external extension files a package owns (Linux)
      ansible.builtin.command:
        argv: >-
          {{ ['sh', '-c', 'for f; do [ -e "$f" ] || continue;
               if rpm -qf "$f" >/dev/null 2>&1 || dpkg -S "$f" >/dev/null 2>&1; then echo "$f"; fi; done', 'sh']
             + ((_chrome_ext_declared + _chrome_ext_before_ids) | unique
                | map('regex_replace', '^', _chrome_ext_dir ~ '/') | map('regex_replace', '$', '.json') | list) }}
      register: _chrome_ext_owned
      changed_when: false
      check_mode: false
      when: is_linux

    - name: Write and remove Chrome external extension files
      become: true
      tags: [become]
      block:
        - name: Create the Chrome external extensions directory
          ansible.builtin.file:
            path: "{{ _chrome_ext_dir }}"
            state: directory
            mode: "0755"
          when: _chrome_ext_want | length > 0

        - name: Write a Chrome external extension file per extension
          ansible.builtin.copy:
            content: "{{ {'external_update_url': 'https://clients2.google.com/service/update2/crx'} | to_json }}\n"
            dest: "{{ _chrome_ext_dir }}/{{ item }}.json"
            mode: "0644"
          loop: "{{ _chrome_ext_want }}"

        # Only files this role wrote (its state file), never a package's, and only once dropped from the list (or with
        # desktop_chrome_manage: false): when this machine's policy stops being ours they stay, since removing one
        # makes Chrome uninstall that extension with its data.
        - name: Remove Chrome external extension files no longer declared
          ansible.builtin.file:
            path: "{{ _chrome_ext_dir }}/{{ item }}.json"
            state: absent
          loop: "{{ _chrome_ext_remove }}"

    # Tagged like the root writes, so a NOSUDO=1 run that skips them does not record them either.
    - name: Record the Chrome external extensions written
      ansible.builtin.copy:
        content: "{{ (_chrome_ext_before_ids | difference(_chrome_ext_remove) + _chrome_ext_want) | unique | sort | to_json }}\n"
        dest: "{{ _chrome_ext_state }}"
        mode: "0600"
      tags: [become]

    - name: Warn that Chrome extension files from an earlier run are kept
      ansible.builtin.debug:
        msg: >-
          WARNING: this machine's Chrome policy is no longer ours (docs/chrome.md), so nothing new is installed, but the
          extension files written before stay in {{ _chrome_ext_dir }} ({{ _chrome_ext_kept | join(', ') }}): removing
          them would uninstall those extensions, with their data, from every profile. Delete them by hand if wanted.
      vars:
        _chrome_ext_kept: "{{ _chrome_ext_before_ids | difference(_chrome_ext_remove) | difference(_chrome_ext_want) }}"
      when: _chrome_ext_kept | length > 0

# --- Reconciled level and page zoom: files/chrome.py on the rendered settings ---
- name: Chrome profile settings
  vars:
    _chrome_spec_file: "{{ _chrome_state_dir }}/chrome.json"
    _chrome_spec: >-
      {{ {'user_data_dir': desktop_chrome_user_data_dir,
          'state_dir': _chrome_state_dir,
          'zoom_percent': (desktop_chrome_page_zoom | int) if desktop_chrome_page_zoom | string | length > 0 else none,
          'personal_domains': desktop_chrome_personal_domains if _chrome_manage else [],
          'policy_is_ours': _chrome_policy_ours | bool,
          'policies': _chrome_policies,
          'policies_enforced': _chrome_policies_enforced if is_linux else {},
          'color_scheme': desktop_chrome_color_scheme if _chrome_manage else '',
          'site_settings': desktop_chrome_site_settings if _chrome_manage else {},
          'default_site_settings': desktop_chrome_default_site_settings if _chrome_manage else {},
          'extensions': _chrome_extensions} }}
    _chrome_helper: >-
      {{ [ansible_facts.get('python', {}).get('executable', 'python3'), '-I', '-c',
          lookup('ansible.builtin.file', role_path ~ '/files/chrome.py')] }}
  block:
    # No secrets: the smoke checks and make chrome-extensions read the same file.
    - name: Write the Chrome settings for the helper
      ansible.builtin.copy:
        content: "{{ _chrome_spec | to_nice_json(sort_keys=true) }}\n"
        dest: "{{ _chrome_spec_file }}"
        mode: "0600"

    - name: Set Chrome's profile settings
      ansible.builtin.command:
        argv: "{{ _chrome_helper + ['prefs', '-'] + (['--check'] if ansible_check_mode else []) }}"
        stdin: "{{ _chrome_spec | to_json }}"
      register: _chrome_prefs
      changed_when: _chrome_prefs.stdout | trim == 'changed'
      check_mode: false

    - name: Warn that Chrome must be closed to set its profile settings
      ansible.builtin.debug:
        msg: >-
          WARNING: Chrome is running, so its profile settings (page zoom, color scheme, site settings) were not set:
          quit Chrome ({{ 'Cmd-Q' if is_macos else 'every window' }}), then run make apply CHUNK=chrome again.
      when: _chrome_prefs.stdout | trim == 'running'

    - name: Warn that Chrome's data cannot be read
      ansible.builtin.debug:
        msg: >-
          WARNING: Chrome's data directory {{ desktop_chrome_user_data_dir }} cannot be read, so its profile settings
          were not set.{{ ' On macOS give the terminal Full Disk Access (System Settings > Privacy & Security), then
          run make apply CHUNK=chrome again.' if is_macos else '' }}
      when: _chrome_prefs.stdout | trim == 'blocked'

    - name: Audit Chrome's personal-profile extensions
      ansible.builtin.command:
        argv: "{{ _chrome_helper + ['extensions', '-'] }}"
        stdin: "{{ _chrome_spec | to_json }}"
      register: _chrome_ext_audit
      changed_when: false
      check_mode: false
      when: _chrome_manage

    - name: Report Chrome extension differences
      ansible.builtin.debug:
        msg: >-
          WARNING: Chrome personal-profile extensions differ from desktop_chrome_extensions:
          {{ _chrome_ext_audit.stdout_lines | join('; ') }}.
          {{ 'Missing ones: make chrome-extensions opens them in their profile.' if not (_chrome_policy_ours | bool)
             else 'Missing ones install at the next Chrome start once a sudo run has written their files; one the user
             removed stays removed in that profile.' }}
      when: _chrome_manage and _chrome_ext_audit.stdout | trim not in ['ok', 'absent', 'blocked']
