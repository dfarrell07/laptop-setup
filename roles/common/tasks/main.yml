---
# roles/common/tasks/main.yml
# OS detection, CSB detection, prerequisite directories.

- name: Set project root for include paths
  ansible.builtin.set_fact:
    common_project_root: >-
      {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
         | default(playbook_dir, true) }}

- name: Ensure prerequisite directories exist (group/world traversable)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_facts['user_dir'] }}/.config/git"
    - "{{ ansible_facts['user_dir'] }}/.config/git/template/hooks"
    - "{{ ansible_facts['user_dir'] }}/.local/bin"
    - "{{ ansible_facts['user_dir'] }}/.local/share"
    - "{{ ansible_facts['user_dir'] }}/bin"

- name: Ensure user-private XDG directories exist (mode 0700 — group-readable $HOME)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ ansible_facts['user_dir'] }}/.local/state"
    - "{{ ansible_facts['user_dir'] }}/.cache"

- name: Ensure Linux-only prerequisite directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_facts['user_dir'] }}/.config/systemd/user"
    - "{{ ansible_facts['user_dir'] }}/.config/environment.d"
    - "{{ ansible_facts['user_dir'] }}/.config/user-tmpfiles.d"
  when:
    - ansible_facts['system'] == 'Linux'
    - not system_is_container | default(false)  # ~/.config/systemd/user triggers systemd user inotify; crashes Debian 13 container PID 1
