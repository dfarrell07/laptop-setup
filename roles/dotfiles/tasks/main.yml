---
# roles/dotfiles/tasks/main.yml
# Deploy configuration files (copy + template), OS-conditional.

- name: Ensure user config directories exist (mode 0700)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ ansible_facts['user_dir'] }}/.config/claude"
    - "{{ ansible_facts['user_dir'] }}/.local/state/zsh"
    - "{{ ansible_facts['user_dir'] }}/tmp"
    - "{{ ansible_facts['user_dir'] }}/.config/gh"
    - "{{ ansible_facts['user_dir'] }}/.ssh"

- name: Ensure user config directories exist (mode 0755)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_facts['user_dir'] }}/.config/git/template/hooks"
    - "{{ ansible_facts['user_dir'] }}/.config/ripgrep"
    - "{{ ansible_facts['user_dir'] }}/.config/tmux"
    - "{{ ansible_facts['user_dir'] }}/.config/nvim"
    - "{{ ansible_facts['user_dir'] }}/.config/direnv"
    - "{{ ansible_facts['user_dir'] }}/.config/user-tmpfiles.d"

- name: Stat oh-my-zsh dest directory
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/oh-my-zsh"
  register: _dotfiles_ohmyzsh_dest

- name: Stat oh-my-zsh .git directory
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/oh-my-zsh/.git"
  register: _dotfiles_ohmyzsh_git

- name: Remove corrupted oh-my-zsh directory (non-git dest) to allow clean clone
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/oh-my-zsh"
    state: absent
  when:
    - _dotfiles_ohmyzsh_dest.stat.exists
    - not _dotfiles_ohmyzsh_git.stat.exists

- name: Install oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/oh-my-zsh"
    version: "{{ dotfiles_ohmyzsh_version }}"
    depth: 100
    update: false
  register: dotfiles_ohmyzsh_result
  timeout: 120
  # ignore_errors (not failed_when: false): .failed must remain True on clone failure —
  # it guards the warning below (line 18) and the legacy ~/.oh-my-zsh removal (line 39).
  # failed_when: false would always set .failed=False, silently breaking that guard.
  ignore_errors: true

- name: Warn if oh-my-zsh clone failed
  ansible.builtin.debug:
    msg: "WARNING: oh-my-zsh clone failed (network issue?). Zsh config will deploy but OMZ features won't work until cloned."
  when: dotfiles_ohmyzsh_result.failed

- name: Install forgit oh-my-zsh plugin (not bundled — requires separate clone)
  ansible.builtin.git:
    repo: https://github.com/wfxr/forgit.git
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/oh-my-zsh/custom/plugins/forgit"
    version: "{{ dotfiles_forgit_version }}"
    depth: 1
    update: false
  register: dotfiles_forgit_result
  failed_when: false
  timeout: 60
  when: not dotfiles_ohmyzsh_result.failed

- name: Warn if forgit clone failed
  ansible.builtin.debug:
    msg: "WARNING: forgit plugin clone failed. Git fuzzy UI (glo, gcb, gd aliases) won't be available."
  when: dotfiles_forgit_result.rc | default(0) != 0

- name: Remove legacy ~/.oh-my-zsh (migrated to XDG path)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh"
    state: absent
  when: not (dotfiles_ohmyzsh_result.failed)

- name: Ensure macOS SSH sockets directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.ssh/sockets"
    state: directory
    mode: "0700"
  when: is_macos

- name: Deploy zshrc
  ansible.builtin.template:
    src: zshrc.j2
    dest: "{{ ansible_facts['user_dir'] }}/.zshrc"
    mode: "0644"

- name: Check if legacy ~/.gitconfig exists
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.gitconfig"
  register: dotfiles_legacy_gitconfig

- name: Back up legacy ~/.gitconfig before XDG migration
  ansible.builtin.copy:
    src: "{{ ansible_facts['user_dir'] }}/.gitconfig"
    dest: "{{ ansible_facts['user_dir'] }}/.gitconfig.pre-xdg-migration"
    remote_src: true
    mode: "0644"
    force: false
  when:
    - dotfiles_legacy_gitconfig.stat.exists

- name: Remove legacy ~/.gitconfig when migrating to XDG path
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.gitconfig"
    state: absent
  when: dotfiles_legacy_gitconfig.stat.exists

- name: Deploy gitconfig
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/git/config"
    mode: "0644"
- name: Deploy gitleaks pre-commit hook
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.config/git/template/hooks/pre-commit"
    mode: "0755"
    content: |
      #!/bin/sh
      # Use '# gitleaks:allow' on a line to suppress a false positive
      _gitleaks_rc=0
      if command -v gitleaks >/dev/null 2>&1; then
        gitleaks git --pre-commit --staged --redact --max-decode-depth 2
        _gitleaks_rc=$?
      else
        echo "WARNING: gitleaks not found — secret scanning skipped (run 'make all' to install)" >&2
      fi
      # Chain to per-repo hook if one exists (core.hooksPath replaces .git/hooks/ lookup).
      # Per-repo hook failure blocks the commit; gitleaks failure also blocks even if per-repo hook passes.
      _repo_hook="$(git rev-parse --git-dir 2>/dev/null)/hooks/pre-commit"
      if [ -f "$_repo_hook" ]; then
        "$_repo_hook" || exit $?
      fi
      exit $_gitleaks_rc

- name: Deploy commit-msg hook
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.config/git/template/hooks/commit-msg"
    mode: "0755"
    content: |
      #!/bin/sh
      msg=$(head -1 "$1")
      first=$(echo "$msg" | awk '{print $1}')
      first="${first%:}"
      desc_first=$(echo "$msg" | sed 's/^[-A-Za-z/]*:[[:space:]]*//' | awk '{print $1}')

      case "$msg" in
        squash!*|fixup!*|amend!*) exit 0 ;;
        Merge\ branch*|Merge\ pull*|Merge\ remote*) exit 0 ;;
      esac

      if ! echo "$msg" | grep -qE '^[A-Z]'; then
        echo "ERROR: Capitalize the subject line" >&2
        exit 1
      fi

      _bad_word() {
        case "$1" in
          Added|Changed|Created|Deleted|Enabled|Disabled|Expanded|Fixed|\
          Implemented|Improved|Merged|Moved|Refactored|Removed|Renamed|\
          Replaced|Resolved|Reverted|Started|Stopped|Updated|Upgraded|\
          Adding|Changing|Creating|Deleting|Enabling|Disabling|Expanding|\
          Fixing|Implementing|Improving|Merging|Moving|Refactoring|Removing|\
          Renaming|Replacing|Resolving|Reverting|Starting|Stopping|Updating|\
          Upgrading) return 0 ;;
          *) return 1 ;;
        esac
      }
      if _bad_word "$desc_first"; then
        echo "ERROR: Use imperative mood ('$desc_first' is not imperative)" >&2
        echo "  Write 'Scope: fix ...' not 'Scope: Fixed/Fixing ...'" >&2
        exit 1
      fi
      if [ "$desc_first" != "$first" ] && _bad_word "$first"; then
        echo "ERROR: Use imperative mood ('$first' is not imperative)" >&2
        exit 1
      fi

      len=$(printf '%s' "$msg" | wc -m)
      if [ "$len" -gt 72 ]; then
        echo "ERROR: Subject too long ($len > 72 chars)" >&2
        exit 1
      fi

      if echo "$msg" | grep -qE '\.$'; then
        echo "ERROR: No trailing period on subject line" >&2
        exit 1
      fi

      if ! grep -q '^Signed-off-by:' "$1"; then
        echo "ERROR: Missing Signed-off-by — use 'git commit -s'" >&2
        exit 1
      fi

      if command -v npx >/dev/null 2>&1; then
        npx --no -- commitlint --edit "$1"
      else
        echo "WARNING: npx not found — commitlint skipped. Run make bootstrap to install Node.js deps." >&2
      fi

- name: Deploy prepare-commit-msg chain-stub hook
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.config/git/template/hooks/prepare-commit-msg"
    mode: "0755"
    content: |
      #!/bin/sh
      # Chain to per-repo prepare-commit-msg hook if one exists (core.hooksPath replaces .git/hooks/ lookup).
      _repo_hook="$(git rev-parse --git-dir 2>/dev/null)/hooks/prepare-commit-msg"
      if [ -f "$_repo_hook" ]; then
        exec "$_repo_hook" "$@"
      fi

- name: Deploy pre-push chain-stub hook
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.config/git/template/hooks/pre-push"
    mode: "0755"
    content: |
      #!/bin/sh
      # Chain to per-repo pre-push hook if one exists (core.hooksPath replaces .git/hooks/ lookup).
      # $1=remote name, $2=remote URL; refs being pushed arrive on stdin.
      # exec forwards positional args and inherits stdin from the caller.
      _repo_hook="$(git rev-parse --git-dir 2>/dev/null)/hooks/pre-push"
      if [ -f "$_repo_hook" ]; then
        exec "$_repo_hook" "$@"
      fi

- name: Deploy gh CLI config
  ansible.builtin.copy:
    content: |
      git_protocol: https
      editor: nvim
      prompt: enabled
      aliases:
        co: pr checkout
    dest: "{{ ansible_facts['user_dir'] }}/.config/gh/config.yml"
    mode: "0600"
    force: false

- name: Deploy git conditional includes
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ansible_facts['user_dir'] }}/.config/git/{{ item }}"
    mode: "0644"
  loop:
    - config-work
    - config-personal

- name: Deploy global gitignore
  ansible.builtin.template:
    src: gitignore_global.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/git/ignore"
    mode: "0644"
- name: Deploy ripgreprc
  ansible.builtin.template:
    src: ripgreprc.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/ripgrep/config"
    mode: "0644"
- name: Deploy tmux.conf
  ansible.builtin.template:
    src: tmux.conf.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/tmux/tmux.conf"
    mode: "0644"

- name: Check if legacy ~/.tmux.conf exists
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.tmux.conf"
  register: _dotfiles_legacy_tmux

- name: Remove legacy ~/.tmux.conf (migrated to XDG path)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.tmux.conf"
    state: absent
  when: _dotfiles_legacy_tmux.stat.exists

- name: Deploy vimrc
  ansible.builtin.copy:
    src: vimrc
    dest: "{{ ansible_facts['user_dir'] }}/.vimrc"
    mode: "0644"
- name: Deploy nvim init.vim (sources ~/.vimrc)
  ansible.builtin.copy:
    content: |
      " Managed by Ansible — edit roles/dotfiles/files/vimrc
      source ~/.vimrc
    dest: "{{ ansible_facts['user_dir'] }}/.config/nvim/init.vim"
    mode: "0644"
- name: Deploy bashrc
  ansible.builtin.template:
    src: bashrc.j2
    dest: "{{ ansible_facts['user_dir'] }}/.bashrc"
    mode: "0644"
- name: Ensure autostart config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/autostart"
    state: directory
    mode: "0755"
  when: is_linux

- name: Disable GNOME Keyring SSH agent autostart (legacy XDG path)
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      Hidden=true
    dest: "{{ ansible_facts['user_dir'] }}/.config/autostart/gnome-keyring-ssh.desktop"
    mode: "0644"
  when: is_linux

- name: Stop and mask gcr-ssh-agent (GNOME 50+ activates via gnome-session-services.target)
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    state: stopped
    masked: true
  loop:
    - gcr-ssh-agent.socket
    - gcr-ssh-agent.service
  when:
    - is_linux
    - not (csb_restricted)  # Only skip on fapolicyd-enforcing CSB (smart-card/PIV auth via gcr)
    - not (system_is_container | default(false))  # scope:user systemd crashes containers; virtualization_type unreliable in nested-VM CI
  failed_when: false

- name: Deploy SSH agent systemd user service
  ansible.builtin.template:
    src: ssh-agent.service.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/ssh-agent.service"
    mode: "0644"
  when:
    - is_linux
    - not (system_is_container | default(false))  # ~/.config/systemd/user does not exist in containers; user systemd scope unused in CI
  notify: Restart ssh-agent

- name: Enable SSH agent user service
  ansible.builtin.systemd:
    name: ssh-agent
    scope: user
    state: started
    enabled: true
    daemon_reload: true
  when:
    - is_linux
    - not (system_is_container | default(false))  # scope:user systemd crashes containers; virtualization_type unreliable in nested-VM CI
  register: _dotfiles_ssh_agent_enable
  failed_when: false

- name: Warn if SSH agent enable failed
  ansible.builtin.debug:
    msg: >-
      WARNING: SSH agent user service could not be enabled (no systemd --user?).
      SSH_AUTH_SOCK will point to a non-existent socket until reboot into a full session.
  when: _dotfiles_ssh_agent_enable.rc | default(0) != 0

- name: Deploy SSH agent environment.d config
  ansible.builtin.copy:
    content: "SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket\n"
    dest: "{{ ansible_facts['user_dir'] }}/.config/environment.d/ssh-agent.conf"
    mode: "0644"
  when:
    - is_linux
    - not (system_is_container | default(false))

- name: Deploy GOTMPDIR environment.d config (go test under sudo and non-interactive make)
  ansible.builtin.copy:
    content: "GOTMPDIR=$HOME/tmp\n"
    dest: "{{ ansible_facts['user_dir'] }}/.config/environment.d/gotmpdir.conf"
    mode: "0644"
  when:
    - is_linux
    - not (system_is_container | default(false))

# --- macOS: SSH agent via launchd ---
- name: Disable Apple built-in ssh-agent (macOS)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "launchctl disable user/{{ ansible_facts['user_uid'] }}/com.openssh.ssh-agent"
  changed_when: false
  failed_when: false
  when: is_macos

- name: Ensure log directory exists (macOS)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/state/log"
    state: directory
    mode: "0755"
  when: is_macos

- name: Ensure LaunchAgents directory exists (macOS)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents"
    state: directory
    mode: "0755"
  when: is_macos

- name: Deploy SSH agent launchd plist (macOS)
  ansible.builtin.template:
    src: ssh-agent.plist.j2
    dest: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.ssh-agent.plist"
    mode: "0644"
  when: is_macos
  notify: Reload ssh-agent launchd (macOS)

- name: Load SSH agent launchd plist (macOS)  # noqa: command-instead-of-module
  # 'launchctl bootstrap' is the modern replacement for the deprecated
  # 'launchctl load -w' (deprecated since macOS 10.10 Yosemite).
  # rc==0 means newly bootstrapped (changed); rc!=0 means already running (no change).
  # failed_when: false handles the non-zero exit when the agent is already bootstrapped.
  ansible.builtin.command:
    cmd: >-
      launchctl bootstrap gui/{{ ansible_facts['user_uid'] }}
      {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.ssh-agent.plist
  when: is_macos
  register: _dotfiles_ssh_agent_bootstrap_result
  changed_when: _dotfiles_ssh_agent_bootstrap_result.rc == 0
  failed_when: false

- name: Check if SSH supports post-quantum KEX
  ansible.builtin.command:
    cmd: ssh -Q kex
  register: dotfiles_ssh_kex_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode to avoid false-positive diff

- name: Set PQ KEX availability fact
  ansible.builtin.set_fact:
    dotfiles_ssh_kex_pq_enabled: "{{ 'mlkem768x25519-sha256' in dotfiles_ssh_kex_check.stdout }}"

- name: Assert real_user_id matches valid Linux username character set
  ansible.builtin.assert:
    that:
      - real_user_id | default('') | length > 0
      - real_user_id is regex('^[a-z_][a-z0-9_.@-]{0,31}$')
    fail_msg: >-
      real_user_id='{{ real_user_id | default("(empty)") }}' contains characters
      outside the allowed set or is empty. A newline or space in USER would inject
      arbitrary directives into ~/.ssh/config. Correct the USER environment variable
      before re-running.
  when: profile == 'work'

- name: Deploy SSH client config
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ ansible_facts['user_dir'] }}/.ssh/config"
    mode: "0600"
- name: Deploy socket tmpfiles configs (ssh, tmux)
  ansible.builtin.copy:
    content: "d %t/{{ item }} 0700 - - -\n"
    dest: "{{ ansible_facts['user_dir'] }}/.config/user-tmpfiles.d/{{ item }}-sockets.conf"
    mode: "0644"
  loop: [ssh, tmux]
  when: is_linux

# /run/user/$UID is a tmpfs cleared on reboot; the user-tmpfiles.d configs deployed
# above recreate these dirs on every login via systemd-tmpfiles. These tasks only
# ensure the dirs exist immediately during the current Ansible session (before reboot).
# The file module truthfully reports changed when the dir is absent and must be created.
- name: Create socket directories in XDG runtime dir
  ansible.builtin.file:
    path: "/run/user/{{ ansible_facts['user_uid'] }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: [ssh, tmux]
  when: is_linux

- name: Deploy safe direnv config
  ansible.builtin.copy:
    content: |
      # strict_env enables set -euo pipefail during .envrc evaluation:
      # unset variables become errors and pipeline failures propagate.
      # The outer shell environment (PATH, GOPATH, KUBECONFIG, etc.) is still inherited.
      # Example minimal .envrc: PATH_add bin
      [global]
      strict_env = true
      disable_stdin = true
      warn_timeout = "10s"
    dest: "{{ ansible_facts['user_dir'] }}/.config/direnv/direnv.toml"
    mode: "0644"
- name: Deploy direnv user stdlib (direnvrc with layout_go)
  ansible.builtin.copy:
    src: direnvrc
    dest: "{{ ansible_facts['user_dir'] }}/.config/direnv/direnvrc"
    mode: "0644"
- name: Set .npmrc permissions if exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.npmrc"
    mode: "0600"
  failed_when: false

- name: Harden credential directory permissions
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0700"
  loop:
    - "{{ ansible_facts['user_dir'] }}/.aws"
    - "{{ ansible_facts['user_dir'] }}/.config/gcloud"
    - "{{ ansible_facts['user_dir'] }}/.kube"
  failed_when: false

- name: Deploy Claude work-env file
  ansible.builtin.copy:
    content: |
      export CLAUDE_CONFIG_DIR=~/.claude-work
      # Uncomment after adding companion vars (ANTHROPIC_VERTEX_PROJECT_ID, CLOUD_ML_REGION, GOOGLE_CLOUD_PROJECT):
      # export CLAUDE_CODE_USE_VERTEX=1
      # export ANTHROPIC_VERTEX_PROJECT_ID=...
    dest: "{{ ansible_facts['user_dir'] }}/.config/claude/work-env"
    mode: "0600"
    force: false
  when: profile == 'work'
