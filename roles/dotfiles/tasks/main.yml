---
# roles/dotfiles/tasks/main.yml
# Deploy configuration files (copy + template), OS-conditional.

- name: Install oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ ansible_user_dir }}/.local/share/oh-my-zsh"
    version: "70ad5e3df8f7bed68aa6672029496926e632aedd"
    depth: 100
    update: false
  register: dotfiles_ohmyzsh_result
  failed_when: false

- name: Warn if oh-my-zsh clone failed
  ansible.builtin.debug:
    msg: "WARNING: oh-my-zsh clone failed (network issue?). Zsh config will deploy but OMZ features won't work until cloned."
  when: dotfiles_ohmyzsh_result.failed | default(false)

- name: Install forgit oh-my-zsh plugin (not bundled — requires separate clone)
  ansible.builtin.git:
    repo: https://github.com/wfxr/forgit.git
    dest: "{{ ansible_user_dir }}/.local/share/oh-my-zsh/custom/plugins/forgit"
    version: main
    depth: 1
    update: false
  register: dotfiles_forgit_result
  failed_when: false

- name: Warn if forgit clone failed
  ansible.builtin.debug:
    msg: "WARNING: forgit plugin clone failed. Git fuzzy UI (glo, gcb, gd aliases) won't be available."
  when: dotfiles_forgit_result.failed | default(false)

- name: Remove legacy ~/.oh-my-zsh (migrated to XDG path)
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.oh-my-zsh"
    state: absent
  when: not (dotfiles_ohmyzsh_result.failed | default(false))

- name: Ensure macOS SSH sockets directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.ssh/sockets"
    state: directory
    mode: "0700"
  when: ansible_system != 'Linux'

- name: Ensure Linux-only config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_user_dir }}/.config/user-tmpfiles.d"
    - "{{ ansible_user_dir }}/.config/environment.d"
    - "{{ ansible_user_dir }}/.config/systemd/user"
  when: ansible_system == 'Linux'


- name: Ensure Claude config directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/claude"
    state: directory
    mode: "0700"

- name: Ensure zsh XDG state directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.local/state/zsh"
    state: directory
    mode: "0700"

- name: Ensure ~/tmp exists for GOTMPDIR (go test exec path must not be noexec)
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/tmp"
    state: directory
    mode: "0700"

- name: Deploy zshrc
  ansible.builtin.template:
    src: zshrc.j2
    dest: "{{ ansible_user_dir }}/.zshrc"
    mode: "0644"
    backup: true

- name: Ensure ~/.config/git directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/git"
    state: directory
    mode: "0755"

- name: Check if gitconfig exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/git/config"
  register: dotfiles_gitconfig

- name: Back up legacy ~/.gitconfig before XDG migration
  ansible.builtin.copy:
    src: "{{ ansible_user_dir }}/.gitconfig"
    dest: "{{ ansible_user_dir }}/.gitconfig.pre-xdg-migration"
    remote_src: true
    mode: "0644"
  when:
    - not dotfiles_gitconfig.stat.exists

- name: Remove legacy ~/.gitconfig when migrating to XDG path
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.gitconfig"
    state: absent
  when: not dotfiles_gitconfig.stat.exists

- name: Deploy gitconfig
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ ansible_user_dir }}/.config/git/config"
    mode: "0644"
    backup: true

- name: Ensure git global hook template directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/git/template/hooks"
    state: directory
    mode: "0755"

- name: Deploy gitleaks pre-commit hook
  ansible.builtin.copy:
    dest: "{{ ansible_user_dir }}/.config/git/template/hooks/pre-commit"
    mode: "0755"
    backup: true
    content: |
      #!/bin/sh
      # Use '# gitleaks:allow' on a line to suppress a false positive
      _gitleaks_rc=0
      if command -v gitleaks >/dev/null 2>&1; then
        gitleaks git --pre-commit --staged --redact --max-decode-depth 2
        _gitleaks_rc=$?
      else
        echo "WARNING: gitleaks not found — secret scanning skipped (run 'make all' to install)" >&2
      fi
      # Chain to per-repo hook if one exists (core.hooksPath replaces .git/hooks/ lookup).
      # Per-repo hook failure blocks the commit; gitleaks failure also blocks even if per-repo hook passes.
      _repo_hook="$(git rev-parse --git-dir 2>/dev/null)/hooks/pre-commit"
      if [ -f "$_repo_hook" ]; then
        "$_repo_hook" || exit $?
      fi
      exit $_gitleaks_rc

- name: Ensure gh config directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/gh"
    state: directory
    mode: "0700"

- name: Check if gh config exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/gh/config.yml"
  register: dotfiles_gh_config

- name: Deploy gh CLI config
  ansible.builtin.copy:
    content: |
      git_protocol: https
      editor: nvim
      prompt: enabled
      aliases:
        co: pr checkout
    dest: "{{ ansible_user_dir }}/.config/gh/config.yml"
    mode: "0600"
    backup: true
  when: not dotfiles_gh_config.stat.exists

- name: Deploy git conditional includes
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ansible_user_dir }}/.config/git/{{ item }}"
    mode: "0644"
    backup: true
  loop:
    - config-work
    - config-personal

- name: Deploy global gitignore
  ansible.builtin.template:
    src: gitignore_global.j2
    dest: "{{ ansible_user_dir }}/.config/git/ignore"
    mode: "0644"
    backup: true

- name: Ensure ripgrep config directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/ripgrep"
    state: directory
    mode: "0755"

- name: Deploy ripgreprc
  ansible.builtin.template:
    src: ripgreprc.j2
    dest: "{{ ansible_user_dir }}/.config/ripgrep/config"
    mode: "0644"
    backup: true

- name: Ensure tmux config directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/tmux"
    state: directory
    mode: "0755"

- name: Deploy tmux.conf
  ansible.builtin.template:
    src: tmux.conf.j2
    dest: "{{ ansible_user_dir }}/.config/tmux/tmux.conf"
    mode: "0644"
    backup: true

- name: Deploy vimrc
  ansible.builtin.template:
    src: vimrc.j2
    dest: "{{ ansible_user_dir }}/.vimrc"
    mode: "0644"
    backup: true

- name: Ensure nvim config directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/nvim"
    state: directory
    mode: "0755"

- name: Deploy nvim init.vim (sources ~/.vimrc)
  ansible.builtin.copy:
    content: |
      " Managed by Ansible — edit roles/dotfiles/templates/vimrc.j2
      set runtimepath^=~/.vim runtimepath+=~/.vim/after
      let &packpath = &runtimepath
      source ~/.vimrc
    dest: "{{ ansible_user_dir }}/.config/nvim/init.vim"
    mode: "0644"
    backup: true

- name: Deploy bashrc
  ansible.builtin.template:
    src: bashrc.j2
    dest: "{{ ansible_user_dir }}/.bashrc"
    mode: "0644"
    backup: true

- name: Ensure autostart config directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/autostart"
    state: directory
    mode: "0755"
  when: ansible_system == 'Linux'

- name: Disable GNOME Keyring SSH agent autostart (legacy XDG path)
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      Hidden=true
    dest: "{{ ansible_user_dir }}/.config/autostart/gnome-keyring-ssh.desktop"
    mode: "0644"
    backup: true
  when: ansible_system == 'Linux'

- name: Stop and mask gcr-ssh-agent (GNOME 50+ activates via gnome-session-services.target)
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    state: stopped
    masked: true
  loop:
    - gcr-ssh-agent.socket
    - gcr-ssh-agent.service
  when:
    - ansible_system == 'Linux'
    - not (csb_detected | default(false))  # CSB may route smart card/PIV auth through gcr-ssh-agent
  failed_when: false

- name: Deploy SSH agent systemd user service
  ansible.builtin.template:
    src: ssh-agent.service.j2
    dest: "{{ ansible_user_dir }}/.config/systemd/user/ssh-agent.service"
    mode: "0644"
    backup: true
  when: ansible_system == 'Linux'

- name: Enable SSH agent user service
  ansible.builtin.systemd:
    name: ssh-agent
    scope: user
    state: started
    enabled: true
    daemon_reload: true
  when: ansible_system == 'Linux'
  failed_when: false

- name: Deploy SSH agent environment.d config
  ansible.builtin.copy:
    content: "SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket\n"
    dest: "{{ ansible_user_dir }}/.config/environment.d/ssh-agent.conf"
    mode: "0644"
    backup: true
  when: ansible_system == 'Linux'

- name: Deploy XDG base directory environment.d config
  ansible.builtin.copy:
    content: |
      XDG_CONFIG_HOME=$HOME/.config
      XDG_DATA_HOME=$HOME/.local/share
      XDG_STATE_HOME=$HOME/.local/state
      XDG_CACHE_HOME=$HOME/.cache
    dest: "{{ ansible_user_dir }}/.config/environment.d/xdg.conf"
    mode: "0644"
    backup: true
  when: ansible_system == 'Linux'

# --- macOS: SSH agent via launchd ---
- name: Disable Apple built-in ssh-agent (macOS)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "launchctl disable user/{{ ansible_user_uid }}/com.openssh.ssh-agent"
  changed_when: false
  failed_when: false
  when: ansible_os_family == 'Darwin'

- name: Ensure log directory exists (macOS)
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.local/state/log"
    state: directory
    mode: "0755"
  when: ansible_os_family == 'Darwin'

- name: Ensure LaunchAgents directory exists (macOS)
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/Library/LaunchAgents"
    state: directory
    mode: "0755"
  when: ansible_os_family == 'Darwin'

- name: Deploy SSH agent launchd plist (macOS)
  ansible.builtin.template:
    src: ssh-agent.plist.j2
    dest: "{{ ansible_user_dir }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.ssh-agent.plist"
    mode: "0644"
    backup: true
  when: ansible_os_family == 'Darwin'

- name: Load SSH agent launchd plist (macOS)  # noqa: command-instead-of-module
  # 'launchctl bootstrap' is the modern replacement for the deprecated
  # 'launchctl load -w' (deprecated since macOS 10.10 Yosemite).
  # failed_when: false handles the non-zero exit when the agent is already bootstrapped.
  ansible.builtin.command:
    cmd: >-
      launchctl bootstrap gui/{{ ansible_user_uid }}
      {{ ansible_user_dir }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.ssh-agent.plist
  when: ansible_os_family == 'Darwin'
  changed_when: false
  failed_when: false

- name: Check if SSH supports post-quantum KEX
  ansible.builtin.command:
    cmd: ssh -Q kex
  register: dotfiles_ssh_kex_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe — must run in check mode to avoid false-positive diff

- name: Set PQ KEX availability fact
  ansible.builtin.set_fact:
    dotfiles_ssh_kex_pq_enabled: "{{ 'mlkem768x25519-sha256' in (dotfiles_ssh_kex_check.stdout | default('')) }}"

- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.ssh"
    state: directory
    mode: "0700"

- name: Check if SSH client config exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.ssh/config"
  register: dotfiles_ssh_config_stat

- name: Deploy SSH client config
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ ansible_user_dir }}/.ssh/config"
    mode: "0600"
    backup: true

- name: Deploy SSH socket tmpfiles config
  ansible.builtin.copy:
    content: "d %t/ssh 0700 - - -\n"
    dest: "{{ ansible_user_dir }}/.config/user-tmpfiles.d/ssh-sockets.conf"
    mode: "0644"
    backup: true
  when: ansible_system == 'Linux'

- name: Activate tmpfiles to create SSH socket directory
  ansible.builtin.command:
    cmd: systemd-tmpfiles --user --create
  changed_when: false
  when: ansible_system == 'Linux'

- name: Ensure direnv config directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/direnv"
    state: directory
    mode: "0755"

- name: Deploy safe direnv config
  ansible.builtin.copy:
    content: |
      # strict_env enables set -euo pipefail during .envrc evaluation:
      # unset variables become errors and pipeline failures propagate.
      # The outer shell environment (PATH, GOPATH, KUBECONFIG, etc.) is still inherited.
      # Example minimal .envrc: PATH_add bin
      [global]
      strict_env = true
      disable_stdin = true
      warn_timeout = "10s"
    dest: "{{ ansible_user_dir }}/.config/direnv/direnv.toml"
    mode: "0644"
    backup: true

- name: Deploy direnv user stdlib (direnvrc with layout_go)
  ansible.builtin.template:
    src: direnvrc.j2
    dest: "{{ ansible_user_dir }}/.config/direnv/direnvrc"
    mode: "0644"
    backup: true

- name: Set .npmrc permissions if exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.npmrc"
    mode: "0600"
  failed_when: false

- name: Harden credential directory permissions
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0700"
  loop:
    - "{{ ansible_user_dir }}/.aws"
    - "{{ ansible_user_dir }}/.config/gcloud"
    - "{{ ansible_user_dir }}/.kube"
  failed_when: false

- name: Deploy Claude work-env file
  ansible.builtin.copy:
    content: |
      export CLAUDE_CONFIG_DIR=~/.claude-work
      export CLAUDE_CODE_USE_VERTEX=1
      # Vertex project vars — set in CLAUDE.local.md, not here
    dest: "{{ ansible_user_dir }}/.config/claude/work-env"
    mode: "0600"
    backup: true
  when: profile == 'work'
