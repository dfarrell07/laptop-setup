---
# roles/dotfiles/tasks/xdg_migrate.yml
# Back up and remove a legacy dotfile to allow XDG migration.
# Called via include_tasks; expects vars: _legacy_path, _backup_path

- name: "Stat legacy {{ _legacy_path }}"
  ansible.builtin.stat:
    path: "{{ _legacy_path }}"
  register: _xdg_migrate_stat

- name: "Stat existing backup {{ _backup_path }}"
  ansible.builtin.stat:
    path: "{{ _backup_path }}"
  register: _xdg_migrate_backup_stat
  when: _xdg_migrate_stat.stat.exists

# A legacy file that reappears after an earlier migration (e.g. a tool recreated ~/.gitconfig)
# gets its own timestamped backup instead of being deleted unsaved.
- name: Back up legacy file before XDG migration — {{ _legacy_path }}
  ansible.builtin.copy:
    src: "{{ _legacy_path }}"
    dest: >-
      {{ _backup_path ~ ('.' ~ now(utc=true, fmt='%Y%m%dT%H%M%SZ')
         if _xdg_migrate_backup_stat.stat.exists | default(false) else '') }}
    remote_src: true
    mode: "0644"
    force: false
  when: _xdg_migrate_stat.stat.exists

- name: Remove legacy file after XDG migration — {{ _legacy_path }}
  ansible.builtin.file:
    path: "{{ _legacy_path }}"
    state: absent
  when: _xdg_migrate_stat.stat.exists
