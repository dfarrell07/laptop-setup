---
dotfiles_ohmyzsh_version: "6adfef3a8b25ca5ccf429bb87e10547ed444eaa1"
dotfiles_forgit_version: "26.08.0"

dotfiles_oh_my_zsh_theme: gallois
dotfiles_oh_my_zsh_plugins:
  - git
  - kubectl
  - forgit
  - python
  - history-substring-search

dotfiles_gh_editor: vim  # seed-only gh editor (force: false, first provision only); to change: gh config set editor

dotfiles_aws_profile: ""  # set in config.yml to your AWS CLI named profile; e.g. "aws-acm-subm"

# Red Hat-specific defaults; override in config.yml with your organization's internal Go module domains.
# Empty strings omit the export entirely (profile: work users without internal modules do not need these).
dotfiles_gonosumdb: ""  # set in config.yml for private Go module domains; e.g. "*.redhat.com,*.engineering.redhat.com"
dotfiles_goprivate: ""   # set in config.yml for private Go repos; e.g. "gitlab.cee.redhat.com,pkgs.devel.redhat.com"
dotfiles_internal_git_host: ""  # internal HTTPS git hostname; when set, adds http sslCAInfo + SSH Host stanza

profile: work  # playbook-level variable shared across 7 roles

dotfiles_tmux_prefix: "C-a"
dotfiles_tmux_history_limit: 50000  # 50k lines; tmux default 2000 — increase for long debug sessions


dotfiles_ssh_agent_timeout: 28800  # 8-hour key lifetime (workday policy); ssh-agent default is 0 = unlimited

dotfiles_homebrew_prefix: /opt/homebrew

dotfiles_laptop_tailscale_host: ''  # set in config.yml; e.g. 'laptop.tail'
dotfiles_mac_tailscale_host: ''     # set in config.yml; e.g. 'mac-desktop.tail'
# GitHub repo slug for cq() alias; override in config.yml if queue repo name differs
dotfiles_claude_queue_repo: "{{ dotfiles_github_user }}/claude-tasks"

# Stable OS-managed bundle (update-ca-trust regenerates on CA install); override with a
# specific anchor path (e.g. /etc/pki/ca-trust/source/anchors/RH-IT-Root-CA.pem) to pin
# to a single CA rather than trusting the full system bundle.
dotfiles_internal_ca_path: "{{ '/etc/ssl/certs/ca-certificates.crt' if is_apt else '/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem' }}"

# Work org directory names under ~/src/ — used by gitconfig.j2 includeIf blocks and
# the ccp() guard in zshrc.j2 to route work repos to the work git identity / block personal Claude.
# Override in config.yml to add or remove work orgs without editing templates.
dotfiles_work_src_dirs: []  # set in config.yml: e.g. [my-org, my-other-org]

dotfiles_ssh_hardware_key_basename: id_ed25519_sk
dotfiles_ssh_redhat_key_basename: id_rsa_redhat

dotfiles_direnv_warn_timeout: "10s"  # upstream default 5s; 10s accommodates slow VPN/CSB shell init
dotfiles_direnv_strict_env: true  # enables set -euo pipefail in .envrc; upstream default false
dotfiles_direnv_disable_stdin: true  # blocks interactive prompts in .envrc; upstream default false; set false in config.yml

is_apt: false  # fallback; authoritative value in group_vars/all/vars.yml
is_linux: false  # fallback; authoritative value in group_vars/all/vars.yml
is_macos: false  # fallback; authoritative value in group_vars/all/vars.yml
ssh_port: 722  # fallback for standalone molecule invocation; authoritative value in group_vars/all/vars.yml
ssh_signing_key_basename: id_ed25519_sk_signing  # fallback; authoritative value in group_vars/all/vars.yml
ssh_git_signing_pubkey: ""  # fallback; authoritative in group_vars/all/vars.yml (vault-backed); set in config.yml pre-vault
# fallback; authoritative in group_vars/all/vars.yml
ssh_ciphers: 'aes256-gcm@openssh.com,chacha20-poly1305@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr'
ssh_macs: 'hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com'
system_is_container: false  # fallback; authoritative value in group_vars/all/vars.yml
needs_container_tier: "host-only"  # fallback; authoritative value in group_vars/all/vars.yml
