---
dotfiles_user_email_work: "dfarrell@redhat.com"
dotfiles_user_email_personal: "dfarrell07@gmail.com"
dotfiles_user_name: "Daniel Farrell"
dotfiles_github_user: "dfarrell07"

dotfiles_oh_my_zsh_theme: gallois
dotfiles_oh_my_zsh_plugins:
  - git
  - kubectl
  - forgit
  - python
  - history-substring-search

dotfiles_aws_profile: "aws-acm-subm"

profile: work  # noqa: var-naming[no-role-prefix] — playbook-level variable shared across 7 roles

dotfiles_tmux_prefix: "C-a"
dotfiles_tmux_history_limit: 50000


dotfiles_ssh_agent_timeout: 28800

dotfiles_homebrew_prefix: /opt/homebrew

dotfiles_laptop_tailscale_host: 'laptop.tail'
dotfiles_mac_tailscale_host: 'mac-desktop.tail'
# GitHub repo slug for cq() alias; override in config.yml if queue repo name differs
dotfiles_claude_queue_repo: "{{ dotfiles_github_user }}/claude-tasks"

dotfiles_internal_ca_path: /etc/pki/ca-trust/source/anchors/2022-IT-Root-CA.pem

ssh_signing_key_basename: id_ed25519_sk_signing  # noqa: var-naming[no-role-prefix] — shared with ssh role; must match
