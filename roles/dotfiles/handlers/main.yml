---
# roles/dotfiles/handlers/main.yml

- name: Restart ssh-agent
  ansible.builtin.systemd:
    name: ssh-agent
    scope: user
    state: restarted
    daemon_reload: true
  when: not (system_is_container | default(false))  # scope:user systemd crashes containers; virtualization_type unreliable in nested-VM CI
  failed_when: false

- name: Reload ssh-agent launchd bootout (macOS)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-
      launchctl bootout gui/{{ ansible_facts['user_uid'] }}/{{ dotfiles_ssh_agent_label }}
  listen: Reload ssh-agent launchd (macOS)
  when: is_macos
  failed_when: false
  changed_when: false

- name: Reload ssh-agent launchd bootstrap (macOS)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-
      launchctl bootstrap gui/{{ ansible_facts['user_uid'] }}
      {{ ansible_facts['user_dir'] }}/Library/LaunchAgents/{{ dotfiles_ssh_agent_label }}.plist
  listen: Reload ssh-agent launchd (macOS)
  when: is_macos
  failed_when: false
  changed_when: false
