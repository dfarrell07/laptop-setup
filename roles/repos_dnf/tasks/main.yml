---
# roles/repos_dnf/tasks/main.yml
# Third-party RPM repos (dnf-based OS only).
# Uses block/rescue to handle CSB restrictions gracefully.

- name: Add GitHub CLI repo
  # gh is in standard Fedora repos (F43+) — third-party repo only needed for RHEL/Rocky
  when:
    - repo_gh_cli
    - not is_fedora
    - not csb_rhel  # CSB: external repo write succeeds silently; gh available in container
  block:
    - name: Add gh-cli repo
      ansible.builtin.yum_repository:
        name: gh-cli
        description: GitHub CLI
        baseurl: "https://cli.github.com/packages/rpm"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
        enabled: true
  rescue:
    - name: Warn gh-cli repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add GitHub CLI repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.

- name: Add Google Chrome repo
  when:
    - repo_google_chrome
    - ansible_facts['architecture'] == 'x86_64'
    # CSB: IT's cron owns google-chrome.repo / google-cloud-sdk.repo (same repo ids); RHEL CSB forbids them
    - not csb_detected
  block:
    - name: Add google-chrome repo
      ansible.builtin.yum_repository:
        name: google-chrome
        description: Google Chrome
        baseurl: "{{ repos_dnf_google_chrome_repo }}"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://dl.google.com/linux/linux_signing_key.pub"
        enabled: true
  rescue:
    - name: Warn Google Chrome repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Google Chrome repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.

- name: Add Google Cloud SDK repo
  when:
    - repo_google_cloud_sdk
    - ansible_facts['architecture'] == 'x86_64'
    # CSB: IT's cron owns google-chrome.repo / google-cloud-sdk.repo (same repo ids); RHEL CSB forbids them
    - not csb_detected
  block:
    - name: Add google-cloud-cli repo
      vars:
        _gcloud_use_el10: >-
          {{ (is_fedora and ansible_facts['distribution_major_version'] | int >= 40)
             or (not is_fedora and ansible_facts['distribution_major_version'] | int >= 10) }}
      ansible.builtin.yum_repository:
        name: google-cloud-cli
        description: Google Cloud CLI
        baseurl: "https://packages.cloud.google.com/yum/repos/cloud-sdk-{{ 'el10' if _gcloud_use_el10 else 'el9' }}-x86_64"
        gpgcheck: true
        repo_gpgcheck: false  # packages.cloud.google.com does not sign repomd.xml;
          # residual risk: MITM can manipulate repo metadata (version list, package
          # names) without detection — e.g. downgrade to a vulnerable version.
          # RPM-level gpgcheck above remains the effective guard against malicious
          # payload delivery. Mitigated by the version floor and, after first install,
          # versionlock (see tasks below).
        # yamllint disable-line rule:line-length
        gpgkey: "https://packages.cloud.google.com/yum/doc/{{ 'rpm-package-key-v10.gpg' if _gcloud_use_el10 else 'rpm-package-key.gpg' }}"
        enabled: true
    - name: Install dnf versionlock plugin for google-cloud-cli pin
      ansible.builtin.dnf:
        name: python3-dnf-plugin-versionlock
        state: present
    - name: Install google-cloud-cli to enable versionlock protection on first install
      ignore_errors: "{{ ansible_check_mode }}"  # the repo file is not written in check mode, so the package may not resolve
      ansible.builtin.dnf:
        name: google-cloud-cli
        state: present
    # noqa: command-instead-of-module — query installed RPM version without modifying packages
    - name: Query installed google-cloud-cli version
      ansible.builtin.command:
        cmd: rpm -q --queryformat '%{VERSION}' google-cloud-cli
      changed_when: false
      # check mode may skip or fail the install above, so a first-run query legitimately finds nothing
      failed_when: _gcloud_installed_version.rc != 0 and not ansible_check_mode
      check_mode: false
      register: _gcloud_installed_version
    - name: Assert google-cloud-cli meets minimum version floor (MITM downgrade guard)
      when: _gcloud_installed_version.rc == 0
      ansible.builtin.assert:
        that: _gcloud_installed_version.stdout is version(repos_dnf_gcloud_min_version, '>=')
        fail_msg: >-
          google-cloud-cli {{ _gcloud_installed_version.stdout }} is below minimum
          floor {{ repos_dnf_gcloud_min_version }}. A MITM may have substituted an
          older version via unsigned repomd.xml. Investigate, then upgrade the package
          (dnf upgrade google-cloud-cli) from a trusted network and re-run. Override
          repos_dnf_gcloud_min_version in config.yml if intentionally downgrading.
    - name: Pin google-cloud-cli version to limit MITM downgrade exposure
      community.general.dnf_versionlock:
        name: google-cloud-cli
        state: present
      ignore_errors: "{{ ansible_check_mode }}"  # package may be absent in check mode
  rescue:
    - name: Abort on google-cloud-cli version floor integrity failure
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('integrity check failed') }}"
      when: ansible_failed_task.name is match('Assert google-cloud-cli meets')
    - name: Warn Google Cloud SDK repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Google Cloud SDK repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.

# Mullvad is a personal privacy VPN whose purpose is to bypass network monitoring —
# adding it on CSB could trigger SIEM/DLP alerts and violates corporate policy intent.
# Skip entirely on CSB (not just rescue-on-failure) unlike other consumer repos.
- name: Add Mullvad VPN repo
  when:
    - repo_mullvad
    - is_fedora
    - profile == 'personal'
    - not csb_detected
  block:
    - name: Add mullvad repo
      ansible.builtin.yum_repository:
        name: mullvad
        description: Mullvad VPN
        baseurl: "https://repository.mullvad.net/rpm/stable/$basearch"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://repository.mullvad.net/rpm/mullvad-keyring.asc"
        enabled: true
  rescue:
    # Block-level 'when' (not csb_detected) excludes CSB machines,
    # so csb_detected is always false when rescue runs.
    - name: Warn Mullvad VPN repo failed (network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Mullvad VPN repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.

- name: Add Docker CE repo
  when:
    - repo_docker_ce
    - not csb_rhel  # CSB: Podman is the corporate standard; Docker CE repo not permitted on RHEL CSB
  block:
    - name: Add docker-ce repo
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker CE Stable
        baseurl: "https://download.docker.com/linux/{{ _docker_distro }}/$releasever/$basearch/stable"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://download.docker.com/linux/{{ _docker_distro }}/gpg"
        enabled: true
      vars:
        _docker_distro: >-
          {{ 'fedora' if is_fedora
             else ('centos' if ansible_facts['distribution'] in ['Rocky', 'AlmaLinux', 'CentOS']
             else 'rhel') }}
  rescue:
    - name: Warn Docker CE repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Docker CE repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.

- name: Add acli repo
  # URL-as-toggle: task is enabled by defining repos_dnf_acli_baseurl in config.yml
  # (not a repo_X boolean, because the URL is an internal secret)
  # Risk acceptance: gpgcheck and repo_gpgcheck are disabled — this internal Red Hat repo
  # publishes no GPG key or signed metadata. Mitigations: opt-in only (explicit baseurl in
  # config.yml), profile==work scoped, URL assert requires the host to be listed in
  # repos_dnf_internal_hosts (no domain check beyond that list).
  # SECURITY — first-install window: versionlock (below) only guards against post-provision
  # unauthenticated updates; it does NOT protect the first-install window. A compromised repo
  # host at first provision delivers a malicious package which versionlock then pins permanently.
  # Mitigate by setting repos_dnf_acli_binary_sha256 in config.yml (gitignored) to the SHA256
  # of the trusted acli binary — the play fails after the install if it mismatches (the package and
  # its scriptlets have already run and the versionlock is not applied; dnf remove acli). Obtain the hash
  # out-of-band from IT or internal release notes before provisioning.
  when:
    - profile == 'work'
    - repos_dnf_acli_baseurl is defined
  block:
    - name: Assert acli baseurl targets expected internal domain
      vars:
        _acli_hosts_re: "{{ repos_dnf_internal_hosts | default([]) | map('regex_escape') | join('|') }}"
      ansible.builtin.assert:
        that:
          - repos_dnf_internal_hosts | default([]) | length > 0
          - repos_dnf_acli_baseurl is match('^https://(' ~ _acli_hosts_re ~ ')/\S*\Z')
        fail_msg: "repos_dnf_acli_baseurl host must be listed in repos_dnf_internal_hosts"
    - name: Add acli repo
      ansible.builtin.yum_repository:
        name: acli
        description: Atlassian CLI
        baseurl: "{{ repos_dnf_acli_baseurl }}"
        gpgcheck: false  # Internal Red Hat repo does not publish a GPG key
        repo_gpgcheck: false  # metadata also unsigned — same limitation as gpgcheck above
        enabled: true
    - name: Install dnf versionlock plugin for acli pin
      ansible.builtin.dnf:
        name: python3-dnf-plugin-versionlock
        state: present
    - name: Install acli to enable versionlock protection on first install
      ansible.builtin.dnf:
        name: acli
        state: present
      ignore_errors: "{{ ansible_check_mode }}"  # the repo file is not written in check mode, so the package may not resolve
    - name: Warn when acli first-install SHA256 check is not configured
      # repos_dnf_acli_binary_sha256 is not set — no integrity check on the downloaded binary.
      # Obtain the expected SHA256 out-of-band from IT and set it in config.yml for a post-install check
      # (variable name: repos_dnf_acli_binary_sha256).
      ansible.builtin.debug:
        msg: >-
          SECURITY ADVISORY: repos_dnf_acli_binary_sha256 is not set in config.yml.
          The acli binary was installed from an unsigned repo with no integrity check.
          Obtain the SHA256 hash out-of-band from IT and add
          repos_dnf_acli_binary_sha256 to config.yml to enable a post-install check (it detects a mismatch after
          the package scriptlets have run; it does not prevent them).
      when: repos_dnf_acli_binary_sha256 is not defined
    - name: Stat acli binary for SHA256 first-install integrity check
      # Only runs when repos_dnf_acli_binary_sha256 is set in config.yml.
      # Post-install check: detects a mismatch after the scriptlets ran, does not prevent them;
      # versionlock below only prevents unauthenticated updates after this point.
      ansible.builtin.stat:
        path: /usr/bin/acli
        checksum_algorithm: sha256
        get_checksum: true
      register: _acli_stat
      when: repos_dnf_acli_binary_sha256 is defined
    - name: Assert acli binary SHA256 matches expected hash
      ansible.builtin.assert:
        that: _acli_stat.stat.checksum == repos_dnf_acli_binary_sha256
        fail_msg: >-
          SECURITY: acli binary SHA256 mismatch.
          Expected: {{ repos_dnf_acli_binary_sha256 }}
          Got:      {{ _acli_stat.stat.checksum | default('unavailable') }}
          The installed binary does not match the trusted hash in config.yml.
          Possible supply-chain compromise — do not proceed. Re-obtain the binary
          hash out-of-band from IT or internal release notes before re-running.
      when:
        - repos_dnf_acli_binary_sha256 is defined
        # check mode may skip or fail the install above, so the binary may legitimately not exist yet
        - not ansible_check_mode or _acli_stat.stat.exists
    - name: Pin acli version to limit unauthenticated update exposure
      # NOTE: this pin only protects against post-provision tampering (future dnf updates).
      # First-install integrity depends on repos_dnf_acli_binary_sha256 being set above.
      community.general.dnf_versionlock:
        name: acli
        state: present
      ignore_errors: "{{ ansible_check_mode }}"  # package may be absent in check mode
  rescue:
    - name: Abort on acli baseurl or binary checksum integrity failure
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('integrity check failed') }}"
      when: ansible_failed_task.name is match('Assert acli (baseurl|binary SHA256)')
    - name: Record acli repo failure
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: repos_dnf
        _csb_task_name: "Add acli repository"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown') }}"
        _csb_action: "Request access to the internal acli RPM repository; it is the only supported channel"
        _csb_ticket_summary: "Exception request: acli RPM repository"
        _csb_ticket_body: >-
          acli is a Red Hat-internal command-line tool for Jira and Confluence automation.
          Repo URL: {{ repos_dnf_acli_baseurl }} (internal Red Hat package repository).
          No public RPM is available; the internal repo is the only supported distribution channel.
          pip install atlassian-cli is a different third-party project and not a drop-in replacement.
          Blocked workflows: Jira ticket management, Confluence updates, sprint planning scripts.
      when: csb_rhel
    - name: Warn acli repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add acli repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.
      when: not csb_rhel

- name: Add Red Hat internal repos
  when:
    - repo_redhat
    - profile == 'work'
    - repos_dnf_redhat_baseurl is defined
  block:
    - name: Assert Red Hat internal repo URLs target expected internal domain
      vars:
        _redhat_hosts_re: >-
          {{ (['repo.redhat.com', 'keys.redhat.com'] + (repos_dnf_internal_hosts | default([])))
          | map('regex_escape') | join('|') }}
      ansible.builtin.assert:
        that:
          - repos_dnf_redhat_baseurl is match('^https://(' ~ _redhat_hosts_re ~ ')/\S*\Z')
          # URL and fingerprint are interpolated into a shell script below: no shell metacharacters
          - repos_dnf_redhat_gpgkey is match('^https://(' ~ _redhat_hosts_re ~ ')/[A-Za-z0-9._~/%+-]*\.gpg\Z')
          # the pin is mandatory: the key is only imported after its fingerprint matches
          - repos_dnf_redhat_gpg_fingerprint is match('^[0-9A-Fa-f]{40}\Z')
        fail_msg: >-
          repos_dnf_redhat_baseurl and repos_dnf_redhat_gpgkey must target known Red Hat
          hosts (repo.redhat.com, keys.redhat.com, or repos_dnf_internal_hosts);
          this prevents subdomain hijacking attacks. Do not use arbitrary redhat.com subdomains.
          repos_dnf_redhat_gpg_fingerprint must also be set (the key's full fingerprint).
    - name: Create secure temporary directory for Red Hat GPG key
      ansible.builtin.tempfile:
        state: directory
        suffix: _redhat_gpg
      register: _redhat_gpg_tmp_dir
      changed_when: false  # scratch storage is removed within this key-verification transaction
    - name: Fetch and verify Red Hat internal GPG key atomically
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          KEYFILE="{{ _redhat_gpg_tmp_dir.path }}/key.gpg"
          # already imported: skip the network fetch so an offline rerun does not fail
          KEYID=$(printf %s '{{ repos_dnf_redhat_gpg_fingerprint | upper }}' | tail -c 8)
          if rpm -q gpg-pubkey --qf '%{VERSION}\n' | grep -qixF "$KEYID"; then exit 0; fi
          curl --proto '=https' --tlsv1.2 -fsSL "{{ repos_dnf_redhat_gpgkey }}" -o "$KEYFILE"
          FP=$(gpg --show-keys --with-colons "$KEYFILE" 2>/dev/null |
            awk -F: '$1 == "pub" {primary=1} $1 == "sub" {primary=0}
              $1 == "fpr" && primary {print $10; primary=0}')
          if [ -z "$FP" ]; then exit 1; fi
          if [ "$FP" = "{{ repos_dnf_redhat_gpg_fingerprint | upper }}" ]; then
            rpm --import "$KEYFILE"
          else
            exit 1
          fi
      changed_when: false
      when: _redhat_gpg_tmp_dir.path is defined  # tempfile creates nothing in check mode
    - name: Clean up Red Hat GPG temporary directory
      ansible.builtin.file:
        path: "{{ _redhat_gpg_tmp_dir.path }}"
        state: absent
      changed_when: false  # scratch storage is removed within this key-verification transaction
      when:
        - _redhat_gpg_tmp_dir is defined
        - _redhat_gpg_tmp_dir.path is defined  # tempfile creates nothing in check mode
    - name: Add Red Hat internal repo
      ansible.builtin.yum_repository:
        name: redhat-internal
        description: Red Hat Internal Tools
        baseurl: "{{ repos_dnf_redhat_baseurl }}"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "{{ repos_dnf_redhat_gpgkey }}"
        enabled: true
  rescue:
    - name: Abort on invalid Red Hat internal repo configuration
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('invalid Red Hat internal repo configuration') }}"
      when: ansible_failed_task.name is match('Assert Red Hat internal repo URLs')
    - name: Remove Red Hat GPG temp directory on failure
      ansible.builtin.file:
        path: "{{ _redhat_gpg_tmp_dir.path }}"
        state: absent
      changed_when: false  # scratch storage is removed within this key-verification transaction
      failed_when: false
      when:
        - _redhat_gpg_tmp_dir is defined
        - _redhat_gpg_tmp_dir.path is defined
    - name: Record Red Hat repo failure
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: repos_dnf
        _csb_task_name: "Add Red Hat internal repository"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown') }}"
        _csb_action: "Install Red Hat internal tools manually or request VPN access"
        _csb_ticket_summary: "Exception request: Red Hat internal RPM repository"
        _csb_ticket_body: >-
          The Red Hat internal tools repository provides packages for Red Hat engineering workflows.
          Repo URL: {{ repos_dnf_redhat_baseurl }} (internal Red Hat package repository).
          Internal packages are not available through RHSM, EPEL, or any public repository.
          Blocked workflows: internal tooling installation, debugging packages, Red Hat-specific dev utilities.
      when: csb_rhel
    - name: Warn Red Hat internal repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Red Hat internal repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key) or a
          key fingerprint mismatch (possible tampering; check repos_dnf_redhat_gpg_fingerprint).
          Continuing playbook execution.
      when: not csb_rhel

# RPM Fusion free provides multimedia codecs (H.264/AAC, ffmpeg, VLC) and is allowed
# on hybrid Fedora CSB (csb_detected=true, csb_rhel=false) where the user manages their
# own Fedora install. Guard is 'not csb_rhel' (not 'not csb_detected') intentionally:
# hybrid CSB Fedora is user-managed and IT does not restrict third-party Fedora repos here.
# If your IT policy prohibits RPM Fusion, set repo_rpmfusion_free: false in config.yml.
- name: Enable RPM Fusion free repo
  when:
    - repo_rpmfusion_free
    - is_fedora
    - not csb_rhel
  block:
    - name: Assert RPM Fusion free GPG fingerprint is 40 hex digits (interpolated into a shell script)
      ansible.builtin.assert:
        that: repos_dnf_rpmfusion_gpg_fingerprint is match('^[0-9A-Fa-f]{40}\Z')
    # noqa: command-instead-of-module — installed-state probe so a rerun skips the URL download
    - name: Check whether RPM Fusion free release is installed
      ansible.builtin.command:
        cmd: rpm -q rpmfusion-free-release
      register: _rpmfusion_free_installed
      changed_when: false
      failed_when: false
      check_mode: false
    - name: Create secure temporary directory for RPM Fusion free GPG key
      ansible.builtin.tempfile:
        state: directory
        suffix: _rpmfusion_free_gpg
      register: _rpmfusion_free_gpg_tmp_dir
      changed_when: false  # scratch storage is removed within this key-verification transaction
    - name: Fetch and verify RPM Fusion free GPG key atomically
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          KEYFILE="{{ _rpmfusion_free_gpg_tmp_dir.path }}/key.gpg"
          URL="https://download1.rpmfusion.org/free/fedora/RPM-GPG-KEY-rpmfusion-free-fedora-2020"
          # already imported: skip the network fetch so an offline rerun does not fail
          KEYID=$(printf %s '{{ repos_dnf_rpmfusion_gpg_fingerprint | upper }}' | tail -c 8)
          if rpm -q gpg-pubkey --qf '%{VERSION}\n' | grep -qixF "$KEYID"; then exit 0; fi
          curl --proto '=https' --tlsv1.2 -fsSL "$URL" -o "$KEYFILE"
          FP=$(gpg --show-keys --with-colons "$KEYFILE" 2>/dev/null |
            awk -F: '$1 == "pub" {primary=1} $1 == "sub" {primary=0}
              $1 == "fpr" && primary {print $10; primary=0}')
          if [ -z "$FP" ]; then exit 1; fi
          if [ "$FP" = "{{ repos_dnf_rpmfusion_gpg_fingerprint | upper }}" ]; then
            rpm --import "$KEYFILE"
          else
            exit 1
          fi
      changed_when: false
      when: _rpmfusion_free_gpg_tmp_dir.path is defined  # tempfile creates nothing in check mode
    - name: Clean up RPM Fusion free GPG temporary directory
      ansible.builtin.file:
        path: "{{ _rpmfusion_free_gpg_tmp_dir.path }}"
        state: absent
      changed_when: false  # scratch storage is removed within this key-verification transaction
      when:
        - _rpmfusion_free_gpg_tmp_dir is defined
        - _rpmfusion_free_gpg_tmp_dir.path is defined  # tempfile creates nothing in check mode
    - name: Install RPM Fusion free release
      when:
        - _rpmfusion_free_installed.rc != 0  # the URL install re-downloads the RPM on every run
        - not ansible_check_mode  # the key import above is skipped in check mode, so dnf would reject the RPM
      ansible.builtin.dnf:
        # yamllint disable-line rule:line-length
        name: "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
        state: present
  rescue:
    - name: Abort on malformed GPG fingerprint configuration
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('invalid GPG fingerprint configuration') }}"
      when: ansible_failed_task.name is match('Assert .* GPG fingerprint')
    - name: Remove RPM Fusion free GPG temp directory on failure
      ansible.builtin.file:
        path: "{{ _rpmfusion_free_gpg_tmp_dir.path }}"
        state: absent
      changed_when: false  # scratch storage is removed within this key-verification transaction
      failed_when: false
      when:
        - _rpmfusion_free_gpg_tmp_dir is defined
        - _rpmfusion_free_gpg_tmp_dir.path is defined
    - name: Warn RPM Fusion free failed (network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Enable RPM Fusion free repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a GPG bootstrap failure (libdnf5 enforces GPG on @commandline
          installs on Fedora 41+ before the release package can deliver its key), a
          key fingerprint mismatch (possible tampering) or a transient network error
          (DNS timeout, connectivity). Continuing playbook execution.

# RPM Fusion nonfree provides proprietary firmware and drivers (NVIDIA, Broadcom) and
# is allowed on hybrid Fedora CSB for the same reason as the free repo above.
# Guard is 'not csb_rhel' intentionally. Off by default (repo_rpmfusion_nonfree: false); set it to
# true in config.yml to opt in, if your IT policy permits nonfree repos.
- name: Enable RPM Fusion nonfree repo
  when:
    - repo_rpmfusion_nonfree
    - is_fedora
    - not csb_rhel
  block:
    - name: Assert RPM Fusion nonfree GPG fingerprint is 40 hex digits (interpolated into a shell script)
      ansible.builtin.assert:
        that: repos_dnf_rpmfusion_nonfree_gpg_fingerprint is match('^[0-9A-Fa-f]{40}\Z')
    # noqa: command-instead-of-module — installed-state probe so a rerun skips the URL download
    - name: Check whether RPM Fusion nonfree release is installed
      ansible.builtin.command:
        cmd: rpm -q rpmfusion-nonfree-release
      register: _rpmfusion_nonfree_installed
      changed_when: false
      failed_when: false
      check_mode: false
    - name: Create secure temporary directory for RPM Fusion nonfree GPG key
      ansible.builtin.tempfile:
        state: directory
        suffix: _rpmfusion_nonfree_gpg
      register: _rpmfusion_nonfree_gpg_tmp_dir
      changed_when: false  # scratch storage is removed within this key-verification transaction
    - name: Fetch and verify RPM Fusion nonfree GPG key atomically
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          KEYFILE="{{ _rpmfusion_nonfree_gpg_tmp_dir.path }}/key.gpg"
          URL="https://download1.rpmfusion.org/nonfree/fedora/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020"
          # already imported: skip the network fetch so an offline rerun does not fail
          KEYID=$(printf %s '{{ repos_dnf_rpmfusion_nonfree_gpg_fingerprint | upper }}' | tail -c 8)
          if rpm -q gpg-pubkey --qf '%{VERSION}\n' | grep -qixF "$KEYID"; then exit 0; fi
          curl --proto '=https' --tlsv1.2 -fsSL "$URL" -o "$KEYFILE"
          FP=$(gpg --show-keys --with-colons "$KEYFILE" 2>/dev/null |
            awk -F: '$1 == "pub" {primary=1} $1 == "sub" {primary=0}
              $1 == "fpr" && primary {print $10; primary=0}')
          if [ -z "$FP" ]; then exit 1; fi
          if [ "$FP" = "{{ repos_dnf_rpmfusion_nonfree_gpg_fingerprint | upper }}" ]; then
            rpm --import "$KEYFILE"
          else
            exit 1
          fi
      changed_when: false
      when: _rpmfusion_nonfree_gpg_tmp_dir.path is defined  # tempfile creates nothing in check mode
    - name: Clean up RPM Fusion nonfree GPG temporary directory
      ansible.builtin.file:
        path: "{{ _rpmfusion_nonfree_gpg_tmp_dir.path }}"
        state: absent
      changed_when: false  # scratch storage is removed within this key-verification transaction
      when:
        - _rpmfusion_nonfree_gpg_tmp_dir is defined
        - _rpmfusion_nonfree_gpg_tmp_dir.path is defined  # tempfile creates nothing in check mode
    - name: Install RPM Fusion nonfree release
      when:
        - _rpmfusion_nonfree_installed.rc != 0  # the URL install re-downloads the RPM on every run
        - not ansible_check_mode  # the key import above is skipped in check mode, so dnf would reject the RPM
      ansible.builtin.dnf:
        name: >-  # yamllint disable-line rule:line-length
          https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version']
          }}.noarch.rpm
        state: present
  rescue:
    - name: Abort on malformed GPG fingerprint configuration
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('invalid GPG fingerprint configuration') }}"
      when: ansible_failed_task.name is match('Assert .* GPG fingerprint')
    - name: Remove RPM Fusion nonfree GPG temp directory on failure
      ansible.builtin.file:
        path: "{{ _rpmfusion_nonfree_gpg_tmp_dir.path }}"
        state: absent
      changed_when: false  # scratch storage is removed within this key-verification transaction
      failed_when: false
      when:
        - _rpmfusion_nonfree_gpg_tmp_dir is defined
        - _rpmfusion_nonfree_gpg_tmp_dir.path is defined
    - name: Warn RPM Fusion nonfree failed (network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Enable RPM Fusion nonfree repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a GPG bootstrap failure (libdnf5 enforces GPG on @commandline
          installs on Fedora 41+ before the release package can deliver its key), a
          key fingerprint mismatch (possible tampering) or a transient network error
          (DNS timeout, connectivity). Continuing playbook execution.

- name: Add Tailscale repo
  when:
    - repo_tailscale
    - not csb_detected  # IT repo allowlist; tailscale installs from the base Fedora repos
  block:
    - name: Assert Tailscale GPG fingerprint is 40 hex digits (interpolated into a shell script)
      ansible.builtin.assert:
        that: repos_dnf_tailscale_gpg_fingerprint is match('^[0-9A-Fa-f]{40}\Z')
    - name: Create secure temporary directory for Tailscale GPG key
      ansible.builtin.tempfile:
        state: directory
        suffix: _tailscale_gpg
      register: _tailscale_gpg_tmp_dir
      changed_when: false  # scratch storage is removed within this key-verification transaction
    - name: Fetch and verify Tailscale GPG key atomically
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          TS_PATH="{{ 'rhel/' ~ ansible_facts['distribution_major_version'] if not is_fedora else 'fedora' }}"
          KEYFILE="{{ _tailscale_gpg_tmp_dir.path }}/key.gpg"
          # already imported: skip the network fetch so an offline rerun does not fail
          KEYID=$(printf %s '{{ repos_dnf_tailscale_gpg_fingerprint | upper }}' | tail -c 8)
          if rpm -q gpg-pubkey --qf '%{VERSION}\n' | grep -qixF "$KEYID"; then exit 0; fi
          curl --proto '=https' --tlsv1.2 -fsSL "https://pkgs.tailscale.com/stable/${TS_PATH}/repo.gpg" -o "$KEYFILE"
          FP=$(gpg --show-keys --with-colons "$KEYFILE" 2>/dev/null |
            awk -F: '$1 == "pub" {primary=1} $1 == "sub" {primary=0}
              $1 == "fpr" && primary {print $10; primary=0}')
          if [ -z "$FP" ]; then exit 1; fi
          if [ "$FP" = "{{ repos_dnf_tailscale_gpg_fingerprint | upper }}" ]; then
            rpm --import "$KEYFILE"
          else
            exit 1
          fi
      changed_when: false
      when: _tailscale_gpg_tmp_dir.path is defined  # tempfile creates nothing in check mode
    - name: Clean up Tailscale GPG temporary directory
      ansible.builtin.file:
        path: "{{ _tailscale_gpg_tmp_dir.path }}"
        state: absent
      changed_when: false  # scratch storage is removed within this key-verification transaction
      when:
        - _tailscale_gpg_tmp_dir is defined
        - _tailscale_gpg_tmp_dir.path is defined  # tempfile creates nothing in check mode
    - name: Add Tailscale stable repo
      vars:
        _ts_path: >-
          {{ 'rhel/' ~ ansible_facts['distribution_major_version'] if not is_fedora else 'fedora' }}
      ansible.builtin.yum_repository:
        name: tailscale-stable
        description: Tailscale stable
        # Tailscale uses a single static 'fedora' path for all Fedora releases (no per-version subdirectory)
        baseurl: "https://pkgs.tailscale.com/stable/{{ _ts_path }}/$basearch"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://pkgs.tailscale.com/stable/{{ _ts_path }}/repo.gpg"
        enabled: true
  rescue:
    - name: Abort on malformed GPG fingerprint configuration
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('invalid GPG fingerprint configuration') }}"
      when: ansible_failed_task.name is match('Assert .* GPG fingerprint')
    - name: Remove Tailscale GPG temp directory on failure
      ansible.builtin.file:
        path: "{{ _tailscale_gpg_tmp_dir.path }}"
        state: absent
      changed_when: false  # scratch storage is removed within this key-verification transaction
      failed_when: false
      when:
        - _tailscale_gpg_tmp_dir is defined
        - _tailscale_gpg_tmp_dir.path is defined
    - name: Warn Tailscale repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Tailscale repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key) or a
          key fingerprint mismatch (possible tampering; check repos_dnf_tailscale_gpg_fingerprint).
          Continuing playbook execution.

# Cleanup: remove stale .repo files for repos whose boolean was flipped to false.
# yum_repository state: absent deletes /etc/yum.repos.d/<name>.repo idempotently.
# A repo whose package is installed is kept: removing it silently stops that package's
# security updates (e.g. a browser installed outside this playbook).
# Exception: redhat-internal is removed whenever it is not configured (its packages are not tracked), except on CSB (IT-managed repo file).
- name: Gather installed packages before third-party repo cleanup
  ansible.builtin.package_facts:
    manager: rpm

- name: Third-party repo cleanup for disabled toggles
  vars:
    _repos_dnf_toggled:
      - {repo: gh-cli, pkg: gh, toggle: repo_gh_cli, enabled: "{{ repo_gh_cli }}"}
      - {repo: google-chrome, pkg: google-chrome-stable, toggle: repo_google_chrome, enabled: "{{ repo_google_chrome }}"}
      - {repo: google-cloud-cli, pkg: google-cloud-cli, toggle: repo_google_cloud_sdk, enabled: "{{ repo_google_cloud_sdk }}"}
      - {repo: mullvad, pkg: mullvad-vpn, toggle: repo_mullvad, enabled: "{{ repo_mullvad }}"}
      - {repo: docker-ce, pkg: docker-ce, toggle: repo_docker_ce, enabled: "{{ repo_docker_ce }}"}
      - {repo: tailscale-stable, pkg: tailscale, toggle: repo_tailscale, enabled: "{{ repo_tailscale }}"}
  block:
    - name: Keep disabled third-party repos whose packages are installed
      # tailscale-stable is excluded from the notice: tailscale may come from the base repos. The removal task
      # below still keeps an existing tailscale-stable.repo while the package is installed.
      ansible.builtin.debug:
        msg: >-
          Keeping the {{ item.repo }} repo although {{ item.toggle }} is false: {{ item.pkg }} is
          installed and would stop receiving updates. Set {{ item.toggle }}: true in config.yml to
          silence this, or remove the package first.
      loop: "{{ _repos_dnf_toggled | rejectattr('repo', 'eq', 'tailscale-stable') | list }}"
      loop_control:
        label: "{{ item.repo }}"
      when:
        - not (item.enabled | bool)
        - item.pkg in ansible_facts.packages
        - not (csb_detected and item.repo in ['google-chrome', 'google-cloud-cli'])  # IT-managed repo files

    - name: Remove disabled third-party repo files
      ansible.builtin.yum_repository:
        name: "{{ item.repo }}"
        state: absent
      loop: "{{ _repos_dnf_toggled }}"
      loop_control:
        label: "{{ item.repo }}"
      when:
        - not (item.enabled | bool)
        - item.pkg not in ansible_facts.packages
        - not (csb_detected and item.repo in ['google-chrome', 'google-cloud-cli'])  # IT-managed repo files

- name: Remove acli repo when disabled
  ansible.builtin.yum_repository:
    name: acli
    state: absent
  when:
    - repos_dnf_acli_baseurl is not defined or profile != 'work'
    - "'acli' not in ansible_facts.packages"  # keep updates flowing for an installed acli

- name: Remove redhat-internal repo when disabled
  ansible.builtin.yum_repository:
    name: redhat-internal
    state: absent
  when:
    - not (repo_redhat and profile == 'work' and repos_dnf_redhat_baseurl is defined)
    - not csb_detected  # IT-managed repo file on CSB
