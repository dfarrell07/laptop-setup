---
# roles/repos_dnf/tasks/main.yml
# Third-party RPM repos (dnf-based OS only).
# Uses block/rescue to handle CSB restrictions gracefully.

- name: Add GitHub CLI repo
  # gh is in standard Fedora repos (F43+) — third-party repo only needed for RHEL/Rocky
  when:
    - repo_gh_cli
    - not is_fedora
    - not csb_rhel  # CSB: external repo write succeeds silently; gh available in container
  block:
    - name: Add gh-cli repo
      ansible.builtin.yum_repository:
        name: gh-cli
        description: GitHub CLI
        baseurl: "https://cli.github.com/packages/rpm"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
        enabled: true
  rescue:
    - name: Warn gh-cli repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add GitHub CLI repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.

- name: Add Google Chrome repo
  when:
    - repo_google_chrome
    - ansible_facts['architecture'] == 'x86_64'
    # CSB: IT's cron owns google-chrome.repo / google-cloud-sdk.repo (same repo ids); RHEL CSB forbids them
    - not csb_detected
  block:
    - name: Add google-chrome repo
      ansible.builtin.yum_repository:
        name: google-chrome
        description: Google Chrome
        baseurl: "{{ repos_dnf_google_chrome_repo }}"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://dl.google.com/linux/linux_signing_key.pub"
        includepkgs: [google-chrome-*]  # the baseurl may come from config.yml: it can supply Chrome and nothing else
        enabled: true
  rescue:
    - name: Warn Google Chrome repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Google Chrome repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.

- name: Add Google Cloud SDK repo
  when:
    - repo_google_cloud_sdk
    - ansible_facts['architecture'] == 'x86_64'
    # CSB: IT's cron owns google-chrome.repo / google-cloud-sdk.repo (same repo ids); RHEL CSB forbids them
    - not csb_detected
  block:
    # The el9/el10 choice is computed inline (no block or task var: config.yml values, set as facts, outrank those)
    - name: Add google-cloud-cli repo
      ansible.builtin.yum_repository:
        name: google-cloud-cli
        description: Google Cloud CLI
        baseurl: >-
          https://packages.cloud.google.com/yum/repos/cloud-sdk-{{ 'el10' if ansible_facts['distribution_major_version'] | int
          >= (40 if is_fedora else 10) else 'el9' }}-x86_64
        gpgcheck: true
        repo_gpgcheck: false  # packages.cloud.google.com does not sign repomd.xml;
          # residual risk: MITM can manipulate repo metadata (version list, package
          # names) without detection — e.g. downgrade to a vulnerable version.
          # RPM-level gpgcheck above remains the effective guard against malicious
          # payload delivery. Mitigated by the version floor and, after first install,
          # versionlock (see tasks below).
        gpgkey: >-
          https://packages.cloud.google.com/yum/doc/{{ 'rpm-package-key-v10.gpg' if ansible_facts['distribution_major_version']
          | int >= (40 if is_fedora else 10) else 'rpm-package-key.gpg' }}
        enabled: true
    - name: Install dnf versionlock plugin for google-cloud-cli pin
      ansible.builtin.dnf:
        name: python3-dnf-plugin-versionlock
        state: present
    - name: Install google-cloud-cli to enable versionlock protection on first install
      ignore_errors: "{{ ansible_check_mode }}"  # the repo file is not written in check mode, so the package may not resolve
      ansible.builtin.dnf:
        name: google-cloud-cli
        state: present
    # noqa: command-instead-of-module — query installed RPM version without modifying packages
    - name: Query installed google-cloud-cli version
      ansible.builtin.command:
        cmd: rpm -q --queryformat '%{VERSION}' google-cloud-cli
      changed_when: false
      # check mode may skip or fail the install above, so a first-run query legitimately finds nothing
      failed_when: _gcloud_installed_version.rc != 0 and not ansible_check_mode
      check_mode: false
      register: _gcloud_installed_version
    - name: Assert google-cloud-cli meets minimum version floor (MITM downgrade guard)
      when: _gcloud_installed_version.rc == 0
      ansible.builtin.assert:
        that: _gcloud_installed_version.stdout is version(repos_dnf_gcloud_min_version, '>=')
        fail_msg: >-
          google-cloud-cli {{ _gcloud_installed_version.stdout }} is below minimum
          floor {{ repos_dnf_gcloud_min_version }}. A MITM may have substituted an
          older version via unsigned repomd.xml. Investigate, then upgrade the package
          (dnf upgrade google-cloud-cli) from a trusted network and re-run. Override
          repos_dnf_gcloud_min_version in config.yml if intentionally downgrading.
    - name: Pin google-cloud-cli version to limit MITM downgrade exposure
      community.general.dnf_versionlock:
        name: google-cloud-cli
        state: present
      ignore_errors: "{{ ansible_check_mode }}"  # package may be absent in check mode
  rescue:
    - name: Abort on google-cloud-cli version floor integrity failure
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('integrity check failed') }}"
      when: ansible_failed_task.name is match('Assert google-cloud-cli meets')
    - name: Warn Google Cloud SDK repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Google Cloud SDK repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.

# Mullvad is a personal privacy VPN whose purpose is to bypass network monitoring —
# adding it on CSB could trigger SIEM/DLP alerts and violates corporate policy intent.
# Skip entirely on CSB (not just rescue-on-failure) unlike other consumer repos.
- name: Add Mullvad VPN repo
  when:
    - repo_mullvad
    - is_fedora
    - profile == 'personal'
    - not csb_detected
  block:
    - name: Add mullvad repo
      ansible.builtin.yum_repository:
        name: mullvad
        description: Mullvad VPN
        baseurl: "https://repository.mullvad.net/rpm/stable/$basearch"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://repository.mullvad.net/rpm/mullvad-keyring.asc"
        enabled: true
  rescue:
    # Block-level 'when' (not csb_detected) excludes CSB machines,
    # so csb_detected is always false when rescue runs.
    - name: Warn Mullvad VPN repo failed (network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Mullvad VPN repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.

# acli comes from Atlassian's SHA256-pinned rpm (roles/packages, install_standalone_binaries.yml). The old internal mirror
# path added an unsigned repo whose URL came from config.yml and dnf-installed acli as root from it; it is retired, and a
# repo file it left behind is removed below (it stayed enabled, so dnf-automatic could pull any package from it).
- name: Warn that repos_dnf_acli_baseurl is no longer used
  ansible.builtin.debug:
    msg: >-
      WARNING: repos_dnf_acli_baseurl in config.yml is ignored and can be removed: config.yml may not add an unsigned
      repo. acli installs from Atlassian's SHA256-pinned rpm (make packages; RHEL CSB gets no host acli: use the
      container).
  when: repos_dnf_acli_baseurl is defined

- name: Remove the retired unsigned acli repo
  ansible.builtin.yum_repository:
    name: acli
    state: absent
  register: _repos_dnf_acli_repo_removed

# The old path also version-locked acli, which keeps make packages from updating it to the pinned rpm.
- name: Read dnf version locks after removing the acli repo  # noqa: no-handler -- a read whose result the next task needs now
  ansible.builtin.command:
    argv: [dnf, versionlock, list]
  register: _repos_dnf_versionlock
  changed_when: false
  failed_when: false
  check_mode: false
  when: _repos_dnf_acli_repo_removed is changed

- name: Warn that a stale acli version lock remains
  ansible.builtin.debug:
    msg: >-
      WARNING: acli is version-locked from the retired internal-mirror repo. Run sudo dnf versionlock delete acli, then
      make packages, so acli updates to Atlassian's pinned rpm.
  when:
    - _repos_dnf_acli_repo_removed is changed
    - _repos_dnf_versionlock.stdout | default('') is search('(^|\W)acli(\W|$)', multiline=True)

# config.yml names this repo's URLs and the packages it may supply, never what it trusts. The keys it may use are pinned in
# repos_dnf_redhat_trusted_fingerprints in roles/repos_dnf/defaults/main.yml and read from that file at the point of use
# (role_path is a magic variable no other source overrides); the key import gets them, the fixed key path and the
# validated URL through its environment. The verified key is written to a fixed local file for gpgkey, so dnf never
# imports a key from the configured URL unchecked.
- name: Add Red Hat internal repos
  when:
    - repo_redhat
    - profile == 'work'
    - repos_dnf_redhat_baseurl is defined
  block:
    - name: Read an existing Red Hat internal repo file
      ansible.builtin.slurp:
        src: /etc/yum.repos.d/redhat-internal.repo
      register: _repos_dnf_redhat_existing
      failed_when: false
      when: not csb_detected
    # A file written before keys were pinned trusts a key from a config.yml URL: remove it unless it has the pinned shape
    # (gpgcheck on, gpgkey only the fixed local file, includepkgs set), so a later abort below cannot leave it enabled.
    # Not on CSB, where redhat-internal.repo may be IT's file (as in the disabled-repo cleanup below); there the role
    # only ever replaces it after every check passes, as before.
    - name: Remove a Red Hat internal repo file that does not trust only the pinned key
      ansible.builtin.yum_repository:
        name: redhat-internal
        state: absent
      when:
        - not csb_detected
        - _repos_dnf_redhat_existing.content is defined
        - >-
          not ((_repos_dnf_redhat_existing.content | b64decode) is search('(?m)^gpgcheck\s*=\s*1\s*$')
          and (_repos_dnf_redhat_existing.content | b64decode) is search('(?m)^gpgkey\s*=\s*'
          ~ ('file:///etc/pki/rpm-gpg/RPM-GPG-KEY-laptop-setup-redhat-internal' | regex_escape) ~ '\s*$')
          and (_repos_dnf_redhat_existing.content | b64decode) is search('(?m)^includepkgs\s*=\s*\S'))
    - name: Assert Red Hat internal repo URLs target expected internal domain
      ansible.builtin.assert:
        that:
          - repos_dnf_internal_hosts is sequence and repos_dnf_internal_hosts is not string
          - repos_dnf_internal_hosts | reject('match', '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?\Z') | list | length == 0
          - repos_dnf_redhat_baseurl is match('^https://(' ~ (['repo.redhat.com', 'keys.redhat.com'] + repos_dnf_internal_hosts)
            | map('regex_escape') | join('|') ~ ')/[A-Za-z0-9._~/%+$-]*\Z')
          - repos_dnf_redhat_gpgkey is match('^https://(' ~ (['repo.redhat.com', 'keys.redhat.com'] + repos_dnf_internal_hosts)
            | map('regex_escape') | join('|') ~ ')/[A-Za-z0-9._~/%+-]*\.gpg\Z')
        fail_msg: >-
          repos_dnf_redhat_baseurl and repos_dnf_redhat_gpgkey must be plain https URLs on known Red Hat
          hosts (repo.redhat.com, keys.redhat.com, or repos_dnf_internal_hosts, a list of hostnames);
          this prevents subdomain hijacking attacks. Do not use arbitrary redhat.com subdomains.
    - name: Assert Red Hat internal repo trust is pinned in the tracked defaults file
      ansible.builtin.assert:
        # the tracked file is read inline (no intermediate variable another source could override); a differing
        # variable means an override somewhere, which would mislead, so it stops the run too
        that:
          - repos_dnf_redhat_trusted_fingerprints
            == (lookup('ansible.builtin.file', role_path ~ '/defaults/main.yml') | from_yaml).repos_dnf_redhat_trusted_fingerprints
          - repos_dnf_redhat_trusted_fingerprints | length > 0
          - repos_dnf_redhat_trusted_fingerprints | reject('match', '^[0-9A-Fa-f]{40}\Z') | list | length == 0
        fail_msg: >-
          SECURITY: the Red Hat internal repo needs its signing key pinned in repos_dnf_redhat_trusted_fingerprints in
          roles/repos_dnf/defaults/main.yml (a reviewed commit), as full 40-hex primary fingerprints. That variable must not
          be set in config.yml or any other file, and repos_dnf_redhat_gpg_fingerprint in config.yml is no longer read: move
          its value into the defaults file by PR, or remove repos_dnf_redhat_baseurl from config.yml.
    - name: Assert Red Hat internal repo packages are named
      ansible.builtin.assert:
        that:
          - repos_dnf_redhat_packages is sequence and repos_dnf_redhat_packages is not string
          - repos_dnf_redhat_packages | length > 0
          - repos_dnf_redhat_packages | reject('match', '^[A-Za-z0-9][A-Za-z0-9._+-]*\Z') | list | length == 0
          - repos_dnf_redhat_repo_gpgcheck | string | lower in ['true', 'false']
        fail_msg: >-
          Set repos_dnf_redhat_packages in config.yml to the package names the Red Hat internal repo supplies (a list of
          plain names, no globs; dnf includepkgs), e.g. [rhpkg]. repos_dnf_redhat_repo_gpgcheck must be true or false.
    - name: Import Red Hat internal GPG key
      ansible.builtin.script: import-pinned-key.sh  # skipped in check mode
      environment:
        KEY_URL: "{{ repos_dnf_redhat_gpgkey }}"
        PINNED: >-
          {{ (lookup('ansible.builtin.file', role_path ~ '/defaults/main.yml') | from_yaml).repos_dnf_redhat_trusted_fingerprints
          | join(' ') }}
        PIN_VAR: repos_dnf_redhat_trusted_fingerprints (roles/repos_dnf/defaults/main.yml)
        DEST: /etc/pki/rpm-gpg/RPM-GPG-KEY-laptop-setup-redhat-internal
      changed_when: false
    - name: Add Red Hat internal repo
      ansible.builtin.yum_repository:
        name: redhat-internal
        description: Red Hat Internal Tools
        baseurl: "{{ repos_dnf_redhat_baseurl }}"
        gpgcheck: true
        repo_gpgcheck: "{{ repos_dnf_redhat_repo_gpgcheck | bool }}"
        gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-laptop-setup-redhat-internal
        includepkgs: "{{ repos_dnf_redhat_packages }}"
        enabled: true
  rescue:
    - name: Abort on invalid Red Hat internal repo configuration or an unpinned key
      ansible.builtin.fail:
        msg: >-
          {{ ansible_failed_result.msg | default('invalid Red Hat internal repo configuration') }}
          {{ ansible_failed_result.stderr | default('') }}
      when: >-
        ansible_failed_task.name is match('Assert Red Hat internal repo')
        or 'SECURITY:' in (ansible_failed_result.stderr | default(''))
    - name: Record Red Hat repo failure
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: repos_dnf
        _csb_task_name: "Add Red Hat internal repository"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown') }}"
        _csb_action: "Install Red Hat internal tools manually or request VPN access"
        _csb_ticket_summary: "Exception request: Red Hat internal RPM repository"
        _csb_ticket_body: >-
          The Red Hat internal tools repository provides packages for Red Hat engineering workflows.
          Repo URL: {{ repos_dnf_redhat_baseurl }} (internal Red Hat package repository).
          Internal packages are not available through RHSM, EPEL, or any public repository.
          Blocked workflows: internal tooling installation, debugging packages, Red Hat-specific dev utilities.
      when: csb_rhel
    - name: Warn Red Hat internal repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Red Hat internal repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.
      when: not csb_rhel

# RPM Fusion free provides multimedia codecs (H.264/AAC, ffmpeg, VLC). Guard is 'not csb_rhel'
# (not 'not csb_detected') intentionally: hybrid CSB Fedora (csb_detected=true, csb_rhel=false) is
# not blocked by this role, but IT may flag repos outside its allowlist; check IT policy before enabling.
# If your IT policy prohibits RPM Fusion, set repo_rpmfusion_free: false in config.yml.
- name: Enable RPM Fusion free repo
  when:
    - repo_rpmfusion_free
    - is_fedora
    - not csb_rhel
  block:
    - name: Assert RPM Fusion free GPG fingerprint is the tracked pin
      ansible.builtin.assert:
        that: >-
          repos_dnf_rpmfusion_gpg_fingerprint
          == (lookup('ansible.builtin.file', role_path ~ '/defaults/main.yml') | from_yaml).repos_dnf_rpmfusion_gpg_fingerprint
        fail_msg: >-
          SECURITY: repos_dnf_rpmfusion_gpg_fingerprint must not be overridden (config.yml, group_vars or -e); the key
          import uses the pin in roles/repos_dnf/defaults/main.yml. Change it there by PR.
    # noqa: command-instead-of-module — installed-state probe so a rerun skips the URL download
    - name: Check whether RPM Fusion free release is installed
      ansible.builtin.command:
        cmd: rpm -q rpmfusion-free-release
      register: _rpmfusion_free_installed
      changed_when: false
      failed_when: false
      check_mode: false
    - name: Import RPM Fusion free GPG key
      ansible.builtin.script: import-pinned-key.sh  # skipped in check mode
      environment:
        KEY_URL: https://download1.rpmfusion.org/free/fedora/RPM-GPG-KEY-rpmfusion-free-fedora-2020
        PINNED: >-
          {{ (lookup('ansible.builtin.file', role_path ~ '/defaults/main.yml') | from_yaml).repos_dnf_rpmfusion_gpg_fingerprint }}
        PIN_VAR: repos_dnf_rpmfusion_gpg_fingerprint (roles/repos_dnf/defaults/main.yml)
      changed_when: false
    - name: Install RPM Fusion free release
      when:
        - _rpmfusion_free_installed.rc != 0  # the URL install re-downloads the RPM on every run
        - not ansible_check_mode  # the key import above is skipped in check mode, so dnf would reject the RPM
      ansible.builtin.dnf:
        # yamllint disable-line rule:line-length
        name: "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] | int }}.noarch.rpm"
        state: present
  rescue:
    - name: Abort on a GPG fingerprint override, an unpinned key or a bad repo path
      ansible.builtin.fail:
        msg: >-
          {{ ansible_failed_result.msg | default('invalid GPG fingerprint configuration') }}
          {{ ansible_failed_result.stderr | default('') }}
      when: >-
        ansible_failed_task.name is match('Assert .* (GPG fingerprint|repo path)')
        or 'SECURITY:' in (ansible_failed_result.stderr | default(''))
    - name: Warn RPM Fusion free failed (network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Enable RPM Fusion free repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a GPG bootstrap failure (libdnf5 enforces GPG on @commandline
          installs on Fedora 41+ before the release package can deliver its key), a
          key fingerprint mismatch (possible tampering) or a transient network error
          (DNS timeout, connectivity). Continuing playbook execution.

# RPM Fusion nonfree provides proprietary firmware and drivers (NVIDIA, Broadcom) and
# is allowed on hybrid Fedora CSB for the same reason as the free repo above.
# Guard is 'not csb_rhel' intentionally. Off by default (repo_rpmfusion_nonfree: false); set it to
# true in config.yml to opt in, if your IT policy permits nonfree repos.
- name: Enable RPM Fusion nonfree repo
  when:
    - repo_rpmfusion_nonfree
    - is_fedora
    - not csb_rhel
  block:
    - name: Assert RPM Fusion nonfree GPG fingerprint is the tracked pin
      ansible.builtin.assert:
        that: >-
          repos_dnf_rpmfusion_nonfree_gpg_fingerprint
          == (lookup('ansible.builtin.file', role_path ~ '/defaults/main.yml') | from_yaml).repos_dnf_rpmfusion_nonfree_gpg_fingerprint
        fail_msg: >-
          SECURITY: repos_dnf_rpmfusion_nonfree_gpg_fingerprint must not be overridden (config.yml, group_vars or -e); the key
          import uses the pin in roles/repos_dnf/defaults/main.yml. Change it there by PR.
    # noqa: command-instead-of-module — installed-state probe so a rerun skips the URL download
    - name: Check whether RPM Fusion nonfree release is installed
      ansible.builtin.command:
        cmd: rpm -q rpmfusion-nonfree-release
      register: _rpmfusion_nonfree_installed
      changed_when: false
      failed_when: false
      check_mode: false
    - name: Import RPM Fusion nonfree GPG key
      ansible.builtin.script: import-pinned-key.sh  # skipped in check mode
      environment:
        KEY_URL: https://download1.rpmfusion.org/nonfree/fedora/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020
        PINNED: >-
          {{ (lookup('ansible.builtin.file', role_path ~ '/defaults/main.yml') | from_yaml).repos_dnf_rpmfusion_nonfree_gpg_fingerprint }}
        PIN_VAR: repos_dnf_rpmfusion_nonfree_gpg_fingerprint (roles/repos_dnf/defaults/main.yml)
      changed_when: false
    - name: Install RPM Fusion nonfree release
      when:
        - _rpmfusion_nonfree_installed.rc != 0  # the URL install re-downloads the RPM on every run
        - not ansible_check_mode  # the key import above is skipped in check mode, so dnf would reject the RPM
      ansible.builtin.dnf:
        name: >-  # yamllint disable-line rule:line-length
          https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version']
          | int }}.noarch.rpm
        state: present
  rescue:
    - name: Abort on a GPG fingerprint override, an unpinned key or a bad repo path
      ansible.builtin.fail:
        msg: >-
          {{ ansible_failed_result.msg | default('invalid GPG fingerprint configuration') }}
          {{ ansible_failed_result.stderr | default('') }}
      when: >-
        ansible_failed_task.name is match('Assert .* (GPG fingerprint|repo path)')
        or 'SECURITY:' in (ansible_failed_result.stderr | default(''))
    - name: Warn RPM Fusion nonfree failed (network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Enable RPM Fusion nonfree repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a GPG bootstrap failure (libdnf5 enforces GPG on @commandline
          installs on Fedora 41+ before the release package can deliver its key), a
          key fingerprint mismatch (possible tampering) or a transient network error
          (DNS timeout, connectivity). Continuing playbook execution.

- name: Add Tailscale repo
  when:
    - repo_tailscale
    - not csb_detected  # IT repo allowlist; tailscale installs from the base Fedora repos
  # The repo path is computed inline from facts at each use, never through a block var (config.yml values, set as
  # facts, outrank block and task vars: a comma in it would give dnf a second baseurl on another host).
  block:
    - name: Assert Tailscale GPG fingerprint is the tracked pin
      ansible.builtin.assert:
        that: >-
          repos_dnf_tailscale_gpg_fingerprint
          == (lookup('ansible.builtin.file', role_path ~ '/defaults/main.yml') | from_yaml).repos_dnf_tailscale_gpg_fingerprint
        fail_msg: >-
          SECURITY: repos_dnf_tailscale_gpg_fingerprint must not be overridden (config.yml, group_vars or -e); the key
          import uses the pin in roles/repos_dnf/defaults/main.yml. Change it there by PR.
    - name: Assert Tailscale repo path is fedora or rhel/<major>
      ansible.builtin.assert:
        that: >-
          ('fedora' if is_fedora else 'rhel/' ~ (ansible_facts['distribution_major_version'] | int))
          is match('^(fedora|rhel/[0-9]+)\Z')
    - name: Import Tailscale GPG key
      ansible.builtin.script: import-pinned-key.sh  # skipped in check mode
      environment:
        KEY_URL: >-
          https://pkgs.tailscale.com/stable/{{ ('fedora' if is_fedora else 'rhel/' ~ (ansible_facts['distribution_major_version'] | int))
          }}/repo.gpg
        PINNED: >-
          {{ (lookup('ansible.builtin.file', role_path ~ '/defaults/main.yml') | from_yaml).repos_dnf_tailscale_gpg_fingerprint }}
        PIN_VAR: repos_dnf_tailscale_gpg_fingerprint (roles/repos_dnf/defaults/main.yml)
        DEST: /etc/pki/rpm-gpg/RPM-GPG-KEY-laptop-setup-tailscale
      changed_when: false
    - name: Add Tailscale stable repo
      ansible.builtin.yum_repository:
        name: tailscale-stable
        description: Tailscale stable
        # Tailscale uses a single static 'fedora' path for all Fedora releases (no per-version subdirectory)
        baseurl: >-
          https://pkgs.tailscale.com/stable/{{ ('fedora' if is_fedora else 'rhel/' ~ (ansible_facts['distribution_major_version'] | int))
          }}/$basearch
        gpgcheck: true
        repo_gpgcheck: true
        # the checked key bytes, not the URL: dnf would import whatever key that URL served later, unchecked
        gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-laptop-setup-tailscale
        enabled: true
  rescue:
    - name: Abort on a GPG fingerprint override, an unpinned key or a bad repo path
      ansible.builtin.fail:
        msg: >-
          {{ ansible_failed_result.msg | default('invalid GPG fingerprint configuration') }}
          {{ ansible_failed_result.stderr | default('') }}
      when: >-
        ansible_failed_task.name is match('Assert .* (GPG fingerprint|repo path)')
        or 'SECURITY:' in (ansible_failed_result.stderr | default(''))
    - name: Warn Tailscale repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Tailscale repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key) or a
          key fingerprint mismatch (possible tampering; check repos_dnf_tailscale_gpg_fingerprint).
          Continuing playbook execution.

# Cleanup: remove stale .repo files for repos whose boolean was flipped to false.
# yum_repository state: absent deletes /etc/yum.repos.d/<name>.repo idempotently.
# A repo whose package is installed is kept: removing it silently stops that package's
# security updates (e.g. a browser installed outside this playbook).
# Exception: redhat-internal is removed whenever it is not configured (its packages are not tracked), except on CSB (IT-managed repo file).
- name: Gather installed packages before third-party repo cleanup
  ansible.builtin.package_facts:
    manager: rpm

# The repo lists are inline in each loop: a block var would let config.yml (set as facts, it outranks it) name any repo file
# for removal as root.
- name: Third-party repo cleanup for disabled toggles
  block:
    - name: Keep disabled third-party repos whose packages are installed
      # tailscale is not noticed: it may come from the base repos. The removal task below still keeps its repo file.
      ansible.builtin.debug:
        msg: >-
          Keeping the {{ item.repo }} repo although {{ item.toggle }} is false: {{ item.pkg }} is
          installed and would stop receiving updates. Set {{ item.toggle }}: true in config.yml to
          silence this, or remove the package first.
      loop:
        - {repo: gh-cli, pkg: gh, toggle: repo_gh_cli, enabled: "{{ repo_gh_cli }}"}
        - {repo: google-chrome, pkg: google-chrome-stable, toggle: repo_google_chrome, enabled: "{{ repo_google_chrome }}"}
        - {repo: google-cloud-cli, pkg: google-cloud-cli, toggle: repo_google_cloud_sdk, enabled: "{{ repo_google_cloud_sdk }}"}
        - {repo: mullvad, pkg: mullvad-vpn, toggle: repo_mullvad, enabled: "{{ repo_mullvad }}"}
      loop_control:
        label: "{{ item.repo }}"
      when:
        - not (item.enabled | bool)
        - item.pkg in ansible_facts.packages
        - not (csb_detected and item.repo in ['google-chrome', 'google-cloud-cli'])  # IT-managed repo files

    - name: Remove disabled third-party repo files
      ansible.builtin.yum_repository:
        name: "{{ item.repo }}"
        state: absent
      loop:
        - {repo: gh-cli, pkg: gh, toggle: repo_gh_cli, enabled: "{{ repo_gh_cli }}"}
        - {repo: google-chrome, pkg: google-chrome-stable, toggle: repo_google_chrome, enabled: "{{ repo_google_chrome }}"}
        - {repo: google-cloud-cli, pkg: google-cloud-cli, toggle: repo_google_cloud_sdk, enabled: "{{ repo_google_cloud_sdk }}"}
        - {repo: mullvad, pkg: mullvad-vpn, toggle: repo_mullvad, enabled: "{{ repo_mullvad }}"}
        - {repo: tailscale-stable, pkg: tailscale, toggle: repo_tailscale, enabled: "{{ repo_tailscale }}"}
      loop_control:
        label: "{{ item.repo }}"
      when:
        - not (item.enabled | bool)
        - item.pkg not in ansible_facts.packages
        - not (csb_detected and item.repo in ['google-chrome', 'google-cloud-cli'])  # IT-managed repo files

- name: Remove redhat-internal repo when disabled
  ansible.builtin.yum_repository:
    name: redhat-internal
    state: absent
  when:
    - not (repo_redhat and profile == 'work' and repos_dnf_redhat_baseurl is defined)
    - not csb_detected  # IT-managed repo file on CSB
