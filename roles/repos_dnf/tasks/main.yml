      failed_when: false
    - name: Warn RPM Fusion nonfree failed (network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Enable RPM Fusion nonfree repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a GPG bootstrap failure (libdnf5 enforces GPG on @commandline
          installs on Fedora 41+ before the release package can deliver its key) or a
          transient network error (DNS timeout, connectivity). Continuing playbook execution.

- name: Add Tailscale repo
  when:
    - repo_tailscale
    - not csb_rhel
  block:
    - name: Add Tailscale stable repo
      vars:
        _ts_path: >-
          {{ 'rhel/' ~ ansible_facts['distribution_major_version'] if not is_fedora else 'fedora' }}
      ansible.builtin.yum_repository:
        name: tailscale-stable
        description: Tailscale stable
        # Tailscale uses a single static 'fedora' path for all Fedora releases (no per-version subdirectory)
        baseurl: "https://pkgs.tailscale.com/stable/{{ _ts_path }}/$basearch"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://pkgs.tailscale.com/stable/{{ _ts_path }}/repo.gpg"
        enabled: true
  rescue:
    - name: Warn Tailscale repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Tailscale repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.
      when: not csb_rhel
