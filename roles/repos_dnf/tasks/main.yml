          REL="{{ ansible_facts['distribution_major_version'] }}"
          URL="https://rpmfusion.org/keys?action=AttachFile&do=get&target=RPM-GPG-KEY-rpmfusion-nonfree-fedora-${REL}"  # yamllint disable
          curl -fsSL "$URL" -o "$KEYFILE"
          FP=$(gpg --show-keys --with-colons "$KEYFILE" 2>/dev/null | grep "^fpr" | cut -d: -f10)
          if [ -z "$FP" ]; then exit 1; fi
