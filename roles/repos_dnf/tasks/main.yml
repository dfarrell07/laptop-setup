---
# roles/repos_dnf/tasks/main.yml
# Third-party RPM repos (dnf-based OS only).
# Uses block/rescue to handle CSB restrictions gracefully.

- name: Add GitHub CLI repo
  # gh is in standard Fedora repos (F43+) — third-party repo only needed for RHEL/Rocky
  when:
    - repo_gh_cli
    - ansible_facts['distribution'] != 'Fedora'
  block:
    - name: Add gh-cli repo
      ansible.builtin.yum_repository:
        name: gh-cli
        description: GitHub CLI
        baseurl: "https://cli.github.com/packages/rpm"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
        enabled: true
  rescue:
    - name: Record gh-cli repo failure
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: repos_dnf
        _csb_task_name: "Add GitHub CLI repository"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown') }}"
        _csb_action: "Install gh binary manually or inside container"
        _csb_ticket_summary: "Exception request: GitHub CLI RPM repository"
        _csb_ticket_body: >-
          GitHub CLI (gh) is the official command-line tool for GitHub, used for PR
          creation/review, issue management, and CI workflow dispatch.
          Repo URL: https://cli.github.com/packages/rpm.
          RHEL/Rocky ship no gh package; Fedora ships gh in standard repos but this handler does not run on Fedora.
          Blocked workflows: all PR review automation and CI trigger scripts.
      when: csb_rhel
    - name: Warn gh-cli repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add GitHub CLI repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.
      when: not csb_rhel

- name: Add Google Chrome repo
  when:
    - repo_google_chrome
    - ansible_facts['architecture'] == 'x86_64'
  block:
    - name: Add google-chrome repo
      ansible.builtin.yum_repository:
        name: google-chrome
        description: Google Chrome
        baseurl: "{{ repos_dnf_google_chrome_repo }}"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://dl.google.com/linux/linux_signing_key.pub"
        enabled: true
  rescue:
    - name: Record Chrome repo failure
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: repos_dnf
        _csb_task_name: "Add Google Chrome repository"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown') }}"
        _csb_action: "Download Chrome RPM directly or use Chromium from Fedora repos"
        _csb_ticket_summary: "Exception request: Google Chrome RPM repository"
        _csb_ticket_body: >-
          Google Chrome is the reference browser required for web development testing
          against the dominant production browser engine.
          Repo URL: https://dl.google.com/linux/chrome/rpm/stable/x86_64.
          Chromium from Fedora repos lacks Widevine DRM and Google-specific APIs needed for compatibility testing.
          Blocked workflows: web application testing, DRM-gated content, browser-specific debugging.
      when: csb_rhel
    - name: Warn Google Chrome repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Google Chrome repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.
      when: not csb_rhel

- name: Add Google Cloud SDK repo
  when:
    - repo_google_cloud_sdk
    - ansible_facts['architecture'] == 'x86_64'
  block:
    - name: Add google-cloud-cli repo
      vars:
        _gcloud_use_el10: >-
          {{ (is_fedora and ansible_facts['distribution_major_version'] | int >= 40)
             or (not is_fedora and ansible_facts['distribution_major_version'] | int >= 10) }}
      ansible.builtin.yum_repository:
        name: google-cloud-cli
        description: Google Cloud CLI
        baseurl: "https://packages.cloud.google.com/yum/repos/cloud-sdk-{{ 'el10' if _gcloud_use_el10 else 'el9' }}-x86_64"
        gpgcheck: true
        repo_gpgcheck: false  # packages.cloud.google.com does not sign repomd.xml
        gpgkey: "https://packages.cloud.google.com/yum/doc/{{ 'rpm-package-key-v10.gpg' if _gcloud_use_el10 else 'rpm-package-key.gpg' }}"  # yamllint disable-line rule:line-length
        enabled: true
  rescue:
    - name: Record Google Cloud SDK repo failure
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: repos_dnf
        _csb_task_name: "Add Google Cloud SDK repository"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown') }}"
        _csb_action: "Install gcloud manually or inside container"
        _csb_ticket_summary: "Exception request: Google Cloud SDK RPM repository"
        _csb_ticket_body: >-
          Google Cloud SDK (gcloud/gsutil/bq) provides CLI tools for Google Cloud Platform resource management.
          Repo URL: https://packages.cloud.google.com/yum/repos/cloud-sdk-el10-x86_64 (el9 on older releases).
          Fedora does not ship gcloud; pip install lacks some SDK components and shell integration scripts.
          Blocked workflows: GCP resource management, container image publishing to GCR, GKE cluster access.
      when: csb_rhel
    - name: Warn Google Cloud SDK repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Google Cloud SDK repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.
      when: not csb_rhel

- name: Add Slack repo
  when:
    - repo_slack
    - ansible_facts['architecture'] == 'x86_64'
  block:
    - name: Add slack repo
      ansible.builtin.yum_repository:
        name: slack
        description: Slack Desktop
        # packagecloud uses fedora/21 as a static bucket for all Fedora versions — intentional, not stale
        baseurl: "https://packagecloud.io/slacktechnologies/slack/fedora/21/x86_64"
        # packagecloud Slack repo does not sign individual RPMs; repo_gpgcheck also unsafe
        # (packagecloud metadata signing inconsistent). Not a dnf-automatic risk: packagecloud repos
        # publish no updateinfo.xml, so upgrade_type=security never matches Slack (no advisory metadata).
        gpgcheck: false
        repo_gpgcheck: false
        enabled: true
  rescue:
    - name: Record Slack repo failure
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: repos_dnf
        _csb_task_name: "Add Slack repository"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown') }}"
        _csb_action: "Install Slack via Flatpak or download RPM directly"
        _csb_ticket_summary: "Exception request: Slack RPM repository"
        _csb_ticket_body: >-
          Slack Desktop is the primary team communication client used across Red Hat engineering.
          Repo URL: https://packagecloud.io/slacktechnologies/slack/fedora/21/x86_64.
          Flatpak Slack has degraded screen sharing on Wayland and missing system tray integration;
          the browser app lacks desktop notifications and file-upload drag-and-drop.
          Blocked workflows: team communication, incident response, meeting coordination.
      when: csb_rhel
    - name: Warn Slack repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Slack repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.
      when: not csb_rhel

# Mullvad is a personal privacy VPN whose purpose is to bypass network monitoring —
# adding it on CSB could trigger SIEM/DLP alerts and violates corporate policy intent.
# Skip entirely on CSB (not just rescue-on-failure) unlike other consumer repos.
- name: Add Mullvad VPN repo
  when:
    - repo_mullvad
    - is_fedora
    - not csb_detected
  block:
    - name: Add mullvad repo
      ansible.builtin.yum_repository:
        name: mullvad
        description: Mullvad VPN
        baseurl: "https://repository.mullvad.net/rpm/stable/$basearch"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://repository.mullvad.net/rpm/mullvad-keyring.asc"
        enabled: true
  rescue:
    # No CSB handler here: the block-level 'when' already excludes CSB machines
    # (not csb_detected), so csb_detected is always false when rescue runs.
    - name: Warn Mullvad VPN repo failed (network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Mullvad VPN repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.

- name: Add Docker CE repo
  when: repo_docker_ce
  block:
    - name: Add docker-ce repo
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker CE Stable
        baseurl: "https://download.docker.com/linux/{{ _docker_distro }}/$releasever/$basearch/stable"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://download.docker.com/linux/{{ _docker_distro }}/gpg"
        enabled: true
      vars:
        _docker_distro: >-
          {{ 'fedora' if is_fedora
             else ('centos' if ansible_facts['distribution'] in ['Rocky', 'AlmaLinux', 'CentOS']
             else 'rhel') }}
  rescue:
    - name: Record Docker CE repo failure
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: repos_dnf
        _csb_task_name: "Add Docker CE repository"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown') }}"
        _csb_action: "Use rootless Podman instead (recommended)"
        _csb_ticket_summary: "Exception request: Docker CE RPM repository"
        _csb_ticket_body: >-
          Docker CE provides the Docker daemon and CLI for container builds requiring Docker-specific APIs.
          Repo URL: https://download.docker.com/linux/fedora/$releasever/$basearch/stable (rhel/ for RHEL hosts).
          Rootless Podman satisfies most use cases but lacks Docker BuildKit and compose v2 features
          required by upstream CI scripts that invoke docker directly.
          Blocked workflows: building images with Docker-native CI pipelines, testing Docker-specific tooling.
      when: csb_rhel
    - name: Warn Docker CE repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Docker CE repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.
      when: not csb_rhel

- name: Add acli repo
  when:
    - repo_acli
    - profile == 'work'
    - repos_dnf_acli_baseurl is defined
  block:
    - name: Add acli repo
      ansible.builtin.yum_repository:
        name: acli
        description: Atlassian CLI
        baseurl: "{{ repos_dnf_acli_baseurl }}"
        gpgcheck: false  # Internal Red Hat repo does not publish a GPG key
        repo_gpgcheck: false  # metadata also unsigned — same limitation as gpgcheck above
        enabled: true
  rescue:
    - name: Record acli repo failure
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: repos_dnf
        _csb_task_name: "Add acli repository"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown') }}"
        _csb_action: "Install acli via pipx: pipx install atlassian-cli"
        _csb_ticket_summary: "Exception request: acli RPM repository"
        _csb_ticket_body: >-
          acli is a Red Hat-internal command-line tool for Jira and Confluence automation.
          Repo URL: {{ repos_dnf_acli_baseurl }} (internal Red Hat package repository).
          No public RPM is available; the internal repo is the only supported distribution channel.
          pip install atlassian-cli is a different third-party project and not a drop-in replacement.
          Blocked workflows: Jira ticket management, Confluence updates, sprint planning scripts.
      when: csb_rhel
    - name: Warn acli repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add acli repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.
      when: not csb_rhel

- name: Add Red Hat internal repos
  when:
    - repo_redhat
    - profile == 'work'
    - repos_dnf_redhat_baseurl is defined
  block:
    - name: Add Red Hat internal repo
      ansible.builtin.yum_repository:
        name: redhat-internal
        description: Red Hat Internal Tools
        baseurl: "{{ repos_dnf_redhat_baseurl }}"
        gpgcheck: "{{ repos_dnf_redhat_gpgkey | default('') | length > 0 }}"
        gpgkey: "{{ repos_dnf_redhat_gpgkey | default(omit) }}"
        enabled: true
  rescue:
    - name: Record Red Hat repo failure
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: repos_dnf
        _csb_task_name: "Add Red Hat internal repository"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown') }}"
        _csb_action: "Install Red Hat internal tools manually or request VPN access"
        _csb_ticket_summary: "Exception request: Red Hat internal RPM repository"
        _csb_ticket_body: >-
          The Red Hat internal tools repository provides packages for Red Hat engineering workflows.
          Repo URL: {{ repos_dnf_redhat_baseurl }} (internal Red Hat package repository).
          Internal packages are not available through RHSM, EPEL, or any public repository.
          Blocked workflows: internal tooling installation, debugging packages, Red Hat-specific dev utilities.
      when: csb_rhel
    - name: Warn Red Hat internal repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Red Hat internal repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.
      when: not csb_rhel

- name: Enable RPM Fusion free repo
  when:
    - repo_rpmfusion_free
    - is_fedora
    - not csb_rhel
  block:
    - name: Install RPM Fusion free release
      ansible.builtin.dnf:
        name: "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"  # yamllint disable-line rule:line-length
        state: present
  rescue:
    - name: Warn RPM Fusion free failed (network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Enable RPM Fusion free repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.

- name: Enable RPM Fusion nonfree repo
  when:
    - repo_rpmfusion_nonfree
    - is_fedora
    - not csb_rhel
  block:
    - name: Install RPM Fusion nonfree release
      ansible.builtin.dnf:
        name: "https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"  # yamllint disable-line rule:line-length
        state: present
  rescue:
    - name: Warn RPM Fusion nonfree failed (network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Enable RPM Fusion nonfree repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.

- name: Add Tailscale repo
  when: repo_tailscale
  block:
    - name: Add Tailscale stable repo
      vars:
        _ts_path: >-
          {{ 'rhel/' ~ ansible_facts['distribution_major_version'] if ansible_facts['distribution'] != 'Fedora' else 'fedora' }}
      ansible.builtin.yum_repository:
        name: tailscale-stable
        description: Tailscale stable
        # Tailscale uses a single static 'fedora' path for all Fedora releases (no per-version subdirectory)
        baseurl: "https://pkgs.tailscale.com/stable/{{ _ts_path }}/$basearch"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://pkgs.tailscale.com/stable/{{ _ts_path }}/repo.gpg"
        enabled: true
  rescue:
    - name: Record Tailscale repo failure
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-failure-handler.yml"
      vars:
        _csb_role: repos_dnf
        _csb_task_name: "Add Tailscale repository"
        _csb_error: "{{ ansible_failed_result.msg | default('unknown') }}"
        _csb_action: >-
          Download from https://pkgs.tailscale.com/stable/ or use make container.
        _csb_ticket_summary: "Exception request: Tailscale RPM repository"
        _csb_ticket_body: >-
          Tailscale provides a WireGuard-based mesh VPN for secure access to development infrastructure.
          Repo URL: https://pkgs.tailscale.com/stable/fedora/$basearch (rhel/$releasever for RHEL hosts).
          Fedora ships Tailscale but lags upstream by 1-3 releases; current releases include security patches
          and WireGuard improvements not present in the Fedora-packaged version.
          Blocked workflows: access to personal dev servers, home lab resources, cross-network development.
      when: csb_rhel
    - name: Warn Tailscale repo failed (non-CSB network error)
      ansible.builtin.debug:
        msg: >-
          REPO SETUP FAILED: Add Tailscale repository in role repos_dnf.
          Error: {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}.
          This is likely a transient network error (DNS timeout, expired GPG key).
          Continuing playbook execution.
      when: not csb_rhel
