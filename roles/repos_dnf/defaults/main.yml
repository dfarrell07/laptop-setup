---
profile: work  # fallback for standalone invocation
is_fedora: false  # fallback; authoritative value in group_vars/all/vars.yml
csb_detected: false  # fallback; authoritative value in group_vars/all/vars.yml
csb_rhel: false  # fallback; authoritative value in group_vars/all/vars.yml

# Repo toggle fallbacks — authoritative values in group_vars/all/vars.yml.
# Required here for standalone-invocability (see the repo_* toggles in vars.yml).
repo_gh_cli: true
repo_google_chrome: false
repo_google_cloud_sdk: false
repo_mullvad: true
repo_redhat: true
repo_rpmfusion_free: true
repo_rpmfusion_nonfree: false
repo_tailscale: true

repos_dnf_google_chrome_repo: "https://dl.google.com/linux/chrome/rpm/stable/x86_64"

# Pinned fingerprints below are read from this tracked file at the point of use (role_path lookup); a different value
# of the variable from config.yml, group_vars or -e stops the run. Change them here by PR.
# RPM Fusion GPG key fingerprints — pinned to detect MITM on initial key fetch.
# Primary fingerprints of the upstream 2020 certificates published at
# https://download1.rpmfusion.org/{free,nonfree}/fedora/RPM-GPG-KEY-rpmfusion-{free,nonfree}-fedora-2020
# Free and nonfree use separate certificates; Fedora 44 release RPMs verify with these keys.
repos_dnf_rpmfusion_gpg_fingerprint: "E9A491A3DE247814E7E067EAE06F8ECDD651FF2E"
repos_dnf_rpmfusion_nonfree_gpg_fingerprint: "79BDB88F9BBF73910FD4095B6A2AF96194843C65"

# Tailscale GPG key fingerprint — pinned to detect MITM on initial key fetch.
# Fingerprint valid for: https://pkgs.tailscale.com/stable/fedora/repo.gpg
# Compare the primary certificate fingerprint, excluding subkey fingerprints.
repos_dnf_tailscale_gpg_fingerprint: "2596A99EAAB33821893C0A79458CA832957F5868"

# Signing keys trusted for the Red Hat internal repo (work profile; repos_dnf_redhat_baseurl in config.yml).
# config.yml may name the repo's hosts and URLs but not what it trusts: the key import reads this list from this
# tracked, PR-reviewed file at the point of use (role_path lookup), so no variable override reaches it, and a differing
# value of the variable (config.yml, a gitignored group_vars file, -e) stops the run. Every key in the file at
# repos_dnf_redhat_gpgkey, as both gpg and rpm parse it, must be listed, or nothing is imported and no repo is written.
# Empty: the repo cannot be enabled. Add a key's full primary fingerprint by PR (public-key fingerprints are not secrets):
#   gpg --show-keys --with-colons key.gpg | awk -F: '$1 == "pub" {p=1} $1 == "fpr" && p {print $10; p=0}'
repos_dnf_redhat_trusted_fingerprints: []

# Package names the Red Hat internal repo may supply (dnf includepkgs; plain names, no globs). Set in config.yml;
# required when repos_dnf_redhat_baseurl is set. It narrows what the repo offers; since config.yml sets it, the control
# against unsigned code is the pinned key, not this list.
repos_dnf_redhat_packages: []

# Whether the Red Hat internal repo's metadata (repomd.xml) must be signed by a trusted key. Set false in config.yml
# only for a repo that signs packages but not metadata; package signatures (gpgcheck) are always required.
repos_dnf_redhat_repo_gpgcheck: true

# Exact hostnames (besides public repo.redhat.com / keys.redhat.com) that repos_dnf_redhat_baseurl and
# repos_dnf_redhat_gpgkey may target (letters, digits, dots and hyphens). Set in config.yml; e.g. [pkgs.example.internal].
# Empty: only the public hosts are accepted. Matching is anchored. Trust comes from repos_dnf_redhat_trusted_fingerprints,
# not from this list.
repos_dnf_internal_hosts: []

# Minimum google-cloud-cli version floor (MITM downgrade protection).
# repo_gpgcheck: false on packages.cloud.google.com lets a MITM serve unsigned repomd.xml
# that lists an older signed RPM; this floor ensures the installed version is not below a
# known-good release. RPM-level gpgcheck still verifies payload authenticity.
# Update when upgrading gcloud: rpm -q --queryformat '%{VERSION}' google-cloud-cli
repos_dnf_gcloud_min_version: "500.0.0"

# Internal Red Hat / work-profile repo URLs — set in config.yml (gitignored), NOT here.
# If defined (in config.yml), these are used by the redhat-internal repo tasks.
# Setting them here (even commented-out and re-enabled) defeats the 'is defined' guard
# and passes an empty baseurl to yum_repository, causing a cryptic failure.
# See default.config.yml Additional toggles for the correct override location.
