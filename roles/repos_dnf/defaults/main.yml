---
profile: work  # fallback for standalone invocation
is_fedora: false  # fallback; authoritative value in group_vars/all/vars.yml
csb_detected: false  # fallback; authoritative value in group_vars/all/vars.yml
csb_rhel: false  # fallback; authoritative value in group_vars/all/vars.yml

# Repo toggle fallbacks — authoritative values in group_vars/all/vars.yml.
# Required here for standalone-invocability (see vars.yml line 46).
repo_gh_cli: true
repo_google_chrome: false
repo_google_cloud_sdk: false
repo_mullvad: true
repo_docker_ce: false
repo_redhat: true
repo_rpmfusion_free: true
repo_rpmfusion_nonfree: false
repo_tailscale: true

repos_dnf_google_chrome_repo: "https://dl.google.com/linux/chrome/rpm/stable/x86_64"

# RPM Fusion GPG key fingerprints — pinned to detect MITM on initial key fetch.
# As of Fedora 44+, free and nonfree share the same signing key; both vars are
# intentionally identical. If RPM Fusion ever re-splits keys (as they did pre-F38),
# override repos_dnf_rpmfusion_nonfree_gpg_fingerprint independently in config.yml.
repos_dnf_rpmfusion_gpg_fingerprint: "79BDB8874A068716907325C664A4849E4C7033EA"
repos_dnf_rpmfusion_nonfree_gpg_fingerprint: "{{ repos_dnf_rpmfusion_gpg_fingerprint }}"

# Tailscale GPG key fingerprint — pinned to detect MITM on initial key fetch.
# Fingerprint valid for: https://pkgs.tailscale.com/stable/fedora/repo.gpg
# To refresh: curl -fsSL https://pkgs.tailscale.com/stable/fedora/repo.gpg | gpg --show-keys --with-colons | grep "^fpr" | cut -d: -f10 | head -1
repos_dnf_tailscale_gpg_fingerprint: "2596A99EAAB33821893C0A79458CA832957F5868"

# Red Hat internal GPG key fingerprint (work profile only)
# Pinned to detect MITM attacks on initial key fetch from internal Red Hat domains.
# If GPG key is compromised at fetch time, fingerprint verification fails before import.
# Fingerprint valid for: Red Hat internal package repos (pkgs.devel.redhat.com).
# Must be defined in config.yml (gitignored) when repos_dnf_redhat_gpgkey is used.
# To extract fingerprint: gpg --show-keys --with-colons /path/to/key.gpg | grep "^fpr" | cut -d: -f10
repos_dnf_redhat_gpg_fingerprint: ""

# Minimum google-cloud-cli version floor (MITM downgrade protection).
# repo_gpgcheck: false on packages.cloud.google.com lets a MITM serve unsigned repomd.xml
# that lists an older signed RPM; this floor ensures the installed version is not below a
# known-good release. RPM-level gpgcheck still verifies payload authenticity.
# Update when upgrading gcloud: rpm -q --queryformat '%{VERSION}' google-cloud-cli
repos_dnf_gcloud_min_version: "500.0.0"

# Internal Red Hat / work-profile repo URLs — set in config.yml (gitignored), NOT here.
# If defined (in config.yml), these are used by the acli and redhat-internal repo tasks.
# Setting them here (even commented-out and re-enabled) defeats the 'is defined' guard
# and passes an empty baseurl to yum_repository, causing a cryptic failure.
# See default.config.yml Additional toggles for the correct override location.
