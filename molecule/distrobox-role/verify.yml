---
- name: Verify (distrobox role)
  hosts: distrobox-role-test
  gather_facts: true
  vars:
    distrobox_container_name: "fedora-dev"

  tasks:
    - name: Stat distrobox config directory
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.config/distrobox"
      register: verify_distrobox_dir

    - name: Assert distrobox config directory exists with mode 0755
      ansible.builtin.assert:
        that:
          - verify_distrobox_dir.stat.exists
          - verify_distrobox_dir.stat.isdir
          - verify_distrobox_dir.stat.mode == '0755'
        fail_msg: "~/.config/distrobox missing or wrong mode (expected 0755)"

    - name: Stat distrobox.ini
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.config/distrobox/distrobox.ini"
      register: verify_ini

    - name: Assert distrobox.ini exists with mode 0644
      ansible.builtin.assert:
        that:
          - verify_ini.stat.exists
          - verify_ini.stat.mode == '0644'
        fail_msg: "~/.config/distrobox/distrobox.ini missing or wrong mode (expected 0644)"

    - name: Read distrobox.ini contents
      ansible.builtin.slurp:
        src: "{{ ansible_env.HOME }}/.config/distrobox/distrobox.ini"
      register: verify_ini_contents

    - name: Assert distrobox.ini contains container section header
      ansible.builtin.assert:
        that: "'[' ~ distrobox_container_name ~ ']' in (verify_ini_contents.content | b64decode)"
        fail_msg: "distrobox.ini does not contain [{{ distrobox_container_name }}] section header"

    - name: Read pass-1 distrobox call log
      ansible.builtin.slurp:
        src: /tmp/distrobox-calls-pass1.log
      register: verify_pass1_log

    - name: Assert pass-1 log contains --replace
      ansible.builtin.assert:
        that: "'--replace' in (verify_pass1_log.content | b64decode)"
        fail_msg: "pass-1 distrobox log missing '--replace' — assemble create --replace was not called"

    - name: Assert stub logging works — pass-1 log records the assemble create call
      ansible.builtin.assert:
        that: "'assemble create' in (verify_pass1_log.content | b64decode)"
        fail_msg: >-
          pass-1 distrobox log lacks 'assemble create' — the stub is not recording calls,
          so the pass-2 negative 'assemble create' check below would pass vacuously
          (pass 2 still logs the start-container call, but must log no 'assemble create')

    - name: Read pass-2 distrobox call log
      ansible.builtin.slurp:
        src: /tmp/distrobox-calls.log
      register: verify_pass2_log

    - name: Assert pass-2 log has no assemble create
      ansible.builtin.assert:
        that:
          - "'assemble create' not in (verify_pass2_log.content | b64decode)"
          - "'enter --name' in (verify_pass2_log.content | b64decode)"
        fail_msg: >-
          pass-2 distrobox log contains 'assemble create' (skip-create path not taken) or lacks the
          start-container 'enter --name' call (the log is not recording, so the negative check proves nothing)
