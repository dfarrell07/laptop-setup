---
# Prepare: stabilize systemd, install pre-requisites, then re-stabilize.
# Fedora 44 runs /usr/sbin/init (systemd) as PID 1.
#
# Problem: openssh-server and policycoreutils-python-utils RPM post-install
# scripts call %systemd_post → systemctl daemon-reload, which crashes a
# fully-initialized systemd container.  Installing them during converge
# pre_tasks hits a fully-loaded systemd and reliably crashes it.
#
# Solution: install here during prepare, after an initial systemd-running wait.
# After install, wait again so systemd can process the daemon-reload and
# re-stabilize before the converge begins.
#
# NOTE: do NOT write to /etc/systemd/system/ here — inotify on that path
# triggers a daemon-reload during systemd init that crashes the container.
- name: Prepare (stabilize systemd, install prereqs, re-stabilize)
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Wait for container connection to be available
      ansible.builtin.wait_for_connection:
        timeout: 60
        delay: 2
        sleep: 2

    - name: Wait for systemd to reach running or degraded state (pre-install)
      ansible.builtin.command: systemctl is-system-running # noqa: command-instead-of-module
      register: systemd_state_pre
      retries: 30
      delay: 2
      until: systemd_state_pre.stdout in ['running', 'degraded']
      failed_when: false
      changed_when: false

    - name: Install packages whose RPM post-install calls systemctl daemon-reload
      # tsflags=noscripts skips %systemd_post → systemctl daemon-reload.
      # daemon-reload in a fully-initialized systemd container crashes it.
      # openssh-server: sshd.yml generates SSH host keys in containers separately.
      # policycoreutils-python-utils: only provides Python bindings; no service needed.
      ansible.builtin.raw: dnf install -y --setopt=tsflags=noscripts openssh-server policycoreutils-python-utils
      changed_when: true
      failed_when: false

    - name: Wait for systemd to remain stable after package installs
      ansible.builtin.command: systemctl is-system-running # noqa: command-instead-of-module
      register: systemd_state_post
      retries: 15
      delay: 2
      until: systemd_state_post.stdout in ['running', 'degraded']
      failed_when: false
      changed_when: false

    # Unmanaged-file quarantine fixtures: the dotfiles role must move these to
    # ~/.local/state/laptop-setup/quarantine/ (asserted in verify.yml).
    # environment.d is not planted: that cleanup is skipped when system_is_container.
    - name: Create git template hooks directory for quarantine fixture
      ansible.builtin.file:
        path: ~/.config/git/template/hooks
        state: directory
        mode: "0755"

    - name: Plant unmanaged git template hook (quarantine fixture)
      ansible.builtin.copy:
        dest: ~/.config/git/template/hooks/post-checkout
        content: "#!/bin/sh\nexit 0\n"
        mode: "0755"
