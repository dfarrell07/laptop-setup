---
- name: Verify (Fedora)
  hosts: all
  gather_facts: true

  pre_tasks:
    # set_fact from converge does not persist to a separate verify invocation.
    # Fedora converge sets profile: work; re-apply here so verify-common.yml
    # GONOSUMDB/GOPRIVATE checks evaluate in the correct profile context.
    - name: Set work profile for verify context
      ansible.builtin.set_fact:
        profile: work
        go_tools_installed: false  # packages_install_binaries: false in container CI skips go install
        is_fedora: "{{ ansible_facts['distribution'] == 'Fedora' }}"  # set_fact from converge does not persist

  tasks:
    # --- Shared assertions (all platforms) ---
    - name: Include common verify assertions
      ansible.builtin.import_tasks: ../shared/verify-common.yml

    - name: Include smoke-test verification
      ansible.builtin.import_tasks: ../shared/verify-smoke.yml

    # --- Shared assertions (dnf platforms) ---
    - name: Include dnf verify assertions
      ansible.builtin.import_tasks: ../shared/verify-dnf.yml

    # --- redhat role: minimal assertions (cert/VPN packages unavailable from public repos in CI) ---
    # Verify the condition logic fired correctly — is_fedora=true triggers cert/VPN install blocks.
    # Full install-success verification requires internal repos (out of scope for Podman CI).
    - name: Assert is_fedora is true on Fedora molecule host
      ansible.builtin.assert:
        that: is_fedora
        fail_msg: "is_fedora is false on Fedora host — csb_detect.yml condition regression"

    # --- repos_dnf role: third-party repo files ---
    - name: Verify tailscale-stable.repo exists
      ansible.builtin.stat:
        path: /etc/yum.repos.d/tailscale-stable.repo
      register: verify_tailscale_repo

    - name: Assert tailscale-stable.repo was deployed by repos_dnf
      ansible.builtin.assert:
        that: verify_tailscale_repo.stat.exists
        fail_msg: "tailscale-stable.repo missing — repos_dnf role not exercised or template broken"

    # --- Fedora-specific: package checks ---
    - name: Check vim is installed
      ansible.builtin.command:
        cmd: vim --version
      changed_when: false

    # --- Notes role ---
    - name: Verify notes role
      ansible.builtin.import_tasks: ../shared/verify-notes.yml

    # --- Desktop role ---
    - name: Include Alacritty and Chrome policy assertions
      ansible.builtin.import_tasks: ../shared/verify-desktop-common.yml

    # --- Desktop WM configs (converge sets desktop_environment: sway) ---
    - name: Include sway config assertions
      ansible.builtin.import_tasks: ../shared/verify-sway.yml

    # --- Desktop WM configs (second converge run sets desktop_environment: i3) ---
    - name: Verify i3 config deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/i3/config"
      register: verify_i3

    - name: Assert i3 config exists
      ansible.builtin.assert:
        that: verify_i3.stat.exists
        fail_msg: "i3 config not deployed"

    - name: Verify i3 config has terminal keybinding
      ansible.builtin.command:
        cmd: grep -q 'bindsym.*Return exec' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts lxpolkit authentication agent
      ansible.builtin.command:
        cmd: grep -q 'lxpolkit' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config caps audio raise volume at 100% (wpctl -l 1.0)
      ansible.builtin.command:
        cmd: grep -q 'wpctl set-volume -l 1\.0' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts dunst notification daemon
      ansible.builtin.command:
        cmd: grep -q 'exec.*dunst' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts clipit clipboard manager
      ansible.builtin.command:
        cmd: grep -q 'exec.*clipit' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts xss-lock for sleep-triggered screen lock
      ansible.builtin.command:
        cmd: grep -q 'exec.*xss-lock' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts xautolock for idle screen lock
      ansible.builtin.command:
        cmd: grep -q 'exec.*xautolock' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3lock invocation in xautolock includes lock color flag
      ansible.builtin.command:
        cmd: grep -q 'i3lock -c [0-9a-fA-F]' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts nm-applet for network tray icon
      ansible.builtin.command:
        cmd: grep -q 'exec.*nm-applet' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 screenshot binding uses scrot
      ansible.builtin.command:
        cmd: grep -q 'exec.*scrot' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config runs autorandr for display profile
      ansible.builtin.command:
        cmd: grep -q 'exec.*autorandr' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    # --- System role: bpfman.socket ---
    # bpfman is in packages_networking which is emptied in converge, so the binary
    # will not be present in normal CI runs and the assertions below are skipped.
    # The structure is here so that if bpfman is ever added to the molecule package
    # set, socket activation is verified automatically.
    - name: Check bpfman binary presence
      ansible.builtin.stat:
        path: /usr/bin/bpfman
      register: verify_bpfman_bin

    - name: Check bpfman.socket is enabled
      ansible.builtin.command: systemctl is-enabled bpfman.socket  # noqa: command-instead-of-module
      register: verify_bpfman_socket
      changed_when: false
      failed_when: false
      when: verify_bpfman_bin.stat.exists

    - name: Assert bpfman.socket is enabled when bpfman binary is present
      ansible.builtin.assert:
        that: verify_bpfman_socket.rc == 0
        fail_msg: "bpfman.socket is not enabled — bpfman load/list will fail at runtime"
      when: verify_bpfman_bin.stat.exists

    # --- System role: usbguard ---
    # usbguard assertions are handled by molecule/shared/verify-smoke.yml.

    # --- Work profile: Claude work instance directory ---
    - name: Verify Claude work config directory
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.claude-work"
      register: verify_claude_work

    - name: Assert Claude work config directory exists with mode 0700
      ansible.builtin.assert:
        that:
          - verify_claude_work.stat.exists
          - verify_claude_work.stat.isdir
          - verify_claude_work.stat.mode == '0700'
        fail_msg: "Claude work config dir missing or wrong permissions"

    - name: Verify Claude work settings.local.json exists
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.claude-work/settings.local.json"
      register: verify_claude_work_settings

    - name: Assert Claude work settings.local.json exists with mode 0600
      ansible.builtin.assert:
        that:
          - verify_claude_work_settings.stat.exists
          - verify_claude_work_settings.stat.mode == '0600'
        fail_msg: "Claude work settings.local.json not deployed or wrong permissions"

    - name: Validate Claude work settings.local.json sandbox and deny config
      ansible.builtin.command:
        cmd: >-
          python3 -c "
          import json, sys
          d = json.load(open('{{ ansible_user_dir }}/.claude-work/settings.local.json'))
          assert d.get('sandbox', {}).get('enabled'), 'sandbox.enabled is not true'
          assert d.get('sandbox', {}).get('failIfUnavailable'), 'sandbox.failIfUnavailable is not true'
          assert not d.get('sandbox', {}).get('allowUnsandboxedCommands'), 'sandbox.allowUnsandboxedCommands is not false'
          assert d.get('enableAllProjectMcpServers') == False, 'enableAllProjectMcpServers is not false'
          assert len(d.get('permissions', {}).get('deny', [])) > 0, 'deny list is empty'
          "
      changed_when: false
      when: verify_claude_work_settings.stat.exists

    - name: Verify Claude work CLAUDE.md exists
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.claude-work/CLAUDE.md"
      register: verify_claude_md_work

    - name: Assert Claude work CLAUDE.md exists
      ansible.builtin.assert:
        that: verify_claude_md_work.stat.exists
        fail_msg: "Claude CLAUDE.md not deployed (work profile)"

    # --- Claude task queue (converge sets claude_queue_enabled: true) ---
    - ansible.builtin.import_tasks: ../shared/verify-claude-queue.yml

    # DNS-over-TLS (99-dot.conf) checked in molecule/shared/verify-common.yml

    # --- git_repos role: verify a public HTTPS repo was actually cloned ---
    - name: Verify public HTTPS repo was cloned to ~/src/ by git_repos role
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/src/ci-test/laptop-setup/.git"
      register: verify_git_repos_clone

    - name: Assert public HTTPS repo clone succeeded
      ansible.builtin.assert:
        that:
          - verify_git_repos_clone.stat.exists
          - verify_git_repos_clone.stat.isdir
        fail_msg: >-
          git_repos clone task did not create ~/src/ci-test/laptop-setup/.git —
          clone task logic regression or git_repos_list filtering broken

    # --- distrobox role: no-op path (packages_containers emptied in converge) ---
    - name: Import distrobox no-op path assertions
      ansible.builtin.import_tasks: ../shared/verify-distrobox-noop.yml
