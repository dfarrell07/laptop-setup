---
- name: Verify (Fedora)
  hosts: all
  gather_facts: true

  pre_tasks:
    # set_fact from converge does not persist to a separate verify invocation.
    # Fedora converge sets profile: work; re-apply here so verify-common.yml
    # GONOSUMDB/GOPRIVATE checks evaluate in the correct profile context.
    - name: Set work profile for verify context
      ansible.builtin.set_fact:
        profile: work
        go_tools_installed: false  # packages_install_binaries: false in container CI skips go install

  tasks:
    # --- Shared assertions (all platforms) ---
    - name: Include common verify assertions
      ansible.builtin.include_tasks: ../shared/verify-common.yml

    - name: Include smoke-test verification
      ansible.builtin.include_tasks: ../shared/verify-smoke.yml

    # --- Shared assertions (dnf platforms) ---
    - name: Include dnf verify assertions
      ansible.builtin.include_tasks: ../shared/verify-dnf.yml

    # --- repos_dnf role: third-party repo files ---
    - name: Verify tailscale-stable.repo exists
      ansible.builtin.stat:
        path: /etc/yum.repos.d/tailscale-stable.repo
      register: verify_tailscale_repo

    - name: Assert tailscale-stable.repo was deployed by repos_dnf
      ansible.builtin.assert:
        that: verify_tailscale_repo.stat.exists
        fail_msg: "tailscale-stable.repo missing — repos_dnf role not exercised or template broken"

    # --- Fedora-specific: package checks ---
    - name: Check vim is installed
      ansible.builtin.command:
        cmd: vim --version
      changed_when: false

    - name: Check curl is installed
      ansible.builtin.command:
        cmd: which curl
      changed_when: false

    # --- Notes role (private repo, clone expected to fail gracefully in CI) ---
    - name: Check notes repo directory
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/notes/.git"
      register: verify_notes

    - name: Assert notes .git/config has 0600 when repo exists
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/notes/.git/config"
      register: verify_notes_config
      when: verify_notes.stat.exists

    - name: Verify notes .git/config permissions
      ansible.builtin.assert:
        that: verify_notes_config.stat.mode == '0600'
        fail_msg: "notes .git/config should be 0600"
      when: verify_notes.stat.exists and verify_notes_config.stat.exists

    - name: Stat notes directory for permission check
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/notes"
      register: verify_notes_dir
      when: verify_notes.stat.exists

    - name: Assert notes directory is mode 0700
      ansible.builtin.assert:
        that: verify_notes_dir.stat.mode == '0700'
        fail_msg: "notes/ should be 0700 — world-readable notes regression"
      when: verify_notes.stat.exists

    # --- Desktop role ---
    - name: Verify Alacritty config deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/alacritty/alacritty.toml"
      register: verify_alacritty

    - name: Assert Alacritty config exists
      ansible.builtin.assert:
        that: verify_alacritty.stat.exists
        fail_msg: "Alacritty config not deployed"

    - name: Verify Chrome policy deployed
      ansible.builtin.stat:
        path: /etc/opt/chrome/policies/managed/security.json
      register: verify_chrome

    - name: Assert Chrome policy exists
      ansible.builtin.assert:
        that: verify_chrome.stat.exists
        fail_msg: "Chrome security policy not deployed"

    - name: Validate Chrome security policy JSON
      ansible.builtin.command:
        cmd: >-
          python3 -c "import json; d=json.load(open('/etc/opt/chrome/policies/managed/security.json'));
          assert d.get('RemoteDebuggingAllowed') == False, 'RemoteDebuggingAllowed not false'"
      changed_when: false

    # --- Desktop WM configs (converge sets desktop_environment: sway) ---
    - name: Verify sway config deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/sway/config"
      register: verify_sway

    - name: Assert sway config exists
      ansible.builtin.assert:
        that: verify_sway.stat.exists
        fail_msg: "sway config not deployed"

    - name: Verify sway config uses exec_always for lxqt-policykit-agent (polkit-gnome removed Fedora 41+)
      ansible.builtin.command:
        cmd: grep -q 'exec_always.*lxqt-policykit-agent' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify sway config starts nm-applet for network tray icon
      ansible.builtin.command:
        cmd: grep -q 'exec_always nm-applet' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify sway config contains xkb_layout
      ansible.builtin.command:
        cmd: grep -q 'xkb_layout us' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify sway config uses exec_always for mako
      ansible.builtin.command:
        cmd: grep -q 'exec_always mako' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify sway output line contains scale directive and adaptive_sync
      ansible.builtin.command:
        cmd: grep -q 'output.*scale.*adaptive_sync enabled' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify sway config exports AMD VA-API environment variables
      ansible.builtin.command:
        cmd: grep -q 'LIBVA_DRIVER_NAME=radeonsi' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify sway config sets cursor theme for XWayland consistency
      ansible.builtin.command:
        cmd: grep -q 'xcursor_theme Adwaita' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify sway config starts cliphist clipboard history daemon
      ansible.builtin.command:
        cmd: grep -q 'wl-paste --watch cliphist store' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify sway config has cliphist keybinding to access history
      ansible.builtin.command:
        cmd: grep -q 'cliphist list.*wofi.*cliphist decode.*wl-copy' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify sway config caps audio raise volume at 100% (wpctl -l 1.0)
      ansible.builtin.command:
        cmd: grep -q 'wpctl set-volume -l 1\.0' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify sway screenshot binding pipes to wl-copy as image
      ansible.builtin.command:
        cmd: grep -q 'grim.*wl-copy -t image/png' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify portals.conf deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/xdg-desktop-portal/portals.conf"
      register: verify_portals

    - name: Assert portals.conf exists
      ansible.builtin.assert:
        that: verify_portals.stat.exists
        fail_msg: "portals.conf not deployed (screen sharing broken)"

    - name: Verify portals.conf routes ScreenCast to wlr backend
      ansible.builtin.command:
        cmd: grep -q 'ScreenCast=wlr' "{{ ansible_user_dir }}/.config/xdg-desktop-portal/portals.conf"
      changed_when: false

    - name: Verify i3status config deployed (shared by sway)
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/i3status/config"
      register: verify_i3status

    - name: Assert i3status config exists
      ansible.builtin.assert:
        that: verify_i3status.stat.exists
        fail_msg: "i3status config not deployed"

    - name: Verify swaylock config deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/swaylock/config"
      register: verify_swaylock

    - name: Assert swaylock config exists
      ansible.builtin.assert:
        that: verify_swaylock.stat.exists
        fail_msg: "swaylock config not deployed — desktop role copy task missing or dest path wrong"

    - name: Verify swaylock config contains show-failed-attempts
      ansible.builtin.command:
        cmd: grep -q 'show-failed-attempts' "{{ ansible_user_dir }}/.config/swaylock/config"
      changed_when: false

    - name: Verify sway config wires swayidle for auto-lock
      ansible.builtin.command:
        cmd: grep -q 'exec swayidle' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify swaylock invocation in swayidle includes color flag (template rendered non-empty)
      ansible.builtin.command:
        cmd: grep -q 'swaylock -f -c [0-9a-fA-F]' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify swayidle before-sleep wires swaylock (lock on suspend)
      ansible.builtin.command:
        cmd: grep -q 'before-sleep.*swaylock' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify swayidle resume restores display power
      ansible.builtin.command:
        cmd: grep -q 'resume.*swaymsg.*output.*power on' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify sway config enables tap-to-click on touchpad
      ansible.builtin.command:
        cmd: grep -q 'tap enabled' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify sway config enables natural scroll on touchpad
      ansible.builtin.command:
        cmd: grep -q 'natural_scroll enabled' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify sway config exports Qt Wayland platform hint
      ansible.builtin.command:
        cmd: grep -q 'QT_QPA_PLATFORM=wayland' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Verify sway config exports Electron Wayland platform hint
      ansible.builtin.command:
        cmd: grep -q 'ELECTRON_OZONE_PLATFORM_HINT=wayland' "{{ ansible_user_dir }}/.config/sway/config"
      changed_when: false

    - name: Stat GTK 3.0 settings.ini
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/gtk-3.0/settings.ini"
      register: verify_gtk3

    - name: Assert GTK 3.0 settings.ini exists
      ansible.builtin.assert:
        that: verify_gtk3.stat.exists
        fail_msg: "gtk-3.0/settings.ini not deployed — dark mode and icon theme broken for GTK3 apps under Sway"

    - name: Verify GTK 3.0 settings.ini contains gtk-theme-name
      ansible.builtin.command:
        cmd: grep -q 'gtk-theme-name' "{{ ansible_user_dir }}/.config/gtk-3.0/settings.ini"
      changed_when: false

    - name: Verify GTK 3.0 settings.ini contains gtk-icon-theme-name
      ansible.builtin.command:
        cmd: grep -q 'gtk-icon-theme-name' "{{ ansible_user_dir }}/.config/gtk-3.0/settings.ini"
      changed_when: false

    - name: Stat GTK 4.0 settings.ini
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/gtk-4.0/settings.ini"
      register: verify_gtk4

    - name: Assert GTK 4.0 settings.ini exists
      ansible.builtin.assert:
        that: verify_gtk4.stat.exists
        fail_msg: "gtk-4.0/settings.ini not deployed — dark mode and icon theme broken for GTK4 apps under Sway"

    - name: Verify GTK 4.0 settings.ini contains gtk-theme-name
      ansible.builtin.command:
        cmd: grep -q 'gtk-theme-name' "{{ ansible_user_dir }}/.config/gtk-4.0/settings.ini"
      changed_when: false

    - name: Verify GTK 4.0 settings.ini contains gtk-icon-theme-name
      ansible.builtin.command:
        cmd: grep -q 'gtk-icon-theme-name' "{{ ansible_user_dir }}/.config/gtk-4.0/settings.ini"
      changed_when: false

    # --- Desktop WM configs (second converge run sets desktop_environment: i3) ---
    - name: Verify i3 config deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/i3/config"
      register: verify_i3

    - name: Assert i3 config exists
      ansible.builtin.assert:
        that: verify_i3.stat.exists
        fail_msg: "i3 config not deployed"

    - name: Verify i3 config has terminal keybinding
      ansible.builtin.command:
        cmd: grep -q 'bindsym.*Return exec' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts lxpolkit authentication agent
      ansible.builtin.command:
        cmd: grep -q 'lxpolkit' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config caps audio raise volume at 100% (wpctl -l 1.0)
      ansible.builtin.command:
        cmd: grep -q 'wpctl set-volume -l 1\.0' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts dunst notification daemon
      ansible.builtin.command:
        cmd: grep -q 'exec.*dunst' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts clipit clipboard manager
      ansible.builtin.command:
        cmd: grep -q 'exec.*clipit' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts xss-lock for sleep-triggered screen lock
      ansible.builtin.command:
        cmd: grep -q 'exec.*xss-lock' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts xautolock for idle screen lock
      ansible.builtin.command:
        cmd: grep -q 'exec.*xautolock' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3lock invocation in xautolock includes lock color flag
      ansible.builtin.command:
        cmd: grep -q 'i3lock -c [0-9a-fA-F]' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts nm-applet for network tray icon
      ansible.builtin.command:
        cmd: grep -q 'exec.*nm-applet' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 screenshot binding uses scrot
      ansible.builtin.command:
        cmd: grep -q 'exec.*scrot' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config runs autorandr for display profile
      ansible.builtin.command:
        cmd: grep -q 'exec.*autorandr' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    # --- System role: bpfman.socket ---
    # bpfman is in packages_networking which is emptied in converge, so the binary
    # will not be present in normal CI runs and the assertions below are skipped.
    # The structure is here so that if bpfman is ever added to the molecule package
    # set, socket activation is verified automatically.
    - name: Check bpfman binary presence
      ansible.builtin.stat:
        path: /usr/bin/bpfman
      register: verify_bpfman_bin

    - name: Check bpfman.socket is enabled
      ansible.builtin.command: systemctl is-enabled bpfman.socket  # noqa: command-instead-of-module
      register: verify_bpfman_socket
      changed_when: false
      failed_when: false
      when: verify_bpfman_bin.stat.exists

    - name: Assert bpfman.socket is enabled when bpfman binary is present
      ansible.builtin.assert:
        that: verify_bpfman_socket.rc == 0
        fail_msg: "bpfman.socket is not enabled — bpfman load/list will fail at runtime"
      when: verify_bpfman_bin.stat.exists

    # --- System role: usbguard ---
    # usbguard assertions are handled by molecule/shared/verify-smoke.yml.

    # --- System role: TLP battery charge management ---
    # TLP is only installed when system_tlp_enabled is true (auto-detected from
    # ansible_form_factor Notebook/Portable/Laptop). The converge container is not
    # a laptop, so these assertions are skipped in normal CI runs. The structure
    # is here so that if system_tlp_enabled is forced true in converge, TLP
    # configuration is verified automatically.
    - name: Check tlp package is installed
      ansible.builtin.command: rpm -q tlp  # noqa: command-instead-of-module
      register: verify_tlp_pkg
      changed_when: false
      failed_when: false

    - name: Check tlp.service is enabled
      ansible.builtin.command: systemctl is-enabled tlp  # noqa: command-instead-of-module
      register: verify_tlp_service
      changed_when: false
      failed_when: false
      when: verify_tlp_pkg.rc == 0

    - name: Assert tlp.service is enabled
      ansible.builtin.assert:
        that: verify_tlp_service.rc == 0
        fail_msg: "tlp.service is not enabled — ThinkPad battery thresholds will not apply on boot"
      when: verify_tlp_pkg.rc == 0

    - name: Stat /etc/tlp.d/50-thinkpad.conf
      ansible.builtin.stat:
        path: /etc/tlp.d/50-thinkpad.conf
      register: verify_tlp_conf
      when: verify_tlp_pkg.rc == 0

    - name: Assert /etc/tlp.d/50-thinkpad.conf is deployed
      ansible.builtin.assert:
        that: verify_tlp_conf.stat.exists
        fail_msg: "/etc/tlp.d/50-thinkpad.conf not deployed — battery threshold drop-in missing"
      when: verify_tlp_pkg.rc == 0

    - name: Check START_CHARGE_THRESH_BAT0=20 in TLP config (default start threshold)
      ansible.builtin.command:
        cmd: grep -q '^START_CHARGE_THRESH_BAT0=20$' /etc/tlp.d/50-thinkpad.conf
      changed_when: false
      when:
        - verify_tlp_pkg.rc == 0
        - verify_tlp_conf.stat.exists

    - name: Check power-profiles-daemon is masked (conflicts with TLP)
      ansible.builtin.systemd:
        name: power-profiles-daemon
      register: verify_ppd
      become: true
      failed_when: false
      when: verify_tlp_pkg.rc == 0

    - name: Assert power-profiles-daemon is masked when TLP is active
      ansible.builtin.assert:
        that: verify_ppd.status.UnitFileState == 'masked'
        fail_msg: "power-profiles-daemon is not masked — conflicts with TLP over battery thresholds and ACPI platform profiles"
      when: verify_tlp_pkg.rc == 0 and verify_ppd.status.UnitFileState | default('') != ''

    # --- Claude task queue (converge sets claude_queue_enabled: true) ---
    - name: Verify claude-queue.service deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/systemd/user/claude-queue.service"
      register: verify_claude_queue_service

    - name: Assert claude-queue.service exists with mode 0644
      ansible.builtin.assert:
        that:
          - verify_claude_queue_service.stat.exists
          - verify_claude_queue_service.stat.mode == '0644'
        fail_msg: "claude-queue.service missing or wrong permissions — template regression?"

    - name: Verify claude-queue.timer deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/systemd/user/claude-queue.timer"
      register: verify_claude_queue_timer

    - name: Assert claude-queue.timer exists with mode 0644
      ansible.builtin.assert:
        that:
          - verify_claude_queue_timer.stat.exists
          - verify_claude_queue_timer.stat.mode == '0644'
        fail_msg: "claude-queue.timer missing or wrong permissions — template regression?"

    - name: Verify claude-queue-poller.sh deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.local/bin/claude-queue-poller.sh"
      register: verify_claude_queue_poller

    - name: Assert claude-queue-poller.sh exists with mode 0700
      ansible.builtin.assert:
        that:
          - verify_claude_queue_poller.stat.exists
          - verify_claude_queue_poller.stat.mode == '0700'
        fail_msg: "claude-queue-poller.sh missing or wrong permissions — expected 0700"

    - name: Verify queue-repos.conf deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/claude/queue-repos.conf"
      register: verify_claude_queue_repos_conf

    - name: Assert queue-repos.conf exists with mode 0600
      ansible.builtin.assert:
        that:
          - verify_claude_queue_repos_conf.stat.exists
          - verify_claude_queue_repos_conf.stat.mode == '0600'
        fail_msg: "queue-repos.conf missing or wrong permissions — expected 0600"

    # --- System role: DNS-over-TLS ---
    - name: Stat DNS-over-TLS config
      ansible.builtin.stat:
        path: /etc/systemd/resolved.conf.d/99-dot.conf
      register: verify_dot

    - name: Assert DNS-over-TLS config deployed
      ansible.builtin.assert:
        that: verify_dot.stat.exists
        fail_msg: "DNS-over-TLS config not deployed — system role regression"
