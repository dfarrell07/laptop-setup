---
- name: Verify (Fedora)
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Load configuration defaults
      ansible.builtin.include_vars: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/default.config.yml"

    - name: Load group_vars baselines for verify context
      ansible.builtin.include_vars: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/group_vars/all/vars.yml"

    # set_fact from converge does not persist to a separate verify invocation.
    # Fedora converge sets profile: work; re-apply here so verify-common.yml
    # GONOSUMDB/GOPRIVATE checks evaluate in the correct profile context.
    - name: Set work profile for verify context
      ansible.builtin.set_fact:
        profile: work
        system_is_container: true  # converge forces true; verify must match or not-system_is_container guards run against absent files
        system_chrony_service_enabled: false  # default auto-detects false in container; explicit for verify context clarity
        real_user_id: molecule  # ansible_user_id=root in container; subuid/subgid provisioned for molecule

  tasks:
    # --- Shared assertions (all platforms) ---
    - name: Include common verify assertions
      ansible.builtin.import_tasks: ../shared/verify-common.yml

    - name: Include smoke-test verification
      ansible.builtin.import_tasks: ../shared/verify-smoke.yml

    # --- Shared assertions (dnf platforms) ---
    - name: Include dnf verify assertions
      ansible.builtin.import_tasks: ../shared/verify-dnf.yml

    # --- redhat role: minimal assertions (cert/VPN packages unavailable from public repos in CI) ---
    # Verify the condition logic fired correctly — is_fedora=true triggers cert/VPN install blocks.
    # Full install-success verification requires internal repos (out of scope for Podman CI).

    # --- Notes role ---
    - name: Verify notes role
      ansible.builtin.import_tasks: ../shared/verify-notes.yml

    # --- Desktop role ---
    - name: Include Alacritty and Chrome policy assertions
      ansible.builtin.import_tasks: ../shared/verify-desktop-common.yml

    # --- Desktop WM configs (converge sets desktop_environment: sway) ---
    - name: Include sway config assertions
      ansible.builtin.import_tasks: ../shared/verify-sway.yml

    # --- Desktop WM configs (second converge run sets desktop_environment: i3) ---
    - name: Verify i3 config deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/i3/config"
      register: verify_i3

    - name: Assert i3 config exists
      ansible.builtin.assert:
        that: verify_i3.stat.exists
        fail_msg: "i3 config not deployed"

    - name: Verify i3 config has terminal keybinding
      ansible.builtin.command:
        cmd: grep -q 'bindsym.*Return exec' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts lxpolkit authentication agent
      ansible.builtin.command:
        cmd: grep -q 'lxpolkit' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config caps audio raise volume at 100% (wpctl -l 1.0)
      ansible.builtin.command:
        cmd: grep -q 'wpctl set-volume -l 1\.0' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts dunst notification daemon
      ansible.builtin.command:
        cmd: grep -q 'exec.*dunst' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts clipit clipboard manager
      ansible.builtin.command:
        cmd: grep -q 'exec.*clipit' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts xss-lock for sleep-triggered screen lock
      ansible.builtin.command:
        cmd: grep -q 'exec.*xss-lock' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts xautolock for idle screen lock
      ansible.builtin.command:
        cmd: grep -q 'exec.*xautolock' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3lock invocation in xautolock includes lock color flag
      ansible.builtin.command:
        cmd: grep -q 'i3lock -c [0-9a-fA-F]' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config starts nm-applet for network tray icon
      ansible.builtin.command:
        cmd: grep -q 'exec.*nm-applet' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 screenshot binding uses scrot
      ansible.builtin.command:
        cmd: grep -q 'exec.*scrot' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    - name: Verify i3 config runs autorandr for display profile
      ansible.builtin.command:
        cmd: grep -q 'exec.*autorandr' "{{ ansible_user_dir }}/.config/i3/config"
      changed_when: false

    # --- System role: usbguard ---
    # usbguard assertions are handled by molecule/shared/verify-smoke.yml.

    # --- Work profile: Claude work instance directory ---
    - name: Include Claude work instance directory and settings assertions
      ansible.builtin.import_tasks: ../shared/verify-claude-work.yml

    # --- Claude task queue (converge sets claude_queue_enabled: true) ---
    - name: Import Claude queue verification tasks
      ansible.builtin.import_tasks: ../shared/verify-claude-queue.yml

    # DNS-over-TLS (99-dot.conf) checked in molecule/shared/verify-common.yml

    # --- distrobox role: no-op path (packages_containers emptied in converge) ---
    - name: Import distrobox no-op path assertions
      ansible.builtin.import_tasks: ../shared/verify-distrobox-noop.yml
