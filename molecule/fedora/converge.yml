---
- name: Converge — System role (Fedora)
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Capture real user identity
      ansible.builtin.set_fact:
        real_user_home: "{{ lookup('env', 'HOME') }}"
        real_user_id: "{{ lookup('env', 'USER') }}"
      become: false

    - name: Load configuration
      ansible.builtin.include_vars: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/default.config.yml"

    - name: Load group_vars baselines (feature toggles, csb_rhel, needs_container_tier)
      # Molecule generates its own inventory in a temp dir; the project's group_vars/all/
      # are not auto-loaded. Load vars.yml explicitly so roles that reference repo_*,
      # csb_rhel, needs_container_tier, etc. don't fail with 'variable is undefined'.
      ansible.builtin.include_vars: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/group_vars/all/vars.yml"

    - name: Set project root for include paths
      ansible.builtin.set_fact:
        common_project_root: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    - name: Apply container-safe system role overrides
      ansible.builtin.include_tasks: "{{ common_project_root }}/molecule/shared/system-container-overrides.yml"

    - name: Install openssh-server so sshd hardening block is exercised in container CI
      ansible.builtin.dnf:
        name: openssh-server
        state: present

  roles:
    - role: system

- name: Converge — System setup (Fedora)
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load configuration
      ansible.builtin.include_vars: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/default.config.yml"

    - name: Load group_vars baselines (feature toggles, csb_rhel, needs_container_tier)
      ansible.builtin.include_vars: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/group_vars/all/vars.yml"

    - name: Set project root for include paths
      ansible.builtin.set_fact:
        common_project_root: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

  roles:
    - role: repos_dnf
      when: ansible_pkg_mgr in ['dnf', 'dnf5']

- name: Converge (Fedora)
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Load configuration
      ansible.builtin.include_vars: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/default.config.yml"

    - name: Load group_vars baselines (feature toggles, csb_rhel, needs_container_tier)
      ansible.builtin.include_vars: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/group_vars/all/vars.yml"

    - name: Override for container testing
      ansible.builtin.set_fact:
        profile: work
        notes_enabled: true
        git_repos_list:
          - url: https://github.com/dfarrell07/laptop-setup
            dest: ci-test/laptop-setup
            category: personal
            depth: 1
        packages_security: []
        packages_containers: []
        packages_networking: []
        packages_networking_work: []  # must also clear work-specific list after packages split
        packages_go_install_work: []  # work-profile OVN-K codegen go tools — not installable in CI
        dotfiles_github_user: "dfarrell07"
        dotfiles_user_name: "Molecule CI Test"
        dotfiles_user_email_work: "molecule-test@ci.invalid"
        dotfiles_user_email_personal: "molecule-test@ci.invalid"
        dotfiles_gonosumdb: "test.example.com"  # non-empty so verify-common GONOSUMDB assertions run
        dotfiles_goprivate: "git.example.com"   # non-empty so verify-common GOPRIVATE assertions run
        # install_virtualization, packages_install_binaries, ssh_signing_key_pub are in molecule/shared/system-container-overrides.yml

    # Create a minimal mock notes repo so the notes role skips cloning (private
    # repo, no SSH key in CI) but still runs the chmod tasks that set notes/
    # to 0700 and notes/.git/config to 0600 — which the verify assertions check.
    - name: Create mock notes .git directory for CI permission testing
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/notes/.git"
        state: directory
        mode: "0755"

    - name: Create mock notes .git/config for CI permission testing
      ansible.builtin.copy:
        content: "[core]\n\trepositoryformatversion = 0\n\tfilemode = true\n\tbare = false\n"  # noqa: no-tabs
        dest: "{{ ansible_user_dir }}/notes/.git/config"
        mode: "0644"

  roles:
    - role: common
    - role: packages
    - role: dotfiles
    - role: ssh
    - role: git_repos
    - role: notes
      vars:
        notes_transcrypt_password: ""
    - role: redhat
      when: is_rhel or csb_detected
    - role: containers
    - role: distrobox
    - role: claude
      vars:
        claude_install_method: skip
        claude_queue_enabled: true
        claude_queue_repo: "dfarrell07/laptop-setup"

  post_tasks:
    # Desktop role called via include_role so vars: are at role-params precedence (p20),
    # overriding include_vars desktop_environment: auto (p18) from default.config.yml.
    # Calling with roles: vars: would set vars at play-vars precedence (p12), losing to p18.
    - name: Converge desktop role (sway)
      ansible.builtin.include_role:
        name: desktop
      vars:
        desktop_environment: sway
        desktop_common_packages: []
        desktop_sway_packages: []
        desktop_i3_packages: []
        desktop_deploy_chrome_policies: true

    - name: Converge desktop role (i3)
      ansible.builtin.include_role:
        name: desktop
      vars:
        desktop_environment: i3
        desktop_common_packages: []
        desktop_sway_packages: []
        desktop_i3_packages: []
        desktop_deploy_chrome_policies: true

    - name: Generate CSB compatibility report
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/common/tasks/csb-report.yml"
      tags: [always]
