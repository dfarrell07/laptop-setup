---
- name: Converge — System role (Fedora)
  hosts: all
  become: true
  gather_facts: true
  # prepare.yml pre-installs openssh-server via tsflags=noscripts to avoid daemon-reload
  # crashes in the container; no install task needed here. Rocky keeps its equivalent block
  # because rocky/prepare.yml deliberately does NOT install openssh-server.

  pre_tasks:
    - name: Run common DNF system play pre-tasks
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/dnf-system-play-pre-tasks.yml"

  roles:
    - role: system

- name: Converge — System setup (Fedora)
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load CI pre-tasks (config, group_vars, project root)
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/ci-pre-tasks.yml"

  roles:
    - role: repos_dnf
      when: ansible_pkg_mgr in ['dnf', 'dnf5']

- name: Converge (Fedora)
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Load CI pre-tasks (config, group_vars, project root)
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/ci-pre-tasks.yml"

    - name: Override for container testing
      ansible.builtin.set_fact:
        profile: work
        # install_virtualization, packages_install_binaries, ssh_signing_key_pub are in molecule/shared/system-container-overrides.yml
        # packages_security_yubikey/containers/networking/support_work/go_install_work
        # empty list overrides live in molecule/shared/ci-default-vars.yml

    - name: Create mock notes repo structure for CI
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/ci-mock-notes.yml"

  roles:
    - role: common
    - role: packages
    - role: dotfiles
    - role: ssh
    - role: git_repos
    - role: notes
      vars:
        notes_transcrypt_password: ""
    - role: redhat
      when: is_rhel or csb_detected
    - role: containers
    - role: distrobox
    - role: claude
      vars:
        claude_install_method: skip
        claude_queue_enabled: true
        claude_queue_repo: "dfarrell07/laptop-setup"

  post_tasks:
    # Desktop role called via include_role so vars: are at role-params precedence (p20),
    # overriding desktop role default (desktop_environment: auto from roles/desktop/defaults/main.yml).
    # Calling with roles: vars: would set vars at play-vars precedence (p12), losing to p18.
    - name: Converge desktop role (sway)
      ansible.builtin.include_role:
        name: desktop
      vars:
        desktop_environment: sway
        desktop_dnf_packages: []
        desktop_sway_packages: []
        desktop_i3_packages: []

    - name: Converge desktop role (i3)
      ansible.builtin.include_role:
        name: desktop
      vars:
        desktop_environment: i3
        desktop_dnf_packages: []
        desktop_sway_packages: []
        desktop_i3_packages: []

    - name: Run shared converge post-tasks
      ansible.builtin.include_tasks: ../shared/converge-post-common.yml
      tags: [always]
