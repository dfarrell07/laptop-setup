---
# Shared vars for offline rescue-path molecule scenarios.
# Sourced by container-offline/converge.yml and container-offline-distrobox/converge.yml.
distrobox_packages:
  - git
  - vim
  - curl
distrobox_host_exec_commands:
  - podman
# Invalid version → 404 on mirror.openshift.com → rescue block fires.
distrobox_oc_version: "0.0.0-offline-test"
distrobox_golangci_lint_version: "v2.12.2"
distrobox_subctl_version: "v0.24.0"
# Override retry knobs so the 404/timeout fails in ≤5 s (one attempt).
distrobox_oc_fetch_retries: 0
distrobox_oc_fetch_delay: 0
distrobox_oc_fetch_timeout: 5
distrobox_oc_mirror_url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp"
