---
# Shared container-safe overrides for the system role in all molecule CI scenarios.
# Included by molecule/{fedora,rocky,debian}/converge.yml system role pre_tasks.
# Prevents container-incompatible tasks from running in Podman-based CI scenarios.
# NOTE: sshd hardening IS intentionally exercised in container CI — openssh-server is
# installed via a pre_task in each converge.yml before the system role runs, so the
# sshd block is NOT skipped (unlike the genuinely container-incompatible behaviors below).
- name: Compute OS detection facts (mirrors csb_detect.yml for system role pre-context)
  # In site.yml, csb_detect.yml runs in Play 1 pre_tasks before the system role, setting
  # is_dnf/is_apt/is_rhel/is_fedora/is_linux via set_fact (p19) which overrides vars.yml (p18).
  # In molecule converge.yml, csb_detect.yml runs later (common role, Play 3). This task
  # replicates the same detection so system role tasks that guard on is_dnf/is_apt see the right value.
  ansible.builtin.set_fact:
    is_dnf: "{{ ansible_facts['pkg_mgr'] | default('') in ['dnf', 'dnf5'] }}"
    is_apt: "{{ ansible_facts['pkg_mgr'] | default('') == 'apt' }}"
    is_rhel: "{{ ansible_facts['distribution'] == 'RedHat' }}"
    is_fedora: "{{ ansible_facts['distribution'] == 'Fedora' }}"
    is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"
    is_linux: "{{ ansible_facts['system'] == 'Linux' }}"

- name: Override for container testing (system role)
  ansible.builtin.set_fact:
    system_is_container: true             # explicit guard — auto-detect via virtualization_type may miss some images
    system_disable_usb_storage: false    # USB modprobe blacklisting is meaningless in containers
    system_kernel_lockdown: ''            # grubby cannot set kernel params in containers
    system_aide_enabled: false            # AIDE DB init takes 5-10 min; useless in CI
    system_install_usbguard: false        # no USB devices to guard in containers
                                          # CI gap: USBGuard install-configure-enable (package, rules.conf,
                                          # daemon.conf settings, service) is NOT exercised by any
                                          # Podman-based scenario — make test-vm is required for full USBGuard coverage
    install_virtualization: false         # libvirt not needed in CI container
    install_vpn: false                    # VPN packages not applicable in CI container
    install_docker: false                 # docker socket not applicable in CI container
    system_disable_fingerprint: true      # authselect enable-feature with-fingerprint + fprintd unmask destabilize
                                          # systemd in privileged Podman containers (cascading PAM restarts crash init).
                                          # true skips the enable-feature call and keeps fprintd masked/stopped.
                                          # CI gap: fprintd masking and authselect with-fingerprint enable are NOT
                                          # exercised by any Podman-based scenario — make test-vm is required for
                                          # full fingerprint auth coverage
    system_tlp_enabled: false             # TLP/ppd service ops fail in containers
    real_user_id: molecule                # containers connect as root; override to avoid sshd AllowUsers assert
    packages_install_binaries: false      # no binary downloads in container CI
    ssh_signing_key_pub: "sk-ssh-ed25519 AAAAIMoleculeTestKeyForCI molecule-test@ci"  # vault empty in CI
    ssh_git_signing_pubkey: "sk-ssh-ed25519 AAAAIMoleculeTestKeyForCI molecule-test@ci"  # vault empty in CI
    csb_rhel: false                       # test-isolation baseline; per-scenario converge plays override for CSB/RHEL scenarios
                                          # Rocky converge pre_tasks sets csb_rhel=true, but csb_detect.yml (common
                                          # role, runs first) recomputes csb_rhel=false (distribution='Rocky'!='RedHat');
                                          # redhat role is skipped on Rocky; verify.yml asserts RH CA cert is absent
    system_selinux_enforcing_required: false  # geerlingguy images report SELinux disabled regardless of host policy
    # CI gap: SELinux enforcement check is NOT exercised by Podman-based scenarios — make test-vm required
    system_timezone: UTC                  # CHANGE_ME sentinel from default.config.yml is invalid; use UTC in CI
    system_tmp_noexec: false              # /tmp noexec breaks Ansible remote_tmp=/tmp (Rocky molecule.yml);
                                          # mounts.yml still deploys the drop-in and nosuid/nodev, but skips noexec
    csb_detected: false                   # molecule temp inventory baseline
    needs_container_tier: "host-only"     # molecule temp inventory baseline
