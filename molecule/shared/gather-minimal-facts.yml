---
# molecule/shared/gather-minimal-facts.yml
# Gather only the minimal fact subsets needed for verify assertions.
# Included from the container, container-offline and container-offline-distrobox pre_tasks (full gather_facts is off).
- name: Gather minimal facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - distribution
      - env
      - user
