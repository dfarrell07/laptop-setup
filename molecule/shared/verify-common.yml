    that:
      - verify_auditd_rules.stat.exists
      - verify_auditd_rules.stat.mode == '0640'
    fail_msg: >-
      /etc/audit/rules.d/claude-code.rules not deployed or wrong mode
      (expected 0640, got {{ verify_auditd_rules.stat.mode | default('missing') }})
      — system role auditd task regression
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - not (system_is_container | default(false))

- name: Check auditd rules contain immutability flag -e 2
  ansible.builtin.command: grep -q '^-e 2$' /etc/audit/rules.d/claude-code.rules
  changed_when: false
  become: true
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - not (system_is_container | default(false))
