---
# molecule/shared/verify-common.yml
# Universal assertions that should pass on every platform.
# Include from each scenario's verify.yml via include_tasks.

- name: Check git is installed
  ansible.builtin.command: git --version  # noqa: command-instead-of-module
  changed_when: false

# --- Dotfiles ---
- name: Verify .zshrc exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.zshrc"
  register: verify_zshrc

- name: Assert .zshrc exists
  ansible.builtin.assert:
    that: verify_zshrc.stat.exists
    fail_msg: ".zshrc was not deployed"

- name: Verify git/config exists (XDG path)
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/git/config"
  register: verify_gitconfig

- name: Assert git/config exists (XDG path)
  ansible.builtin.assert:
    that: verify_gitconfig.stat.exists
    fail_msg: ".config/git/config was not deployed"

- name: Stat legacy ~/.gitconfig (should be absent after XDG migration)
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.gitconfig"
  register: verify_legacy_gitconfig

- name: Assert legacy ~/.gitconfig is absent (XDG migration complete)
  ansible.builtin.assert:
    that: not verify_legacy_gitconfig.stat.exists
    fail_msg: "~/.gitconfig exists alongside ~/.config/git/config — XDG migration incomplete"

- name: Verify .config/tmux/tmux.conf exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/tmux/tmux.conf"
  register: verify_tmux

- name: Assert .config/tmux/tmux.conf exists
  ansible.builtin.assert:
    that: verify_tmux.stat.exists
    fail_msg: ".config/tmux/tmux.conf was not deployed"

- name: Verify .vimrc exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.vimrc"
  register: verify_vimrc

- name: Assert .vimrc exists
  ansible.builtin.assert:
    that: verify_vimrc.stat.exists
    fail_msg: ".vimrc was not deployed"

- name: Verify bashrc deployed
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.bashrc"
  register: verify_bashrc

- name: Assert bashrc exists
  ansible.builtin.assert:
    that: verify_bashrc.stat.exists
    fail_msg: ".bashrc was not deployed"

- name: Check bashrc has Ansible managed marker
  ansible.builtin.command:
    cmd: grep -q 'Ansible managed' "{{ ansible_user_dir }}/.bashrc"
  changed_when: false

- name: Check bashrc has FZF_DEFAULT_OPTS
  ansible.builtin.command:
    cmd: grep -q 'FZF_DEFAULT_OPTS' "{{ ansible_user_dir }}/.bashrc"
  changed_when: false

- name: Check bashrc has DIRENV_LOG_FORMAT
  ansible.builtin.command:
    cmd: grep -q 'DIRENV_LOG_FORMAT' "{{ ansible_user_dir }}/.bashrc"
  changed_when: false

- name: Verify oh-my-zsh sentinel file exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.local/share/oh-my-zsh/oh-my-zsh.sh"
  register: verify_omz

- name: Assert oh-my-zsh clone is complete
  ansible.builtin.assert:
    that:
      - verify_omz.stat.exists
    fail_msg: "oh-my-zsh was not cloned — oh-my-zsh.sh sentinel missing"

- name: Verify git config-personal exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/git/config-personal"
  register: verify_git_personal

- name: Assert git config-personal deployed
  ansible.builtin.assert:
    that: verify_git_personal.stat.exists
    fail_msg: "git config-personal not deployed"

# --- SSH ---
- name: Verify SSH config exists with correct permissions
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.ssh/config"
  register: verify_ssh_config

- name: Assert SSH config exists and is 0600
  ansible.builtin.assert:
    that:
      - verify_ssh_config.stat.exists
      - verify_ssh_config.stat.mode == '0600'
    fail_msg: "SSH config missing or wrong permissions"

- name: Verify SSH directory permissions
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.ssh"
  register: verify_ssh_dir

- name: Assert SSH directory is 0700
  ansible.builtin.assert:
    that:
      - verify_ssh_dir.stat.exists
      - verify_ssh_dir.stat.mode == '0700'
    fail_msg: "SSH directory has wrong permissions"

- name: Check SSH config has KexAlgorithms directive
  ansible.builtin.command:
    cmd: grep -q 'KexAlgorithms' "{{ ansible_user_dir }}/.ssh/config"
  changed_when: false
  failed_when: false
  register: verify_ssh_kex

- name: Assert SSH config has KexAlgorithms with curve25519 baseline
  ansible.builtin.assert:
    that: verify_ssh_kex.rc == 0
    fail_msg: "SSH config missing KexAlgorithms directive — template regression?"

- name: Check SSH config has Ciphers directive
  ansible.builtin.command:
    cmd: grep -q 'Ciphers' "{{ ansible_user_dir }}/.ssh/config"
  changed_when: false
  failed_when: false
  register: verify_ssh_ciphers

- name: Assert SSH config has Ciphers directive
  ansible.builtin.assert:
    that: verify_ssh_ciphers.rc == 0
    fail_msg: "SSH config missing Ciphers directive — template regression?"

- name: Check SSH config has MACs directive
  ansible.builtin.command:
    cmd: grep -q '^ *MACs' "{{ ansible_user_dir }}/.ssh/config"
  changed_when: false
  failed_when: false
  register: verify_ssh_macs

- name: Assert SSH config has MACs directive
  ansible.builtin.assert:
    that: verify_ssh_macs.rc == 0
    fail_msg: "SSH config missing MACs directive — template regression?"

# --- SSH known_hosts ---
- name: Verify ~/.ssh/known_hosts exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.ssh/known_hosts"
  register: verify_known_hosts

- name: Assert known_hosts exists
  ansible.builtin.assert:
    that:
      - verify_known_hosts.stat.exists
      - verify_known_hosts.stat.mode == '0600'
    fail_msg: "~/.ssh/known_hosts was not created — GitHub known_hosts seeding did not run"

- name: Check known_hosts contains github.com entry
  ansible.builtin.command:
    cmd: ssh-keygen -F github.com -f "{{ ansible_user_dir }}/.ssh/known_hosts"
  register: verify_known_hosts_github
  changed_when: false
  failed_when: false

- name: Assert github.com is in known_hosts
  ansible.builtin.assert:
    that: verify_known_hosts_github.rc == 0
    fail_msg: "github.com is not present in ~/.ssh/known_hosts — known_hosts seeding regression?"

# --- Git security ---
- name: Check git core.fsmonitor
  ansible.builtin.command: git config --global core.fsmonitor  # noqa: command-instead-of-module
  register: verify_fsmonitor
  changed_when: false
  failed_when: false

- name: Assert git core.fsmonitor is false
  ansible.builtin.assert:
    that: verify_fsmonitor.stdout == 'false'
    fail_msg: "git core.fsmonitor is not set to false"

- name: Check git core.hooksPath
  ansible.builtin.command: git config --global core.hooksPath  # noqa: command-instead-of-module
  register: verify_hooks_path
  changed_when: false
  failed_when: false

- name: Assert core.hooksPath is set
  ansible.builtin.assert:
    that: "verify_hooks_path.stdout | trim == '~/.config/git/template/hooks'"
    fail_msg: "git core.hooksPath not set to ~/.config/git/template/hooks"

- name: Check git push.autoSetupRemote
  ansible.builtin.command: git config --global push.autoSetupRemote  # noqa: command-instead-of-module
  register: verify_auto_remote
  changed_when: false
  failed_when: false

- name: Assert push.autoSetupRemote is true
  ansible.builtin.assert:
    that: verify_auto_remote.stdout == 'true'
    fail_msg: "git push.autoSetupRemote not set"

- name: Check git fetch.prune
  ansible.builtin.command: git config --global fetch.prune  # noqa: command-instead-of-module
  register: verify_fetch_prune
  changed_when: false
  failed_when: false

- name: Assert fetch.prune is true
  ansible.builtin.assert:
    that: verify_fetch_prune.stdout == 'true'
    fail_msg: "git fetch.prune not set to true — stale remote-tracking branches will accumulate"

- name: Check git commit.gpgsign
  ansible.builtin.command: git config --global commit.gpgsign  # noqa: command-instead-of-module
  register: verify_gpgsign
  changed_when: false
  failed_when: false

- name: Assert commit.gpgsign is true
  ansible.builtin.assert:
    that: verify_gpgsign.stdout == 'true'
    fail_msg: "git commit.gpgsign not enabled"

- name: Check git tag.gpgsign setting
  ansible.builtin.command: git config --global tag.gpgsign  # noqa: command-instead-of-module
  register: verify_tag_gpgsign
  changed_when: false
  failed_when: false

- name: Assert tag.gpgsign is true
  ansible.builtin.assert:
    that: verify_tag_gpgsign.stdout == 'true'
    fail_msg: "git tag.gpgsign not enabled — tags would be unsigned"

- name: Check git gpg.ssh.allowedSignersFile setting
  ansible.builtin.command: git config --global gpg.ssh.allowedSignersFile  # noqa: command-instead-of-module
  register: verify_signers_file_path
  changed_when: false
  failed_when: false

- name: Assert gpg.ssh.allowedSignersFile points to allowed_signers
  ansible.builtin.assert:
    that: verify_signers_file_path.stdout == '~/.config/git/allowed_signers'
    fail_msg: >-
      git gpg.ssh.allowedSignersFile is '{{ verify_signers_file_path.stdout }}',
      expected '~/.config/git/allowed_signers'

- name: Check git safe.bareRepository setting
  ansible.builtin.command: git config --global safe.bareRepository  # noqa: command-instead-of-module
  register: verify_bare_repo
  changed_when: false
  failed_when: false

- name: Assert git safe.bareRepository is explicit
  ansible.builtin.assert:
    that: verify_bare_repo.stdout == 'explicit'
    fail_msg: "git safe.bareRepository is not set to explicit"

- name: Check git protocol.allow
  ansible.builtin.command: git config --global protocol.allow  # noqa: command-instead-of-module
  register: verify_protocol_allow
  changed_when: false
  failed_when: false

- name: Assert git protocol.allow is never
  ansible.builtin.assert:
    that: verify_protocol_allow.stdout == 'never'
    fail_msg: "git protocol.allow is not set to never — arbitrary protocol escalation not blocked"

- name: Check git protocol.https.allow
  ansible.builtin.command: git config --global protocol.https.allow  # noqa: command-instead-of-module
  register: verify_protocol_https
  changed_when: false
  failed_when: false

- name: Assert git protocol.https.allow is always
  ansible.builtin.assert:
    that: verify_protocol_https.stdout == 'always'
    fail_msg: "git protocol.https.allow is not set to always — HTTPS clones will be blocked"

- name: Check git protocol.ssh.allow
  ansible.builtin.command: git config --global protocol.ssh.allow  # noqa: command-instead-of-module
  register: verify_protocol_ssh
  changed_when: false
  failed_when: false

- name: Assert git protocol.ssh.allow is always
  ansible.builtin.assert:
    that: verify_protocol_ssh.stdout == 'always'
    fail_msg: "git protocol.ssh.allow is not set to always — SSH clones will be blocked"

- name: Check git gpg.format
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: git config --global gpg.format
  register: verify_gpg_format
  changed_when: false
  failed_when: false

- name: Assert gpg.format is ssh
  ansible.builtin.assert:
    that: verify_gpg_format.stdout == 'ssh'
    fail_msg: "gpg.format not set to ssh — SSH commit signing not configured"

- name: Check git user.signingkey
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: git config --global user.signingkey
  register: verify_signingkey
  changed_when: false
  failed_when: false

- name: Assert user.signingkey is set
  ansible.builtin.assert:
    that: "verify_signingkey.stdout | trim == '~/.ssh/' ~ (ssh_signing_key_basename) ~ '.pub'"
    fail_msg: "git user.signingkey not set to ~/.ssh/{{ ssh_signing_key_basename }}.pub"

- name: Verify ~/.config/git/allowed_signers exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/git/allowed_signers"
  register: verify_allowed_signers

- name: Assert allowed_signers file exists
  ansible.builtin.assert:
    that: verify_allowed_signers.stat.exists
    fail_msg: "~/.config/git/allowed_signers was not deployed — SSH signing verification will not work"

- name: Assert allowed_signers exists and is non-empty
  ansible.builtin.assert:
    that:
      - verify_allowed_signers.stat.size > 0
    fail_msg: "~/.config/git/allowed_signers is empty — SSH signature verification not configured"
  when: verify_allowed_signers.stat.exists

- name: Check allowed_signers contains sk-ssh-ed25519 key
  ansible.builtin.command:
    cmd: grep -qE '(sk-)?ssh-ed25519' "{{ ansible_user_dir }}/.config/git/allowed_signers"
  register: verify_allowed_signers_key
  changed_when: false
  failed_when: false
  when: verify_allowed_signers.stat.exists

- name: Assert allowed_signers contains sk-ssh-ed25519 key
  ansible.builtin.assert:
    that: verify_allowed_signers_key.rc == 0
    fail_msg: "allowed_signers does not contain an sk-ssh-ed25519 key — YubiKey SSH signing key not registered"
  when: verify_allowed_signers.stat.exists

- name: Check git alias.revert-s (must exist; 'revert' shadows built-in)
  ansible.builtin.command: git config --global alias.revert-s  # noqa: command-instead-of-module
  register: verify_revert_s_alias
  changed_when: false
  failed_when: false

- name: Assert git alias.revert-s equals revert -s
  ansible.builtin.assert:
    that: verify_revert_s_alias.stdout | trim == 'revert -s'
    fail_msg: >-
      git alias.revert-s is '{{ verify_revert_s_alias.stdout | trim }}', expected 'revert -s'.
      If the alias was renamed back to 'revert' it silently shadows the git built-in.

- name: Get global safe.directory entries (claude role cleanup regression guard)
  ansible.builtin.command:
    cmd: git config --global --get-all safe.directory
  register: verify_safe_directory_common
  changed_when: false
  failed_when: false

- name: Assert no wildcard safe.directory entries exist
  ansible.builtin.assert:
    that: >-
      verify_safe_directory_common.stdout_lines | default([])
      | select('match', '^\*{1,2}$|^/$') | list | length == 0
    fail_msg: >-
      safe.directory contains a wildcard entry — claude role cleanup task regression?
      (shell task requires executable: /bin/bash for set -o pipefail + [[ ]] on Debian/dash)

- name: Verify ~/.config/git/ignore exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/git/ignore"
  register: verify_gitignore_global

- name: Assert global gitignore exists
  ansible.builtin.assert:
    that: verify_gitignore_global.stat.exists
    fail_msg: "~/.config/git/ignore was not deployed"

- name: Check git core.excludesfile
  ansible.builtin.command: git config --global core.excludesfile  # noqa: command-instead-of-module
  register: verify_excludesfile
  changed_when: false
  failed_when: false

- name: Assert core.excludesfile points to ~/.config/git/ignore
  ansible.builtin.assert:
    that: "verify_excludesfile.stdout | trim == '~/.config/git/ignore'"
    fail_msg: "git core.excludesfile not set to ~/.config/git/ignore — global gitignore directive missing from gitconfig template"

# --- Directories ---
- name: Verify ~/bin directory exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/bin"
  register: verify_bin_dir

- name: Assert ~/bin exists
  ansible.builtin.assert:
    that:
      - verify_bin_dir.stat.exists
      - verify_bin_dir.stat.isdir
    fail_msg: "~/bin directory was not created"

- name: Verify ~/.local/bin directory exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.local/bin"
  register: verify_local_bin

- name: Assert ~/.local/bin exists
  ansible.builtin.assert:
    that:
      - verify_local_bin.stat.exists
      - verify_local_bin.stat.isdir
    fail_msg: "~/.local/bin directory was not created"

- name: Verify git repos base directory exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/src"
  register: verify_repos_dir

- name: Assert git repos base directory exists
  ansible.builtin.assert:
    that:
      - verify_repos_dir.stat.exists
      - verify_repos_dir.stat.isdir
    fail_msg: "Git repos base directory ~/src was not created"

# --- git_repos role: verify a public HTTPS repo was actually cloned ---
- name: Verify public HTTPS repo was cloned to ~/src/ by git_repos role
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/src/ci-test/laptop-setup/.git"
  register: verify_git_repos_clone

- name: Assert git_repos clone ran successfully
  ansible.builtin.assert:
    that:
      - verify_git_repos_clone.stat.exists
      - verify_git_repos_clone.stat.isdir
    fail_msg: >-
      git_repos clone task did not create ~/src/ci-test/laptop-setup/.git —
      clone task logic regression or git_repos_list filtering broken

# --- Claude ---
- name: Verify Claude personal config directory
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.claude-personal"
  register: verify_claude_dir

- name: Assert Claude config directory exists with 0700
  ansible.builtin.assert:
    that:
      - verify_claude_dir.stat.exists
      - verify_claude_dir.stat.isdir
      - verify_claude_dir.stat.mode == '0700'
    fail_msg: "Claude personal config dir missing or wrong permissions"

- name: Verify Claude default settings.local.json exists (~/.claude)
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.claude/settings.local.json"
  register: verify_claude_default_settings

- name: Assert Claude default settings.local.json deployed (0600)
  ansible.builtin.assert:
    that:
      - verify_claude_default_settings.stat.exists
      - verify_claude_default_settings.stat.mode == '0600'
    fail_msg: "~/.claude/settings.local.json not deployed — default claude instance has no deny lists or sandbox"

- name: Validate Claude default settings.local.json sandbox and deny config
  ansible.builtin.command:
    cmd: >-
      python3 -c "import json, sys;
      d = json.load(open('{{ ansible_user_dir }}/.claude/settings.local.json'));
      assert d.get('sandbox', {}).get('enabled'), 'sandbox.enabled is not true';
      assert d.get('sandbox', {}).get('failIfUnavailable'), 'sandbox.failIfUnavailable is not true (allows sandbox bypass)';
      assert not d.get('sandbox', {}).get('allowUnsandboxedCommands'), 'sandbox.allowUnsandboxedCommands is not false';
      assert d.get('enableAllProjectMcpServers') == False, 'enableAllProjectMcpServers is not false';
      assert len(d.get('permissions', {}).get('deny', [])) > 0, 'deny list is empty'"
  changed_when: false
  when: verify_claude_default_settings.stat.exists

- name: Verify Claude settings.local.json exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.claude-personal/settings.local.json"
  register: verify_claude_settings

- name: Assert Claude settings.local.json exists with 0600
  ansible.builtin.assert:
    that:
      - verify_claude_settings.stat.exists
      - verify_claude_settings.stat.mode == '0600'
    fail_msg: "Claude settings.local.json not deployed or wrong permissions (expected 0600)"

- name: Validate Claude settings.local.json is valid JSON and has sandbox.enabled
  ansible.builtin.command:
    cmd: >-
      python3 -c "import json, sys;
      d = json.load(open('{{ ansible_user_dir }}/.claude-personal/settings.local.json'));
      assert d.get('sandbox', {}).get('enabled'), 'sandbox.enabled is not true';
      assert d.get('sandbox', {}).get('failIfUnavailable'), 'sandbox.failIfUnavailable is not true (allows sandbox bypass)';
      assert not d.get('sandbox', {}).get('allowUnsandboxedCommands'), 'sandbox.allowUnsandboxedCommands is not false';
      assert d.get('enableAllProjectMcpServers') == False, 'enableAllProjectMcpServers is not false';
      assert len(d.get('permissions', {}).get('deny', [])) > 0, 'deny list is empty'"
  changed_when: false
  when: verify_claude_settings.stat.exists

- name: Verify claude-privacy tmpfiles config deployed (Linux)
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/user-tmpfiles.d/claude-privacy.conf"
  register: verify_claude_tmpfiles
  when: ansible_system == 'Linux'

- name: Assert claude-privacy tmpfiles config deployed (Linux)
  ansible.builtin.assert:
    that: verify_claude_tmpfiles.stat.exists
    fail_msg: "claude-privacy.conf tmpfiles config not deployed — ~/.claude permissions won't be enforced at boot"
  when: ansible_system == 'Linux'

- name: Verify Claude CLAUDE.md deployed
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.claude-personal/CLAUDE.md"
  register: verify_claude_md

- name: Assert Claude CLAUDE.md exists
  ansible.builtin.assert:
    that: verify_claude_md.stat.exists
    fail_msg: "Claude CLAUDE.md not deployed"

# --- Git hooks ---
- name: Verify gitleaks pre-commit hook
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/git/template/hooks/pre-commit"
  register: verify_precommit

- name: Assert pre-commit hook is executable
  ansible.builtin.assert:
    that:
      - verify_precommit.stat.exists
      - verify_precommit.stat.executable
    fail_msg: "Gitleaks pre-commit hook missing or not executable"

- name: Verify gh CLI config directory
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/gh"
  register: verify_gh_dir

- name: Assert gh config directory exists with 0700
  ansible.builtin.assert:
    that:
      - verify_gh_dir.stat.exists
      - verify_gh_dir.stat.isdir
      - verify_gh_dir.stat.mode == '0700'
    fail_msg: "gh config directory missing or wrong permissions"

# --- Dotfiles: direnv ---
- name: Verify direnv config exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/direnv/direnv.toml"
  register: verify_direnv

- name: Assert direnv config deployed
  ansible.builtin.assert:
    that: verify_direnv.stat.exists
    fail_msg: "direnv config not deployed"

- name: Read direnv.toml content
  ansible.builtin.slurp:
    src: "{{ ansible_user_dir }}/.config/direnv/direnv.toml"
  register: verify_direnv_toml
  when: verify_direnv.stat.exists

- name: Assert direnv.toml contains expected settings
  ansible.builtin.assert:
    that:
      - "'strict_env = true' in (verify_direnv_toml.content | b64decode)"
      - "'disable_stdin = true' in (verify_direnv_toml.content | b64decode)"
    fail_msg: "direnv.toml missing expected settings (strict_env = true, disable_stdin = true)"
  when: verify_direnv.stat.exists

# --- Dotfiles: SSH agent (Linux only) ---
- name: Verify SSH agent systemd service deployed
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/systemd/user/ssh-agent.service"
  register: verify_ssh_agent
  when: ansible_system == 'Linux'

- name: Assert SSH agent service deployed
  ansible.builtin.assert:
    that: verify_ssh_agent.stat.exists
    fail_msg: "SSH agent systemd user service not deployed"
  when: ansible_system == 'Linux'

- name: Verify ripgrep config deployed
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/ripgrep/config"
  register: verify_ripgreprc

- name: Assert ripgrep config deployed
  ansible.builtin.assert:
    that: verify_ripgreprc.stat.exists
    fail_msg: "~/.config/ripgrep/config not deployed (ripgrep config missing)"

- name: Verify git config-work exists (always deployed)
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/git/config-work"
  register: verify_git_config_work

- name: Assert git config-work deployed (always deployed)
  ansible.builtin.assert:
    that: verify_git_config_work.stat.exists
    fail_msg: "git config-work not deployed — work gitconfig includes missing"

- name: Verify ssh-agent environment.d config deployed (Linux)
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/environment.d/ssh-agent.conf"
  register: verify_ssh_agent_envd
  when: ansible_system == 'Linux'

- name: Assert ssh-agent environment.d config deployed (Linux)
  ansible.builtin.assert:
    that: verify_ssh_agent_envd.stat.exists
    fail_msg: "ssh-agent.conf not deployed — SSH_AUTH_SOCK will be missing in GUI processes"
  when: ansible_system == 'Linux'

# --- CSB detection: verify non-CSB test environments are correctly classified ---
# Re-run CSB detection in verify phase (set_fact from converge doesn't persist to separate
# verify playbook invocation). All csb_detect.yml tasks use failed_when: false and are idempotent.
- name: Re-run CSB detection for verify-phase assertions
  ansible.builtin.include_tasks:
    file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/common/tasks/csb_detect.yml"
  when: ansible_system == 'Linux'

# These assertions catch regressions in csb_detect.yml that would silently misclassify
# all Fedora/Debian/Rocky molecule runs as CSB, suppressing repo tasks and container-tier logic.
- name: Assert csb_detected is false on non-CSB test host
  ansible.builtin.assert:
    that: not (csb_detected)
    fail_msg: "csb_detected is true on non-CSB molecule host — csb_detect.yml regression"
  when:
    - ansible_distribution in ['Fedora', 'Debian', 'Rocky']
    - ansible_system == 'Linux'

- name: Assert needs_container_tier is host-only on non-CSB Fedora/Debian/Rocky
  ansible.builtin.assert:
    that: needs_container_tier == 'host-only'
    fail_msg: "needs_container_tier is not host-only on non-CSB host — CSB detection regression"
  when:
    - ansible_distribution in ['Fedora', 'Debian', 'Rocky']
    - ansible_system == 'Linux'

- name: Assert fapolicyd is not running on non-CSB molecule host
  ansible.builtin.assert:
    that: not (fapolicyd_installed)
    fail_msg: "fapolicyd_installed is true on non-CSB molecule host — CSB detection false positive"
  when:
    - ansible_distribution in ['Fedora', 'Debian', 'Rocky']
    - ansible_system == 'Linux'

- name: Check /dev/shm fstab entry has noexec (CIS 1.1.7.x)
  ansible.builtin.command:
    cmd: grep -qE '^tmpfs\s+/dev/shm\s+tmpfs\s+[^ ]*noexec' /etc/fstab
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - not csb_rhel

# --- Sysctl hardening: file-content assertions (system role, Linux only) ---
# Checks that the template was deployed without live kernel reads — safe in container CI.
# No become: true needed because /etc/sysctl.d/90-hardening.conf is deployed mode 0644.
- name: Stat sysctl hardening config (asserts system role ran)
  ansible.builtin.stat:
    path: /etc/sysctl.d/90-hardening.conf
  register: verify_sysctl_file
  when: ansible_system == 'Linux'

- name: Assert sysctl hardening config deployed
  ansible.builtin.assert:
    that: verify_sysctl_file.stat.exists
    fail_msg: "/etc/sysctl.d/90-hardening.conf not deployed — system role did not run"
  when: ansible_system == 'Linux'

- name: Check sysctl hardening config contains security-critical keys
  ansible.builtin.command: grep -q '{{ item }}' /etc/sysctl.d/90-hardening.conf
  loop:
    - kernel.yama.ptrace_scope = {{ system_ptrace_scope }}
    - kernel.dmesg_restrict = 1
    - kernel.kptr_restrict = 1
    - kernel.unprivileged_bpf_disabled = {{ system_unprivileged_bpf_disabled | default(1) }}
    - kernel.io_uring_disabled = {{ system_io_uring_disabled | default(1) }}
    - net.bridge.bridge-nf-call-iptables
    - net.ipv6.conf.all.use_tempaddr
    - net.ipv4.conf.all.rp_filter
    - net.ipv4.conf.default.rp_filter
    - vm.max_map_count
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - verify_sysctl_file.stat.exists

- name: Check sysctl hardening config contains ip_forward keys
  ansible.builtin.command: grep -q '{{ item }}' /etc/sysctl.d/90-hardening.conf
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - verify_sysctl_file.stat.exists
    - system_enable_ip_forward | default(true) | bool

- name: Stat /etc/systemd/system/tmp.mount.d/hardening.conf
  ansible.builtin.stat:
    path: /etc/systemd/system/tmp.mount.d/hardening.conf
  register: verify_tmp_hardening
  when: ansible_system == 'Linux'

- name: Assert tmp.mount.d/hardening.conf deployed
  ansible.builtin.assert:
    that: verify_tmp_hardening.stat.exists
    fail_msg: "/etc/systemd/system/tmp.mount.d/hardening.conf not deployed — system role did not run or template broken"
  when: ansible_system == 'Linux'

- name: Check tmp.mount.d/hardening.conf Options= line has nosuid,nodev,noexec
  ansible.builtin.command: grep -qE '^Options=.*{{ item }}' /etc/systemd/system/tmp.mount.d/hardening.conf
  loop:
    - nosuid
    - nodev
    - noexec
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - verify_tmp_hardening.stat.exists

# --- modprobe hardening: file-content assertions (system role, Linux only) ---
- name: Stat /etc/modprobe.d/hardening.conf (asserts system role deployed it)
  ansible.builtin.stat:
    path: /etc/modprobe.d/hardening.conf
  register: verify_modprobe_hardening
  when: ansible_system == 'Linux'

- name: Assert /etc/modprobe.d/hardening.conf deployed
