    - 'arch=b64.*renameat2.*exe=/usr/bin/cargo'
    - 'arch=b32.*renameat2.*exe=/usr/bin/cargo'
    - 'arch=b64.*renameat2.*exe=/usr/bin/git'
    - 'arch=b32.*renameat2.*exe=/usr/bin/git'
    - 'arch=b64.*renameat2.*exe=/usr/bin/npm'
    - 'arch=b32.*renameat2.*exe=/usr/bin/npm'
  loop_control:
    label: "{{ item | split(' ') | first }}"
  changed_when: false
  become: true
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - not (system_is_container | default(false))
