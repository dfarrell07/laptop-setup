# --- system role drop-in file assertions (sshd, resolved, DNS-over-TLS, coredump, logind, sudoers, journald, auditd rules; Linux only) ---
# sshd drop-in is mode 0600 root:root — become: true required for stat and grep.
# Catches directive-value regressions that pass sshd -t syntax validation.
- name: Stat sshd hardening drop-in (asserts system role deployed it)
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/00-hardening.conf
  register: verify_sshd_dropin
  become: true
  when: ansible_system == 'Linux'
# Rocky scenario (csb_rhel=true) runs this stat but skips both asserts below via not csb_rhel

- name: Assert sshd hardening drop-in deployed
  ansible.builtin.assert:
    that: verify_sshd_dropin.stat.exists
    fail_msg: >-
      /etc/ssh/sshd_config.d/00-hardening.conf not deployed —
      sshd task regression or openssh-server not installed
      (deployment block gated on sshd.service being defined)
  when:
    - ansible_system == 'Linux'
    - ansible_os_family != 'Debian'  # openssh-server not installed in Debian Podman CI (daemon-reload crash risk)
    - not csb_rhel

- name: Assert sshd hardening drop-in has mode 0600
  ansible.builtin.assert:
    that: (verify_sshd_dropin.stat.mode | default('')) == '0600'
    fail_msg: >-
      /etc/ssh/sshd_config.d/00-hardening.conf missing or has wrong permissions
      (exists={{ verify_sshd_dropin.stat.exists | default(false) }}, expected mode 0600,
      got {{ verify_sshd_dropin.stat.mode | default('absent') }})
  when:
    - ansible_system == 'Linux'
    - ansible_os_family != 'Debian'  # openssh-server not installed in Debian Podman CI (daemon-reload crash risk)
    - not csb_rhel

- name: Check sshd hardening drop-in contains critical directives
  ansible.builtin.command: grep -qE '{{ item }}' /etc/ssh/sshd_config.d/00-hardening.conf
  loop:
    - "PasswordAuthentication no"
    - "PermitRootLogin no"
    - "KbdInteractiveAuthentication no"
    - "PermitEmptyPasswords no"
    - "X11Forwarding no"
    - "HostKeyAlgorithms {{ ssh_host_key_algorithms }}"
    - "ClientAliveInterval 300"  # hardcoded: no system_ssh_client_alive_interval var; matches sshd-hardening.conf.j2
    - "ClientAliveCountMax 2"  # hardcoded: no system_ssh_client_alive_count_max var; matches sshd-hardening.conf.j2
    - "^Port {{ ssh_port }}$"
    - "AllowUsers "
  loop_control:
    label: "{{ item | split(' ') | first }}"
  changed_when: false
  become: true
  when:
    - ansible_system == 'Linux'
    - ansible_os_family != 'Debian'
    - not csb_rhel
    - verify_sshd_dropin.stat.exists

- name: Stat /etc/systemd/resolved.conf.d/98-llmnr.conf
  ansible.builtin.stat:
    path: /etc/systemd/resolved.conf.d/98-llmnr.conf
  register: verify_llmnr_conf
  when:
