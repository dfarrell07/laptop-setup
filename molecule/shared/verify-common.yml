# --- dconf hardening (CIS 1.8.x — GNOME/GDM only, stat-gated) ---
# Only fires when the system role's dconf.yml ran (gdm.service present on target).
# Skips cleanly on Sway/i3 and all Podman container CI scenarios where GDM is absent.
- name: Stat /etc/dconf/db/local.d/50-hardening (dconf media-handling CIS 1.8.6-1.8.8)
  ansible.builtin.stat:
    path: /etc/dconf/db/local.d/50-hardening
  register: verify_dconf_50_hardening
  when: ansible_system == 'Linux'

- name: Stat /etc/dconf/db/local (compiled dconf database)
  ansible.builtin.stat:
    path: /etc/dconf/db/local
  register: verify_dconf_db_local
  when:
    - ansible_system == 'Linux'
    - verify_dconf_50_hardening.stat.exists

- name: Assert /etc/dconf/db/local compiled database exists
  ansible.builtin.assert:
    that: verify_dconf_db_local.stat.exists
    fail_msg: >-
      /etc/dconf/db/local compiled database missing — 'Apply dconf schema database'
      handler did not run dconf update after deploying /etc/dconf/db/local.d/50-hardening
  when:
    - ansible_system == 'Linux'
    - verify_dconf_50_hardening.stat.exists

- name: Check dconf 50-hardening has automount=false (CIS 1.8.6)
  ansible.builtin.command: grep -q '^automount=false' /etc/dconf/db/local.d/50-hardening
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - verify_dconf_50_hardening.stat.exists

- name: Check dconf 50-hardening has autorun-never=true (CIS 1.8.8)
  ansible.builtin.command: grep -q '^autorun-never=true' /etc/dconf/db/local.d/50-hardening
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - verify_dconf_50_hardening.stat.exists

- name: Stat /etc/dconf/db/local.d/51-screensaver (dconf screensaver CIS 1.8.4/1.8.5)
  ansible.builtin.stat:
    path: /etc/dconf/db/local.d/51-screensaver
  register: verify_dconf_51_screensaver
  when: ansible_system == 'Linux'

- name: Check dconf 51-screensaver has lock-enabled=true (CIS 1.8.5)
  ansible.builtin.command: grep -q '^lock-enabled=true' /etc/dconf/db/local.d/51-screensaver
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - verify_dconf_51_screensaver.stat.exists

- name: Check chrony/chronyd service is enabled (NTP hardening)
  ansible.builtin.systemd:
    name: "{{ 'chrony' if ansible_pkg_mgr == 'apt' else 'chronyd' }}"
  register: verify_chronyd
  become: true
  failed_when: false
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - not (system_is_container | default(false))
    - system_chrony_service_enabled | default(true) | bool

# CI gap: system_is_container=true in all container scenario verify pre_tasks — chrony skipped via not system_is_container;
# make test-vm exercises full chrony service-enablement and NTS coverage.
- name: Assert chrony/chronyd is enabled
  ansible.builtin.assert:
    that: verify_chronyd.status.UnitFileState | default('') == 'enabled'
    fail_msg: "chrony/chronyd UnitFileState is '{{ verify_chronyd.status.UnitFileState | default('') }}', expected 'enabled' — NTP authentication regression"  # yamllint disable-line rule:line-length
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - not (system_is_container | default(false))
    - system_chrony_service_enabled | default(true) | bool
    - (verify_chronyd.status.UnitFileState | default('')) != ''

- name: Check chrony NTS config in /etc/chrony.conf
  ansible.builtin.command: grep -qE '^server.*[[:space:]]nts' /etc/chrony.conf
  changed_when: false
  failed_when: false
  register: verify_chrony_nts
  become: true
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - not (system_is_container | default(false))
    - system_chrony_service_enabled | default(true) | bool

# CI gap: system_is_container=true in all container scenario verify pre_tasks — chrony skipped via not system_is_container;
# make test-vm exercises full chrony service-enablement and NTS coverage.
- name: Assert chrony NTS config is present
  ansible.builtin.assert:
    that: verify_chrony_nts.rc == 0
    fail_msg: "NTS not configured in /etc/chrony.conf — NTS deployment regression"
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - not (system_is_container | default(false))
    - system_chrony_service_enabled | default(true) | bool

# --- Chrony NTS template render guard (container-safe) ---
# Renders chrony-nts.conf.j2 to a temp path so Jinja2 errors surface in container CI
# even when system_chrony_service_enabled=false prevents chronyd install/config.
# vars: provides fallback values — role defaults are not loaded in the verify context.
- name: Render chrony NTS template to temp path (template error guard)
  ansible.builtin.template:
    src: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/roles/system/templates/chrony-nts.conf.j2"
    dest: /tmp/molecule-chrony-nts-render-check.conf
    mode: "0644"
  vars:
    system_chrony_nts_servers: >-
      {{ system_chrony_nts_servers | default(['time.cloudflare.com', 'nts.netnod.se', 'ptbtime1.ptb.de', 'ntppool1.time.nl']) }}
    system_chrony_fallback_pool: "{{ system_chrony_fallback_pool | default('2.fedora.pool.ntp.org') }}"
    system_chrony_minsources: "{{ system_chrony_minsources | default(2) }}"
  when:
    - ansible_system == 'Linux'
    - not csb_rhel

- name: Check TMOUT readonly in profile.d (CIS 5.5.5 — bash)
  ansible.builtin.command: grep -qE '^readonly TMOUT={{ system_tmout }}' /etc/profile.d/tmout.sh
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - system_tmout | int > 0
    - not (system_is_container | default(false))

# No system_is_container guard: session_timeout.yml writes /etc/zshrc in containers (unlike profile.d which crashes PID 1)
- name: Check TMOUT typeset -xr in /etc/zshrc (CIS 5.5.5 — zsh, Fedora/RHEL)
  ansible.builtin.command: grep -qE '^typeset -xr TMOUT={{ system_tmout }}' /etc/zshrc
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - ansible_os_family != 'Debian'
    - system_tmout | int > 0

- name: Check TMOUT typeset -xr in /etc/zsh/zshrc (CIS 5.5.5 — zsh, Debian GLOBAL_ZSHRC)
  ansible.builtin.command: grep -qE '^typeset -xr TMOUT={{ system_tmout }}' /etc/zsh/zshrc
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - ansible_os_family == 'Debian'
    - system_tmout | int > 0

- name: Check TMOUT readonly in /etc/bash.bashrc (CIS 5.5.5 — bash, Debian)
  ansible.builtin.command: grep -qE '^readonly TMOUT={{ system_tmout }}' /etc/bash.bashrc
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - ansible_os_family == 'Debian'
    - system_tmout | int > 0

- name: Check TMOUT export in /etc/bash.bashrc (CIS 5.5.5 — bash, Debian)
  ansible.builtin.command: grep -qE '^export TMOUT' /etc/bash.bashrc
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - ansible_os_family == 'Debian'
    - system_tmout | int > 0

- name: Check 98-llmnr.conf disables LLMNR and mDNS
  ansible.builtin.command: grep -q '{{ item }}' /etc/systemd/resolved.conf.d/98-llmnr.conf
  loop:
    - "LLMNR={{ system_resolved_llmnr | default('no') }}"
    - "MulticastDNS={{ system_resolved_multicast_dns | default('no') }}"
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - not (system_is_container | default(false))
    - verify_llmnr_conf.stat.exists

# --- System role: service masking (Linux container CI) ---
# Uses systemctl show to query UnitFileState — same pattern as smoke-test.sh lines 526-530.
# failed_when: false + item.rc/stdout guards skip cleanly when a unit is absent from a
# minimal image (e.g. cups-browsed not installed on debian slim).
- name: Check UnitFileState for sshd.socket (must be masked — socket activation bypasses port 722)
  ansible.builtin.command: systemctl show -p UnitFileState --value sshd.socket
  register: masked_sshd_socket_state
  changed_when: false
  failed_when: false
  when:
    - ansible_system == 'Linux'
    - not (system_is_container | default(false))

- name: Assert sshd.socket is masked
  ansible.builtin.assert:
    that: masked_sshd_socket_state.stdout == 'masked'
    fail_msg: >-
      sshd.socket UnitFileState is '{{ masked_sshd_socket_state.stdout }}', expected 'masked'
      — socket activation would reopen port 22 bypassing the port-722 hardening
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - not (system_is_container | default(false))
    - masked_sshd_socket_state.rc == 0
    - masked_sshd_socket_state.stdout | length > 0

# --- USBGuard config content verification (system role, DNF Linux, system_install_usbguard only) ---
# Gated on system_install_usbguard — verification skips on hosts where USBGuard is not installed.
# rules.conf is deployed mode 0600 — become: true required to read.
# usbguard-daemon.conf checks verify ImplicitPolicyTarget=block (prevents silent policy downgrade)
# and AuditBackend=LinuxAudit (ensures USB events flow through the audit subsystem).
- name: Stat /etc/usbguard/rules.conf
  ansible.builtin.stat:
    path: /etc/usbguard/rules.conf
  register: verify_usbguard_rules
  become: true
  when:
    - ansible_system == 'Linux'
    - usbguard_expected | default(false)
    - ansible_os_family != 'Debian'

- name: Assert USBGuard rules.conf deployed (mode 0600, non-empty)
  ansible.builtin.assert:
    that:
      - verify_usbguard_rules.stat.exists
      - verify_usbguard_rules.stat.mode == '0600'
      - verify_usbguard_rules.stat.size | default(0) > 0
    fail_msg: "/etc/usbguard/rules.conf missing, wrong mode, or empty — system role USBGuard template regression"
  when:
    - ansible_system == 'Linux'
    - usbguard_expected | default(false)
    - ansible_os_family != 'Debian'

- name: Check USBGuard rules.conf contains hardwired-device allow rule
  ansible.builtin.command: grep -q 'with-connect-type "hardwired"' /etc/usbguard/rules.conf
  changed_when: false
  become: true
  when:
    - ansible_system == 'Linux'
    - usbguard_expected | default(false)
    - ansible_os_family != 'Debian'
    - verify_usbguard_rules.stat.exists

- name: Check git-lfs is installed (packages role)
  ansible.builtin.command:
    cmd: git lfs version
  register: verify_git_lfs
  changed_when: false
  failed_when: false

- name: Assert git-lfs installed
  ansible.builtin.assert:
    that: verify_git_lfs.rc == 0
    fail_msg: "git-lfs not installed — packages_cli regression (needed for repos with LFS-tracked files)"

- name: Check git-lfs filter registered globally
  ansible.builtin.command:
    cmd: git config --global filter.lfs.smudge
  register: verify_git_lfs_filter
  changed_when: false
  failed_when: false
  when: verify_git_lfs.rc == 0

- name: Assert git-lfs filter registered (git lfs install was run)
  ansible.builtin.assert:
    that: verify_git_lfs_filter.rc == 0
    fail_msg: >
      git lfs install has not been run — global LFS filter drivers not registered;
      run: git lfs install --skip-repo
  when: verify_git_lfs.rc == 0

- name: Check zshrc has GONOSUMDB (profile=work)
  ansible.builtin.command:
    cmd: grep -q 'GONOSUMDB' "{{ ansible_user_dir }}/.zshrc"
  changed_when: false
  failed_when: false
  register: verify_gonosumdb
  when:
    - ansible_system == 'Linux'
    - profile | default('personal') == 'work'

- name: Assert GONOSUMDB in zshrc (work profile, Linux)
  ansible.builtin.assert:
    that: verify_gonosumdb.rc == 0
    fail_msg: "GONOSUMDB missing from ~/.zshrc — dotfiles_gonosumdb variable not rendered"
  when:
    - ansible_system == 'Linux'
    - profile | default('personal') == 'work'

- name: Check zshrc has GOPRIVATE on separate line (profile=work, trim_blocks regression guard)
  ansible.builtin.command:
    cmd: grep -q '^export GOPRIVATE=' "{{ ansible_user_dir }}/.zshrc"
  changed_when: false
  failed_when: false
  register: verify_goprivate
  when:
    - ansible_system == 'Linux'
    - profile | default('personal') == 'work'

- name: Assert GOPRIVATE in zshrc on its own line
  ansible.builtin.assert:
    that: verify_goprivate.rc == 0
    fail_msg: >-
      export GOPRIVATE= not found as a standalone line in ~/.zshrc — possible
      Jinja2 trim_blocks regression (GOPRIVATE concatenated with export PATH on one line)
  when:
    - ansible_system == 'Linux'
    - profile | default('personal') == 'work'

# --- subuid/subgid (rootless Podman) ---
# Use real_user_id (the provisioned user) rather than ansible_user_id (connection user).
# In container CI, ansible_user_id=root but subuid is provisioned for real_user_id=molecule.
- name: Check /etc/subuid has entry for real_user_id
  ansible.builtin.command: "grep -q '^{{ real_user_id | default(ansible_user_id) }}:' /etc/subuid"
  changed_when: false
  when: ansible_system == 'Linux'

- name: Check /etc/subgid has entry for real_user_id
  ansible.builtin.command: "grep -q '^{{ real_user_id | default(ansible_user_id) }}:' /etc/subgid"
  changed_when: false
  when: ansible_system == 'Linux'

# --- Login banner (system role, non-CSB Linux only) ---
- name: Slurp /etc/issue content
  ansible.builtin.slurp:
    src: /etc/issue
  register: verify_issue_content
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - not (system_is_container | default(false))

- name: Assert /etc/issue contains authorized-users-only notice
  ansible.builtin.assert:
    that: "'authorized users only' in (verify_issue_content.content | b64decode)"
    fail_msg: "/etc/issue does not contain expected 'authorized users only' text — banner template regression"
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - not (system_is_container | default(false))

# --- Locale and console keymap (system role, Linux only) ---
- name: Stat /etc/locale.conf (system role deploys it)
  ansible.builtin.stat:
    path: /etc/locale.conf
  register: verify_locale_conf
  become: true
  when:
    - ansible_system == 'Linux'
    - not (system_is_container | default(false))

- name: Assert /etc/locale.conf exists
  ansible.builtin.assert:
    that: verify_locale_conf.stat.exists
    fail_msg: "/etc/locale.conf not deployed — system role timezone_locale.yml regression"
  when:
    - ansible_system == 'Linux'
    - not (system_is_container | default(false))

- name: Check /etc/locale.conf contains LANG=en_US.UTF-8
  ansible.builtin.command: grep -q 'LANG={{ system_locale | default("en_US.UTF-8") }}' /etc/locale.conf
  changed_when: false
  become: true
  when:
    - ansible_system == 'Linux'
    - verify_locale_conf.stat.exists

- name: Stat /etc/vconsole.conf (system role deploys it)
  ansible.builtin.stat:
    path: /etc/vconsole.conf
  register: verify_vconsole_conf
  become: true
  when:
    - ansible_system == 'Linux'
    - not (system_is_container | default(false))

- name: Assert /etc/vconsole.conf exists
  ansible.builtin.assert:
    that: verify_vconsole_conf.stat.exists
    fail_msg: "/etc/vconsole.conf not deployed — system role timezone_locale.yml regression"
  when:
    - ansible_system == 'Linux'
    - not (system_is_container | default(false))

- name: Check /etc/vconsole.conf contains KEYMAP=us
  ansible.builtin.command: grep -q 'KEYMAP={{ system_keymap | default("us") }}' /etc/vconsole.conf
  changed_when: false
  become: true
  when:
    - ansible_system == 'Linux'
    - verify_vconsole_conf.stat.exists
