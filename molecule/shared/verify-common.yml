- name: Check auditd rules contain required watch keys
  ansible.builtin.command: >-
    grep -q ' -k {{ item }}$' /etc/audit/rules.d/claude-code.rules
  loop:
    - privilege-escalation
    - privileged-exec
    - user-mgmt
    - identity-change
    - kernel-module-load
    - time-change
    - perm_mod
    - logins
    - session
    - system-locale
    - mac-policy
    - persistence
    - actions
    - audit-config
    - claude-sensitive-write
  loop_control:
    label: "{{ item | split(' ') | first }}"
  changed_when: false
  become: true
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - not (system_is_container | default(false))
    - verify_auditd_rules.stat.exists

- name: Check auditd rules contain renameat2 exclusions for build tools (b32 and b64)
  ansible.builtin.command: >-
    grep -qE '{{ item }}' /etc/audit/rules.d/claude-code.rules
