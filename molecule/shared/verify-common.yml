- name: Stat auditd rules file (system role deploys it on all non-CSB Linux)
  ansible.builtin.stat:
    path: /etc/audit/rules.d/claude-code.rules
  register: verify_auditd_rules
  become: true
  when:
    - ansible_system == 'Linux'
    - not csb_rhel

- name: Assert auditd rules file deployed with mode 0640
  ansible.builtin.assert:
    that:
      - verify_auditd_rules.stat.exists
      - verify_auditd_rules.stat.mode == '0640'
    fail_msg: "/etc/audit/rules.d/claude-code.rules not deployed or wrong mode — system role auditd task regression"
  when:
    - ansible_system == 'Linux'
    - not csb_rhel

- name: Check auditd rules contain immutability flag -e 2
  ansible.builtin.command: grep -q '^-e 2$' /etc/audit/rules.d/claude-code.rules
  changed_when: false
  become: true
