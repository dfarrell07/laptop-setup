- name: Assert coredump Storage= value matches deployed variable
  ansible.builtin.assert:
    that: >-
      ('Storage=' ~ (system_coredump_storage | default('external')))
      in (verify_coredump_content.content | b64decode)
    fail_msg: >-
      coredump drop-in missing expected Storage={{ system_coredump_storage | default('external') }} — template regression?
  when:
    - ansible_system == 'Linux'
    - verify_coredump_conf.stat.exists

- name: Assert coredump ProcessSizeMax= value matches deployed variable
  ansible.builtin.assert:
    that: >-
      ('ProcessSizeMax=' ~ (system_coredump_process_size_max | default('2G')))
      in (verify_coredump_content.content | b64decode)
    fail_msg: >-
      coredump drop-in missing expected ProcessSizeMax={{ system_coredump_process_size_max | default('2G') }} — template regression?
  when:
    - ansible_system == 'Linux'
    - verify_coredump_conf.stat.exists

- name: Stat orphaned coredump disable.conf (must be absent — pre-cycle-2 name)
  ansible.builtin.stat:
    path: /etc/systemd/coredump.conf.d/disable.conf
  register: verify_coredump_disable_conf
  when: ansible_system == 'Linux'

- name: Assert orphaned disable.conf is absent
  ansible.builtin.assert:
    that: not verify_coredump_disable_conf.stat.exists
    fail_msg: >-
      /etc/systemd/coredump.conf.d/disable.conf exists — orphaned pre-cycle-2 drop-in
      sorts before coredump.conf alphabetically and silently overrides it
  when: ansible_system == 'Linux'

- name: Stat logind hardening drop-in (system role must deploy it)
  ansible.builtin.stat:
    path: /etc/systemd/logind.conf.d/99-hardening.conf
