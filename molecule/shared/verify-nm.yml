---
# molecule/shared/verify-nm.yml
# Assertions for NetworkManager conf.d files deployed by the system role.
# Imported after verify-common.yml (which re-runs csb_detect.yml).
# Covered scenarios: vm only (container CI skips all tasks — system_is_container=true in all Podman scenarios; debian does not import it).
# NOTE: No individual task in this file carries a `not system_is_container` when clause.
# The guard is on the import_tasks caller in verify-dnf.yml:
#   when: not (system_is_container | default(false))
# Ansible's import_tasks (static import) propagates that condition to every task
# here at parse time, so each task effectively runs only on non-container hosts.
# fedora, rocky, and debian molecule scenarios all set system_is_container=true,
# so this file runs zero effective assertions in those scenarios. Only `make test-vm`
# (the VM scenario) exercises these checks against a real host.

- name: Stat /etc/NetworkManager/conf.d/tailscale.conf
  ansible.builtin.stat:
    path: /etc/NetworkManager/conf.d/tailscale.conf
  register: verify_nm_tailscale
  become: true
  when: not csb_rhel  # RHEL CSB: nm.yml deploys no tailscale.conf

- name: Assert tailscale.conf deployed by system role
  ansible.builtin.assert:
    that: verify_nm_tailscale.stat.exists
    fail_msg: "tailscale.conf missing — NM will manage podman/kind interfaces and break OVN-K"
  when: not csb_rhel

- name: Slurp tailscale.conf for content check
  ansible.builtin.slurp:
    src: /etc/NetworkManager/conf.d/tailscale.conf
  register: verify_nm_tailscale_content
  become: true
  when:
    - not csb_rhel
    - verify_nm_tailscale.stat.exists

- name: Assert tailscale.conf contains all expected unmanaged interface patterns
  ansible.builtin.assert:
    that:
      - (verify_nm_tailscale_content.content | b64decode) is search('^\[keyfile\]$', multiline=True)
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:tailscale\*')
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:podman\*')
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:kind\*')
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:br-\*')
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:virbr\*')
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:ovs-system')
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:br-int')
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:br-ex')
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:br-local')
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:genev_sys_\*')
      - csb_detected or (verify_nm_tailscale_content.content | b64decode) is search('interface-name:wg\*')  # wg* omitted on CSB
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:wt\*')
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:ovn-k8s-mp0')
    fail_msg: "tailscale.conf missing one or more unmanaged interface entries — Tailscale/OVN-K/VPN routing will break"
  when:
    - not csb_rhel
    - verify_nm_tailscale.stat.exists

- name: Stat /etc/NetworkManager/conf.d/99-dns.conf
  ansible.builtin.stat:
    path: /etc/NetworkManager/conf.d/99-dns.conf
  register: verify_nm_dns
  become: true
  when:
    - not csb_detected

- name: Assert 99-dns.conf deployed by system role
  ansible.builtin.assert:
    that: verify_nm_dns.stat.exists
    fail_msg: "99-dns.conf missing — Tailscale MagicDNS split-DNS will not work"
  when:
    - not csb_detected

- name: Slurp 99-dns.conf for content check
  ansible.builtin.slurp:
    src: /etc/NetworkManager/conf.d/99-dns.conf
  register: verify_nm_dns_content
  become: true
  when:
    - not csb_detected
    - verify_nm_dns.stat.exists

- name: Assert 99-dns.conf contains dns=systemd-resolved
  ansible.builtin.assert:
    that: (verify_nm_dns_content.content | b64decode) is search('^dns=systemd-resolved$', multiline=True)
    fail_msg: "99-dns.conf exists but does not contain dns=systemd-resolved"
  when:
    - not csb_detected
    - verify_nm_dns.stat.exists

- name: Stat /etc/NetworkManager/conf.d/99-wifi-powersave.conf
  ansible.builtin.stat:
    path: /etc/NetworkManager/conf.d/99-wifi-powersave.conf
  register: verify_nm_wifi_ps
  become: true
  when:
    - system_wifi_powersave_disabled | default(not csb_rhel) | bool
    - not csb_rhel  # RHEL CSB removes this file

- name: Assert 99-wifi-powersave.conf deployed by system role
  ansible.builtin.assert:
    that: verify_nm_wifi_ps.stat.exists
    fail_msg: "99-wifi-powersave.conf missing — Wi-Fi power management not configured"
  when:
    - system_wifi_powersave_disabled | default(not csb_rhel) | bool
    - not csb_rhel  # RHEL CSB removes this file

- name: Slurp 99-wifi-powersave.conf for content check
  ansible.builtin.slurp:
    src: /etc/NetworkManager/conf.d/99-wifi-powersave.conf
  register: verify_nm_wifi_ps_content
  become: true
  when:
    - system_wifi_powersave_disabled | default(not csb_rhel) | bool
    - not csb_rhel  # RHEL CSB removes this file
    - verify_nm_wifi_ps.stat.exists

- name: Assert 99-wifi-powersave.conf contains wifi.powersave=2
  ansible.builtin.assert:
    that:
      - (verify_nm_wifi_ps_content.content | b64decode) is search('^wifi\.powersave=2$', multiline=True)
      - (verify_nm_wifi_ps_content.content | b64decode) is search('^match-device=type:wifi$', multiline=True)
    fail_msg: "99-wifi-powersave.conf exists but does not contain wifi.powersave=2"
  when:
    - system_wifi_powersave_disabled | default(not csb_rhel) | bool
    - not csb_rhel  # RHEL CSB removes this file
    - verify_nm_wifi_ps.stat.exists

- name: Stat /etc/NetworkManager/conf.d/99-dhcp-privacy.conf
  ansible.builtin.stat:
    path: /etc/NetworkManager/conf.d/99-dhcp-privacy.conf
  register: verify_nm_dhcp_privacy
  become: true
  when:
    - not csb_detected

- name: Assert 99-dhcp-privacy.conf deployed by system role
  ansible.builtin.assert:
    that: verify_nm_dhcp_privacy.stat.exists
    fail_msg: "99-dhcp-privacy.conf missing — hostname leaked to DHCP servers"
  when:
    - not csb_detected

- name: Slurp 99-dhcp-privacy.conf for content check
  ansible.builtin.slurp:
    src: /etc/NetworkManager/conf.d/99-dhcp-privacy.conf
  register: verify_nm_dhcp_privacy_content
  become: true
  when:
    - not csb_detected
    - verify_nm_dhcp_privacy.stat.exists

- name: Assert 99-dhcp-privacy.conf suppresses DHCP hostname advertisement
  ansible.builtin.assert:
    that:
      - (verify_nm_dhcp_privacy_content.content | b64decode) is search('^\[connection\]$', multiline=True)
      - (verify_nm_dhcp_privacy_content.content | b64decode) is search('^ipv4\.dhcp-send-hostname=false$', multiline=True)
      - (verify_nm_dhcp_privacy_content.content | b64decode) is search('^ipv6\.dhcp-send-hostname=false$', multiline=True)
    fail_msg: "99-dhcp-privacy.conf exists but does not contain ipv4/ipv6 dhcp-send-hostname=false"
  when:
    - not csb_detected
    - verify_nm_dhcp_privacy.stat.exists

- name: Stat /etc/NetworkManager/system-connections
  ansible.builtin.stat:
    path: /etc/NetworkManager/system-connections
  register: verify_nm_system_connections
  become: true

- name: Assert system-connections is root-only (VPN/SSID topology not enumerable)
  ansible.builtin.assert:
    that:
      - verify_nm_system_connections.stat.exists
      - verify_nm_system_connections.stat.mode == '0700'
      - verify_nm_system_connections.stat.pw_name == 'root'
    fail_msg: >-
      /etc/NetworkManager/system-connections must be root 0700 (got
      {{ verify_nm_system_connections.stat.mode | default('absent') }}) — system role nm.yml regression
