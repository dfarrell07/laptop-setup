---
# molecule/shared/verify-nm.yml
# Assertions for NetworkManager conf.d files deployed by the system role.
# Include after verify-common.yml (which re-runs csb_detect.yml).
# Covered scenarios: fedora, rocky, vm, debian.
# NOTE: All assertions below are gated on `not system_is_container`. Since
# fedora, rocky, and debian molecule scenarios all set system_is_container=true,
# this file runs zero effective assertions in those scenarios. Only `make test-vm`
# (the VM scenario) exercises these checks against a real host.

- name: NM conf.d assertions skipped in container (VM scenario only)
  ansible.builtin.debug:
    msg: "NM conf.d assertions skipped: system_is_container=true. Only make test-vm exercises these checks."
  when: system_is_container | default(false)

- name: Stat /etc/NetworkManager/conf.d/tailscale.conf
  ansible.builtin.stat:
    path: /etc/NetworkManager/conf.d/tailscale.conf
  register: verify_nm_tailscale
  become: true
  when: not (system_is_container | default(false))

- name: Assert tailscale.conf deployed by system role
  ansible.builtin.assert:
    that: verify_nm_tailscale.stat.exists
    fail_msg: "tailscale.conf missing — NM will manage podman/kind interfaces and break OVN-K"
  when: not (system_is_container | default(false))

- name: Slurp tailscale.conf for content check
  ansible.builtin.slurp:
    src: /etc/NetworkManager/conf.d/tailscale.conf
  register: verify_nm_tailscale_content
  become: true
  when: verify_nm_tailscale.stat.exists

- name: Assert tailscale.conf contains tailscale, podman, and kind unmanaged entries
  ansible.builtin.assert:
    that:
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:tailscale\*')
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:podman\*')
      - (verify_nm_tailscale_content.content | b64decode) is search('interface-name:kind\*')
    fail_msg: "tailscale.conf missing tailscale*, podman*, or kind* unmanaged entry — Tailscale routing or OVN-K/kind networking will break"
  when: verify_nm_tailscale.stat.exists

- name: Stat /etc/NetworkManager/conf.d/99-dns.conf
  ansible.builtin.stat:
    path: /etc/NetworkManager/conf.d/99-dns.conf
  register: verify_nm_dns
  become: true
  when:
    - not csb_rhel
    - not (system_is_container | default(false))

- name: Assert 99-dns.conf deployed by system role
  ansible.builtin.assert:
    that: verify_nm_dns.stat.exists
    fail_msg: "99-dns.conf missing — Tailscale MagicDNS split-DNS will not work"
  when:
    - not csb_rhel
    - not (system_is_container | default(false))

- name: Slurp 99-dns.conf for content check
  ansible.builtin.slurp:
    src: /etc/NetworkManager/conf.d/99-dns.conf
  register: verify_nm_dns_content
  become: true
  when:
    - not csb_rhel
    - verify_nm_dns.stat.exists

- name: Assert 99-dns.conf contains dns=systemd-resolved
  ansible.builtin.assert:
    that: (verify_nm_dns_content.content | b64decode) is search('dns=systemd-resolved')
    fail_msg: "99-dns.conf exists but does not contain dns=systemd-resolved"
  when:
    - not csb_rhel
    - verify_nm_dns.stat.exists

- name: Stat /etc/NetworkManager/conf.d/99-wifi-mac-rand.conf
  ansible.builtin.stat:
    path: /etc/NetworkManager/conf.d/99-wifi-mac-rand.conf
  register: verify_nm_wifi_mac
  become: true
  when:
    - system_wifi_mac_rand | default(not csb_detected) | bool
    - not (system_is_container | default(false))

- name: Assert 99-wifi-mac-rand.conf deployed by system role
  ansible.builtin.assert:
    that: verify_nm_wifi_mac.stat.exists
    fail_msg: "99-wifi-mac-rand.conf missing — Wi-Fi MAC address randomisation not configured"
  when:
    - system_wifi_mac_rand | default(not csb_detected) | bool
    - not (system_is_container | default(false))

- name: Slurp 99-wifi-mac-rand.conf for content check
  ansible.builtin.slurp:
    src: /etc/NetworkManager/conf.d/99-wifi-mac-rand.conf
  register: verify_nm_wifi_mac_content
  become: true
  when:
    - system_wifi_mac_rand | default(not csb_detected) | bool
    - verify_nm_wifi_mac.stat.exists

- name: Assert 99-wifi-mac-rand.conf contains stable-ssid
  ansible.builtin.assert:
    that: (verify_nm_wifi_mac_content.content | b64decode) is search('stable-ssid')
    fail_msg: "99-wifi-mac-rand.conf exists but does not contain stable-ssid"
  when:
    - system_wifi_mac_rand | default(not csb_detected) | bool
    - verify_nm_wifi_mac.stat.exists

- name: Stat /etc/NetworkManager/conf.d/99-wifi-powersave.conf
  ansible.builtin.stat:
    path: /etc/NetworkManager/conf.d/99-wifi-powersave.conf
  register: verify_nm_wifi_ps
  become: true
  when:
    - system_wifi_powersave | default(not csb_rhel) | bool
    - not (system_is_container | default(false))

- name: Assert 99-wifi-powersave.conf deployed by system role
  ansible.builtin.assert:
    that: verify_nm_wifi_ps.stat.exists
    fail_msg: "99-wifi-powersave.conf missing — Wi-Fi power management not configured"
  when:
    - system_wifi_powersave | default(not csb_rhel) | bool
    - not (system_is_container | default(false))

- name: Slurp 99-wifi-powersave.conf for content check
  ansible.builtin.slurp:
    src: /etc/NetworkManager/conf.d/99-wifi-powersave.conf
  register: verify_nm_wifi_ps_content
  become: true
  when:
    - not csb_rhel
    - verify_nm_wifi_ps.stat.exists

- name: Assert 99-wifi-powersave.conf contains wifi.powersave=2
  ansible.builtin.assert:
    that: (verify_nm_wifi_ps_content.content | b64decode) is search('wifi\.powersave=2')
    fail_msg: "99-wifi-powersave.conf exists but does not contain wifi.powersave=2"
  when:
    - not csb_rhel
    - verify_nm_wifi_ps.stat.exists
