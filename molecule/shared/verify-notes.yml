---
# molecule/shared/verify-notes.yml
# Notes role assertions — private repo; clone expected to fail gracefully in CI.
# Include from each scenario verify.yml via include_tasks.

- name: Check notes repo directory
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/notes/.git"
  register: verify_notes

# No existence assertion here: ci-mock-notes.yml creates ~/notes/.git unconditionally
# before the notes role runs, so the stat above always succeeds and asserts nothing
# about role behavior. The mode/gitleaks assertions below DO test role behavior.

- name: Stat notes .git/config for permission check
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/notes/.git/config"
  register: verify_notes_config

- name: Verify notes .git/config permissions
  ansible.builtin.assert:
    that: verify_notes_config.stat.mode == '0600'
    fail_msg: "notes .git/config should be 0600 (got {{ verify_notes_config.stat.mode | default('absent') }})"

- name: Stat notes directory for permission check
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/notes"
  register: verify_notes_dir

- name: Assert notes directory is mode 0700
  ansible.builtin.assert:
    that: verify_notes_dir.stat.mode == '0700'
    fail_msg: "notes/ should be 0700 — world-readable notes regression"

- name: Stat notes gitleaks allowlist
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/notes/.gitleaks.toml"
  register: verify_notes_gitleaks

- name: Assert notes gitleaks allowlist deployed
  ansible.builtin.assert:
    that: verify_notes_gitleaks.stat.exists
    fail_msg: "notes/.gitleaks.toml missing — pre-commit gitleaks hook will reject all notes commits"
