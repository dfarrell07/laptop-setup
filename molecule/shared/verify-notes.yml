---
# molecule/shared/verify-notes.yml
# Notes role assertions — private repo; ci-mock-notes.yml pre-creates the checkout so the role skips the clone in CI.
# Imported from each scenario verify.yml via import_tasks.

# No existence assertion for the notes checkout's .git: ci-mock-notes.yml creates it unconditionally before
# the notes role runs, so it would assert nothing about role behavior. The mode/gitleaks
# assertions below DO test role behavior.

- name: Stat notes .git/config for permission check
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/{{ notes_repo_name | default('notes') }}/.git/config"
  register: verify_notes_config

- name: Verify notes .git/config permissions
  ansible.builtin.assert:
    that: verify_notes_config.stat.mode == '0600'
    fail_msg: "notes .git/config should be 0600 (got {{ verify_notes_config.stat.mode | default('absent') }})"

- name: Stat notes directory for permission check
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/{{ notes_repo_name | default('notes') }}"
  register: verify_notes_dir

- name: Assert notes directory is mode 0700
  ansible.builtin.assert:
    that: verify_notes_dir.stat.mode == '0700'
    fail_msg: "notes/ should be 0700 — world-readable notes regression"

- name: Stat notes gitleaks allowlist
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/{{ notes_repo_name | default('notes') }}/.gitleaks.toml"
  register: verify_notes_gitleaks

# CI provisions without a transcrypt password, so the checkout stays plaintext and must keep
# secret scanning (the allowlist is only deployed for an encrypted repo).
- name: Assert notes gitleaks allowlist absent in a plaintext checkout
  ansible.builtin.assert:
    that: not verify_notes_gitleaks.stat.exists
    fail_msg: "notes/.gitleaks.toml deployed without transcrypt — secrets would be committed unscanned"
