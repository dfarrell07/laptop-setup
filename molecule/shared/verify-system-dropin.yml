---
# molecule/shared/verify-system-dropin.yml
# System role drop-in file assertions (sshd, modprobe, sysctl, auditd).
# Imported by verify-common.yml.

# --- System role drop-in files ---
# File is mode 0600 root:root — become: true required for stat and grep.
# Catches directive-value regressions that pass sshd -t syntax validation.
- name: Stat sshd hardening drop-in (asserts system role deployed it)
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/00-hardening.conf
  register: verify_sshd_dropin
  become: true
  when: ansible_system == 'Linux'

- name: Assert sshd hardening drop-in deployed with mode 0600
  ansible.builtin.assert:
    that: verify_sshd_dropin.stat.exists and verify_sshd_dropin.stat.mode == '0600'
    fail_msg: "/etc/ssh/sshd_config.d/00-hardening.conf missing or wrong permissions (expected 0600)"
  when: ansible_system == 'Linux'

- name: Check sshd hardening drop-in contains critical directives
  ansible.builtin.command: grep -q '{{ item }}' /etc/ssh/sshd_config.d/00-hardening.conf
  loop:
    - "PasswordAuthentication no"
    - "PermitRootLogin no"
    - "KbdInteractiveAuthentication no"
    - "PermitEmptyPasswords no"
    - "X11Forwarding no"
    - "HostKeyAlgorithms ssh-ed25519"
    - "ClientAliveInterval 300"
    - "ClientAliveCountMax 2"
    - "Port {{ ssh_port }}"
    - "AllowUsers "
  changed_when: false
  become: true
  when:
    - ansible_system == 'Linux'
    - verify_sshd_dropin.stat.exists

- name: Stat /etc/systemd/resolved.conf.d/98-llmnr.conf
  ansible.builtin.stat:
    path: /etc/systemd/resolved.conf.d/98-llmnr.conf
  register: verify_llmnr_conf
  when: ansible_system == 'Linux'

- name: Assert 98-llmnr.conf deployed
  ansible.builtin.assert:
    that: verify_llmnr_conf.stat.exists
    fail_msg: "/etc/systemd/resolved.conf.d/98-llmnr.conf not deployed — system role did not run or LLMNR/mDNS hardening removed"
  when: ansible_system == 'Linux'

- name: Stat /etc/systemd/resolved.conf.d/99-dot.conf
  ansible.builtin.stat:
    path: /etc/systemd/resolved.conf.d/99-dot.conf
  register: verify_dot_conf
  when:
    - ansible_system == 'Linux'
    - not csb_rhel

- name: Assert DNS-over-TLS config deployed
  ansible.builtin.assert:
    that: verify_dot_conf.stat.exists
    fail_msg: "/etc/systemd/resolved.conf.d/99-dot.conf not deployed — DNS-over-TLS regression"
  when:
    - ansible_system == 'Linux'
    - not csb_rhel

- name: Stat /etc/resolv.conf (symlink check)
  ansible.builtin.stat:
    path: /etc/resolv.conf
    follow: false
  register: verify_resolv_conf
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - ansible_distribution != 'Rocky'  # Rocky CI exercises csb_rhel=true path; symlink intentionally absent

- name: Assert /etc/resolv.conf is symlink to stub-resolv.conf
  ansible.builtin.assert:
    that:
      - verify_resolv_conf.stat.islnk
      - verify_resolv_conf.stat.lnk_target == '/run/systemd/resolve/stub-resolv.conf'
    fail_msg: >-
      /etc/resolv.conf is not a symlink to /run/systemd/resolve/stub-resolv.conf —
      split DNS / Tailscale MagicDNS will not work; dns_over_tls.yml creates this symlink
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - ansible_distribution != 'Rocky'  # Rocky CI exercises csb_rhel=true path; symlink intentionally absent

- name: Stat coredump drop-in (system role must deploy it)
  ansible.builtin.stat:
    path: /etc/systemd/coredump.conf.d/coredump.conf
  register: verify_coredump_conf
  when: ansible_system == 'Linux'

- name: Assert coredump drop-in deployed
  ansible.builtin.assert:
    that: verify_coredump_conf.stat.exists
    fail_msg: "/etc/systemd/coredump.conf.d/coredump.conf not deployed — system role Configure coredump storage task regression"
  when: ansible_system == 'Linux'

- name: Slurp coredump drop-in content
  ansible.builtin.slurp:
    src: /etc/systemd/coredump.conf.d/coredump.conf
  register: verify_coredump_content
  when:
    - ansible_system == 'Linux'
    - verify_coredump_conf.stat.exists

- name: Assert coredump Storage= value matches deployed variable
  ansible.builtin.assert:
    that: >-
      ('Storage=' ~ (system_coredump_storage | default('external')))
      in (verify_coredump_content.content | b64decode)
    fail_msg: >-
      coredump drop-in missing expected Storage={{ system_coredump_storage | default('external') }} — template regression?
  when:
    - ansible_system == 'Linux'
    - verify_coredump_conf.stat.exists

- name: Assert coredump ProcessSizeMax= value matches deployed variable
  ansible.builtin.assert:
    that: >-
      ('ProcessSizeMax=' ~ (system_coredump_process_size_max | default('2G')))
      in (verify_coredump_content.content | b64decode)
    fail_msg: >-
      coredump drop-in missing expected ProcessSizeMax={{ system_coredump_process_size_max | default('2G') }} — template regression?
  when:
    - ansible_system == 'Linux'
    - verify_coredump_conf.stat.exists

- name: Stat orphaned coredump disable.conf (must be absent — pre-cycle-2 name)
  ansible.builtin.stat:
    path: /etc/systemd/coredump.conf.d/disable.conf
  register: verify_coredump_disable_conf
  when: ansible_system == 'Linux'

- name: Assert orphaned disable.conf is absent
  ansible.builtin.assert:
    that: not verify_coredump_disable_conf.stat.exists
    fail_msg: >-
      /etc/systemd/coredump.conf.d/disable.conf exists — orphaned pre-cycle-2 drop-in
      sorts before coredump.conf alphabetically and silently overrides it
  when: ansible_system == 'Linux'

- name: Stat logind hardening drop-in (system role must deploy it)
  ansible.builtin.stat:
    path: /etc/systemd/logind.conf.d/99-hardening.conf
  register: verify_logind_conf
  when: ansible_system == 'Linux'

- name: Assert logind hardening drop-in deployed
  ansible.builtin.assert:
    that: verify_logind_conf.stat.exists
    fail_msg: "/etc/systemd/logind.conf.d/99-hardening.conf not deployed — system role logind task regression"
  when: ansible_system == 'Linux'

- name: Stat sudoers hardening drop-in (system role must deploy it)
  ansible.builtin.stat:
    path: /etc/sudoers.d/99-hardening
  register: verify_sudoers_conf
  become: true
  when: ansible_system == 'Linux'

- name: Assert sudoers hardening drop-in deployed
  ansible.builtin.assert:
    that: verify_sudoers_conf.stat.exists
    fail_msg: "/etc/sudoers.d/99-hardening not deployed — system role sudoers task regression"
  when: ansible_system == 'Linux'

- name: Assert sudoers drop-in is mode 0440
  ansible.builtin.assert:
    that: verify_sudoers_conf.stat.mode == '0440'
    fail_msg: "/etc/sudoers.d/99-hardening has wrong mode {{ verify_sudoers_conf.stat.mode }} — expected 0440"
  when:
    - ansible_system == 'Linux'
    - verify_sudoers_conf.stat.exists

- name: Check logind drop-in has IdleAction=lock
  ansible.builtin.command: grep -q '^IdleAction=lock' /etc/systemd/logind.conf.d/99-hardening.conf
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - verify_logind_conf.stat.exists

- name: Stat sudoers go-env drop-in (system role must deploy it on non-CSB)
  ansible.builtin.stat:
    path: /etc/sudoers.d/go-env
  register: verify_sudoers_go_env
  when:
    - ansible_system == 'Linux'
    - not csb_rhel

- name: Assert sudoers go-env drop-in deployed
  ansible.builtin.assert:
    that: verify_sudoers_go_env.stat.exists
    fail_msg: "/etc/sudoers.d/go-env not deployed — system role sudoers go-env task regression"
  when:
    - ansible_system == 'Linux'
    - not csb_rhel

- name: Stat logrotate sudo config (/var/log/sudo.log rotation)
  ansible.builtin.stat:
    path: /etc/logrotate.d/sudo
  register: verify_logrotate_sudo
  become: true
  when:
    - ansible_system == 'Linux'
    - not csb_rhel

- name: Assert logrotate sudo config deployed
  ansible.builtin.assert:
    that: verify_logrotate_sudo.stat.exists
    fail_msg: "/etc/logrotate.d/sudo not deployed — system role logrotate task regression"
  when:
    - ansible_system == 'Linux'
    - not csb_rhel

- name: Stat journald hardening drop-in (system role deploys it on non-CSB Linux)
  ansible.builtin.stat:
    path: /etc/systemd/journald.conf.d/99-hardening.conf
  register: verify_journald_conf
  when:
    - ansible_system == 'Linux'
    - not csb_rhel

- name: Assert journald hardening drop-in deployed
  ansible.builtin.assert:
    that: verify_journald_conf.stat.exists
    fail_msg: "/etc/systemd/journald.conf.d/99-hardening.conf not deployed — system role journald task regression"
  when:
    - ansible_system == 'Linux'
    - not csb_rhel

- name: Check journald drop-in has Storage=persistent
  ansible.builtin.command: grep -q '^Storage=persistent' /etc/systemd/journald.conf.d/99-hardening.conf
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - verify_journald_conf.stat.exists

- name: Check journald drop-in has SystemMaxUse=4G
  ansible.builtin.command: grep -q '^SystemMaxUse=4G' /etc/systemd/journald.conf.d/99-hardening.conf
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - verify_journald_conf.stat.exists

- name: Check journald drop-in has MaxRetentionSec=6month
  ansible.builtin.command: grep -q '^MaxRetentionSec=6month' /etc/systemd/journald.conf.d/99-hardening.conf
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - verify_journald_conf.stat.exists

- name: Check journald drop-in has SystemKeepFree=1G
  ansible.builtin.command: grep -q '^SystemKeepFree=1G' /etc/systemd/journald.conf.d/99-hardening.conf
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - verify_journald_conf.stat.exists

- name: Check journald drop-in has RateLimitIntervalSec=30s
  ansible.builtin.command: grep -q '^RateLimitIntervalSec=30s' /etc/systemd/journald.conf.d/99-hardening.conf
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - verify_journald_conf.stat.exists

- name: Check journald drop-in has RateLimitBurst=20000
  ansible.builtin.command: grep -q '^RateLimitBurst=20000' /etc/systemd/journald.conf.d/99-hardening.conf
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - verify_journald_conf.stat.exists

- name: Check sudoers drop-in has logfile directive
  ansible.builtin.command: grep -q 'logfile=' /etc/sudoers.d/99-hardening
  changed_when: false
  become: true
  when:
    - ansible_system == 'Linux'
    - verify_sudoers_conf.stat.exists

- name: Stat auditd rules file (system role deploys it on all non-CSB Linux)
  ansible.builtin.stat:
    path: /etc/audit/rules.d/claude-code.rules
  register: verify_auditd_rules
  become: true
  when:
    - ansible_system == 'Linux'
    - not csb_rhel

- name: Assert auditd rules file deployed with mode 0640
  ansible.builtin.assert:
    that:
      - verify_auditd_rules.stat.exists
      - verify_auditd_rules.stat.mode == '0640'
    fail_msg: "/etc/audit/rules.d/claude-code.rules not deployed or wrong mode — system role auditd task regression"
  when:
    - ansible_system == 'Linux'
    - not csb_rhel

- name: Check auditd rules contain immutability flag -e 2
  ansible.builtin.command: grep -q '^-e 2$' /etc/audit/rules.d/claude-code.rules
  changed_when: false
  become: true
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - verify_auditd_rules.stat.exists

- name: Check auditd rules contain required watch keys
  ansible.builtin.command: >-
    grep -q ' -k {{ item }}$' /etc/audit/rules.d/claude-code.rules
  loop:
    - privilege-escalation
    - privileged-exec
    - user-mgmt
    - identity-change
    - kernel-module-load
    - time-change
    - perm_mod
    - logins
    - session
    - system-locale
    - mac-policy
    - persistence
    - actions
    - audit-config
    - claude-sensitive-write
  changed_when: false
  become: true
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - verify_auditd_rules.stat.exists

- name: Check auditd rules contain renameat2 exclusions for build tools (b32 and b64)
  ansible.builtin.command: >-
    grep -qE '{{ item }}' /etc/audit/rules.d/claude-code.rules
  loop:
    - 'arch=b64.*renameat2.*exe=/usr/bin/cargo'
    - 'arch=b32.*renameat2.*exe=/usr/bin/cargo'
    - 'arch=b64.*renameat2.*exe=/usr/bin/git'
    - 'arch=b32.*renameat2.*exe=/usr/bin/git'
    - 'arch=b64.*renameat2.*exe=/usr/bin/npm'
    - 'arch=b32.*renameat2.*exe=/usr/bin/npm'
  changed_when: false
  become: true
  when:
    - ansible_system == 'Linux'
    - not csb_rhel
    - verify_auditd_rules.stat.exists
