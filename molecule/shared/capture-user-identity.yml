---
# molecule/shared/capture-user-identity.yml
# Sets real_user_home and real_user_id facts from the environment.
# Included via common-system-play-pre-tasks.yml by the fedora/rocky/debian converge plays.
# NOTE: vm/converge.yml inlines this with real_user_id: ansible_user instead of ENV USER.
- name: Capture real user identity
  ansible.builtin.set_fact:
    real_user_home: "{{ lookup('env', 'HOME') }}"
    real_user_id: "{{ lookup('env', 'USER') }}"
  become: false
