---
# molecule/shared/dnf-cache-refresh.yml
# Refresh DNF cache before system role so it sees current mirror metadata.
# Included by fedora/converge.yml and rocky/converge.yml.
- name: Refresh DNF cache so system role sees current mirror metadata
  ansible.builtin.dnf:
    update_cache: true
  register: _dnf_cache_refresh
  retries: 3
  delay: 5
  until: _dnf_cache_refresh is succeeded
