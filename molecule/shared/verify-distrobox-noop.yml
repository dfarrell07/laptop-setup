---
# molecule/shared/verify-distrobox-noop.yml
# Assertions for the distrobox role no-op path (packages_containers emptied in converge).
# Included by rocky/verify.yml and fedora/verify.yml.
#
# NOTE: Both assertions are intentionally "trivially true" under normal operation.
# The first passes because packages_containers: [] prevents the packages role from
# ever installing distrobox; the second passes because the distrobox role only writes
# distrobox.ini when it detects an installed distrobox binary. These are guard-logic
# regression tests: they catch bugs where the guard itself regresses (e.g., the role
# installs distrobox despite the override, or writes distrobox.ini despite no binary).
# The value is in detecting future regressions to those guards, not in exercising a
# non-trivial code path today.

- name: Check distrobox binary presence in CI (should be absent)
  ansible.builtin.stat:
    path: /usr/bin/distrobox
  register: verify_distrobox_bin

- name: Assert distrobox is not installed (packages_containers emptied)
  ansible.builtin.assert:
    that:
      - not verify_distrobox_bin.stat.exists
    fail_msg: "distrobox found in PATH despite packages_containers: [] — converge override not applied?"

- name: Stat distrobox.ini (must be absent on no-op path)
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/distrobox/distrobox.ini"
  register: verify_distrobox_ini

- name: Assert distrobox.ini is absent when no tool is installed
  ansible.builtin.assert:
    that: not verify_distrobox_ini.stat.exists
    fail_msg: "distrobox.ini deployed despite /usr/bin/distrobox being absent — distrobox role guard (distrobox_tool detection) regressed"
