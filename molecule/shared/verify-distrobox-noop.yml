---
# molecule/shared/verify-distrobox-noop.yml
# Assertions for the distrobox role no-op path (packages_containers emptied in converge).
# Included by rocky/verify.yml and fedora/verify.yml.
#
# This assertion targets the distrobox role's "Remove stale distrobox.ini when distrobox
# is not installed" task guard (distrobox_check.rc != 0). It detects regressions where
# the role writes distrobox.ini despite no binary being present.

- name: Stat distrobox.ini (must be absent on no-op path)
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/distrobox/distrobox.ini"
  register: verify_distrobox_ini

- name: Assert distrobox.ini is absent when no tool is installed
  ansible.builtin.assert:
    that: not verify_distrobox_ini.stat.exists
    fail_msg: "distrobox.ini deployed despite /usr/bin/distrobox being absent — distrobox role guard (distrobox_tool detection) regressed"
