---
# molecule/shared/verify-desktop-common.yml
# Alacritty config and Chrome security policy assertions.
# Included by Linux scenario verify.yml files via import_tasks.
# macOS verify.yml does not import this file; it carries its own inline Alacritty check.

- name: Verify Alacritty config deployed
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/alacritty/alacritty.toml"
  register: verify_alacritty
  when: desktop_terminal | default('alacritty') == 'alacritty'

- name: Assert Alacritty config exists
  ansible.builtin.assert:
    that: verify_alacritty.stat.exists
    fail_msg: "Alacritty config not deployed"
  when: desktop_terminal | default('alacritty') == 'alacritty'

# The desktop role writes security.json only when no IT-managed CSB policy file exists.
- name: Stat IT-managed CSB Chrome policy
  ansible.builtin.stat:
    path: /etc/opt/chrome/policies/managed/csb-chrome-policies.json
  register: verify_chrome_csb
  when: ansible_system == 'Linux' and not (system_is_container | default(false)) and (desktop_deploy_chrome_policies | default(false))

- name: Verify Chrome policy deployed
  ansible.builtin.stat:
    path: /etc/opt/chrome/policies/managed/security.json
  register: verify_chrome
  when:
    - ansible_system == 'Linux'
    - not (system_is_container | default(false))
    - desktop_deploy_chrome_policies | default(false)
    - not (verify_chrome_csb.stat.exists | default(false))

- name: Assert Chrome policy exists
  ansible.builtin.assert:
    that: verify_chrome.stat.exists
    fail_msg: "/etc/opt/chrome/policies/managed/security.json not deployed — desktop role Chrome policy task regression"
  when:
    - ansible_system == 'Linux'
    - not (system_is_container | default(false))
    - desktop_deploy_chrome_policies | default(false)
    - not (verify_chrome_csb.stat.exists | default(false))

- name: Validate Chrome security policy JSON
  ansible.builtin.command:
    cmd: >-
      python3 -c "import json; d=json.load(open('/etc/opt/chrome/policies/managed/security.json'));
      assert d.get('RemoteDebuggingAllowed') == False, 'RemoteDebuggingAllowed not false'"
  changed_when: false
  when:
    - ansible_system == 'Linux'
    - not (system_is_container | default(false))
    - desktop_deploy_chrome_policies | default(false)
    - not (verify_chrome_csb.stat.exists | default(false))
