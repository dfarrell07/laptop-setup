---
# molecule/shared/verify-desktop-common.yml
# Alacritty config and Chrome security policy assertions.
# Included by Linux scenario verify.yml files via import_tasks.
# macOS verify.yml does not import this file; it carries its own inline Alacritty check.

- name: Verify Alacritty config deployed
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/alacritty/alacritty.toml"
  register: verify_alacritty
  when: desktop_terminal | default('alacritty') == 'alacritty'

- name: Assert Alacritty config exists
  ansible.builtin.assert:
    that: verify_alacritty.stat.exists
    fail_msg: "Alacritty config not deployed"
  when: desktop_terminal | default('alacritty') == 'alacritty'
