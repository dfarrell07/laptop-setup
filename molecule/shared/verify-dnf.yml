---
# molecule/shared/verify-dnf.yml
# Assertions for dnf-based platforms (Fedora, Rocky Linux, VM).
# Include after verify-common.yml.

- name: Check zsh is installed
  ansible.builtin.command: zsh --version
  changed_when: false

- name: Check tmux is installed
  ansible.builtin.command: tmux -V
  changed_when: false

- name: Check jq is installed
  ansible.builtin.command: jq --version
  changed_when: false

- name: Check fzf is installed
  ansible.builtin.command: fzf --version
  changed_when: false

- name: Check ripgrep is installed
  ansible.builtin.command: rg --version
  changed_when: false

- name: Check bat is installed
  ansible.builtin.command: bat --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # not in Rocky 10 converge packages_cli subset

- name: Check fd-find is installed
  ansible.builtin.command: fd --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # no fd-find in EPEL 10

- name: Check shfmt is installed
  ansible.builtin.command: shfmt --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # not in EPEL 10

- name: Check tree is installed
  ansible.builtin.command: tree --version
  changed_when: false

- name: Check go is installed
  ansible.builtin.command: go version
  changed_when: false
  # golang is in packages_languages on all dnf platforms including Rocky

- name: Check gcc is installed
  ansible.builtin.command: gcc --version
  changed_when: false

- name: Check python3 is installed
  ansible.builtin.command: python3 --version
  changed_when: false

- name: Check pip3 is installed
  ansible.builtin.command: pip3 --version
  changed_when: false

- name: Check direnv is installed
  ansible.builtin.command: direnv version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # not in Rocky 10 repos

- name: Check zoxide is installed
  ansible.builtin.command: zoxide --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # not in Rocky 10 repos

- name: Check gh is installed
  ansible.builtin.command: gh --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # not in Rocky 10 converge subset

- name: Check yq is installed
  ansible.builtin.command: yq --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # not in Rocky 10 converge subset

- name: Check kubectl binary presence
  ansible.builtin.stat:
    path: /usr/local/bin/kubectl
  register: verify_kubectl_bin
  when: (packages_install_binaries | bool) and (profile | default('work')) == 'work'

- name: Assert kubectl binary is present and executable
  ansible.builtin.assert:
    that:
      - verify_kubectl_bin.stat.exists
      - verify_kubectl_bin.stat.executable
    fail_msg: 'kubectl binary is missing or not executable'
  when: (packages_install_binaries | bool) and (profile | default('work')) == 'work'

- name: Check kind binary presence
  ansible.builtin.stat:
    path: /usr/local/bin/kind
  register: verify_kind_bin
  when: packages_install_binaries | bool

- name: Assert kind binary is present and executable
  ansible.builtin.assert:
    that:
      - verify_kind_bin.stat.exists
      - verify_kind_bin.stat.executable
    fail_msg: 'kind binary is missing or not executable'
  when: packages_install_binaries | bool

- name: Check gpg is installed
  ansible.builtin.command: gpg --version
  changed_when: false

- name: Check openssl is installed
  ansible.builtin.command: openssl version
  changed_when: false

- name: Check ykman binary presence
  ansible.builtin.stat:
    path: /usr/bin/ykman
  register: verify_ykman_bin
  # ykman is from packages_security (a dnf package), not a binary download;
  # packages_security is set to [] in Podman CI converge, so absence is intentional.

- name: Check ykman version when installed
  ansible.builtin.command: ykman --version
  changed_when: false
  when: verify_ykman_bin.stat.exists

- name: Stat /etc/kernel/cmdline
  ansible.builtin.stat:
    path: /etc/kernel/cmdline
  register: verify_kernel_cmdline

- name: Assert /etc/kernel/cmdline contains vsyscall=none
  ansible.builtin.command:
    cmd: grep -q 'vsyscall=none' /etc/kernel/cmdline
  changed_when: false
  when: verify_kernel_cmdline.stat.exists

- name: Assert /etc/kernel/cmdline contains init_on_free=1
  ansible.builtin.command:
    cmd: grep -q 'init_on_free=1' /etc/kernel/cmdline
  changed_when: false
  when:
    - verify_kernel_cmdline.stat.exists
    - system_init_on_free | bool

- name: Include containers.conf assertions
  ansible.builtin.include_tasks: verify-containers.yml

- name: Include NetworkManager conf.d assertions
  ansible.builtin.include_tasks: verify-nm.yml

# --- PAM / authselect / faillock / pwquality / pwhistory ---
- name: Check authselect with-faillock is active
  ansible.builtin.command: authselect is-feature-enabled with-faillock
  register: verify_faillock_authselect
  changed_when: false
  failed_when: verify_faillock_authselect.rc != 0
  become: true

- name: Check authselect with-pwhistory is active
  ansible.builtin.command: authselect is-feature-enabled with-pwhistory
  register: verify_pwhistory_authselect
  changed_when: false
  failed_when: verify_pwhistory_authselect.rc != 0
  become: true

- name: Run authselect check to verify PAM files match profile
  ansible.builtin.command: authselect check
  changed_when: false
  become: true

- name: Check faillock deny={{ system_faillock_deny }}
  ansible.builtin.command: grep -q '^deny = {{ system_faillock_deny }}' /etc/security/faillock.conf
  changed_when: false
  become: true

- name: Check faillock local_users_only (prevent SSSD double-lockout)
  ansible.builtin.command: grep -q '^local_users_only' /etc/security/faillock.conf
  changed_when: false
  become: true

- name: Check faillock audit flag is set (CIS 5.4.2)
  ansible.builtin.command: grep -q '^audit' /etc/security/faillock.conf
  changed_when: false
  become: true

- name: Check faillock unlock_time={{ system_faillock_unlock_time }}
  ansible.builtin.command: grep -q '^unlock_time = {{ system_faillock_unlock_time }}' /etc/security/faillock.conf
  changed_when: false
  become: true

- name: Check faillock even_deny_root is absent (default config)
  ansible.builtin.command: grep -q '^even_deny_root' /etc/security/faillock.conf
  register: verify_even_deny_root
  changed_when: false
  failed_when: verify_even_deny_root.rc == 0
  become: true
  when: not (system_faillock_even_deny_root | bool)

- name: Check pwquality minlen={{ system_pwquality_minlen }}
  ansible.builtin.command: >-
    grep -q '^minlen = {{ system_pwquality_minlen }}' /etc/security/pwquality.conf
  changed_when: false
  become: true

- name: Check pwquality credit and complexity parameters (CIS 5.3.3)
  ansible.builtin.command: grep -q '{{ item }}' /etc/security/pwquality.conf
  changed_when: false
  become: true
  loop:
    - '^dcredit = {{ system_pwquality_dcredit }}'
    - '^ucredit = {{ system_pwquality_ucredit }}'
    - '^lcredit = {{ system_pwquality_lcredit }}'
    - '^ocredit = {{ system_pwquality_ocredit }}'
    - "^difok = {{ system_pwquality_difok }}"
    - "^maxrepeat = {{ system_pwquality_maxrepeat }}"
    - '^enforce_for_root'

- name: Check pwhistory remember={{ system_pwhistory_remember }}
  ansible.builtin.command: >-
    grep -q '^remember = {{ system_pwhistory_remember }}' /etc/security/pwhistory.conf
  changed_when: false
  become: true

- name: Check pwhistory enforce_for_root is set (CIS 5.3.5)
  ansible.builtin.command: grep -q '^enforce_for_root' /etc/security/pwhistory.conf
  changed_when: false
  become: true

- name: Check authselect current profile is sssd
  ansible.builtin.command:
    cmd: authselect current --raw
  register: verify_authselect_current
  changed_when: false
  become: true

- name: Assert authselect profile is sssd
  ansible.builtin.assert:
    that: verify_authselect_current.stdout is search('^sssd\b')
    fail_msg: "authselect profile is not sssd — faillock/pwhistory features will not wire into PAM"

# --- login.defs policy assertions ---
- name: Check login.defs PASS_MAX_DAYS={{ system_pass_max_days }}
  ansible.builtin.command: grep -q '^PASS_MAX_DAYS\s\+{{ system_pass_max_days }}' /etc/login.defs
  changed_when: false
  become: true

- name: Check login.defs INACTIVE={{ system_inactive_days }}
  ansible.builtin.command: grep -q '^INACTIVE\s\+{{ system_inactive_days }}' /etc/login.defs
  changed_when: false
  become: true

- name: Check login.defs UMASK={{ system_umask }}
  ansible.builtin.command: grep -q '^UMASK\s\+{{ system_umask }}' /etc/login.defs
  changed_when: false
  become: true

- name: Check login.defs PASS_MIN_DAYS={{ system_pass_min_days }}
  ansible.builtin.command: grep -q '^PASS_MIN_DAYS\s\+{{ system_pass_min_days }}' /etc/login.defs
  changed_when: false
  become: true

- name: Check login.defs PASS_WARN_AGE={{ system_pass_warn_age }}
  ansible.builtin.command: grep -q '^PASS_WARN_AGE\s\+{{ system_pass_warn_age }}' /etc/login.defs
  changed_when: false
  become: true

- name: Check login.defs HOME_MODE=0750 (CIS 5.4.2)
  ansible.builtin.command: grep -q '^HOME_MODE\s\+0750' /etc/login.defs
  changed_when: false
  become: true

- name: Check login.defs ENCRYPT_METHOD=YESCRYPT (CIS 5.3.6)
  ansible.builtin.command: grep -q '^ENCRYPT_METHOD YESCRYPT' /etc/login.defs
  changed_when: false
  become: true

- name: Check login.defs YESCRYPT_COST_FACTOR=5 (CIS 5.4.1)
  ansible.builtin.command: grep -q '^YESCRYPT_COST_FACTOR 5' /etc/login.defs
  changed_when: false
  become: true

# --- auditd.conf coverage (deployed by system role on non-CSB Fedora/Rocky) ---
- name: Stat /etc/audit/auditd.conf
  ansible.builtin.stat:
    path: /etc/audit/auditd.conf
  register: verify_auditd_conf
  become: true

- name: Assert auditd.conf deployed with mode 0640
  ansible.builtin.assert:
    that:
      - verify_auditd_conf.stat.exists
      - verify_auditd_conf.stat.mode == '0640'
    fail_msg: "/etc/audit/auditd.conf missing or wrong mode — system role auditd deploy regression"

- name: Check auditd.conf max_log_file={{ system_auditd_max_log_file }}
  ansible.builtin.command: grep -q '^max_log_file = {{ system_auditd_max_log_file }}' /etc/audit/auditd.conf
  changed_when: false
  become: true

- name: Check auditd.conf log_format=ENRICHED (CIS 4.1.2.1)
  ansible.builtin.command: grep -q '^log_format = ENRICHED' /etc/audit/auditd.conf
  changed_when: false
  become: true

# golangci-lint coverage is provided by molecule/packages-binaries/verify.yml unconditionally.
# go_tools_installed is always false in all scenarios that include this file (fedora, rocky, vm),
# so assertions here would be dead code. See packages-binaries scenario for golangci-lint tests.
