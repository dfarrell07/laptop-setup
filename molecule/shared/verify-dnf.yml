---
# molecule/shared/verify-dnf.yml
# Assertions for dnf-based platforms (Fedora, Rocky Linux, VM).
# Include after verify-common.yml.

- name: Check zsh is installed
  ansible.builtin.command: zsh --version
  changed_when: false

- name: Check tmux is installed
  ansible.builtin.command: tmux -V
  changed_when: false

- name: Check jq is installed
  ansible.builtin.command: jq --version
  changed_when: false

- name: Check fzf is installed
  ansible.builtin.command: fzf --version
  changed_when: false

- name: Check ripgrep is installed
  ansible.builtin.command: rg --version
  changed_when: false

- name: Check bat is installed
  ansible.builtin.command: bat --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # not in Rocky 10 converge packages_cli subset

- name: Check fd-find is installed
  ansible.builtin.command: fd --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # no fd-find in EPEL 10

- name: Check shfmt is installed
  ansible.builtin.command: shfmt --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # not in EPEL 10

- name: Check go is installed
  ansible.builtin.command: go version
  changed_when: false
  # golang is in packages_languages on all dnf platforms including Rocky

- name: Check gcc is installed
  ansible.builtin.command: gcc --version
  changed_when: false

- name: Check clang is installed
  ansible.builtin.command: clang --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # not in Rocky 10 converge packages_languages subset

- name: Check python3 is installed
  ansible.builtin.command: python3 --version
  changed_when: false

- name: Check pip3 is installed
  ansible.builtin.command: pip3 --version
  changed_when: false

- name: Check direnv is installed
  ansible.builtin.command: direnv version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # not in Rocky 10 repos

- name: Check zoxide is installed
  ansible.builtin.command: zoxide --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # not in Rocky 10 repos

- name: Check gh is installed
  ansible.builtin.command: gh --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # not in Rocky 10 converge subset

- name: Check yq is installed
  ansible.builtin.command: yq --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # not in Rocky 10 converge subset

- name: Check kubectl binary presence
  ansible.builtin.stat:
    path: /usr/local/bin/kubectl
  register: verify_kubectl_bin

- name: Check kubectl client version when installed
  ansible.builtin.command: kubectl version --client
  changed_when: false
  when: verify_kubectl_bin.stat.exists

- name: Check kind binary presence
  ansible.builtin.stat:
    path: /usr/local/bin/kind
  register: verify_kind_bin

- name: Assert kind binary is executable when present
  ansible.builtin.assert:
    that: verify_kind_bin.stat.executable
    fail_msg: 'kind binary exists but is not executable'
  when: verify_kind_bin.stat.exists

- name: Check gpg is installed
  ansible.builtin.command: gpg --version
  changed_when: false

- name: Check openssl is installed
  ansible.builtin.command: openssl version
  changed_when: false

- name: Check ykman binary presence
  ansible.builtin.stat:
    path: /usr/bin/ykman
  register: verify_ykman_bin

- name: Check ykman version when installed
  ansible.builtin.command: ykman --version
  changed_when: false
  when: verify_ykman_bin.stat.exists

- name: Include containers.conf assertions
  ansible.builtin.include_tasks: verify-containers.yml
