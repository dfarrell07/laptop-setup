---
# molecule/shared/verify-dnf.yml
# Assertions for dnf-based platforms (Fedora, CentOS, VM).
# Include after verify-common.yml.

- name: Check zsh is installed
  ansible.builtin.command: zsh --version
  changed_when: false

- name: Check tmux is installed
  ansible.builtin.command: tmux -V
  changed_when: false

- name: Check jq is installed
  ansible.builtin.command: jq --version
  changed_when: false

- name: Check fzf is installed
  ansible.builtin.command: fzf --version
  changed_when: false

- name: Check ripgrep is installed
  ansible.builtin.command: rg --version
  changed_when: false

- name: Check fd-find is installed
  ansible.builtin.command: fd --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # no fd-find in EPEL 10

- name: Check shfmt is installed
  ansible.builtin.command: shfmt --version
  changed_when: false
  when: ansible_distribution != 'Rocky'  # not in EPEL 10

- name: Verify containers config directory
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/containers"
  register: verify_containers_dir

- name: Assert containers config directory exists
  ansible.builtin.assert:
    that:
      - verify_containers_dir.stat.exists
      - verify_containers_dir.stat.isdir
    fail_msg: "Containers config directory was not created"

- name: Verify containers.conf is deployed by containers role
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/containers/containers.conf"
  register: verify_containers_conf

- name: Assert containers.conf exists
  ansible.builtin.assert:
    that: verify_containers_conf.stat.exists
    fail_msg: "containers.conf was not deployed (log_driver and pids_limit needed for kind)"

- name: Assert containers.conf sets log_driver to k8s-file
  ansible.builtin.command:
    cmd: grep -q 'log_driver.*k8s-file' "{{ ansible_user_dir }}/.config/containers/containers.conf"
  changed_when: false

- name: Assert containers.conf sets pids_limit to 65536
  ansible.builtin.command:
    cmd: grep -q 'pids_limit = 65536' "{{ ansible_user_dir }}/.config/containers/containers.conf"
  changed_when: false
