---
# molecule/shared/verify-smoke.yml
# Runs scripts/smoke-test.sh --user-only on the provisioned molecule host so
# that smoke checks and inline verify assertions share CI coverage.
# --user-only skips root-requiring checks (the VM scenario runs smoke-test.sh --system-only as root separately).
# Include from each scenario's verify.yml after verify-common.yml.

- name: Run smoke-test.sh --user-only
  ansible.builtin.script:
    cmd: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/scripts/smoke-test.sh --json --user-only --profile {{ profile }}"
  environment:
    MOLECULE_PROJECT_DIRECTORY: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  register: smoke_result
  changed_when: false
  failed_when: false

- name: Assert smoke-test.sh produced output
  ansible.builtin.assert:
    that: smoke_result.stdout | length > 0
    fail_msg: 'smoke-test.sh produced no output (rc={{ smoke_result.rc }}, stderr={{ smoke_result.stderr }})'

- name: Show smoke-test.sh warns and results
  ansible.builtin.debug:
    msg: >-
      warns={{ (smoke_result.stdout | from_json).warns }}
      results={{ (smoke_result.stdout | from_json).results | rejectattr('status', 'equalto', 'PASS') | list }}

- name: Assert smoke-test.sh --user-only passed
  ansible.builtin.assert:
    that: smoke_result.rc == 0
    fail_msg: >-
      smoke-test.sh exited {{ smoke_result.rc }}:
      {{ (smoke_result.stdout | from_json).results | selectattr('status', 'equalto', 'FAIL') | list | to_nice_json }}

# --- USBGuard inline assertions ---
# Gated on usbguard_expected (set only by the VM scenario) and package presence,
# so they fire where the system role really installs usbguard and are skipped in
# scenarios where usbguard_expected is unset (systemd and USB are unavailable in containers).
- name: Check usbguard package presence (shared)
  ansible.builtin.command: rpm -q usbguard  # noqa: command-instead-of-module
  register: verify_usbguard_pkg_shared
  changed_when: false
  failed_when: false
  when: (ansible_pkg_mgr in ['dnf', 'dnf5', 'yum']) and (usbguard_expected | default(false))

- name: Assert usbguard package is installed
  ansible.builtin.assert:
    that: verify_usbguard_pkg_shared.rc == 0
    fail_msg: "usbguard package not installed — system role not exercised or package regression"
  when:
    - ansible_pkg_mgr in ['dnf', 'dnf5', 'yum']
    - usbguard_expected | default(false)

- name: Check ImplicitPolicyTarget=block in usbguard-daemon.conf (shared)
  ansible.builtin.command: grep -q '^ImplicitPolicyTarget=block' /etc/usbguard/usbguard-daemon.conf
  changed_when: false
  become: true
  when:
    - usbguard_expected | default(false)
    - ansible_pkg_mgr in ['dnf', 'dnf5', 'yum']
    - verify_usbguard_pkg_shared.rc == 0

- name: Check AuditBackend=LinuxAudit in usbguard-daemon.conf (shared)
  ansible.builtin.command: grep -q '^AuditBackend=LinuxAudit' /etc/usbguard/usbguard-daemon.conf
  changed_when: false
  become: true
  when:
    - usbguard_expected | default(false)
    - ansible_pkg_mgr in ['dnf', 'dnf5', 'yum']
    - verify_usbguard_pkg_shared.rc == 0

- name: Check IPCAllowedGroups=wheel in usbguard-daemon.conf (shared)
  ansible.builtin.command: grep -q 'IPCAllowedGroups=wheel' /etc/usbguard/usbguard-daemon.conf
  changed_when: false
  become: true
  when:
    - usbguard_expected | default(false)
    - ansible_pkg_mgr in ['dnf', 'dnf5', 'yum']
    - verify_usbguard_pkg_shared.rc == 0

- name: Check usbguard.service is enabled (active skipped — systemd mocked in containers)
  ansible.builtin.command: systemctl is-enabled usbguard.service  # noqa: command-instead-of-module
  register: verify_usbguard_svc_shared
  changed_when: false
  failed_when: false
  when:
    - usbguard_expected | default(false)
    - ansible_pkg_mgr in ['dnf', 'dnf5', 'yum']
    - verify_usbguard_pkg_shared.rc == 0

- name: Assert usbguard.service is enabled
  ansible.builtin.assert:
    that: verify_usbguard_svc_shared.rc == 0
    fail_msg: "usbguard.service is not enabled (systemctl is-enabled returned: '{{ verify_usbguard_svc_shared.stdout }}')"
  when:
    - usbguard_expected | default(false)
    - ansible_pkg_mgr in ['dnf', 'dnf5', 'yum']
    - verify_usbguard_pkg_shared.rc == 0

# --- sshd hardening inline assertions ---
# Gated on config file presence so these fire only when the system role deployed
# sshd hardening (the deploy task itself is gated on the sshd binary existing and not csb_rhel).
# Silently skipped where the drop-in does not exist (Debian CI: no openssh-server; Rocky: csb_rhel skips sshd hardening).
# systemctl is-enabled assertion intentionally omitted — systemd is mocked in
# Podman containers (see usbguard note above); service enablement is verified by
# the VM scenario which runs a full root smoke-test.
# verify_sshd_dropin must be registered by verify-common.yml before including this file
- name: sshd hardening assertions (Linux only)
  when: ansible_system == 'Linux'
  block:
    - name: Check AllowAgentForwarding matches system_ssh_allow_agent_forwarding in 00-hardening.conf (shared)
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: >-
          grep -qxF
          'AllowAgentForwarding {{ system_ssh_allow_agent_forwarding | default("no") }}'
          /etc/ssh/sshd_config.d/00-hardening.conf
      changed_when: false
      become: true
      when:
        - verify_sshd_dropin is not skipped
        - verify_sshd_dropin.stat.exists

    - name: Check AllowTcpForwarding matches system_ssh_allow_tcp_forwarding (shared)
      ansible.builtin.command: >-
        grep -qxF 'AllowTcpForwarding {{ system_ssh_allow_tcp_forwarding | default("local") }}'
        /etc/ssh/sshd_config.d/00-hardening.conf
      changed_when: false
      become: true
      when:
        - verify_sshd_dropin is not skipped
        - verify_sshd_dropin.stat.exists

    - name: Check sshd algorithm hardening directives present in 00-hardening.conf (shared)
      ansible.builtin.command: grep -qE '^{{ item }} ' /etc/ssh/sshd_config.d/00-hardening.conf  # noqa: command-instead-of-module
      loop:
        - 'Ciphers'
        - 'MACs'
        - 'KexAlgorithms'
      changed_when: false
      become: true
      when:
        - verify_sshd_dropin is not skipped
        - verify_sshd_dropin.stat.exists

    - name: Check UnusedConnectionTimeout on its own line (trim_blocks regression guard)
      ansible.builtin.command: >-
        grep -qP '^UnusedConnectionTimeout\s+\d+$'
        /etc/ssh/sshd_config.d/00-hardening.conf
      changed_when: false
      become: true
      register: verify_sshd_unused_timeout
      failed_when: false
      when:
        - verify_sshd_dropin is not skipped
        - verify_sshd_dropin.stat.exists
        - system_ssh_unused_connection_timeout | default('') | string != ''

    - name: Assert UnusedConnectionTimeout is not concatenated with next directive
      ansible.builtin.assert:
        that: verify_sshd_unused_timeout.rc == 0
        fail_msg: >-
          UnusedConnectionTimeout not found as a standalone line in 00-hardening.conf —
          possible Jinja2 trim_blocks newline-eating regression (two directives on one line)
      when:
        - verify_sshd_dropin is not skipped
        - verify_sshd_dropin.stat.exists
        - system_ssh_unused_connection_timeout | default('') | string != ''
        - verify_sshd_unused_timeout is defined

# --- Service masking inline assertions ---
# Gated on UnitFileState being non-empty so these are silently skipped when the
# unit is completely unknown to systemd (failed_when: false absorbs the module
# error; the when guard skips the assert when status.UnitFileState is absent).
# Effective only where the unit is installed and the role masks it (Fedora CI,
# VM); on Rocky (csb_rhel skips masking) and Debian (units not installed) the
# asserts skip. Not included by the container scenario; macOS includes it but the Linux gate skips it.
- name: Service masking assertions (Linux only)
  when: ansible_system == 'Linux'
  block:
    - name: Check service state (shared)
      ansible.builtin.systemd:
        name: "{{ item.name }}"
      register: verify_mask_shared
      become: true
      failed_when: false
      loop:
        - {name: cups-browsed, gate: "{{ system_disable_printing | default(false) }}"}
        - {name: avahi-daemon.service, gate: "{{ system_disable_avahi }}"}
        - {name: avahi-daemon.socket, gate: "{{ system_disable_avahi }}"}
        - {name: nfs-server.service, gate: "{{ system_mask_nfs_server }}"}
        - {name: rpcbind.service, gate: "{{ system_mask_nfs_server }}"}
        - {name: rpcbind.socket, gate: "{{ system_mask_nfs_server }}"}
        - {name: cockpit.service, gate: true}
        - {name: cockpit.socket, gate: true}
        # Skipped in container CI — systemd masking is unreliable in all Podman container
        # scenarios. The VM scenario (make test-vm) exercises the full masking path.
        - {name: ctrl-alt-del.target, gate: "{{ not (system_is_container | default(false)) }}"}
        - name: passim
          gate: true
          hint: " — port 27500 may be reachable from Tailscale peers via tailscale0 trusted zone"
      loop_control:
        label: "{{ item.name }}"
      when: item.gate | bool

    - name: Assert units masked (shared)
      ansible.builtin.assert:
        that: item.status.UnitFileState == 'masked'
        fail_msg: >-
          {{ item.item.name }} UnitFileState is '{{ item.status.UnitFileState }}', expected 'masked'{{ item.item.hint | default('') }}
      loop: "{{ verify_mask_shared.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - item is not skipped
        - item.status.UnitFileState | default('') != ''
