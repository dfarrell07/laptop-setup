---
# molecule/shared/verify-smoke.yml
# Runs scripts/smoke-test.sh --user-only on the provisioned molecule host so
# that smoke checks and inline verify assertions share CI coverage.
# --user-only skips root-requiring checks that container scenarios cannot satisfy.
# Include from each scenario's verify.yml after verify-common.yml.

- name: Run smoke-test.sh --user-only
  ansible.builtin.script:
    cmd: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/scripts/smoke-test.sh --json --user-only"
  environment:
    MOLECULE_PROJECT_DIRECTORY: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  register: smoke_result
  changed_when: false
  failed_when: false

- name: Assert smoke-test.sh produced output
  ansible.builtin.assert:
    that: smoke_result.stdout | length > 0
    fail_msg: 'smoke-test.sh produced no output (rc={{ smoke_result.rc }}, stderr={{ smoke_result.stderr }})'

- name: Show smoke-test.sh warns and results
  ansible.builtin.debug:
    msg: >-
      warns={{ smoke_result.stdout | from_json | json_query('warns') }}
      results={{ smoke_result.stdout | from_json | json_query("results[?status!='PASS']") }}
  when: smoke_result.stdout | length > 0

- name: Assert smoke-test.sh --user-only passed
  ansible.builtin.assert:
    that: smoke_result.rc == 0
    fail_msg: >-
      smoke-test.sh exited {{ smoke_result.rc }}:
      {{ smoke_result.stdout | from_json | json_query("results[?status=='FAIL']") | to_nice_json }}
  when: smoke_result.stdout | length > 0

# --- USBGuard inline assertions ---
# Gated on package presence so these fire in VM/bare-metal scenarios where the
# system role installs usbguard, and are skipped in container scenarios where
# the system role is not included in converge.
- name: Check usbguard package presence (shared)
  ansible.builtin.command: rpm -q usbguard  # noqa: command-instead-of-module
  register: verify_usbguard_pkg_shared
  changed_when: false
  failed_when: false
  when: ansible_pkg_mgr in ['dnf', 'dnf5', 'yum']

- name: Assert usbguard package is installed
  ansible.builtin.assert:
    that: verify_usbguard_pkg_shared.rc == 0
    fail_msg: "usbguard package not installed — system role not exercised or package regression"
  when:
    - ansible_pkg_mgr in ['dnf', 'dnf5', 'yum']
    - usbguard_expected | default(false)

- name: Stat /etc/usbguard/rules.conf (shared)
  ansible.builtin.stat:
    path: /etc/usbguard/rules.conf
  register: verify_usbguard_rules_shared
  become: true
  when:
    - usbguard_expected | default(false)
    - ansible_pkg_mgr in ['dnf', 'dnf5', 'yum']
    - verify_usbguard_pkg_shared.rc == 0

- name: Assert /etc/usbguard/rules.conf exists with mode 0600
  ansible.builtin.assert:
    that:
      - verify_usbguard_rules_shared.stat.exists
      - verify_usbguard_rules_shared.stat.mode == '0600'
    fail_msg: "/etc/usbguard/rules.conf missing or wrong permissions (expected 0600)"
  when:
    - usbguard_expected | default(false)
    - ansible_pkg_mgr in ['dnf', 'dnf5', 'yum']
    - verify_usbguard_pkg_shared.rc == 0

- name: Check ImplicitPolicyTarget=block in usbguard-daemon.conf (shared)
  ansible.builtin.command: grep -q 'ImplicitPolicyTarget=block' /etc/usbguard/usbguard-daemon.conf
  changed_when: false
  become: true
  when:
    - usbguard_expected | default(false)
    - ansible_pkg_mgr in ['dnf', 'dnf5', 'yum']
    - verify_usbguard_pkg_shared.rc == 0

- name: Check usbguard.service is enabled (active skipped — systemd mocked in containers)
  ansible.builtin.command: systemctl is-enabled usbguard.service  # noqa: command-instead-of-module
  register: verify_usbguard_svc_shared
  changed_when: false
  failed_when: false
  when:
    - usbguard_expected | default(false)
    - ansible_pkg_mgr in ['dnf', 'dnf5', 'yum']
    - verify_usbguard_pkg_shared.rc == 0

- name: Assert usbguard.service is enabled
  ansible.builtin.assert:
    that: verify_usbguard_svc_shared.rc == 0
    fail_msg: "usbguard.service is not enabled"
  when:
    - usbguard_expected | default(false)
    - ansible_pkg_mgr in ['dnf', 'dnf5', 'yum']
    - verify_usbguard_pkg_shared.rc == 0

# --- sshd hardening inline assertions ---
# Gated on config file presence so these fire only when the system role deployed
# sshd hardening (the deploy task itself is gated on sshd.service being defined).
# Silently skipped in container scenarios where sshd-server is not installed.
# systemctl is-enabled assertion intentionally omitted — systemd is mocked in
# Podman containers (see usbguard note above); service enablement is verified by
# the VM scenario which runs a full root smoke-test.
- name: sshd hardening assertions (Linux only)
  when: ansible_system == 'Linux'
  block:
    - name: Stat /etc/ssh/sshd_config.d/00-hardening.conf (shared)
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.d/00-hardening.conf
      register: sshd_conf_stat
      become: true

    - name: Assert /etc/ssh/sshd_config.d/00-hardening.conf exists with mode 0600
      ansible.builtin.assert:
        that: sshd_conf_stat.stat.exists and sshd_conf_stat.stat.mode == '0600'
        fail_msg: "/etc/ssh/sshd_config.d/00-hardening.conf missing or wrong permissions (expected 0600)"

    - name: Check AllowAgentForwarding no in 00-hardening.conf (shared)
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: grep -qF 'AllowAgentForwarding no' /etc/ssh/sshd_config.d/00-hardening.conf
      changed_when: false
      become: true
      when: sshd_conf_stat.stat.exists

    - name: Check AllowTcpForwarding set to valid value (shared)
      ansible.builtin.command: >-
        grep -qE '^AllowTcpForwarding (no|local|remote|all|yes)$'
        /etc/ssh/sshd_config.d/00-hardening.conf  # noqa: command-instead-of-module
      changed_when: false
      become: true
      when: sshd_conf_stat.stat.exists

    - name: Check sshd algorithm hardening directives present in 00-hardening.conf (shared)
      ansible.builtin.command: grep -qE '^{{ item }} ' /etc/ssh/sshd_config.d/00-hardening.conf  # noqa: command-instead-of-module
      loop:
        - 'Ciphers'
        - 'MACs'
        - 'KexAlgorithms'
      changed_when: false
      become: true
      when: sshd_conf_stat.stat.exists

    - name: Check UnusedConnectionTimeout on its own line (trim_blocks regression guard)
      ansible.builtin.command: >-
        grep -qP '^UnusedConnectionTimeout\s+\d+$'
        /etc/ssh/sshd_config.d/00-hardening.conf  # noqa: command-instead-of-module
      changed_when: false
      become: true
      register: verify_sshd_unused_timeout
      failed_when: false
      when:
        - sshd_conf_stat.stat.exists
        - system_ssh_unused_connection_timeout | default('') | string != ''

    - name: Assert UnusedConnectionTimeout is not concatenated with next directive
      ansible.builtin.assert:
        that: verify_sshd_unused_timeout.rc == 0
        fail_msg: >-
          UnusedConnectionTimeout not found as a standalone line in 00-hardening.conf —
          possible Jinja2 trim_blocks newline-eating regression (two directives on one line)
      when:
        - sshd_conf_stat.stat.exists
        - system_ssh_unused_connection_timeout | default('') | string != ''
        - verify_sshd_unused_timeout is defined

# --- Service masking inline assertions ---
# Gated on UnitFileState being non-empty so these are silently skipped when the
# unit is completely unknown to systemd (failed_when: false absorbs the module
# error; the when guard skips the assert when status.UnitFileState is absent).
# Fires in Fedora, Rocky, and Debian CI (all include this file and all run the
# system role in converge). Does not fire in the container scenario (its
# verify.yml does not include verify-smoke.yml) or on macOS (systemd absent).
- name: Service masking assertions (Linux only)
  when: ansible_system == 'Linux'
  block:
    - name: Check cups-browsed service state (shared)
      ansible.builtin.systemd:
        name: cups-browsed
      register: verify_cups_shared
      become: true
      failed_when: false

    - name: Assert cups-browsed is masked (shared)
      ansible.builtin.assert:
        that: verify_cups_shared.status.UnitFileState == 'masked'
        fail_msg: "cups-browsed is not masked"
      when: verify_cups_shared.status.UnitFileState | default('') != ''

    - name: Check avahi-daemon.service state (shared)
      ansible.builtin.systemd:
        name: avahi-daemon.service
      register: verify_avahi_service_shared
      become: true
      failed_when: false
      when: system_disable_avahi | bool

    - name: Assert avahi-daemon.service is masked (shared)
      ansible.builtin.assert:
        that: verify_avahi_service_shared.status.UnitFileState == 'masked'
        fail_msg: "avahi-daemon.service is not masked"
      when:
        - system_disable_avahi | bool
        - verify_avahi_service_shared.status.UnitFileState | default('') != ''

    - name: Check avahi-daemon.socket state (shared)
      ansible.builtin.systemd:
        name: avahi-daemon.socket
      register: verify_avahi_socket_shared
      become: true
      failed_when: false
      when: system_disable_avahi | bool

    - name: Assert avahi-daemon.socket is masked (shared)
      ansible.builtin.assert:
        that: verify_avahi_socket_shared.status.UnitFileState == 'masked'
        fail_msg: "avahi-daemon.socket is not masked"
      when:
        - system_disable_avahi | bool
        - verify_avahi_socket_shared.status.UnitFileState | default('') != ''

    - name: Check nfs-server.service state (shared)
      ansible.builtin.systemd:
        name: nfs-server.service
      register: verify_nfs_server_shared
      become: true
      failed_when: false

    - name: Assert nfs-server.service is masked (shared)
      ansible.builtin.assert:
        that: verify_nfs_server_shared.status.UnitFileState == 'masked'
        fail_msg: "nfs-server.service is not masked"
      when:
        - verify_nfs_server_shared.status.UnitFileState | default('') != ''
        - system_mask_nfs_server | bool

    - name: Check rpcbind.service state (shared)
      ansible.builtin.systemd:
        name: rpcbind.service
      register: verify_rpcbind_service_shared
      become: true
      failed_when: false

    - name: Assert rpcbind.service is masked (shared)
      ansible.builtin.assert:
        that: verify_rpcbind_service_shared.status.UnitFileState == 'masked'
        fail_msg: "rpcbind.service is not masked"
      when:
        - verify_rpcbind_service_shared.status.UnitFileState | default('') != ''
        - system_mask_nfs_server | bool

    - name: Check rpcbind.socket state (shared)
      ansible.builtin.systemd:
        name: rpcbind.socket
      register: verify_rpcbind_socket_shared
      become: true
      failed_when: false

    - name: Assert rpcbind.socket is masked (shared)
      ansible.builtin.assert:
        that: verify_rpcbind_socket_shared.status.UnitFileState == 'masked'
        fail_msg: "rpcbind.socket is not masked"
      when:
        - verify_rpcbind_socket_shared.status.UnitFileState | default('') != ''
        - system_mask_nfs_server | bool

    - name: Check cockpit.service state (shared)
      ansible.builtin.systemd:
        name: cockpit.service
      register: verify_cockpit_service_shared
      become: true
      failed_when: false

    - name: Assert cockpit.service is masked (shared)
      ansible.builtin.assert:
        that: verify_cockpit_service_shared.status.UnitFileState == 'masked'
        fail_msg: "cockpit.service is not masked"
      when: verify_cockpit_service_shared.status.UnitFileState | default('') != ''

    - name: Check cockpit.socket state (shared)
      ansible.builtin.systemd:
        name: cockpit.socket
      register: verify_cockpit_socket_shared
      become: true
      failed_when: false

    - name: Assert cockpit.socket is masked (shared)
      ansible.builtin.assert:
        that: verify_cockpit_socket_shared.status.UnitFileState == 'masked'
        fail_msg: "cockpit.socket is not masked"
      when: verify_cockpit_socket_shared.status.UnitFileState | default('') != ''

    - name: Check ctrl-alt-del.target state (shared)
      ansible.builtin.systemd:
        name: ctrl-alt-del.target
      register: verify_cad_shared
      become: true
      failed_when: false

    - name: Assert ctrl-alt-del.target is masked (shared)
      ansible.builtin.assert:
        that: verify_cad_shared.status.UnitFileState == 'masked'
        fail_msg: "ctrl-alt-del.target is not masked"
      when: verify_cad_shared.status.UnitFileState | default('') != ''

    - name: Check passim service state (shared)
      ansible.builtin.systemd:
        name: passim
      register: verify_passim_shared
      become: true
      failed_when: false

    - name: Assert passim is masked (shared)
      ansible.builtin.assert:
        that: verify_passim_shared.status.UnitFileState == 'masked'
        fail_msg: "passim is not masked — port 27500 may be reachable from Tailscale peers via tailscale0 trusted zone"
      when: verify_passim_shared.status.UnitFileState | default('') != ''
