---
- name: Converge (Rocky Linux 10)
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Load configuration
      ansible.builtin.include_vars: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/default.config.yml"

    - name: Override for container testing
      ansible.builtin.set_fact:
        profile: work
        # Subset of packages_cli — direnv, zoxide, shfmt, procps-ng, fd-find not in Rocky 10 repos
        # (fd-find has no EPEL 10 package; ripgrep IS in EPEL 10 and is included below)
        packages_cli:
          - git
          - make
          - curl
          - tree
          - htop
          - tmux
          - mosh
          - jq
          - nmap
          - vim
          - zsh
          - fzf
          - socat
          - pipx
          - ShellCheck
          - ripgrep
        packages_languages:
          - golang
          - python3
          - python3-pip
          - gcc
          - gcc-c++
        packages_security: []
        packages_containers: []
        packages_networking: []
        packages_install_binaries: false
        install_virtualization: false
        ssh_git_signing_pubkey: "sk-ssh-ed25519 AAAAIMoleculeTestKeyForCI molecule-test@ci"

  roles:
    - role: common
    - role: packages
    - role: dotfiles
    - role: ssh
    - role: git_repos
    - role: notes
      vars:
        notes_transcrypt_password: ""
    - role: redhat
    - role: containers
    - role: desktop
      vars:
        desktop_environment: 'unknown'
        desktop_common_packages: []
        desktop_sway_packages: []
        desktop_i3_packages: []
    - role: claude
      vars:
        claude_install_method: skip
