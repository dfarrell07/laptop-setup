---
- name: Verify — packages binary installs
  hosts: all
  gather_facts: true

  tasks:
    # --- /usr/local/bin binaries ---

    - name: Stat /usr/local/bin/kind
      ansible.builtin.stat:
        path: /usr/local/bin/kind
      register: verify_kind

    - name: Assert kind exists and is executable
      ansible.builtin.assert:
        that:
          - verify_kind.stat.exists
          - verify_kind.stat.executable
        fail_msg: "/usr/local/bin/kind missing or not executable — packages_install_binaries=true regression"

    - name: Stat /usr/local/bin/helm
      ansible.builtin.stat:
        path: /usr/local/bin/helm
      register: verify_helm

    - name: Assert helm exists and is executable
      ansible.builtin.assert:
        that:
          - verify_helm.stat.exists
          - verify_helm.stat.executable
        fail_msg: "/usr/local/bin/helm missing or not executable — packages_install_binaries=true regression"

    - name: Stat /usr/local/bin/kustomize
      ansible.builtin.stat:
        path: /usr/local/bin/kustomize
      register: verify_kustomize

    - name: Assert kustomize exists and is executable
      ansible.builtin.assert:
        that:
          - verify_kustomize.stat.exists
          - verify_kustomize.stat.executable
        fail_msg: "/usr/local/bin/kustomize missing or not executable — packages_install_binaries=true regression"

    - name: Stat /usr/local/bin/transcrypt
      ansible.builtin.stat:
        path: /usr/local/bin/transcrypt
      register: verify_transcrypt

    - name: Assert transcrypt exists and is executable
