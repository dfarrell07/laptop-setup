    - name: Stat /usr/local/bin/k9s
      ansible.builtin.stat:
        path: /usr/local/bin/k9s
      register: verify_k9s

    - name: Assert k9s exists and is executable
      ansible.builtin.assert:
        that:
          - verify_k9s.stat.exists
          - verify_k9s.stat.executable
        fail_msg: "/usr/local/bin/k9s missing or not executable — packages_install_binaries=true regression"

    - name: Stat /usr/local/bin/sops
