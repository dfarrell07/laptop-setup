---
- name: Converge (macOS)
  hosts: all
  gather_facts: true
  become: false

  pre_tasks:
    - name: Load CI pre-tasks (config, group_vars, project root)
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/ci-pre-tasks.yml"

    - name: Override profile
      ansible.builtin.set_fact:
        profile: personal
        ssh_signing_key_pub: "sk-ssh-ed25519 AAAAIMoleculeTestKeyForCI molecule-test@ci"
        ssh_git_signing_pubkey: "sk-ssh-ed25519 AAAAIMoleculeTestKeyForCI molecule-test@ci"
        desktop_environment: aerospace
        notes_enabled: true

    - name: Compute OS detection facts (mirrors csb_detect.yml — not called in macOS converge)
      # group_vars/all/vars.yml sets is_macos: false / is_linux: false as static defaults.
      # csb_detect.yml (which overrides these via set_fact) is only called from site.yml Play 1
      # pre_tasks and is gated by a Linux-only guard, so it never runs on macOS. Without this
      # block every when: is_macos guard in packages/dotfiles/desktop/claude is skipped and
      # every when: is_linux guard runs on macOS incorrectly. Pattern mirrors
      # system-container-overrides.yml lines 18-19.
      ansible.builtin.set_fact:
        is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"
        is_linux: "{{ ansible_facts['system'] == 'Linux' }}"

    - name: Create mock notes repo structure for CI
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/ci-mock-notes.yml"

  roles:
    - role: common
    - role: packages
    - role: dotfiles
    - role: ssh
    - role: git_repos
    - role: notes
      vars:
        notes_transcrypt_password: ""
    - role: containers
    - role: desktop
    - role: claude
      vars:
        claude_install_method: skip

  post_tasks:
    - name: Generate CSB compatibility report
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/common/tasks/csb-report.yml"
      tags: [always]
