---
- name: Verify (macOS)
  hosts: all
  gather_facts: true

  tasks:
    # --- Shared assertions (all platforms) ---
    - name: Include common verify assertions
      ansible.builtin.include_tasks: ../shared/verify-common.yml

    - name: Include smoke-test verification
      ansible.builtin.include_tasks: ../shared/verify-smoke.yml

    # --- macOS-specific ---
    - name: Check tmux is installed
      ansible.builtin.command: tmux -V
      changed_when: false

    - name: Check jq is installed
      ansible.builtin.command: jq --version
      changed_when: false

    - name: Check fzf is installed
      ansible.builtin.command: fzf --version
      changed_when: false

    - name: Check direnv is installed
      ansible.builtin.command: direnv version
      changed_when: false

    - name: Check zoxide is installed
      ansible.builtin.command: zoxide --version
      changed_when: false

    - name: Check gh CLI is installed
      ansible.builtin.command: gh --version
      changed_when: false

    - name: Check go is installed
      ansible.builtin.command: go version
      changed_when: false

    - name: Check shellcheck is installed
      ansible.builtin.command: shellcheck --version
      changed_when: false

    - name: Check shfmt is installed
      ansible.builtin.command: shfmt --version
      changed_when: false

    - name: Check ripgrep is installed
      ansible.builtin.command: rg --version
      changed_when: false

    - name: Check fd is installed
      ansible.builtin.command: fd --version
      changed_when: false

    - name: Check nmap is installed
      ansible.builtin.command: nmap --version
      changed_when: false

    - name: Verify SSH sockets directory exists (macOS ControlPath)
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.ssh/sockets"
      register: verify_ssh_sockets

    - name: Assert SSH sockets directory exists
      ansible.builtin.assert:
        that:
          - verify_ssh_sockets.stat.exists
          - verify_ssh_sockets.stat.isdir
        fail_msg: "SSH sockets directory missing for macOS ControlPath"

    # --- Notes role (private repo, clone expected to fail gracefully in CI) ---
    - name: Check notes repo directory
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/notes/.git"
      register: verify_notes

    - name: Assert notes .git/config has 0600 when repo exists
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/notes/.git/config"
      register: verify_notes_config
      when: verify_notes.stat.exists

    - name: Verify notes .git/config permissions
      ansible.builtin.assert:
        that: verify_notes_config.stat.mode == '0600'
        fail_msg: "notes .git/config should be 0600"
      when: verify_notes.stat.exists and verify_notes_config.stat.exists

    - name: Stat notes directory for permission check
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/notes"
      register: verify_notes_dir
      when: verify_notes.stat.exists

    - name: Assert notes directory is mode 0700
      ansible.builtin.assert:
        that: verify_notes_dir.stat.mode == '0700'
        fail_msg: "notes/ should be 0700 — world-readable notes regression"
      when: verify_notes.stat.exists

    # --- Desktop role (macOS) ---
    - name: Verify AeroSpace config deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/aerospace/aerospace.toml"
      register: verify_aerospace

    - name: Assert AeroSpace config exists
      ansible.builtin.assert:
        that: verify_aerospace.stat.exists
        fail_msg: "AeroSpace config not deployed"

    - name: Verify Alacritty config deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/alacritty/alacritty.toml"
      register: verify_alacritty_macos

    - name: Assert Alacritty config exists
      ansible.builtin.assert:
        that: verify_alacritty_macos.stat.exists
        fail_msg: "Alacritty config not deployed on macOS"

    # --- launchd services (macOS) ---
    - name: Verify SSH agent launchd plist deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/Library/LaunchAgents/com.{{ dotfiles_github_user }}.ssh-agent.plist"
      register: verify_ssh_plist

    - name: Assert SSH agent plist exists
      ansible.builtin.assert:
        that: verify_ssh_plist.stat.exists
        fail_msg: "SSH agent launchd plist not deployed"

    # --- brew autoupdate (packages role) ---
    - name: Assert brew autoupdate formula is installed
      ansible.builtin.command: brew list autoupdate
      changed_when: false
