---
driver:
  name: podman

platforms:
  - name: container-offline-test
    # Same image as the container scenario.
    image: docker.io/geerlingguy/docker-fedora44-ansible@sha256:b70d7a765534f029de11a61524560541bca409662032573a04703bf419328a99
    pre_build_image: true
    privileged: true
    extra_opts: ["--cgroupns=host"]
    command: /usr/sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  env:
    ANSIBLE_VAULT_PASSWORD_FILE: ${MOLECULE_PROJECT_DIRECTORY}/scripts/vault-pass-ci.sh
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/collections:~/.ansible/collections:/usr/share/ansible/collections
  config_options:
    defaults:
      vault_password_file: ${MOLECULE_PROJECT_DIRECTORY}/scripts/vault-pass-ci.sh
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
      collections_path: ${MOLECULE_PROJECT_DIRECTORY}/collections:~/.ansible/collections:/usr/share/ansible/collections
      gathering: smart

verifier:
  name: ansible

scenario:
  # Idempotence is intentionally excluded: the oc download block always runs
  # (no stub satisfies container_oc_check) and always fails (invalid version),
  # so the rescue debug fires on every converge run — not an idempotence violation.
  test_sequence:
    - dependency
    - create
    - converge
    - verify
    - destroy
