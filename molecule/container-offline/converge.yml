---
# Converge: exercise the rescue/degradation path in roles/distrobox/tasks/container-provision.yml.
# No stubs are placed (prepare.yml only gathers facts to let systemd settle), so
# the oc download block executes for real.
# distrobox_oc_version is set to an invalid value that produces a 404 on
# mirror.openshift.com, triggering the rescue block.  distrobox_oc_fetch_retries: 1
# and distrobox_oc_fetch_timeout: 5 make the failure fast (two attempts, 5 s cap each).
# The golangci-lint go install also runs (creates: guard not satisfied) and fails
# gracefully via failed_when: false — failure mode is go binary absent (command not
# found), not network unavailability.
# This scenario confirms that both download-path failures degrade gracefully and that
# the surrounding task logic (flatpak-spawn wrapper creation) is unaffected.
- name: Converge (container provisioning — offline rescue path)
  hosts: all
  become: false
  gather_facts: false

  vars:
    # dnf post-install scriptlets call systemctl daemon-reload → D-Bus → crashes PID 1 in
    # the privileged systemd container; guard is `when: not system_is_container` on the
    # dnf task. Package installation is tested by fedora/rocky/debian molecule scenarios.
    system_is_container: true

  pre_tasks:
    - name: Gather minimal facts
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/gather-minimal-facts.yml"

    - name: Load shared offline scenario vars
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/offline-vars.yml"

  tasks:
    - name: Run container provisioning tasks (rescue path)
      ansible.builtin.include_tasks:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/roles/distrobox/tasks/container-provision.yml"
