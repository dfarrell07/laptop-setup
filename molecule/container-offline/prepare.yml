---
# Prepare: gather_facts forces Ansible to wait for the connection and for
# systemd PID 1 to finish initializing before converge starts, so converge does not
# race the container's boot (an early systemctl daemon-reload during boot can crash
# PID 1 and lose the container: UNREACHABLE: Container not found).
# It also removes a stale /tmp/oc_rescue_fired so verify cannot pass on a previous run's sentinel.
- name: Prepare (container-offline — wait for systemd)
  hosts: all
  gather_facts: true

  tasks:
    - name: Remove stale rescue sentinel from a previous run
      ansible.builtin.file:
        path: /tmp/oc_rescue_fired
        state: absent
