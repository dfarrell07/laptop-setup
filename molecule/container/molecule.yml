---
driver:
  name: podman

platforms:
  - name: container-test
    # To update digest: podman pull docker.io/geerlingguy/docker-fedora44-ansible:latest
    # then: podman inspect --format='{{.Digest}}' docker.io/geerlingguy/docker-fedora44-ansible:latest
    image: docker.io/geerlingguy/docker-fedora44-ansible@sha256:7bb5ba26ba43113b22313ec6e1c4e77a0b8da11e37973dc216d9f42410228101
    pre_build_image: true
    privileged: true
    extra_opts: ["--cgroupns=host"]
    command: /usr/sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  env:
    ANSIBLE_VAULT_PASSWORD_FILE: ${MOLECULE_PROJECT_DIRECTORY}/scripts/vault-pass-ci.sh
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/collections:~/.ansible/collections:/usr/share/ansible/collections
  config_options:
    defaults:
      vault_password_file: ${MOLECULE_PROJECT_DIRECTORY}/scripts/vault-pass-ci.sh
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
      collections_path: ${MOLECULE_PROJECT_DIRECTORY}/collections:~/.ansible/collections:/usr/share/ansible/collections
      gathering: smart

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    # Idempotence excluded: dnf install runs twice and dominates runtime;
    # provisioning logic is tested by converge+verify.
    - verify
    - destroy
