---
- name: Verify (container provisioning)
  hosts: all
  gather_facts: true

  tasks:
    - name: Verify oc stub is present at /usr/local/bin/oc
      ansible.builtin.stat:
        path: /usr/local/bin/oc
      register: verify_oc

    - name: Assert oc present and executable
      ansible.builtin.assert:
        that:
          - verify_oc.stat.exists
          - verify_oc.stat.mode == '0755'
        fail_msg: "/usr/local/bin/oc missing or wrong permissions after converge"

    - name: Run oc version to confirm stub is functional
      ansible.builtin.command:
        cmd: /usr/local/bin/oc version --client
      register: verify_oc_version
      changed_when: false

    - name: Assert oc stub outputs expected version string
      ansible.builtin.assert:
        that: "'stub' in verify_oc_version.stdout"
        fail_msg: "oc version output unexpected: {{ verify_oc_version.stdout }}"

    - name: Verify kubectl is present at /usr/local/bin/kubectl
      ansible.builtin.stat:
        path: /usr/local/bin/kubectl
      register: verify_kubectl

    - name: Assert kubectl present and executable
      ansible.builtin.assert:
        that:
          - verify_kubectl.stat.exists
          - verify_kubectl.stat.mode == '0755'
        fail_msg: "/usr/local/bin/kubectl missing or wrong permissions after converge"

    - name: Verify distrobox-host-exec symlink created for podman
      ansible.builtin.stat:
        path: /usr/local/bin/podman
        follow: false
      register: verify_podman_symlink

    - name: Assert podman is a symlink to distrobox-host-exec
      ansible.builtin.assert:
        that:
          - verify_podman_symlink.stat.exists
          - verify_podman_symlink.stat.islnk
          - verify_podman_symlink.stat.lnk_target == '/usr/bin/distrobox-host-exec'
        fail_msg: "/usr/local/bin/podman is not a symlink to /usr/bin/distrobox-host-exec"

    - name: Check git is installed
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: git --version
      changed_when: false

    - name: Check vim is installed
      ansible.builtin.command:
        cmd: vim --version
      changed_when: false

    - name: Check curl is installed
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: curl --version
      changed_when: false

    - name: Verify golangci-lint stub present (go install was skipped)
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/go/bin/golangci-lint"
      register: verify_golangci

    - name: Assert golangci-lint stub present and executable
      ansible.builtin.assert:
        that:
          - verify_golangci.stat.exists
          - verify_golangci.stat.mode == '0755'
        fail_msg: "golangci-lint binary missing or wrong permissions — go install may have failed or creates: guard broke"

    - name: Stat subctl binary (go install in container-provision-tasks.yml)
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/go/bin/subctl"
      register: verify_container_subctl

    - name: Assert subctl binary present and executable
      ansible.builtin.assert:
        that:
          - verify_container_subctl.stat.exists
          - verify_container_subctl.stat.mode == '0755'
        fail_msg: "subctl binary missing — go install may have failed silently in container provisioning"

    - name: Stat oc exported to host at ~/.local/bin/oc
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.local/bin/oc"
      register: verify_oc_exported

    - name: Assert oc exported to host by distrobox-export
      ansible.builtin.assert:
        that: verify_oc_exported.stat.exists
        fail_msg: "~/.local/bin/oc not present — distrobox-export step may have failed"

    - name: Stat golangci-lint exported to host at ~/.local/bin/golangci-lint
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.local/bin/golangci-lint"
      register: verify_golangci_exported

    - name: Assert golangci-lint exported to host by distrobox-export
      ansible.builtin.assert:
        that: verify_golangci_exported.stat.exists
        fail_msg: "~/.local/bin/golangci-lint not present — distrobox-export step may have failed"

    - name: Stat kubectl exported to host at ~/.local/bin/kubectl
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.local/bin/kubectl"
      register: verify_kubectl_exported

    - name: Assert kubectl exported to host by distrobox-export
      ansible.builtin.assert:
        that: verify_kubectl_exported.stat.exists
        fail_msg: "~/.local/bin/kubectl not present — distrobox-export step may have failed"
