---
# Prepare: stub out binaries that require internet downloads so converge stays
# fast and deterministic. The stubs satisfy the 'creates:' and rc-check guards
# in container-provision-tasks.yml, letting the surrounding task logic execute
# without hitting mirror.openshift.com or pkg.go.dev.
- name: Prepare (container provisioning)
  hosts: all
  gather_facts: true

  tasks:
    - name: Create stub oc binary (bypasses OCP client download in converge)
      ansible.builtin.copy:
        dest: /usr/local/bin/oc
        content: |
          #!/bin/sh
          # Molecule stub — satisfies container_oc_check rc=0 so the download block is skipped.
          # Version must match distrobox_oc_version in converge.yml (currently 4.22.7).
          echo "Client Version: 4.22.7 (molecule-stub)"
          exit 0
        mode: "0755"
      become: true

    - name: Create stub kubectl binary (bypasses OCP client download in converge)
      ansible.builtin.copy:
        dest: /usr/local/bin/kubectl
        content: |
          #!/bin/sh
          # Molecule stub — satisfies verify assertion so the download block is skipped.
          echo "Client Version: stub-4.22.6 (molecule test)"
          exit 0
        mode: "0755"
      become: true

    - name: Ensure go bin directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/go/bin"
        state: directory
        mode: "0755"

    - name: Create stub golangci-lint binary (satisfies version-string guard in converge)
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/go/bin/golangci-lint"
        content: |
          #!/bin/sh
          # Molecule stub — satisfies the version-string guard so go install is skipped.
          echo "golangci-lint version v2.12.2"
          exit 0
        mode: "0755"

    - name: Create stub subctl binary (satisfies version-string guard in converge)
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/go/bin/subctl"
        content: |
          #!/bin/sh
          # Molecule stub — satisfies the version-string guard so go install is skipped.
          echo "subctl version v0.24.0"
          exit 0
        mode: "0755"

    - name: Create stub distrobox-host-exec (exercises symlink branch in converge)
      ansible.builtin.copy:
        dest: /usr/bin/distrobox-host-exec
        content: |
          #!/bin/sh
          # Molecule stub — simulates real distrobox-host-exec so the symlink branch runs.
          exec "$@"
        mode: "0755"
      become: true

    - name: Create stub distrobox-export (satisfies export task and downstream assert)
      ansible.builtin.copy:
        dest: /usr/bin/distrobox-export
        content: |
          #!/bin/sh
          # Molecule stub
          BIN=""
          DST=""
          while [ $# -gt 0 ]; do
            case "$1" in
              --bin) BIN="$2"; shift 2 ;;
              --export-path) DST="$2"; shift 2 ;;
              *) shift ;;
            esac
          done
          mkdir -p "$DST" && cp "$BIN" "$DST/$(basename "$BIN")" 2>/dev/null || true
          exit 0
        mode: "0755"
      become: true
