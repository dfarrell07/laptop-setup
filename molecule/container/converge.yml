---
# Converge: exercise all 206 lines of container-provision-tasks.yml.
# Running inside the geerlingguy Fedora 44 container (no real distrobox):
#   - distrobox-host-exec stub present (from prepare) → symlink path executes
#     (not flatpak-spawn); flatpak-spawn path is covered by the
#     container-offline scenario.
#   - oc stub present (from prepare) → download block skipped.
#   - golangci-lint stub present (from prepare) → go install skipped.
#   - distrobox-export stub present (from prepare) → export task succeeds and
#     ~/.local/bin/oc is asserted by container-provision-tasks.yml.
- name: Converge (container provisioning)
  hosts: all
  become: false
  gather_facts: false

  pre_tasks:
    - name: Gather minimal facts
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/gather-minimal-facts.yml"

  vars:
    # Minimal package set — keeps the test fast; packages role is tested elsewhere.
    distrobox_packages:
      - git
      - vim
      - curl
    # Single command to exercise the flatpak-spawn wrapper creation path.
    distrobox_host_exec_commands:
      - podman
    distrobox_oc_version: "4.22.7"  # keep in sync with packages_oc_version in roles/packages/defaults/main.yml
    distrobox_golangci_lint_version: "v2.12.2"
    distrobox_subctl_version: "v0.24.0"

  tasks:
    - name: Run container provisioning tasks
      ansible.builtin.include_tasks:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/common/tasks/container-provision-tasks.yml"
