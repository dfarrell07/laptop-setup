---
- name: Verify (Debian/ChromeOS Crostini)
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Load configuration
      ansible.builtin.include_vars: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/default.config.yml"

    - name: Override profile and identity vars to match converge
      ansible.builtin.set_fact:
        profile: personal
        dotfiles_user_email_personal: "molecule-test@ci.invalid"  # matches converge set_fact; default.config.yml has 'CHANGE_ME'

  tasks:
    # --- Shared assertions (all platforms) ---
    - name: Include common verify assertions
      ansible.builtin.import_tasks: ../shared/verify-common.yml

    - name: Include smoke-test verification
      ansible.builtin.import_tasks: ../shared/verify-smoke.yml

    - name: Include NetworkManager conf.d assertions
      ansible.builtin.import_tasks: ../shared/verify-nm.yml

    # --- Packages (apt) ---
    - name: Check vim is installed
      ansible.builtin.command: vim --version
      changed_when: false

    - name: Check neovim is installed
      ansible.builtin.command: nvim --version
      changed_when: false

    - name: Check curl is installed
      ansible.builtin.command: which curl
      changed_when: false

    - name: Check tmux is installed
      ansible.builtin.command: tmux -V
      changed_when: false

    - name: Check zsh is installed
      ansible.builtin.command: zsh --version
      changed_when: false

    - name: Check jq is installed
      ansible.builtin.command: jq --version
      changed_when: false

    - name: Check fzf is installed
      ansible.builtin.command: fzf --version
      changed_when: false

    - name: Check ripgrep is installed
      ansible.builtin.command: rg --version
      changed_when: false

    - name: Check bat is installed (Debian package installs as batcat)
      ansible.builtin.command: batcat --version
      changed_when: false

    - name: Check fd-find is installed (Debian binary is fdfind, not fd)
      ansible.builtin.command: fdfind --version
      changed_when: false

    - name: Check shfmt is installed
      ansible.builtin.command: shfmt --version
      changed_when: false

    - name: Check shellcheck is installed
      ansible.builtin.command: shellcheck --version
      changed_when: false

    - name: Check go is installed
      ansible.builtin.command: go version
      changed_when: false

    - name: Check direnv is installed
      ansible.builtin.command: direnv version
      changed_when: false

    - name: Check zoxide is installed
      ansible.builtin.command: zoxide --version
      changed_when: false

    - name: Check dig is installed (dnsutils)
      ansible.builtin.command: which dig
      changed_when: false

    - name: Check nmap is installed
      ansible.builtin.command: which nmap
      changed_when: false

    - name: Check gpg is installed (gnupg)
      ansible.builtin.command: gpg --version
      changed_when: false

    - name: Check pip3 is installed (python3-pip)
      ansible.builtin.command: pip3 --version
      changed_when: false

    - name: Check tree is installed
      ansible.builtin.command: tree --version
      changed_when: false

    # wl-clipboard moved to desktop_apt_packages (Wayland-only; not installed in headless CI)

    # --- git_repos role: verify a public HTTPS repo was actually cloned ---
    - name: Verify public HTTPS repo was cloned to ~/src/ by git_repos role
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/src/ci-test/laptop-setup/.git"
      register: verify_git_repos_clone

    - name: Assert git_repos clone ran successfully
      ansible.builtin.assert:
        that:
          - verify_git_repos_clone.stat.exists
          - verify_git_repos_clone.stat.isdir
        fail_msg: >-
          git_repos clone task did not create ~/src/ci-test/laptop-setup/.git —
          clone task logic regression or git_repos_list filtering broken

    # --- Notes role ---
    - name: Verify notes role
      ansible.builtin.import_tasks: ../shared/verify-notes.yml

    # --- Desktop role ---
    - name: Include Alacritty and Chrome policy assertions
      ansible.builtin.import_tasks: ../shared/verify-desktop-common.yml

    # --- Containers ---
    - name: Include containers.conf assertions
      ansible.builtin.import_tasks: ../shared/verify-containers.yml

    # --- PAM faillock (Debian) ---
    - name: Check pam_faillock.so preauth line in common-auth (Debian)
      ansible.builtin.command:
        cmd: grep -qE '^auth\s+required\s+pam_faillock\.so\s+preauth' /etc/pam.d/common-auth
      changed_when: false
      become: true
      when: ansible_pkg_mgr == 'apt'

    - name: Check pam_faillock.so authfail line in common-auth (Debian)
      ansible.builtin.command:
        cmd: grep -qE '^auth\s+\[default=die\]\s+pam_faillock\.so\s+authfail' /etc/pam.d/common-auth
      changed_when: false
      become: true
      when: ansible_pkg_mgr == 'apt'

    - name: Check pam_faillock.so account line in common-account (Debian)
      ansible.builtin.command:
        cmd: grep -qE '^account\s+required\s+pam_faillock\.so$' /etc/pam.d/common-account
      changed_when: false
      become: true
      when: ansible_pkg_mgr == 'apt'

    - name: Check faillock.conf deny = 5 (Debian)
      ansible.builtin.command:
        cmd: grep -q '^deny = 5' /etc/security/faillock.conf
      changed_when: false
      when: ansible_pkg_mgr == 'apt'

    - name: Check pam_pwhistory.so line in common-password (Debian)
      ansible.builtin.command:
        cmd: grep -qE '^password\s+required\s+pam_pwhistory\.so.*remember=[0-9]+' /etc/pam.d/common-password
      changed_when: false
      become: true
      when: ansible_pkg_mgr == 'apt'

    - name: Check git user.email is personal email
      ansible.builtin.command: git config --global user.email  # noqa: command-instead-of-module
      register: verify_git_email_personal
      changed_when: false

    - name: Assert git email is personal profile
      ansible.builtin.assert:
        that: "dotfiles_user_email_personal in verify_git_email_personal.stdout"
        fail_msg: "git user.email is not set to the personal address — profile conditional regression in gitconfig.j2?"

    # --- Claude role: safe.directory security hardening (regression guard for bash executor fix) ---
    # The claude role removes wildcard safe.directory entries via a bash-only shell task.
    # On Debian/dash, the task silently no-ops without executable: /bin/bash — this assertion
    # catches that regression before it reaches production.
    - name: Get global safe.directory entries
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: git config --global --get-all safe.directory
      register: verify_safe_directory
      changed_when: false
      failed_when: false

    - name: Assert no wildcard safe.directory entries exist
      ansible.builtin.assert:
        that: >-
          verify_safe_directory.stdout_lines | default([])
          | select('match', r'^\*{1,2}$|^/$')
          | list | length == 0
        fail_msg: >-
          safe.directory contains a wildcard entry — claude role bash executor regression?
          (shell task requires executable: /bin/bash for set -o pipefail + [[ ]] on Debian/dash)
