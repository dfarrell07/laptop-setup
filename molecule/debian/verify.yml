---
- name: Verify (Debian/ChromeOS Crostini)
  hosts: all
  gather_facts: true

  tasks:
    # --- Shared assertions (all platforms) ---
    - name: Include common verify assertions
      ansible.builtin.include_tasks: ../shared/verify-common.yml

    # --- Packages (apt) ---
    - name: Check vim is installed
      ansible.builtin.command: vim --version
      changed_when: false

    - name: Check curl is installed
      ansible.builtin.command: which curl
      changed_when: false

    - name: Check tmux is installed
      ansible.builtin.command: tmux -V
      changed_when: false

    - name: Check zsh is installed
      ansible.builtin.command: zsh --version
      changed_when: false

    - name: Check jq is installed
      ansible.builtin.command: jq --version
      changed_when: false

    - name: Check fzf is installed
      ansible.builtin.command: fzf --version
      changed_when: false

    - name: Check ripgrep is installed
      ansible.builtin.command: rg --version
      changed_when: false

    - name: Check fd-find is installed (Debian binary is fdfind, not fd)
      ansible.builtin.command: fdfind --version
      changed_when: false

    - name: Check shfmt is installed
      ansible.builtin.command: shfmt --version
      changed_when: false

    - name: Check go is installed
      ansible.builtin.command: go version
      changed_when: false

    - name: Check wl-clipboard is installed
      ansible.builtin.command: which wl-copy
      changed_when: false

    # --- Notes role (private repo, clone expected to fail gracefully in CI) ---
    - name: Check notes repo directory
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/notes/.git"
      register: verify_notes

    - name: Assert notes .git/config has 0600 when repo exists
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/notes/.git/config"
      register: verify_notes_config
      when: verify_notes.stat.exists

    - name: Verify notes .git/config permissions
      ansible.builtin.assert:
        that: verify_notes_config.stat.mode == '0600'
        fail_msg: "notes .git/config should be 0600"
      when: verify_notes.stat.exists and verify_notes_config.stat.exists

    # --- Desktop role ---
    - name: Verify Alacritty config deployed
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/alacritty/alacritty.toml"
      register: verify_alacritty

    - name: Assert Alacritty config exists
      ansible.builtin.assert:
        that: verify_alacritty.stat.exists
        fail_msg: "Alacritty config not deployed"

    - name: Verify Chrome policy deployed
      ansible.builtin.stat:
        path: /etc/opt/chrome/policies/managed/security.json
      register: verify_chrome

    - name: Assert Chrome policy exists
      ansible.builtin.assert:
        that: verify_chrome.stat.exists
        fail_msg: "Chrome security policy not deployed"

    # --- Containers ---
    - name: Verify containers config directory
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/containers"
      register: verify_containers_dir

    - name: Assert containers config directory exists
      ansible.builtin.assert:
        that:
          - verify_containers_dir.stat.exists
          - verify_containers_dir.stat.isdir
        fail_msg: "Containers config directory was not created"
