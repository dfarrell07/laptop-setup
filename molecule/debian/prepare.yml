---
# molecule/debian/prepare.yml
# Waits for container systemd to stabilize before converge begins.
# Debian 13 (Trixie) with systemd 257 in privileged Podman containers has
# several kernel-filesystem units (binfmt_misc, configfs, debugfs, tracefs,
# kernel module loader) that fail at boot because container namespaces do not
# expose those kernel subsystems. Without waiting, converge tasks race against
# systemd's restart loops on these failed units, causing PID 1 crashes.
#
# NOTE: openssh-server is NOT pre-installed here — apt postinst triggers
# pam-auth-update which restarts systemd-logind, which crashes PID 1 in
# privileged Podman containers. The converge skips the openssh-server apt
# task (when: not system_is_container) to avoid the crash.
# CI gap: sshd hardening block is not exercised in Debian container CI;
# make test-vm exercises full sshd hardening on Debian.
- name: Prepare — wait for systemd to stabilize
  hosts: all
  gather_facts: false
  ignore_unreachable: true  # container may not be ready immediately after create

  tasks:
    - name: Wait for container systemd to reach running or degraded state
      ansible.builtin.command: podman exec {{ inventory_hostname }} systemctl is-system-running
      delegate_to: localhost
      register: _boot
      until: "'running' in _boot.stdout | default('') or 'degraded' in _boot.stdout | default('')"
      retries: 30
      delay: 3
      changed_when: false
      failed_when: false

    - name: Mask kernel-filesystem units that loop and destabilize systemd PID 1 in containers
      # binfmt_misc/configfs/debugfs/tracefs mounts and kernel module loader fail in
      # privileged Podman containers (restricted kernel namespaces). Without masking,
      # systemd retries these in activate/fail loops that eventually crash PID 1.
      # Masking with --now stops any in-flight activation and prevents further retries.
      # Uses podman exec (delegate_to: localhost) to avoid Ansible connection dependency
      # during the unstable early-boot window.
      ansible.builtin.command: >-
        podman exec {{ inventory_hostname }} systemctl mask --now
        proc-sys-fs-binfmt_misc.automount
        sys-kernel-config.mount
        sys-kernel-debug.mount
        sys-kernel-tracing.mount
        systemd-modules-load.service
      delegate_to: localhost
      changed_when: false
      failed_when: false

    - name: Wait for systemd to settle after masking failed units
      ansible.builtin.command: podman exec {{ inventory_hostname }} systemctl is-system-running
      delegate_to: localhost
      register: _boot2
      until: "'running' in _boot2.stdout | default('') or 'degraded' in _boot2.stdout | default('')"
      retries: 20
      delay: 2
      changed_when: false
      failed_when: false
