---
- name: Converge — System role (Debian)
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Capture real user identity
      ansible.builtin.set_fact:
        real_user_home: "{{ lookup('env', 'HOME') }}"
        real_user_id: "{{ lookup('env', 'USER') }}"
      become: false

    - name: Load configuration
      ansible.builtin.include_vars: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/default.config.yml"

    - name: Set project root for include paths
      ansible.builtin.set_fact:
        common_project_root: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    - name: Override for container testing (system role)
      ansible.builtin.set_fact:
        system_disable_usb_storage: false
        system_kernel_lockdown: ''
        system_aide_enabled: false
        system_install_usbguard: false
        install_virtualization: false  # libvirt not needed in CI container
        system_var_tmp_noexec: false   # var-tmp.mount unit fails in containers without systemd
        system_disable_fingerprint: false  # fprintd masking fails silently in containers; skip entirely
        system_tlp_enabled: false   # TLP/ppd service ops fail in containers
        real_user_id: molecule  # containers connect as root; override to avoid sshd AllowUsers assert

  roles:
    - role: system

- name: Converge (Debian/ChromeOS Crostini)
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Load configuration
      ansible.builtin.include_vars: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/default.config.yml"

    - name: Override profile
      ansible.builtin.set_fact:
        profile: personal
        packages_install_binaries: false
        # Fake key so ssh role deploys allowed_signers in CI (vault empty → key empty without this)
        ssh_git_signing_pubkey: "sk-ssh-ed25519 AAAAIMoleculeTestKeyForCI molecule-test@ci"

    # Create a minimal mock notes repo so the notes role skips cloning (private
    # repo, no SSH key in CI) but still runs the chmod tasks that set notes/
    # to 0700 and notes/.git/config to 0600 — which the verify assertions check.
    - name: Create mock notes .git directory for CI permission testing
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/notes/.git"
        state: directory
        mode: "0755"

    - name: Create mock notes .git/config for CI permission testing
      ansible.builtin.copy:
        content: "[core]\n\trepositoryformatversion = 0\n\tfilemode = true\n\tbare = false\n"  # noqa: no-tabs
        dest: "{{ ansible_user_dir }}/notes/.git/config"
        mode: "0644"

  roles:
    - role: common
    - role: packages
    - role: dotfiles
    - role: ssh
    - role: git_repos
    - role: notes
      vars:
        notes_transcrypt_password: ""
    - role: containers
    - role: desktop
      vars:
        desktop_environment: 'unknown'
        desktop_deploy_chrome_policies: true
        desktop_apt_packages: []
    - role: claude
      vars:
        claude_install_method: skip

  post_tasks:
    - name: Generate CSB compatibility report
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/common/tasks/csb-report.yml"
      tags: [always]
