---
- name: Converge — System role (Debian)
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Capture real user identity
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/capture-user-identity.yml"

    - name: Load CI pre-tasks (config, group_vars, project root)
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/ci-pre-tasks.yml"

    - name: Apply container-safe system role overrides
      ansible.builtin.include_tasks: "{{ common_project_root }}/molecule/shared/system-container-overrides.yml"

    - name: Install openssh-server so sshd hardening block is exercised in container CI
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: true
      when: not system_is_container
      # policy-rc.d (exit 101) is pre-installed in the geerlingguy image and prevents
      # postinst from auto-starting sshd.service/ssh.socket — no policy-rc.d setup needed.
      # sshd is intentionally left stopped after install; sshd.service is still DEFINED
      # (so the sshd.yml hardening block runs), but starting sshd would crash the container.
      # NOTE: Debian Podman containers skip this install — apt triggers daemon-reload on
      # /etc/systemd/** writes which crashes the privileged container init. The sshd.service
      # fact will be absent, so the sshd hardening block in sshd.yml is also skipped for
      # Debian container CI (CI gap; make test-vm exercises full sshd hardening on Debian).

  roles:
    - role: system

- name: Converge (Debian/ChromeOS Crostini)
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Load CI pre-tasks (config, group_vars, project root)
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/ci-pre-tasks.yml"

    - name: Override profile
      ansible.builtin.set_fact:
        profile: personal
        notes_enabled: true
        # packages_install_binaries and ssh_signing_key_pub are in molecule/shared/system-container-overrides.yml

    - name: Create mock notes repo structure for CI
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/ci-mock-notes.yml"

  roles:
    - role: common
    - role: packages
    - role: dotfiles
    - role: ssh
    - role: git_repos
    - role: notes
      vars:
        notes_transcrypt_password: ""
    - role: containers
    - role: claude
      vars:
        claude_install_method: skip

  post_tasks:
    # Desktop role called via include_role so vars: are at role-params precedence (p20),
    # overriding include_vars desktop_environment: auto (p18) from default.config.yml.
    # Calling with roles: vars: would set vars at play-vars precedence (p12), losing to p18.
    - name: Converge desktop role (unknown — sway not installed on Debian CI)
      ansible.builtin.include_role:
        name: desktop
      vars:
        desktop_environment: unknown
        desktop_deploy_chrome_policies: true
        desktop_sway_packages: []
        desktop_i3_packages: []
        is_dnf: "{{ ansible_facts['pkg_mgr'] | default('') in ['dnf', 'dnf5'] }}"

    - name: Generate CSB compatibility report
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/common/tasks/csb-report.yml"
      tags: [always]
