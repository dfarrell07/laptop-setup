---
# Prepare: wait for systemd to stabilize before converge.
# Rocky Linux 10 runs /usr/sbin/init (systemd) as PID 1. Ansible may connect
# before all late-init units have activated, causing non-deterministic
# UNREACHABLE failures at different task offsets.
# NOTE: do NOT modify /etc/systemd/system/ in prepare — creating symlinks
# there triggers an inotify daemon-reload that crashes the container.
- name: Prepare (wait for systemd)
  hosts: all
  gather_facts: false
  become: true
  ignore_unreachable: true

  tasks:
    - name: Wait for systemd to reach running or degraded state
      ansible.builtin.command: systemctl is-system-running
      register: systemd_state
      retries: 30
      delay: 2
      until: systemd_state.stdout in ['running', 'degraded']
      failed_when: false
      changed_when: false

    - name: Wait for auditd restart loop to exhaust (kernel audit disabled in containers)  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-active auditd.service
      register: auditd_active
      retries: 30
      delay: 1
      until: auditd_active.stdout not in ['activating', 'reloading']
      failed_when: false
      changed_when: false
