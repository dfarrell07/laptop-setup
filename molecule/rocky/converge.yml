---
- name: Converge — System role (Rocky Linux 10)
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Capture real user identity
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/capture-user-identity.yml"

    - name: Load CI pre-tasks (config, group_vars, project root)
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/ci-pre-tasks.yml"

    - name: Apply container-safe system role overrides
      ansible.builtin.include_tasks: "{{ common_project_root }}/molecule/shared/system-container-overrides.yml"

    - name: Refresh DNF cache so system role sees current mirror metadata
      ansible.builtin.include_tasks: "{{ common_project_root }}/molecule/shared/dnf-cache-refresh.yml"

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Install openssh-server so sshd hardening block is exercised in container CI
      ansible.builtin.dnf:
        name: openssh-server
        state: present
      register: _openssh_install
      retries: 3
      delay: 10
      until: _openssh_install is succeeded
      when: "'openssh-server' not in ansible_facts.packages"

  roles:
    - role: system

- name: Converge (Rocky Linux 10)
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Load CI pre-tasks (config, group_vars, project root)
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/ci-pre-tasks.yml"

    - name: Override for container testing
      ansible.builtin.set_fact:
        profile: work
        _csb_molecule_force: true  # pin csb_detected/csb_rhel; prevents csb_detect.yml from overwriting
        csb_rhel: true          # Rocky = RHEL CSB path; overrides system-container-overrides.yml baseline
        csb_detected: true      # Rocky is CSB-detected (RHEL CSB)
        notes_enabled: true
        dotfiles_gonosumdb: "test.example.com"  # non-empty so verify-common GONOSUMDB assertions run
        dotfiles_goprivate: "git.example.com"   # non-empty so verify-common GOPRIVATE assertions run
        # Subset of packages_cli — direnv, zoxide, shfmt, procps-ng, fd-find not in Rocky 10 repos
        # (fd-find has no EPEL 10 package; ripgrep IS in EPEL 10 and is included below)
        packages_cli:
          - git
          - make
          - curl
          - tree
          - htop
          - tmux
          - mosh
          - jq
          - vim
          - zsh
          - fzf
          - pipx
          - ShellCheck
          - ripgrep
          - git-lfs  # in AppStream or EPEL 10
        packages_security_yubikey: []  # YubiKey packages not reliably in Rocky 10 repos; skip
        packages_containers: []
        packages_networking: []
        packages_networking_work: []  # must also clear work-specific list after packages split
        packages_support_work: []  # avoid dnf repo dependencies in CI
        packages_go_install_work: []  # work-profile OVN-K codegen go tools — not installable in CI
        packages_containers_kubectl: []  # kubectl has no Rocky 10 / EPEL 10 package
        desktop_environment: 'unknown'  # p19 set_fact beats include_vars p18; no WM in Rocky CI
        # install_virtualization, packages_install_binaries, ssh_signing_key_pub are in molecule/shared/system-container-overrides.yml

    - name: Create mock notes repo structure for CI
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/ci-mock-notes.yml"

  roles:
    - role: common
    - role: repos_dnf
    - role: packages
    - role: dotfiles
    - role: ssh
    - role: git_repos
    - role: notes
      vars:
        notes_transcrypt_password: ""
    - role: redhat
      when: csb_rhel
    - role: containers
    - role: distrobox
    - role: claude
      vars:
        claude_install_method: skip
        claude_queue_enabled: true
        claude_queue_repo: "dfarrell07/laptop-setup"

  post_tasks:
    # desktop_environment is set to 'unknown' in the pre_tasks set_fact (p19) so the role
    # sees it correctly. The vars: here override package lists only.
    - name: Converge desktop role (unknown — no WM in Rocky CI)
      ansible.builtin.include_role:
        name: desktop
      vars:
        desktop_dnf_packages: []
        desktop_sway_packages: []
        desktop_i3_packages: []
        desktop_deploy_chrome_policies: true
        is_dnf: "{{ ansible_facts['pkg_mgr'] | default('') in ['dnf', 'dnf5'] }}"

    - name: Generate CSB compatibility report
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/csb-report-post.yml"
      tags: [always]
