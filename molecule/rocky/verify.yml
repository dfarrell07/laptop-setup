---
- name: Verify (Rocky Linux 10)
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Set work profile and identity vars for verify context
      ansible.builtin.set_fact:
        profile: work
        go_tools_installed: false  # packages_install_binaries: false in container CI skips go install
        dotfiles_user_email_work: "molecule-test@ci.invalid"  # matches converge set_fact; undefined otherwise

  tasks:
    # --- Shared assertions (all platforms) ---
    - name: Include common verify assertions
      ansible.builtin.include_tasks: ../shared/verify-common.yml

    - name: Include smoke-test verification
      ansible.builtin.include_tasks: ../shared/verify-smoke.yml

    # --- Shared assertions (dnf platforms) ---
    - name: Include dnf verify assertions
      ansible.builtin.include_tasks: ../shared/verify-dnf.yml

    # DNS-over-TLS (99-dot.conf) checked in molecule/shared/verify-common.yml

    # --- repos_dnf role: third-party repo files ---
    - name: Verify tailscale-stable.repo exists (repos_dnf)
      ansible.builtin.stat:
        path: /etc/yum.repos.d/tailscale-stable.repo
      register: verify_tailscale_repo

    - name: Assert tailscale-stable.repo was deployed by repos_dnf
      ansible.builtin.assert:
        that: verify_tailscale_repo.stat.exists
        fail_msg: "tailscale-stable.repo missing — repos_dnf role not exercised or template broken"

    - name: Verify gh-cli.repo exists (repos_dnf, RHEL/Rocky only)
      ansible.builtin.stat:
        path: /etc/yum.repos.d/gh-cli.repo
      register: verify_gh_cli_repo

    - name: Assert gh-cli.repo was deployed by repos_dnf
      ansible.builtin.assert:
        that: verify_gh_cli_repo.stat.exists
        fail_msg: "gh-cli.repo missing — repos_dnf role not exercised or template broken"

    # --- Work profile checks ---
    - name: Verify Claude work config directory
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.claude-work"
      register: verify_claude_work

    - name: Assert Claude work config directory exists
      ansible.builtin.assert:
        that:
          - verify_claude_work.stat.exists
          - verify_claude_work.stat.isdir
          - verify_claude_work.stat.mode == '0700'
        fail_msg: "Claude work config dir missing or wrong permissions"

    - name: Verify Claude work settings.local.json exists
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.claude-work/settings.local.json"
      register: verify_claude_work_settings

    - name: Assert Claude work settings.local.json exists with 0600
      ansible.builtin.assert:
        that:
          - verify_claude_work_settings.stat.exists
          - verify_claude_work_settings.stat.mode == '0600'
        fail_msg: "Claude work settings.local.json not deployed or wrong permissions"

    - name: Validate Claude work settings.local.json sandbox and deny config
      ansible.builtin.command:
        cmd: >-
          python3 -c "
          import json, sys
          d = json.load(open('{{ ansible_user_dir }}/.claude-work/settings.local.json'))
          assert d.get('sandbox', {}).get('enabled'), 'sandbox.enabled is not true'
          assert d.get('sandbox', {}).get('failIfUnavailable'), 'sandbox.failIfUnavailable is not true'
          assert not d.get('sandbox', {}).get('allowUnsandboxedCommands'), 'sandbox.allowUnsandboxedCommands is not false'
          assert d.get('enableAllProjectMcpServers') == False, 'enableAllProjectMcpServers is not false'
          assert len(d.get('permissions', {}).get('deny', [])) > 0, 'deny list is empty'
          "
      changed_when: false
      when: verify_claude_work_settings.stat.exists

    - name: Check git user.email is work email
      ansible.builtin.command: git config --global user.email  # noqa: command-instead-of-module
      register: verify_git_email
      changed_when: false

    - name: Assert git email is work profile
      ansible.builtin.assert:
        that: "dotfiles_user_email_work in verify_git_email.stdout"
        fail_msg: "git user.email is not set to a Red Hat work address"

    - name: Verify Claude CLAUDE.md exists (work)
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.claude-work/CLAUDE.md"
      register: verify_claude_md_work

    - name: Assert Claude CLAUDE.md exists (work)
      ansible.builtin.assert:
        that: verify_claude_md_work.stat.exists
        fail_msg: "Claude CLAUDE.md not deployed (work profile)"

    # --- Notes role ---
    - name: Verify notes role
      ansible.builtin.include_tasks: ../shared/verify-notes.yml

    # --- Desktop role ---
    - name: Include Alacritty and Chrome policy assertions
      ansible.builtin.include_tasks: ../shared/verify-desktop-common.yml

    # --- Redhat role: certs only deployed on actual RHEL, not Rocky ---
    # Rocky has ansible_distribution='Rocky' not 'RedHat', so is_rhel=False and
    # redhat role skips internal CA cert deployment. These assertions are skipped.
    - name: Note that Red Hat internal CA certs are not deployed on Rocky
      ansible.builtin.debug:
        msg: "Skipping RH CA cert assertions — Rocky is not RHEL (is_rhel=False, certs not deployed)"

    # --- CSB detection: Rocky is NOT RedHat (ansible_distribution='Rocky' != 'RedHat') ---
    # is_rhel=False on Rocky → needs_container_tier='host-only' (not 'hybrid').
    # verify-common.yml re-includes csb_detect.yml so facts are populated in verify phase.
    - name: Assert csb_detected is false on Rocky molecule host
      ansible.builtin.assert:
        that: not (csb_detected | default(true))
        fail_msg: "csb_detected is true on Rocky molecule host — csb_detect.yml regression"

    - name: Assert needs_container_tier is host-only on Rocky (not RedHat, not CSB)
      ansible.builtin.assert:
        that: needs_container_tier | default('unknown') == 'host-only'
        fail_msg: "needs_container_tier is not host-only on Rocky — is_rhel detection broken (Rocky != RedHat)"

    - name: Assert fapolicyd is not installed on Rocky molecule host
      ansible.builtin.assert:
        that: not (fapolicyd_installed | default(true))
        fail_msg: "fapolicyd_installed is true on Rocky molecule host — CSB detection false positive"

    # DNS-over-TLS (99-dot.conf) checked in molecule/shared/verify-common.yml

    # --- git_repos role: verify a public HTTPS repo was actually cloned ---
    - name: Verify public HTTPS repo was cloned to ~/src/ by git_repos role
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/src/ci-test/laptop-setup/.git"
      register: verify_git_repos_clone

    - name: Assert git_repos clone ran successfully
      ansible.builtin.assert:
        that:
          - verify_git_repos_clone.stat.exists
          - verify_git_repos_clone.stat.isdir
        fail_msg: >-
          git_repos clone task did not create ~/src/ci-test/laptop-setup/.git —
          clone task logic regression or git_repos_list filtering broken
