---
- name: Verify (Rocky Linux 10)
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Load configuration defaults (provides ssh_port, system_* defaults)
      ansible.builtin.include_vars: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/default.config.yml"

    - name: Load group_vars baselines for verify context
      ansible.builtin.include_vars: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/group_vars/all/vars.yml"

    - name: Set work profile and identity vars for verify context
      ansible.builtin.set_fact:
        profile: work
        dotfiles_user_email_work: "molecule-test@ci.invalid"  # matches ci-default-vars.yml; re-stated here for verify phase
        system_is_container: true  # converge forces true; verify must match or not-system_is_container guards run against absent files
        csb_rhel: true  # set_fact does not persist across plays; re-state so csb_detect.yml in verify-common.yml does not reset to false
        _csb_molecule_force: true  # prevents csb_detect.yml overriding csb_rhel (Rocky has no RHEL markers)
        system_ssh_unused_connection_timeout: 600  # role default; absent here silences verify trim_blocks guard
        real_user_id: molecule  # ansible_user_id=root in container; subuid/subgid provisioned for molecule

  tasks:
    # --- Shared assertions (all platforms) ---
    - name: Include common verify assertions
      ansible.builtin.import_tasks: ../shared/verify-common.yml

    - name: Include smoke-test verification
      ansible.builtin.import_tasks: ../shared/verify-smoke.yml

    # --- Shared assertions (dnf platforms) ---
    - name: Include dnf verify assertions
      ansible.builtin.import_tasks: ../shared/verify-dnf.yml

    # DNS-over-TLS (99-dot.conf) checked in molecule/shared/verify-common.yml

    - name: Verify gh-cli.repo exists (repos_dnf, RHEL/Rocky only)
      ansible.builtin.stat:
        path: /etc/yum.repos.d/gh-cli.repo
      register: verify_gh_cli_repo

    - name: Assert gh-cli.repo was deployed by repos_dnf
      ansible.builtin.assert:
        that: verify_gh_cli_repo.stat.exists
        fail_msg: "gh-cli.repo missing — repos_dnf role not exercised or template broken"

    # --- Work profile checks ---
    - name: Include Claude work instance directory and settings assertions
      ansible.builtin.import_tasks: ../shared/verify-claude-work.yml

    - name: Include work profile assertions
      ansible.builtin.import_tasks: ../shared/verify-work-profile.yml

    # --- Notes role ---
    - name: Verify notes role
      ansible.builtin.import_tasks: ../shared/verify-notes.yml

    # --- Desktop role ---
    - name: "Include Alacritty assertions (Chrome policy CI gap: not system_is_container)"
      ansible.builtin.import_tasks: ../shared/verify-desktop-common.yml

    # --- Redhat role: certs only deployed on actual RHEL, not Rocky ---
    # Rocky has ansible_distribution='Rocky' not 'RedHat', so is_rhel=False and
    # redhat role skips internal CA cert deployment — assert the detection is correct.
    # --- CSB detection: Rocky is NOT RedHat (ansible_distribution='Rocky' != 'RedHat') ---
    # is_rhel=False on Rocky → needs_container_tier='host-only' (not 'hybrid').
    # verify-common.yml re-includes csb_detect.yml so facts are populated in verify phase.
    # Downstream consequence of is_rhel=false: redhat role skips CA cert deployment
    - name: Stat Red Hat internal CA certs (must be absent on Rocky — redhat role skipped)
      ansible.builtin.stat:
        path: "/etc/pki/ca-trust/source/anchors/{{ item }}"
      loop:
        - 2022-IT-Root-CA.pem
        - Eng-CA.crt
      register: verify_rhit_ca_rocky

    - name: Assert Red Hat CA certs absent on Rocky (is_rhel=false → redhat role skipped)
      ansible.builtin.assert:
        that: not item.stat.exists
        fail_msg: "{{ item.item }} deployed on Rocky — redhat role should skip cert when is_rhel=false"
      loop: "{{ verify_rhit_ca_rocky.results }}"

    # --- Claude task queue (converge sets claude_queue_enabled: true) ---
    - name: Import Claude queue verification tasks
      ansible.builtin.import_tasks: ../shared/verify-claude-queue.yml

    # --- distrobox role: no-op path (packages_containers emptied in converge) ---
    - name: Import distrobox no-op path assertions
      ansible.builtin.import_tasks: ../shared/verify-distrobox-noop.yml
