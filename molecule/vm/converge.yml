---
- name: Converge — System setup (VM)
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Capture real user identity
      ansible.builtin.set_fact:
        real_user_home: "{{ lookup('env', 'HOME') }}"
        real_user_id: vagrant  # Vagrant SSH user — AllowUsers must match or sshd restart locks out molecule
      become: false

    - name: Load CI pre-tasks (config, group_vars, project root)
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/ci-pre-tasks.yml"

    - name: Override profile
      ansible.builtin.set_fact:
        profile: personal

    - name: Signal that usbguard is expected (system role included in this scenario)
      ansible.builtin.set_fact:
        usbguard_expected: true
        system_aide_enabled: true        # VM scenario exercises AIDE (full kernel access, real timer)
        system_tlp_enabled: true         # VM scenario exercises TLP/ppd masking path (laptop form_factor not auto-detected in VMs)
        system_coredump_storage: none    # VM verify asserts Storage=none; match defaults that ship None for hardened CI
        system_coredump_process_size_max: 0  # VM verify asserts ProcessSizeMax=0; disable coredumps in hardened CI
        # Exercise even_deny_root=true path (default.config.yml sets false; no other scenario tests true)
        system_faillock_even_deny_root: true
        system_disable_bluetooth: true       # VM scenario exercises BT masking + module blacklist path
        is_dnf5: "{{ ansible_facts['pkg_mgr'] | default('') == 'dnf5' }}"

    # Vagrant boxes ship sshd_config with '#Port 22' (commented-out, implicit default).
    # The system role deploys Port 722 in a drop-in and restarts sshd.  If no explicit
    # Port 22 is present, sshd switches to port 722 only, breaking Molecule's connection
    # through Vagrant's port-22 forwarding.  Making Port 22 explicit here ensures the
    # drop-in Port 722 is additive (sshd listens on both) rather than a replacement.
    - name: Make Port 22 explicit in sshd_config so Port 722 drop-in is additive
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?Port\s+22$'
        line: 'Port 22'
        state: present

  roles:
    - role: repos_dnf
      when: ansible_pkg_mgr in ['dnf', 'dnf5']
    - role: system

- name: Converge — User setup (VM)
  hosts: all
  become: false
  gather_facts: true

  pre_tasks:
    - name: Load CI pre-tasks (config, group_vars, project root)
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/ci-pre-tasks.yml"

    - name: Override profile
      ansible.builtin.set_fact:
        profile: personal
        notes_enabled: true
        dotfiles_github_user: "molecule-ci"
        packages_go_install: []  # Go tools use changed_when: true — skip in CI to avoid idempotence failures
        ssh_git_signing_pubkey: "sk-ssh-ed25519 AAAAIMoleculeTestKeyForCI molecule-test@ci"  # enables git signing sections in gitconfig.j2

    - name: Create mock notes repo structure for CI
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/ci-mock-notes.yml"

  roles:
    - role: common
    - role: packages
    - role: dotfiles
    - role: ssh
      vars:
        ssh_signing_key_pub: "sk-ssh-ed25519 AAAAIMoleculeTestKeyForCI molecule-test@ci"
    - role: git_repos
    - role: notes
      vars:
        notes_transcrypt_password: ""
    - role: containers
    - role: distrobox
    - role: claude
      vars:
        claude_install_method: skip

  post_tasks:
    # Desktop role called via include_role so vars: are at role-params precedence (p20),
    # overriding include_vars desktop_environment: auto (p18) from default.config.yml.
    # Calling with roles: vars: would set vars at play-vars precedence (p12), losing to p18.
    - name: Converge desktop role
      ansible.builtin.include_role:
        name: desktop
      vars:
        desktop_environment: 'unknown'
        desktop_common_packages: []
        desktop_sway_packages: []
        desktop_i3_packages: []
        desktop_deploy_chrome_policies: true
        is_dnf: "{{ ansible_facts['pkg_mgr'] | default('') in ['dnf', 'dnf5'] }}"

    - name: Generate CSB compatibility report
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/common/tasks/csb-report.yml"
      tags: [always]
