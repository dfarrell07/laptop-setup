---
# Prerequisite: run `make bootstrap-test` (vagrant box add githubixx/fedora-44 --provider libvirt).
# The box is large (~600 MB); ensure adequate disk space before running.
driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: fedora-test
    box: githubixx/fedora-44
    box_version: '20260727.0.0'
    memory: 4096
    cpus: 2

provisioner:
  name: ansible
  env:
    ANSIBLE_VAULT_PASSWORD_FILE: ${MOLECULE_PROJECT_DIRECTORY}/scripts/vault-pass-ci.sh
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/collections:~/.ansible/collections:/usr/share/ansible/collections
    ANSIBLE_LIBRARY: ''
  config_options:
    defaults:
      vault_password_file: ${MOLECULE_PROJECT_DIRECTORY}/scripts/vault-pass-ci.sh
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
      collections_path: ${MOLECULE_PROJECT_DIRECTORY}/collections:~/.ansible/collections:/usr/share/ansible/collections
      pipelining: true
      gathering: smart
    privilege_escalation:
      become: true

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - create
    - converge
    - idempotence
    - verify
    - destroy
