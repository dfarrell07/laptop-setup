---
- name: Verify (VM)
  hosts: all
  gather_facts: true
  become: false

  pre_tasks:
    - name: Load group_vars for verify assertions
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../group_vars/all/vars.yml"

    # Load variable overrides matching vm/converge.yml so shared verify checks
    # evaluate against the correct deployed values (not role/config defaults).
    - name: Apply VM-specific variable overrides for verify
      ansible.builtin.set_fact:
        system_faillock_even_deny_root: true
        system_coredump_storage: none        # converge.yml overrides to none for hardened CI
        system_coredump_process_size_max: 0  # converge.yml overrides to 0 for hardened CI
        usbguard_expected: true              # converge.yml sets this; enables USBGuard assertions in verify-smoke.yml
        system_tlp_enabled: true             # converge.yml sets this; needed for TLP verify assertions
        system_aide_enabled: true            # converge.yml sets this; needed for AIDE assertions
        system_disable_bluetooth: true       # converge.yml sets this; enables BT masking + blacklist assertions
        profile: personal                    # converge.yml sets personal profile; sos (work-only) must be guarded
        ssh_port: 722                        # matches default; parameterizes sshd port assertions
        system_tmout: 600                    # matches default; parameterizes TMOUT session-timeout assertions

  tasks:
    # --- Shared assertions (all platforms) ---
    - name: Include common verify assertions
      ansible.builtin.import_tasks: ../shared/verify-common.yml

    # NOTE: verify-smoke.yml hardcodes --user-only. A second play below (become: true)
    # runs smoke-test.sh without --user-only as root to cover system-level checks
    # (auditd watch keys, pwquality details, chrony NTS cookies, pwhistory, yescrypt,
    # TMOUT bounds, /var/tmp bind-mount) that the user-only run cannot reach.
    - name: Include smoke-test verification
      ansible.builtin.import_tasks: ../shared/verify-smoke.yml

    # --- Shared assertions (dnf platforms) ---
    - name: Include dnf verify assertions
      ansible.builtin.import_tasks: ../shared/verify-dnf.yml

    # --- repos_dnf checks ---
    # gh-cli repo assertion removed: gh ships in standard Fedora repos (F43+),
    # so the third-party repo is no longer added on Fedora.

    - name: Verify google-chrome repo configured
      ansible.builtin.stat:
        path: /etc/yum.repos.d/google-chrome.repo
      register: verify_chrome_repo
      become: true
      when: repo_google_chrome

    - name: Assert google-chrome repo exists
      ansible.builtin.assert:
        that: verify_chrome_repo.stat.exists
        fail_msg: "google-chrome repo not configured"
      when: repo_google_chrome

    - name: Include desktop common assertions (Alacritty + Chrome policy)
      ansible.builtin.import_tasks: ../shared/verify-desktop-common.yml

    - name: Verify slack repo configured
      ansible.builtin.stat:
        path: /etc/yum.repos.d/slack.repo
      register: verify_slack_repo
      become: true
      when: (repo_slack) and ansible_architecture == 'x86_64'

    - name: Assert slack repo exists
      ansible.builtin.assert:
        that: verify_slack_repo.stat.exists
        fail_msg: "slack repo not configured"
      when: (repo_slack) and ansible_architecture == 'x86_64'

    - name: Verify google-cloud-cli repo configured
      ansible.builtin.stat:
        path: /etc/yum.repos.d/google-cloud-cli.repo
      register: verify_gcloud_repo
      become: true
      when: (repo_google_cloud_sdk) and ansible_architecture == 'x86_64'

    - name: Assert google-cloud-cli repo exists
      ansible.builtin.assert:
        that: verify_gcloud_repo.stat.exists
        fail_msg: "google-cloud-cli repo not configured"
      when: (repo_google_cloud_sdk) and ansible_architecture == 'x86_64'

    - name: Check sysctl config contains kernel.panic = 0 (workstation default; group_vars default is 0; CIS target is 10)
      ansible.builtin.command: grep -q 'kernel.panic = {{ system_kernel_panic }}' /etc/sysctl.d/90-hardening.conf
      changed_when: false
      become: true

    - name: Check sysctl config contains kernel.panic_on_oops = 0 (workstation default; group_vars default is 0; CIS target is 1)
      ansible.builtin.command: grep -q 'kernel.panic_on_oops = {{ system_kernel_panic_on_oops }}' /etc/sysctl.d/90-hardening.conf
      changed_when: false
      become: true

    - name: Check fs.inotify.max_user_watches (system role)
      ansible.builtin.command: sysctl -n fs.inotify.max_user_watches
      register: verify_inotify_watches
      changed_when: false
      become: true

    - name: Assert fs.inotify.max_user_watches >= 524288
      ansible.builtin.assert:
        that: verify_inotify_watches.stdout | int >= 524288
        fail_msg: >-
          fs.inotify.max_user_watches={{ verify_inotify_watches.stdout }},
          expected >=524288 (required for IDE/file-watcher tools)

    - name: Check fs.inotify.max_user_instances (system role)
      ansible.builtin.command: sysctl -n fs.inotify.max_user_instances
      register: verify_inotify_instances
      changed_when: false
      become: true

    - name: Assert fs.inotify.max_user_instances >= 512
      ansible.builtin.assert:
        that: verify_inotify_instances.stdout | int >= 512
        fail_msg: >-
          fs.inotify.max_user_instances={{ verify_inotify_instances.stdout }},
          expected >=512

    # --- System hardening checks (VM only) ---
    - name: Gather service facts for conditional checks
      ansible.builtin.service_facts:
      become: true

    - name: Check firewall default zone
      ansible.builtin.command: firewall-cmd --get-default-zone
      register: verify_fw_zone
      changed_when: false
      become: true

    - name: Assert firewall default zone is drop
      ansible.builtin.assert:
        that: verify_fw_zone.stdout == 'drop'
        fail_msg: "Firewall default zone is '{{ verify_fw_zone.stdout }}', expected 'drop'"

    - name: Check ICMP block inversion enabled in drop zone
      ansible.builtin.command: firewall-cmd --zone=drop --query-icmp-block-inversion
      register: verify_fw_icmp_inversion
      changed_when: false
      become: true

    - name: Assert ICMP block inversion is enabled in drop zone
      ansible.builtin.assert:
        that: verify_fw_icmp_inversion.rc == 0
        fail_msg: "icmp-block-inversion not enabled in drop zone — NDP/PMTU ICMP cannot be selectively allowed"

    - name: Check drop zone interface list excludes tun* interfaces
      ansible.builtin.command: firewall-cmd --zone=drop --list-interfaces
      register: verify_fw_drop_ifaces
      changed_when: false
      become: true

    - name: Assert no tun* interfaces in drop zone (VPN exclusion from reject filter)
      ansible.builtin.assert:
        that: not (verify_fw_drop_ifaces.stdout | regex_search('tun[0-9]+'))
        fail_msg: "tun* interface found in drop zone — VPN tunnel traffic will be silently dropped"

    - name: Check port 722/tcp is open in drop zone
      ansible.builtin.command: firewall-cmd --zone=drop --query-port={{ ssh_port }}/tcp
      register: verify_fw_port
      changed_when: false
      become: true

    - name: Assert port 722/tcp is open in drop zone
      ansible.builtin.assert:
        that: verify_fw_port.rc == 0
        fail_msg: "Port {{ ssh_port }}/tcp not open in drop zone"

    - name: Check sysctl net.core.bpf_jit_harden
      ansible.builtin.command: sysctl -n net.core.bpf_jit_harden
      register: verify_bpf
      changed_when: false
      become: true

    - name: Assert BPF JIT hardening
      ansible.builtin.assert:
        that: verify_bpf.stdout == (system_bpf_jit_harden | default(1) | string)
        fail_msg: "BPF JIT hardening not set to {{ system_bpf_jit_harden | default(1) }} (see system_bpf_jit_harden)"

    - name: Check sysctl kernel.unprivileged_bpf_disabled
      ansible.builtin.command: sysctl -n kernel.unprivileged_bpf_disabled
      register: verify_bpf_unpriv
      changed_when: false
      become: true

    - name: Assert unprivileged BPF is disabled but root-re-enable-able
      ansible.builtin.assert:
        that: verify_bpf_unpriv.stdout | int in [1, 2]
        fail_msg: >-
          kernel.unprivileged_bpf_disabled={{ verify_bpf_unpriv.stdout }} (expected 1 or 2).
          Value 0 allows unprivileged BPF loading — security regression.

    - name: Check bpfman binary is present
      ansible.builtin.command: which bpfman
      register: verify_bpfman_bin
      changed_when: false
      failed_when: false

    - name: Check bpfman.socket is enabled
      ansible.builtin.command: systemctl is-enabled bpfman.socket  # noqa: command-instead-of-module
      register: verify_bpfman_socket
      changed_when: false
      become: true
      failed_when: false
      when: verify_bpfman_bin.rc == 0

    - name: Assert bpfman.socket is enabled
      ansible.builtin.assert:
        that: verify_bpfman_socket.rc == 0
        fail_msg: "bpfman.socket is not enabled — bpfman load/list will fail at runtime"
      when: verify_bpfman_bin.rc == 0

    - name: Check sysctl net.ipv4.conf.all.rp_filter
      ansible.builtin.command: sysctl -n net.ipv4.conf.all.rp_filter
      register: verify_rp_filter
      changed_when: false
      become: true

    - name: Assert reverse path filtering
      ansible.builtin.assert:
        that: verify_rp_filter.stdout == '2'
        fail_msg: "Reverse path filtering not set to loose mode (2) required for Tailscale"

    - name: Check sysctl net.ipv4.ip_forward
      ansible.builtin.command: sysctl -n net.ipv4.ip_forward
      register: verify_ip_forward
      changed_when: false
      become: true

    - name: Assert ip_forward is 1 (required for Kubernetes/OVN-K/kind)
      ansible.builtin.assert:
        that: verify_ip_forward.stdout == '1'
        fail_msg: "net.ipv4.ip_forward is not 1 — pod routing and Tailscale subnet routing will fail"
      when: hostvars[inventory_hostname].system_enable_ip_forward | default(true) | bool

    - name: Check sysctl net.bridge.bridge-nf-call-iptables
      ansible.builtin.command: sysctl -n net.bridge.bridge-nf-call-iptables
      register: verify_bridge_nf
      changed_when: false
      become: true

    - name: Assert bridge-nf-call-iptables is 1 (required for OVN-K NetworkPolicy)
      ansible.builtin.assert:
        that: verify_bridge_nf.stdout == '1'
        fail_msg: "net.bridge.bridge-nf-call-iptables is not 1 — Kubernetes NetworkPolicy will not be enforced"

    - name: Verify ip_tables, br_netfilter, overlay modules loaded at runtime
      ansible.builtin.command: sh -c "lsmod | grep -qE 'ip_tables|br_netfilter|overlay'"
      changed_when: false
      become: true

    - name: Verify all 7 kind kernel modules are marked persistent in /etc/modules-load.d
      ansible.builtin.command: grep -rqE '^{{ item }}$' /etc/modules-load.d/
      loop:
        - ip6_tables
        - ip6table_nat
        - ip_tables
        - iptable_nat
        - br_netfilter
        - nf_conntrack
        - overlay
      changed_when: false
      become: true

    # auditd: stat + mode 0640 + -e 2 immutability covered by verify-common.yml (not csb_detected)

    - name: Slurp DNS-over-TLS config for content check
      ansible.builtin.slurp:
        src: /etc/systemd/resolved.conf.d/99-dot.conf
      register: verify_dot_content
      become: true
      when: verify_dot_conf.stat.exists

    - name: Assert DNS-over-TLS config contains required settings
      ansible.builtin.assert:
        that:
          - (verify_dot_content.content | b64decode) is search('Domains=~\.')
          - (verify_dot_content.content | b64decode) is search('DNSOverTLS=opportunistic')
          - (verify_dot_content.content | b64decode) is search('1\.1\.1\.1')
        fail_msg: "99-dot.conf exists but is missing required settings (Domains=~., DNSOverTLS=opportunistic, 1.1.1.1)"
      when: verify_dot_conf.stat.exists

    - name: Verify kernel lockdown in grubby
      ansible.builtin.command: grubby --info=DEFAULT
      register: verify_lockdown
      changed_when: false
      become: true
      failed_when: false

    - name: Assert kernel lockdown integrity
      ansible.builtin.assert:
        that: "'lockdown=integrity' in verify_lockdown.stdout"
        fail_msg: "Kernel lockdown=integrity not found in boot args"
      when: verify_lockdown.rc == 0

    - name: Check sshd config uses non-default port {{ ssh_port }}
      ansible.builtin.command: grep -q '^Port {{ ssh_port }}$' /etc/ssh/sshd_config.d/00-hardening.conf
      changed_when: false
      become: true

    - name: Verify port 722 is labeled ssh_port_t
      ansible.builtin.command:
        cmd: semanage port -l
      register: verify_semanage
      changed_when: false
      failed_when: false
      become: true

    - name: Assert SSH port is labeled ssh_port_t
      ansible.builtin.assert:
        that: verify_semanage.rc == 0 and verify_semanage.stdout | regex_search('ssh_port_t.*' ~ ssh_port ~ '|' ~ ssh_port ~ '.*ssh_port_t')
        fail_msg: "Port {{ ssh_port }} not labeled ssh_port_t — sshd will fail to bind"

    - name: Extract AllowUsers value from sshd config
      ansible.builtin.command: grep -oP '(?<=AllowUsers )\S+' /etc/ssh/sshd_config.d/00-hardening.conf
      register: verify_sshd_allowusers
      changed_when: false
      become: true

    - name: Assert AllowUsers is set to the real user (not empty, not root)
      ansible.builtin.assert:
        that:
          - verify_sshd_allowusers.stdout | length > 0
          - verify_sshd_allowusers.stdout != 'root'
          - verify_sshd_allowusers.stdout == ansible_user_id
        fail_msg: >-
          AllowUsers is '{{ verify_sshd_allowusers.stdout }}',
          expected '{{ ansible_user_id }}' (non-empty, non-root)

    # --- New system hardening checks ---
    - name: Check /dev/shm mount options
      ansible.builtin.command: findmnt -n -o OPTIONS /dev/shm
      register: verify_shm
      changed_when: false
      become: true

    - name: Assert /dev/shm has noexec, nosuid, nodev
      ansible.builtin.assert:
        that:
          - "'noexec' in verify_shm.stdout"
          - "'nosuid' in verify_shm.stdout"
          - "'nodev' in verify_shm.stdout"
        fail_msg: "/dev/shm missing required mount options (noexec,nosuid,nodev)"

    - name: Check /tmp mount options (CIS 1.1.2.x)
      ansible.builtin.command: findmnt -n -o OPTIONS /tmp
      register: verify_tmp
      changed_when: false
      become: true

    - name: Assert /tmp has noexec (CIS 1.1.2.x)
      ansible.builtin.assert:
        that:
          - "'noexec' in verify_tmp.stdout"
          - "'nosuid' in verify_tmp.stdout"
          - "'nodev' in verify_tmp.stdout"
        fail_msg: "/tmp missing required mount options (noexec,nosuid,nodev) — CIS 1.1.2.x"

    - name: Check /home mount options (CIS 1.1.9)
      ansible.builtin.command: findmnt -n -o OPTIONS /home
      register: verify_home
      changed_when: false
      become: true
      failed_when: false

    - name: Assert /home has nosuid (CIS 1.1.9)
      ansible.builtin.assert:
        that: "'nosuid' in verify_home.stdout"
        fail_msg: "/home missing nosuid mount option (CIS 1.1.9)"
      when: verify_home.rc | default(1) == 0  # skip if /home is not a separate mountpoint

    - name: Check /home fstab entry contains nosuid (system role fstab hardening)
      # The Fedora installer writes a /home entry in /etc/fstab even when /home is on
      # the root partition (subvol= btrfs). The system role adds nosuid to that line.
      ansible.builtin.command: grep -qE '^[^#]\S+\s+/home\s+\S+\s+[^,]*nosuid' /etc/fstab
      changed_when: false
      become: true
      failed_when: false
      register: verify_home_fstab_nosuid

    - name: Assert /home fstab entry has nosuid
      ansible.builtin.assert:
        that: verify_home_fstab_nosuid.rc == 0
        fail_msg: "/home fstab entry missing nosuid — system role fstab lineinfile task may have failed"
      when: verify_home_fstab_nosuid.rc is defined

    - name: Check /boot mount options
      ansible.builtin.command: findmnt -n -o OPTIONS /boot
      register: verify_boot
      changed_when: false
      become: true
      failed_when: false

    - name: Assert /boot has nosuid, nodev, noexec
      ansible.builtin.assert:
        that:
          - "'nosuid' in verify_boot.stdout"
          - "'nodev' in verify_boot.stdout"
          - "'noexec' in verify_boot.stdout"
        fail_msg: "/boot missing required mount options (nosuid,nodev,noexec)"
      when: verify_boot.rc | default(1) == 0  # skip if /boot is not a separate mountpoint

    - name: Check /boot/efi mount options
      ansible.builtin.command: findmnt -n -o OPTIONS /boot/efi
      register: verify_boot_efi
      changed_when: false
      become: true
      failed_when: false

    - name: Assert /boot/efi has nosuid, noexec
      ansible.builtin.assert:
        that:
          - "'nosuid' in verify_boot_efi.stdout"
          - "'noexec' in verify_boot_efi.stdout"
        fail_msg: "/boot/efi missing required mount options (nosuid,noexec)"
      when: verify_boot_efi.rc | default(1) == 0  # skip if /boot/efi is not a separate mountpoint

    - name: Verify modprobe blacklists usb_storage
      ansible.builtin.command: grep -q usb_storage /etc/modprobe.d/hardening.conf
      changed_when: false
      failed_when: false
      register: verify_usb_storage
      become: true

    - name: Assert usb_storage is blacklisted
      ansible.builtin.assert:
        that: verify_usb_storage.rc == 0
        fail_msg: "usb_storage not blacklisted"

    - name: Check modprobe blacklists cramfs
      ansible.builtin.command: grep -q cramfs /etc/modprobe.d/hardening.conf
      changed_when: false
      become: true

    - name: Check modprobe blacklists firewire-core
      ansible.builtin.command: grep -q firewire-core /etc/modprobe.d/hardening.conf
      changed_when: false
      become: true

    # --- Bluetooth disable path (system_disable_bluetooth: true) ---
    - name: Query bluetooth.service UnitFileState
      ansible.builtin.systemd:
        name: bluetooth.service
      register: verify_bluetooth_service
      become: true
      failed_when: false
      when: system_disable_bluetooth | bool

    - name: Assert bluetooth.service is masked
      ansible.builtin.assert:
        that: verify_bluetooth_service.status.UnitFileState == 'masked'
        fail_msg: "bluetooth.service is not masked — system_disable_bluetooth: true did not take effect"
      when:
        - system_disable_bluetooth | bool
        - verify_bluetooth_service.status.UnitFileState | default('') != ''

    - name: Check modprobe blacklists bluetooth
      ansible.builtin.command: grep -q 'blacklist bluetooth' /etc/modprobe.d/hardening.conf
      changed_when: false
      become: true
      when: system_disable_bluetooth | bool

    - name: Check SELinux enforcing mode
      ansible.builtin.command: getenforce
      register: verify_selinux
      changed_when: false
      become: true
      when: system_selinux_enforcing_required | default(true) | bool

    - name: Assert SELinux is enforcing
      ansible.builtin.assert:
        that: verify_selinux.stdout == 'Enforcing'
        fail_msg: "SELinux is '{{ verify_selinux.stdout }}', expected 'Enforcing'"
      when: system_selinux_enforcing_required | default(true) | bool

    - name: Verify var-tmp.mount is enabled
      ansible.builtin.systemd:
        name: var-tmp.mount
      register: verify_var_tmp_mount
      become: true
      when: system_var_tmp_noexec | default(false)

    - name: Assert var-tmp.mount is enabled
      ansible.builtin.assert:
        that: verify_var_tmp_mount.status.UnitFileState == 'enabled'
        fail_msg: "var-tmp.mount not enabled"
      when: system_var_tmp_noexec | default(false)

    - name: Check pam_wheel.so in /etc/pam.d/su
      ansible.builtin.command: grep -qE '^auth.*required.*pam_wheel.so' /etc/pam.d/su
      changed_when: false
      become: true

    - name: Check root account locked
      ansible.builtin.command: passwd -S root
      register: verify_root_lock
      changed_when: false
      become: true

    - name: Assert root account is locked
      ansible.builtin.assert:
        that: "'LK' in verify_root_lock.stdout or 'L ' in verify_root_lock.stdout"
        fail_msg: "Root account is not locked"

    - name: Verify AIDE timer enabled
      ansible.builtin.systemd:
        name: aide-check.timer
      register: verify_aide_timer
      become: true
      when: system_aide_enabled | default(false)

    - name: Assert AIDE timer is enabled
      ansible.builtin.assert:
        that: verify_aide_timer.status.UnitFileState == 'enabled'
        fail_msg: "AIDE check timer not enabled"
      when: system_aide_enabled | default(false)

    - name: Stat AIDE database
      ansible.builtin.stat:
        path: /var/lib/aide/aide.db.gz
      register: verify_aide_db
      become: true
      when: system_aide_enabled | default(false)

    - name: Assert AIDE database is initialized
      ansible.builtin.assert:
        that: verify_aide_db.stat.exists
        fail_msg: "AIDE database /var/lib/aide/aide.db.gz not initialized"
      when: system_aide_enabled | default(false)

    - name: Check AIDE service RestrictAddressFamilies sandbox setting
      ansible.builtin.command: grep -q 'RestrictAddressFamilies=none' /etc/systemd/system/aide-check.service
      changed_when: false
      become: true
      when: system_aide_enabled | default(false)

    - name: Check AIDE conf includes security-critical paths
      ansible.builtin.command: grep -q '{{ item.path }}' /etc/aide.conf
      loop:
        - path: /etc/audit
        - path: /etc/bpfman
        - path: /etc/crypto-policies
        - path: /etc/selinux
        - path: /etc/usbguard
      loop_control:
        label: "{{ item.path }}"
      when:
        - system_aide_enabled | default(false)
        - item.path != '/etc/usbguard' or usbguard_expected | default(false)
      changed_when: false
      become: true

    # --- PAM faillock unique VM check (others covered by verify-dnf.yml) ---
    - name: Check faillock even_deny_root present (VM converge sets system_faillock_even_deny_root true)
      ansible.builtin.command: grep -q '^even_deny_root' /etc/security/faillock.conf
      changed_when: false
      become: true

    # pwquality minlen=14 covered by verify-dnf.yml (included at line 35)

    # --- Journald persistence ---
    - name: Verify /var/log/journal exists for persistent logging
      ansible.builtin.stat:
        path: /var/log/journal
      register: verify_journal_dir
      become: true

    - name: Assert journal directory exists with correct mode
      ansible.builtin.assert:
        that:
          - verify_journal_dir.stat.exists
          - verify_journal_dir.stat.isdir
          - verify_journal_dir.stat.mode == '2755'
        fail_msg: "/var/log/journal missing or wrong mode (expected 2755)"

    # --- Service masking ---
    - name: Check cups.socket state
      ansible.builtin.systemd:
        name: cups.socket
      register: verify_cups_socket
      become: true
      failed_when: false

    - name: Assert cups.socket is masked (prevent socket activation of CUPS)
      ansible.builtin.assert:
        that: verify_cups_socket.status.UnitFileState == 'masked'
        fail_msg: "cups.socket is not masked — Flatpak print dialogs can trigger socket activation to restart CUPS"
      when: verify_cups_socket.status.UnitFileState | default('') != ''

    - name: Check cups.path state
      ansible.builtin.systemd:
        name: cups.path
      register: verify_cups_path
      become: true
      failed_when: false

    - name: Assert cups.path is masked (prevent path activation of CUPS)
      ansible.builtin.assert:
        that: verify_cups_path.status.UnitFileState == 'masked'
        fail_msg: "cups.path is not masked — path activation can restart CUPS daemon"
      when: verify_cups_path.status.UnitFileState | default('') != ''

    - name: Check fprintd service state
      ansible.builtin.systemd:
        name: fprintd.service
      register: verify_fprintd
      become: true
      failed_when: false

    - name: Assert fprintd.service is masked (prevents fingerprint from bypassing pam_faillock)
      ansible.builtin.assert:
        that: verify_fprintd.status.UnitFileState == 'masked'
        fail_msg: "fprintd.service is not masked — fingerprint auth can bypass pam_faillock"
      when: verify_fprintd.status.UnitFileState | default('') != ''

    - name: Check power-profiles-daemon state
      ansible.builtin.systemd:
        name: power-profiles-daemon
      register: verify_ppd
      become: true
      failed_when: false

    - name: Assert power-profiles-daemon is masked (TLP conflict prevention)
      ansible.builtin.assert:
        that: verify_ppd.status.UnitFileState == 'masked'
        fail_msg: "power-profiles-daemon is not masked — TLP and power-profiles-daemon will conflict"
      when: verify_ppd.status.UnitFileState | default('') != ''

    - name: Check tuned-ppd state
      ansible.builtin.systemd:
        name: tuned-ppd
      register: verify_tuned_ppd
      become: true
      failed_when: false

    - name: Assert tuned-ppd is masked (TLP conflict prevention)
      ansible.builtin.assert:
        that: verify_tuned_ppd.status.UnitFileState == 'masked'
        fail_msg: "tuned-ppd is not masked — TLP and tuned-ppd will conflict"
      when: verify_tuned_ppd.status.UnitFileState | default('') != ''

    - name: Check tlp.service is enabled (system_tlp_enabled path)
      ansible.builtin.systemd:
        name: tlp.service
      register: verify_tlp_service
      become: true
      failed_when: false
      when: system_tlp_enabled | default(false)

    - name: Assert tlp.service is enabled
      ansible.builtin.assert:
        that: verify_tlp_service.status.UnitFileState == 'enabled'
        fail_msg: "tlp.service is not enabled — system_tlp_enabled: true did not take effect"
      when:
        - system_tlp_enabled | default(false)
        - verify_tlp_service.status is defined

    - name: Stat TLP ThinkPad config file
      ansible.builtin.stat:
        path: /etc/tlp.d/50-thinkpad.conf
      register: verify_tlp_config
      when: system_tlp_enabled | default(false)

    - name: Assert TLP ThinkPad config deployed
      ansible.builtin.assert:
        that: verify_tlp_config.stat.exists
        fail_msg: "/etc/tlp.d/50-thinkpad.conf not deployed — Deploy TLP ThinkPad charge threshold config task failed"
      when: system_tlp_enabled | default(false)

    - name: Stat /usr/local/bin/gitleaks
      ansible.builtin.stat:
        path: /usr/local/bin/gitleaks
      register: verify_vm_gitleaks

    - name: Assert gitleaks binary exists and is executable
      ansible.builtin.assert:
        that:
          - verify_vm_gitleaks.stat.exists
          - verify_vm_gitleaks.stat.executable
        fail_msg: "/usr/local/bin/gitleaks missing — gitleaks binary download regression (packages role)"

    # --- logind unique VM check: IdleActionSec (others covered by verify-common.yml) ---
    - name: Check logind config contains IdleActionSec
      ansible.builtin.command: grep -q '^IdleActionSec=' /etc/systemd/logind.conf.d/99-hardening.conf
      changed_when: false
      become: true
      when: verify_logind_conf.stat.exists

    # --- packages_security_yubikey (ykpers / YubiKey challenge-response) ---
    - name: Check ykpers is installed (provides ykchalresp for vault HMAC-SHA1)
      ansible.builtin.command: rpm -q ykpers  # noqa: command-instead-of-module
      changed_when: false

    - name: Check sos is installed (sosreport diagnostic bundle tool)
      ansible.builtin.command: rpm -q sos  # noqa: command-instead-of-module
      changed_when: false
      when: profile | default('work') == 'work'  # sos is in packages_support_work (work-profile only)

    # --- distrobox role ---
    - name: Check for distrobox binary
      ansible.builtin.stat:
        path: /usr/bin/distrobox
      register: verify_distrobox_bin

    - name: Check for toolbox binary
      ansible.builtin.stat:
        path: /usr/bin/toolbox
      register: verify_toolbox_bin

    - name: Resolve distrobox_tool for verify
      ansible.builtin.set_fact:
        verify_distrobox_tool: >-
          {{ 'distrobox' if (verify_distrobox_bin.stat.exists)
             else ('toolbox' if (verify_toolbox_bin.stat.exists)
             else 'none') }}

    - name: Assert distrobox_tool fact resolves to a known value
      ansible.builtin.assert:
        that: verify_distrobox_tool in ['distrobox', 'toolbox', 'none']
        fail_msg: "distrobox_tool resolved to unexpected value: {{ verify_distrobox_tool }}"

    - name: Assert distrobox binary is present (installed by packages role)
      ansible.builtin.assert:
        that: verify_distrobox_bin.stat.exists
        fail_msg: "distrobox binary not found in /usr/bin — packages role should install it"

    - name: Stat distrobox.ini deployed by template
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.config/distrobox/distrobox.ini"
      register: verify_distrobox_ini
      when: verify_distrobox_bin.rc == 0

    - name: Assert distrobox.ini exists (template was rendered and deployed)
      ansible.builtin.assert:
        that: verify_distrobox_ini.stat.exists
        fail_msg: >-
          distrobox.ini missing at {{ ansible_user_dir }}/.config/distrobox/distrobox.ini —
          distrobox role template was not deployed
      when: verify_distrobox_bin.rc == 0

    # --- Notes role (private repo, clone expected to fail gracefully in CI) ---
    - name: Verify notes role
      ansible.builtin.import_tasks: ../shared/verify-notes.yml

- name: Verify (VM) — root smoke-test
  hosts: all
  gather_facts: false
  become: true

  tasks:
    # Run the full smoke-test as root so system-level checks that require root or
    # EUID=0 (auditd watch keys, pwquality detail params, chrony NTS cookie count,
    # pwhistory remember=24, yescrypt/YESCRYPT_COST_FACTOR, TMOUT bounds, /var/tmp
    # bind-mount noexec) are exercised.  MOLECULE_PROJECT_DIRECTORY is forwarded so
    # tool-presence failures are demoted to WARN (some tools are skipped in the VM
    # converge, e.g. claude_install_method: skip).
    - name: Run smoke-test.sh as root (full system checks)
      ansible.builtin.script:
        cmd: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/scripts/smoke-test.sh --json"
      environment:
        MOLECULE_PROJECT_DIRECTORY: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      register: smoke_root
      changed_when: false
      failed_when: false

    - name: Show root smoke-test warns and results
      ansible.builtin.debug:
        msg: >-
          warns={{ smoke_root.stdout | from_json | json_query('warns') }}
          results={{ smoke_root.stdout | from_json | json_query("results[?status!='PASS']") }}
      when: smoke_root.stdout | default('') | length > 0

    - name: Assert root smoke-test passed
      ansible.builtin.assert:
        that: smoke_root.rc == 0
        fail_msg: >-
          smoke-test.sh (root) exited {{ smoke_root.rc }}:
          {{ (smoke_root.stdout | from_json | json_query("results[?status=='FAIL']") | to_nice_json)
             if smoke_root.stdout | default('') | length > 0 else '(no output)' }}
