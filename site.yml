---
# Play 1 — Host system (become: true)
# Runs repos_dnf and system roles that need play-level privilege escalation.
- name: System setup (requires sudo)
  hosts: localhost
  become: true
  gather_facts: true
  tags: [become]

  pre_tasks:
    - name: Capture real user identity
      ansible.builtin.set_fact:
        real_user_home: "{{ lookup('env', 'HOME') }}"
        real_user_id: "{{ lookup('env', 'USER') }}"
      become: false
      tags: [always]

    - name: Set project root for include paths
      ansible.builtin.set_fact:
        common_project_root: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
             | default(playbook_dir, true) }}
      become: false
      tags: [always]

    - name: Load configuration
      ansible.builtin.include_vars: default.config.yml
      become: false
      tags: [always]

    - name: Load user overrides
      ansible.builtin.include_vars: config.yml
      become: false
      failed_when: false
      tags: [always]

    - name: Load user config for vault key inspection
      ansible.builtin.include_vars:
        file: config.yml
        name: _user_config
      become: false
      failed_when: false
      tags: [always]

    - name: Assert config.yml contains no vault_* keys
      ansible.builtin.assert:
        that: >-
          _user_config is not defined or
          (_user_config.keys() | select('match', '^vault_') | list | length == 0)
        fail_msg: >-
          config.yml must not define vault_* variables — include_vars outranks
          group_vars (precedence 17 vs 4), so these keys silently shadow
          vault.yml: {{ (_user_config | default({})).keys() | select('match', '^vault_') | list }}
      become: false
      tags: [always]

    - name: Run CSB detection (makes csb_detected available to system role tasks)
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb_detect.yml"
      when: ansible_system == 'Linux'
      tags: [always]

  roles:
    - role: repos_dnf
      tags: [repos_dnf]
      when: ansible_pkg_mgr in ['dnf', 'dnf5']

    - role: system
      tags: [system]
      when: ansible_system == 'Linux'

  post_tasks:
    # NetworkManager restart and systemd-resolved restart handlers fire here (end of Play 1).
    # Wait for DNS connectivity before Play 2 begins — Play 2 needs DNS for git clones,
    # binary downloads, and SSH host key fetches.
    - name: Wait for DNS resolution after NetworkManager and systemd-resolved restart
      ansible.builtin.command:
        cmd: getent hosts github.com
      changed_when: false
      failed_when: false
      retries: 6
      delay: 5
      register: system_dns_liveness
      until: system_dns_liveness.rc == 0
      when:
        - ansible_system == 'Linux'
        - ansible_virtualization_type not in ['container', 'docker', 'podman']
      tags: [always]

    - name: Warn if DNS is not resolving after NetworkManager restart
      ansible.builtin.debug:
        msg: >-
          WARNING: DNS resolution for github.com failed after NetworkManager/systemd-resolved
          restart. Play 2 (git clones, binary downloads) may fail. Check NM and resolved status:
          systemctl status NetworkManager systemd-resolved; resolvectl status
      when:
        - ansible_system == 'Linux'
        - system_dns_liveness is defined
        - system_dns_liveness.rc | default(1) != 0
      tags: [always]

# Play 2 — Host user (no play-level become)
# Individual tasks escalate with become: true + tags: [become] as needed.
- name: User setup
  hosts: localhost
  become: false
  gather_facts: true

  pre_tasks:
    - name: Load configuration
      ansible.builtin.include_vars: default.config.yml
      tags: [always]

    - name: Load user overrides
      ansible.builtin.include_vars: config.yml
      failed_when: false
      tags: [always]

    - name: Load user config for vault key inspection
      ansible.builtin.include_vars:
        file: config.yml
        name: _user_config
      failed_when: false
      tags: [always]

    - name: Assert config.yml contains no vault_* keys
      ansible.builtin.assert:
        that: >-
          _user_config is not defined or
          (_user_config.keys() | select('match', '^vault_') | list | length == 0)
        fail_msg: >-
          config.yml must not define vault_* variables — include_vars outranks
          group_vars (precedence 17 vs 4), so these keys silently shadow
          vault.yml: {{ (_user_config | default({})).keys() | select('match', '^vault_') | list }}
      tags: [always]

    - name: Assert identity vars are not CHANGE_ME placeholder values
      ansible.builtin.assert:
        that:
          - dotfiles_user_name | default('CHANGE_ME') != 'CHANGE_ME'
          - dotfiles_github_user | default('CHANGE_ME') != 'CHANGE_ME'
          - dotfiles_user_email_work | default('CHANGE_ME') != 'CHANGE_ME'
          - dotfiles_user_email_personal | default('CHANGE_ME') != 'CHANGE_ME'
        fail_msg: >-
          Set dotfiles_user_name, dotfiles_github_user, dotfiles_user_email_work,
          and dotfiles_user_email_personal in config.yml before running make all.
          These are currently 'CHANGE_ME' placeholder values — git commits will be
          attributed to 'CHANGE_ME' and email notifications will go to wrong addresses.
      when: lookup('env', 'MOLECULE_SCENARIO_NAME') == ''
      tags: [always]

  roles:
    - role: common
      tags: [common, always]

    - role: packages
      tags: [packages]

    - role: dotfiles
      tags: [dotfiles]

    - role: ssh
      tags: [ssh]

    - role: git_repos
      tags: [repos]

    - role: notes
      tags: [notes]

    - role: redhat
      tags: [redhat]
      when: profile == 'work' and ansible_os_family == 'RedHat'

    - role: containers
      tags: [containers]

    - role: desktop
      tags: [desktop]

    - role: distrobox
      tags: [distrobox]
      when: ansible_system == 'Linux' and distrobox_enabled | bool

    - role: claude
      tags: [claude]

  post_tasks:
    - name: Generate CSB compatibility report
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-report.yml"
      tags: [always]
      when: csb_detected | default(false)

# Play 3 — Container provisioning (podman connection)
# Only runs when the distrobox role registered a container via add_host.
- name: Provision dev container
  hosts: containers
  connection: containers.podman.podman
  gather_facts: false
  tags: [distrobox]

  pre_tasks:
    - name: Set project root for include paths
      ansible.builtin.set_fact:
        common_project_root: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
             | default(playbook_dir, true) }}
      tags: [always]

    - name: Bootstrap Python inside container
      ansible.builtin.raw: |
        dnf install -y python3 python3-libdnf5 2>/dev/null || \
        dnf install -y python3 python3-dnf 2>/dev/null || true
      changed_when: false
      tags: [always]

    - name: Gather minimal facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - distribution
          - env
      tags: [always]

  tasks:
    - name: Provision dev container
      ansible.builtin.include_tasks:
        file: "{{ common_project_root }}/common/tasks/container-provision-tasks.yml"
