---
# Static import orders pre-flight validation before provisioning.
# Use the verified wrapper: it rejects flags that could skip these checks.
- name: Import pre-flight validation
  ansible.builtin.import_playbook: pre-flight.yml

# ============================================================================
# PLAY ARCHITECTURE & CONTRIBUTOR GUIDE
# ============================================================================
# Play 0 (pre-flight.yml, import_playbook): Pre-flight checks
#   • CSB detection, fapolicyd state, vault encryption validation
#   • Runs before provisioning; the wrapper rejects --start-at-task
#
# Play 1 (System setup, become: true): Root-level infrastructure
#   • repos_dnf: Configure package repos (Fedora/RHEL only)
#   • system: Hardening, SELinux, firewall, kernel params, services
#   • Play-level become: true simplifies privilege escalation for these roles
#   • Post-task: Validates DNS resolution after NetworkManager restart
#     (Play 2 depends on DNS for git/binary downloads)
#
# Play 2 (User setup, become: false): User-level provisioning
#   • Pre-tasks: vault healthcheck, identity var assertions
#   • Roles: packages, ssh, dotfiles, git_repos, notes, redhat, containers,
#     desktop, claude, codex, distrobox
#   • Individual tasks use become: true + tags: [become] when needed
#   • See CLAUDE.md § "Key Patterns" for become convention details
#   • NEW ROLES: Add here with appropriate tags and conditional become: true
#
# Play 3 (Container provisioning): Podman-based dev container
#   • Only runs if distrobox role registered a container with add_host
#   • Uses containers.podman.podman connection plugin
#   • Bootstraps Python inside container, gathers facts, runs container tasks
#
# SECURITY NOTE: The verified wrapper rejects --start-at-task and skipping always
# tags. Direct Ansible invocation can skip checks; use the Make targets or wrapper.
# ============================================================================

# Play 1 — Host system (become: true)
# Runs repos_dnf and system roles that need play-level privilege escalation.
- name: System setup (requires sudo)
  hosts: localhost
  become: true
  gather_facts: false
  tags: [become]

  pre_tasks:
    # become:false so --check mode works without requiring sudo
    - name: Gather facts
      ansible.builtin.gather_facts:
      become: false
      tags: [always]

    - name: Verify sudo authentication (Play 1)
      ansible.builtin.import_tasks: common/tasks/become_probe.yml
      # always + become, not chunk names: the probe must run for every sudo target and be skipped by the no-sudo ones
      tags: [always, become]

    # SECURITY: Close pre-hardening cron window.
    # cronie is installed by default on Fedora and may already be running when provisioning
    # begins. cron.yml runs about two thirds of the way through the system role's imports (~10-20 min
    # into provisioning), leaving a window in which pre-placed /var/spool/cron/<user>
    # jobs fire freely. Writing cron.allow=root here — the earliest privileged step —
    # eliminates that window before any role executes. Skip on any CSB machine (IT managed
    # cron jobs would be blocked) and containers (no crond).
    - name: "SECURITY: Write cron.allow and at.allow before roles (close pre-hardening cron window)"
      ansible.builtin.copy:
        content: "root\n"
        dest: "{{ item }}"
        mode: "0600"
      loop:
        - /etc/cron.allow
        - /etc/at.allow
      when:
        - ansible_facts['system'] == 'Linux'  # macOS cron uses /usr/lib/cron; these files would be inert
        - not system_is_container
        - not csb_detected
      # Not 'always': no-sudo targets (make dotfiles, ...) must not attempt become here.
      # sys_baseline (not repos_dnf): skipping the repos_dnf chunk must not skip this guard.
      tags: [system, sys_baseline]

  roles:
    - role: repos_dnf
      tags: [repos_dnf]
      when: ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']

    - role: system
      tags: [system]
      when: ansible_facts['system'] | default('Linux') == 'Linux'

  post_tasks:
    - name: Flush handlers before DNS wait (ensure NetworkManager and systemd-resolved have restarted)
      ansible.builtin.meta: flush_handlers
      tags: [system]

    # NetworkManager restart and systemd-resolved restart handlers have executed above.
    # Wait for DNS connectivity before Play 2 begins — Play 2 needs DNS for git clones,
    # binary downloads, and SSH host key fetches.
    - name: Wait for DNS resolution after NetworkManager and systemd-resolved restart
      ansible.builtin.command:
        cmd: getent hosts github.com
      become: false
      changed_when: false
      failed_when: false
      retries: 6
      delay: 5
      register: system_dns_liveness
      until: system_dns_liveness.rc == 0
      when:
        - ansible_facts['system'] | default('Linux') == 'Linux'
        - ansible_facts['virtualization_type'] | default('') not in ['container', 'docker', 'podman']
      tags: [system]

    - name: Warn if DNS is not resolving after NetworkManager restart
      ansible.builtin.debug:
        msg: >-
          WARNING: DNS resolution for github.com failed after NetworkManager/systemd-resolved
          restart. Play 2 (git clones, binary downloads) may fail. Check NM and resolved status:
          systemctl status NetworkManager systemd-resolved; resolvectl status
      become: false
      when:
        - ansible_facts['system'] | default('Linux') == 'Linux'
        - system_dns_liveness is defined
        - system_dns_liveness.rc | default(1) != 0
      tags: [system]

# Play 2 — User-level provisioning (no play-level become)
# Individual tasks escalate with become: true + tags: [become] as needed.
- name: User setup
  hosts: localhost
  become: false
  gather_facts: true

  pre_tasks:
    - name: Verify sudo authentication (Play 2 targets run with --ask-become-pass)
      ansible.builtin.import_tasks: common/tasks/become_probe.yml
      tags: [always, become]

    - name: Vault healthcheck — assert required SSH key variables are defined (allows empty on first provision)
      ansible.builtin.assert:
        that:
          - vault_ssh_auth_key is defined
          - vault_ssh_auth_key_pub is defined
          - vault_ssh_signing_key is defined
          - vault_ssh_signing_key_pub is defined
        fail_msg: >-
          vault.yml missing SSH key vars. Expected:
          vault_ssh_auth_key, vault_ssh_auth_key_pub, vault_ssh_signing_key, vault_ssh_signing_key_pub.
          Run: make vault-view | grep vault_ssh
      when: not _pf_is_molecule
      tags: [always]

    # NOTE: an empty vault is handled inside roles/distrobox/tasks/main.yml, which defers
    # container provisioning (until 'make container') so the other roles still succeed.

    # REQUIRED GUARD — DO NOT REMOVE: Play 1 applies SSH port change + kernel
    # hardening before Play 2, so users who skip 'make preflight' get no other
    # warning. preflight.sh alone is not sufficient.
    - name: Assert identity vars are not CHANGE_ME placeholder values
      ansible.builtin.assert:
        that:
          - (dotfiles_user_name | default('CHANGE_ME') != 'CHANGE_ME') and (dotfiles_user_name | default('') | length > 0)
          - (dotfiles_github_user | default('CHANGE_ME') != 'CHANGE_ME') and (dotfiles_github_user | default('') | length > 0)
          - >-
            (dotfiles_user_email_personal | default('CHANGE_ME') != 'CHANGE_ME') and
            (dotfiles_user_email_personal | default('') | length > 0)
        fail_msg: >-
          Set dotfiles_user_name, dotfiles_github_user, dotfiles_user_email_personal in config.yml.
          These are CHANGE_ME placeholders; git commits will be misattributed.
      when: not _pf_is_molecule
      tags: [always]

  roles:
    - role: common
      # always tag is intentional: common creates prerequisite dirs; '--skip-tags common'
      # is insufficient to suppress it — the always tag wins. Use '--skip-tags always'
      # to suppress (also affects all other always-tagged pre_tasks in this play).
      tags: [common, always]

    - role: packages
      tags: [packages]

    - role: ssh
      tags: [ssh, ssh_client]

    - role: dotfiles
      tags: [dotfiles]

    - role: git_repos
      tags: [repos, git_repos]

    - role: notes
      tags: [notes, repos]

    - role: redhat
      tags: [redhat]
      when: profile == 'work' and (is_rhel or csb_detected)

    - role: containers
      tags: [containers]

    - role: desktop
      tags: [desktop]

    - role: claude
      tags: [claude, agents]

    - role: codex
      tags: [codex, agents]
      when: codex_enabled | default(true) | bool

    - role: distrobox
      tags: [distrobox]
      when: ansible_facts['system'] | default('Linux') == 'Linux' and distrobox_enabled | bool

  post_tasks:
    # AIDE's first baseline is built in the system play; packages and later roles then add
    # binaries under /usr/local/bin and edit monitored /etc paths, so the first scheduled check
    # would report all of it. The system role leaves a marker when it (re)initializes the
    # baseline; it is rebuilt here once and the marker removed, so a run that fails before
    # this point is caught up by the next successful one.
    - name: Check for a pending AIDE baseline rebuild
      ansible.builtin.stat:
        path: /var/lib/aide/.rebaseline-pending
      become: true
      register: _aide_rebaseline_marker
      when: ansible_facts['system'] == 'Linux'  # no AIDE (and no reason to escalate) on macOS
      tags: [always, become, sys_optional]

    - name: Rebuild the AIDE baseline after provisioning
      ansible.builtin.shell:  # noqa: command-instead-of-module
        cmd: >-
          aide --init && mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
          && rm -f /var/lib/aide/.rebaseline-pending
      become: true
      timeout: 1800
      changed_when: true
      when: _aide_rebaseline_marker.stat.exists | default(false)
      tags: [always, become, sys_optional]

    # Only a full run supersedes the report: a single-role target (make ssh) knows nothing of
    # failures recorded by other roles, and the report is only written when it has failures.
    - name: Remove stale CSB report
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/csb-report.md"
        state: absent
      when: "'all' in ansible_run_tags"
      tags: [always]

    - name: Generate CSB compatibility report
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-report.yml"
      tags: [always]
      when: csb_detected

# Play 3 — Dev container provisioning (podman connection)
# Runs only if distrobox role registered a container with add_host.
- name: Provision dev container
  hosts: containers
  connection: containers.podman.podman
  gather_facts: false
  tags: [distrobox]

  pre_tasks:
    - name: Set project root for include paths
      ansible.builtin.set_fact:
        common_project_root: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
             | default(playbook_dir, true) }}
      tags: [always]

    - name: SECURITY CRITICAL — Validate config integrity before container provisioning
      # Also loads default.config.yml/config.yml into the container host's vars
      # (include_vars is per inventory host; Play 3 runs on the container, not localhost).
      delegate_to: localhost
      become: false
      tags: [always]
      block:
        - name: Re-run pre-flight checks (ensures --limit cannot bypass)
          ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/pre_flight_checks.yml"

    - name: Vault healthcheck — assert required SSH key variables are defined
      ansible.builtin.assert:
        that:
          - vault_ssh_auth_key is defined and vault_ssh_auth_key | length > 0
          - vault_ssh_auth_key_pub is defined and vault_ssh_auth_key_pub | length > 0
        fail_msg: vault.yml missing or empty SSH key vars (required for container provisioning)
      delegate_to: localhost
      when: not _pf_is_molecule
      tags: [always]

    - name: Bootstrap Python inside container
      ansible.builtin.raw: |
        sudo dnf install -y python3 python3-libdnf5 2>/dev/null || \
        sudo dnf install -y python3 python3-dnf 2>/dev/null || true
      changed_when: false
      tags: [always]

    - name: Gather minimal facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - distribution
          - env
          - user  # container-provision.yml's become expressions read ansible_facts['user_id']
      tags: [always]

  tasks:
    - name: Provision dev container
      ansible.builtin.include_tasks:
        file: "{{ common_project_root }}/roles/distrobox/tasks/container-provision.yml"
