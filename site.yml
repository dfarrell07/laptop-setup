---
# Play 1 — Host system (become: true)
# Runs repos_dnf and system roles that need play-level privilege escalation.
- name: System setup (requires sudo)
  hosts: localhost
  become: true
  gather_facts: false
  tags: [become]

  pre_tasks:
    - name: Gather facts (explicit become:false so check mode works without sudo)
      ansible.builtin.gather_facts:
      become: false
      tags: [always]

    - name: Capture real user identity
      ansible.builtin.set_fact:
        real_user_home: "{{ lookup('env', 'HOME') }}"
        real_user_id: "{{ lookup('env', 'USER') }}"
      become: false
      tags: [always]

    - name: Set project root for include paths
      ansible.builtin.set_fact:
        common_project_root: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
             | default(playbook_dir, true) }}
      become: false
      tags: [always]

    - name: Run pre-flight checks
      become: false
      tags: [always]
      block:
        - name: Include pre-flight checks
          ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/pre_flight_checks.yml"

    - name: Run CSB detection (makes csb_detected available to system role tasks)
      become: false
      when: ansible_facts['system'] | default('Linux') == 'Linux'
      tags: [always]
      block:
        - name: Include CSB detection
          ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb_detect.yml"

  roles:
    - role: repos_dnf
      tags: [repos_dnf]
      when: ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']

    - role: system
      tags: [system]
      when: ansible_facts['system'] | default('Linux') == 'Linux'

  post_tasks:
    # NetworkManager restart and systemd-resolved restart handlers fire here (end of Play 1).
    # Wait for DNS connectivity before Play 2 begins — Play 2 needs DNS for git clones,
    # binary downloads, and SSH host key fetches.
    - name: Wait for DNS resolution after NetworkManager and systemd-resolved restart
      ansible.builtin.command:
        cmd: getent hosts github.com
      become: false
      changed_when: false
      failed_when: false
      retries: 6
      delay: 5
      register: system_dns_liveness
      until: system_dns_liveness.rc == 0
      when:
        - ansible_facts['system'] | default('Linux') == 'Linux'
        - ansible_facts['virtualization_type'] | default('') not in ['container', 'docker', 'podman']
      tags: [system]

    - name: Warn if DNS is not resolving after NetworkManager restart
      ansible.builtin.debug:
        msg: >-
          WARNING: DNS resolution for github.com failed after NetworkManager/systemd-resolved
          restart. Play 2 (git clones, binary downloads) may fail. Check NM and resolved status:
          systemctl status NetworkManager systemd-resolved; resolvectl status
      become: false
      when:
        - ansible_facts['system'] | default('Linux') == 'Linux'
        - system_dns_liveness is defined
        - system_dns_liveness.rc | default(1) != 0
      tags: [system]

# Play 2 — Host user (no play-level become)
# Individual tasks escalate with become: true + tags: [become] as needed.
- name: User setup
  hosts: localhost
  become: false
  gather_facts: true

  pre_tasks:
    - name: Set project root for include paths
      ansible.builtin.set_fact:
        common_project_root: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
             | default(playbook_dir, true) }}
      tags: [always]

    - name: Run pre-flight checks
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/pre_flight_checks.yml"
      tags: [always]

    - name: Vault healthcheck — assert required SSH key variables are defined and non-empty
      ansible.builtin.assert:
        that:
          - vault_ssh_auth_key is defined and vault_ssh_auth_key | length > 0
          - vault_ssh_auth_key_pub is defined and vault_ssh_auth_key_pub | length > 0
          - vault_ssh_signing_key is defined and vault_ssh_signing_key | length > 0
          - vault_ssh_signing_key_pub is defined and vault_ssh_signing_key_pub | length > 0
        fail_msg: >-
          vault.yml has some SSH key variables defined but one or more required
          variables are missing or empty. Check for key name typos in
          vault.yml — expected: vault_ssh_auth_key, vault_ssh_auth_key_pub,
          vault_ssh_signing_key, vault_ssh_signing_key_pub.
          Run: ansible-vault view group_vars/all/vault.yml | grep vault_ssh
      when: >-
        vault_ssh_auth_key is defined or
        vault_ssh_auth_key_pub is defined or
        vault_ssh_signing_key is defined or
        vault_ssh_signing_key_pub is defined
      tags: [always]

    # REQUIRED GUARD — DO NOT REMOVE: Play 1 applies SSH port change + kernel
    # hardening before Play 2, so users who skip 'make preflight' get no other
    # warning. preflight.sh alone is not sufficient. This block is protected
    # from automated modification in the audit workflow script (GITIGNORED).
    - name: Assert identity vars are not CHANGE_ME placeholder values
      ansible.builtin.assert:
        that:
          - dotfiles_user_name | default('CHANGE_ME') != 'CHANGE_ME'
          - dotfiles_github_user | default('CHANGE_ME') != 'CHANGE_ME'
          - dotfiles_user_email_work | default('CHANGE_ME') != 'CHANGE_ME'
          - dotfiles_user_email_personal | default('CHANGE_ME') != 'CHANGE_ME'
        fail_msg: >-
          Set dotfiles_user_name, dotfiles_github_user, dotfiles_user_email_work,
          and dotfiles_user_email_personal in config.yml before running make all.
          These are currently 'CHANGE_ME' placeholder values — git commits will be
          attributed to 'CHANGE_ME' and email notifications will go to wrong addresses.
      when: lookup('env', 'MOLECULE_SCENARIO_NAME') == ''
      tags: [always]

  roles:
    - role: common
      # always tag is intentional: common creates prerequisite dirs; '--skip-tags common'
      # is insufficient to suppress it — the always tag wins. Use '--skip-tags always'
      # to suppress (also affects all other always-tagged pre_tasks in this play).
      tags: [common, always]

    - role: packages
      tags: [packages]

    - role: ssh
      tags: [ssh]

    - role: dotfiles
      tags: [dotfiles]

    - role: git_repos
      tags: [repos, git_repos]

    - role: notes
      tags: [notes]

    - role: redhat
      tags: [redhat]
      when: profile == 'work' and (is_rhel or csb_detected)

    - role: containers
      tags: [containers]

    - role: desktop
      tags: [desktop]

    - role: distrobox
      tags: [distrobox]
      when: ansible_facts['system'] | default('Linux') == 'Linux' and distrobox_enabled | bool

    - role: claude
      tags: [claude]

  post_tasks:
    - name: Generate CSB compatibility report
      ansible.builtin.include_tasks: "{{ common_project_root }}/common/tasks/csb-report.yml"
      tags: [always]
      when: csb_detected

# Play 3 — Container provisioning (podman connection)
# Only runs when the distrobox role registered a container via add_host.
- name: Provision dev container
  hosts: containers
  connection: containers.podman.podman
  gather_facts: false
  tags: [distrobox]

  pre_tasks:
    - name: Set project root for include paths
      ansible.builtin.set_fact:
        common_project_root: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
             | default(playbook_dir, true) }}
      tags: [always]

    - name: Bootstrap Python inside container
      ansible.builtin.raw: |
        sudo dnf install -y python3 python3-libdnf5 2>/dev/null || \
        sudo dnf install -y python3 python3-dnf 2>/dev/null || true
      changed_when: false
      tags: [always]

    - name: Gather minimal facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - distribution
          - env
      tags: [always]

  tasks:
    - name: Provision dev container
      ansible.builtin.include_tasks:
        file: "{{ common_project_root }}/common/tasks/container-provision-tasks.yml"
