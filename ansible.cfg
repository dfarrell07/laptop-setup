[defaults]
inventory = inventory/
vault_password_file = scripts/vault-pass.sh
stdout_callback = ansible.builtin.default
callbacks_enabled = ansible.posix.timer
# Keep explicit: prevents vault-derived task args (SSH keys, tokens) from leaking into logs
display_args_to_stdout = false
# display_ok_hosts is a callback plugin option (ansible.builtin.default); ansible-config validate
# does not know about callback options in [defaults], so use the env var instead at call sites.
# ANSIBLE_DISPLAY_OK_HOSTS=false is set in Makefile for all ansible-playbook invocations.
# Suppress skipped-task lines; unlike display_ok_hosts this is a core config key so it goes here rather than as an env var
display_skipped_hosts = false
# SECURITY: explicit collections_path guard against ANSIBLE_COLLECTIONS_PATH environment injection
# NOTE: verify-ansible-args.sh exports ANSIBLE_COLLECTIONS_PATH which takes precedence over this.
# Both must specify the same verified path (./collections first) to prevent TOCTOU attacks.
# See scripts/verify-ansible-args.sh and site.yml Play 0 collection verification task.
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
# SECURITY: explicit roles_path guard; verify-ansible-args.sh also exports ANSIBLE_ROLES_PATH
# (repo ./roles first) to prevent ANSIBLE_ROLES_PATH environment injection attacks.
roles_path = ./roles
# SECURITY: pin AnsiballZ module staging dirs so TMPDIR/TEMP/TMP env injection cannot redirect
# Ansible's per-task module .py staging into an attacker-controlled dir (inotifywait race → root RCE).
# verify-ansible-args.sh also unsets TMPDIR/TEMP/TMP; both layers are needed for defense-in-depth.
local_tmp = /tmp
remote_tmp = /tmp
interpreter_python = auto_silent
# Suppress deprecation warning; playbook uses bare ansible_* fact names (ansible_user_dir, ansible_pkg_mgr, etc.)
inject_facts_as_vars = true
# SECURITY: defense-in-depth backstop against ANSIBLE_FORCE_HANDLERS env injection.
# verify-ansible-args.sh unsets ANSIBLE_FORCE_HANDLERS; this cfg pin prevents it from
# being re-introduced via other vectors (e.g. ansible.cfg in a writable parent directory).
force_handlers = false
# SECURITY: defense-in-depth backstop against ANSIBLE_CONNECTION_PLUGINS env injection.
# verify-ansible-args.sh also exports ANSIBLE_CONNECTION_PLUGINS="" (empty string);
# both layers needed — env var wins at runtime, cfg pin blocks re-introduction via
# writable parent-directory ansible.cfg shadowing.
connection_plugins =
gathering = smart
pipelining = true

[diff]
always = true

[privilege_escalation]
become_exe = /usr/bin/sudo
